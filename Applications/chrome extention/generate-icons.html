<!DOCTYPE html>
<html>
<head><title>Generate Extension Icons</title></head>
<body>
<h2>Right-click each canvas and "Save image as" to chrome-extension/icons/</h2>
<p>Save as: icon16.png, icon48.png, icon128.png</p>
<canvas id="c16" width="16" height="16"></canvas>
<canvas id="c48" width="48" height="48"></canvas>
<canvas id="c128" width="128" height="128"></canvas>
<script>
function drawIcon(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;
  ctx.fillStyle = '#2563eb';
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, s * 0.15);
  ctx.fill();
  ctx.fillStyle = 'white';
  ctx.font = `bold ${s * 0.5}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('JT', s/2, s/2);
}
drawIcon(document.getElementById('c16'));
drawIcon(document.getElementById('c48'));
drawIcon(document.getElementById('c128'));
</script>
</body>
</html>
