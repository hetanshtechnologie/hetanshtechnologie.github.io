<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/png" sizes="32x32" href="../../images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../../images/favicon-16.png">
<link rel="apple-touch-icon" href="../../images/apple-touch-icon.png"><title>Generate Extension Icons</title></head>
<body>
<a href="../../" class="ht-brand-badge" style="position:fixed;left:12px;bottom:12px;z-index:2147483000;display:inline-flex;align-items:center;gap:7px;text-decoration:none;background:rgba(255,255,255,.92);color:#1e293b;padding:6px 10px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.18);font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;line-height:1;"><img src="../../images/logo.png" alt="Hetansh Technologie" style="width:22px;height:22px;border-radius:6px;object-fit:contain;display:block;"><span>Hetansh Technologie</span></a>
<h2>Right-click each canvas and "Save image as" to chrome-extension/icons/</h2>
<p>Save as: icon16.png, icon48.png, icon128.png</p>
<canvas id="c16" width="16" height="16"></canvas>
<canvas id="c48" width="48" height="48"></canvas>
<canvas id="c128" width="128" height="128"></canvas>
<script>
function drawIcon(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;
  ctx.fillStyle = '#2563eb';
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, s * 0.15);
  ctx.fill();
  ctx.fillStyle = 'white';
  ctx.font = `bold ${s * 0.5}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('JT', s/2, s/2);
}
drawIcon(document.getElementById('c16'));
drawIcon(document.getElementById('c48'));
drawIcon(document.getElementById('c128'));
</script>
</body>
</html>
