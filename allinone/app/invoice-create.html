<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Document — All-in-One ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;background:#f1f5f9;}.line-row td{padding:6px 8px;vertical-align:middle;}</style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body>
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <a href="invoices.html" class="text-blue-600 font-bold text-lg">&larr; Documents</a>
      <span class="text-gray-400">|</span>
      <span id="page-title" class="font-semibold">New Invoice</span>
    </div>
    <button onclick="signOut()" class="text-sm text-red-500 hover:underline">Logout</button>
  </nav>
  <div class="max-w-6xl mx-auto p-6">
    <div id="alert"></div>
    <form id="invoice-form" class="bg-white rounded-xl shadow-sm border p-6">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div>
          <label class="block text-sm font-semibold mb-1">Document Type</label>
          <select id="doc_type" class="w-full border rounded-lg px-3 py-2 text-sm" onchange="onDocTypeChange()">
            <option value="invoice">Invoice</option>
            <option value="quotation">Quotation</option>
            <option value="order">Order</option>
            <option value="challan">Delivery Challan</option>
            <option value="proforma">Proforma Invoice</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Customer</label>
          <select id="customer_id" class="w-full border rounded-lg px-3 py-2 text-sm" required></select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Date</label>
          <input type="date" id="invoice_date" class="w-full border rounded-lg px-3 py-2 text-sm" required>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Due Date</label>
          <input type="date" id="due_date" class="w-full border rounded-lg px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Valid Until</label>
          <input type="date" id="valid_until" class="w-full border rounded-lg px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Place of Supply</label>
          <input type="text" id="place_of_supply" class="w-full border rounded-lg px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Tax Type</label>
          <select id="invoice_type" class="w-full border rounded-lg px-3 py-2 text-sm">
            <option value="regular">Regular</option><option value="export">Export</option>
            <option value="debit_note">Debit Note</option><option value="credit_note">Credit Note</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Ref Number</label>
          <input type="text" id="ref_number" class="w-full border rounded-lg px-3 py-2 text-sm">
        </div>
      </div>

      <h3 class="font-bold text-lg mb-3">Line Items</h3>
      <table class="w-full text-sm mb-4" id="items-table">
        <thead><tr class="bg-gray-50 border-b text-left"><th class="p-2 font-semibold">Product</th><th class="p-2 font-semibold">Qty</th><th class="p-2 font-semibold">Rate</th><th class="p-2 font-semibold">Disc%</th><th class="p-2 font-semibold">Taxable</th><th class="p-2 font-semibold">GST%</th><th class="p-2 font-semibold">Total</th><th class="p-2"></th></tr></thead>
        <tbody id="items-body"></tbody>
      </table>
      <button type="button" onclick="addLine()" class="bg-gray-100 text-gray-700 px-3 py-1.5 rounded text-sm hover:bg-gray-200 mb-4">+ Add Line</button>

      <div class="grid grid-cols-2 gap-6 mb-6">
        <div>
          <label class="block text-sm font-semibold mb-1">Discount (%)</label>
          <input type="number" id="discount_pct" class="w-full border rounded-lg px-3 py-2 text-sm" step="0.01" value="0" onchange="recalcTotals()">
        </div>
        <div class="border-t pt-4 text-right space-y-1">
          <div class="text-sm text-gray-500">Subtotal: <span id="subtotal">₹0.00</span></div>
          <div class="text-sm text-gray-500">Discount: <span id="discount_amt">₹0.00</span></div>
          <div class="text-sm text-gray-500">CGST: <span id="cgst_total">₹0.00</span></div>
          <div class="text-sm text-gray-500">SGST: <span id="sgst_total">₹0.00</span></div>
          <div class="text-sm text-gray-500">IGST: <span id="igst_total">₹0.00</span></div>
          <div class="text-lg font-bold">Total: <span id="grand_total">₹0.00</span></div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4 mb-6 border-t pt-4">
        <div>
          <label class="block text-sm font-semibold mb-1">TDS Rate (%)</label>
          <input type="number" id="tds_rate" class="w-full border rounded px-3 py-2 text-sm" step="0.01" value="0" onchange="recalcTotals()">
        </div>
        <div class="text-right text-sm font-medium">TDS Amount: <span id="tds_amt">₹0.00</span></div>
        <div>
          <label class="block text-sm font-semibold mb-1">TCS Rate (%)</label>
          <input type="number" id="tcs_rate" class="w-full border rounded px-3 py-2 text-sm" step="0.01" value="0" onchange="recalcTotals()">
        </div>
        <div class="text-right text-sm font-medium">TCS Amount: <span id="tcs_amt">₹0.00</span></div>
      </div>

      <div class="grid grid-cols-2 gap-4 mb-6">
        <div>
          <label class="block text-sm font-semibold mb-1">Notes</label>
          <textarea id="notes" class="w-full border rounded px-3 py-2 text-sm" rows="2"></textarea>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Terms & Conditions</label>
          <textarea id="terms_conditions" class="w-full border rounded px-3 py-2 text-sm" rows="2"></textarea>
        </div>
      </div>

      <div class="flex gap-3">
        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">Save Document</button>
        <button type="button" onclick="saveAndSend()" class="bg-green-600 text-white px-6 py-2 rounded-lg text-sm font-semibold hover:bg-green-700">Save &amp; Send</button>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/erp.js"></script>
  <script>
    let editId = null, lineCounter = 0, products = [];

    const DOC_PREFIXES = { quotation:'QTN', order:'ORD', challan:'CHL', proforma:'PRF', invoice:'INV' };
    const DOC_LABELS = { quotation:'Quotation', order:'Order', challan:'Delivery Challan', proforma:'Proforma Invoice', invoice:'Invoice' };

    document.addEventListener('DOMContentLoaded', async function() {
      const user = await requireLogin(); if (!user) return;
      const orgId = await getOrgId(); if (!orgId) return;
      const params = new URLSearchParams(window.location.search);
      editId = params.get('id');
      if (editId) document.getElementById('page-title').textContent = 'Edit Document';
      const savedType = localStorage.getItem('newDocType');
      if (savedType && !editId) { document.getElementById('doc_type').value = savedType; localStorage.removeItem('newDocType'); onDocTypeChange(); }

      document.getElementById('invoice_date').value = new Date().toISOString().split('T')[0];
      document.getElementById('place_of_supply').value = 'Maharashtra';

      const { data: cust } = await erp.from('parties').select('id, name, gstin, address').eq('org_id', orgId).eq('is_active', true).in('type',['customer','both']).order('name');
      const sel = document.getElementById('customer_id');
      (cust || []).forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = `${c.name}${c.gstin ? ' ('+c.gstin+')' : ''}`; o.dataset.gstin = c.gstin||''; o.dataset.city = c.address?.city||''; sel.appendChild(o); });

      const { data: pr } = await erp.from('products').select('id,name,hsn_code,gst_rate,selling_price,unit').eq('org_id',orgId).eq('is_active',true).order('name');
      products = pr || [];

      if (editId) await loadDocument(editId);
      addLine();
    });

    function onDocTypeChange() {
      const dt = document.getElementById('doc_type').value;
      document.getElementById('page-title').textContent = 'New ' + DOC_LABELS[dt] || 'Document';
    }

    function addLine(data) {
      lineCounter++;
      const tbody = document.getElementById('items-body');
      const tr = document.createElement('tr'); tr.className = 'border-b line-row'; tr.id = 'line-'+lineCounter;
      const prodOpts = products.map(p => `<option value="${p.id}" data-hsn="${p.hsn_code||''}" data-gst="${p.gst_rate||0}" data-rate="${p.selling_price||0}" data-unit="${p.unit||'nos'}" ${data&&data.product_id==p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('');
      tr.innerHTML = `
        <td><select class="w-48 border rounded px-2 py-1 text-xs" onchange="onProductChange(${lineCounter})"><option value="">-- Select --</option>${prodOpts}</select></td>
        <td><input type="number" class="w-16 border rounded px-2 py-1 text-xs" value="${data?data.quantity:1}" min="0.001" step="0.001" onchange="recalcLine(${lineCounter})"></td>
        <td><input type="number" class="w-24 border rounded px-2 py-1 text-xs rate" value="${data?data.rate:0}" step="0.01" onchange="recalcLine(${lineCounter})"></td>
        <td><input type="number" class="w-16 border rounded px-2 py-1 text-xs disc" value="${data?data.discount_pct:0}" step="0.01" onchange="recalcLine(${lineCounter})"></td>
        <td class="taxable text-xs font-medium">0.00</td>
        <td class="gst text-xs">0%</td>
        <td class="total text-xs font-medium">0.00</td>
        <td><button type="button" onclick="removeLine(${lineCounter})" class="text-red-500 text-xs">X</button></td>`;
      tbody.appendChild(tr);
      if (data) recalcLine(lineCounter);
    }

    function onProductChange(id) {
      const tr = document.getElementById('line-'+id);
      const sel = tr.querySelector('select');
      const opt = sel.options[sel.selectedIndex];
      if (opt.value) {
        tr.querySelector('.rate').value = parseFloat(opt.dataset.rate)||0;
        tr.querySelector('.gst').textContent = opt.dataset.gst+'%';
      } else {
        tr.querySelector('.rate').value = 0;
        tr.querySelector('.gst').textContent = '0%';
      }
      recalcLine(id);
    }

    function recalcLine(id) {
      const tr = document.getElementById('line-'+id); if (!tr) return;
      const qty = parseFloat(tr.querySelector('input[type="number"]').value)||0;
      const rate = parseFloat(tr.querySelector('.rate').value)||0;
      const discPct = parseFloat(tr.querySelector('.disc').value)||0;
      const total = qty * rate;
      const discAmt = total * discPct / 100;
      const taxable = total - discAmt;
      tr.querySelector('.taxable').textContent = taxable.toFixed(2);
      tr.querySelector('.total').textContent = taxable.toFixed(2);
      recalcTotals();
    }

    function removeLine(id) {
      const tr = document.getElementById('line-'+id);
      if (tr) { tr.remove(); recalcTotals(); }
    }

    function recalcTotals() {
      const lines = document.querySelectorAll('#items-body tr');
      let subtotal = 0, cgst = 0, sgst = 0;
      lines.forEach(tr => {
        const taxable = parseFloat(tr.querySelector('.taxable')?.textContent)||0;
        const gstText = tr.querySelector('.gst')?.textContent||'0%';
        const gstRate = parseFloat(gstText)||0;
        subtotal += taxable;
        cgst += taxable * gstRate / 200;
        sgst += taxable * gstRate / 200;
      });
      const discPct = parseFloat(document.getElementById('discount_pct').value)||0;
      const discAmt = subtotal * discPct / 100;
      const taxableAmt = subtotal - discAmt;
      cgst = cgst * (1 - discPct/100);
      sgst = sgst * (1 - discPct/100);
      const total = taxableAmt + cgst + sgst;

      const tdsRate = parseFloat(document.getElementById('tds_rate').value)||0;
      const tcsRate = parseFloat(document.getElementById('tcs_rate').value)||0;
      const tdsAmt = taxableAmt * tdsRate / 100;
      const tcsAmt = taxableAmt * tcsRate / 100;

      document.getElementById('subtotal').textContent = '₹' + subtotal.toFixed(2);
      document.getElementById('discount_amt').textContent = '₹' + discAmt.toFixed(2);
      document.getElementById('cgst_total').textContent = '₹' + cgst.toFixed(2);
      document.getElementById('sgst_total').textContent = '₹' + sgst.toFixed(2);
      document.getElementById('igst_total').textContent = '₹0.00';
      document.getElementById('grand_total').textContent = '₹' + total.toFixed(2);
      document.getElementById('tds_amt').textContent = '₹' + tdsAmt.toFixed(2);
      document.getElementById('tcs_amt').textContent = '₹' + tcsAmt.toFixed(2);
    }

    async function loadDocument(id) {
      const { data: inv } = await erp.from('invoices').select('*').eq('id',id).single();
      if (!inv) return;
      document.getElementById('doc_type').value = inv.doc_type || 'invoice';
      document.getElementById('customer_id').value = inv.customer_id||'';
      document.getElementById('invoice_date').value = inv.invoice_date?.split('T')[0]||'';
      document.getElementById('due_date').value = inv.due_date?.split('T')[0]||'';
      document.getElementById('valid_until').value = inv.valid_until?.split('T')[0]||'';
      document.getElementById('place_of_supply').value = inv.place_of_supply||'';
      document.getElementById('invoice_type').value = inv.invoice_type||'regular';
      document.getElementById('ref_number').value = inv.ref_number||'';
      document.getElementById('discount_pct').value = inv.discount_pct||0;
      document.getElementById('tds_rate').value = inv.tds_rate||0;
      document.getElementById('tcs_rate').value = inv.tcs_rate||0;
      document.getElementById('notes').value = inv.notes||'';
      document.getElementById('terms_conditions').value = inv.terms_conditions||'';
      onDocTypeChange();

      const { data: lines } = await erp.from('invoice_lines').select('*').eq('invoice_id',id).order('id');
      document.getElementById('items-body').innerHTML = '';
      (lines||[]).forEach(l => addLine(l));
      if (!lines||!lines.length) addLine();
    }

    document.getElementById('invoice-form').addEventListener('submit', async function(e) {
      e.preventDefault(); await saveDocument(false);
    });

    async function saveAndSend() { await saveDocument(true); }

    async function saveDocument(markSent) {
      const btn = document.querySelector('button[type="submit"]');
      btn.disabled = true; btn.textContent = 'Saving...';
      try {
        const orgId = await getOrgId();
        const { data: { user } } = await erp.auth.getUser();

        const lineItems = [];
        document.querySelectorAll('#items-body tr').forEach(tr => {
          const sel = tr.querySelector('select');
          if (!sel||!sel.value) return;
          const opt = sel.options[sel.selectedIndex];
          const qty = parseFloat(tr.querySelector('input[type="number"]').value)||0;
          const rate = parseFloat(tr.querySelector('.rate').value)||0;
          const discPct = parseFloat(tr.querySelector('.disc').value)||0;
          const total = qty * rate;
          const discAmt = total * discPct / 100;
          const taxable = total - discAmt;
          const gstRate = parseFloat(opt.dataset.gst)||0;
          lineItems.push({
            product_id: parseInt(sel.value), description: opt.textContent,
            quantity: qty, unit: opt.dataset.unit||'nos', rate, discount_pct: discPct,
            taxable_amt: taxable, gst_rate: gstRate,
            cgst_amt: taxable * gstRate / 200, sgst_amt: taxable * gstRate / 200,
            igst_amt: 0, total: taxable
          });
        });
        if (!lineItems.length) throw new Error('Add at least one product line.');

        const discPct = parseFloat(document.getElementById('discount_pct').value)||0;
        const subtotal = lineItems.reduce((s,l) => s + l.total, 0);
        const discAmt = subtotal * discPct / 100;
        const taxableAmt = subtotal - discAmt;
        const cgst = lineItems.reduce((s,l) => s + l.cgst_amt, 0) * (1 - discPct/100);
        const sgst = lineItems.reduce((s,l) => s + l.sgst_amt, 0) * (1 - discPct/100);
        const total = taxableAmt + cgst + sgst;
        const tdsRate = parseFloat(document.getElementById('tds_rate').value)||0;
        const tcsRate = parseFloat(document.getElementById('tcs_rate').value)||0;
        const docType = document.getElementById('doc_type').value;

        let status = markSent ? 'sent' : 'draft';
        const invoiceData = {
          org_id: orgId, doc_type: docType,
          invoice_no: editId ? undefined : await getNextDocNo(orgId, docType),
          invoice_date: document.getElementById('invoice_date').value,
          due_date: document.getElementById('due_date').value||null,
          valid_until: document.getElementById('valid_until').value||null,
          customer_id: parseInt(document.getElementById('customer_id').value),
          place_of_supply: document.getElementById('place_of_supply').value,
          invoice_type: document.getElementById('invoice_type').value,
          ref_number: document.getElementById('ref_number').value||null,
          discount_pct: discPct, discount_amt: discAmt,
          subtotal, taxable_amt: taxableAmt,
          cgst_amt: cgst, sgst_amt: sgst, igst_amt: 0, total,
          tds_rate: tdsRate, tds_amt: taxableAmt * tdsRate / 100,
          tcs_rate: tcsRate, tcs_amt: taxableAmt * tcsRate / 100,
          notes: document.getElementById('notes').value||null,
          terms_conditions: document.getElementById('terms_conditions').value||null,
          status, created_by: user.id
        };

        if (editId) {
          const { error } = await erp.from('invoices').update(invoiceData).eq('id', parseInt(editId));
          if (error) throw error;
          await erp.from('invoice_lines').delete().eq('invoice_id', parseInt(editId));
          const { error: liErr } = await erp.from('invoice_lines').insert(lineItems.map(l => ({...l, invoice_id: parseInt(editId)})));
          if (liErr) throw liErr;
        } else {
          const { data: inv, error } = await erp.from('invoices').insert(invoiceData).select().single();
          if (error) throw error;
          const { error: liErr } = await erp.from('invoice_lines').insert(lineItems.map(l => ({...l, invoice_id: inv.id})));
          if (liErr) throw liErr;
        }

        showAlert(editId ? 'Document updated!' : 'Document created!', 'success');
        setTimeout(() => { window.location.href = 'invoices.html'; }, 1000);
      } catch (err) { showAlert(err.message, 'error'); }
      btn.disabled = false; btn.textContent = 'Save Document';
    }

    async function getNextDocNo(orgId, docType) {
      const { data: series } = await erp.from('voucher_series').select('*').eq('org_id', orgId).eq('doc_type', docType).maybeSingle();
      const prefix = (series?.prefix || DOC_PREFIXES[docType] || 'INV');
      const pad = series?.pad_length || 5;
      const { data: last } = await erp.from('invoices').select('invoice_no').eq('org_id', orgId).ilike('invoice_no', prefix + '-%').order('id', { ascending: false }).limit(1);
      const lastNum = last?.length ? parseInt((last[0].invoice_no||'').split('-')[1])||0 : 0;
      return prefix + '-' + String(lastNum + 1).padStart(pad, '0');
    }
  </script>
<script src="../../js/analytics-tracker.js" defer></script>
</body>
</html>
