<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Log — All-in-One ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;background:#f1f5f9;}td{padding:6px 10px;}</style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body>
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <a href="dashboard.html" class="text-blue-600 font-bold text-lg">&larr; Dashboard</a>
      <span class="text-gray-400">|</span>
      <span class="font-semibold">Activity Log</span>
    </div>
    <button onclick="signOut()" class="text-sm text-red-500 hover:underline">Logout</button>
  </nav>
  <div class="max-w-7xl mx-auto p-6">
    <div class="bg-white rounded-xl shadow-sm border p-6">
      <div class="flex flex-wrap gap-3 mb-4 items-center">
        <h2 class="text-lg font-bold mr-2">Activity Log</h2>
        <select id="filter-action" class="border rounded px-2 py-1 text-sm" onchange="loadLog()">
          <option value="">All Actions</option>
          <option value="INSERT">INSERT</option><option value="UPDATE">UPDATE</option><option value="DELETE">DELETE</option>
        </select>
        <select id="filter-table" class="border rounded px-2 py-1 text-sm" onchange="loadLog()">
          <option value="">All Tables</option>
        </select>
        <input type="date" id="filter-from" class="border rounded px-2 py-1 text-sm">
        <input type="date" id="filter-to" class="border rounded px-2 py-1 text-sm">
        <button onclick="loadLog()" class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm hover:bg-blue-700">Filter</button>
        <button onclick="exportLog()" class="bg-green-600 text-white px-3 py-1.5 rounded text-sm hover:bg-green-700">Export CSV</button>
        <span id="log-count" class="text-xs text-gray-500 ml-auto"></span>
      </div>
      <div id="loading" class="text-center text-gray-500 py-8">Loading...</div>
      <div id="log-content" class="hidden overflow-x-auto"></div>
      <div id="pagination" class="flex justify-center gap-2 mt-4"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/erp.js"></script>
  <script>
    let orgId, page = 0, pageSize = 50, totalCount = 0, currentData = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await requireLogin(); if(!user) return;
      orgId = await getOrgId(); if(!orgId) return;
      const { data: tables } = await erp.from('audit_log').select('table_name').eq('org_id', orgId).not('table_name','is',null).limit(1000);
      if(tables && tables.length) {
        const unique = [...new Set(tables.map(t => t.table_name).filter(Boolean))];
        const sel = document.getElementById('filter-table');
        unique.forEach(t => { const o = document.createElement('option'); o.value=t; o.textContent=t; sel.appendChild(o); });
      }
      const d = new Date();
      document.getElementById('filter-to').value = d.toISOString().split('T')[0];
      d.setMonth(d.getMonth()-1);
      document.getElementById('filter-from').value = d.toISOString().split('T')[0];
      loadLog();
    });

    async function loadLog() {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('log-content').classList.add('hidden');
      let q = erp.from('audit_log').select('*, users:user_id(email)', { count: 'exact' }).eq('org_id', orgId).order('created_at', { ascending: false });
      const action = document.getElementById('filter-action').value;
      const table = document.getElementById('filter-table').value;
      const from = document.getElementById('filter-from').value;
      const to = document.getElementById('filter-to').value;
      if(action) q = q.eq('action', action);
      if(table) q = q.eq('table_name', table);
      if(from) q = q.gte('created_at', from);
      if(to) q = q.lte('created_at', to + 'T23:59:59Z');
      q = q.range(page * pageSize, (page + 1) * pageSize - 1);
      const { data, count, error } = await q;
      if(error) { document.getElementById('loading').textContent = 'Error: ' + error.message; return; }
      currentData = data || [];
      totalCount = count || 0;
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('log-content').classList.remove('hidden');
      document.getElementById('log-count').textContent = `${totalCount} entries`;
      renderLog();
      renderPagination();
    }

    function renderLog() {
      let rows = currentData.map(e => {
        const oldV = e.old_data ? Object.keys(e.old_data).slice(0,3).map(k => `${k}:${e.old_data[k]}`).join(', ') + (Object.keys(e.old_data).length>3 ? '...' : '') : '';
        const newV = e.new_data ? Object.keys(e.new_data).slice(0,3).map(k => `${k}:${e.new_data[k]}`).join(', ') + (Object.keys(e.new_data).length>3 ? '...' : '') : '';
        const userEmail = e.users ? e.users.email : '';
        return `<tr class="border-b text-xs">
          <td><span class="px-2 py-0.5 rounded font-medium ${e.action==='INSERT'?'bg-green-100 text-green-700':e.action==='UPDATE'?'bg-blue-100 text-blue-700':'bg-red-100 text-red-700'}">${e.action}</span></td>
          <td>${escapeHtml(e.table_name||'')}</td>
          <td>${e.record_id||''}</td>
          <td class="max-w-xs truncate" title="${escapeHtml(newV)}">${escapeHtml(newV)}</td>
          <td class="max-w-xs truncate" title="${escapeHtml(oldV)}">${escapeHtml(oldV)}</td>
          <td>${escapeHtml(userEmail)}</td>
          <td class="text-gray-400">${formatDateTime(e.created_at)}</td>
        </tr>`;
      }).join('');
      document.getElementById('log-content').innerHTML = `<table class="w-full text-xs"><thead><tr class="bg-gray-50 border-b"><th class="text-left p-2 font-semibold">Action</th><th class="text-left p-2 font-semibold">Table</th><th class="text-left p-2 font-semibold">ID</th><th class="text-left p-2 font-semibold">New Data</th><th class="text-left p-2 font-semibold">Old Data</th><th class="text-left p-2 font-semibold">User</th><th class="text-left p-2 font-semibold">Time</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="text-center text-gray-400 py-4">No entries found</td></tr>'}</tbody></table>`;
    }

    function renderPagination() {
      const totalPages = Math.ceil(totalCount / pageSize);
      let html = '';
      if(page > 0) html += `<button onclick="goPage(${page-1})" class="px-3 py-1 rounded border text-sm hover:bg-gray-100">&laquo; Prev</button>`;
      html += `<span class="px-3 py-1 text-sm text-gray-500">Page ${page+1} of ${totalPages||1}</span>`;
      if(page < totalPages-1) html += `<button onclick="goPage(${page+1})" class="px-3 py-1 rounded border text-sm hover:bg-gray-100">Next &raquo;</button>`;
      document.getElementById('pagination').innerHTML = html;
    }

    function goPage(p) { page = p; loadLog(); }

    function exportLog() {
      if(!currentData.length) return;
      let csv = 'Action,Table,Record ID,New Data,Old Data,User,Time\n';
      currentData.forEach(e => {
        csv += `"${e.action}","${e.table_name||''}","${e.record_id||''}","${JSON.stringify(e.new_data||{}).replace(/"/g,'""')}","${JSON.stringify(e.old_data||{}).replace(/"/g,'""')}","${e.users?e.users.email:''}","${e.created_at}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `audit_log_${new Date().toISOString().split('T')[0]}.csv`;
      a.click(); URL.revokeObjectURL(a.href);
    }
  </script>
<script src="../../js/analytics-tracker.js" defer></script>
</body>
</html>
