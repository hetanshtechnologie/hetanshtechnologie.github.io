<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Login — All-in-One ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
  </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body class="min-h-screen flex items-center justify-center">
  <a href="../../index.html" class="fixed top-4 left-4 text-gray-500 hover:text-blue-600 text-sm font-medium">← Home</a>
  <div class="bg-white rounded-xl shadow-sm border p-8 w-full max-w-md mx-4">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold">All-in-One ERP</h1>
      <p class="text-gray-500 text-sm mt-1">Sign in to your account</p>
    </div>
    <div id="alert"></div>
    <form id="login-form">
      <div class="mb-4">
        <label class="block text-sm font-semibold mb-1">Email</label>
        <input type="email" id="email" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" required>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-semibold mb-1">Password</label>
        <input type="password" id="password" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" required>
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700">Sign In</button>
    </form>
    <div class="mt-4 text-center text-sm text-gray-500">
      Don't have an account? <a href="register.html" class="text-blue-600 hover:underline">Register</a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/erp.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const { data: { user } } = await erp.auth.getUser();
      if (user) { window.location.href = 'dashboard.html'; return; }
    });

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = this.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      try {
        const { error } = await erp.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = 'dashboard.html';
      } catch (err) {
        showAlert(err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
<script src="../../js/analytics-tracker.js" defer></script>
</body>
</html>
