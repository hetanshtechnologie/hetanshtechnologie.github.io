<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Variants — All-in-One ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;background:#f1f5f9;}</style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body>
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <a href="products.html" class="text-blue-600 font-bold text-lg">&larr; Products</a>
      <span class="text-gray-400">|</span>
      <span class="font-semibold">Product Variants</span>
    </div>
    <div>
      <button onclick="signOut()" class="text-sm text-red-500 hover:underline">Logout</button>
    </div>
  </nav>
  <div class="max-w-6xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-bold" id="page-title">Product Variants</h1>
        <p class="text-sm text-gray-500 mt-1" id="product-info"></p>
      </div>
      <button onclick="showAddForm()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">+ Add Variant</button>
    </div>
    <div id="alert"></div>
    <div id="loading" class="text-gray-500 mb-4">Loading...</div>

    <div id="form-section" class="hidden bg-white rounded-xl shadow-sm border p-6 mb-6">
      <h2 id="form-title" class="font-bold text-lg mb-4">Add Variant</h2>
      <form id="variant-form" class="grid grid-cols-2 gap-4">
        <input type="hidden" id="edit-id">
        <div class="col-span-2"><label class="block text-sm font-semibold mb-1">Variant Name *</label><input type="text" id="vname" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="e.g. Express, Blue, Saffron" required></div>
        <div><label class="block text-sm font-semibold mb-1">SKU Suffix</label><input type="text" id="vsku" class="w-full border rounded-lg px-3 py-2 text-sm font-mono" placeholder="e.g. -EXP"></div>
        <div><label class="block text-sm font-semibold mb-1">MRP (₹)</label><input type="number" id="vmrp" class="w-full border rounded-lg px-3 py-2 text-sm" step="0.01"></div>
        <div><label class="block text-sm font-semibold mb-1">Selling Price (₹) *</label><input type="number" id="vsp" class="w-full border rounded-lg px-3 py-2 text-sm" step="0.01" required></div>
        <div><label class="block text-sm font-semibold mb-1">Sort Order</label><input type="number" id="vsort" class="w-full border rounded-lg px-3 py-2 text-sm" value="0"></div>
        <div class="col-span-2"><label class="block text-sm font-semibold mb-1">Description</label><textarea id="vdesc" class="w-full border rounded-lg px-3 py-2 text-sm" rows="2" placeholder="Brief description of this variant"></textarea></div>
        <div class="col-span-2"><label class="block text-sm font-semibold mb-1">Features (one per line)</label><textarea id="vfeatures" class="w-full border rounded-lg px-3 py-2 text-sm font-mono" rows="4" placeholder="Enter each feature on a new line"></textarea></div>
        <div class="col-span-2 flex gap-2">
          <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">Save Variant</button>
          <button type="button" onclick="hideForm()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm hover:bg-gray-300">Cancel</button>
        </div>
      </form>
    </div>

    <div id="variants-section" class="hidden bg-white rounded-xl shadow-sm border"></div>

    <div class="mt-6">
      <a href="products.html" class="text-sm text-blue-600 hover:underline">&larr; Back to Products</a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/erp.js"></script>
  <script>
    let productId = null;
    let productName = '';

    document.addEventListener('DOMContentLoaded', async function() {
      const user = await requireLogin();
      if (!user) return;
      const params = new URLSearchParams(window.location.search);
      productId = params.get('product_id');
      if (!productId) { showAlert('No product specified.', 'error'); return; }
      const { data: prod } = await erp.from('products').select('name').eq('id', productId).maybeSingle();
      if (prod) { productName = prod.name; document.getElementById('product-info').textContent = 'Product: ' + prod.name; }
      document.getElementById('page-title').textContent = 'Variants — ' + (prod ? prod.name : 'Product');
      document.getElementById('loading').textContent = 'Loading variants...';
      await loadVariants();

      document.getElementById('variant-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const data = {
          product_id: Number(productId),
          name: document.getElementById('vname').value.trim(),
          sku_suffix: document.getElementById('vsku').value.trim() || null,
          mrp: parseFloat(document.getElementById('vmrp').value) || null,
          selling_price: parseFloat(document.getElementById('vsp').value) || 0,
          sort_order: parseInt(document.getElementById('vsort').value) || 0,
          description: document.getElementById('vdesc').value.trim() || null,
          features: document.getElementById('vfeatures').value.trim() ? document.getElementById('vfeatures').value.split('\n').map(s => s.trim()).filter(Boolean) : []
        };
        try {
          const orgId = await getOrgId();
          const editId = document.getElementById('edit-id').value;
          if (editId) {
            const { error } = await erp.from('product_variants').update(data).eq('id', editId);
            if (error) throw error;
            showAlert('Variant updated!', 'success');
          } else {
            const { error } = await erp.from('product_variants').insert({ ...data, org_id: orgId });
            if (error) throw error;
            showAlert('Variant created!', 'success');
          }
          hideForm(); await loadVariants();
        } catch (err) { showAlert(err.message, 'error'); }
      });
    });

    async function loadVariants() {
      const { data, error } = await erp.from('product_variants').select('*').eq('product_id', productId).eq('is_active', true).order('sort_order').order('name');
      if (error) throw error;
      document.getElementById('loading').classList.add('hidden');
      const div = document.getElementById('variants-section'); div.classList.remove('hidden');
      if (!data || !data.length) { div.innerHTML = '<div class="p-6 text-gray-500 text-center">No variants yet. Click "+ Add Variant" to create one.</div>'; return; }
      div.innerHTML = `<table class="w-full text-sm"><thead><tr class="bg-gray-50 border-b text-left"><th class="p-3 font-semibold">#</th><th class="p-3 font-semibold">Name</th><th class="p-3 font-semibold">SKU</th><th class="p-3 font-semibold">MRP</th><th class="p-3 font-semibold">Selling</th><th class="p-3 font-semibold">Features</th><th class="p-3 font-semibold">Actions</th></tr></thead><tbody>${data.map((v, i) => `<tr class="border-b hover:bg-gray-50">
        <td class="p-3 text-xs text-gray-400">${i + 1}</td>
        <td class="p-3 font-medium">${escapeHtml(v.name)}${v.sort_order ? ' <span class="text-xs text-gray-400">('+v.sort_order+')</span>' : ''}</td>
        <td class="p-3 text-xs font-mono">${escapeHtml(v.sku_suffix || '-')}</td>
        <td class="p-3">${formatCurrency(v.mrp)}</td>
        <td class="p-3 font-semibold">${formatCurrency(v.selling_price)}</td>
        <td class="p-3 text-xs text-gray-500">${v.features && v.features.length ? '<span title="'+escapeHtml(v.features.join('\n'))+'">'+v.features.length+' features</span>' : '-'}</td>
        <td class="p-3"><button onclick="editVariant(${v.id})" class="text-blue-600 hover:underline text-xs mr-2">Edit</button><button onclick="deleteVariant(${v.id})" class="text-red-600 hover:underline text-xs">Delete</button></td>
      </tr>`).join('')}</tbody></table>`;
    }

    function showAddForm() {
      document.getElementById('edit-id').value = '';
      document.getElementById('form-title').textContent = 'Add Variant';
      document.getElementById('variant-form').reset();
      document.getElementById('form-section').classList.remove('hidden');
      document.getElementById('form-section').scrollIntoView({ behavior: 'smooth' });
    }

    function hideForm() {
      document.getElementById('form-section').classList.add('hidden');
      document.getElementById('edit-id').value = '';
    }

    async function editVariant(id) {
      const { data: v, error } = await erp.from('product_variants').select('*').eq('id', id).single();
      if (error || !v) return;
      document.getElementById('edit-id').value = v.id;
      document.getElementById('form-title').textContent = 'Edit Variant';
      document.getElementById('vname').value = v.name;
      document.getElementById('vsku').value = v.sku_suffix || '';
      document.getElementById('vmrp').value = v.mrp || '';
      document.getElementById('vsp').value = v.selling_price || '';
      document.getElementById('vsort').value = v.sort_order || 0;
      document.getElementById('vdesc').value = v.description || '';
      document.getElementById('vfeatures').value = (v.features || []).join('\n');
      document.getElementById('form-section').classList.remove('hidden');
      document.getElementById('form-section').scrollIntoView({ behavior: 'smooth' });
    }

    async function deleteVariant(id) {
      if (!confirm('Delete this variant?')) return;
      try {
        await erp.from('product_variants').update({ is_active: false }).eq('id', id);
        showAlert('Variant deleted.', 'success');
        await loadVariants();
      } catch (err) { showAlert(err.message, 'error'); }
    }
  </script>
<script src="../../js/analytics-tracker.js" defer></script>
</body>
</html>
