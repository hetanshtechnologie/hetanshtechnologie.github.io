<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDS/TCS Management — All-in-One ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;background:#f1f5f9;}table td{padding:6px 10px;}</style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body>
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <a href="dashboard.html" class="text-blue-600 font-bold text-lg">&larr; Dashboard</a>
      <span class="text-gray-400">|</span>
      <span class="font-semibold">TDS/TCS Management</span>
    </div>
    <button onclick="signOut()" class="text-sm text-red-500 hover:underline">Logout</button>
  </nav>
  <div class="max-w-7xl mx-auto p-6">
    <!-- KPI Cards -->
    <div id="kpi-cards" class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6"></div>

    <!-- Tabs -->
    <div class="flex gap-2 mb-4 flex-wrap">
      <button class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-blue-600 text-white active" data-tab="register" onclick="switchTab('register')">TDS/TCS Register</button>
      <button class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-gray-200 text-gray-700" data-tab="certificates" onclick="switchTab('certificates')">Certificates</button>
      <button class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-gray-200 text-gray-700" data-tab="challans" onclick="switchTab('challans')">Challans</button>
    </div>

    <div id="content" class="bg-white rounded-xl shadow-sm border p-6">
      <div id="loading" class="text-center text-gray-500 py-8">Loading...</div>
      <div id="tab-content" class="hidden"></div>
    </div>
  </div>

  <!-- Certificate Modal -->
  <div id="cert-modal" class="fixed inset-0 bg-black bg-opacity-40 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 max-w-lg w-full mx-4 shadow-xl max-h-screen overflow-y-auto">
      <h3 class="text-lg font-bold mb-4" id="cert-modal-title">Add Certificate</h3>
      <div class="space-y-3">
        <select id="cert-party" class="w-full border rounded px-3 py-2 text-sm"><option value="">Select Party</option></select>
        <select id="cert-type" class="w-full border rounded px-3 py-2 text-sm">
          <option value="form16">Form 16</option><option value="form16a">Form 16A</option>
          <option value="form27d">Form 27D</option><option value="form16e">Form 16E</option>
        </select>
        <input type="text" id="cert-fy" placeholder="Financial Year (e.g. 2024-25)" class="w-full border rounded px-3 py-2 text-sm">
        <select id="cert-quarter" class="w-full border rounded px-3 py-2 text-sm">
          <option value="Q1">Q1</option><option value="Q2">Q2</option><option value="Q3">Q3</option>
          <option value="Q4">Q4</option><option value="Annual">Annual</option>
        </select>
        <input type="text" id="cert-section" placeholder="Section (e.g. 194A)" class="w-full border rounded px-3 py-2 text-sm">
        <input type="number" id="cert-total" step="0.01" placeholder="Total Amount" class="w-full border rounded px-3 py-2 text-sm">
        <input type="number" id="cert-tds" step="0.01" placeholder="TDS Amount" class="w-full border rounded px-3 py-2 text-sm">
        <input type="text" id="cert-no" placeholder="Certificate No" class="w-full border rounded px-3 py-2 text-sm">
        <input type="date" id="cert-date" class="w-full border rounded px-3 py-2 text-sm">
        <textarea id="cert-notes" placeholder="Notes" class="w-full border rounded px-3 py-2 text-sm"></textarea>
      </div>
      <div class="flex gap-3 mt-4">
        <button onclick="saveCert()" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-semibold hover:bg-blue-700">Save</button>
        <button onclick="closeCertModal()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded text-sm font-semibold">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Challan Modal -->
  <div id="challan-modal" class="fixed inset-0 bg-black bg-opacity-40 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 max-w-lg w-full mx-4 shadow-xl">
      <h3 class="text-lg font-bold mb-4">Add TDS Challan</h3>
      <div class="space-y-3">
        <input type="text" id="challan-no" placeholder="Challan No" class="w-full border rounded px-3 py-2 text-sm" required>
        <input type="text" id="challan-section" placeholder="Section (e.g. 194A)" class="w-full border rounded px-3 py-2 text-sm">
        <select id="challan-type" class="w-full border rounded px-3 py-2 text-sm"><option value="tds">TDS</option><option value="tcs">TCS</option></select>
        <input type="number" id="challan-amt" step="0.01" placeholder="Amount" class="w-full border rounded px-3 py-2 text-sm" required>
        <input type="date" id="challan-date" class="w-full border rounded px-3 py-2 text-sm">
        <input type="text" id="challan-bsr" placeholder="BSR Code" class="w-full border rounded px-3 py-2 text-sm">
        <textarea id="challan-remarks" placeholder="Remarks" class="w-full border rounded px-3 py-2 text-sm"></textarea>
      </div>
      <div class="flex gap-3 mt-4">
        <button onclick="saveChallan()" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-semibold hover:bg-blue-700">Save</button>
        <button onclick="closeChallanModal()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded text-sm font-semibold">Cancel</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/erp.js"></script>
  <script>
    let orgId, activeTab = 'register', parties = [], sections = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await requireLogin(); if (!user) return;
      orgId = await getOrgId(); if (!orgId) return;
      const { data: p } = await erp.from('parties').select('id,name').eq('org_id', orgId).eq('is_active', true);
      parties = p || [];
      const { data: s } = await erp.from('tds_rates').select('section');
      sections = [...new Set((s||[]).map(x => x.section))];
      loadRegister();
    });

    function switchTab(t) {
      activeTab = t;
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('bg-blue-600','text-white','active');
        b.classList.add('bg-gray-200','text-gray-700');
        if(b.dataset.tab === t) { b.classList.add('bg-blue-600','text-white','active'); b.classList.remove('bg-gray-200','text-gray-700'); }
      });
      loadTab();
    }

    function loadTab() {
      if(activeTab === 'register') loadRegister();
      else if(activeTab === 'certificates') loadCerts();
      else if(activeTab === 'challans') loadChallans();
    }

    async function loadRegister() {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('tab-content').classList.add('hidden');
      const { data: invoices } = await erp.from('invoices').select('*, parties!inner(name,gstin)').eq('org_id', orgId).or('tds_amt.gt.0,tcs_amt.gt.0').order('invoice_date', { ascending: false });
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('tab-content').classList.remove('hidden');

      let totalTDS = 0, totalTCS = 0, dedCount = 0;
      let rows = (invoices||[]).map(inv => {
        totalTDS += Number(inv.tds_amt||0); totalTCS += Number(inv.tcs_amt||0);
        if(Number(inv.tds_amt||0) > 0 || Number(inv.tcs_amt||0) > 0) dedCount++;
        let p = inv.parties || {};
        return `<tr class="border-b"><td>${escapeHtml(inv.doc_type||'invoice')}</td><td>${formatDate(inv.invoice_date)}</td><td>${escapeHtml(inv.invoice_no)}</td><td>${escapeHtml(p.name||'')}</td><td>${escapeHtml(p.gstin||'')}</td><td class="text-right">${formatCurrency(inv.taxable_amt||0)}</td><td class="text-right">${inv.tds_rate||0}%</td><td class="text-right">${formatCurrency(inv.tds_amt||0)}</td><td class="text-right">${inv.tcs_rate||0}%</td><td class="text-right">${formatCurrency(inv.tcs_amt||0)}</td><td class="text-right">${formatCurrency((inv.tds_amt||0)+(inv.tcs_amt||0))}</td></tr>`;
      }).join('');

      document.getElementById('kpi-cards').innerHTML = `
        <div class="bg-white p-3 rounded-lg border text-center"><div class="text-xs text-gray-500">Total Deductions</div><div class="text-lg font-bold">${dedCount}</div></div>
        <div class="bg-white p-3 rounded-lg border text-center"><div class="text-xs text-gray-500">Total TDS</div><div class="text-lg font-bold text-blue-600">${formatCurrency(totalTDS)}</div></div>
        <div class="bg-white p-3 rounded-lg border text-center"><div class="text-xs text-gray-500">Total TCS</div><div class="text-lg font-bold text-green-600">${formatCurrency(totalTCS)}</div></div>
        <div class="bg-white p-3 rounded-lg border text-center"><div class="text-xs text-gray-500">Total Liability</div><div class="text-lg font-bold text-orange-600">${formatCurrency(totalTDS+totalTCS)}</div></div>
        <div class="bg-white p-3 rounded-lg border text-center"><div class="text-xs text-gray-500">Avg Rate</div><div class="text-lg font-bold">${invoices&&invoices.length>0 ? ((totalTDS+totalTCS)/Math.max(1,invoices.reduce((s,x)=>s+Number(x.taxable_amt||0),0))*100).toFixed(2) : '0.00'}%</div></div>`;

      document.getElementById('tab-content').innerHTML = `
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold">TDS/TCS Register</h2>
          <a href="invoices.html" class="text-blue-600 text-sm hover:underline">View All Documents &rarr;</a>
        </div>
        <div class="overflow-x-auto"><table class="w-full text-xs whitespace-nowrap">
          <thead><tr class="bg-gray-50 border-b"><th class="text-left p-2 font-semibold">Type</th><th class="text-left p-2 font-semibold">Date</th><th class="text-left p-2 font-semibold">Invoice</th><th class="text-left p-2 font-semibold">Party</th><th class="text-left p-2 font-semibold">GSTIN</th><th class="text-right p-2 font-semibold">Taxable</th><th class="text-right p-2 font-semibold">TDS%</th><th class="text-right p-2 font-semibold">TDS</th><th class="text-right p-2 font-semibold">TCS%</th><th class="text-right p-2 font-semibold">TCS</th><th class="text-right p-2 font-semibold">Total</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>`;
    }

    async function loadCerts() {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('tab-content').classList.add('hidden');
      const { data: certs } = await erp.from('tds_certificates').select('*, parties(name)').eq('org_id', orgId).order('created_at', { ascending: false });
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('tab-content').classList.remove('hidden');
      let rows = (certs||[]).map(c => `<tr class="border-b">
        <td>${c.certificate_type}</td><td>${c.financial_year}</td><td>${c.quarter}</td>
        <td>${c.parties?escapeHtml(c.parties.name):''}</td><td>${c.section||''}</td>
        <td class="text-right">${formatCurrency(c.total_amount)}</td><td class="text-right">${formatCurrency(c.tds_amount)}</td>
        <td>${c.certificate_no||''}</td><td>${c.issue_date?formatDate(c.issue_date):''}</td>
        <td><span class="px-2 py-0.5 rounded text-xs font-medium ${c.status==='issued'?'bg-green-100 text-green-700':c.status==='received'?'bg-blue-100 text-blue-700':'bg-yellow-100 text-yellow-700'}">${c.status}</span></td>
        <td><button onclick="deleteCert(${c.id})" class="text-red-500 hover:underline text-xs">Delete</button></td></tr>`).join('');
      document.getElementById('tab-content').innerHTML = `
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold">TDS/TCS Certificates</h2>
          <button onclick="openCertModal()" class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm hover:bg-blue-700">+ Add Certificate</button>
        </div>
        <div class="overflow-x-auto"><table class="w-full text-xs whitespace-nowrap">
          <thead><tr class="bg-gray-50 border-b"><th class="text-left p-2 font-semibold">Type</th><th class="text-left p-2 font-semibold">FY</th><th class="text-left p-2 font-semibold">Quarter</th><th class="text-left p-2 font-semibold">Party</th><th class="text-left p-2 font-semibold">Section</th><th class="text-right p-2 font-semibold">Amount</th><th class="text-right p-2 font-semibold">TDS</th><th class="text-left p-2 font-semibold">Cert No</th><th class="text-left p-2 font-semibold">Date</th><th class="text-left p-2 font-semibold">Status</th><th class="text-left p-2 font-semibold"></th></tr></thead>
          <tbody>${rows||'<tr><td colspan="11" class="text-center text-gray-400 py-4">No certificates yet</td></tr>'}</tbody></table></div>`;
    }

    async function loadChallans() {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('tab-content').classList.add('hidden');
      const { data: challans } = await erp.from('tds_challans').select('*').eq('org_id', orgId).order('deposit_date', { ascending: false });
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('tab-content').classList.remove('hidden');
      let rows = (challans||[]).map(c => `<tr class="border-b">
        <td>${c.challan_no}</td><td>${c.section||''}</td><td>${c.tds_type.toUpperCase()}</td>
        <td class="text-right">${formatCurrency(c.amount)}</td><td>${formatDate(c.deposit_date)}</td>
        <td>${c.bsr_code||''}</td><td>${c.mode}</td>
        <td><span class="px-2 py-0.5 rounded text-xs font-medium ${c.status==='paid'?'bg-green-100 text-green-700':c.status==='bounced'?'bg-red-100 text-red-700':'bg-yellow-100 text-yellow-700'}">${c.status}</span></td>
        <td><button onclick="deleteChallan(${c.id})" class="text-red-500 hover:underline text-xs">Delete</button></td></tr>`).join('');
      document.getElementById('tab-content').innerHTML = `
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold">TDS/TCS Challans</h2>
          <button onclick="openChallanModal()" class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm hover:bg-blue-700">+ Add Challan</button>
        </div>
        <div class="overflow-x-auto"><table class="w-full text-xs whitespace-nowrap">
          <thead><tr class="bg-gray-50 border-b"><th class="text-left p-2 font-semibold">Challan No</th><th class="text-left p-2 font-semibold">Section</th><th class="text-left p-2 font-semibold">Type</th><th class="text-right p-2 font-semibold">Amount</th><th class="text-left p-2 font-semibold">Date</th><th class="text-left p-2 font-semibold">BSR</th><th class="text-left p-2 font-semibold">Mode</th><th class="text-left p-2 font-semibold">Status</th><th class="text-left p-2 font-semibold"></th></tr></thead>
          <tbody>${rows||'<tr><td colspan="9" class="text-center text-gray-400 py-4">No challans yet</td></tr>'}</tbody></table></div>`;
    }

    function openCertModal() {
      const sel = document.getElementById('cert-party');
      sel.innerHTML = '<option value="">Select Party</option>' + parties.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
      document.getElementById('cert-modal').style.display = 'flex';
      ['cert-type','cert-fy','cert-quarter','cert-section','cert-total','cert-tds','cert-no','cert-date','cert-notes'].forEach(id => { const el = document.getElementById(id); if(el) { if(el.type!=='select-one'&&el.type!=='select') el.value = ''; else el.selectedIndex = 0; }});
    }
    function closeCertModal() { document.getElementById('cert-modal').style.display = 'none'; }
    async function saveCert() {
      const data = {
        org_id: orgId, party_id: document.getElementById('cert-party').value || null,
        certificate_type: document.getElementById('cert-type').value,
        financial_year: document.getElementById('cert-fy').value,
        quarter: document.getElementById('cert-quarter').value,
        section: document.getElementById('cert-section').value,
        total_amount: parseFloat(document.getElementById('cert-total').value)||0,
        tds_amount: parseFloat(document.getElementById('cert-tds').value)||0,
        certificate_no: document.getElementById('cert-no').value,
        issue_date: document.getElementById('cert-date').value||null,
        notes: document.getElementById('cert-notes').value
      };
      const { error } = await erp.from('tds_certificates').insert(data);
      if(error) return alert('Error: '+error.message);
      closeCertModal(); loadCerts();
    }
    async function deleteCert(id) { if(!confirm('Delete this certificate?')) return; await erp.from('tds_certificates').delete().eq('id',id); loadCerts(); }

    function openChallanModal() {
      document.getElementById('challan-modal').style.display = 'flex';
      ['challan-no','challan-section','challan-amt','challan-date','challan-bsr','challan-remarks'].forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
      document.getElementById('challan-type').selectedIndex = 0;
    }
    function closeChallanModal() { document.getElementById('challan-modal').style.display = 'none'; }
    async function saveChallan() {
      const data = {
        org_id: orgId, challan_no: document.getElementById('challan-no').value,
        section: document.getElementById('challan-section').value,
        tds_type: document.getElementById('challan-type').value,
        amount: parseFloat(document.getElementById('challan-amt').value)||0,
        deposit_date: document.getElementById('challan-date').value||new Date().toISOString().split('T')[0],
        bsr_code: document.getElementById('challan-bsr').value,
        remarks: document.getElementById('challan-remarks').value
      };
      if(!data.challan_no) return alert('Challan No is required');
      const { error } = await erp.from('tds_challans').insert(data);
      if(error) return alert('Error: '+error.message);
      closeChallanModal(); loadChallans();
    }
    async function deleteChallan(id) { if(!confirm('Delete this challan?')) return; await erp.from('tds_challans').delete().eq('id',id); loadChallans(); }
  </script>
<script src="../../js/analytics-tracker.js" defer></script>
</body>
</html>
