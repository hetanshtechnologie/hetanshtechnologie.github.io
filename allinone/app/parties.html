<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parties — All-in-One ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;background:#f1f5f9;}</style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body>
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <a href="dashboard.html" class="text-blue-600 font-bold text-lg">&larr; Dashboard</a>
      <span class="text-gray-400">|</span>
      <span class="font-semibold">Parties</span>
    </div>
    <div>
      <button onclick="signOut()" class="text-sm text-red-500 hover:underline">Logout</button>
    </div>
  </nav>
  <div class="max-w-6xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">Parties</h1>
      <button onclick="showAddForm()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">+ Add Party</button>
    </div>
    <div id="alert"></div>
    <div id="loading" class="text-gray-500 mb-4">Loading...</div>

    <div id="form-section" class="hidden bg-white rounded-xl shadow-sm border p-6 mb-6">
      <h2 id="form-title" class="font-bold text-lg mb-4">Add Party</h2>
      <form id="party-form" class="grid grid-cols-2 gap-4">
        <div><label class="block text-sm font-semibold mb-1">Type</label><select id="type" class="w-full border rounded-lg px-3 py-2 text-sm"><option value="customer">Customer</option><option value="supplier">Supplier</option><option value="both">Both</option></select></div>
        <div><label class="block text-sm font-semibold mb-1">Name</label><input type="text" id="name" class="w-full border rounded-lg px-3 py-2 text-sm" required></div>
        <div><label class="block text-sm font-semibold mb-1">GSTIN</label><input type="text" id="gstin" class="w-full border rounded-lg px-3 py-2 text-sm font-mono"></div>
        <div><label class="block text-sm font-semibold mb-1">PAN</label><input type="text" id="pan" class="w-full border rounded-lg px-3 py-2 text-sm font-mono"></div>
        <div><label class="block text-sm font-semibold mb-1">Phone</label><input type="tel" id="phone" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
        <div><label class="block text-sm font-semibold mb-1">Email</label><input type="email" id="email" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
        <div><label class="block text-sm font-semibold mb-1">City</label><input type="text" id="city" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
        <div><label class="block text-sm font-semibold mb-1">Credit Limit (₹)</label><input type="number" id="credit_limit" class="w-full border rounded-lg px-3 py-2 text-sm" step="0.01"></div>
        <div class="col-span-2 flex gap-2">
          <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">Save</button>
          <button type="button" onclick="hideForm()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm hover:bg-gray-300">Cancel</button>
        </div>
      </form>
    </div>

    <div id="parties-section" class="hidden bg-white rounded-xl shadow-sm border overflow-x-auto"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/erp.js"></script>
  <script>
    let editId = null;
    document.addEventListener('DOMContentLoaded', async function() {
      const user = await requireLogin();
      if (!user) return;
      await loadParties();
      document.getElementById('party-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const data = {
          type: document.getElementById('type').value,
          name: document.getElementById('name').value.trim(),
          gstin: document.getElementById('gstin').value.trim() || null,
          pan: document.getElementById('pan').value.trim() || null,
          phone: document.getElementById('phone').value.trim(),
          email: document.getElementById('email').value.trim(),
          address: { city: document.getElementById('city').value.trim() },
          credit_limit: parseFloat(document.getElementById('credit_limit').value) || null
        };
        try {
          const orgId = await getOrgId();
          if (editId) {
            const { error } = await erp.from('parties').update(data).eq('id', editId);
            if (error) throw error;
          } else {
            const { error } = await erp.from('parties').insert({ ...data, org_id: orgId });
            if (error) throw error;
          }
          showAlert(editId ? 'Party updated!' : 'Party created!', 'success');
          hideForm(); await loadParties();
        } catch (err) { showAlert(err.message, 'error'); }
      });
    });

    async function loadParties() {
      const orgId = await getOrgId();
      if (!orgId) return;
      const { data, error } = await erp.from('parties').select('*').eq('org_id', orgId).eq('is_active', true).order('name');
      if (error) throw error;
      document.getElementById('loading').classList.add('hidden');
      const div = document.getElementById('parties-section'); div.classList.remove('hidden');
      if (!data || !data.length) { div.innerHTML = '<div class="p-6 text-gray-500 text-center">No parties yet.</div>'; return; }
      div.innerHTML = `<table class="w-full text-sm"><thead><tr class="bg-gray-50 border-b text-left"><th class="p-3 font-semibold">Name</th><th class="p-3 font-semibold">Type</th><th class="p-3 font-semibold">GSTIN</th><th class="p-3 font-semibold">Phone</th><th class="p-3 font-semibold">City</th><th class="p-3 font-semibold">Actions</th></tr></thead><tbody>${data.map(p => `<tr class="border-b hover:bg-gray-50"><td class="p-3 font-medium">${escapeHtml(p.name)}</td><td class="p-3"><span class="badge">${p.type}</span></td><td class="p-3 font-mono text-xs">${escapeHtml(p.gstin || '-')}</td><td class="p-3 text-xs">${escapeHtml(p.phone || '-')}</td><td class="p-3 text-xs">${escapeHtml(p.address?.city || '-')}</td><td class="p-3"><button onclick="editParty(${p.id},'${escapeHtml(p.type)}','${escapeHtml(p.name)}','${escapeHtml(p.gstin||'')}','${escapeHtml(p.pan||'')}','${escapeHtml(p.phone||'')}','${escapeHtml(p.email||'')}','${escapeHtml(p.address?.city||'')}',${p.credit_limit||0})" class="text-blue-600 hover:underline text-xs mr-2">Edit</button><button onclick="deleteParty(${p.id})" class="text-red-600 hover:underline text-xs">Delete</button></td></tr>`).join('')}</tbody></table>`;
    }

    function showAddForm() { editId = null; document.getElementById('form-title').textContent = 'Add Party'; document.getElementById('party-form').reset(); document.getElementById('form-section').classList.remove('hidden'); }
    function hideForm() { document.getElementById('form-section').classList.add('hidden'); editId = null; }
    function editParty(id, type, name, gstin, pan, phone, email, city, cl) {
      editId = id; document.getElementById('form-title').textContent = 'Edit Party';
      document.getElementById('type').value = type; document.getElementById('name').value = name;
      document.getElementById('gstin').value = gstin; document.getElementById('pan').value = pan;
      document.getElementById('phone').value = phone; document.getElementById('email').value = email;
      document.getElementById('city').value = city; document.getElementById('credit_limit').value = cl;
      document.getElementById('form-section').classList.remove('hidden');
    }
    async function deleteParty(id) { if (!confirm('Delete this party?')) return; try { await erp.from('parties').update({ is_active: false }).eq('id', id); showAlert('Deleted.', 'success'); await loadParties(); } catch (err) { showAlert(err.message, 'error'); } }
  </script>
<script src="../../js/analytics-tracker.js" defer></script>
</body>
</html>
