<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price List — All-in-One ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;background:#f1f5f9;}.print-only{display:none;}@media print{body{background:#fff;padding:10px}.no-print{display:none!important}.print-only{display:block}}</style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body>
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center no-print">
    <div class="flex items-center gap-4">
      <a href="dashboard.html" class="text-blue-600 font-bold text-lg">&larr; Dashboard</a>
      <span class="text-gray-400">|</span>
      <span class="font-semibold">Price List</span>
    </div>
    <button onclick="signOut()" class="text-sm text-red-500 hover:underline">Logout</button>
  </nav>
  <div class="max-w-5xl mx-auto p-6 no-print">
    <div class="flex gap-4 mb-6 items-center">
      <select id="category-filter" class="border rounded px-3 py-2 text-sm" onchange="loadPriceList()"><option value="">All Categories</option></select>
      <button onclick="window.print()" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">&#128424; Print</button>
      <button onclick="exportPriceList()" class="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700">Export CSV</button>
    </div>
    <div class="bg-white rounded-xl shadow-sm border p-6">
      <div id="loading" class="text-center text-gray-400 py-8">Loading...</div>
      <div id="content" class="hidden"></div>
    </div>
  </div>
  <div id="print-area" class="print-only p-8"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/erp.js"></script>
  <script>
    let orgId, allProducts = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await requireLogin(); if(!user) return;
      orgId = await getOrgId(); if(!orgId) return;
      const { data: cats } = await erp.from('products').select('category').eq('org_id', orgId).not('category','is',null);
      const unique = [...new Set((cats||[]).map(c => c.category).filter(Boolean))];
      const sel = document.getElementById('category-filter');
      unique.forEach(c => { const o = document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o); });
      loadPriceList();
    });

    async function loadPriceList() {
      document.getElementById('loading').classList.remove('hidden'); document.getElementById('content').classList.add('hidden');
      let q = erp.from('products').select('*').eq('org_id', orgId).eq('is_active', true).order('name');
      const cat = document.getElementById('category-filter').value;
      if(cat) q = q.eq('category', cat);
      const { data } = await q;
      allProducts = data || [];

      document.getElementById('loading').classList.add('hidden'); document.getElementById('content').classList.remove('hidden');
      const header = `<div class="text-center mb-6"><h1 class="text-xl font-bold">PRICE LIST</h1><p class="text-sm text-gray-500">${document.getElementById('category-filter').value||'All Categories'} | ${new Date().toLocaleDateString('en-IN')}</p></div>`;
      const table = `<table class="w-full text-sm"><thead><tr class="bg-gray-50 border-b"><th class="text-left p-2 font-semibold">Code</th><th class="text-left p-2 font-semibold">Product</th><th class="text-left p-2 font-semibold">Category</th><th class="text-left p-2 font-semibold">Unit</th><th class="text-right p-2 font-semibold">Cost Price</th><th class="text-right p-2 font-semibold">Selling Price</th><th class="text-right p-2 font-semibold">Margin %</th></tr></thead><tbody>${
        allProducts.map(p => {
          const margin = p.cost_price > 0 ? ((Number(p.selling_price||0)-Number(p.cost_price||0))/Number(p.cost_price||0)*100).toFixed(1) : '-';
          return `<tr class="border-b"><td>${escapeHtml(p.code||'')}</td><td class="font-medium">${escapeHtml(p.name)}</td><td>${escapeHtml(p.category||'')}</td><td>${p.unit||'pc'}</td><td class="text-right">${formatCurrency(p.cost_price)}</td><td class="text-right font-bold">${formatCurrency(p.selling_price)}</td><td class="text-right">${margin}%</td></tr>`;
        }).join('')
      }</tbody></table>`;

      document.getElementById('content').innerHTML = header + table;
      document.getElementById('print-area').innerHTML = header + table;
    }

    function exportPriceList() {
      if(!allProducts.length) return;
      let csv = 'Code,Product,Category,Unit,Cost Price,Selling Price,Margin %\n';
      allProducts.forEach(p => {
        const margin = p.cost_price > 0 ? ((Number(p.selling_price||0)-Number(p.cost_price||0))/Number(p.cost_price||0)*100).toFixed(1) : '-';
        csv += `"${p.code||''}","${p.name}","${p.category||''}","${p.unit||'pc'}",${p.cost_price||0},${p.selling_price||0},"${margin}"\n`;
      });
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = 'price_list.csv'; a.click();
    }
  </script>
<script src="../../js/analytics-tracker.js" defer></script>
</body>
</html>
