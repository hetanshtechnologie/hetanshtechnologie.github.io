<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users — All-in-One ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;background:#f1f5f9;}</style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body>
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <a href="dashboard.html" class="text-blue-600 font-bold text-lg">&larr; Dashboard</a>
      <span class="text-gray-400">|</span>
      <span class="font-semibold">Users</span>
    </div>
    <div>
      <button onclick="signOut()" class="text-sm text-red-500 hover:underline">Logout</button>
    </div>
  </nav>
  <div class="max-w-6xl mx-auto p-6">
    <div id="alert"></div>
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">User Management</h1>
      <button onclick="showInviteForm()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">+ Invite User</button>
    </div>

    <div id="invite-section" class="hidden bg-white rounded-xl shadow-sm border p-6 mb-6">
      <h2 class="font-bold text-lg mb-4">Invite Team Member</h2>
      <form id="invite-form" class="grid grid-cols-2 gap-4">
        <div><label class="block text-sm font-semibold mb-1">Full Name</label><input type="text" id="full_name" class="w-full border rounded-lg px-3 py-2 text-sm" required></div>
        <div><label class="block text-sm font-semibold mb-1">Email</label><input type="email" id="email" class="w-full border rounded-lg px-3 py-2 text-sm" required></div>
        <div><label class="block text-sm font-semibold mb-1">Password</label><input type="text" id="password" class="w-full border rounded-lg px-3 py-2 text-sm" required minlength="6" value="Welcome123!"></div>
        <div><label class="block text-sm font-semibold mb-1">Role</label><select id="role" class="w-full border rounded-lg px-3 py-2 text-sm"><option value="accountant">Accountant</option><option value="sales">Sales</option><option value="inventory_manager">Inventory Manager</option><option value="staff">Staff</option></select></div>
        <div class="col-span-2 flex gap-2">
          <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">Invite</button>
          <button type="button" onclick="hideInviteForm()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm hover:bg-gray-300">Cancel</button>
        </div>
      </form>
    </div>

    <div id="loading" class="text-gray-500 mb-4">Loading users...</div>
    <div id="users-section" class="hidden bg-white rounded-xl shadow-sm border overflow-x-auto"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/erp.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const user = await requireAdmin();
      if (!user) return;
      const profile = await getUserProfile();
      if (!profile) return;
      await loadUsers();

      document.getElementById('invite-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = this.querySelector('button[type="submit"]');
        btn.disabled = true; btn.textContent = 'Creating...';
        try {
          const orgId = await getOrgId();
          const fullName = document.getElementById('full_name').value.trim();
          const email = document.getElementById('email').value.trim();
          const password = document.getElementById('password').value;
          const role = document.getElementById('role').value;

          const { data: authData, error: authErr } = await erp.auth.admin.createUser({ email, password, email_confirm: true });
          if (authErr) throw authErr;

          const { error: profErr } = await erp.from('user_profiles').insert({
            id: authData.user.id, org_id: orgId,
            full_name: fullName, role
          });
          if (profErr) throw profErr;

          showAlert('User created successfully!', 'success');
          hideInviteForm();
          await loadUsers();
        } catch (err) { showAlert(err.message, 'error'); }
        btn.disabled = false; btn.textContent = 'Invite';
      });
    });

    async function loadUsers() {
      const orgId = await getOrgId();
      if (!orgId) return;
      const { data, error } = await erp.from('user_profiles').select('*').eq('org_id', orgId).order('created_at', { ascending: false });
      if (error) { document.getElementById('loading').textContent = 'Error: ' + error.message; return; }
      document.getElementById('loading').classList.add('hidden');
      const div = document.getElementById('users-section');
      div.classList.remove('hidden');
      if (!data || !data.length) { div.innerHTML = '<div class="p-6 text-gray-500 text-center">No users yet.</div>'; return; }

      const roleBadge = r => {
        const colors = { admin: 'bg-purple-100 text-purple-700', accountant: 'bg-blue-100 text-blue-700', sales: 'bg-green-100 text-green-700', inventory_manager: 'bg-orange-100 text-orange-700', staff: 'bg-gray-100 text-gray-600' };
        return '<span class="inline-block text-xs font-semibold px-2 py-0.5 rounded ' + (colors[r] || 'bg-gray-100') + '">' + r + '</span>';
      };

      div.innerHTML = `<table class="w-full text-sm"><thead><tr class="bg-gray-50 border-b text-left"><th class="p-3 font-semibold">Name</th><th class="p-3 font-semibold">Email</th><th class="p-3 font-semibold">Role</th><th class="p-3 font-semibold">Phone</th><th class="p-3 font-semibold">Status</th><th class="p-3 font-semibold">Joined</th></tr></thead><tbody>${data.map(u => `<tr class="border-b hover:bg-gray-50"><td class="p-3 font-medium">${escapeHtml(u.full_name || 'Unknown')}</td><td class="p-3 text-xs">${u.id}</td><td class="p-3">${roleBadge(u.role)}</td><td class="p-3 text-xs">${escapeHtml(u.phone || '-')}</td><td class="p-3">${u.is_active ? '<span class="text-green-600 text-xs font-semibold">Active</span>' : '<span class="text-red-600 text-xs font-semibold">Inactive</span>'}</td><td class="p-3 text-xs text-gray-500">${formatDate(u.created_at)}</td></tr>`).join('')}</tbody></table>`;
    }

    function showInviteForm() { document.getElementById('invite-section').classList.remove('hidden'); }
    function hideInviteForm() { document.getElementById('invite-section').classList.add('hidden'); }
  </script>
<script src="../../js/analytics-tracker.js" defer></script>
</body>
</html>
