<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory — All-in-One ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;background:#f1f5f9;}</style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body>
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <a href="dashboard.html" class="text-blue-600 font-bold text-lg">&larr; Dashboard</a>
      <span class="text-gray-400">|</span>
      <span class="font-semibold">Inventory</span>
    </div>
    <button onclick="signOut()" class="text-sm text-red-500 hover:underline">Logout</button>
  </nav>
  <div class="max-w-6xl mx-auto p-6">
    <div id="alert"></div>
    <h1 class="text-2xl font-bold mb-6">Inventory Batches</h1>

    <div class="grid grid-cols-2 gap-4 mb-6">
      <div class="bg-white rounded-xl shadow-sm border p-6">
        <h2 class="font-bold text-lg mb-4">Add Batch</h2>
        <form id="batch-form" class="grid grid-cols-2 gap-3">
          <div class="col-span-2"><label class="block text-sm font-semibold mb-1">Product</label><select id="product_id" class="w-full border rounded-lg px-3 py-2 text-sm" required></select></div>
          <div><label class="block text-sm font-semibold mb-1">Batch No</label><input type="text" id="batch_no" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
          <div><label class="block text-sm font-semibold mb-1">Quantity</label><input type="number" id="qty" class="w-full border rounded-lg px-3 py-2 text-sm" step="0.001" required></div>
          <div><label class="block text-sm font-semibold mb-1">Cost Price</label><input type="number" id="cost" class="w-full border rounded-lg px-3 py-2 text-sm" step="0.01"></div>
          <div><label class="block text-sm font-semibold mb-1">Godown</label><select id="godown_id" class="w-full border rounded-lg px-3 py-2 text-sm"><option value="">Main Store</option></select></div>
          <div><label class="block text-sm font-semibold mb-1">Location/Rack</label><input type="text" id="location" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
          <div><label class="block text-sm font-semibold mb-1">Min Stock</label><input type="number" id="min_stock" class="w-full border rounded-lg px-3 py-2 text-sm" step="0.001" value="0"></div>
          <div><label class="block text-sm font-semibold mb-1">Reorder Level</label><input type="number" id="reorder_level" class="w-full border rounded-lg px-3 py-2 text-sm" step="0.001" value="0"></div>
          <div><label class="block text-sm font-semibold mb-1">Mfg Date</label><input type="date" id="mfg" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
          <div><label class="block text-sm font-semibold mb-1">Expiry Date</label><input type="date" id="expiry" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
          <div class="col-span-2"><button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">Add Batch</button></div>
        </form>
      </div>
      <div class="bg-white rounded-xl shadow-sm border p-6">
        <h2 class="font-bold text-lg mb-4">Stock Summary</h2>
        <div id="stock-summary" class="text-gray-500 text-sm">Loading...</div>
      </div>
    </div>

    <div id="batches-section" class="bg-white rounded-xl shadow-sm border overflow-x-auto"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/erp.js"></script>
  <script>
    let orgId = null;
    document.addEventListener('DOMContentLoaded', async function() {
      const user = await requireLogin(); if (!user) return;
      orgId = await getOrgId(); if (!orgId) return;

      const { data: prods } = await erp.from('products').select('id, name').eq('org_id', orgId).eq('is_active', true).order('name');
      const sel = document.getElementById('product_id');
      (prods || []).forEach(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = p.name; sel.appendChild(o); });

      const { data: godowns } = await erp.from('godowns').select('id, name').eq('org_id', orgId).eq('is_active', true).order('name');
      const gsel = document.getElementById('godown_id');
      (godowns || []).forEach(g => { const o = document.createElement('option'); o.value = g.id; o.textContent = g.name; gsel.appendChild(o); });

      await loadBatches();

      document.getElementById('batch-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        try {
          const gid = document.getElementById('godown_id').value;
          const { error } = await erp.from('inventory_batches').insert({
            org_id: orgId, product_id: parseInt(document.getElementById('product_id').value),
            batch_no: document.getElementById('batch_no').value.trim(),
            quantity: parseFloat(document.getElementById('qty').value),
            cost_price: parseFloat(document.getElementById('cost').value) || null,
            godown_id: gid ? parseInt(gid) : null,
            location: document.getElementById('location').value.trim(),
            min_stock: parseFloat(document.getElementById('min_stock').value)||0,
            reorder_level: parseFloat(document.getElementById('reorder_level').value)||0,
            mfg_date: document.getElementById('mfg').value || null,
            expiry_date: document.getElementById('expiry').value || null
          });
          if (error) throw error;
          showAlert('Batch added!', 'success');
          this.reset();
          await loadBatches();
        } catch (err) { showAlert(err.message, 'error'); }
      });
    });

    async function loadBatches() {
      const { data, error } = await erp.from('inventory_batches').select('*, products(name, sku), godowns(name)').eq('org_id', orgId).eq('is_active', true).order('created_at', { ascending: false });
      if (error) return;

      const div = document.getElementById('batches-section');
      if (!data || !data.length) { div.innerHTML = '<div class="p-6 text-gray-500 text-center">No batches yet.</div>'; return; }

      const totalQty = data.reduce((s, b) => s + Number(b.quantity || 0), 0);
      const nearExpiry = data.filter(b => b.expiry_date && new Date(b.expiry_date) < new Date(Date.now() + 30*24*60*60*1000)).length;
      const lowStock = data.filter(b => b.reorder_level > 0 && Number(b.quantity) <= b.reorder_level).length;

      document.getElementById('stock-summary').innerHTML = `
        <div class="text-2xl font-bold">${totalQty.toFixed(1)}</div>
        <div class="text-xs text-gray-500">Total units in stock</div>
        <div class="mt-3 text-sm"><span class="font-semibold">${data.length}</span> batches</div>
        ${nearExpiry > 0 ? '<div class="mt-1 text-sm text-red-600">' + nearExpiry + ' near expiry</div>' : ''}
        ${lowStock > 0 ? '<div class="mt-1 text-sm text-orange-600">' + lowStock + ' below reorder level</div>' : ''}
      `;

      div.innerHTML = `<table class="w-full text-sm"><thead><tr class="bg-gray-50 border-b text-left"><th class="p-3 font-semibold">Product</th><th class="p-3 font-semibold">Batch</th><th class="p-3 font-semibold">Qty</th><th class="p-3 font-semibold">Godown</th><th class="p-3 font-semibold">Location</th><th class="p-3 font-semibold">Expiry</th><th class="p-3 font-semibold">Reorder</th></tr></thead><tbody>${data.map(b => `<tr class="border-b hover:bg-gray-50 ${b.reorder_level > 0 && Number(b.quantity) <= b.reorder_level ? 'bg-orange-50' : ''}">
        <td class="p-3">${escapeHtml(b.products?.name||'')}</td>
        <td class="p-3 font-mono text-xs">${escapeHtml(b.batch_no||'-')}</td>
        <td class="p-3 font-medium">${b.quantity}</td>
        <td class="p-3 text-xs">${b.godowns?.name||'Main Store'}</td>
        <td class="p-3 text-xs">${escapeHtml(b.location||'-')}</td>
        <td class="p-3 text-xs ${b.expiry_date&&new Date(b.expiry_date)<new Date()?'text-red-600 font-semibold':''}">${b.expiry_date?formatDate(b.expiry_date):'-'}</td>
        <td class="p-3 text-xs">${b.reorder_level > 0 ? b.reorder_level : '-'}</td>
      </tr>`).join('')}</tbody></table>`;
    }
  </script>
<script src="../../js/analytics-tracker.js" defer></script>
</body>
</html>
