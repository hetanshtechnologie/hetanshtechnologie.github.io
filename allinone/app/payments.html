<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments — All-in-One ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;background:#f1f5f9;}</style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body>
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <a href="dashboard.html" class="text-blue-600 font-bold text-lg">&larr; Dashboard</a>
      <span class="text-gray-400">|</span>
      <span class="font-semibold">Payments</span>
    </div>
    <div>
      <button onclick="signOut()" class="text-sm text-red-500 hover:underline">Logout</button>
    </div>
  </nav>
  <div class="max-w-6xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">Payments</h1>
      <button onclick="showAddForm()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">+ Record Payment</button>
    </div>
    <div id="alert"></div>

    <div id="form-section" class="hidden bg-white rounded-xl shadow-sm border p-6 mb-6">
      <h2 id="form-title" class="font-bold text-lg mb-4">Record Payment</h2>
      <form id="payment-form" class="grid grid-cols-2 gap-4">
        <div><label class="block text-sm font-semibold mb-1">Invoice</label><select id="invoice_id" class="w-full border rounded-lg px-3 py-2 text-sm"></select></div>
        <div><label class="block text-sm font-semibold mb-1">Party</label><select id="party_id" class="w-full border rounded-lg px-3 py-2 text-sm"></select></div>
        <div><label class="block text-sm font-semibold mb-1">Amount (₹)</label><input type="number" id="amount" class="w-full border rounded-lg px-3 py-2 text-sm" step="0.01" required></div>
        <div><label class="block text-sm font-semibold mb-1">Mode</label><select id="mode" class="w-full border rounded-lg px-3 py-2 text-sm"><option value="cash">Cash</option><option value="bank">Bank Transfer</option><option value="upi">UPI</option><option value="card">Card</option><option value="cheque">Cheque</option><option value="online">Online</option></select></div>
        <div><label class="block text-sm font-semibold mb-1">Reference No</label><input type="text" id="ref" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
        <div><label class="block text-sm font-semibold mb-1">Payment Date</label><input type="date" id="pay_date" class="w-full border rounded-lg px-3 py-2 text-sm" required></div>
        <div class="col-span-2 flex gap-2">
          <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">Save</button>
          <button type="button" onclick="hideForm()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm hover:bg-gray-300">Cancel</button>
        </div>
      </form>
    </div>

    <div id="loading" class="text-gray-500 mb-4">Loading payments...</div>
    <div id="payments-section" class="hidden bg-white rounded-xl shadow-sm border overflow-x-auto"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/erp.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const user = await requireLogin();
      if (!user) return;
      const orgId = await getOrgId();
      if (!orgId) return;

      const { data: invs } = await erp.from('invoices').select('id, invoice_no, parties(name)').eq('org_id', orgId).in('status', ['sent','overdue','paid']).order('created_at', { ascending: false });
      const invSel = document.getElementById('invoice_id');
      const ptySel = document.getElementById('party_id');
      const seen = new Set();
      (invs || []).forEach(inv => {
        const o = document.createElement('option'); o.value = inv.id; o.textContent = inv.invoice_no + ' - ' + (inv.parties?.name || ''); invSel.appendChild(o);
      });
      const { data: parties } = await erp.from('parties').select('id, name').eq('org_id', orgId).eq('is_active', true).in('type', ['customer','both']).order('name');
      (parties || []).forEach(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = p.name; ptySel.appendChild(o); });

      document.getElementById('pay_date').value = new Date().toISOString().split('T')[0];
      await loadPayments();

      document.getElementById('payment-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        try {
          const { data: { user } } = await erp.auth.getUser();
          const { error } = await erp.from('payments').insert({
            org_id: orgId, invoice_id: parseInt(document.getElementById('invoice_id').value) || null,
            party_id: parseInt(document.getElementById('party_id').value) || null,
            amount: parseFloat(document.getElementById('amount').value),
            mode: document.getElementById('mode').value,
            reference_no: document.getElementById('ref').value.trim(),
            payment_date: document.getElementById('pay_date').value,
            created_by: user.id
          });
          if (error) throw error;
          showAlert('Payment recorded!', 'success');
          hideForm(); await loadPayments();
        } catch (err) { showAlert(err.message, 'error'); }
      });
    });

    async function loadPayments() {
      const orgId = await getOrgId();
      if (!orgId) return;
      const { data, error } = await erp.from('payments').select('*, invoices(invoice_no), parties(name)').eq('org_id', orgId).order('created_at', { ascending: false }).limit(100);
      if (error) return;
      document.getElementById('loading').classList.add('hidden');
      const div = document.getElementById('payments-section'); div.classList.remove('hidden');
      if (!data || !data.length) { div.innerHTML = '<div class="p-6 text-gray-500 text-center">No payments recorded yet.</div>'; return; }
      div.innerHTML = `<table class="w-full text-sm"><thead><tr class="bg-gray-50 border-b text-left"><th class="p-3 font-semibold">Date</th><th class="p-3 font-semibold">Invoice</th><th class="p-3 font-semibold">Party</th><th class="p-3 font-semibold">Amount</th><th class="p-3 font-semibold">Mode</th><th class="p-3 font-semibold">Ref No</th></tr></thead><tbody>${data.map(p => `<tr class="border-b hover:bg-gray-50"><td class="p-3 text-xs">${formatDate(p.payment_date)}</td><td class="p-3 font-mono text-xs">${escapeHtml(p.invoices?.invoice_no || '-')}</td><td class="p-3">${escapeHtml(p.parties?.name || '-')}</td><td class="p-3 font-medium">${formatCurrency(p.amount)}</td><td class="p-3 text-xs"><span class="badge">${p.mode}</span></td><td class="p-3 text-xs font-mono">${escapeHtml(p.reference_no || '-')}</td></tr>`).join('')}</tbody></table>`;
    }

    function showAddForm() { document.getElementById('form-section').classList.remove('hidden'); }
    function hideForm() { document.getElementById('form-section').classList.add('hidden'); }
  </script>
<script src="../../js/analytics-tracker.js" defer></script>
</body>
</html>
