<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <rect width="500" height="300" fill="#f0f4f8"/>
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">C# Class Hierarchy</text>
  <rect x="170" y="50" width="160" height="36" rx="18" fill="#68217a"/>
  <text x="250" y="73" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">Object (Base Class)</text>
  <line x1="170" y1="86" x2="100" y2="115" stroke="#94a3b8" stroke-width="2"/>
  <line x1="250" y1="86" x2="250" y2="115" stroke="#94a3b8" stroke-width="2"/>
  <line x1="330" y1="86" x2="400" y2="115" stroke="#94a3b8" stroke-width="2"/>
  <rect x="30" y="115" width="140" height="36" rx="18" fill="#9c27b0"/>
  <text x="100" y="138" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">ValueType</text>
  <rect x="180" y="115" width="140" height="36" rx="18" fill="#9c27b0"/>
  <text x="250" y="138" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">String</text>
  <rect x="330" y="115" width="140" height="36" rx="18" fill="#9c27b0"/>
  <text x="400" y="138" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Array</text>
  <line x1="100" y1="151" x2="100" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <rect x="30" y="180" width="140" height="36" rx="18" fill="#ce93d8"/>
  <text x="100" y="203" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e293b">int, double, bool</text>
  <text x="250" y="260" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">C# is a strongly-typed, object-oriented language.</text>
  <text x="250" y="280" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">All types inherit from System.Object.</text>
