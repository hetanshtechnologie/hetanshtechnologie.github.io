<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <rect width="500" height="300" fill="#f0f4f8"/>
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">ML Workflow</text>
  <rect x="30" y="50" width="100" height="36" rx="4" fill="#e91e63"/>
  <text x="80" y="73" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Data Collection</text>
  <line x1="130" y1="68" x2="160" y2="68" stroke="#94a3b8" stroke-width="2"/>
  <rect x="160" y="50" width="100" height="36" rx="4" fill="#c2185b"/>
  <text x="210" y="73" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Data Prep</text>
  <line x1="260" y1="68" x2="290" y2="68" stroke="#94a3b8" stroke-width="2"/>
  <rect x="290" y="50" width="100" height="36" rx="4" fill="#9c27b0"/>
  <text x="340" y="73" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Train Model</text>
  <line x1="340" y1="86" x2="340" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <rect x="290" y="110" width="100" height="36" rx="4" fill="#7b1fa2"/>
  <text x="340" y="133" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Evaluate</text>
  <line x1="290" y1="128" x2="210" y2="128" stroke="#94a3b8" stroke-width="2"/>
  <rect x="160" y="110" width="100" height="36" rx="4" fill="#4a148c"/>
  <text x="210" y="133" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Optimize</text>
  <line x1="160" y1="128" x2="80" y2="128" stroke="#94a3b8" stroke-width="2"/>
  <rect x="30" y="110" width="100" height="36" rx="4" fill="#6a1b9a"/>
  <text x="80" y="133" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Deploy</text>
  <text x="250" y="200" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Machine Learning involves iterative cycles of data preparation,</text>
  <text x="250" y="220" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">model training, evaluation, and deployment.</text>
</svg>
