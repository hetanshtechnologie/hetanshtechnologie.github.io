<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <rect width="500" height="300" fill="#f0f4f8"/>
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">ML Model Types</text>
  <rect x="175" y="50" width="150" height="36" rx="18" fill="#e91e63"/>
  <text x="250" y="73" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">Machine Learning</text>
  <line x1="175" y1="86" x2="100" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="250" y1="86" x2="250" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="325" y1="86" x2="400" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <rect x="30" y="120" width="140" height="36" rx="18" fill="#c2185b"/>
  <text x="100" y="143" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Supervised</text>
  <rect x="180" y="120" width="140" height="36" rx="18" fill="#9c27b0"/>
  <text x="250" y="143" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Unsupervised</text>
  <rect x="330" y="120" width="140" height="36" rx="18" fill="#7b1fa2"/>
  <text x="400" y="143" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Reinforcement</text>
  <line x1="100" y1="156" x2="100" y2="190" stroke="#94a3b8" stroke-width="2"/>
  <line x1="250" y1="156" x2="250" y2="190" stroke="#94a3b8" stroke-width="2"/>
  <rect x="20" y="190" width="160" height="36" rx="18" fill="#e91e63"/>
  <text x="100" y="213" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Regression</text>
  <rect x="170" y="190" width="160" height="36" rx="18" fill="#c2185b"/>
  <text x="250" y="213" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Clustering</text>
  <text x="250" y="280" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Three main types: supervised (labeled data), unsupervised (unlabeled data),</text>
  <text x="250" y="295" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">and reinforcement (reward-based learning).</text>
</svg>
