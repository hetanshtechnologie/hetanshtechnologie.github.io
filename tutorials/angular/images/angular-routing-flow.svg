<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <rect width="500" height="300" fill="#f0f4f8"/>
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">Angular Routing Flow</text>
  <rect x="30" y="50" width="120" height="40" rx="4" fill="#dd0031"/>
  <text x="90" y="75" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Browser URL</text>
  <line x1="150" y1="70" x2="190" y2="70" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="190" y="50" width="120" height="40" rx="4" fill="#c2185b"/>
  <text x="250" y="75" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">RouterModule</text>
  <line x1="310" y1="70" x2="350" y2="70" stroke="#94a3b8" stroke-width="2"/>
  <rect x="350" y="50" width="120" height="40" rx="4" fill="#e91e63"/>
  <text x="410" y="75" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Route Config</text>
  <line x1="410" y1="90" x2="410" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="250" y1="90" x2="250" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <rect x="90" y="120" width="140" height="40" rx="4" fill="#6366f1"/>
  <text x="160" y="145" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Load Component</text>
  <rect x="280" y="120" width="140" height="40" rx="4" fill="#6366f1"/>
  <text x="350" y="145" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Router Outlet</text>
  <text x="250" y="210" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">URL changes &rarr; Router matches path &rarr;</text>
  <text x="250" y="230" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Component loads in &lt;router-outlet&gt;</text>
</svg>
