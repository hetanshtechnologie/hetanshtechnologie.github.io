<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <rect width="500" height="350" fill="#f0f4f8"/>
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">Angular Architecture</text>
  <rect x="175" y="50" width="150" height="40" rx="4" fill="#dd0031"/>
  <text x="250" y="75" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#fff">Angular App</text>
  <line x1="175" y1="90" x2="100" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="250" y1="90" x2="250" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="325" y1="90" x2="400" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <rect x="25" y="120" width="150" height="40" rx="4" fill="#c2185b"/>
  <text x="100" y="145" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Modules</text>
  <rect x="175" y="120" width="150" height="40" rx="4" fill="#c2185b"/>
  <text x="250" y="145" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Components</text>
  <rect x="325" y="120" width="150" height="40" rx="4" fill="#c2185b"/>
  <text x="400" y="145" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Services</text>
  <line x1="100" y1="160" x2="100" y2="190" stroke="#94a3b8" stroke-width="2"/>
  <line x1="250" y1="160" x2="250" y2="190" stroke="#94a3b8" stroke-width="2"/>
  <line x1="400" y1="160" x2="400" y2="190" stroke="#94a3b8" stroke-width="2"/>
  <rect x="25" y="190" width="150" height="40" rx="4" fill="#e91e63"/>
  <text x="100" y="215" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Routing</text>
  <rect x="175" y="190" width="150" height="40" rx="4" fill="#e91e63"/>
  <text x="250" y="215" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Templates</text>
  <rect x="325" y="190" width="150" height="40" rx="4" fill="#e91e63"/>
  <text x="400" y="215" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">DI / HttpClient</text>
  <text x="250" y="280" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Angular follows a modular component-based architecture.</text>
  <text x="250" y="300" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Services are injected via Dependency Injection.</text>
</svg>
