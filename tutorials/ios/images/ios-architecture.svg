<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <rect width="500" height="300" fill="#f0f4f8"/>
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">iOS Architecture</text>
  <rect x="140" y="50" width="220" height="36" rx="18" fill="#a2001d"/>
  <text x="250" y="73" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">iOS Application</text>
  <line x1="180" y1="86" x2="100" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="250" y1="86" x2="250" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="320" y1="86" x2="400" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <rect x="20" y="120" width="160" height="36" rx="4" fill="#d32f2f"/>
  <text x="100" y="143" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Cocoa Touch Layer</text>
  <rect x="170" y="120" width="160" height="36" rx="4" fill="#d32f2f"/>
  <text x="250" y="143" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Media Layer</text>
  <rect x="320" y="120" width="160" height="36" rx="4" fill="#d32f2f"/>
  <text x="400" y="143" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Core Services</text>
  <line x1="250" y1="156" x2="250" y2="190" stroke="#94a3b8" stroke-width="2"/>
  <rect x="100" y="190" width="300" height="36" rx="18" fill="#e57373"/>
  <text x="250" y="213" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Core OS (Darwin / XNU Kernel)</text>
  <text x="250" y="270" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">iOS is built on a layered architecture with Core OS at the base.</text>
  <text x="250" y="288" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Apps interact with the Cocoa Touch framework.</text>
</svg>
