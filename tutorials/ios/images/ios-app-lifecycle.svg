<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <rect width="500" height="350" fill="#f0f4f8"/>
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">iOS App Lifecycle</text>
  <rect x="155" y="55" width="190" height="34" rx="17" fill="#a2001d"/>
  <text x="250" y="76" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Not Running</text>
  <line x1="250" y1="89" x2="250" y2="108" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="246,103 250,113 254,103" fill="#94a3b8"/>
  <rect x="155" y="115" width="190" height="34" rx="17" fill="#d32f2f"/>
  <text x="250" y="136" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Foreground (Inactive)</text>
  <line x1="250" y1="149" x2="250" y2="168" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="246,163 250,173 254,163" fill="#94a3b8"/>
  <rect x="155" y="175" width="190" height="34" rx="17" fill="#e57373"/>
  <text x="250" y="196" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Foreground (Active)</text>
  <line x1="250" y1="209" x2="250" y2="228" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="246,223 250,233 254,223" fill="#94a3b8"/>
  <rect x="155" y="235" width="190" height="34" rx="17" fill="#ef9a9a"/>
  <text x="250" y="256" text-anchor="middle" font-family="Arial" font-size="13" fill="#1e293b">Background</text>
  <line x1="250" y1="269" x2="250" y2="288" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="246,283 250,293 254,283" fill="#94a3b8"/>
  <rect x="155" y="295" width="190" height="34" rx="17" fill="#ffcdd2"/>
  <text x="250" y="316" text-anchor="middle" font-family="Arial" font-size="13" fill="#1e293b">Suspended</text>
  <text x="250" y="347" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Lifecycle: Not Running → Inactive → Active → Background → Suspended</text>
</svg>
