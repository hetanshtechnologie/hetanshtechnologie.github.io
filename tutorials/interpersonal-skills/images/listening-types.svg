<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250">
  <rect width="500" height="250" fill="#f0f4f8"/>
  <text x="250" y="25" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">Types of Listening</text>
  <rect x="120" y="50" width="100" height="36" rx="4" fill="#d946ef"/>
  <text x="170" y="73" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Active</text>
  <rect x="230" y="50" width="100" height="36" rx="4" fill="#d946ef"/>
  <text x="280" y="73" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Passive</text>
  <rect x="340" y="50" width="100" height="36" rx="4" fill="#d946ef"/>
  <text x="390" y="73" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Empathic</text>
  <rect x="10" y="100" width="110" height="36" rx="4" fill="#c026d3"/>
  <text x="65" y="123" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff">Critical</text>
  <rect x="130" y="100" width="110" height="36" rx="4" fill="#c026d3"/>
  <text x="185" y="123" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff">Appreciative</text>
  <rect x="250" y="100" width="110" height="36" rx="4" fill="#c026d3"/>
  <text x="305" y="123" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff">Discriminative</text>
  <rect x="370" y="100" width="120" height="36" rx="4" fill="#c026d3"/>
  <text x="430" y="123" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff">Comprehensive</text>
  <rect x="100" y="160" width="140" height="36" rx="4" fill="#e879f9"/>
  <text x="170" y="183" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">Mindful Listening</text>
  <rect x="250" y="160" width="140" height="36" rx="4" fill="#e879f9"/>
  <text x="320" y="183" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">Therapeutic Listening</text>
  <text x="250" y="240" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Great listeners switch between types depending on context and purpose.</text>
</svg>
