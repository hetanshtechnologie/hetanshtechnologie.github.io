<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <rect width="500" height="320" fill="#f0f4f8"/>
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">Communication Model</text>
  <rect x="30" y="70" width="140" height="50" rx="8" fill="#d946ef"/>
  <text x="100" y="90" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#fff">Sender</text>
  <text x="100" y="108" text-anchor="middle" font-family="Arial" font-size="10" fill="#fae8ff">Encodes Message</text>
  <rect x="300" y="70" width="140" height="50" rx="8" fill="#0891b2"/>
  <text x="370" y="90" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#fff">Receiver</text>
  <text x="370" y="108" text-anchor="middle" font-family="Arial" font-size="10" fill="#cffafe">Decodes Message</text>
  <line x1="170" y1="95" x2="300" y2="95" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="295,91 305,95 295,99" fill="#94a3b8"/>
  <text x="235" y="88" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Message</text>
  <text x="235" y="140" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">(Medium: speech, text, visuals)</text>
  <rect x="120" y="170" width="230" height="36" rx="6" fill="#f59e0b"/>
  <text x="235" y="193" text-anchor="middle" font-family="Arial" font-size="12" stroke="#fff">Feedback Loop</text>
  <line x1="370" y1="120" x2="370" y2="188" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="370" y1="188" x2="350" y2="188" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="188" x2="100" y2="188" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="100" y1="188" x2="100" y2="120" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="96,125 100,115 104,125" fill="#94a3b8"/>
  <text x="250" y="260" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Noise can disrupt any stage — physical, psychological, or semantic.</text>
  <text x="250" y="285" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Effective communicators check understanding through feedback.</text>
  <rect x="160" y="295" width="180" height="18" rx="4" fill="#f1f5f9"/>
  <text x="250" y="308" text-anchor="middle" font-family="Arial" font-size="10" fill="#94a3b8">Sender &larr; Context &rarr; Receiver</text>
</svg>
