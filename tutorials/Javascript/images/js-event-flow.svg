<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <rect width="500" height="300" fill="#f0f4f8"/>
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">JavaScript Event Flow</text>
  <rect x="180" y="50" width="140" height="40" rx="4" fill="#eab308"/>
  <text x="250" y="75" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Capturing Phase</text>
  <rect x="150" y="110" width="200" height="40" rx="4" fill="#3b82f6"/>
  <text x="250" y="135" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Target Phase</text>
  <rect x="180" y="170" width="140" height="40" rx="4" fill="#22c55e"/>
  <text x="250" y="195" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Bubbling Phase</text>
  <line x1="250" y1="90" x2="250" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <line x1="250" y1="150" x2="250" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <text x="250" y="250" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">window → document → &lt;html&gt; → &lt;body&gt; → target</text>
  <text x="250" y="270" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">target → &lt;body&gt; → &lt;html&gt; → document → window</text>
</svg>
