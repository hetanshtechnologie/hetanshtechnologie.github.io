<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <rect width="500" height="350" fill="#f0f4f8"/>
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">DOM Tree Structure</text>
  <rect x="200" y="50" width="100" height="30" rx="3" fill="#eab308"/>
  <text x="250" y="70" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">document</text>
  <line x1="250" y1="80" x2="250" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <rect x="200" y="100" width="100" height="30" rx="3" fill="#3b82f6"/>
  <text x="250" y="120" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">&lt;html&gt;</text>
  <line x1="140" y1="130" x2="140" y2="155" stroke="#94a3b8" stroke-width="2"/>
  <line x1="360" y1="130" x2="360" y2="155" stroke="#94a3b8" stroke-width="2"/>
  <rect x="90" y="155" width="100" height="30" rx="3" fill="#6366f1"/>
  <text x="140" y="175" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">&lt;head&gt;</text>
  <rect x="310" y="155" width="100" height="30" rx="3" fill="#6366f1"/>
  <text x="360" y="175" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">&lt;body&gt;</text>
  <line x1="90" y1="185" x2="90" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="310" y1="185" x2="235" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="310" y1="185" x2="360" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="310" y1="185" x2="460" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <rect x="40" y="210" width="100" height="30" rx="3" fill="#8b5cf6"/>
  <text x="90" y="230" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff">&lt;title&gt;</text>
  <rect x="185" y="210" width="100" height="30" rx="3" fill="#8b5cf6"/>
  <text x="235" y="230" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff">&lt;h1&gt;</text>
  <rect x="310" y="210" width="100" height="30" rx="3" fill="#8b5cf6"/>
  <text x="360" y="230" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff">&lt;p&gt;</text>
  <rect x="410" y="210" width="100" height="30" rx="3" fill="#8b5cf6"/>
  <text x="460" y="230" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff">&lt;img&gt;</text>
  <text x="250" y="290" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Every HTML element is a node in the DOM tree.</text>
  <text x="250" y="310" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">JavaScript can access and manipulate each node.</text>
</svg>
