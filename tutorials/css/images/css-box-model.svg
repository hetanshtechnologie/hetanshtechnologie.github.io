<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <rect width="500" height="350" fill="#f0f4f8"/>
  <text x="250" y="40" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">CSS Box Model</text>
  <rect x="40" y="60" width="420" height="260" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="250" y="90" text-anchor="middle" font-family="Arial" font-size="13" fill="#854d0e">Margin (outer)</text>
  <rect x="70" y="100" width="360" height="200" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="125" text-anchor="middle" font-family="Arial" font-size="13" fill="#1e3a8a">Border</text>
  <rect x="105" y="140" width="290" height="140" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="250" y="165" text-anchor="middle" font-family="Arial" font-size="13" fill="#166534">Padding</text>
  <rect x="145" y="180" width="210" height="75" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="250" y="205" text-anchor="middle" font-family="Arial" font-size="13" fill="#9d174d">Content</text>
  <text x="250" y="225" text-anchor="middle" font-family="Arial" font-size="11" fill="#9d174d">width x height</text>
</svg>
