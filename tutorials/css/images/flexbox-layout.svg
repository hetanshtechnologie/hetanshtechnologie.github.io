  <rect x="30" y="45" width="440" height="180" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="250" y="60" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e3a8a">Flex Container (display: flex)</text>
  <rect x="50" y="80" width="110" height="60" rx="3" fill="#3b82f6"/>
  <text x="105" y="115" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Item 1</text>
  <rect x="195" y="80" width="110" height="60" rx="3" fill="#6366f1"/>
  <text x="250" y="115" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Item 2</text>
  <rect x="340" y="80" width="110" height="60" rx="3" fill="#8b5cf6"/>
