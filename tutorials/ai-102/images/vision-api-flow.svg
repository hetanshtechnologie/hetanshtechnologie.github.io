<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" fill="none">
<rect width="600" height="260" rx="12" fill="#f8faff"/>
<text x="300" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0d47a1">Azure AI Vision API Flow</text>
<rect x="20" y="55" width="140" height="44" rx="8" fill="#e3f2fd" stroke="#1565c0"/><text x="90" y="73" text-anchor="middle" font-size="11" fill="#0d47a1" font-weight="600">Client App</text><text x="90" y="88" text-anchor="middle" font-size="10" fill="#555">(C# / Python / REST)</text>
<line x1="160" y1="77" x2="220" y2="77" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="220" y="50" width="160" height="54" rx="8" fill="#1565c0"/><text x="300" y="71" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Azure AI Vision</text><text x="300" y="86" text-anchor="middle" font-size="10" fill="#cce">/vision/v3.2/analyze</text><text x="300" y="98" text-anchor="middle" font-size="9" fill="#cce">Endpoints: analyze, read, tag, describe</text>
<line x1="380" y1="77" x2="440" y2="77" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="440" y="55" width="140" height="44" rx="8" fill="#e8f5e9" stroke="#2e7d32"/><text x="510" y="73" text-anchor="middle" font-size="11" fill="#1b5e20" font-weight="600">JSON Response</text><text x="510" y="88" text-anchor="middle" font-size="10" fill="#555">Tags, Caption, Objects</text>
<line x1="510" y1="99" x2="510" y2="140" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4"/>
<rect x="420" y="140" width="180" height="36" rx="8" fill="#fff3e0" stroke="#e65100"/><text x="510" y="162" text-anchor="middle" font-size="11" fill="#bf360c" font-weight="600">Post-processing</text>
<line x1="90" y1="99" x2="90" y2="140" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4"/>
<rect x="20" y="140" width="140" height="36" rx="8" fill="#fff3e0" stroke="#e65100"/><text x="90" y="162" text-anchor="middle" font-size="11" fill="#bf360c" font-weight="600">Image URL / Bytes</text>
<rect x="60" y="200" width="200" height="40" rx="8" fill="#1a1a2e"/><text x="160" y="225" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">OCR: Read API (async)</text>
<line x1="90" y1="176" x2="160" y2="200" stroke="#1a1a2e" stroke-width="1.5" stroke-dasharray="4"/>
<rect x="320" y="200" width="220" height="40" rx="8" fill="#1a1a2e"/><text x="430" y="225" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">Smart Cropping: generateThumbnail</text>
<line x1="510" y1="176" x2="430" y2="200" stroke="#1a1a2e" stroke-width="1.5" stroke-dasharray="4"/>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1565c0"/></marker></defs>
</svg>
