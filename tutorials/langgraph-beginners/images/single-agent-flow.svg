<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Segoe UI, Arial, sans-serif">
  <title>Single ReAct agent loop</title>
  <rect width="900" height="380" fill="#f8fafc" rx="8"/>
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Single agent (ReAct loop): think &rarr; act &rarr; observe &rarr; repeat</text>

  <!-- User input -->
  <rect x="20" y="90" width="150" height="50" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="95" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">USER</text>
  <text x="95" y="128" text-anchor="middle" font-size="10" fill="#64748b">&quot;Add 12 and 30&quot;</text>

  <!-- Agent node -->
  <rect x="270" y="75" width="160" height="80" rx="10" fill="#2563eb"/>
  <text x="350" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Agent node</text>
  <text x="350" y="120" text-anchor="middle" font-size="10" fill="#dbeafe">LLM + bound tools</text>
  <text x="350" y="138" text-anchor="middle" font-size="10" fill="#dbeafe">decides &amp; emits tool_calls</text>

  <!-- Router -->
  <path d="M 474 100 L 540 100 L 540 140 L 560 140" fill="none" stroke="#0f172a" stroke-width="2"/>
  <polygon points="552,134 564,140 552,146" fill="#0f172a"/>
  <rect x="560" y="118" width="90" height="44" rx="10" fill="#7c3aed"/>
  <text x="605" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Router</text>
  <text x="605" y="152" text-anchor="middle" font-size="9" fill="#ede9fe">any tool_calls?</text>

  <!-- Tools node -->
  <rect x="560" y="220" width="160" height="70" rx="10" fill="#0891b2"/>
  <text x="640" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Tools node</text>
  <text x="640" y="266" text-anchor="middle" font-size="10" fill="#cffafe">executes calculator</text>
  <text x="640" y="280" text-anchor="middle" font-size="10" fill="#cffafe">appends ToolMessage</text>

  <!-- Router to tools -->
  <line x1="605" y1="162" x2="605" y2="220" stroke="#0f172a" stroke-width="2"/>
  <text x="652" y="180" font-size="10" fill="#16a34a">yes (tool_calls)</text>
  <polygon points="599,212 611,218 599,224" fill="#0f172a"/>

  <!-- Loop back from tools to agent -->
  <path d="M 560 255 L 195 255 L 195 115 L 262 115" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="345" y="250" text-anchor="middle" font-size="10" fill="#7c3aed">observe &amp; think again (loop)</text>
  <polygon points="254,109 266,115 254,121" fill="#0f172a"/>

  <!-- Router to END -->
  <line x1="685" y1="118" x2="780" y2="100" stroke="#16a34a" stroke-width="2"/>
  <text x="760" y="112" font-size="10" fill="#16a34a">no</text>
  <rect x="790" y="80" width="95" height="50" rx="10" fill="#16a34a"/>
  <text x="837" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">END</text>
  <text x="837" y="120" text-anchor="middle" font-size="10" fill="#dcfce7">return answer</text>
  <polygon points="782,96 794,100 782,104" fill="#16a34a"/>

  <!-- user to agent -->
  <line x1="170" y1="115" x2="270" y2="115" stroke="#334155" stroke-width="2"/>
  <text x="220" y="105" text-anchor="middle" font-size="10" fill="#64748b">messages</text>
  <polygon points="262,109 274,115 262,121" fill="#334155"/>

  <!-- Step labels -->
  <text x="822" y="30" font-size="0"/><text x="24" y="330" font-size="11" fill="#64748b">Steps: 1) Agent decides next action. 2) Router forwards tool_calls to the Tools node (loop), or END when the answer is ready.</text>
</svg>