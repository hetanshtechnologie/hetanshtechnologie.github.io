<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="Segoe UI, Arial, sans-serif">
  <title>LangGraph core concepts: state, nodes, edges</title>
  <rect width="900" height="320" fill="#f8fafc" rx="8"/>
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">A LangGraph workflow is a state machine</text>

  <!-- State box -->
  <rect x="20" y="70" width="150" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="95" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">STATE</text>
  <text x="95" y="120" text-anchor="middle" font-size="11" fill="#334155">Shared dict</text>
  <text x="95" y="140" text-anchor="middle" font-size="11" fill="#334155">messages[]</text>
  <text x="95" y="160" text-anchor="middle" font-size="11" fill="#334155">notes, topic</text>
  <text x="95" y="180" text-anchor="middle" font-size="11" fill="#64748b">checked by all nodes</text>

  <!-- Node A -->
  <rect x="280" y="55" width="150" height="55" rx="10" fill="#2563eb"/>
  <text x="355" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Node: Agent</text>
  <text x="355" y="100" text-anchor="middle" font-size="10" fill="#dbeafe">reads + updates state</text>

  <!-- Node B -->
  <rect x="500" y="55" width="150" height="55" rx="10" fill="#2563eb"/>
  <text x="575" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Node: Tools</text>
  <text x="575" y="100" text-anchor="middle" font-size="10" fill="#dbeafe">runs tool calls</text>

  <!-- Node C -->
  <rect x="720" y="55" width="150" height="55" rx="10" fill="#16a34a"/>
  <text x="795" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">END</text>
  <text x="795" y="100" text-anchor="middle" font-size="10" fill="#dcfce7">stop workflow</text>

  <!-- Edges -->
  <line x1="430" y1="82" x2="500" y2="82" stroke="#0f172a" stroke-width="2"/>
  <polygon points="492,76 504,82 492,88" fill="#0f172a"/>
  <line x1="650" y1="82" x2="720" y2="82" stroke="#0f172a" stroke-width="2"/>
  <text x="684" y="72" text-anchor="middle" font-size="10" fill="#0f172a">no tools</text>
  <polygon points="712,76 724,82 712,88" fill="#0f172a"/>
  <!-- Loop back -->
  <path d="M 575 110 L 575 200 L 355 200 L 355 120" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="465" y="193" text-anchor="middle" font-size="10" fill="#0f172a">tools called ? loop back to agent</text>
  <polygon points="351,116 355,126 359,116" fill="#0f172a"/>

  <!-- Edge label A->B -->
  <line x1="225" y1="160" x2="280" y2="110" stroke="#0f172a" stroke-width="1" stroke-dasharray="4"/>
  <text x="235" y="150" font-size="10" fill="#64748b">reads state</text>
  <line x1="170" y1="160" x2="225" y2="160" stroke="#0f172a" stroke-width="1" stroke-dasharray="4"/>
  <text x="197" y="175" font-size="10" fill="#64748b">returns update</text>

  <!-- Legend -->
  <text x="24" y="250" font-size="12" font-weight="700" fill="#0f172a">Vocabulary</text>
  <rect x="24" y="262" width="14" height="14" rx="2" fill="#2563eb"/>
  <text x="46" y="274" font-size="11" fill="#334155">Node — a Python function (work unit)</text>
  <line x1="24" y1="290" x2="60" y2="290" stroke="#0f172a" stroke-width="2"/>
  <text x="70" y="294" font-size="11" fill="#334155">Edge — transition between nodes (static or conditional)</text>
  <rect x="24" y="300" width="14" height="14" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="46" y="312" font-size="11" fill="#334155">State — typed data structure passed through every node</text>
</svg>