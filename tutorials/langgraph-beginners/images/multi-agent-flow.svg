<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="Segoe UI, Arial, sans-serif">
  <title>Multi-agent workflow: Research Agent + Summarizer Agent</title>
  <rect width="920" height="400" fill="#f8fafc" rx="8"/>
  <text x="460" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Two-agent pipeline: Research Agent &rarr; Summarizer Agent</text>

  <!-- User -->
  <rect x="20" y="80" width="140" height="55" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="90" y="102" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">USER</text>
  <text x="90" y="120" text-anchor="middle" font-size="10" fill="#64748b">&quot;Explain RAG&quot;</text>

  <!-- Research agent group -->
  <rect x="230" y="55" width="230" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="345" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Research Agent</text>
  <text x="345" y="96" text-anchor="middle" font-size="10" fill="#334155">LLM + search tool</text>
  <text x="345" y="112" text-anchor="middle" font-size="10" fill="#334155">gathers sources + notes</text>
  <text x="345" y="130" text-anchor="middle" font-size="10" fill="#64748b">writes state["research_notes"]</text>
  <text x="345" y="146" text-anchor="middle" font-size="10" fill="#64748b">tool loop until enough</text>
  <rect x="345" y="152" width="2" height="2"/>

  <!-- Summarizer agent -->
  <rect x="560" y="55" width="230" height="110" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="675" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">Summarizer Agent</text>
  <text x="675" y="96" text-anchor="middle" font-size="10" fill="#334155">LLM (plain call)</text>
  <text x="675" y="112" text-anchor="middle" font-size="10" fill="#334155">reads research_notes</text>
  <text x="675" y="128" text-anchor="middle" font-size="10" fill="#334155">writes final_summary</text>

  <!-- END -->
  <rect x="850" y="67" width="60" height="50" rx="10" fill="#16a34a"/>
  <text x="880" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">END</text>
  <text x="880" y="108" text-anchor="middle" font-size="9" fill="#dcfce7">summary</text>

  <!-- Arrows -->
  <line x1="160" y1="105" x2="230" y2="105" stroke="#0f172a" stroke-width="2"/>
  <polygon points="222,99 234,105 222,111" fill="#0f172a"/>
  <text x="195" y="95" text-anchor="middle" font-size="10" fill="#64748b">topic</text>

  <line x1="460" y1="105" x2="560" y2="105" stroke="#0f172a" stroke-width="2"/>
  <text x="510" y="95" text-anchor="middle" font-size="10" fill="#64748b">notes</text>
  <polygon points="552,99 564,105 552,111" fill="#0f172a"/>

  <line x1="790" y1="92" x2="850" y2="92" stroke="#16a34a" stroke-width="2"/>
  <polygon points="842,86 854,92 842,98" fill="#16a34a"/>

  <!-- Shared state strip -->
  <rect x="230" y="225" width="560" height="90" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="510" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Shared State (typed dict)</text>
  <text x="510" y="270" text-anchor="middle" font-size="11" fill="#334155">topic: str</text>
  <text x="510" y="290" text-anchor="middle" font-size="11" fill="#334155">research_notes: str  |  final_summary: str</text>
  <line x1="345" y1="175" x2="345" y2="225" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="675" y1="165" x2="675" y2="225" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4"/>

  <text x="510" y="352" text-anchor="middle" font-size="11" fill="#64748b">Agents communicate by reading and updating the shared state, never by direct calls.</text>
</svg>