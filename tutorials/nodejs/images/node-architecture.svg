<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <rect width="500" height="300" fill="#f0f4f8"/>
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">Node.js Architecture</text>
  <rect x="150" y="50" width="200" height="36" rx="18" fill="#539e43"/>
  <text x="250" y="73" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">Node.js Application</text>
  <line x1="150" y1="86" x2="80" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="250" y1="86" x2="250" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="350" y1="86" x2="420" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <rect x="20" y="120" width="120" height="36" rx="18" fill="#66bb6a"/>
  <text x="80" y="143" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">JavaScript (V8)</text>
  <rect x="190" y="120" width="120" height="36" rx="18" fill="#66bb6a"/>
  <text x="250" y="143" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Node API (libuv)</text>
  <rect x="360" y="120" width="120" height="36" rx="18" fill="#66bb6a"/>
  <text x="420" y="143" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Event Loop</text>
  <line x1="250" y1="156" x2="250" y2="190" stroke="#94a3b8" stroke-width="2"/>
  <rect x="100" y="190" width="300" height="36" rx="18" fill="#a5d6a7"/>
  <text x="250" y="213" text-anchor="middle" font-family="Arial" font-size="13" fill="#1e293b">Operating System (Linux, macOS, Windows)</text>
  <text x="250" y="270" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Node uses V8 to run JavaScript and libuv for async I/O.</text>
  <text x="250" y="288" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">The event loop handles non-blocking operations.</text>
</svg>
