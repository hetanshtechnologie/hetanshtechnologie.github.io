<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <rect width="500" height="350" fill="#f0f4f8"/>
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">Node.js Event Loop Phases</text>
  <rect x="155" y="50" width="190" height="36" rx="18" fill="#539e43"/>
  <text x="250" y="73" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">Event Loop</text>
  <line x1="155" y1="68" x2="90" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <line x1="250" y1="86" x2="250" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <line x1="345" y1="68" x2="410" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <rect x="20" y="100" width="140" height="36" rx="4" fill="#66bb6a"/>
  <text x="90" y="123" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Timers (setTimeout)</text>
  <rect x="180" y="100" width="140" height="36" rx="4" fill="#66bb6a"/>
  <text x="250" y="123" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">I/O Callbacks</text>
  <rect x="340" y="100" width="140" height="36" rx="4" fill="#66bb6a"/>
  <text x="410" y="123" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Idle/Prepare</text>
  <line x1="90" y1="136" x2="90" y2="165" stroke="#94a3b8" stroke-width="2"/>
  <line x1="250" y1="136" x2="250" y2="165" stroke="#94a3b8" stroke-width="2"/>
  <line x1="410" y1="136" x2="410" y2="165" stroke="#94a3b8" stroke-width="2"/>
  <rect x="20" y="165" width="140" height="36" rx="4" fill="#81c784"/>
  <text x="90" y="188" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Poll (I/O events)</text>
  <rect x="180" y="165" width="140" height="36" rx="4" fill="#81c784"/>
  <text x="250" y="188" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Check (setImmediate)</text>
  <rect x="340" y="165" width="140" height="36" rx="4" fill="#81c784"/>
  <text x="410" y="188" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Close Callbacks</text>
  <text x="250" y="260" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Each phase has a FIFO queue of callbacks to execute.</text>
  <text x="250" y="280" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">The loop continues until there is no more work to do.</text>
</svg>
