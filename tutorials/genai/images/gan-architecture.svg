<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <rect width="500" height="300" fill="#f0f4f8"/>
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">GAN Architecture</text>
  <rect x="30" y="60" width="160" height="50" rx="8" fill="#7c3aed"/>
  <text x="110" y="80" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#fff">Generator</text>
  <text x="110" y="98" text-anchor="middle" font-family="Arial" font-size="10" fill="#c4b5fd">Random Noise → Fake Data</text>
  <rect x="310" y="60" width="160" height="50" rx="8" fill="#0891b2"/>
  <text x="390" y="80" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#fff">Discriminator</text>
  <text x="390" y="98" text-anchor="middle" font-family="Arial" font-size="10" fill="#cffafe">Real or Fake?</text>
  <line x1="190" y1="85" x2="310" y2="85" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="305,81 315,85 305,89" fill="#94a3b8"/>
  <rect x="150" y="165" width="200" height="40" rx="6" fill="#f59e0b"/>
  <text x="250" y="190" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">Loss Function</text>
  <line x1="110" y1="110" x2="110" y2="165" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="390" y1="110" x2="390" y2="165" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="110" y1="205" x2="110" y2="250" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="110" y="268" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">Backprop</text>
  <line x1="390" y1="205" x2="390" y2="250" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="390" y="268" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">Backprop</text>
  <text x="250" y="295" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Generator creates fakes, Discriminator tries to detect them; both improve adversarially.</text>
</svg>
