<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="500" height="220">
  <rect width="500" height="220" fill="#f0f4f8"/>
  <text x="250" y="25" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">Autoencoder Architecture</text>
  <rect x="10" y="60" width="100" height="50" rx="8" fill="#0891b2"/>
  <text x="60" y="82" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">Encoder</text>
  <text x="60" y="98" text-anchor="middle" font-family="Arial" font-size="10" fill="#cffafe">Input → Latent</text>
  <rect x="155" y="70" width="80" height="30" rx="15" fill="#7c3aed"/>
  <text x="195" y="89" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff">Latent</text>
  <rect x="280" y="60" width="100" height="50" rx="8" fill="#0891b2"/>
  <text x="330" y="82" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">Decoder</text>
  <text x="330" y="98" text-anchor="middle" font-family="Arial" font-size="10" fill="#cffafe">Latent → Output</text>
  <line x1="110" y1="85" x2="155" y2="85" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="150,81 160,85 150,89" fill="#94a3b8"/>
  <line x1="235" y1="85" x2="280" y2="85" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="275,81 285,85 275,89" fill="#94a3b8"/>
  <text x="60" y="145" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Input</text>
  <text x="195" y="145" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Compressed</text>
  <text x="195" y="158" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Representation</text>
  <text x="330" y="145" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Reconstructed</text>
  <text x="250" y="190" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">The bottleneck (latent) forces the model to learn efficient representations.</text>
  <text x="250" y="208" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">VAEs add a probabilistic twist — they output mean and variance for the latent.</text>
</svg>
