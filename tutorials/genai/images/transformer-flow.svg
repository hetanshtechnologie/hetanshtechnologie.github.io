<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450">
  <rect width="400" height="450" fill="#f0f4f8"/>
  <text x="200" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">Transformer Architecture</text>
  <rect x="100" y="50" width="200" height="36" rx="6" fill="#0891b2"/>
  <text x="200" y="73" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Input Embeddings</text>
  <line x1="200" y1="86" x2="200" y2="106" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="196,101 200,111 204,101" fill="#94a3b8"/>
  <rect x="100" y="113" width="200" height="36" rx="6" fill="#0891b2"/>
  <text x="200" y="136" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Positional Encoding</text>
  <line x1="200" y1="149" x2="200" y2="169" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="196,164 200,174 204,164" fill="#94a3b8"/>
  <rect x="60" y="176" width="280" height="36" rx="6" fill="#7c3aed"/>
  <text x="200" y="199" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Multi-Head Self-Attention</text>
  <line x1="200" y1="212" x2="200" y2="232" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="196,227 200,237 204,227" fill="#94a3b8"/>
  <rect x="60" y="239" width="280" height="36" rx="6" fill="#f59e0b"/>
  <text x="200" y="262" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Feed Forward Network</text>
  <line x1="200" y1="275" x2="200" y2="295" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="196,290 200,300 204,290" fill="#94a3b8"/>
  <rect x="100" y="302" width="200" height="36" rx="6" fill="#0891b2"/>
  <text x="200" y="325" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Output (Softmax)</text>
  <text x="70" y="215" font-family="Arial" font-size="10" fill="#64748b">&amp; Norm</text>
  <text x="70" y="258" font-family="Arial" font-size="10" fill="#64748b">&amp; Norm</text>
  <line x1="55" y1="194" x2="30" y2="194" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="30" y1="194" x2="30" y2="258" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="30" y1="258" x2="55" y2="258" stroke="#94a3b8" stroke-width="1.5" marker-end="none"/>
  <polygon points="50,254 60,258 50,262" fill="#94a3b8"/>
  <text x="20" y="230" font-family="Arial" font-size="10" fill="#64748b">+</text>
  <text x="200" y="400" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Residual connections around each sublayer.</text>
  <text x="200" y="420" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Layer normalization applied after each addition.</text>
  <text x="200" y="445" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">The decoder is similar but adds cross-attention to encoder output.</text>
</svg>
