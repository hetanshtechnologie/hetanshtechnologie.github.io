<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300"><rect width="500" height="300" fill="#f0effe" rx="12"/>
<text x="250" y="30" text-anchor="middle" fill="#4338ca" font-size="16" font-weight="bold">150 Days MAANG Roadmap</text>
<rect x="10" y="45" width="150" height="40" rx="6" fill="#6366f1"/>
<text x="85" y="70" text-anchor="middle" fill="#fff" font-size="11">Days 1-14: Arrays &amp; Strings</text>
<rect x="175" y="45" width="150" height="40" rx="6" fill="#4f46e5"/>
<text x="250" y="70" text-anchor="middle" fill="#fff" font-size="11">Days 15-29: Linked Lists &amp; Stacks</text>
<rect x="340" y="45" width="150" height="40" rx="6" fill="#4338ca"/>
<text x="415" y="70" text-anchor="middle" fill="#fff" font-size="11">Days 30-44: Trees &amp; BST</text>
<rect x="10" y="95" width="150" height="40" rx="6" fill="#3730a3"/>
<text x="85" y="120" text-anchor="middle" fill="#fff" font-size="11">Days 45-59: Binary Search</text>
<rect x="175" y="95" width="150" height="40" rx="6" fill="#312e81"/>
<text x="250" y="120" text-anchor="middle" fill="#fff" font-size="11">Days 60-74: Graphs</text>
<rect x="340" y="95" width="150" height="40" rx="6" fill="#4338ca"/>
<text x="415" y="120" text-anchor="middle" fill="#fff" font-size="11">Days 75-89: DP</text>
<rect x="10" y="145" width="150" height="40" rx="6" fill="#4f46e5"/>
<text x="85" y="170" text-anchor="middle" fill="#fff" font-size="11">Days 90-104: Greedy</text>
<rect x="175" y="145" width="150" height="40" rx="6" fill="#6366f1"/>
<text x="250" y="170" text-anchor="middle" fill="#fff" font-size="11">Days 105-119: Backtracking</text>
<rect x="340" y="145" width="150" height="40" rx="6" fill="#4f46e5"/>
<text x="415" y="170" text-anchor="middle" fill="#fff" font-size="11">Days 120-134: System Design</text>
<rect x="10" y="195" width="230" height="40" rx="6" fill="#3730a3"/>
<text x="125" y="220" text-anchor="middle" fill="#fff" font-size="11">Days 135-145: OOD + Behavioral</text>
<rect x="260" y="195" width="230" height="40" rx="6" fill="#312e81"/>
<text x="375" y="220" text-anchor="middle" fill="#fff" font-size="11">Days 146-150: Mock Interviews</text>
<text x="250" y="270" text-anchor="middle" fill="#6366f1" font-size="12">Every 15 days: Revision checkpoint</text>
<text x="250" y="288" text-anchor="middle" fill="#6b6880" font-size="11">Arrays → Strings → LL → Stacks → Trees → BS → Graphs → DP → Greedy → Backtracking → SD → OOD → Behavioral → Mocks</text>
</svg>
