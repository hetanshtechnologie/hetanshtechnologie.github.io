<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250"><rect width="400" height="250" fill="#f0effe" rx="12"/>
<rect x="140" y="10" width="120" height="35" rx="8" fill="#6366f1"/>
<text x="200" y="33" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Array</text>
<line x1="200" y1="45" x2="200" y2="60" stroke="#4338ca" stroke-width="2"/>
<rect x="60" y="60" width="120" height="35" rx="6" fill="#4f46e5"/>
<text x="120" y="83" text-anchor="middle" fill="#fff" font-size="11">Brute Force O(n²)</text>
<rect x="220" y="60" width="120" height="35" rx="6" fill="#4f46e5"/>
<text x="280" y="83" text-anchor="middle" fill="#fff" font-size="11">Hash Map O(n)</text>
<line x1="120" y1="95" x2="100" y2="115" stroke="#4f46e5" stroke-width="1.5"/>
<line x1="280" y1="95" x2="300" y2="115" stroke="#4f46e5" stroke-width="1.5"/>
<rect x="30" y="115" width="140" height="35" rx="6" fill="#3730a3"/>
<text x="100" y="138" text-anchor="middle" fill="#fff" font-size="10">Two Pointers</text>
<rect x="230" y="115" width="140" height="35" rx="6" fill="#3730a3"/>
<text x="300" y="138" text-anchor="middle" fill="#fff" font-size="10">Sliding Window</text>
<line x1="100" y1="150" x2="100" y2="170" stroke="#3730a3" stroke-width="1.5"/>
<line x1="300" y1="150" x2="300" y2="170" stroke="#3730a3" stroke-width="1.5"/>
<rect x="60" y="170" width="280" height="35" rx="6" fill="#312e81"/>
<text x="200" y="193" text-anchor="middle" fill="#fff" font-size="11">Optimized Solution (O(n) time, O(1) space)</text>
</svg>
