<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220"><rect width="400" height="220" fill="#f0effe" rx="12"/>
<rect x="100" y="10" width="200" height="35" rx="8" fill="#6366f1"/>
<text x="200" y="33" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Climbing Stairs</text>
<line x1="200" y1="45" x2="200" y2="55" stroke="#4338ca" stroke-width="2"/>
<rect x="60" y="55" width="120" height="35" rx="6" fill="#4f46e5"/>
<text x="120" y="78" text-anchor="middle" fill="#fff" font-size="11">Recursion O(2ⁿ)</text>
<rect x="220" y="55" width="120" height="35" rx="6" fill="#4f46e5"/>
<text x="280" y="78" text-anchor="middle" fill="#fff" font-size="11">Memoization O(n)</text>
<line x1="120" y1="90" x2="120" y2="105" stroke="#4f46e5" stroke-width="1.5"/>
<line x1="280" y1="90" x2="280" y2="105" stroke="#4f46e5" stroke-width="1.5"/>
<rect x="30" y="105" width="160" height="35" rx="6" fill="#3730a3"/>
<text x="110" y="128" text-anchor="middle" fill="#fff" font-size="11">Bottom-Up DP O(n)</text>
<rect x="210" y="105" width="160" height="35" rx="6" fill="#3730a3"/>
<text x="290" y="128" text-anchor="middle" fill="#fff" font-size="11">Space Optimized O(1)</text>
<line x1="110" y1="140" x2="200" y2="155" stroke="#3730a3" stroke-width="1.5"/>
<line x1="290" y1="140" x2="200" y2="155" stroke="#3730a3" stroke-width="1.5"/>
<rect x="100" y="155" width="200" height="35" rx="6" fill="#312e81"/>
<text x="200" y="178" text-anchor="middle" fill="#fff" font-size="11">DP[n] = DP[n-1] + DP[n-2]</text>
</svg>
