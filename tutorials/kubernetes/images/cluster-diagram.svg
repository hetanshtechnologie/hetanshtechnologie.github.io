<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Segoe UI, Arial, sans-serif">
  <rect x="8" y="8" width="704" height="424" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="30" y="40" font-size="16" font-weight="700" fill="#0f172a">Kubernetes Cluster</text>

  <!-- Control plane -->
  <rect x="30" y="60" width="200" height="300" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="86" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">Control Plane</text>
  <rect x="48" y="104" width="164" height="44" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="130" y="131" font-size="12" fill="#1e293b" text-anchor="middle">API Server</text>
  <rect x="48" y="156" width="164" height="44" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="130" y="183" font-size="12" fill="#1e293b" text-anchor="middle">etcd (state store)</text>
  <rect x="48" y="208" width="164" height="44" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="130" y="235" font-size="12" fill="#1e293b" text-anchor="middle">Scheduler</text>
  <rect x="48" y="260" width="164" height="44" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="130" y="287" font-size="12" fill="#1e293b" text-anchor="middle">Controller Manager</text>
  <text x="130" y="338" font-size="10.5" fill="#64748b" text-anchor="middle">- kubectl talks to the API Server</text>
  <text x="130" y="352" font-size="10.5" fill="#64748b" text-anchor="middle">- All control happens here</text>

  <!-- Worker node 1 -->
  <rect x="260" y="60" width="140" height="300" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="330" y="86" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Worker Node 1</text>
  <rect x="276" y="104" width="108" height="38" rx="6" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <text x="330" y="127" font-size="11" fill="#1e293b" text-anchor="middle">kubelet</text>
  <rect x="276" y="150" width="108" height="38" rx="6" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <text x="330" y="173" font-size="11" fill="#1e293b" text-anchor="middle">kube-proxy</text>
  <rect x="276" y="204" width="108" height="30" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="330" y="223" font-size="11" fill="#065f46" text-anchor="middle">Pod A</text>
  <rect x="276" y="240" width="108" height="30" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="330" y="259" font-size="11" fill="#065f46" text-anchor="middle">Pod B</text>
  <rect x="276" y="276" width="108" height="30" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="330" y="295" font-size="11" fill="#065f46" text-anchor="middle">Pod C</text>
  <text x="330" y="338" font-size="10.5" fill="#64748b" text-anchor="middle">Runs your apps</text>

  <!-- Worker node 2 -->
  <rect x="410" y="60" width="140" height="300" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="480" y="86" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Worker Node 2</text>
  <rect x="426" y="104" width="108" height="38" rx="6" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <text x="480" y="127" font-size="11" fill="#1e293b" text-anchor="middle">kubelet</text>
  <rect x="426" y="150" width="108" height="38" rx="6" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <text x="480" y="173" font-size="11" fill="#1e293b" text-anchor="middle">kube-proxy</text>
  <rect x="426" y="204" width="108" height="30" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="480" y="223" font-size="11" fill="#065f46" text-anchor="middle">Pod D</text>
  <rect x="426" y="240" width="108" height="30" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="480" y="259" font-size="11" fill="#065f46" text-anchor="middle">Pod E</text>
  <text x="480" y="338" font-size="10.5" fill="#64748b" text-anchor="middle">Runs your apps</text>

  <!-- Worker node 3 -->
  <rect x="560" y="60" width="140" height="300" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="630" y="86" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Worker Node 3</text>
  <rect x="576" y="104" width="108" height="38" rx="6" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <text x="630" y="127" font-size="11" fill="#1e293b" text-anchor="middle">kubelet</text>
  <rect x="576" y="150" width="108" height="38" rx="6" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <text x="630" y="173" font-size="11" fill="#1e293b" text-anchor="middle">kube-proxy</text>
  <rect x="576" y="204" width="108" height="30" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="630" y="223" font-size="11" fill="#065f46" text-anchor="middle">Pod F</text>
  <rect x="576" y="240" width="108" height="30" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="630" y="259" font-size="11" fill="#065f46" text-anchor="middle">Pod G</text>
  <text x="630" y="338" font-size="10.5" fill="#64748b" text-anchor="middle">Runs your apps</text>

  <!-- connectors -->
  <line x1="230" y1="126" x2="260" y2="126" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="230" y1="174" x2="260" y2="174" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="230" y1="232" x2="260" y2="232" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="410" y1="126" x2="426" y2="126" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="410" y1="232" x2="426" y2="232" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="560" y1="126" x2="576" y2="126" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="560" y1="232" x2="576" y2="232" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,3"/>

  <text x="360" y="408" font-size="11" fill="#475569" text-anchor="middle">kubectl (your laptop)  ——&gt;  API Server  ——&gt;  worker nodes</text>
</svg>