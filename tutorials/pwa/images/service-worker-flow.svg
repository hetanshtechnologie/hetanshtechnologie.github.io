<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <rect width="600" height="350" fill="#f0f4f8"/>
  <text x="300" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">Service Worker Lifecycle</text>
  <rect x="200" y="50" width="200" height="36" rx="18" fill="#5c6bc0"/>
  <text x="300" y="73" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">Register SW</text>
  <line x1="300" y1="86" x2="300" y2="115" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="296,110 300,120 304,110" fill="#94a3b8"/>
  <rect x="200" y="120" width="200" height="36" rx="18" fill="#7986cb"/>
  <text x="300" y="143" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">Install Event</text>
  <line x1="300" y1="156" x2="300" y2="185" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="296,180 300,190 304,180" fill="#94a3b8"/>
  <rect x="200" y="190" width="200" height="36" rx="18" fill="#9fa8da"/>
  <text x="300" y="213" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">Activate Event</text>
  <line x1="300" y1="226" x2="300" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="296,250 300,260 304,250" fill="#94a3b8"/>
  <rect x="200" y="260" width="200" height="36" rx="18" fill="#c5cae9"/>
  <text x="300" y="283" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e293b">Fetch / Message Events</text>
  <text x="300" y="335" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">The SW lifecycle: Register → Install → Activate → Fetch</text>
</svg>
