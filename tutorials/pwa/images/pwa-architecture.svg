<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <rect width="500" height="300" fill="#f0f4f8"/>
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">PWA Architecture</text>
  <rect x="140" y="50" width="220" height="36" rx="18" fill="#5c6bc0"/>
  <text x="250" y="73" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">Progressive Web App</text>
  <line x1="180" y1="86" x2="100" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="250" y1="86" x2="250" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="320" y1="86" x2="400" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <rect x="20" y="120" width="160" height="36" rx="4" fill="#7986cb"/>
  <text x="100" y="143" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Service Worker</text>
  <rect x="170" y="120" width="160" height="36" rx="4" fill="#7986cb"/>
  <text x="250" y="143" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Web App Manifest</text>
  <rect x="320" y="120" width="160" height="36" rx="4" fill="#7986cb"/>
  <text x="400" y="143" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">App Shell</text>
  <line x1="100" y1="156" x2="100" y2="190" stroke="#94a3b8" stroke-width="2"/>
  <line x1="250" y1="156" x2="250" y2="190" stroke="#94a3b8" stroke-width="2"/>
  <line x1="400" y1="156" x2="400" y2="190" stroke="#94a3b8" stroke-width="2"/>
  <rect x="20" y="190" width="160" height="36" rx="4" fill="#9fa8da"/>
  <text x="100" y="213" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Cache API / IndexedDB</text>
  <rect x="170" y="190" width="160" height="36" rx="4" fill="#9fa8da"/>
  <text x="250" y="213" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">HTTPS / Deployment</text>
  <rect x="320" y="190" width="160" height="36" rx="4" fill="#9fa8da"/>
  <text x="400" y="213" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Web APIs</text>
  <text x="250" y="275" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">PWAs combine Service Workers, Manifest, and App Shell for app-like experiences.</text>
  <text x="250" y="293" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">They work reliably regardless of network conditions.</text>
