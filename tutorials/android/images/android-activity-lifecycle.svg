  <rect x="160" y="50" width="180" height="34" rx="17" fill="#43a047"/>
  <text x="250" y="71" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">onCreate()</text>
  <line x1="250" y1="84" x2="250" y2="108" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="246,103 250,113 254,103" fill="#94a3b8"/>
  <rect x="160" y="115" width="180" height="34" rx="17" fill="#66bb6a"/>
  <text x="250" y="136" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">onStart()</text>
  <line x1="250" y1="149" x2="250" y2="173" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="246,168 250,178 254,168" fill="#94a3b8"/>
