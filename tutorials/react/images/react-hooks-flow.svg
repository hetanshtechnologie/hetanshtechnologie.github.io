  <line x1="250" y1="90" x2="250" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <rect x="160" y="110" width="180" height="40" rx="4" fill="#3b82f6"/>
  <text x="250" y="135" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">useState / useReducer</text>
  <line x1="250" y1="150" x2="130" y2="180" stroke="#94a3b8" stroke-width="2"/>
