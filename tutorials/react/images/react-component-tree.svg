<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <rect width="500" height="350" fill="#f0f4f8"/>
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">React Component Tree</text>
  <rect x="190" y="50" width="120" height="36" rx="18" fill="#61dafb"/>
  <text x="250" y="73" text-anchor="middle" font-family="Arial" font-size="13" fill="#0f172a">&lt;App /&gt;</text>
  <line x1="190" y1="86" x2="100" y2="115" stroke="#94a3b8" stroke-width="2"/>
  <line x1="310" y1="86" x2="400" y2="115" stroke="#94a3b8" stroke-width="2"/>
  <rect x="30" y="115" width="140" height="36" rx="18" fill="#3b82f6"/>
  <text x="100" y="138" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">&lt;Header /&gt;</text>
  <rect x="330" y="115" width="140" height="36" rx="18" fill="#3b82f6"/>
  <text x="400" y="138" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">&lt;Content /&gt;</text>
  <line x1="30" y1="151" x2="30" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="400" y1="151" x2="330" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="400" y1="151" x2="400" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="400" y1="151" x2="470" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <rect x="80" y="180" width="120" height="36" rx="18" fill="#6366f1"/>
  <text x="140" y="203" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">&lt;Nav /&gt;</text>
  <rect x="260" y="180" width="140" height="36" rx="18" fill="#6366f1"/>
  <text x="330" y="203" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">&lt;Sidebar /&gt;</text>
  <rect x="400" y="180" width="140" height="36" rx="18" fill="#6366f1"/>
  <text x="470" y="203" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">&lt;Footer /&gt;</text>
  <text x="250" y="280" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">React apps are built as a tree of reusable components.</text>
  <text x="250" y="300" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Each component manages its own state and renders UI.</text>
</svg>
