<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <rect width="500" height="300" fill="#f0f4f8"/>
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">Python OOP Flow</text>
  <rect x="30" y="50" width="120" height="40" rx="4" fill="#3776ab"/>
  <text x="90" y="75" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Class Definition</text>
  <line x1="150" y1="70" x2="190" y2="70" stroke="#94a3b8" stroke-width="2"/>
  <rect x="190" y="50" width="120" height="40" rx="4" fill="#1565c0"/>
  <text x="250" y="75" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Object Creation</text>
  <line x1="310" y1="70" x2="350" y2="70" stroke="#94a3b8" stroke-width="2"/>
  <rect x="350" y="50" width="120" height="40" rx="4" fill="#1e88e5"/>
  <text x="410" y="75" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Method Calls</text>
  <line x1="410" y1="90" x2="410" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="250" y1="90" x2="250" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <rect x="90" y="120" width="140" height="40" rx="4" fill="#2e7d32"/>
  <text x="160" y="145" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Inheritance</text>
  <rect x="280" y="120" width="140" height="40" rx="4" fill="#6a1b9a"/>
  <text x="350" y="145" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Polymorphism</text>
  <line x1="160" y1="160" x2="160" y2="190" stroke="#94a3b8" stroke-width="2"/>
  <line x1="350" y1="160" x2="350" y2="190" stroke="#94a3b8" stroke-width="2"/>
  <rect x="80" y="190" width="160" height="40" rx="4" fill="#43a047"/>
  <text x="160" y="215" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Encapsulation</text>
  <rect x="270" y="190" width="160" height="40" rx="4" fill="#8e24aa"/>
  <text x="350" y="215" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Abstraction</text>
  <text x="250" y="270" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Python supports full OOP with classes, inheritance, polymorphism, encapsulation, and abstraction.</text>
</svg>
