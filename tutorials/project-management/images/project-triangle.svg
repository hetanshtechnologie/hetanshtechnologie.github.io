<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <rect width="500" height="350" fill="#f0f4f8"/>
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">Project Management Triangle</text>
  <polygon points="250,60 420,280 80,280" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="250" y="55" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#d97706">Quality</text>
  <text x="420" y="300" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#d97706">Scope</text>
  <text x="80" y="300" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#d97706">Cost</text>
  <text x="250" y="170" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#92400e">Time</text>
  <line x1="250" y1="140" x2="250" y2="200" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="165" y1="200" x2="335" y2="200" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="250" y="340" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">The Iron Triangle: Trade-offs between Time, Cost, and Scope determine Quality.</text>
</svg>
