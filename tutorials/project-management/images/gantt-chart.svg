<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <rect width="500" height="300" fill="#f0f4f8"/>
  <text x="250" y="25" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">Gantt Chart Example</text>
  <text x="10" y="50" font-family="Arial" font-size="11" fill="#475569">Task</text>
  <line x1="100" y1="45" x2="490" y2="45" stroke="#cbd5e1" stroke-width="1"/>
  <text x="10" y="75" font-family="Arial" font-size="11" fill="#475569">Research</text>
  <rect x="100" y="65" width="80" height="20" rx="4" fill="#f59e0b" opacity=".8"/>
  <text x="10" y="105" font-family="Arial" font-size="11" fill="#475569">Design</text>
  <rect x="120" y="95" width="100" height="20" rx="4" fill="#3b82f6" opacity=".8"/>
  <text x="10" y="135" font-family="Arial" font-size="11" fill="#475569">Develop</text>
  <rect x="150" y="125" width="140" height="20" rx="4" fill="#22c55e" opacity=".8"/>
  <text x="10" y="165" font-family="Arial" font-size="11" fill="#475569">Test</text>
  <rect x="220" y="155" width="100" height="20" rx="4" fill="#ec4899" opacity=".8"/>
  <text x="10" y="195" font-family="Arial" font-size="11" fill="#475569">Deploy</text>
  <rect x="290" y="185" width="60" height="20" rx="4" fill="#8b5cf6" opacity=".8"/>
  <line x1="100" y1="210" x2="490" y2="210" stroke="#cbd5e1" stroke-width="1"/>
  <text x="100" y="230" font-family="Arial" font-size="9" fill="#64748b">Wk1</text>
  <text x="200" y="230" font-family="Arial" font-size="9" fill="#64748b">Wk2</text>
  <text x="300" y="230" font-family="Arial" font-size="9" fill="#64748b">Wk3</text>
  <text x="400" y="230" font-family="Arial" font-size="9" fill="#64748b">Wk4</text>
  <rect x="100" y="218" width="390" height="2" fill="#e2e8f0"/>
  <text x="250" y="280" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Gantt charts visualize task dependencies and project timelines.</text>
</svg>
