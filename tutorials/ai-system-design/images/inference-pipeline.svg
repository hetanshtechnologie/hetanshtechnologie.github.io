<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 200"><rect width="450" height="200" fill="#f5f3ff" rx="12"/>
<text x="225" y="24" text-anchor="middle" fill="#6d28d9" font-size="13" font-weight="bold">Real-Time Inference Pipeline</text>
<rect x="20" y="35" width="80" height="28" rx="5" fill="#7c3aed"/>
<text x="60" y="54" text-anchor="middle" fill="#fff" font-size="9">Request</text>
<line x1="100" y1="49" x2="130" y2="49" stroke="#7c3aed" stroke-width="2"/>
<rect x="130" y="35" width="90" height="28" rx="5" fill="#8b5cf6"/>
<text x="175" y="54" text-anchor="middle" fill="#fff" font-size="9">Feature Fetch</text>
<line x1="220" y1="49" x2="250" y2="49" stroke="#7c3aed" stroke-width="2"/>
<rect x="250" y="35" width="80" height="28" rx="5" fill="#a78bfa"/>
<text x="290" y="54" text-anchor="middle" fill="#3b0764" font-size="9">Model Eval</text>
<line x1="330" y1="49" x2="360" y2="49" stroke="#7c3aed" stroke-width="2"/>
<rect x="360" y="35" width="70" height="28" rx="5" fill="#c4b5fd"/>
<text x="395" y="54" text-anchor="middle" fill="#3b0764" font-size="9">Response</text>
<rect x="110" y="85" width="230" height="28" rx="5" fill="#6d28d9"/>
<text x="225" y="104" text-anchor="middle" fill="#e9d5ff" font-size="10">Micro-Batch Aggregator (optional)</text>
<rect x="30" y="130" width="90" height="28" rx="5" fill="#8b5cf6"/>
<text x="75" y="149" text-anchor="middle" fill="#fff" font-size="9">Cache (Redis)</text>
<line x1="120" y1="144" x2="180" y2="144" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="180" y="130" width="100" height="28" rx="5" fill="#a78bfa"/>
<text x="230" y="149" text-anchor="middle" fill="#3b0764" font-size="9">Fallback Model</text>
<line x1="280" y1="144" x2="340" y2="144" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="340" y="130" width="90" height="28" rx="5" fill="#c4b5fd"/>
<text x="385" y="149" text-anchor="middle" fill="#3b0764" font-size="9">Drift Check</text>
<text x="225" y="190" text-anchor="middle" fill="#7c6d8c" font-size="9">Latency budget: 200ms end-to-end</text>
</svg>
