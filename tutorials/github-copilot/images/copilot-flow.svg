<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Arial, sans-serif">
  <title>GitHub Copilot workflow</title>
  <rect width="900" height="400" fill="#f8fafc" rx="8"/>
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">GitHub Copilot: context in &rarr; model &rarr; suggestions &rarr; you decide</text>

  <!-- Editor context -->
  <rect x="20" y="80" width="180" height="120" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="110" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">YOUR CONTEXT</text>
  <text x="110" y="126" text-anchor="middle" font-size="10" fill="#64748b">open file + cursor</text>
  <text x="110" y="142" text-anchor="middle" font-size="10" fill="#64748b">open editor tabs</text>
  <text x="110" y="158" text-anchor="middle" font-size="10" fill="#64748b">selection / prompt</text>
  <text x="110" y="174" text-anchor="middle" font-size="10" fill="#64748b">language + path</text>

  <!-- Extension -->
  <rect x="280" y="90" width="150" height="80" rx="10" fill="#2563eb"/>
  <text x="355" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Copilot extension</text>
  <text x="355" y="136" text-anchor="middle" font-size="10" fill="#dbeafe">sends prompt + context</text>
  <text x="355" y="152" text-anchor="middle" font-size="10" fill="#dbeafe">to GitHub service</text>

  <!-- Model -->
  <rect x="520" y="90" width="150" height="80" rx="10" fill="#7c3aed"/>
  <text x="595" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Code model</text>
  <text x="595" y="136" text-anchor="middle" font-size="10" fill="#ede9fe">GPT / Codex family</text>
  <text x="595" y="152" text-anchor="middle" font-size="10" fill="#ede9fe">suggests code + text</text>

  <!-- Editor suggestion -->
  <rect x="760" y="80" width="130" height="110" rx="10" fill="#16a34a"/>
  <text x="825" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">IN EDITOR</text>
  <text x="825" y="126" text-anchor="middle" font-size="10" fill="#dcfce7">ghost text</text>
  <text x="825" y="140" text-anchor="middle" font-size="10" fill="#dcfce7">Tab to accept</text>
  <text x="825" y="154" text-anchor="middle" font-size="10" fill="#dcfce7">Esc to dismiss</text>
  <text x="825" y="168" text-anchor="middle" font-size="10" fill="#dcfce7">Alt+] next line</text>

  <!-- arrows -->
  <line x1="200" y1="130" x2="280" y2="130" stroke="#334155" stroke-width="2"/>
  <polygon points="272,124 284,130 272,136" fill="#334155"/>
  <line x1="430" y1="130" x2="520" y2="130" stroke="#334155" stroke-width="2"/>
  <polygon points="512,124 524,130 512,136" fill="#334155"/>
  <line x1="670" y1="130" x2="760" y2="130" stroke="#334155" stroke-width="2"/>
  <polygon points="752,124 764,130 752,136" fill="#334155"/>

  <!-- You decide -->
  <rect x="280" y="250" width="360" height="80" rx="10" fill="#0891b2"/>
  <text x="460" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">YOU ARE ALWAYS IN CONTROL</text>
  <text x="460" y="298" text-anchor="middle" font-size="10" fill="#cffafe">accept, reject, refine, or ask a follow-up in chat</text>
  <text x="460" y="314" text-anchor="middle" font-size="10" fill="#cffafe">review every suggestion like code written by a teammate</text>
  <path d="M 460 170 L 460 250" stroke="#0891b2" stroke-width="2"/>
  <polygon points="454,242 466,250 454,258" fill="#0891b2"/>

  <text x="25" y="365" font-size="11" fill="#64748b">Flow: your editor state is the prompt. The model returns suggestions; you accept with Tab or refine via chat. Nothing is merged into your project automatically.</text>
</svg>