<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <rect width="500" height="200" fill="#f0f4f8"/>
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">Linked List</text>
  <rect x="20" y="60" width="70" height="40" rx="4" fill="#00bcd4"/>
  <text x="55" y="85" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Head</text>
  <text x="90" y="85" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e293b">&rarr;</text>
  <rect x="100" y="60" width="70" height="40" rx="4" fill="#26c6da"/>
  <text x="135" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff">A</text>
  <text x="170" y="85" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e293b">&rarr;</text>
  <rect x="180" y="60" width="70" height="40" rx="4" fill="#4dd0e1"/>
  <text x="215" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff">B</text>
  <text x="250" y="85" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e293b">&rarr;</text>
  <rect x="260" y="60" width="70" height="40" rx="4" fill="#80deea"/>
  <text x="295" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff">C</text>
  <text x="330" y="85" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e293b">&rarr;</text>
  <rect x="340" y="60" width="70" height="40" rx="4" fill="#b2ebf2"/>
  <text x="375" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff">D</text>
  <text x="410" y="85" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e293b">&rarr;</text>
  <rect x="420" y="60" width="60" height="40" rx="4" fill="#e0f7fa"/>
  <text x="450" y="85" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e293b">null</text>
  <text x="250" y="140" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Each node contains data and a pointer to the next node.</text>
  <text x="250" y="160" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">The last node points to null.</text>
</svg>
