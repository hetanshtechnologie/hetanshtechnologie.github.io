<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mental Math Speed Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center}.topbar{width:100%;background:#1e293b;padding:12px 24px;display:flex;align-items:center;gap:16px}.topbar a{color:#38bdf8;text-decoration:none;font-weight:600}.topbar h1{font-size:1.2rem}.stats{display:flex;gap:24px;margin:20px 0;font-size:1.1rem;flex-wrap:wrap;justify-content:center}.stats span{background:#1e293b;padding:8px 16px;border-radius:8px;white-space:nowrap}.stats .score{color:#34d399;font-weight:700}.stats .level{color:#fbbf24;font-weight:700}.stats .timer{color:#f87171;font-weight:700}.stats .streak{color:#c084fc;font-weight:700}#board{background:#1e293b;border-radius:16px;padding:32px;min-width:340px;max-width:480px;width:90%;text-align:center;margin-top:12px}#question{font-size:2.6rem;font-weight:700;margin:16px 0;color:#38bdf8}.input-row{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:16px}#ansInput{background:#334155;border:2px solid #475569;color:#e2e8f0;font-size:1.6rem;padding:12px 16px;border-radius:10px;width:140px;text-align:center}#ansInput:focus{outline:none;border-color:#38bdf8}#submitBtn{background:#38bdf8;color:#0f172a;border:none;padding:12px 24px;border-radius:10px;font-size:1.2rem;font-weight:700;cursor:pointer}.progress-bar{width:100%;height:6px;background:#334155;border-radius:3px;margin-top:16px;overflow:hidden}.progress-fill{height:100%;background:#38bdf8;border-radius:3px;transition:width .1s linear}.feedback{font-size:1.4rem;font-weight:700;margin-top:12px;min-height:2rem}#startBtn,#againBtn{background:#38bdf8;color:#0f172a;border:none;padding:14px 36px;border-radius:10px;font-size:1.1rem;font-weight:700;cursor:pointer;margin-top:20px}.combo{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:3rem;font-weight:900;color:#fbbf24;pointer-events:none;opacity:0;transition:opacity .3s;z-index:10}.combo.show{opacity:1}</style>
</head>
<body>
<div class="topbar"><a href="../index.html">← Back</a><h1>Mental Math Speed Challenge</h1></div>
<div class="stats"><span>Score: <b class="score" id="score">0</b></span><span>Level: <b class="level" id="level">1</b></span><span>Streak: <b class="streak" id="streak">0</b>🔥</span><span>Time: <b class="timer" id="timer">30</b>s</span></div>
<div class="combo" id="combo"></div>
<div id="board">
<div id="startScreen"><p style="font-size:1.2rem;margin-bottom:8px">Speed Mental Math!</p><p style="color:#94a3b8;margin-bottom:16px">Solve as many problems as you can in 30 seconds.<br>Type your answer and press Enter.</p><button id="startBtn" onclick="startGame()">Start Game</button></div>
<div id="gameScreen" style="display:none"><div id="question"></div><div class="input-row"><input type="number" id="ansInput" autofocus><button id="submitBtn" onclick="submitAns()">✓</button></div><div class="progress-bar"><div class="progress-fill" id="progress" style="width:100%"></div></div><div id="feedback" class="feedback"></div></div>
<div id="endScreen" style="display:none"><p style="font-size:1.4rem;font-weight:700">Time's Up!</p><p style="margin:12px 0">Score: <span id="finalScore" style="color:#34d399;font-size:2rem;font-weight:700">0</span></p><p>Questions answered: <span id="finalQ" style="color:#38bdf8;font-weight:700">0</span></p><p>Best streak: <span id="finalStreak" style="color:#c084fc;font-weight:700">0</span></p><button id="againBtn" onclick="startGame()">Play Again</button></div>
</div>
<script>
let score,level,timer,total,currentAns,streak,bestStreak,qCount,comboTimer,tickTimer;
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function startGame(){
score=0;level=1;total=30;streak=0;bestStreak=0;qCount=0;
document.getElementById('score').textContent='0';
document.getElementById('level').textContent='1';
document.getElementById('streak').textContent='0';
document.getElementById('timer').textContent=total;
document.getElementById('startScreen').style.display='none';
document.getElementById('gameScreen').style.display='block';
document.getElementById('endScreen').style.display='none';
timer=setInterval(()=>{total--;document.getElementById('timer').textContent=total;
document.getElementById('progress').style.width=(total/30*100)+'%';
if(total<=0){clearInterval(timer);endGame();}},1000);
nextQ();
}
function endGame(){clearInterval(timer);document.getElementById('gameScreen').style.display='none';document.getElementById('endScreen').style.display='block';document.getElementById('finalScore').textContent=score;document.getElementById('finalQ').textContent=qCount;document.getElementById('finalStreak').textContent=bestStreak;}
function showCombo(text){
let el=document.getElementById('combo');el.textContent=text;el.classList.add('show');
setTimeout(()=>el.classList.remove('show'),600);
}
function genQ(){
let ops,ops2;
if(level<=2){ops=['+','-'];ops2=ops;}
else if(level<=4){ops=['+','-','*'];ops2=ops;}
else{ops=['+','-','*','÷'];ops2=ops;}
let op=pick(ops);
let a,b,answer;
if(op==='+'||op==='-'){
a=rand(10,99);b=rand(5,50);
if(op==='-'&&a<b)[a,b]=[b,a];
answer=op==='+'?a+b:a-b;
}else if(op==='*'){
a=rand(2,12);b=rand(2,12);answer=a*b;
}else{
b=rand(2,12);answer=rand(2,12);a=b*answer;
}
return{expr:`${a} ${op} ${b} = ?`,answer};
}
function nextQ(){
document.getElementById('feedback').textContent='';
document.getElementById('ansInput').value='';document.getElementById('ansInput').focus();
let q=genQ();currentAns=q.answer;
document.getElementById('question').textContent=q.expr;
}
document.getElementById('ansInput').addEventListener('keydown',e=>{if(e.key==='Enter')submitAns();});
function submitAns(){
let val=parseInt(document.getElementById('ansInput').value);
if(isNaN(val))return;
qCount++;
if(val===currentAns){
score+=10*level+streak*5;streak++;
if(streak>bestStreak)bestStreak=streak;
document.getElementById('score').textContent=score;
document.getElementById('streak').textContent=streak;
document.getElementById('feedback').textContent='✓ '+currentAns;
document.getElementById('feedback').style.color='#34d399';
if(streak===5)showCombo('5x STREAK!');
else if(streak===10)showCombo('10x ON FIRE!');
else if(streak===15)showCombo('UNSTOPPABLE!');
if(score>=level*100&&level<10){level++;document.getElementById('level').textContent=level;}
}else{
streak=0;document.getElementById('streak').textContent='0';
document.getElementById('feedback').textContent='✗ Answer: '+currentAns;
document.getElementById('feedback').style.color='#f87171';
}
setTimeout(nextQ,400);
}
</script>
</body></html>
