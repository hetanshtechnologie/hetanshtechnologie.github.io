<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Balance the Equation</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center}.topbar{width:100%;background:#1e293b;padding:12px 24px;display:flex;align-items:center;gap:16px}.topbar a{color:#38bdf8;text-decoration:none;font-weight:600}.topbar h1{font-size:1.2rem}.stats{display:flex;gap:32px;margin:20px 0;font-size:1.1rem}.stats span{background:#1e293b;padding:8px 20px;border-radius:8px}.stats .score{color:#34d399;font-weight:700}.stats .level{color:#fbbf24;font-weight:700}.stats .timer{color:#f87171;font-weight:700}#board{background:#1e293b;border-radius:16px;padding:32px;min-width:340px;max-width:520px;width:90%;text-align:center;margin-top:12px}#question{font-size:1.5rem;font-weight:600;margin:16px 0;line-height:1.8}.equation{font-size:2rem;font-weight:700;color:#38bdf8;margin:12px 0}.blank{display:inline-block;min-width:50px;border-bottom:3px solid #fbbf24;color:#fbbf24;margin:0 4px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.options button{background:#334155;border:2px solid transparent;color:#e2e8f0;font-size:1.3rem;padding:16px;border-radius:10px;cursor:pointer;transition:.2s}.options button:hover{background:#38bdf8;color:#0f172a}.options button.correct{background:#22c55e;border-color:#22c55e;color:#fff}.options button.wrong{background:#ef4444;border-color:#ef4444;color:#fff}#startBtn,#againBtn{background:#38bdf8;color:#0f172a;border:none;padding:14px 36px;border-radius:10px;font-size:1.1rem;font-weight:700;cursor:pointer;margin-top:20px}.feedback{font-size:1.4rem;font-weight:700;margin-top:12px;min-height:2rem}</style>
</head>
<body>
<div class="topbar"><a href="../index.html">← Back</a><h1>Balance the Equation</h1></div>
<div class="stats"><span>Score: <b class="score" id="score">0</b></span><span>Level: <b class="level" id="level">1</b></span><span>Time: <b class="timer" id="timer">45</b>s</span></div>
<div id="board">
<div id="startScreen"><p style="font-size:1.2rem;margin-bottom:8px">Balance the Equation!</p><p style="color:#94a3b8;margin-bottom:16px">Find the missing number that makes both sides equal.</p><button id="startBtn" onclick="startGame()">Start Game</button></div>
<div id="gameScreen" style="display:none"><div id="question"></div><div id="equation" class="equation"></div><div id="feedback" class="feedback"></div><div class="options" id="options"></div></div>
<div id="endScreen" style="display:none"><p style="font-size:1.4rem;font-weight:700">Game Over!</p><p style="margin:12px 0">Score: <span id="finalScore" style="color:#34d399;font-size:2rem;font-weight:700">0</span></p><p>Level: <span id="finalLevel" style="color:#fbbf24;font-weight:700">1</span></p><button id="againBtn" onclick="startGame()">Play Again</button></div>
</div>
<script>
let score,level,timer,total;
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function startGame(){score=0;level=1;total=45;document.getElementById('score').textContent='0';document.getElementById('level').textContent='1';document.getElementById('timer').textContent=total;document.getElementById('startScreen').style.display='none';document.getElementById('gameScreen').style.display='block';document.getElementById('endScreen').style.display='none';timer=setInterval(()=>{total--;document.getElementById('timer').textContent=total;if(total<=0){clearInterval(timer);endGame();}},1000);nextQ();}
function endGame(){clearInterval(timer);document.getElementById('gameScreen').style.display='none';document.getElementById('endScreen').style.display='block';document.getElementById('finalScore').textContent=score;document.getElementById('finalLevel').textContent=level;}
function nextQ(){
document.getElementById('feedback').textContent='';
let left,right,answer,qText;
if(level<=2){
let a=rand(1,15),b=rand(1,15);let sum=a+b;
let c=rand(1,sum-1);answer=sum-c;
qText='Find the missing number';
document.getElementById('equation').innerHTML=`${a} + ${b} = ${c} + <span class="blank">?</span>`;
}else if(level<=4){
let a=rand(2,10),b=rand(2,10);let prod=a*b;
let c=rand(2,10);answer=prod/c;
qText='Find the missing number';
document.getElementById('equation').innerHTML=`${a} × ${b} = ${c} × <span class="blank">?</span>`;
}else if(level<=6){
let a=rand(2,8),x=rand(1,10);let lhs=a*x;
let b=rand(1,5),c=lhs-b;
qText='Solve for the blank';
document.getElementById('equation').innerHTML=`${a} × <span class="blank">?</span> = ${b} + ${c}`;
answer=x;
}else{
let a=rand(2,6),x=rand(1,8),b=rand(1,10);let lhs=a*x+b;
let c=rand(2,5),d=lhs-c;let e=rand(1,5);d=d-e;
qText='Find the missing value';
document.getElementById('equation').innerHTML=`${a} × <span class="blank">?</span> + ${b} = ${c} × ${Math.round(d/c)}${d%c!==0?' + '+(d%c):''}`;
let rhs=c*Math.round(d/c);if(d%c!==0)rhs+=(d%c);
answer=x;
}
document.getElementById('question').textContent=qText;
let opts=new Set();opts.add(answer);
while(opts.size<4){let v=answer+rand(-10,10);if(v>0&&v!==answer)opts.add(v);}
let arr=Array.from(opts).sort(()=>Math.random()-.5);
let h='';arr.forEach(v=>{h+=`<button onclick="check(this,${v===answer})">${v}</button>`});
document.getElementById('options').innerHTML=h;
}
function check(el,correct){
if(el.style.pointerEvents==='none')return;
document.querySelectorAll('.options button').forEach(b=>b.style.pointerEvents='none');
if(correct){el.classList.add('correct');score+=10*level;document.getElementById('score').textContent=score;document.getElementById('feedback').textContent='✓ Balanced!';document.getElementById('feedback').style.color='#34d399';if(score>=level*100){level++;document.getElementById('level').textContent=level;}}
else{el.classList.add('wrong');document.getElementById('feedback').textContent='✗ Not quite!';document.getElementById('feedback').style.color='#f87171';}
setTimeout(nextQ,1000);
}
</script>
</body></html>
