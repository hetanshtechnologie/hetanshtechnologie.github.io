<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breathing Techniques Match</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:15px;border-bottom:2px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:18px}.topbar h1{font-size:20px}
.container{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 20px;gap:16px}
.stats{display:flex;gap:14px;justify-content:center}
.stat{background:#1e293b;padding:10px 16px;border-radius:12px;text-align:center;border:1px solid #334155}
.stat .val{font-size:22px;font-weight:bold;color:#10b981}.stat .lbl{font-size:11px;color:#94a3b8}
.level-badge{background:linear-gradient(135deg,#10b981,#06b6d4);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600}
.progress-bar{width:100%;max-width:500px;height:8px;background:#334155;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#10b981,#06b6d4);border-radius:4px;transition:width .5s}
.info-card{background:#1e293b;border-radius:16px;padding:24px;width:100%;max-width:550px;border:2px solid #334155;text-align:center}
.instruction{font-size:14px;color:#94a3b8;margin-bottom:14px}
.question-box{background:#0f172a;padding:16px;border-radius:12px;border-left:4px solid #10b981;margin-bottom:16px;text-align:left}
.question-label{font-size:12px;color:#10b981;margin-bottom:6px;font-weight:600}
.question-text{font-size:16px;line-height:1.5}
.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:500px){.options{grid-template-columns:1fr}}
.option{background:#0f172a;border:2px solid #334155;padding:12px;border-radius:12px;cursor:pointer;font-size:14px;transition:.2s;text-align:left}
.option:hover{border-color:#10b981}.option.correct{border-color:#10b981;background:#064e3b;color:#10b981}.option.wrong{border-color:#ef4444;background:#7f1d1d;color:#ef4444}
.feedback{font-size:15px;font-weight:600;min-height:24px;margin-top:12px}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 32px;border-radius:12px;font-size:16px;cursor:pointer;font-weight:600;transition:.2s}
.btn:hover{background:#2563eb}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">← Back</a><h1>🌬️ Breathing Techniques Match</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="val" id="score">0</div><div class="lbl">Score</div></div>
<div class="stat"><div class="val" id="streak">0</div><div class="lbl">Streak</div></div>
<div class="stat"><div class="val" id="qNum">1</div><div class="lbl">Question</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="level-badge" id="levelBadge">Level 1 — Basic Techniques</div>
<div class="info-card">
<div class="question-box" id="qBox">
<div class="question-label" id="qLabel">Which technique?</div>
<div class="question-text" id="qText"></div>
</div>
<div class="options" id="options"></div>
<div class="feedback" id="feedback"></div>
<button class="btn" id="nextBtn" onclick="nextQ()" style="display:none;margin-top:12px">Next →</button>
</div>
</div>
<script>
const questions=[
{q:'What is the primary benefit of 4-7-8 breathing?',label:'Benefit → Technique',ans:'Reduces anxiety and promotes sleep',opts:['Reduces anxiety and promotes sleep','Increases lung capacity','Detoxifies the blood','Strengthens core muscles']},
{q:'Which breathing technique involves rapid abdominal pumping?',label:'Identify',ans:'Kapalabhati (Skull Shining Breath)',opts:['Ujjayi Breath','Kapalabhati (Skull Shining Breath)','Bhramari Breath','Nadi Shodhana']},
{q:'Kapalabhati breathing primarily works which area?',label:'Target Area',ans:'Abdominal muscles and diaphragm',opts:['Abdominal muscles and diaphragm','Throat and vocal cords','Leg muscles','Shoulder joints']},
{q:'What is Ujjayi breath commonly called?',label:'Nickname',ans:'Ocean Breath',opts:['Lion Breath','Ocean Breath','Bee Breath','Fire Breath']},
{q:'Which technique is best for calming before sleep?',label:'Best For',ans:'4-7-8 Breathing',opts:['Kapalabhati','Box Breathing','4-7-8 Breathing','Bellows Breath']},
{q:'Nadi Shodhana (alternate nostril) balances which?',label:'Effect',ans:'Left and right brain hemispheres',opts:['Heart rate only','Left and right brain hemispheres','Blood pressure only','Digestion']},
{q:'Bhramari (bee) breath involves?',label:'How-To',ans:'Humming with ears gently covered',opts:['Rapid breathing','Humming with ears gently covered','Holding breath underwater','Counting silently']},
{q:'Which technique uses equal inhale/exhale/hold counts?',label:'Pattern',ans:'Box Breathing (Sama Vritti)',opts:['4-7-8 Breathing','Box Breathing (Sama Vritti)','Wim Hof Method','Bellows Breath']},
{q:'Kapalabhati should be avoided when?',label:'Precaution',ans:'During pregnancy or with high blood pressure',opts:['In the morning','During pregnancy or with high blood pressure','When relaxed','In cold weather']},
{q:'What does "Pranayama" literally mean?',label:'Etymology',ans:'Extension of the life force (prana)',opts:['Fast breathing','Extension of the life force (prana)','Holding breath','Nose breathing only']},
{q:'Bhastrika (bellows) breath is characterized by?',label:'Characteristics',ans:'Forceful inhale and exhale through the nose',opts:['Slow gentle breathing','Forceful inhale and exhale through the nose','Breathing through mouth','Whispering breath']},
{q:'Which breathing activates the parasympathetic nervous system?',label:'Nervous System',ans:'Slow diaphragmatic breathing',opts:['Kapalabhati','Fast hyperventilation','Slow diaphragmatic breathing','Breath retention only']}
];
let score=0,streak=0,level=1,qIdx=0,answered=false,shuffled=[];
function shuffle(){shuffled=[...questions].sort(()=>Math.random()-.5)}
function nextQ(){
answered=false;document.getElementById('feedback').textContent='';document.getElementById('nextBtn').style.display='none';
if(qIdx>=shuffled.length){shuffle();qIdx=0;level++;document.getElementById('levelBadge').textContent='Level '+level+' — '+['Basic Techniques','Intermediate','Advanced','Expert','Pranayama Master'][Math.min(level-1,4)]}
const q=shuffled[qIdx];
document.getElementById('qLabel').textContent=q.label;
document.getElementById('qText').textContent=q.q;
document.getElementById('qNum').textContent=qIdx+1;
const opts=document.getElementById('options');opts.innerHTML='';
[...q.opts].sort(()=>Math.random()-.5).forEach(o=>{
const d=document.createElement('div');d.className='option';d.textContent=o;d.onclick=()=>selectAns(d,o,q);opts.appendChild(d)});
document.getElementById('progressFill').style.width=Math.round(qIdx/shuffled.length*100)+'%'}
function selectAns(d,ans,q){
if(answered)return;answered=true;
const ok=ans===q.ans;
if(ok){score+=10+streak*2;streak++;d.classList.add('correct')}
else{streak=0;d.classList.add('wrong');document.querySelectorAll('.option').forEach(o=>{if(o.textContent===q.ans)o.classList.add('correct')})}
document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;
document.getElementById('feedback').textContent=ok?'Correct! +'+(10+(streak-1)*2)+' pts':'Answer: '+q.ans;
document.getElementById('feedback').style.color=ok?'#10b981':'#ef4444';
document.getElementById('nextBtn').style.display='inline-block';qIdx++}
shuffle();nextQ();
</script>
</body></html>
