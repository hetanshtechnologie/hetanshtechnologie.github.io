<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meditation Timer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:15px;border-bottom:2px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:18px}.topbar h1{font-size:20px}
.container{flex:1;display:flex;flex-direction:column;align-items:center;padding:30px 20px;gap:20px}
.info-card{background:#1e293b;border-radius:16px;padding:28px;text-align:center;width:100%;max-width:420px;border:2px solid #334155}
.timer-display{font-size:64px;font-weight:bold;margin:20px 0;letter-spacing:4px;color:#8b5cf6}
.settings{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.setting{background:#0f172a;border:2px solid #334155;border-radius:10px;padding:8px 16px;cursor:pointer;font-size:14px;color:#e2e8f0;transition:.2s}
.setting:hover,.setting.active{border-color:#8b5cf6;color:#8b5cf6}
.bell-options{display:flex;gap:10px;justify-content:center;margin:10px 0}
.bell-opt{background:#1e293b;border:2px solid #334155;padding:10px 14px;border-radius:10px;cursor:pointer;font-size:13px;color:#e2e8f0;transition:.2s}
.bell-opt:hover,.bell-opt.active{border-color:#f59e0b;color:#f59e0b}
.btn{background:#3b82f6;color:#fff;border:none;padding:14px 40px;border-radius:12px;font-size:18px;cursor:pointer;font-weight:600;transition:.2s}
.btn:hover{background:#2563eb}.btn:disabled{opacity:.5}
.btn-stop{background:#ef4444}.btn-stop:hover{background:#dc2626}
.btn-secondary{background:#334155;color:#e2e8f0;border:2px solid #475569}
.btn-secondary:hover{background:#475569}
.stats-row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.stat{background:#1e293b;padding:12px 18px;border-radius:12px;text-align:center;border:1px solid #334155;min-width:80px}
.stat .val{font-size:22px;font-weight:bold;color:#8b5cf6}.stat .lbl{font-size:11px;color:#94a3b8;margin-top:2px}
.motivation{font-size:16px;color:#94a3b8;margin-top:10px;min-height:40px}
.level-badge{background:linear-gradient(135deg,#8b5cf6,#ec4899);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600}
.breath-guide{display:none;margin:12px 0;font-size:14px;color:#94a3b8}
.breath-guide.show{display:block}
.breath-dot{width:16px;height:16px;border-radius:50%;background:#8b5cf6;margin:10px auto;display:inline-block;transition:transform 1s,opacity 1s}
.breath-dot.active{animation:breathe 8s infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.4}25%{transform:scale(2);opacity:1}50%{transform:scale(2);opacity:1}75%{transform:scale(1);opacity:.4}}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">← Back</a><h1>🧘 Meditation Timer</h1></div>
<div class="container">
<div class="stats-row">
<div class="stat"><div class="val" id="sessions">0</div><div class="lbl">Sessions</div></div>
<div class="stat"><div class="val" id="totalMin">0</div><div class="lbl">Total Min</div></div>
<div class="stat"><div class="val" id="streak">0</div><div class="lbl">Streak</div></div>
</div>
<div class="level-badge" id="levelBadge">Level 1 — Seeker</div>
<div class="info-card">
<div style="font-size:18px;font-weight:600;margin-bottom:4px">Set Duration</div>
<div class="settings" id="durationSettings">
<div class="setting active" onclick="setDuration(60,this)">1 min</div>
<div class="setting" onclick="setDuration(180,this)">3 min</div>
<div class="setting" onclick="setDuration(300,this)">5 min</div>
<div class="setting" onclick="setDuration(600,this)">10 min</div>
<div class="setting" onclick="setDuration(900,this)">15 min</div>
<div class="setting" onclick="setDuration(1800,this)">30 min</div>
</div>
<div style="font-size:14px;color:#94a3b8;margin-bottom:6px">Bell Sound</div>
<div class="bell-options" id="bellOpts">
<div class="bell-opt active" onclick="setBell(0,this)">🔔 Bowl</div>
<div class="bell-opt" onclick="setBell(1,this)">🎵 Chime</div>
<div class="bell-opt" onclick="setBell(2,this)">🔔 Soft</div>
<div class="bell-opt" onclick="setBell(3,this)">none</div>
</div>
<div class="timer-display" id="timerDisplay">1:00</div>
<div class="breath-guide" id="breathGuide"><div class="breath-dot" id="breathDot"></div><div id="breathText">Breathe with the guide...</div></div>
<div style="display:flex;gap:12px;margin-top:10px">
<button class="btn" id="startBtn" onclick="toggleMeditation()">Begin</button>
<button class="btn btn-stop" onclick="resetMeditation()">End Session</button>
</div>
<div class="motivation" id="motivation">"The mind is everything. What you think you become." — Buddha</div>
</div>
</div>
<script>
const quotes=['"The mind is everything. What you think you become." — Buddha','"Quiet the mind, and the soul will speak." — Ma Jaya Sati Bhagavati','"Meditation is not about stopping thoughts, but recognizing that we are more than our thoughts." — Arianna Huffington','"The thing about meditation is: you become more and more you." — David Lynch','"Peace comes from within. Do not seek it without." — Buddha','"In the midst of movement and chaos, keep stillness inside of you." — Deepak Chopra','"Meditation is a way for nourishing and blossoming the divinity within you." — Amit Ray','"Your calm mind is the ultimate weapon against your challenges." — Bryant McGill'];
let audioCtx,duration=60,remaining=60,bellType=0,running=false,interval=null,sessions=0,totalMin=0,streak=0,level=1;
function getCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}
function playBell(){if(bellType===3)return;const ctx=getCtx();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);if(bellType===0){osc.type='sine';osc.frequency.setValueAtTime(440,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(196,ctx.currentTime+2);gain.gain.setValueAtTime(0.5,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+3);osc.start();osc.stop(ctx.currentTime+3)}else if(bellType===1){[523,659,784].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.3,ctx.currentTime+i*0.15);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.15+1.5);o.start(ctx.currentTime+i*0.15);o.stop(ctx.currentTime+i*0.15+1.5)})}else{osc.type='sine';osc.frequency.value=396;gain.gain.setValueAtTime(0.3,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+4);osc.start();osc.stop(ctx.currentTime+4)}
}
function setDuration(d,el){if(running)return;duration=d;remaining=d;document.querySelectorAll('.settings .setting').forEach(s=>s.classList.remove('active'));el.classList.add('active');formatTimer();playBell()}
function setBell(b,el){bellType=b;document.querySelectorAll('.bell-opt').forEach(s=>s.classList.remove('active'));el.classList.add('active')}
function formatTimer(){const m=Math.floor(remaining/60),s=remaining%60;document.getElementById('timerDisplay').textContent=m+':'+String(s).padStart(2,'0')}
function toggleMeditation(){if(running){stopMeditation()}else{startMeditation()}}
function startMeditation(){running=true;remaining=duration;document.getElementById('startBtn').textContent='Pause';document.getElementById('breathGuide').classList.add('show');document.getElementById('breathDot').classList.add('active');playBell();runTick()}
function stopMeditation(){running=false;clearTimeout(interval);document.getElementById('startBtn').textContent='Resume';document.getElementById('breathGuide').classList.remove('show');document.getElementById('breathDot').classList.remove('active')}
function resetMeditation(){running=false;clearTimeout(interval);if(remaining<duration&&remaining>0){const used=(duration-remaining);sessions++;totalMin+=Math.round(used/60);streak++;level=Math.floor(sessions/3)+1;document.getElementById('sessions').textContent=sessions;document.getElementById('totalMin').textContent=totalMin;document.getElementById('streak').textContent=streak;document.getElementById('levelBadge').textContent='Level '+level+' — '+['Seeker','Observer','Sage','Enlightened','Buddha'][Math.min(level-1,4)]}remaining=duration;formatTimer();document.getElementById('startBtn').textContent='Begin';document.getElementById('breathGuide').classList.remove('show');document.getElementById('breathDot').classList.remove('active');document.getElementById('motivation').textContent=quotes[Math.floor(Math.random()*quotes.length)]}
function runTick(){if(!running)return;remaining--;formatTimer();if(remaining<=0){running=false;playBell();setTimeout(()=>{playBell()},2000);sessions++;totalMin+=Math.round(duration/60);streak++;level=Math.floor(sessions/3)+1;document.getElementById('sessions').textContent=sessions;document.getElementById('totalMin').textContent=totalMin;document.getElementById('streak').textContent=streak;document.getElementById('levelBadge').textContent='Level '+level+' — '+['Seeker','Observer','Sage','Enlightened','Buddha'][Math.min(level-1,4)];remaining=duration;formatTimer();document.getElementById('startBtn').textContent='Begin';document.getElementById('breathGuide').classList.remove('show');document.getElementById('breathDot').classList.remove('active');return}interval=setTimeout(runTick,1000)}
</script>
</body></html>
