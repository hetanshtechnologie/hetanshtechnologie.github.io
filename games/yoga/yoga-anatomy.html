<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yoga Anatomy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:15px;border-bottom:2px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:18px}.topbar h1{font-size:20px}
.container{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 20px;gap:16px}
.stats{display:flex;gap:14px;justify-content:center}
.stat{background:#1e293b;padding:10px 16px;border-radius:12px;text-align:center;border:1px solid #334155}
.stat .val{font-size:22px;font-weight:bold;color:#06b6d4}.stat .lbl{font-size:11px;color:#94a3b8}
.level-badge{background:linear-gradient(135deg,#06b6d4,#8b5cf6);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600}
.progress-bar{width:100%;max-width:500px;height:8px;background:#334155;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#06b6d4,#8b5cf6);border-radius:4px;transition:width .5s}
.info-card{background:#1e293b;border-radius:16px;padding:24px;width:100%;max-width:500px;border:2px solid #334155;text-align:center}
.pose-display{font-size:56px;margin:6px 0}
.pose-name{font-size:18px;font-weight:600;color:#06b6d4;margin-bottom:4px}
.pose-desc{font-size:13px;color:#94a3b8;margin-bottom:12px}
.question{font-size:15px;font-weight:600;margin-bottom:12px;color:#8b5cf6}
.options{display:flex;flex-direction:column;gap:8px}
.option{background:#0f172a;border:2px solid #334155;padding:10px 14px;border-radius:12px;cursor:pointer;font-size:13px;text-align:left;transition:.2s;display:flex;align-items:center;gap:8px}
.option:hover{border-color:#06b6d4}
.option.correct{border-color:#10b981;background:#064e3b;color:#10b981}
.option.wrong{border-color:#ef4444;background:#7f1d1d;color:#ef4444}
.option .check{font-size:14px;min-width:20px;text-align:center}
.feedback{font-size:15px;font-weight:600;min-height:24px;margin-top:10px}
.explanation{background:#0f172a;padding:10px;border-radius:8px;font-size:12px;color:#94a3b8;margin-top:8px;display:none;text-align:left;border-left:3px solid #10b981}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 32px;border-radius:12px;font-size:16px;cursor:pointer;font-weight:600;transition:.2s}
.btn:hover{background:#2563eb}
.muscle-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.muscle-tag{background:#1e293b;padding:4px 10px;border-radius:20px;font-size:11px;border:1px solid #334155}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">← Back</a><h1>💪 Yoga Anatomy</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="val" id="score">0</div><div class="lbl">Score</div></div>
<div class="stat"><div class="val" id="streak">0</div><div class="lbl">Streak</div></div>
<div class="stat"><div class="val" id="qNum">1</div><div class="lbl">Question</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="level-badge" id="levelBadge">Level 1 — Major Muscles</div>
<div class="info-card">
<div class="pose-display" id="poseEmoji">🧘‍♀️</div>
<div class="pose-name" id="poseName"></div>
<div class="pose-desc" id="poseDesc"></div>
<div class="question" id="question"></div>
<div class="options" id="options"></div>
<div class="explanation" id="explanation"></div>
<div class="feedback" id="feedback"></div>
<button class="btn" id="nextBtn" onclick="nextQ()" style="display:none;margin-top:12px">Next →</button>
</div>
</div>
<script>
const questions=[
{emoji:'🧘‍♀️',name:'Warrior II',desc:'Standing with arms extended, front knee bent at 90°',q:'Which muscle is the PRIMARY mover in Warrior II?',ans:'Quadriceps (front thigh)',opts:['Quadriceps (front thigh)','Biceps','Deltoids only','Trapezius'],expl:'The front quadriceps bears the load of the bent knee position, acting as the primary stabilizer and strengthener.',level:1},
{emoji:'🐕',name:'Downward Facing Dog',desc:'Inverted V-shape, weight distributed between hands and feet',q:'Which muscles are primarily stretched in this pose?',ans:'Hamstrings and calves',opts:['Hamstrings and calves','Quadriceps only','Biceps','Abdominals'],expl:'The inverted V position creates a deep stretch along the entire posterior chain from heels to hips.',level:1},
{emoji:'🐍',name:'Cobra Pose',desc:'Prone, lifting chest with hands under shoulders',q:'Which muscles are strengthened in Cobra?',ans:'Erector spinae (back extensors)',opts:['Erector spinae (back extensors)','Hamstrings','Quadriceps','Hip flexors'],expl:'Cobra strengthens the muscles running along the spine, improving posture and back health.',level:1},
{emoji:'🌉',name:'Bridge Pose',desc:'Supine, knees bent, hips lifted off the floor',q:'Which muscle group is the prime mover in Bridge?',ans:'Gluteus maximus',opts:['Gluteus maximus','Deltoids','Pectorals','Biceps'],expl:'The glutes must contract powerfully to lift and hold the hips against gravity.',level:1},
{emoji:'📐',name:'Plank Pose',desc:'Body in a straight line supported by hands and toes',q:'Which muscles work hardest to maintain Plank?',ans:'Core (rectus abdominis and transverse abdominis)',opts:['Core (rectus abdominis and transverse abdominis)','Quadriceps only','Biceps','Neck muscles'],expl:'The deep core stabilizers prevent the hips from sagging, maintaining the straight-line position.',level:1},
{emoji:'🦅',name:'Eagle Pose',desc:'Standing on one leg, other leg wrapped, arms crossed',q:'Which muscle group is primarily challenged for balance?',ans:'Ankle stabilizers and hip abductors',opts:['Ankle stabilizers and hip abductors','Biceps','Chest muscles','Neck muscles'],expl:'Single-leg balance demands constant micro-adjustments from the ankle and hip stabilizers.',level:2},
{emoji:'🌳',name:'Tree Pose',desc:'Standing on one leg, other foot on inner thigh',q:'Which muscles are essential for maintaining Tree Pose?',ans:'Hip abductors (gluteus medius) and core',opts:['Hip abductors (gluteus medius) and core','Biceps','Pectorals','Trapezius'],expl:'The gluteus medius prevents the hip from dropping, while the core maintains upright posture.',level:2},
{emoji:'⭐',name:'Half Moon',desc:'Balancing on one leg and one hand, body open to side',q:'Which muscles are both stretched and strengthened?',ans:'Hamstrings (stretched) and obliques (strengthened)',opts:['Hamstrings (stretched) and obliques (strengthened)','Only biceps','Only quadriceps','Only neck muscles'],expl:'The standing leg hamstring stretches while the obliques work to keep the torso lifted and open.',level:2},
{emoji:'🚣',name:'Boat Pose',desc:'Seated, legs and torso lifted forming V-shape',q:'Which muscles are primarily working in Boat Pose?',ans:'Hip flexors and deep core',opts:['Hip flexors and deep core','Shoulders only','Calves only','Neck muscles'],expl:'The hip flexors hold the legs up while the transverse abdominis stabilizes the spine in the V-shape.',level:2},
{emoji:'🤸',name:'Crow Pose',desc:'Hands on floor, knees on upper arms, feet lifted',q:'Which muscles bear the most weight?',ans:'Triceps, wrists, and core',opts:['Triceps, wrists, and core','Legs only','Back muscles only','Neck muscles'],expl:'The triceps extend the arms, wrists stabilize, and the core prevents the body from tipping forward.',level:3},
{emoji:'🦵',name:'Pigeon Pose',desc:'Front leg bent on floor, back leg extended behind',q:'Which muscles are being stretched in Pigeon?',ans:'Hip flexors and external rotators (piriformis)',opts:['Hip flexors and external rotators (piriformis)','Biceps','Chest','Neck'],expl:'The back leg stretches the hip flexor while the front leg targets the deep external rotators of the hip.',level:2},
{emoji:'🐍',name:'King Cobra',desc:'Deep backbend with feet reaching toward the head',q:'Which muscle group is most at risk if unprepared?',ans:'Lower back (lumbar erectors)',opts:['Lower back (lumbar erectors)','Biceps','Ankles','Fingers'],expl:'Without proper warm-up and core engagement, the lumbar spine can compress dangerously in deep backbends.',level:3}
];
let score=0,streak=0,level=1,qIdx=0,answered=false,shuffled=[];
function shuffle(){shuffled=[...questions].sort(()=>Math.random()-.5)}
function nextQ(){
answered=false;document.getElementById('feedback').textContent='';document.getElementById('nextBtn').style.display='none';document.getElementById('explanation').style.display='none';
if(qIdx>=shuffled.length){shuffle();qIdx=0;level++;document.getElementById('levelBadge').textContent='Level '+level+' — '+['Major Muscles','Stabilizers','Advanced Anatomy','Kinesiology Master'][Math.min(level-1,3)]}
const q=shuffled[qIdx];
document.getElementById('poseEmoji').textContent=q.emoji;
document.getElementById('poseName').textContent=q.name;
document.getElementById('poseDesc').textContent=q.desc;
document.getElementById('question').textContent=q.q;
document.getElementById('qNum').textContent=qIdx+1;
const opts=document.getElementById('options');opts.innerHTML='';
[...q.opts].sort(()=>Math.random()-.5).forEach(o=>{
const d=document.createElement('div');d.className='option';
d.innerHTML='<span class="check">○</span>'+o;d.onclick=()=>selectAns(d,o,q);opts.appendChild(d)});
document.getElementById('progressFill').style.width=Math.round(qIdx/shuffled.length*100)+'%'}
function selectAns(d,ans,q){
if(answered)return;answered=true;
const ok=ans===q.ans;
if(ok){score+=10+streak*2;streak++;d.classList.add('correct');d.querySelector('.check').textContent='✓'}
else{streak=0;d.classList.add('wrong');d.querySelector('.check').textContent='✗';
document.querySelectorAll('.option').forEach(o=>{if(o.textContent.substring(1)===q.ans){o.classList.add('correct');o.querySelector('.check').textContent='✓'}})}
document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;
document.getElementById('feedback').textContent=ok?'Correct! +'+(10+(streak-1)*2)+' pts':'Answer: '+q.ans;
document.getElementById('feedback').style.color=ok?'#10b981':'#ef4444';
document.getElementById('explanation').textContent='📖 '+q.expl;document.getElementById('explanation').style.display='block';
document.getElementById('nextBtn').style.display='inline-block';qIdx++}
shuffle();nextQ();
</script>
</body></html>
