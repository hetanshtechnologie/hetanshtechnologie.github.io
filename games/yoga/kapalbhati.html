<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kapalabhati Counter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:15px;border-bottom:2px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:18px}.topbar h1{font-size:20px}
.container{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 20px;gap:16px}
.stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.stat{background:#1e293b;padding:10px 16px;border-radius:12px;text-align:center;border:1px solid #334155}
.stat .val{font-size:22px;font-weight:bold;color:#ef4444}.stat .lbl{font-size:11px;color:#94a3b8}
.level-badge{background:linear-gradient(135deg,#ef4444,#f59e0b);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600}
.info-card{background:#1e293b;border-radius:16px;padding:28px;width:100%;max-width:420px;border:2px solid #334155;text-align:center}
.counter-display{font-size:80px;font-weight:bold;color:#ef4444;margin:12px 0;transition:transform .1s}
.counter-display.pulse{transform:scale(1.1)}
.target-text{font-size:16px;color:#94a3b8;margin-bottom:4px}
.target-num{font-size:24px;font-weight:600;color:#f59e0b;margin-bottom:12px}
.abdomen-visual{width:120px;height:80px;margin:10px auto;position:relative;border-radius:50%;border:4px solid #334155;display:flex;align-items:center;justify-content:center;font-size:32px;transition:.15s}
.abdomen-visual.squeeze{border-color:#ef4444;transform:scaleX(.85);background:rgba(239,68,68,.15)}
.breath-indicator{display:flex;gap:8px;justify-content:center;margin:10px 0}
.breath-dot{width:10px;height:10px;border-radius:50%;background:#334155;transition:.3s}
.breath-dot.active{background:#ef4444;transform:scale(1.3)}
.btn{border:none;padding:14px 40px;border-radius:12px;font-size:18px;cursor:pointer;font-weight:600;transition:.2s;color:#fff}
.btn-fire{background:#ef4444}.btn-fire:hover{background:#dc2626}
.btn-secondary{background:#334155;color:#e2e8f0;border:2px solid #475569}.btn-secondary:hover{background:#475569}
.btn-success{background:#10b981}.btn-success:hover{background:#059669}
.feedback{font-size:15px;font-weight:600;min-height:24px;margin-top:8px}
.progress-bar{width:100%;max-width:420px;height:8px;background:#334155;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#ef4444,#f59e0b);border-radius:4px;transition:width .5s}
.mode-sel{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.mode-btn{background:#0f172a;border:2px solid #334155;padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px;color:#e2e8f0;transition:.2s}
.mode-btn:hover,.mode-btn.active{border-color:#ef4444;color:#ef4444}
.history{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.history-item{background:#0f172a;padding:6px 12px;border-radius:8px;font-size:12px;border:1px solid #334155}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">← Back</a><h1>🔥 Kapalabhati Counter</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="val" id="totalBreaths">0</div><div class="lbl">Total Breaths</div></div>
<div class="stat"><div class="val" id="rounds">0</div><div class="lbl">Rounds</div></div>
<div class="stat"><div class="val" id="bestRound">0</div><div class="lbl">Best Round</div></div>
<div class="stat"><div class="val" id="levelDisplay">1</div><div class="lbl">Level</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="level-badge" id="levelBadge">Level 1 — Beginner (15 breaths)</div>
<div class="info-card">
<div class="mode-sel">
<button class="mode-btn active" onclick="setMode(0,this)">Tap Counter</button>
<button class="mode-btn" onclick="setMode(1,this)">Timed Rhythm</button>
</div>
<div class="target-text">Target: <span id="targetLabel">15</span> sharp exhales</div>
<div class="target-num" id="targetDisplay">Round 1</div>
<div class="abdomen-visual" id="abdomen">腹部</div>
<div class="breath-indicator" id="breathDots"></div>
<div class="counter-display" id="counter">0</div>
<div style="font-size:13px;color:#94a3b8;margin-bottom:12px">Tap the button sharply with each exhale</div>
<div style="display:flex;gap:10px;justify-content:center">
<button class="btn btn-fire" id="breatheBtn" onclick="breathe()">💨 Exhale!</button>
<button class="btn btn-success" onclick="finishRound()">Finish Round</button>
<button class="btn btn-secondary" onclick="resetAll()">Reset</button>
</div>
<div class="feedback" id="feedback"></div>
<div class="history" id="history"></div>
</div>
</div>
<script>
const levels=[{target:15,name:'Beginner'},{target:20,name:'Intermediate'},{target:30,name:'Advanced'},{target:40,name:'Expert'},{target:50,name:'Kapalabhati Master'}];
let level=0,mode=0,breaths=0,totalBreaths=0,roundsCompleted=0,bestRound=0,rhythmMode=false,rhythmInterval=null,history=[];
function setMode(m,el){mode=m;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');
if(m===1){startRhythm()}else{stopRhythm()}}
function startRhythm(){rhythmMode=true;let rate=300;const btn=document.getElementById('breatheBtn');
rhythmInterval=setInterval(()=>{breathe();const elapsed=(breaths*rate)%1000},rate)}
function stopRhythm(){rhythmMode=false;clearInterval(rhythmInterval)}
function breathe(){
breaths++;totalBreaths++;
document.getElementById('counter').textContent=breaths;
document.getElementById('totalBreaths').textContent=totalBreaths;
const ab=document.getElementById('abdomen');ab.classList.add('squeeze');setTimeout(()=>ab.classList.remove('squeeze'),150);
document.getElementById('counter').classList.add('pulse');setTimeout(()=>document.getElementById('counter').classList.remove('pulse'),100);
const target=levels[level].target;
document.getElementById('progressFill').style.width=Math.min(breaths/target*100,100)+'%';
if(breaths>=target){document.getElementById('feedback').textContent='🎯 Target reached! Tap Finish Round.';document.getElementById('feedback').style.color='#f59e0b'}}
function finishRound(){
if(breaths===0)return;
roundsCompleted++;bestRound=Math.max(bestRound,breaths);
history.push(breaths);
document.getElementById('rounds').textContent=roundsCompleted;
document.getElementById('bestRound').textContent=bestRound;
document.getElementById('feedback').textContent='';
if(breaths>=levels[level].target){
if(level<levels.length-1){level++;document.getElementById('levelBadge').textContent='Level '+(level+1)+' — '+levels[level].name+' ('+levels[level].target+' breaths)';
document.getElementById('targetLabel').textContent=levels[level].target;
document.getElementById('levelDisplay').textContent=level+1}}
renderHistory();breaths=0;document.getElementById('counter').textContent='0';
document.getElementById('progressFill').style.width='0%';
document.getElementById('targetDisplay').textContent='Round '+(roundsCompleted+1)}
function renderHistory(){const h=document.getElementById('history');h.innerHTML='';
history.slice(-8).forEach((b,i)=>{const d=document.createElement('div');d.className='history-item';d.textContent='R'+(i+1)+': '+b+' breaths';h.appendChild(d)})}
function resetAll(){breaths=0;totalBreaths=0;roundsCompleted=0;bestRound=0;level=0;history=[];
document.getElementById('counter').textContent='0';document.getElementById('totalBreaths').textContent='0';
document.getElementById('rounds').textContent='0';document.getElementById('bestRound').textContent='0';
document.getElementById('progressFill').style.width='0%';document.getElementById('feedback').textContent='';
document.getElementById('levelBadge').textContent='Level 1 — Beginner (15 breaths)';
document.getElementById('targetLabel').textContent='15';document.getElementById('targetDisplay').textContent='Round 1';
document.getElementById('levelDisplay').textContent='1';document.getElementById('history').innerHTML='';
stopRhythm()}
function initDots(){const d=document.getElementById('breathDots');d.innerHTML='';for(let i=0;i<10;i++){const dot=document.createElement('div');dot.className='breath-dot';d.appendChild(dot)}}
function animateDots(){const dots=document.querySelectorAll('.breath-dot');let i=0;
setInterval(()=>{dots.forEach(d=>d.classList.remove('active'));if(dots[i%dots.length])dots[i%dots.length].classList.add('active');i++},200)}
initDots();animateDots();
</script>
</body></html>
