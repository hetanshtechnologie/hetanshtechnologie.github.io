<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bandhas Quiz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:15px;border-bottom:2px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:18px}.topbar h1{font-size:20px}
.container{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 20px;gap:16px}
.stats{display:flex;gap:14px;justify-content:center}
.stat{background:#1e293b;padding:10px 16px;border-radius:12px;text-align:center;border:1px solid #334155}
.stat .val{font-size:22px;font-weight:bold;color:#f59e0b}.stat .lbl{font-size:11px;color:#94a3b8}
.level-badge{background:linear-gradient(135deg,#f59e0b,#ef4444);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600}
.progress-bar{width:100%;max-width:500px;height:8px;background:#334155;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#f59e0b,#ef4444);border-radius:4px;transition:width .5s}
.info-card{background:#1e293b;border-radius:16px;padding:28px;width:100%;max-width:500px;border:2px solid #334155;text-align:center}
.body-diagram{font-size:48px;margin:8px 0}
.question-box{background:#0f172a;padding:14px;border-radius:12px;border-left:4px solid #f59e0b;margin-bottom:14px;text-align:left}
.q-label{font-size:12px;color:#f59e0b;font-weight:600;margin-bottom:4px}
.q-text{font-size:15px;line-height:1.5}
.options{display:flex;flex-direction:column;gap:8px}
.option{background:#0f172a;border:2px solid #334155;padding:12px 16px;border-radius:12px;cursor:pointer;font-size:14px;text-align:left;transition:.2s;display:flex;align-items:center;gap:10px}
.option:hover{border-color:#f59e0b}
.option.correct{border-color:#10b981;background:#064e3b;color:#10b981}
.option.wrong{border-color:#ef4444;background:#7f1d1d;color:#ef4444}
.option .letter{background:#334155;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.option.correct .letter{background:#10b981;color:#fff}.option.wrong .letter{background:#ef4444;color:#fff}
.explanation{background:#0f172a;padding:10px 14px;border-radius:8px;font-size:13px;color:#94a3b8;margin-top:10px;display:none;border-left:3px solid #10b981;text-align:left}
.feedback{font-size:15px;font-weight:600;min-height:24px;margin-top:8px}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 32px;border-radius:12px;font-size:16px;cursor:pointer;font-weight:600;transition:.2s}
.btn:hover{background:#2563eb}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">← Back</a><h1>🔒 Bandhas Quiz</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="val" id="score">0</div><div class="lbl">Score</div></div>
<div class="stat"><div class="val" id="streak">0</div><div class="lbl">Streak</div></div>
<div class="stat"><div class="val" id="qNum">1</div><div class="lbl">Question</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="level-badge" id="levelBadge">Level 1 — The Three Main Bandhas</div>
<div class="info-card">
<div class="body-diagram" id="bodyEmoji">🔒</div>
<div class="question-box">
<div class="q-label" id="qLabel">IDENTIFY</div>
<div class="q-text" id="qText"></div>
</div>
<div class="options" id="options"></div>
<div class="explanation" id="explanation"></div>
<div class="feedback" id="feedback"></div>
<button class="btn" id="nextBtn" onclick="nextQ()" style="display:none;margin-top:12px">Next →</button>
</div>
</div>
<script>
const questions=[
{q:'Which bandha involves drawing the pelvic floor muscles upward?',label:'IDENTIFY',ans:'Mula Bandha (Root Lock)',opts:['Mula Bandha (Root Lock)','Uddiyana Bandha','Jalandhara Bandha','Nauli'],emoji:'🔒',expl:'Mula Bandha engages the perineum/pelvic floor, providing a foundation of stability and energy containment.',level:1},
{q:'Uddiyana Bandha is practiced by:',label:'TECHNIQUE',ans:'Drawing the abdomen inward and upward on an exhale',opts:['Clenching the thighs','Drawing the abdomen inward and upward on an exhale','Tucking the chin to the chest','Contracting the fingers'],emoji:'🔥',expl:'Uddiyana means "flying upward" — the abdominal organs are drawn up under the ribcage after exhaling.',level:1},
{q:'Jalandhara Bandha involves:',label:'TECHNIQUE',ans:'Tucking the chin to the chest, closing the throat',opts:['Opening the throat wide','Tucking the chin to the chest, closing the throat','Twisting the spine','Lifting the heels'],emoji:'🤫',expl:'Jalandhara is the "net lock" — chin locks against the sternum, controlling energy flow through the throat chakra.',level:1},
{q:'When all three bandhas are engaged simultaneously, it is called:',label:'ADVANCED',ans:'Maha Bandha (Great Lock)',opts:['Maha Bandha (Great Lock)','Trinity Lock','Triple Seal','Complete Bandha'],emoji:'🕉️',expl:'Maha Bandha combines all three locks and is considered the master technique for energy control in advanced practice.',level:2},
{q:'Mula Bandha is primarily associated with which chakra?',label:'CHAKRA',ans:'Muladhara (Root Chakra)',opts:['Manipura (Solar Plexus)','Muladhara (Root Chakra)','Vishuddha (Throat)','Sahasrara (Crown)'],emoji:'🔴',expl:'Mula Bandha activates the root chakra at the base of the spine, connecting to earth energy and stability.',level:2},
{q:'Which bandha is essential during pranayama to prevent energy leakage?',label:'PRANAYAMA',ans:'Mula Bandha',opts:['Jalandhara Bandha only','Mula Bandha','Uddiyana Bandha only','None are needed'],emoji:'🫁',expl:'Mula Bandha contains prana within the body, preventing it from dispersing downward during breathing practices.',level:2},
{q:'Uddiyana Bandha is most safely practiced:',label:'SAFETY',ans:'On an empty stomach, after exhaling completely',opts:['After a full meal','On an empty stomach, after exhaling completely','While running','During pregnancy'],emoji:'⚠️',expl:'Never practice on a full stomach. The vacuum created requires an empty abdomen for safety and effectiveness.',level:3},
{q:'The bandhas are compared to which of the following?',label:'ANALOGY',ans:'Valves or locks that control energy flow',opts:['Muscles to strengthen','Valves or locks that control energy flow','Bones to align','Organs to massage'],emoji:'🚪',expl:'Bandhas act as energetic valves, directing and containing prana (life force) within the body\'s energy channels.',level:2},
{q:'In which pose is Jalandhara Bandha naturally maintained?',label:'APPLICATION',ans:'Shoulder Stand (Sarvangasana)',opts:['Headstand','Shoulder Stand (Sarvangasana)','Warrior I','Tree Pose'],emoji:'🙋',expl:'In shoulder stand, the chin naturally presses against the chest, creating Jalandhara Bandha organically.',level:3},
{q:'What is the relationship between bandhas and bandhas in Hatha Yoga?',label:'PHILOSOPHY',ans:'They seal energy and prevent prana from escaping through the nadis (energy channels)',opts:['They increase physical strength only','They seal energy and prevent prana from escaping through the nadis (energy channels)','They are purely physical exercises','They have no spiritual significance'],emoji:'🕉️',expl:'Bandhas are energetic seals that direct prana through the central channel (sushumna nadi) for spiritual awakening.',level:3},
{q:'Which bandha should be engaged during Kapalabhati breathing?',label:'PRACTICE',ans:'Mula Bandha (gently)',opts:['All three equally','Mula Bandha (gently)','Jalandhara Bandha','No bandha needed'],emoji:'🔥',expl:'A gentle Mula Bandha supports Kapalabhati by stabilizing the pelvic floor during rapid abdominal contractions.',level:2},
{q:'What happens when bandhas are practiced correctly over time?',label:'BENEFIT',ans:'Increased body awareness, energy control, and deeper meditation states',opts:['Increased muscle mass','Increased body awareness, energy control, and deeper meditation states','Improved eyesight','Better sleep only'],emoji:'✨',expl:'Consistent bandha practice leads to subtle energy mastery, improved concentration, and progression toward samadhi.',level:4}
];
let score=0,streak=0,level=1,qIdx=0,answered=false,shuffled=[];
function shuffle(){shuffled=[...questions].sort(()=>Math.random()-.5)}
function nextQ(){
answered=false;document.getElementById('feedback').textContent='';document.getElementById('nextBtn').style.display='none';document.getElementById('explanation').style.display='none';
if(qIdx>=shuffled.length){shuffle();qIdx=0;level++;document.getElementById('levelBadge').textContent='Level '+level+' — '+['The Three Main Bandhas','Applications','Advanced Practice','Energy Mastery'][Math.min(level-1,3)]}
const q=shuffled[qIdx];
document.getElementById('bodyEmoji').textContent=q.emoji;
document.getElementById('qLabel').textContent=q.label;
document.getElementById('qText').textContent=q.q;
document.getElementById('qNum').textContent=qIdx+1;
const opts=document.getElementById('options');opts.innerHTML='';
const letters=['A','B','C','D'];
[...q.opts].sort(()=>Math.random()-.5).forEach((o,i)=>{
const d=document.createElement('div');d.className='option';
d.innerHTML='<span class="letter">'+letters[i]+'</span>'+o;d.onclick=()=>selectAns(d,o,q);opts.appendChild(d)});
document.getElementById('progressFill').style.width=Math.round(qIdx/shuffled.length*100)+'%'}
function selectAns(d,ans,q){
if(answered)return;answered=true;
const ok=ans===q.ans;
if(ok){score+=10+streak*2;streak++;d.classList.add('correct')}
else{streak=0;d.classList.add('wrong');document.querySelectorAll('.option').forEach(o=>{if(o.textContent.substring(1)===q.ans)o.classList.add('correct')})}
document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;
document.getElementById('feedback').textContent=ok?'Correct! +'+(10+(streak-1)*2)+' pts':'Answer: '+q.ans;
document.getElementById('feedback').style.color=ok?'#10b981':'#ef4444';
document.getElementById('explanation').textContent='📖 '+q.expl;document.getElementById('explanation').style.display='block';
document.getElementById('nextBtn').style.display='inline-block';qIdx++}
shuffle();nextQ();
</script>
</body></html>
