<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yoga History Quiz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:15px;border-bottom:2px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:18px}.topbar h1{font-size:20px}
.container{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 20px;gap:16px}
.stats{display:flex;gap:14px;justify-content:center}
.stat{background:#1e293b;padding:10px 16px;border-radius:12px;text-align:center;border:1px solid #334155}
.stat .val{font-size:22px;font-weight:bold;color:#f59e0b}.stat .lbl{font-size:11px;color:#94a3b8}
.level-badge{background:linear-gradient(135deg,#f59e0b,#ec4899);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600}
.progress-bar{width:100%;max-width:500px;height:8px;background:#334155;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#f59e0b,#ec4899);border-radius:4px;transition:width .5s}
.info-card{background:#1e293b;border-radius:16px;padding:28px;width:100%;max-width:500px;border:2px solid #334155;text-align:center}
.q-icon{font-size:56px;margin:8px 0}
.q-text{font-size:16px;font-weight:600;line-height:1.5;margin-bottom:16px}
.options{display:flex;flex-direction:column;gap:8px}
.option{background:#0f172a;border:2px solid #334155;padding:12px 16px;border-radius:12px;cursor:pointer;font-size:14px;text-align:left;transition:.2s;display:flex;align-items:center;gap:10px}
.option:hover{border-color:#f59e0b}
.option.correct{border-color:#10b981;background:#064e3b;color:#10b981}
.option.wrong{border-color:#ef4444;background:#7f1d1d;color:#ef4444}
.option .letter{background:#334155;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.option.correct .letter{background:#10b981;color:#fff}.option.wrong .letter{background:#ef4444;color:#fff}
.explanation{background:#0f172a;padding:10px 14px;border-radius:8px;font-size:13px;color:#94a3b8;margin-top:10px;text-align:left;display:none;border-left:3px solid #10b981}
.feedback{font-size:15px;font-weight:600;min-height:24px;margin-top:8px}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 32px;border-radius:12px;font-size:16px;cursor:pointer;font-weight:600;transition:.2s}
.btn:hover{background:#2563eb}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">← Back</a><h1>📜 Yoga History Quiz</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="val" id="score">0</div><div class="lbl">Score</div></div>
<div class="stat"><div class="val" id="streak">0</div><div class="lbl">Streak</div></div>
<div class="stat"><div class="val" id="qNum">1</div><div class="lbl">Question</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="level-badge" id="levelBadge">Level 1 — Origins</div>
<div class="info-card">
<div class="q-icon" id="qIcon">📜</div>
<div class="q-text" id="qText"></div>
<div class="options" id="options"></div>
<div class="explanation" id="explanation"></div>
<div class="feedback" id="feedback"></div>
<button class="btn" id="nextBtn" onclick="nextQ()" style="display:none;margin-top:12px">Next →</button>
</div>
</div>
<script>
const questions=[
{q:'In which country did yoga originate?',icon:'🌍',ans:'India',opts:['India','China','Japan','Greece'],expl:'Yoga originated in ancient India over 5,000 years ago, with roots in the Indus Valley Civilization.',level:1},
{q:'What is the oldest known text on yoga?',icon:'📜',ans:'The Yoga Sutras of Patanjali',opts:['The Yoga Sutras of Patanjali','The Bhagavad Gita','The Upanishads','The Vedas'],expl:'Compiled around 400 CE, the Yoga Sutras contain 196 aphorisms systematizing yoga philosophy.',level:1},
{q:'Who is considered the father of modern yoga?',icon:'🧘‍♂️',ans:'T. Krishnamacharya',opts:['T. Krishnamacharya','B.K.S. Iyengar','Patanjali','Swami Vivekananda'],expl:'Krishnamacharya (1888-1989) is credited as the father of modern yoga and taught many influential teachers.',level:2},
{q:'The word "yoga" comes from the Sanskrit root meaning:',icon:'🔤',ans:'To yoke or unite',opts:['To yoke or unite','To bend','To breathe','To sit'],expl:'"Yuj" means to yoke or join, referring to the union of mind, body, and spirit.',level:1},
{q:'Which ancient text describes yoga as one of six orthodox schools of Hindu philosophy?',icon:'📖',ans:'The Yoga Sutras',opts:['The Yoga Sutras','The Rig Veda','The Mahabharata','The Ramayana'],expl:'Patanjali\'s Yoga Sutras formalized yoga as one of the six Astika schools of Indian philosophy.',level:2},
{q:'What is the classical period of yoga (approximate dates)?',icon:'📅',ans:'500 BCE – 500 CE',opts:['500 BCE – 500 CE','2000 BCE – 1000 BCE','1500 CE – 1700 CE','100 CE – 300 CE'],expl:'The classical period includes the Upanishads, Bhagavad Gita, and Patanjali\'s Yoga Sutras.',level:3},
{q:'Hatha Yoga emerged during which period?',icon:'🕐',ans:'Medieval period (9th–15th century CE)',opts:['Medieval period (9th–15th century CE)','Vedic period','Classical period','Modern period'],expl:'Hatha Yoga Pradipika was written in the 15th century, marking the medieval yoga period.',level:3},
{q:'Who brought yoga to the West in the 1890s?',icon:'🚢',ans:'Swami Vivekananda',opts:['Swami Vivekananda','B.K.S. Iyengar','Pattabhi Jois','Indra Devi'],expl:'Vivekananda\'s 1893 speech at the Parliament of Religions in Chicago introduced yoga to the West.',level:2},
{q:'What are the 8 limbs of yoga (Ashtanga) attributed to?',icon:'🕉️',ans:'Patanjali\'s Yoga Sutras',opts:['Patanjali\'s Yoga Sutras','Hatha Yoga Pradipika','Bhagavad Gita','Upanishads'],expl:'The eightfold path includes yama, niyama, asana, pranayama, pratyahara, dharana, dhyana, samadhi.',level:3},
{q:'The Ashtanga Vinyasa system was popularized by whom?',icon:'🔥',ans:'K. Pattabhi Jois',opts:['K. Pattabhi Jois','B.K.S. Iyengar','T.K.V. Desikachar','Sri K. Pattabhi Jois and B.K.S. Iyengar'],expl:'Pattabhi Jois established the Ashtanga Yoga Research Institute in Mysore, India in 1948.',level:4},
{q:'The Bhagavad Gita describes which types of yoga?',icon:'📖',ans:'Karma, Bhakti, Jnana, and Raja yoga',opts:['Karma, Bhakti, Jnana, and Raja yoga','Only Hatha yoga','Only Kundalini yoga','Only Vinyasa yoga'],expl:'Chapter 2-18 of the Gita describes multiple paths to liberation through different yoga types.',level:3},
{q:'What is the pre-classical period of yoga associated with?',icon:'📜',ans:'The Vedas and Upanishads',opts:['The Vedas and Upanishads','Modern postural yoga','Hatha Yoga Pradipika','Yoga Alliance certification'],expl:'The Vedic period (1500-500 BCE) produced the earliest yoga references in sacred Hindu texts.',level:2}
];
let score=0,streak=0,level=1,qIdx=0,answered=false,shuffled=[];
function shuffle(){shuffled=[...questions].sort(()=>Math.random()-.5)}
function nextQ(){
answered=false;document.getElementById('feedback').textContent='';document.getElementById('nextBtn').style.display='none';document.getElementById('explanation').style.display='none';
if(qIdx>=shuffled.length){shuffle();qIdx=0;level++;document.getElementById('levelBadge').textContent='Level '+level+' — '+['Origins','Classical','Medieval','Modern','Yoga Scholar'][Math.min(level-1,4)]}
const q=shuffled[qIdx];
document.getElementById('qIcon').textContent=q.icon;
document.getElementById('qText').textContent=q.q;
document.getElementById('qNum').textContent=qIdx+1;
const opts=document.getElementById('options');opts.innerHTML='';
const letters=['A','B','C','D'];
[...q.opts].sort(()=>Math.random()-.5).forEach((o,i)=>{
const d=document.createElement('div');d.className='option';
d.innerHTML='<span class="letter">'+letters[i]+'</span>'+o;d.onclick=()=>selectAns(d,o,q);opts.appendChild(d)});
document.getElementById('progressFill').style.width=Math.round(qIdx/shuffled.length*100)+'%'}
function selectAns(d,ans,q){
if(answered)return;answered=true;
const ok=ans===q.ans;
if(ok){score+=10+streak*2;streak++;d.classList.add('correct')}
else{streak=0;d.classList.add('wrong');document.querySelectorAll('.option').forEach(o=>{if(o.textContent.substring(1)===q.ans)o.classList.add('correct')})}
document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;
document.getElementById('feedback').textContent=ok?'Correct! +'+(10+(streak-1)*2)+' pts':'Answer: '+q.ans;
document.getElementById('feedback').style.color=ok?'#10b981':'#ef4444';
document.getElementById('explanation').textContent='📖 '+q.expl;document.getElementById('explanation').style.display='block';
document.getElementById('nextBtn').style.display='inline-block';qIdx++}
shuffle();nextQ();
</script>
</body></html>
