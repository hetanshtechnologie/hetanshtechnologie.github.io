<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yoga Nidra</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:15px;border-bottom:2px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:18px}.topbar h1{font-size:20px}
.container{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 20px;gap:16px;max-height:100vh;overflow-y:auto}
.stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.stat{background:#1e293b;padding:10px 16px;border-radius:12px;text-align:center;border:1px solid #334155}
.stat .val{font-size:22px;font-weight:bold;color:#8b5cf6}.stat .lbl{font-size:11px;color:#94a3b8}
.level-badge{background:linear-gradient(135deg,#8b5cf6,#3b82f6);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600}
.info-card{background:#1e293b;border-radius:16px;padding:24px;width:100%;max-width:500px;border:2px solid #334155;text-align:center}
.body-scan{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.scan-part{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0f172a;border-radius:10px;border:2px solid #334155;transition:.5s;text-align:left}
.scan-part.active{border-color:#8b5cf6;background:#1e1b4b}
.scan-part.done{border-color:#10b981;background:#064e3b}
.scan-part .emoji{font-size:20px;min-width:28px;text-align:center}
.scan-part .text{flex:1}
.scan-part .name{font-size:14px;font-weight:600}.scan-part .instruction{font-size:12px;color:#94a3b8}
.timer-display{font-size:36px;font-weight:bold;color:#8b5cf6;margin:12px 0}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 32px;border-radius:12px;font-size:16px;cursor:pointer;font-weight:600;transition:.2s}
.btn:hover{background:#2563eb}
.btn-danger{background:#ef4444}.btn-danger:hover{background:#dc2626}
.feedback{font-size:15px;font-weight:600;min-height:24px;margin-top:8px}
.progress-bar{width:100%;max-width:500px;height:8px;background:#334155;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#3b82f6);border-radius:4px;transition:width .5s}
.q-card{background:#0f172a;border-radius:12px;padding:16px;margin:8px 0;border-left:4px solid #8b5cf6;text-align:left}
.q-label{font-size:12px;color:#8b5cf6;font-weight:600;margin-bottom:4px}
.q-text{font-size:15px;line-height:1.5}
.quiz-section{display:none}
.quiz-options{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.quiz-opt{background:#1e293b;border:2px solid #334155;padding:10px 14px;border-radius:10px;cursor:pointer;font-size:13px;transition:.2s;text-align:left}
.quiz-opt:hover{border-color:#8b5cf6}.quiz-opt.correct{border-color:#10b981;background:#064e3b}.quiz-opt.wrong{border-color:#ef4444;background:#7f1d1d}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">← Back</a><h1>🧘 Yoga Nidra — Progressive Relaxation</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="val" id="score">0</div><div class="lbl">Score</div></div>
<div class="stat"><div class="val" id="parts">0</div><div class="lbl">Parts Scanned</div></div>
<div class="stat"><div class="val" id="totalTime">0:00</div><div class="lbl">Time</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="level-badge" id="levelBadge">Level 1 — Body Scan</div>
<div class="info-card" id="scanCard">
<div class="timer-display" id="timerDisplay">0:00</div>
<div class="body-scan" id="bodyScan"></div>
<div class="feedback" id="feedback"></div>
<div style="display:flex;gap:10px;justify-content:center;margin-top:12px">
<button class="btn" id="startBtn" onclick="startScan()">Begin Relaxation</button>
<button class="btn btn-danger" onclick="resetScan()">Reset</button>
</div>
</div>
<div class="info-card quiz-section" id="quizCard">
<div class="q-card">
<div class="q-label">KNOWLEDGE CHECK</div>
<div class="q-text" id="quizQ"></div>
</div>
<div class="quiz-options" id="quizOpts"></div>
<div class="feedback" id="quizFeedback"></div>
<button class="btn" id="quizNext" onclick="nextQuiz()" style="display:none;margin-top:12px">Next Quiz →</button>
</div>
</div>
<script>
const bodyParts=[
{emoji:'🦶',name:'Feet',instruction:'Bring awareness to your feet. Notice any sensations — warmth, tingling, pressure. Let them soften and relax completely.'},
{emoji:'🦵',name:'Calves & Shins',instruction:'Feel your lower legs. Let the muscles release. Any tension melts away as you breathe.'},
{emoji:'🦿',name:'Knees & Thighs',instruction:'Focus on your knees and thighs. Let them grow heavy and supported by the ground beneath you.'},
{emoji:'🍑',name:'Hips & Pelvis',instruction:'Bring attention to your hips. This area holds much tension. Let it dissolve with each exhale.'},
{emoji:'🫁',name:'Abdomen & Chest',instruction:'Feel your belly rise and fall. Your chest opens. Breathing becomes effortless and deep.'},
{emoji:'🤲',name:'Hands & Arms',instruction:'Notice your fingers, palms, wrists. Let them tingle with warmth and release completely.'},
{emoji:'💪',name:'Shoulders & Neck',instruction:'Soften your shoulders away from your ears. Release your jaw. Let your neck be long and free.'},
{emoji:'🙆',name:'Face & Scalp',instruction:'Smooth your forehead. Relax your eyes, cheeks, jaw. Let your whole face be at ease.'},
{emoji:'🧠',name:'Mind',instruction:'Observe your thoughts without attachment. They are clouds passing through a vast, still sky.'},
{emoji:'✨',name:'Whole Body',instruction:'Feel your entire body as one unified field of awareness. Safe, supported, deeply at peace.'}
];
const quizQuestions=[
{q:'What is Yoga Nidra often called?',ans:'Yogic Sleep',opts:['Yogic Sleep','Active Meditation','Power Rest','Dynamic Relaxation']},
{q:'Yoga Nidra is practiced in which body position?',ans:'Savasana (lying down)',opts:['Sitting upright','Standing','Savasana (lying down)','Lotus pose']},
{q:'How long is a typical Yoga Nidra session?',ans:'20-45 minutes',opts:['5 minutes','20-45 minutes','2 hours','10 minutes']},
{q:'Yoga Nidra guides you between which two states?',ans:'Waking and sleeping consciousness',opts:['Yelling and whispering','Waking and sleeping consciousness','Hot and cold','Light and dark']},
{q:'What does "Nidra" literally translate to?',ans:'Sleep',opts:['Sleep','Dream','Breath','Movement']},
{q:'Which brainwave state does Yoga Nidra primarily access?',ans:'Theta waves',opts:['Beta waves','Theta waves','Gamma waves','Only alpha waves']},
{q:'A Sankalpa in Yoga Nidra is:',ans:'A positive resolve or intention',opts:['A physical movement','A positive resolve or intention','A breathing technique','A visualization']},
{q:'Yoga Nidra was formalized in modern form by:',ans:'Swami Satyananda Saraswati',opts:['Swami Satyananda Saraswati','T. Krishnamacharya','Patanjali','B.K.S. Iyengar']}
];
let score=0,partIdx=0,running=false,interval=null,elapsed=0,scanInterval=null,quizIdx=0,answered=false,shuffledQuiz=[];
function initScan(){
const container=document.getElementById('bodyScan');container.innerHTML='';
bodyParts.forEach((p,i)=>{
const div=document.createElement('div');div.className='scan-part';div.id='part-'+i;
div.innerHTML='<span class="emoji">'+p.emoji+'</span><div class="text"><div class="name">'+p.name+'</div><div class="instruction">'+p.instruction+'</div></div>';
container.appendChild(div)})}
function startScan(){
if(running){pauseScan();return}
running=true;document.getElementById('startBtn').textContent='Pause';
document.getElementById('quizCard').style.display='none';
if(partIdx===0){document.getElementById('part-0').classList.add('active');document.getElementById('feedback').textContent='Begin by settling into stillness...'}
interval=setInterval(()=>{elapsed++;const m=Math.floor(elapsed/60),s=elapsed%60;document.getElementById('timerDisplay').textContent=m+':'+String(s).padStart(2,'0');document.getElementById('totalTime').textContent=m+':'+String(s).padStart(2,'0')},1000);
scanInterval=setInterval(()=>{if(partIdx<bodyParts.length){
document.getElementById('part-'+partIdx).classList.remove('active');document.getElementById('part-'+partIdx).classList.add('done');
partIdx++;document.getElementById('parts').textContent=partIdx;
if(partIdx<bodyParts.length){document.getElementById('part-'+partIdx).classList.add('active')}
document.getElementById('progressFill').style.width=Math.round(partIdx/bodyParts.length*100)+'%';
if(partIdx>=bodyParts.length){running=false;clearInterval(interval);clearInterval(scanInterval);
document.getElementById('startBtn').textContent='Begin Relaxation';
score+=50;document.getElementById('score').textContent=score;
document.getElementById('feedback').textContent='✨ Body scan complete! You have returned to full awareness.';
document.getElementById('feedback').style.color='#8b5cf6';
document.getElementById('levelBadge').textContent='Level 2 — Knowledge Quiz';
showQuiz()}}},5000)}
function pauseScan(){running=false;clearInterval(interval);clearInterval(scanInterval);document.getElementById('startBtn').textContent='Resume'}
function resetScan(){running=false;clearInterval(interval);clearInterval(scanInterval);partIdx=0;elapsed=0;
document.getElementById('timerDisplay').textContent='0:00';document.getElementById('totalTime').textContent='0:00';
document.getElementById('parts').textContent='0';document.getElementById('feedback').textContent='';
document.getElementById('startBtn').textContent='Begin Relaxation';
document.getElementById('progressFill').style.width='0%';
document.getElementById('quizCard').style.display='none';
initScan()}
function showQuiz(){
document.getElementById('quizCard').style.display='block';
shuffledQuiz=[...quizQuestions].sort(()=>Math.random()-.5);quizIdx=0;loadQuiz()}
function loadQuiz(){
answered=false;document.getElementById('quizFeedback').textContent='';document.getElementById('quizNext').style.display='none';
if(quizIdx>=shuffledQuiz.length){document.getElementById('quizCard').style.display='none';document.getElementById('levelBadge').textContent='Level 3 — Complete!';return}
const q=shuffledQuiz[quizIdx];document.getElementById('quizQ').textContent=q.q;
const opts=document.getElementById('quizOpts');opts.innerHTML='';
[...q.opts].sort(()=>Math.random()-.5).forEach(o=>{
const d=document.createElement('div');d.className='quiz-opt';d.textContent=o;d.onclick=()=>selectQuiz(d,o,q);opts.appendChild(d)})}
function selectQuiz(d,ans,q){
if(answered)return;answered=true;const ok=ans===q.ans;
if(ok){score+=15;d.classList.add('correct')}else{d.classList.add('wrong');
document.querySelectorAll('.quiz-opt').forEach(o=>{if(o.textContent===q.ans)o.classList.add('correct')})}
document.getElementById('score').textContent=score;
document.getElementById('quizFeedback').textContent=ok?'Correct! +15 pts':'Answer: '+q.ans;
document.getElementById('quizFeedback').style.color=ok?'#10b981':'#ef4444';
document.getElementById('quizNext').style.display='inline-block';quizIdx++}
function nextQuiz(){loadQuiz()}
initScan();
</script>
</body></html>
