<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yoga Mudras</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:15px;border-bottom:2px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:18px}.topbar h1{font-size:20px}
.container{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 20px;gap:16px}
.stats{display:flex;gap:14px;justify-content:center}
.stat{background:#1e293b;padding:10px 16px;border-radius:12px;text-align:center;border:1px solid #334155}
.stat .val{font-size:22px;font-weight:bold;color:#a78bfa}.stat .lbl{font-size:11px;color:#94a3b8}
.level-badge{background:linear-gradient(135deg,#a78bfa,#ec4899);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600}
.progress-bar{width:100%;max-width:500px;height:8px;background:#334155;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#ec4899);border-radius:4px;transition:width .5s}
.info-card{background:#1e293b;border-radius:16px;padding:28px;width:100%;max-width:460px;border:2px solid #334155;text-align:center}
.mudra-visual{font-size:64px;margin:8px 0}
.mudra-name{font-size:20px;font-weight:600;margin-bottom:4px;color:#a78bfa}
.mudra-desc{font-size:14px;color:#94a3b8;margin-bottom:16px;line-height:1.5}
.options{display:flex;flex-direction:column;gap:8px}
.option{background:#0f172a;border:2px solid #334155;padding:12px 16px;border-radius:12px;cursor:pointer;font-size:14px;text-align:left;transition:.2s}
.option:hover{border-color:#a78bfa}
.option.correct{border-color:#10b981;background:#064e3b;color:#10b981}
.option.wrong{border-color:#ef4444;background:#7f1d1d;color:#ef4444}
.feedback{font-size:15px;font-weight:600;min-height:24px;margin-top:10px}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 32px;border-radius:12px;font-size:16px;cursor:pointer;font-weight:600;transition:.2s}
.btn:hover{background:#2563eb}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">← Back</a><h1>🙏 Yoga Mudras</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="val" id="score">0</div><div class="lbl">Score</div></div>
<div class="stat"><div class="val" id="streak">0</div><div class="lbl">Streak</div></div>
<div class="stat"><div class="val" id="qNum">1</div><div class="lbl">Question</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="level-badge" id="levelBadge">Level 1 — Common Mudras</div>
<div class="info-card">
<div class="mudra-visual" id="mudraEmoji">🙏</div>
<div class="mudra-name" id="mudraName"></div>
<div class="mudra-desc" id="mudraDesc"></div>
<div class="options" id="options"></div>
<div class="feedback" id="feedback"></div>
<button class="btn" id="nextBtn" onclick="nextQ()" style="display:none;margin-top:12px">Next →</button>
</div>
</div>
<script>
const questions=[
{emoji:'🙏',name:'Anjali Mudra',desc:'Palms pressed together at heart center, thumbs touching the sternum.',ans:'Greeting, respect, and centering',opts:['Greeting, respect, and centering','Wealth and abundance','Healing and cleansing','Courage and protection'],level:1},
{emoji:'👌',name:'Chin Mudra',desc:'Index finger touching the tip of the thumb, other three fingers extended.',ans:'Knowledge and consciousness',opts:['Knowledge and consciousness','Speed and movement','Anger release','Sleep aid'],level:1},
{emoji:'✊',name:'Adi Mudra',desc:'Thumb wrapped inside the fist, fingers curled over it.',ans:'Calming the nervous system',opts:['Calming the nervous system','Boosting energy','Memory improvement','Digestive aid'],level:1},
{emoji:'🖐️',name:'Abhaya Mudra',desc:'Right hand raised to shoulder height, palm facing outward, fingers up.',ans:'Fearlessness and protection',opts:['Fearlessness and protection','Inner peace','Flexibility','Weight loss'],level:2},
{emoji:'🤲',name:'Dhyana Mudra',desc:'Both hands in lap, right over left, thumbs touching forming a triangle.',ans:'Meditation and deep concentration',opts:['Meditation and deep concentration','Social connection','Physical strength','Vocal power'],level:2},
{emoji:'🌸',name:'Lotus Mudra',desc:'Base of palms and tips of thumbs and pinkies touch, other fingers spread open.',ans:'Opening the heart, purity, and new beginnings',opts:['Opening the heart, purity, and new beginnings','Grounding and stability','Joint flexibility','Liver detox'],level:2},
{emoji:'🕉️',name:'Nasagra Mudra',desc:'Index and middle fingers folded down, thumb touches ring and pinky finger tips.',ans:'Pranayama and alternate nostril breathing',opts:['Pranayama and alternate nostril breathing','Digestive fire','Eye health','Shoulder opening'],level:3},
{emoji:'💪',name:'Apana Mudra',desc:'Tips of middle and ring fingers touch the tip of the thumb.',ans:'Elimination and grounding energy',opts:['Elimination and grounding energy','Mental clarity only','Back pain relief','Wrist strengthening'],level:3},
{emoji:'🌿',name:'Prana Mudra',desc:'Tips of ring and little fingers touch the tip of the thumb, other two extended.',ans:'Vitality and life force energy',opts:['Vitality and life force energy','Joint mobility','Nose clearing','Hair growth'],level:3},
{emoji:'🔥',name:'Surya Mudra',desc:'Ring finger bent down, thumb presses on the ring finger\'s nail.',ans:'Boosting metabolism and warmth',opts:['Boosting metabolism and warmth','Emotional release','Tongue flexibility','Ear health'],level:4},
{emoji:'🌙',name:'Chandra Mudra',desc:'Index finger curled in, thumb presses on it, other fingers extended.',ans:'Cooling and calming the mind',opts:['Cooling and calming the mind','Building muscle mass','Improving eyesight','Teeth strengthening'],level:4},
{emoji:'🪷',name:'Hakini Mudra',desc:'Tips of all five fingers of both hands touch each other, forming a tent.',ans:'Memory, intuition, and brain hemisphere integration',opts:['Memory, intuition, and brain hemisphere integration','Blood pressure regulation','Lung expansion','Joint lubrication'],level:4}
];
let score=0,streak=0,level=1,qIdx=0,answered=false,shuffled=[];
function shuffle(){shuffled=[...questions].sort(()=>Math.random()-.5)}
function nextQ(){
answered=false;document.getElementById('feedback').textContent='';document.getElementById('nextBtn').style.display='none';
if(qIdx>=shuffled.length){shuffle();qIdx=0;level++;document.getElementById('levelBadge').textContent='Level '+level+' — '+['Common Mudras','Intermediate','Advanced','Expert','Mudra Master'][Math.min(level-1,4)]}
const q=shuffled[qIdx];
document.getElementById('mudraEmoji').textContent=q.emoji;
document.getElementById('mudraName').textContent=q.name;
document.getElementById('mudraDesc').textContent=q.desc;
document.getElementById('qNum').textContent=qIdx+1;
const opts=document.getElementById('options');opts.innerHTML='';
[...q.opts].sort(()=>Math.random()-.5).forEach(o=>{
const d=document.createElement('div');d.className='option';d.textContent=o;d.onclick=()=>selectAns(d,o,q);opts.appendChild(d)});
document.getElementById('progressFill').style.width=Math.round(qIdx/shuffled.length*100)+'%'}
function selectAns(d,ans,q){
if(answered)return;answered=true;
const ok=ans===q.ans;
if(ok){score+=10+streak*2;streak++;d.classList.add('correct')}
else{streak=0;d.classList.add('wrong');document.querySelectorAll('.option').forEach(o=>{if(o.textContent===q.ans)o.classList.add('correct')})}
document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;
document.getElementById('feedback').textContent=ok?'Correct! +'+(10+(streak-1)*2)+' pts':'Answer: '+q.ans;
document.getElementById('feedback').style.color=ok?'#10b981':'#ef4444';
document.getElementById('nextBtn').style.display='inline-block';qIdx++}
shuffle();nextQ();
</script>
</body></html>
