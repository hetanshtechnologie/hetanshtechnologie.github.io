<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sun Salutation Sequence</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:15px;border-bottom:2px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:18px}.topbar h1{font-size:20px}
.container{flex:1;display:flex;flex-direction:column;align-items:center;padding:24px 20px;gap:18px}
.stats{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.stat{background:#1e293b;padding:10px 16px;border-radius:12px;text-align:center;border:1px solid #334155}
.stat .val{font-size:22px;font-weight:bold;color:#f59e0b}.stat .lbl{font-size:11px;color:#94a3b8}
.level-badge{background:linear-gradient(135deg,#f59e0b,#ef4444);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600}
.info-card{background:#1e293b;border-radius:16px;padding:24px;width:100%;max-width:600px;border:2px solid #334155}
.instruction{font-size:15px;color:#94a3b8;margin-bottom:14px;text-align:center}
.pose-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:16px}
.pose-slot{width:70px;height:90px;background:#0f172a;border:2px dashed #334155;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#64748b;flex-direction:column;gap:2px;cursor:pointer;transition:.2s}
.pose-slot.filled{border-style:solid;border-color:#f59e0b;color:#f59e0b}
.pose-slot.correct{border-color:#10b981;background:#064e3b;color:#10b981}
.pose-slot.wrong{border-color:#ef4444;background:#7f1d1d;color:#ef4444}
.pose-slot .emoji{font-size:24px}.pose-slot .num{font-size:10px}
.pose-pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0;padding:12px;background:#0f172a;border-radius:12px;min-height:60px}
.pose-chip{background:#1e293b;border:2px solid #475569;padding:8px 12px;border-radius:10px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;transition:.2s;user-select:none}
.pose-chip:hover{border-color:#f59e0b;background:#292524}.pose-chip.used{opacity:.3;pointer-events:none}
.pose-chip .emoji{font-size:18px}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 32px;border-radius:12px;font-size:16px;cursor:pointer;font-weight:600;transition:.2s}
.btn:hover{background:#2563eb}.btn-check{background:#10b981}.btn-check:hover{background:#059669}
.feedback{text-align:center;font-size:16px;font-weight:600;min-height:28px;margin-top:8px}
.progress-bar{width:100%;max-width:600px;height:8px;background:#334155;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#f59e0b,#ef4444);border-radius:4px;transition:width .5s}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">← Back</a><h1>☀️ Sun Salutation (Surya Namaskar)</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="val" id="score">0</div><div class="lbl">Score</div></div>
<div class="stat"><div class="val" id="round">1</div><div class="lbl">Round</div></div>
<div class="stat"><div class="val" id="best">0</div><div class="lbl">Best</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="level-badge" id="levelBadge">Level 1 — 4 Poses</div>
<div class="info-card">
<div class="instruction" id="instruction">Arrange the poses in the correct Surya Namaskar sequence. Click a pose then click a slot.</div>
<div class="pose-grid" id="poseGrid"></div>
<div class="pose-pool" id="posePool"></div>
<div class="feedback" id="feedback"></div>
<div style="display:flex;gap:10px;justify-content:center;margin-top:12px">
<button class="btn btn-check" onclick="checkSequence()">Check</button>
<button class="btn" onclick="newRound()">New Round</button>
</div>
</div>
</div>
<script>
const allPoses=[
{emoji:'🙏',name:'Pranamasana'},{emoji:'🙆',name:'Hasta Uttanasana'},{emoji:'🙇',name:'Uttanasana'},{emoji:'🏃',name:'Ashwa Sanchalanasana'},
{emoji:'📐',name:'Dandasana'},{emoji:'🐍',name:'Bhujangasana'},{emoji:'🏔️',name:'Adho Mukha Svanasana'},{emoji:'🏃',name:'Ashwa Sanchalanasana'},
{emoji:'🙇',name:'Uttanasana'},{emoji:'🙆',name:'Hasta Uttanasana'},{emoji:'🙏',name:'Pranamasana'}
];
const levels=[4,6,8,11];
let level=0,slots=[],placed=[],selectedChip=null,score=0,round=1,best=0;
function newRound(){
const count=levels[Math.min(level,3)];
const subset=allPoses.slice(0,count);
const shuffled=[...subset].sort(()=>Math.random()-.5);
document.getElementById('feedback').textContent='';
document.getElementById('instruction').textContent='Arrange the '+count+' poses in the correct Surya Namaskar sequence. Click a pose chip, then click a slot.';
const grid=document.getElementById('poseGrid');grid.innerHTML='';
slots=[];placed=new Array(count).fill(null);
for(let i=0;i<count;i++){const s=document.createElement('div');s.className='pose-slot';s.innerHTML='<div class="num">'+(i+1)+'</div>';s.onclick=()=>placeInSlot(i);grid.appendChild(s);slots.push(s)}
const pool=document.getElementById('posePool');pool.innerHTML='';
shuffled.forEach((p,i)=>{const c=document.createElement('div');c.className='pose-chip';c.innerHTML='<span class="emoji">'+p.emoji+'</span>'+p.name;c.dataset.pose=JSON.stringify(p);c.onclick=()=>selectChip(c);pool.appendChild(c)});
selectedChip=null;updateProgress();
}
function selectChip(c){if(c.classList.contains('used'))return;document.querySelectorAll('.pose-chip').forEach(x=>x.style.borderColor='#475569');c.style.borderColor='#f59e0b';selectedChip=c}
function placeInSlot(i){if(!selectedChip)return;const pose=JSON.parse(selectedChip.dataset.pose);if(placed[i])return;
slots[i].innerHTML='<div class="emoji">'+pose.emoji+'</div><div style="font-size:9px">'+pose.name.substring(0,8)+'</div>';slots[i].classList.add('filled');
placed[i]=pose;selectedChip.classList.add('used');selectedChip.style.borderColor='#475569';selectedChip=null;updateProgress()}
function checkSequence(){
const count=levels[Math.min(level,3)];
let correct=0;const subset=allPoses.slice(0,count);
for(let i=0;i<count;i++){
if(placed[i]&&placed[i].name===subset[i].name){slots[i].classList.add('correct');slots[i].classList.remove('wrong');correct++}
else if(placed[i]){slots[i].classList.add('wrong');slots[i].classList.remove('correct')}
}
const pct=Math.round(correct/count*100);
if(pct>=80){score+=correct*10;level=Math.min(level+1,3);document.getElementById('levelBadge').textContent='Level '+(level+1)+' — '+levels[level]+' Poses'}
document.getElementById('score').textContent=score;best=Math.max(best,score);document.getElementById('best').textContent=best;round++;document.getElementById('round').textContent=round;
document.getElementById('feedback').textContent=correct+'/'+count+' correct! '+pct+'%';
document.getElementById('feedback').style.color=pct>=80?'#10b981':pct>=50?'#f59e0b':'#ef4444';
updateProgress();
}
function updateProgress(){const count=levels[Math.min(level,3)];const placed2=placed.filter(Boolean).length;document.getElementById('progressFill').style.width=Math.round(placed2/count*100)+'%'}
newRound();
</script>
</body></html>
