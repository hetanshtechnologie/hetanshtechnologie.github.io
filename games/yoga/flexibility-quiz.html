<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flexibility Quiz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:15px;border-bottom:2px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:18px}.topbar h1{font-size:20px}
.container{flex:1;display:flex;flex-direction:column;align-items:center;padding:24px 20px;gap:16px}
.stats{display:flex;gap:14px;justify-content:center}
.stat{background:#1e293b;padding:10px 16px;border-radius:12px;text-align:center;border:1px solid #334155}
.stat .val{font-size:22px;font-weight:bold;color:#ec4899}.stat .lbl{font-size:11px;color:#94a3b8}
.level-badge{background:linear-gradient(135deg,#ec4899,#8b5cf6);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600}
.progress-bar{width:100%;max-width:500px;height:8px;background:#334155;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#ec4899,#8b5cf6);border-radius:4px;transition:width .5s}
.info-card{background:#1e293b;border-radius:16px;padding:24px;width:100%;max-width:500px;border:2px solid #334155;text-align:center}
.muscle-display{font-size:56px;margin:8px 0}
.muscle-name{font-size:20px;font-weight:600;margin-bottom:4px;color:#ec4899}
.muscle-location{font-size:13px;color:#94a3b8;margin-bottom:16px}
.options{display:flex;flex-direction:column;gap:8px}
.option{background:#0f172a;border:2px solid #334155;padding:12px 16px;border-radius:12px;cursor:pointer;font-size:14px;text-align:left;transition:.2s;display:flex;align-items:center;gap:10px}
.option:hover{border-color:#ec4899}
.option.correct{border-color:#10b981;background:#064e3b}
.option.wrong{border-color:#ef4444;background:#7f1d1d}
.option .num{background:#334155;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.option.correct .num{background:#10b981;color:#fff}.option.wrong .num{background:#ef4444;color:#fff}
.feedback{font-size:15px;font-weight:600;min-height:24px;margin-top:10px}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 32px;border-radius:12px;font-size:16px;cursor:pointer;font-weight:600;transition:.2s}
.btn:hover{background:#2563eb}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">← Back</a><h1>🤸 Flexibility Quiz</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="val" id="score">0</div><div class="lbl">Score</div></div>
<div class="stat"><div class="val" id="streak">0</div><div class="lbl">Streak</div></div>
<div class="stat"><div class="val" id="qNum">1</div><div class="lbl">Question</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="level-badge" id="levelBadge">Level 1 — Basic Stretches</div>
<div class="info-card">
<div class="muscle-display" id="muscleEmoji">🦵</div>
<div class="muscle-name" id="muscleName">Hamstrings</div>
<div class="muscle-location" id="muscleLoc">Back of the upper leg</div>
<div style="font-size:15px;font-weight:600;margin:12px 0;color:#ec4899">Which stretch targets this muscle group?</div>
<div class="options" id="options"></div>
<div class="feedback" id="feedback"></div>
<button class="btn" id="nextBtn" onclick="nextQ()" style="display:none;margin-top:12px">Next →</button>
</div>
</div>
<script>
const questions=[
{muscle:'Hamstrings',emoji:'🦵',loc:'Back of the upper leg',ans:'Seated Forward Fold (Paschimottanasana)',opts:['Seated Forward Fold (Paschimottanasana)','Cobra Pose','Shoulder Stand','Wheel Pose']},
{muscle:'Hip Flexors',emoji:'🦴',loc:'Front of the hip joint',ans:'Pigeon Pose (Eka Pada Rajakapotasana)',opts:['Pigeon Pose (Eka Pada Rajakapotasana)','Downward Dog','Plank Pose','Cat-Cow']},
{muscle:'Spine / Back',emoji:'🔙',loc:'Full length of the vertebral column',ans:'Cobra Pose (Bhujangasana)',opts:['Warrior I','Cobra Pose (Bhujangasana)','Tree Pose','Triangle Pose']},
{muscle:'Shoulders',emoji:'💪',loc:'Deltoid and rotator cuff area',ans:'Eagle Arms (Garudasana arms)',opts:['Bridge Pose','Seated Twist','Eagle Arms (Garudasana arms)','Child\'s Pose']},
{muscle:'Quadriceps',emoji:'🦿',loc:'Front of the upper leg',ans:'Camel Pose (Ustrasana)',opts:['Camel Pose (Ustrasana)','Forward Fold','Seated Forward Bend','Plank']},
{muscle:'Inner Thighs (Adductors)',emoji:'🩳',loc:'Inside of the legs',ans:'Wide-Legged Forward Fold',opts:['Downward Dog','Wide-Legged Forward Fold','Chair Pose','Mountain Pose']},
{muscle:'Calves',emoji:'🦶',loc:'Back of the lower leg',ans:'Downward Facing Dog',opts:['Child\'s Pose','Downward Facing Dog','Boat Pose','Corpse Pose']},
{muscle:'Neck',emoji:'🙆',loc:'Cervical spine and trapezius',ans:'Neck Rolls with Shoulder Shrugs',opts:['Sun Salutation','Neck Rolls with Shoulder Shrugs','Chaturanga','Warrior III']},
{muscle:'Glutes',emoji:'🍑',loc:'Buttock muscles',ans:'Supine Figure-4 Stretch',opts:['Supine Figure-4 Stretch','Plank','Half Moon','Crow Pose']},
{muscle:'Chest (Pectorals)',emoji:'🫁',loc:'Front of the upper torso',ans:'Fish Pose (Matsyasana)',opts:['Standing Forward Bend','Fish Pose (Matsyasana)','Tree Pose','Triangle Pose']}
];
let score=0,streak=0,level=1,qIdx=0,answered=false,shuffled=[];
function shuffle(){shuffled=[...questions].sort(()=>Math.random()-.5)}
function nextQ(){
answered=false;document.getElementById('feedback').textContent='';document.getElementById('nextBtn').style.display='none';
if(qIdx>=shuffled.length){shuffle();qIdx=0;level++;document.getElementById('levelBadge').textContent='Level '+level+' — '+['Basic Stretches','Intermediate','Advanced','Expert','Flexibility Master'][Math.min(level-1,4)]}
const q=shuffled[qIdx];
document.getElementById('muscleEmoji').textContent=q.emoji;
document.getElementById('muscleName').textContent=q.muscle;
document.getElementById('muscleLoc').textContent=q.loc;
document.getElementById('qNum').textContent=qIdx+1;
const opts=document.getElementById('options');opts.innerHTML='';
const order=[...q.opts].sort(()=>Math.random()-.5);
order.forEach((o,i)=>{const d=document.createElement('div');d.className='option';
d.innerHTML='<span class="num">'+(i+1)+'</span>'+o;d.onclick=()=>selectAns(d,o,q);opts.appendChild(d)});
document.getElementById('progressFill').style.width=Math.round(qIdx/shuffled.length*100)+'%';
}
function selectAns(d,ans,q){
if(answered)return;answered=true;
const ok=ans===q.ans;
if(ok){score+=10+streak*2;streak++;d.classList.add('correct')}
else{streak=0;d.classList.add('wrong');
document.querySelectorAll('.option').forEach(o=>{if(o.textContent.substring(1)===q.ans)o.classList.add('correct')})}
document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;
document.getElementById('feedback').textContent=ok?'Correct! +'+(10+(streak-1)*2)+' pts':'Answer: '+q.ans;
document.getElementById('feedback').style.color=ok?'#10b981':'#ef4444';
document.getElementById('nextBtn').style.display='inline-block';qIdx++;
}
shuffle();nextQ();
</script>
</body></html>
