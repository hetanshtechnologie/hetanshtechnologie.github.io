<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warrior Poses Quiz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:15px;border-bottom:2px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:18px}.topbar h1{font-size:20px}
.container{flex:1;display:flex;flex-direction:column;align-items:center;padding:24px 20px;gap:18px}
.stats{display:flex;gap:14px;justify-content:center}
.stat{background:#1e293b;padding:10px 16px;border-radius:12px;text-align:center;border:1px solid #334155}
.stat .val{font-size:22px;font-weight:bold;color:#3b82f6}.stat .lbl{font-size:11px;color:#94a3b8}
.level-badge{background:linear-gradient(135deg,#3b82f6,#06b6d4);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600}
.progress-bar{width:100%;max-width:500px;height:8px;background:#334155;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#06b6d4);border-radius:4px;transition:width .5s}
.info-card{background:#1e293b;border-radius:16px;padding:28px;width:100%;max-width:500px;border:2px solid #334155;text-align:center}
.question-emoji{font-size:72px;margin:12px 0}
.question-text{font-size:18px;font-weight:600;margin-bottom:8px}
.question-desc{font-size:14px;color:#94a3b8;margin-bottom:20px;line-height:1.6}
.options{display:flex;flex-direction:column;gap:10px}
.option{background:#0f172a;border:2px solid #334155;padding:14px;border-radius:12px;cursor:pointer;font-size:15px;text-align:left;transition:.2s;display:flex;align-items:center;gap:10px}
.option:hover{border-color:#3b82f6;background:#172554}
.option.correct{border-color:#10b981;background:#064e3b;color:#10b981}
.option.wrong{border-color:#ef4444;background:#7f1d1d;color:#ef4444}
.option .icon{font-size:20px;min-width:28px;text-align:center}
.feedback{font-size:16px;font-weight:600;min-height:24px;margin-top:12px}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 32px;border-radius:12px;font-size:16px;cursor:pointer;font-weight:600;transition:.2s;margin-top:12px}
.btn:hover{background:#2563eb}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">← Back</a><h1>⚔️ Warrior Poses Quiz</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="val" id="score">0</div><div class="lbl">Score</div></div>
<div class="stat"><div class="val" id="streak">0</div><div class="lbl">Streak</div></div>
<div class="stat"><div class="val" id="qNum">1</div><div class="lbl">Question</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="level-badge" id="levelBadge">Level 1</div>
<div class="info-card">
<div class="question-emoji" id="qEmoji">🧘‍♀️</div>
<div class="question-text" id="qText"></div>
<div class="question-desc" id="qDesc"></div>
<div class="options" id="options"></div>
<div class="feedback" id="feedback"></div>
<button class="btn" id="nextBtn" onclick="nextQuestion()" style="display:none">Next →</button>
</div>
</div>
<script>
const questions=[
{q:'Which warrior pose has the front knee bent at 90°, arms raised overhead?',d:'One arm reaches up, hips face forward, grounded through both feet.',ans:'Warrior I',opts:['Warrior I','Warrior II','Warrior III','Reverse Warrior']},
{q:'In which warrior pose are arms spread wide parallel to the floor, gaze over front hand?',d:'Wide stance, hips open to the side, deep bend in front knee.',ans:'Warrior II',opts:['Warrior I','Warrior II','Triangle Pose','Warrior III']},
{q:'Which warrior pose requires balancing on one leg with the body parallel to the floor?',d:'Standing leg straight, arms extend forward, back leg lifts behind.',ans:'Warrior III',opts:['Warrior I','Warrior II','Warrior III','Extended Side Angle']},
{q:'What does Virabhadrasana mean?',d:'Named after a fierce warrior form of Shiva.',ans:'Hero Warrior Pose',opts:['Peaceful Pose','Hero Warrior Pose','Mountain Stance','Sun Pose']},
{q:'In Warrior I, where should the hips face?',d:'Key alignment cue distinguishing it from Warrior II.',ans:'Straight forward (toward front foot)',opts:['Open to the side','Toward the back foot','Straight forward (toward front foot)','Diagonal']},
{q:'Which pose comes directly after Warrior II in many Vinyasa flows?',d:'Common transition in a standing sequence.',ans:'Reverse Warrior',opts:['Warrior I','Reverse Warrior','Tree Pose','Child\'s Pose']},
{q:'Warrior III primarily strengthens which area?',d:'Requires significant core and leg stability.',ans:'Core, legs, and glutes',opts:['Arms only','Core, legs, and glutes','Neck and shoulders','Back muscles only']},
{q:'In Warrior II, the back foot should be at what angle?',d:'Important for hip alignment and knee safety.',ans:'Perpendicular to the front foot',opts:['Parallel to the front foot','45-degree angle','Perpendicular to the front foot','Pointing backward']},
{q:'What is the Sanskrit name for Warrior I?',d:'Virabhadra = warrior, asana = pose.',ans:'Virabhadrasana I',opts:['Virabhadrasana I','Vrksasana I','Veerasana I','Narasimhasana I']},
{q:'Which warrior variation opens the chest toward the sky?',d:'A flowing transition from Warrior II.',ans:'Reverse Warrior (Viparita Virabhadrasana)',opts:['Warrior I','Warrior III','Reverse Warrior (Viparita Virabhadrasana)','Humble Warrior']}
];
let score=0,streak=0,best=0,level=1,qIdx=0,answered=false,shuffled=[];
function shuffle(){shuffled=[...questions].sort(()=>Math.random()-.5)}
function nextQuestion(){
answered=false;document.getElementById('feedback').textContent='';document.getElementById('nextBtn').style.display='none';
if(qIdx>=shuffled.length){shuffle();qIdx=0;level++;document.getElementById('levelBadge').textContent='Level '+level}
const q=shuffled[qIdx];document.getElementById('qEmoji').textContent=['🧘‍♀️','⚔️','💪','🔥'][qIdx%4];
document.getElementById('qText').textContent=q.q;document.getElementById('qDesc').textContent=q.d;document.getElementById('qNum').textContent=qIdx+1;
const optsDiv=document.getElementById('options');optsDiv.innerHTML='';
const optOrder=[...q.opts].sort(()=>Math.random()-.5);
optOrder.forEach(o=>{const btn=document.createElement('div');btn.className='option';btn.innerHTML='<span class="icon">○</span>'+o;
btn.onclick=()=>selectAnswer(btn,o,q);optsDiv.appendChild(btn)});
document.getElementById('progressFill').style.width=Math.round((qIdx/shuffled.length)*100)+'%';
}
function selectAnswer(btn,ans,q){
if(answered)return;answered=true;
const isCorrect=ans===q.ans;if(isCorrect){score+=10+streak*2;streak++;btn.classList.add('correct');btn.querySelector('.icon').textContent='✓'}
else{streak=0;btn.classList.add('wrong');btn.querySelector('.icon').textContent='✗';
document.querySelectorAll('.option').forEach(o=>{if(o.textContent.substring(1)===q.ans){o.classList.add('correct');o.querySelector('.icon').textContent='✓'}})}
document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;
document.getElementById('feedback').textContent=isCorrect?'Correct! +'+(10+(streak-1)*2)+' points':'Answer: '+q.ans;
document.getElementById('feedback').style.color=isCorrect?'#10b981':'#ef4444';
document.getElementById('nextBtn').style.display='inline-block';qIdx++;
}
shuffle();nextQuestion();
</script>
</body></html>
