<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yoga Sequence Builder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:15px;border-bottom:2px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:18px}.topbar h1{font-size:20px}
.container{flex:1;display:flex;flex-direction:column;align-items:center;padding:16px 16px;gap:14px;overflow-y:auto}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.stat{background:#1e293b;padding:8px 14px;border-radius:12px;text-align:center;border:1px solid #334155}
.stat .val{font-size:20px;font-weight:bold;color:#ec4899}.stat .lbl{font-size:11px;color:#94a3b8}
.level-badge{background:linear-gradient(135deg,#ec4899,#8b5cf6);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600}
.info-card{background:#1e293b;border-radius:16px;padding:20px;width:100%;max-width:550px;border:2px solid #334155;text-align:center}
.goal-box{background:#0f172a;padding:12px;border-radius:10px;border-left:4px solid #ec4899;margin-bottom:12px;text-align:left}
.goal-label{font-size:12px;color:#ec4899;font-weight:600}.goal-text{font-size:14px;margin-top:4px}
.requirements{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.req-tag{background:#1e1b4b;padding:4px 10px;border-radius:16px;font-size:11px;border:1px solid #8b5cf6;color:#a78bfa}
.flow-build{min-height:50px;padding:10px;background:#0f172a;border-radius:12px;border:2px dashed #334155;margin:8px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.flow-item{background:#1e293b;border:2px solid #ec4899;padding:6px 10px;border-radius:8px;font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer;transition:.2s}
.flow-item:hover{background:#4a1942}.flow-item .arrow{color:#64748b;font-size:10px}
.pose-category{margin:8px 0}
.cat-label{font-size:12px;color:#94a3b8;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
.pose-pool{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pose-chip{background:#0f172a;border:1px solid #475569;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px;transition:.2s;user-select:none}
.pose-chip:hover{border-color:#ec4899;color:#ec4899}.pose-chip.used{opacity:.3;pointer-events:none}
.feedback{font-size:14px;font-weight:600;min-height:20px;margin-top:6px}
.btn{border:none;padding:10px 24px;border-radius:10px;font-size:14px;cursor:pointer;font-weight:600;transition:.2s;color:#fff}
.btn-check{background:#10b981}.btn-check:hover{background:#059669}
.btn-secondary{background:#334155}.btn-secondary:hover{background:#475569}
.btn-danger{background:#ef4444;font-size:12px;padding:6px 12px}
.category-tabs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.cat-tab{background:#0f172a;border:1px solid #334155;padding:5px 10px;border-radius:8px;cursor:pointer;font-size:11px;color:#94a3b8;transition:.2s}
.cat-tab:hover,.cat-tab.active{border-color:#ec4899;color:#ec4899}
.score-details{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;text-align:left}
.score-item{background:#0f172a;padding:6px 10px;border-radius:8px;font-size:11px}
.score-item .label{color:#94a3b8}.score-item .value{color:#10b981;font-weight:600}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">← Back</a><h1>🧩 Sequence Builder</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="val" id="score">0</div><div class="lbl">Score</div></div>
<div class="stat"><div class="val" id="round">1</div><div class="lbl">Round</div></div>
<div class="stat"><div class="val" id="best">0</div><div class="lbl">Best</div></div>
</div>
<div class="level-badge" id="levelBadge">Level 1 — 4-Pose Sequence</div>
<div class="info-card">
<div class="goal-box">
<div class="goal-label">🎯 SEQUENCE GOAL</div>
<div class="goal-text" id="goalText"></div>
</div>
<div class="requirements" id="requirements"></div>
<div style="font-size:13px;color:#94a3b8;margin-bottom:4px">Your Sequence:</div>
<div class="flow-build" id="flowBuild"><span style="color:#64748b">Add poses below</span></div>
<div style="margin:6px 0"><button class="btn btn-danger" onclick="clearFlow()">Clear All</button></div>
<div class="category-tabs" id="catTabs"></div>
<div class="pose-pool" id="posePool"></div>
<div class="feedback" id="feedback"></div>
<div id="scoreDetails" class="score-details" style="display:none"></div>
<div style="display:flex;gap:8px;justify-content:center;margin-top:10px">
<button class="btn btn-check" onclick="checkSequence()">Check Sequence</button>
<button class="btn btn-secondary" onclick="newRound()">New Goal</button>
</div>
</div>
</div>
<script>
const poseDB={
warmup:['Cat-Cow','Neck Rolls','Shoulder Rolls','Seated Spinal Twist','Child\'s Pose','Butterfly Pose','Seated Forward Bend'],
standing:['Mountain Pose','Warrior I','Warrior II','Triangle Pose','Reverse Warrior','Extended Side Angle','Chair Pose','Tree Pose','Eagle Pose'],
balance:['Tree Pose','Eagle Pose','Half Moon','Dancer Pose','Hand-to-Big-Toe','Standing Split','Warrior III'],
strength:['Plank','Side Plank','Crow Pose','Boat Pose','Dolphin Plank','Firefly','Shoulder Stand'],
flexibility:['Pigeon Pose','Lizard Pose','Seated Forward Bend','Wide-Legged Forward Fold','Happy Baby','Frog Pose','King Pigeon'],
cool:['Child\'s Pose','Corpse Pose','Legs Up Wall','Reclined Twist','Supine Butterfly','Happy Baby','Seated Meditation']
};
const goals=[
{text:'Build a gentle morning wake-up flow (4-5 poses)',min:4,max:5,required:['Cat-Cow','Mountain Pose'],preferred:['Shoulder Rolls','Seated Spinal Twist'],bad:['Crow Pose','Firefly'],cat:'warmup',level:1},
{text:'Create a standing strength sequence (5-6 poses)',min:5,max:6,required:['Warrior I','Warrior II'],preferred:['Triangle Pose','Chair Pose','Extended Side Angle'],bad:['Child\'s Pose','Corpse Pose'],cat:'standing',level:1},
{text:'Design a balance-focused mini flow (4-5 poses)',min:4,max:5,required:['Tree Pose'],preferred:['Eagle Pose','Half Moon','Dancer Pose','Warrior III'],bad:['Plank','Boat Pose'],cat:'balance',level:2},
{text:'Build a core strengthening sequence (5-6 poses)',min:5,max:6,required:['Plank'],preferred:['Side Plank','Boat Pose','Dolphin Plank','Crow Pose'],bad:['Child\'s Pose','Corpse Pose'],cat:'strength',level:2},
{text:'Create a hip-opening sequence (4-6 poses)',min:4,max:6,required:['Pigeon Pose'],preferred:['Lizard Pose','Butterfly Pose','Happy Baby','Frog Pose'],bad:['Plank','Crow Pose'],cat:'flexibility',level:3},
{text:'Design a calming bedtime sequence (5-7 poses)',min:5,max:7,required:['Child\'s Pose','Corpse Pose'],preferred:['Legs Up Wall','Reclined Twist','Supine Butterfly','Seated Meditation'],bad:['Warrior I','Plank','Crow Pose'],cat:'cool',level:3}
];
let score=0,round=1,best=0,level=1,goalIdx=0,flow=[],currentCat='all';
function newRound(){
const g=goals[goalIdx%goals.length];flow=[];currentCat='all';
document.getElementById('goalText').textContent=g.text;
const reqDiv=document.getElementById('requirements');reqDiv.innerHTML='';
g.required.forEach(r=>{const t=document.createElement('span');t.className='req-tag';t.textContent='Required: '+r;reqDiv.appendChild(t)});
g.preferred.slice(0,2).forEach(p=>{const t=document.createElement('span');t.className='req-tag';t.style.borderColor='#10b981';t.style.color='#10b981';t.textContent='Bonus: '+p;reqDiv.appendChild(t)});
renderFlow();renderCats();renderPool();
document.getElementById('levelBadge').textContent='Level '+level+' — '+g.min+'-'+g.max+' Pose Sequence';
document.getElementById('feedback').textContent='';document.getElementById('scoreDetails').style.display='none'}
function renderCats(){
const tabs=document.getElementById('catTabs');tabs.innerHTML='';
const cats=[{id:'all',label:'All'}].concat(Object.keys(poseDB).map(k=>({id:k,label:k.charAt(0).toUpperCase()+k.slice(1)})));
cats.forEach(c=>{const t=document.createElement('div');t.className='cat-tab'+(currentCat===c.id?' active':'');t.textContent=c.label;
t.onclick=()=>{currentCat=c.id;renderCats();renderPool()};tabs.appendChild(t)})}
function renderPool(){
const pool=document.getElementById('posePool');pool.innerHTML='';
const g=goals[goalIdx%goals.length];
let poses=[];
if(currentCat==='all'){Object.values(poseDB).forEach(arr=>poses.push(...arr));poses=[...new Set(poses)]}
else{poses=poseDB[currentCat]||[]}
poses.sort(()=>Math.random()-.5).forEach(p=>{
const c=document.createElement('div');c.className='pose-chip'+(flow.includes(p)?' used':'');c.textContent=p;
c.onclick=()=>addToFlow(p);pool.appendChild(c)})}
function addToFlow(pose){if(flow.includes(pose))return;flow.push(pose);renderFlow();renderPool()}
function removeFromFlow(idx){flow.splice(idx,1);renderFlow();renderPool()}
function renderFlow(){
const area=document.getElementById('flowBuild');area.innerHTML='';
if(!flow.length){area.innerHTML='<span style="color:#64748b">Add poses below</span>';return}
flow.forEach((p,i)=>{
const el=document.createElement('div');el.className='flow-item';el.textContent=p;
el.onclick=()=>removeFromFlow(i);area.appendChild(el);
if(i<flow.length-1){const a=document.createElement('span');a.className='arrow';a.textContent='→';area.appendChild(a)}})}
function clearFlow(){flow=[];renderFlow();renderPool()}
function checkSequence(){
const g=goals[goalIdx%goals.length];
const hasRequired=g.required.every(r=>flow.includes(r));
const bonusCount=g.preferred.filter(p=>flow.includes(p)).length;
const hasBad=g.bad.some(b=>flow.includes(b));
const hasGoodCount=flow.length>=g.min&&flow.length<=g.max;
let pts=0;
if(hasRequired)pts+=30;else pts+=g.required.filter(r=>flow.includes(r)).length*10;
pts+=bonusCount*10;
if(hasGoodCount)pts+=20;
if(hasBad)pts-=15;
const inOrder=g.required.every((r,i)=>{const idx=flow.indexOf(r);return idx>=0});
if(inOrder&&hasRequired)pts+=10;
pts=Math.max(0,pts);score+=pts;best=Math.max(best,score);
if(pts>=40){level=Math.min(level+1,6);goalIdx++}
document.getElementById('score').textContent=score;document.getElementById('best').textContent=best;round++;document.getElementById('round').textContent=round;
document.getElementById('feedback').textContent=pts+' points! '+(pts>=40?'New goal unlocked!':'Try to match more requirements.');
document.getElementById('feedback').style.color=pts>=40?'#10b981':pts>=20?'#f59e0b':'#ef4444';
const details=document.getElementById('scoreDetails');details.style.display='grid';details.innerHTML=
'<div class="score-item"><span class="label">Required poses: </span><span class="value">'+g.required.filter(r=>flow.includes(r)).length+'/'+g.required.length+'</span></div>'+
'<div class="score-item"><span class="label">Bonus poses: </span><span class="value">'+bonusCount+'/'+g.preferred.length+'</span></div>'+
'<div class="score-item"><span class="label">Sequence length: </span><span class="value">'+flow.length+' (target '+g.min+'-'+g.max+')</span></div>'+
'<div class="score-item"><span class="label">Penalties: </span><span class="value">'+(hasBad?'-15':'None')+'</span></div>'}
newRound();
</script>
</body></html>
