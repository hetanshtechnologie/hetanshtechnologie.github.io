<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patanjali's 8 Limbs Quiz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:15px;border-bottom:2px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:18px}.topbar h1{font-size:20px}
.container{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 20px;gap:16px}
.stats{display:flex;gap:14px;justify-content:center}
.stat{background:#1e293b;padding:10px 16px;border-radius:12px;text-align:center;border:1px solid #334155}
.stat .val{font-size:22px;font-weight:bold;color:#f59e0b}.stat .lbl{font-size:11px;color:#94a3b8}
.level-badge{background:linear-gradient(135deg,#f59e0b,#8b5cf6);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600}
.progress-bar{width:100%;max-width:500px;height:8px;background:#334155;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#f59e0b,#8b5cf6);border-radius:4px;transition:width .5s}
.info-card{background:#1e293b;border-radius:16px;padding:24px;width:100%;max-width:520px;border:2px solid #334155;text-align:center}
.limbs-display{display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.limb-pip{width:32px;height:32px;border-radius:50%;border:2px solid #334155;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;transition:.3s}
.limb-pip.active{border-color:#f59e0b;color:#f59e0b;transform:scale(1.15)}
.limb-pip.done{border-color:#10b981;background:#064e3b;color:#10b981}
.question-box{background:#0f172a;padding:14px;border-radius:12px;border-left:4px solid #f59e0b;margin-bottom:14px;text-align:left}
.q-label{font-size:12px;color:#f59e0b;font-weight:600;margin-bottom:4px}
.q-text{font-size:15px;line-height:1.5}
.options{display:flex;flex-direction:column;gap:8px}
.option{background:#0f172a;border:2px solid #334155;padding:12px 16px;border-radius:12px;cursor:pointer;font-size:14px;text-align:left;transition:.2s;display:flex;align-items:center;gap:10px}
.option:hover{border-color:#f59e0b}
.option.correct{border-color:#10b981;background:#064e3b;color:#10b981}
.option.wrong{border-color:#ef4444;background:#7f1d1d;color:#ef4444}
.option .num{background:#334155;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.option.correct .num{background:#10b981;color:#fff}.option.wrong .num{background:#ef4444;color:#fff}
.explanation{background:#0f172a;padding:10px 14px;border-radius:8px;font-size:13px;color:#94a3b8;margin-top:10px;display:none;text-align:left;border-left:3px solid #f59e0b;line-height:1.5}
.feedback{font-size:15px;font-weight:600;min-height:24px;margin-top:8px}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 32px;border-radius:12px;font-size:16px;cursor:pointer;font-weight:600;transition:.2s}
.btn:hover{background:#2563eb}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">← Back</a><h1>🕉️ Patanjali's 8 Limbs of Yoga</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="val" id="score">0</div><div class="lbl">Score</div></div>
<div class="stat"><div class="val" id="streak">0</div><div class="lbl">Streak</div></div>
<div class="stat"><div class="val" id="qNum">1</div><div class="lbl">Question</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="level-badge" id="levelBadge">Level 1 — The 8 Limbs</div>
<div class="limbs-display" id="limbsDisplay"></div>
<div class="info-card">
<div class="question-box">
<div class="q-label" id="qLabel">LIMB IDENTIFICATION</div>
<div class="q-text" id="qText"></div>
</div>
<div class="options" id="options"></div>
<div class="explanation" id="explanation"></div>
<div class="feedback" id="feedback"></div>
<button class="btn" id="nextBtn" onclick="nextQ()" style="display:none;margin-top:12px">Next →</button>
</div>
</div>
<script>
const limbs=['Yama','Niyama','Asana','Pranayama','Pratyahara','Dharana','Dhyana','Samadhi'];
const limbEmoji=['⚖️','🙏','🧘','🫁','👁️','🎯','🧠','🕉️'];
const questions=[
{q:'Which limb deals with ethical restraints (non-violence, truth, non-stealing)?',label:'IDENTIFY THE LIMB',ans:'Yama',opts:['Yama','Niyama','Asana','Pratyahara'],expl:'Yama are the universal ethical principles: Ahimsa (non-violence), Satya (truth), Asteya (non-stealing), Brahmacharya (moderation), Aparigraha (non-possessiveness).',level:1,limb:0},
{q:'Niyama includes which of the following practices?',label:'NIYAMA PRACTICES',ans:'Self-discipline, contentment, and surrender to God',opts:['Self-discipline, contentment, and surrender to God','Non-violence and truth only','Physical postures','Breathing exercises'],expl:'The five Niyamas are: Saucha (cleanliness), Santosha (contentment), Tapas (discipline), Svadhyaya (self-study), Ishvara Pranidhana (surrender).',level:1,limb:1},
{q:'Asana literally translates to:',label:'SANSKRIT MEANING',ans:'Seat or comfortable position',opts:['Seat or comfortable position','Standing strong','Breathing deeply','Meditation pose'],expl:'Originally, "asana" referred to a seated posture for meditation. The physical postures we know today evolved much later.',level:1,limb:2},
{q:'Pranayama is the practice of:',label:'DEFINITION',ans:'Control of breath and life force (prana)',opts:['Control of breath and life force (prana)','Physical stretching only','Moral behavior','Single-pointed focus'],expl:'Prana = life force/breath, Ayama = extension/control. Pranayama extends the breath to expand vital energy.',level:1,limb:3},
{q:'Pratyahara involves:',label:'TECHNIQUE',ans:'Withdrawal of the senses from external objects',opts:['Withdrawal of the senses from external objects','Standing on one head','Rapid breathing','Eating only plant foods'],expl:'Pratyahara is turning the senses inward, like a turtle drawing into its shell. It bridges external and internal practices.',level:2,limb:4},
{q:'Dharana is defined as:',label:'CONCEPT',ans:'Single-pointed concentration on one object',opts:['Single-pointed concentration on one object','Physical flexibility','Ethical behavior','Breath retention'],expl:'Dharana means "holding" the mind on one point — a candle flame, mantra, or breath. It precedes meditation.',level:2,limb:5},
{q:'How does Dhyana differ from Dharana?',label:'DISTINCTION',ans:'Dharana is the effort to focus; Dhyana is the sustained flow of concentration without interruption',opts:['They are identical','Dharana is the effort to focus; Dhyana is the sustained flow of concentration without interruption','Dhyana is physical; Dharana is mental','Dhyana comes before Dharana'],expl:'Dharana = trying to focus (with distractions). Dhyana = unbroken stream of awareness (distractions dissolve).',level:3,limb:6},
{q:'Samadhi represents:',label:'ULTIMATE STATE',ans:'Complete absorption and union with the object of meditation',opts:['Complete absorption and union with the object of meditation','Physical exhaustion','Simply sitting quietly','Learning philosophy'],expl:'In Samadhi, the meditator, meditation, and object of meditation become one. The individual consciousness merges with universal consciousness.',level:3,limb:7},
{q:'The 8 limbs are described in which text?',label:'SOURCE TEXT',ans:'Yoga Sutras of Patanjali',opts:['Yoga Sutras of Patanjali','Bhagavad Gita','Hatha Yoga Pradipika','Upanishads'],expl:'Patanjali compiled approximately 196 sutras around 400 CE, systematizing yoga philosophy into the Ashtanga (eight-limbed) path.',level:1,limb:0},
{q:'Which limb is most commonly practiced in Western yoga studios?',label:'WESTERN YOGA',ans:'Asana (physical postures)',opts:['Asana (physical postures)','Samadhi','Pratyahara','Yama'],expl:'Western yoga primarily focuses on Asana, though traditional yoga encompasses all eight limbs as an integrated path.',level:2,limb:2},
{q:'The progression of the internal limbs (5-8) follows which pattern?',label:'SEQUENTIAL FLOW',ans:'Senses withdraw → Mind focuses → Focus sustains → Absorption occurs',opts:['Random order','Senses withdraw → Mind focuses → Focus sustains → Absorption occurs','Physical first, mental later','All happen simultaneously'],expl:'The internal limbs form a natural progression: Pratyahara → Dharana → Dhyana → Samadhi, each building on the previous.',level:3,limb:4},
{q:'What is the ultimate goal of practicing all 8 limbs?',label:'GOAL',ans:'Kaivalya — liberation and freedom from suffering',opts:['Physical fitness only','Kaivalya — liberation and freedom from suffering','Becoming flexible','Social status'],expl:'Kaivalya is the state of pure consciousness, free from identification with the mind and matter. It is the culmination of the yogic path.',level:4,limb:7}
];
let score=0,streak=0,level=1,qIdx=0,answered=false,shuffled=[];
function initLimbs(){const d=document.getElementById('limbsDisplay');d.innerHTML='';
limbs.forEach((l,i)=>{const p=document.createElement('div');p.className='limb-pip';p.id='limb-'+i;p.textContent=(i+1);p.title=l;d.appendChild(p)})}
function shuffle(){shuffled=[...questions].sort(()=>Math.random()-.5)}
function nextQ(){
answered=false;document.getElementById('feedback').textContent='';document.getElementById('nextBtn').style.display='none';document.getElementById('explanation').style.display='none';
document.querySelectorAll('.limb-pip').forEach(p=>{p.classList.remove('active');p.classList.remove('done')});
if(qIdx>=shuffled.length){shuffle();qIdx=0;level++;document.getElementById('levelBadge').textContent='Level '+level+' — '+['The 8 Limbs','Practices','Philosophy','Integration','Ashtanga Scholar'][Math.min(level-1,4)]}
const q=shuffled[qIdx];
document.getElementById('qLabel').textContent=q.label;
document.getElementById('qText').textContent=q.q;
document.getElementById('qNum').textContent=qIdx+1;
if(q.limb>=0){const p=document.getElementById('limb-'+q.limb);if(p)p.classList.add('active')}
const opts=document.getElementById('options');opts.innerHTML='';
[...q.opts].sort(()=>Math.random()-.5).forEach((o,i)=>{
const d=document.createElement('div');d.className='option';
d.innerHTML='<span class="num">'+(i+1)+'</span>'+o;d.onclick=()=>selectAns(d,o,q);opts.appendChild(d)});
document.getElementById('progressFill').style.width=Math.round(qIdx/shuffled.length*100)+'%'}
function selectAns(d,ans,q){
if(answered)return;answered=true;
const ok=ans===q.ans;
if(ok){score+=10+streak*2;streak++;d.classList.add('correct');
const p=document.getElementById('limb-'+q.limb);if(p){p.classList.remove('active');p.classList.add('done')}}
else{streak=0;d.classList.add('wrong');document.querySelectorAll('.option').forEach(o=>{if(o.textContent.substring(1)===q.ans)o.classList.add('correct')})}
document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;
document.getElementById('feedback').textContent=ok?'Correct! +'+(10+(streak-1)*2)+' pts — '+limbs[q.limb]+' (Limb '+(q.limb+1)+')':'Answer: '+q.ans;
document.getElementById('feedback').style.color=ok?'#10b981':'#ef4444';
document.getElementById('explanation').textContent='📖 '+q.expl;document.getElementById('explanation').style.display='block';
document.getElementById('nextBtn').style.display='inline-block';qIdx++}
initLimbs();shuffle();nextQ();
</script>
</body></html>
