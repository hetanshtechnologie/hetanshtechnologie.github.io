<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asana Identification</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:15px;border-bottom:2px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:18px}.topbar h1{font-size:20px}
.container{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 20px;gap:16px}
.stats{display:flex;gap:14px;justify-content:center}
.stat{background:#1e293b;padding:10px 16px;border-radius:12px;text-align:center;border:1px solid #334155}
.stat .val{font-size:22px;font-weight:bold;color:#f59e0b}.stat .lbl{font-size:11px;color:#94a3b8}
.level-badge{background:linear-gradient(135deg,#f59e0b,#ef4444);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600}
.progress-bar{width:100%;max-width:500px;height:8px;background:#334155;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#f59e0b,#ef4444);border-radius:4px;transition:width .5s}
.info-card{background:#1e293b;border-radius:16px;padding:28px;width:100%;max-width:450px;border:2px solid #334155;text-align:center}
.pose-visual{font-size:72px;margin:8px 0}
.pose-desc{font-size:15px;color:#94a3b8;line-height:1.6;margin-bottom:16px;padding:0 10px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.option{background:#0f172a;border:2px solid #334155;padding:12px;border-radius:12px;cursor:pointer;font-size:14px;transition:.2s;text-align:center}
.option:hover{border-color:#f59e0b}.option.correct{border-color:#10b981;background:#064e3b;color:#10b981}.option.wrong{border-color:#ef4444;background:#7f1d1d;color:#ef4444}
.feedback{font-size:15px;font-weight:600;min-height:24px;margin-top:12px}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 32px;border-radius:12px;font-size:16px;cursor:pointer;font-weight:600;transition:.2s}
.btn:hover{background:#2563eb}
.hint{background:#0f172a;padding:8px 12px;border-radius:8px;font-size:12px;color:#94a3b8;margin-top:8px;display:none}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">← Back</a><h1>🧘 Asana Identification</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="val" id="score">0</div><div class="lbl">Score</div></div>
<div class="stat"><div class="val" id="streak">0</div><div class="lbl">Streak</div></div>
<div class="stat"><div class="val" id="qNum">1</div><div class="lbl">Question</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="level-badge" id="levelBadge">Level 1 — Beginner Poses</div>
<div class="info-card">
<div class="pose-visual" id="poseEmoji">🧘‍♀️</div>
<div class="pose-desc" id="poseDesc"></div>
<div class="options" id="options"></div>
<div class="feedback" id="feedback"></div>
<div class="hint" id="hint"></div>
<button class="btn" id="nextBtn" onclick="nextQ()" style="display:none;margin-top:12px">Next →</button>
</div>
</div>
<script>
const questions=[
{emoji:'🧘‍♀️',desc:'Standing on one leg, the other foot pressed against inner thigh, hands in prayer position overhead or at heart.',ans:'Tree Pose (Vrksasana)',opts:['Tree Pose (Vrksasana)','Warrior I','Mountain Pose','Dancer Pose'],hint:'Roots like a tree, branches reaching up'},
{emoji:'🐍',desc:'Lying face down, hands under shoulders, lifting the chest while keeping hips on the floor.',ans:'Cobra Pose (Bhujangasana)',opts:['Cobra Pose (Bhujangasana)','Upward Dog','Bridge Pose','Locust Pose'],hint:'Named after a serpent'},
{emoji:'🐕',desc:'Inverted V-shape, hands and feet on the floor, hips lifted high, head between arms.',ans:'Downward Facing Dog',opts:['Downward Facing Dog','Child\'s Pose','Plank Pose','Headstand'],hint:'A common yoga greeting pose'},
{emoji:'🦵',desc:'Standing with feet wide, front knee bent at 90°, arms extended out to sides at shoulder height.',ans:'Warrior II (Virabhadrasana II)',opts:['Warrior I','Warrior II (Virabhadrasana II)','Triangle Pose','Side Angle'],hint:'The warrior who sees in two directions'},
{emoji:'🌟',desc:'Standing on one leg, bending forward with one hand on the floor, other arm extended skyward, hips stacked.',ans:'Half Moon (Ardha Chandrasana)',opts:['Half Moon (Ardha Chandrasana)','Warrior III','Eagle Pose','Dancer Pose'],hint:'Like a crescent moon in the sky'},
{emoji:'🧎',desc:'Kneeling, sitting back on heels, folding forward with arms extended, forehead on the floor.',ans:'Child\'s Pose (Balasana)',opts:['Child\'s Pose (Balasana)','Hero Pose','Corpse Pose','Thunderbolt'],hint:'The resting pose named after youth'},
{emoji:'🌉',desc:'Lying on back, knees bent, feet hip-width apart, lifting hips toward the ceiling.',ans:'Bridge Pose (Setu Bandhasana)',opts:['Bridge Pose (Setu Bandhasana)','Wheel Pose','Fish Pose','Shoulder Stand'],hint:'Creates a bridge shape with the body'},
{emoji:'🦅',desc:'Standing on one leg, wrapping the other leg around, crossing arms, sinking down.',ans:'Eagle Pose (Garudasana)',opts:['Eagle Pose (Garudasana)','Chair Pose','Crow Pose','Flamingo Pose'],hint:'Named after the mount of Vishnu'},
{emoji:'🦁',desc:'Kneeling with back arched, reaching hands back to heels, chest open to the sky.',ans:'Camel Pose (Ustrasana)',opts:['Camel Pose (Ustrasana)','Wheel Pose','Cobra Pose','Bow Pose'],hint:'A desert animal with a humped back'},
{emoji:'🦀',desc:'Lying on back, lifting hips and chest off the floor supported by crown of head and feet.',ans:'Wheel Pose (Urdhva Dhanurasana)',opts:['Wheel Pose (Urdhva Dhanurasana)','Bridge Pose','Fish Pose','Plow Pose'],hint:'Creates a full wheel/arch shape'},
{emoji:'🦅',desc:'Standing with hands in eagle arm wraps, knees bent and wrapped, sinking low.',ans:'Eagle Pose (Garudasana)',opts:['Warrior III','Eagle Pose (Garudasana)','Chair Pose','Tree Pose'],hint:'The mythical bird of Hindu mythology'},
{emoji:'🐟',desc:'Lying on back, arching the back, opening the chest, crown of head resting on the floor.',ans:'Fish Pose (Matsyasana)',opts:['Bridge Pose','Fish Pose (Matsyasana)','Shoulder Stand','Plow Pose'],hint:'Named after the creature that saved Manu'}
];
let score=0,streak=0,level=1,qIdx=0,answered=false,shuffled=[];
function shuffle(){shuffled=[...questions].sort(()=>Math.random()-.5)}
function nextQ(){
answered=false;document.getElementById('feedback').textContent='';document.getElementById('nextBtn').style.display='none';document.getElementById('hint').style.display='none';
if(qIdx>=shuffled.length){shuffle();qIdx=0;level++;document.getElementById('levelBadge').textContent='Level '+level+' — '+['Beginner','Intermediate','Advanced','Expert','Asana Master'][Math.min(level-1,4)]}
const q=shuffled[qIdx];
document.getElementById('poseEmoji').textContent=q.emoji;
document.getElementById('poseDesc').textContent=q.desc;
document.getElementById('qNum').textContent=qIdx+1;
const opts=document.getElementById('options');opts.innerHTML='';
[...q.opts].sort(()=>Math.random()-.5).forEach(o=>{
const d=document.createElement('div');d.className='option';d.textContent=o;d.onclick=()=>selectAns(d,o,q);opts.appendChild(d)});
document.getElementById('progressFill').style.width=Math.round(qIdx/shuffled.length*100)+'%'}
function selectAns(d,ans,q){
if(answered)return;answered=true;
const ok=ans===q.ans;
if(ok){score+=10+streak*2;streak++;d.classList.add('correct')}
else{streak=0;d.classList.add('wrong');document.getElementById('hint').textContent='💡 Hint: '+q.hint;document.getElementById('hint').style.display='block';
document.querySelectorAll('.option').forEach(o=>{if(o.textContent===q.ans)o.classList.add('correct')})}
document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;
document.getElementById('feedback').textContent=ok?'Correct! +'+(10+(streak-1)*2)+' pts':'Answer: '+q.ans;
document.getElementById('feedback').style.color=ok?'#10b981':'#ef4444';
document.getElementById('nextBtn').style.display='inline-block';qIdx++}
shuffle();nextQ();
</script>
</body></html>
