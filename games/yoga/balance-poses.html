<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Balance Poses Challenge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:15px;border-bottom:2px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:18px}.topbar h1{font-size:20px}
.container{flex:1;display:flex;flex-direction:column;align-items:center;padding:24px 20px;gap:18px}
.stats{display:flex;gap:14px;justify-content:center}
.stat{background:#1e293b;padding:10px 16px;border-radius:12px;text-align:center;border:1px solid #334155}
.stat .val{font-size:22px;font-weight:bold;color:#10b981}.stat .lbl{font-size:11px;color:#94a3b8}
.level-badge{background:linear-gradient(135deg,#10b981,#06b6d4);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600}
.info-card{background:#1e293b;border-radius:16px;padding:28px;width:100%;max-width:440px;border:2px solid #334155;text-align:center}
.pose-display{font-size:80px;margin:12px 0}
.pose-name{font-size:22px;font-weight:600;margin-bottom:4px}
.pose-sanskrit{font-size:14px;color:#94a3b8;margin-bottom:16px}
.timer-ring{width:140px;height:140px;margin:16px auto;position:relative}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:8}
.timer-ring .bg{stroke:#334155}
.timer-ring .fg{stroke:#10b981;stroke-dasharray:408;stroke-dashoffset:408;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.timer-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:36px;font-weight:bold;color:#10b981}
.hold-info{font-size:14px;color:#94a3b8;margin:8px 0}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 32px;border-radius:12px;font-size:16px;cursor:pointer;font-weight:600;transition:.2s}
.btn:hover{background:#2563eb}
.btn-success{background:#10b981}.btn-success:hover{background:#059669}
.btn-danger{background:#ef4444}.btn-danger:hover{background:#dc2626}
.feedback{font-size:16px;font-weight:600;min-height:24px;margin-top:10px}
.wobble{animation:wobble 2s infinite}
@keyframes wobble{0%,100%{transform:rotate(0deg)}25%{transform:rotate(2deg)}75%{transform:rotate(-2deg)}}
.tip{background:#0f172a;border-radius:10px;padding:12px;margin-top:12px;font-size:13px;color:#94a3b8;border-left:3px solid #10b981}
.pose-options{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.pose-opt{background:#0f172a;border:2px solid #334155;padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px;transition:.2s}
.pose-opt:hover{border-color:#10b981}
.pose-opt.selected{border-color:#10b981;background:#064e3b}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">← Back</a><h1>🌳 Balance Poses Challenge</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="val" id="score">0</div><div class="lbl">Score</div></div>
<div class="stat"><div class="val" id="bestHold">0s</div><div class="lbl">Best Hold</div></div>
<div class="stat"><div class="val" id="round">1</div><div class="lbl">Round</div></div>
</div>
<div class="level-badge" id="levelBadge">Level 1 — Tree Pose</div>
<div class="info-card">
<div class="pose-display" id="poseEmoji">🧘‍♀️</div>
<div class="pose-name" id="poseName">Tree Pose (Vrksasana)</div>
<div class="pose-sanskrit" id="poseSanskrit">Stand on one leg, foot on inner thigh, hands at heart or overhead</div>
<div class="timer-ring"><svg width="140" height="140"><circle class="bg" cx="70" cy="70" r="65"/><circle class="fg" id="timerRing" cx="70" cy="70" r="65"/></svg><div class="timer-text" id="timerText">0</div></div>
<div class="hold-info">Target: <strong id="targetTime">5</strong> seconds</div>
<div class="feedback" id="feedback"></div>
<div style="display:flex;gap:10px;justify-content:center;margin-top:12px">
<button class="btn btn-success" id="startBtn" onclick="startHold()">Start Hold</button>
<button class="btn btn-danger" id="stopBtn" onclick="stopHold()" style="display:none">Wobble! Stop</button>
<button class="btn" onclick="nextRound()">Next Pose</button>
</div>
<div class="tip" id="tip">💡 Tip: Focus on a fixed point ahead of you. Engage your core and breathe steadily.</div>
</div>
</div>
<script>
const poses=[
{emoji:'🌳',name:'Tree Pose (Vrksasana)',desc:'Stand on one leg, place foot on inner thigh, hands at heart or overhead',target:5,tip:'💡 Focus on a fixed point ahead. Engage your core and breathe steadily.',level:1},
{emoji:'🦅',name:'Eagle Pose (Garudasana)',desc:'Wrap one leg around the other, cross arms, sink down',target:5,tip:'💡 Squat slightly in standing leg. Keep shoulders relaxed and gaze forward.',level:1},
{emoji:'🧘‍♀️',name:'Dancer Pose (Natarajasana)',desc:'Grab back foot behind you, extend opposite arm forward',target:7,tip:'💡 Kick into your hand to create tension. Reach forward for counterbalance.',level:2},
{emoji:'🌟',name:'Half Moon (Ardha Chandrasana)',desc:'Balance on one leg and one hand, open chest to the side',target:7,tip:'💡 Stack hips and shoulders. Gaze at the floor or the side wall.',level:2},
{emoji:'👑',name:'Extended Hand-to-Big-Toe',desc:'Stand on one leg, extend the other leg forward holding the toe',target:8,tip:'💡 Keep standing leg strong. If needed, use a strap around the foot.',level:3},
{emoji:'🧘',name:'Peacock Pose (Mayurasana)',desc:'Balance body on hands with elbows digging into abdomen',target:8,tip:'💡 Engage your core strongly. Lean forward gradually as legs lift.',level:3},
{emoji:'🔥',name:'Firefly (Tittibhasana)',desc:'Hands on floor, legs wrap around arms, extend forward',target:10,tip:'💡 Walk hands back slowly. Squeeze inner thighs to lift legs.',level:4},
{emoji:'⚡',name:'Side Plank (Vasisthasana)',desc:'Stack feet, one arm, balance sideways',target:10,tip:'💡 Push the floor away. Stack or stagger feet for stability.',level:4}
];
let score=0,bestHold=0,level=1,round=1,holdTime=0,target=5,holding=false,holdInterval=null,poseIdx=0;
function loadPose(){
const p=poses[poseIdx%poses.length];
document.getElementById('poseEmoji').textContent=p.emoji;
document.getElementById('poseName').textContent=p.name;
document.getElementById('poseSanskrit').textContent=p.desc;
document.getElementById('targetTime').textContent=p.target;
document.getElementById('tip').textContent=p.tip;
target=p.target;level=Math.max(level,p.level);
document.getElementById('levelBadge').textContent='Level '+level+' — '+['Tree Pose','Eagle Pose','Half Moon','Hand-to-Toe','Peacock','Firefly','Side Plank'][Math.min(level-1,6)]+' Master';
}
function startHold(){
holding=true;holdTime=0;document.getElementById('startBtn').style.display='none';document.getElementById('stopBtn').style.display='inline-block';
document.getElementById('poseEmoji').classList.add('wobble');
holdInterval=setInterval(()=>{
holdTime++;document.getElementById('timerText').textContent=holdTime;
const pct=Math.min(holdTime/target,1);
document.getElementById('timerRing').style.strokeDashoffset=408*(1-pct);
if(holdTime>=target&&holding){stopHold();score+=target*5+level*10;bestHold=Math.max(bestHold,holdTime);document.getElementById('score').textContent=score;document.getElementById('bestHold').textContent=bestHold+'s';
document.getElementById('feedback').textContent='Perfect balance! +'+(target*5+level*10)+' points';
document.getElementById('feedback').style.color='#10b981'}
},1000);
}
function stopHold(){
holding=false;clearInterval(holdInterval);
document.getElementById('poseEmoji').classList.remove('wobble');
document.getElementById('startBtn').style.display='inline-block';document.getElementById('stopBtn').style.display='none';
if(holdTime<target){
score+=holdTime*2;document.getElementById('score').textContent=score;bestHold=Math.max(bestHold,holdTime);document.getElementById('bestHold').textContent=bestHold+'s';
document.getElementById('feedback').textContent='Held '+holdTime+'s / '+target+'s needed. +'+(holdTime*2)+' points';
document.getElementById('feedback').style.color='#f59e0b'}
}
function nextRound(){round++;document.getElementById('round').textContent=round;poseIdx++;holdTime=0;
document.getElementById('timerText').textContent='0';document.getElementById('timerRing').style.strokeDashoffset=408;
document.getElementById('feedback').textContent='';loadPose()}
loadPose();
</script>
</body></html>
