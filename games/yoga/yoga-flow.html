<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yoga Flow Builder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:15px;border-bottom:2px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:18px}.topbar h1{font-size:20px}
.container{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 20px;gap:16px}
.stats{display:flex;gap:14px;justify-content:center}
.stat{background:#1e293b;padding:10px 16px;border-radius:12px;text-align:center;border:1px solid #334155}
.stat .val{font-size:22px;font-weight:bold;color:#06b6d4}.stat .lbl{font-size:11px;color:#94a3b8}
.level-badge{background:linear-gradient(135deg,#06b6d4,#3b82f6);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600}
.info-card{background:#1e293b;border-radius:16px;padding:24px;width:100%;max-width:600px;border:2px solid #334155;text-align:center}
.goal-text{background:#0f172a;padding:12px;border-radius:10px;margin-bottom:14px;border-left:4px solid #06b6d4;text-align:left;font-size:14px}
.flow-area{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:12px;background:#0f172a;border-radius:12px;border:2px dashed #334155;margin-bottom:12px;align-items:center;justify-content:center}
.flow-item{background:#1e293b;border:2px solid #06b6d4;padding:8px 14px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;transition:.2s}
.flow-item:hover{background:#0e4a6e}.flow-item .arrow{color:#64748b;margin:0 2px;font-size:11px}
.pose-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px;background:#0f172a;border-radius:12px;min-height:50px}
.pose-chip{background:#1e293b;border:2px solid #475569;padding:8px 12px;border-radius:10px;cursor:pointer;font-size:13px;transition:.2s;user-select:none;display:flex;align-items:center;gap:5px}
.pose-chip:hover{border-color:#06b6d4}.pose-chip.used{opacity:.3;pointer-events:none}
.feedback{font-size:15px;font-weight:600;min-height:24px;margin-top:8px}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 32px;border-radius:12px;font-size:16px;cursor:pointer;font-weight:600;transition:.2s}
.btn:hover{background:#2563eb}.btn-check{background:#10b981}.btn-check:hover{background:#059669}
.btn-danger{background:#ef4444;padding:8px 16px;font-size:13px}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">← Back</a><h1>🌊 Yoga Flow Builder</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="val" id="score">0</div><div class="lbl">Score</div></div>
<div class="stat"><div class="val" id="round">1</div><div class="lbl">Round</div></div>
<div class="stat"><div class="val" id="best">0</div><div class="lbl">Best</div></div>
</div>
<div class="level-badge" id="levelBadge">Level 1 — Warm-Up Flow</div>
<div class="info-card">
<div class="goal-text" id="goalText"><strong>Goal:</strong> Build a 4-pose warm-up flow for morning practice</div>
<div style="font-size:14px;color:#94a3b8;margin-bottom:8px">Your Flow:</div>
<div class="flow-area" id="flowArea"><span style="color:#64748b">Click poses below to add them</span></div>
<div style="display:flex;gap:8px;justify-content:center;margin-bottom:8px">
<button class="btn btn-danger" onclick="clearFlow()">Clear</button>
</div>
<div style="font-size:14px;color:#94a3b8;margin-bottom:6px">Available Poses:</div>
<div class="pose-pool" id="posePool"></div>
<div class="feedback" id="feedback"></div>
<div style="display:flex;gap:10px;justify-content:center;margin-top:12px">
<button class="btn btn-check" onclick="checkFlow()">Check Flow</button>
<button class="btn" onclick="newRound()">New Goal</button>
</div>
</div>
</div>
<script>
const goals=[
{text:'Build a 4-pose warm-up flow for morning practice',min:4,max:6,good:['Mountain Pose','Standing Forward Bend','Cat-Cow','Sun Salutation A','Child\'s Pose','Cobra Pose'],level:1},
{text:'Create a 5-pose standing strength flow',min:5,max:7,good:['Mountain Pose','Warrior I','Warrior II','Triangle Pose','Reverse Warrior','Extended Side Angle','Chair Pose'],level:2},
{text:'Design a 4-pose hip-opening sequence',min:4,max:6,good:['Pigeon Pose','Lizard Pose','Butterfly Pose','Lunging Hip Flexor','Low Lunge','Happy Baby','Frog Pose'],level:2},
{text:'Build a calming 5-pose evening wind-down',min:5,max:7,good:['Child\'s Pose','Seated Forward Bend','Supine Twist','Legs Up Wall','Corpse Pose','Happy Baby','Reclined Butterfly'],level:3},
{text:'Create a 6-pose core strengthening flow',min:6,max:8,good:['Plank','Side Plank','Boat Pose','Dolphin Plank','Hollow Body Hold','Crow Pose','Firefly','Bridge Pose'],level:3},
{text:'Design a balanced 7-pose intermediate vinyasa',min:7,max:9,good:['Sun Salutation A','Warrior I','Warrior II','Triangle','Half Moon','Warrior III','Tree Pose','Eagle Pose','Dancer Pose'],level:4}
];
const allPoses=['Mountain Pose','Standing Forward Bend','Cat-Cow','Sun Salutation A','Child\'s Pose','Cobra Pose','Downward Dog','Warrior I','Warrior II','Triangle Pose','Reverse Warrior','Extended Side Angle','Chair Pose','Pigeon Pose','Lizard Pose','Butterfly Pose','Plank','Side Plank','Boat Pose','Seated Forward Bend','Supine Twist','Corpse Pose','Tree Pose','Eagle Pose','Dancer Pose','Half Moon','Bridge Pose','Crow Pose','Low Lunge','Eagle Arms'];
let score=0,round=1,best=0,level=1,goalIdx=0,flow=[];
function newRound(){
const g=goals[goalIdx%goals.length];flow=[];
document.getElementById('goalText').innerHTML='<strong>Goal:</strong> '+g.text;
document.getElementById('flowArea').innerHTML='<span style="color:#64748b">Click poses below to add them</span>';
document.getElementById('feedback').textContent='';
const pool=document.getElementById('posePool');pool.innerHTML='';
const extra=6+level;const poolPoses=[...g.good,...allPoses.filter(p=>!g.good.includes(p))].slice(0,12+level*2);
[...poolPoses].sort(()=>Math.random()-.5).forEach(p=>{
const c=document.createElement('div');c.className='pose-chip';c.textContent=p;c.dataset.pose=p;
c.onclick=()=>addToFlow(p,c);pool.appendChild(c)});
document.getElementById('levelBadge').textContent='Level '+level+' — '+['Warm-Up Flow','Standing Strength','Hip Opening','Evening Wind-Down','Core Strength','Vinyasa Master'][Math.min(level-1,5)];
}
function addToFlow(pose,chip){
flow.push(pose);chip.classList.add('used');
renderFlow()}
function renderFlow(){
const area=document.getElementById('flowArea');area.innerHTML='';
if(flow.length===0){area.innerHTML='<span style="color:#64748b">Click poses below to add them</span>';return}
flow.forEach((p,i)=>{
const el=document.createElement('div');el.className='flow-item';el.textContent=p;
el.onclick=()=>{flow.splice(i,1);document.querySelectorAll('.pose-chip').forEach(c=>{if(c.dataset.pose===p&&c.classList.contains('used'))c.classList.remove('used')});renderFlow()};
area.appendChild(el);if(i<flow.length-1){const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='→';area.appendChild(arrow)}});
}
function clearFlow(){flow=[];document.querySelectorAll('.pose-chip').forEach(c=>c.classList.remove('used'));renderFlow()}
function checkFlow(){
const g=goals[goalIdx%goals.length];
const goodCount=flow.filter(p=>g.good.includes(p)).length;
const hasGoodCount=flow.length>=g.min&&flow.length<=g.max;
const pct=Math.round(goodCount/Math.max(flow.length,1)*100);
let pts=goodCount*10;if(hasGoodCount)pts+=20;
score+=pts;best=Math.max(best,score);
if(pct>=70){level=Math.min(level+1,6);goalIdx++}
document.getElementById('score').textContent=score;document.getElementById('best').textContent=best;round++;document.getElementById('round').textContent=round;
document.getElementById('feedback').textContent=goodCount+'/'+flow.length+' poses match goal. '+pts+' points!';
document.getElementById('feedback').style.color=pct>=70?'#10b981':pct>=40?'#f59e0b':'#ef4444'}
newRound();
</script>
</body></html>
