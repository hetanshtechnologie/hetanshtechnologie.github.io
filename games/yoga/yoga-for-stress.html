<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yoga for Stress Relief</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:15px;border-bottom:2px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:18px}.topbar h1{font-size:20px}
.container{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 20px;gap:16px}
.stats{display:flex;gap:14px;justify-content:center}
.stat{background:#1e293b;padding:10px 16px;border-radius:12px;text-align:center;border:1px solid #334155}
.stat .val{font-size:22px;font-weight:bold;color:#10b981}.stat .lbl{font-size:11px;color:#94a3b8}
.level-badge{background:linear-gradient(135deg,#10b981,#06b6d4);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600}
.progress-bar{width:100%;max-width:500px;height:8px;background:#334155;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#10b981,#06b6d4);border-radius:4px;transition:width .5s}
.info-card{background:#1e293b;border-radius:16px;padding:24px;width:100%;max-width:500px;border:2px solid #334155;text-align:center}
.stress-scenario{background:#0f172a;padding:14px;border-radius:12px;border-left:4px solid #10b981;margin-bottom:14px;text-align:left}
.stress-label{font-size:12px;color:#10b981;font-weight:600;margin-bottom:4px}
.stress-text{font-size:14px;color:#e2e8f0;line-height:1.5}
.question{font-size:15px;font-weight:600;margin-bottom:12px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:480px){.options{grid-template-columns:1fr}}
.option{background:#0f172a;border:2px solid #334155;padding:12px;border-radius:12px;cursor:pointer;font-size:13px;transition:.2s;text-align:center}
.option:hover{border-color:#10b981}
.option.correct{border-color:#10b981;background:#064e3b;color:#10b981}
.option.wrong{border-color:#ef4444;background:#7f1d1d;color:#ef4444}
.option .emoji{font-size:24px;display:block;margin-bottom:4px}
.feedback{font-size:15px;font-weight:600;min-height:24px;margin-top:10px}
.explanation{background:#064e3b;padding:10px;border-radius:8px;font-size:12px;margin-top:8px;display:none;text-align:left}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 32px;border-radius:12px;font-size:16px;cursor:pointer;font-weight:600;transition:.2s}
.btn:hover{background:#2563eb}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">← Back</a><h1>😌 Yoga for Stress Relief</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="val" id="score">0</div><div class="lbl">Score</div></div>
<div class="stat"><div class="val" id="streak">0</div><div class="lbl">Streak</div></div>
<div class="stat"><div class="val" id="qNum">1</div><div class="lbl">Question</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="level-badge" id="levelBadge">Level 1 — Quick Relief</div>
<div class="info-card">
<div class="stress-scenario">
<div class="stress-label">STRESS SCENARIO</div>
<div class="stress-text" id="stressText"></div>
</div>
<div class="question" id="question"></div>
<div class="options" id="options"></div>
<div class="explanation" id="explanation"></div>
<div class="feedback" id="feedback"></div>
<button class="btn" id="nextBtn" onclick="nextQ()" style="display:none;margin-top:12px">Next →</button>
</div>
</div>
<script>
const questions=[
{stress:'You have a deadline in 2 hours and feel panic rising, heart racing, thoughts scattered.',q:'Which yoga practice would be most effective right now?',ans:'4-7-8 breathing with seated forward fold',emoji:'😤',opts:['Power yoga flow','4-7-8 breathing with seated forward fold','Headstand','Hot yoga session'],expl:'Calming breath work activates the parasympathetic nervous system. Forward folds are introspective and calming.',level:1},
{stress:'You just had an argument and feel anger and tension in your jaw, neck, and shoulders.',q:'Which pose combination helps release this tension?',ans:'Shoulder shrugs + lion\'s breath + eagle arms',emoji:'😡',opts:['Shoulder shrugs + lion\'s breath + eagle arms','Sprint in place','Crow pose','Windshield wiper twists'],expl:'Shoulder shrugs release trapezius tension, lion\'s breath releases jaw tension, eagle arms open shoulders.',level:1},
{stress:'You\'ve been sitting at a desk all day and feel mentally foggy and physically stiff.',q:'What\'s the best desk-friendly yoga break?',ans:'Seated cat-cow + wrist circles + seated twist',emoji:'😩',opts:['Full sun salutation series','Seated cat-cow + wrist circles + seated twist','Handstand practice','Running in place'],expl:'These can be done at a desk and target the exact areas affected by prolonged sitting.',level:1},
{stress:'You can\'t sleep because your mind won\'t stop racing with tomorrow\'s worries.',q:'What pre-sleep yoga routine works best?',ans:'Legs up the wall + 4-7-8 breath + body scan',emoji:'😵‍💫',opts:['Energizing vinyasa flow','Legs up the wall + 4-7-8 breath + body scan','Power poses','Loud music and dancing'],expl:'Inversion calms the nervous system, breathing technique promotes sleep, body scan releases physical tension.',level:2},
{stress:'You feel overwhelmed by social obligations and need emotional boundaries.',q:'Which practice supports emotional self-care?',ans:'Child\'s pose + gratitude meditation + heart-opening cobra',emoji:'🥺',opts:['Crow pose challenge','Child\'s pose + gratitude meditation + heart-opening cobra','Plank hold','Jumping jacks'],expl:'Child\'s pose provides a protective retreat, gratitude shifts perspective, cobra opens the heart center.',level:2},
{stress:'You have a headache from stress and eye strain from screen time.',q:'What yoga techniques help most?',ans:'Eye palming + shoulder rolls + downward dog',emoji:'🤕',opts:['Hot Bikram sequence','Eye palming + shoulder rolls + downward dog','Headstand','Deep twists'],expl:'Eye palming reduces eye strain, shoulder rolls release neck tension, mild inversion increases blood flow.',level:2},
{stress:'You feel anxious about an upcoming presentation and your voice is shaky.',q:'Which practice builds calm confidence?',ans:'Power pose + lion\'s breath + chest opener',emoji:'😰',opts:['Child\'s pose and sleep','Power pose + lion\'s breath + chest opener','Forward fold','Corpse pose'],expl:'Power poses boost confidence hormones, lion\'s breath strengthens the voice, chest openers counter slouching anxiety.',level:3},
{stress:'You feel emotionally numb and disconnected after a difficult period.',q:'Which yoga practice gently reconnects you to your body?',ans:'Gentle hip openers + body awareness meditation',emoji:'😶',opts:['Intense core work','Gentle hip openers + body awareness meditation','Rapid breathing','Crow pose'],expl:'Hip openers store and release emotional tension. Body awareness meditation gently restores the mind-body connection.',level:3},
{stress:'You\'re experiencing digestive issues from chronic stress.',q:'Which yoga poses help the digestive system?',ans:'Seated twist + knees-to-chest + cat-cow',emoji:'🤢',opts:['Handstand','Seated twist + knees-to-chest + cat-cow','Warrior III','Wheel pose'],expl:'Twists massage the abdominal organs, knees-to-chest compress and release the colon, cat-cow stimulates peristalsis.',level:3},
{stress:'You have tension in your temples and jaw from clenching during the day.',q:'What\'s the most targeted relief?',ans:'Jaw unclenching + temple massage + child\'s pose',emoji:'😬',opts:['Jumping','Jaw unclenching + temple massage + child\'s pose','Full backbend','Running'],expl:'Directly addresses the physical manifestation of stress in the jaw and temples, child\'s pose relaxes the whole body.',level:2},
{stress:'You feel restless and can\'t focus on anything for more than a minute.',q:'Which practice restores focus?',ans:'Tratak (candle gazing) + alternate nostril breathing',emoji:'😵',opts:['Intense yoga flow','Tratak (candle gazing) + alternate nostril breathing','Power yoga','Running in place'],expl:'Tratak trains concentration on a single point. Nadi Shodhana balances brain hemispheres for better focus.',level:4},
{stress:'You have chronic lower back pain from sitting and stress.',q:'Which gentle sequence provides relief?',ans:'Cat-cow + sphinx + supine twist + child\'s pose',emoji:'😖',opts:['Plank holds','Cat-cow + sphinx + supine twist + child\'s pose','Headstand','Deep backbend'],expl:'Progressive spinal mobilization followed by gentle release. Sphinx is a mild backbend that doesn\'t strain the lower back.',level:2}
];
let score=0,streak=0,level=1,qIdx=0,answered=false,shuffled=[];
function shuffle(){shuffled=[...questions].sort(()=>Math.random()-.5)}
function nextQ(){
answered=false;document.getElementById('feedback').textContent='';document.getElementById('nextBtn').style.display='none';document.getElementById('explanation').style.display='none';
if(qIdx>=shuffled.length){shuffle();qIdx=0;level++;document.getElementById('levelBadge').textContent='Level '+level+' — '+['Quick Relief','Mindful','Restorative','Expert','Healing Master'][Math.min(level-1,4)]}
const q=shuffled[qIdx];
document.getElementById('stressText').textContent=q.stress;
document.getElementById('question').textContent=q.q;
document.getElementById('qNum').textContent=qIdx+1;
const opts=document.getElementById('options');opts.innerHTML='';
[...q.opts].sort(()=>Math.random()-.5).forEach(o=>{
const d=document.createElement('div');d.className='option';d.textContent=o;d.onclick=()=>selectAns(d,o,q);opts.appendChild(d)});
document.getElementById('progressFill').style.width=Math.round(qIdx/shuffled.length*100)+'%'}
function selectAns(d,ans,q){
if(answered)return;answered=true;
const ok=ans===q.ans;
if(ok){score+=10+streak*2;streak++;d.classList.add('correct')}
else{streak=0;d.classList.add('wrong');document.querySelectorAll('.option').forEach(o=>{if(o.textContent===q.ans)o.classList.add('correct')})}
document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;
document.getElementById('feedback').textContent=ok?'Correct! +'+(10+(streak-1)*2)+' pts':'Answer: '+q.ans;
document.getElementById('feedback').style.color=ok?'#10b981':'#ef4444';
document.getElementById('explanation').textContent='📖 '+q.expl;document.getElementById('explanation').style.display='block';
document.getElementById('nextBtn').style.display='inline-block';qIdx++}
shuffle();nextQ();
</script>
</body></html>
