<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Body Alignment</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:15px;border-bottom:2px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:18px}.topbar h1{font-size:20px}
.container{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 20px;gap:16px}
.stats{display:flex;gap:14px;justify-content:center}
.stat{background:#1e293b;padding:10px 16px;border-radius:12px;text-align:center;border:1px solid #334155}
.stat .val{font-size:22px;font-weight:bold;color:#06b6d4}.stat .lbl{font-size:11px;color:#94a3b8}
.level-badge{background:linear-gradient(135deg,#06b6d4,#3b82f6);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600}
.progress-bar{width:100%;max-width:500px;height:8px;background:#334155;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#06b6d4,#3b82f6);border-radius:4px;transition:width .5s}
.info-card{background:#1e293b;border-radius:16px;padding:24px;width:100%;max-width:520px;border:2px solid #334155;text-align:center}
.scenario{background:#0f172a;padding:16px;border-radius:12px;border-left:4px solid #06b6d4;margin-bottom:16px;text-align:left;line-height:1.6}
.scenario .pose-name{font-size:18px;font-weight:600;color:#06b6d4;margin-bottom:6px}
.scenario .desc{font-size:14px;color:#94a3b8}
.question{font-size:15px;font-weight:600;margin-bottom:14px}
.options{display:flex;flex-direction:column;gap:8px}
.option{background:#0f172a;border:2px solid #334155;padding:12px 16px;border-radius:12px;cursor:pointer;font-size:14px;text-align:left;transition:.2s;display:flex;align-items:center;gap:10px}
.option:hover{border-color:#06b6d4}
.option.correct{border-color:#10b981;background:#064e3b;color:#10b981}
.option.wrong{border-color:#ef4444;background:#7f1d1d;color:#ef4444}
.option .icon{font-size:16px;min-width:24px;text-align:center}
.explanation{background:#064e3b;padding:10px 14px;border-radius:8px;font-size:13px;margin-top:10px;text-align:left;display:none;line-height:1.5}
.feedback{font-size:15px;font-weight:600;min-height:24px;margin-top:8px}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 32px;border-radius:12px;font-size:16px;cursor:pointer;font-weight:600;transition:.2s}
.btn:hover{background:#2563eb}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">← Back</a><h1>📐 Body Alignment</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="val" id="score">0</div><div class="lbl">Score</div></div>
<div class="stat"><div class="val" id="streak">0</div><div class="lbl">Streak</div></div>
<div class="stat"><div class="val" id="qNum">1</div><div class="lbl">Question</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="level-badge" id="levelBadge">Level 1 — Basic Alignment</div>
<div class="info-card">
<div class="scenario" id="scenario">
<div class="pose-name" id="poseName"></div>
<div class="desc" id="poseDesc"></div>
</div>
<div class="question" id="question"></div>
<div class="options" id="options"></div>
<div class="explanation" id="explanation"></div>
<div class="feedback" id="feedback"></div>
<button class="btn" id="nextBtn" onclick="nextQ()" style="display:none;margin-top:12px">Next →</button>
</div>
</div>
<script>
const questions=[
{pose:'Downward Dog',icon:'🐕',desc:'Student has wrists, shoulders, and hips all in line, but the back is rounded and heels are high.',q:'What is the alignment issue and the fix?',ans:'Round the back more and lift heels higher',correct:'Straighten the spine by pressing hands firmly and lifting sit bones; bend knees if needed to lengthen the back',opts:['Round the back more and lift heels higher','Straighten the spine by pressing hands firmly and lifting sit bones; bend knees if needed to lengthen the back','Lock the elbows and push the chest forward','Bring the knees to the floor'],expl:'A rounded back indicates tight hamstrings. Bending the knees allows the spine to lengthen properly.',level:1},
{pose:'Warrior II',icon:'⚔️',desc:'Front knee is collapsing inward, past the ankle. Back foot is lifted off the ground.',q:'How should this be corrected?',ans:'Align knee over the ankle, press back foot down',correct:'Align knee over the ankle, press back foot firmly down, engage the outer hip',opts:['Push knee further forward for deeper stretch','Align knee over the ankle, press back foot firmly down, engage the outer hip','Lean the torso forward','Step the feet closer together'],expl:'The knee should track over the second toe. A lifted back foot reduces stability and hip opening.',level:1},
{pose:'Tree Pose',icon:'🌳',desc:'Foot is placed on the knee of the standing leg, causing the knee to bow outward.',q:'Why is this problematic and what is the fix?',ans:'Foot on knee can cause injury; move it to inner thigh or calf',correct:'Foot on knee can cause injury; move it to inner thigh or calf',opts:['Foot on knee is fine, keep pressing','Foot on knee can cause injury; move it to inner thigh or calf','Move the foot to the outside of the knee','Stand on both feet'],expl:'Never place the foot directly on the knee joint. Inner thigh provides stable base without lateral pressure.',level:2},
{pose:'Triangle Pose',icon:'🔺',desc:'Student is reaching down by bending sideways at the waist rather than hinging at the hip.',q:'What is wrong with this approach?',ans:'Bending at waist strains the spine; hinge from the hip crease',correct:'Bending at waist strains the spine; hinge from the hip crease, keeping torso long',opts:['Nothing, this is correct form','Bending at waist strains the spine; hinge from the hip crease, keeping torso long','Bend more to reach the floor','Keep the torso vertical'],expl:'Triangle is a hip hinge, not a side bend. Length comes from elongating from hip to crown.',level:2},
{pose:'Plank',icon:'📐',desc:'Hips are sagging toward the floor, creating a banana-shaped body.',q:'What muscle group needs to engage more?',ans:'Core (abdominals and hip flexors)',correct:'Core — press the floor away, tuck the tailbone slightly, engage the abdominals to create a straight line',opts:['Legs — push harder with feet','Core — press the floor away, tuck the tailbone slightly, engage the abdominals to create a straight line','Arms — lock the elbows','Back — arch more'],expl:'Sagging hips indicate weak core engagement. Think of a straight line from heels to crown.',level:1},
{pose:'Headstand',icon:'🧘‍♂️',desc:'Elbows are splayed out wide, head is bearing most of the weight.',q:'How should the arm position be adjusted?',ans:'Bring elbows to shoulder width, use forearms to bear weight',correct:'Bring elbows to shoulder width, use forearms to bear weight, only 10-20% on head',opts:['Widen elbows more for base','Bring elbows to shoulder width, use forearms to bear weight, only 10-20% on head','Remove hands from floor','Lock arms straight'],expl:'The forearms should create a stable tripod with the head. Most weight in the arms protects the neck.',level:3},
{pose:'Pigeon Pose',icon:'🕊️',desc:'Front shin is parallel to the front of the mat, causing knee pain.',q:'What adjustment is needed?',ans:'Angle the shin closer to the body, use a block under hip',correct:'Angle the shin closer to the body, flex the front foot to protect the knee, use a block under the hip if needed',opts:['Push the shin further forward','Angle the shin closer to the body, flex the front foot to protect the knee, use a block under the hip if needed','Straighten the front leg','Skip the pose entirely'],expl:'A parallel shin puts excessive torque on the knee. Flexing the foot engages muscles that stabilize the joint.',level:2},
{pose:'Bridge Pose',icon:'🌉',desc:'Knees are splaying apart as hips lift, and the chin is not tucked.',q:'What two corrections are needed?',ans:'Squeeze inner thighs together, tuck chin slightly',correct:'Squeeze inner thighs together to keep knees hip-width, tuck chin to lengthen the back of the neck',opts:['Widen knees for more opening','Squeeze inner thighs together to keep knees hip-width, tuck chin to lengthen the back of the neck','Press chin to chest fully','Lift hips higher'],expl:'Splaying knees indicates weak adductors. The chin tuck creates cervical spine length and prevents neck compression.',level:2},
{pose:'Seated Forward Bend',icon:'🙇',desc:'Student is rounding the upper back aggressively to touch toes, legs are bent.',q:'What is the priority alignment cue?',ans:'Lengthen from hips to crown first, then fold',correct:'Lengthen from hips to crown, hinge at the hip crease, keep the spine long — touching toes is secondary',opts:['Round more to reach toes','Lengthen from hips to crown, hinge at the hip crease, keep the spine long — touching toes is secondary','Bend knees until flat','Hold breath to go deeper'],expl:'A rounded spine under compression can herniate discs. The fold comes from the hips, not the waist.',level:1},
{pose:'Shoulder Stand',icon:'🙋',desc:'Weight is on the neck, hands are on the lower back, elbows are wide.',q:'How should the foundation be corrected?',ans:'Walk hands closer together, press elbows down, use blanket under shoulders',correct:'Walk hands closer together, press elbows down, use a folded blanket under shoulders to create space for the neck',opts:['Spread elbows wider','Walk hands closer together, press elbows down, use a folded blanket under shoulders to create space for the neck','Remove the blanket','Shift weight to the head'],expl:'A blanket under the shoulders elevates the torso, creating space for the cervical spine and reducing neck compression.',level:3}
];
let score=0,streak=0,level=1,qIdx=0,answered=false,shuffled=[];
function shuffle(){shuffled=[...questions].sort(()=>Math.random()-.5)}
function nextQ(){
answered=false;document.getElementById('feedback').textContent='';document.getElementById('nextBtn').style.display='none';document.getElementById('explanation').style.display='none';
if(qIdx>=shuffled.length){shuffle();qIdx=0;level++;document.getElementById('levelBadge').textContent='Level '+level+' — '+['Basic Alignment','Intermediate','Advanced','Expert','Alignment Master'][Math.min(level-1,4)]}
const q=shuffled[qIdx];
document.getElementById('poseName').textContent=q.icon+' '+q.pose;
document.getElementById('poseDesc').textContent=q.desc;
document.getElementById('question').textContent=q.q;
document.getElementById('qNum').textContent=qIdx+1;
const opts=document.getElementById('options');opts.innerHTML='';
[...q.opts].sort(()=>Math.random()-.5).forEach(o=>{
const d=document.createElement('div');d.className='option';
const isCorrect=o===q.correct;d.innerHTML='<span class="icon">'+(isCorrect?'✓':'○')+'</span>'+o;
d.onclick=()=>selectAns(d,o,q.correct,q);opts.appendChild(d)});
document.getElementById('progressFill').style.width=Math.round(qIdx/shuffled.length*100)+'%'}
function selectAns(d,ans,correct,q){
if(answered)return;answered=true;
const ok=ans===correct;
if(ok){score+=10+streak*2;streak++;d.classList.add('correct')}
else{streak=0;d.classList.add('wrong');document.querySelectorAll('.option').forEach(o=>{if(o.textContent.substring(1)===correct)o.classList.add('correct')})}
document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;
document.getElementById('feedback').textContent=ok?'Correct! +'+(10+(streak-1)*2)+' pts':'Incorrect';
document.getElementById('feedback').style.color=ok?'#10b981':'#ef4444';
document.getElementById('explanation').textContent='📖 '+q.expl;document.getElementById('explanation').style.display='block';
document.getElementById('nextBtn').style.display='inline-block';qIdx++}
shuffle();nextQ();
</script>
</body></html>
