<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insertion Sort Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #334155}
.topbar a{color:#38bdf8;text-decoration:none;font-weight:600}
.topbar h1{font-size:1.2rem;color:#f1f5f9}
.container{max-width:900px;margin:0 auto;padding:24px}
.score-bar{display:flex;justify-content:space-between;background:#1e293b;border-radius:12px;padding:16px 24px;margin-bottom:20px}
.score-val{color:#38bdf8;font-weight:700;font-size:1.3rem}
.array-container{display:flex;gap:6px;justify-content:center;align-items:flex-end;height:320px;padding:20px;background:#1e293b;border-radius:12px;margin-bottom:20px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border-radius:6px 6px 0 0}
.bar-inner{width:52px;border-radius:6px 6px 0 0;transition:all .4s}
.bar-label{font-size:14px;font-weight:700;margin-bottom:6px}
.bar-index{font-size:11px;color:#94a3b8;margin-top:4px}
.bar.current .bar-inner{box-shadow:0 0 16px #facc15}
.bar.inserting .bar-inner{box-shadow:0 0 20px #a855f7;background:#a855f7!important}
.bar.shifting .bar-inner{box-shadow:0 0 12px #f97316}
.bar.sorted .bar-inner{opacity:.6}
.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.btn{padding:10px 24px;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}
.btn-primary{background:#38bdf8;color:#0f172a}
.btn-secondary{background:#334155;color:#e2e8f0}
.btn-success{background:#22c55e;color:#fff}
.choice-btn{display:block;width:100%;padding:12px 20px;margin-bottom:8px;background:#334155;color:#e2e8f0;border:2px solid #475569;border-radius:8px;font-size:1rem;cursor:pointer;text-align:left;transition:all .2s}
.choice-btn:hover{border-color:#38bdf8;background:#1e3a5f}
.choice-btn.correct{border-color:#22c55e;background:#14532d}
.choice-btn.wrong{border-color:#ef4444;background:#7f1d1d}
.message{text-align:center;font-size:1.1rem;padding:12px;border-radius:8px;margin-bottom:12px}
.message.correct{background:#14532d;color:#4ade80}
.message.wrong{background:#7f1d1d;color:#fca5a5}
.instructions{background:#1e293b;border-radius:12px;padding:20px;margin-bottom:20px}
.instructions h2{color:#38bdf8;margin-bottom:8px}
.log{background:#1e293b;border-radius:12px;padding:16px;max-height:140px;overflow-y:auto;font-family:monospace;font-size:13px;color:#94a3b8}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">&#8592; Home</a><h1>Insertion Sort Game</h1></div>
<div class="container">
  <div class="score-bar">
    <span>Score: <span class="score-val" id="score">0</span></span>
    <span>Round: <span class="score-val" id="round">1</span></span>
    <span>Streak: <span class="score-val" id="streak">0</span> &#128293;</span>
  </div>
  <div class="array-container" id="arrayContainer"></div>
  <div class="instructions"><h2>How to Play</h2><p>Insertion sort picks elements one by one and inserts them into the correct position. Predict where the current element should be inserted or whether it shifts left!</p></div>
  <div id="messageArea"></div>
  <div id="choicesArea"></div>
  <div class="btn-row">
    <button class="btn btn-primary" id="startBtn" onclick="startRound()">Start Round</button>
    <button class="btn btn-secondary" id="stepBtn" onclick="doStep()" style="display:none">Step</button>
    <button class="btn btn-success" id="autoBtn" onclick="toggleAuto()" style="display:none">Auto</button>
    <button class="btn btn-secondary" id="resetBtn" onclick="resetAll()" style="display:none">New Array</button>
  </div>
  <div class="log" id="log"></div>
</div>
<script>
let arr=[],score=0,round=1,streak=0,keyIdx=1,shiftIdx=0,phase='idle',autoTimer=null;

function gen(n=7){let a=[];while(a.length<n){let v=Math.floor(Math.random()*45)+5;if(!a.includes(v))a.push(v)}return a}

function render(hl={}){
  const c=document.getElementById('arrayContainer');c.innerHTML='';const mx=Math.max(...arr);
  arr.forEach((v,i)=>{
    const b=document.createElement('div');b.className='bar';
    if(hl.key===i)b.classList.add('current');
    if(hl.inserting===i)b.classList.add('inserting');
    if(hl.shifting&&hl.shifting.includes(i))b.classList.add('shifting');
    if(hl.sorted&&i<=hl.sorted)b.classList.add('sorted');
    const h=(v/mx)*250;
    b.innerHTML=`<span class="bar-label">${v}</span><div class="bar-inner" style="height:${h}px;background:hsl(${220+i*18},65%,50%)"></div><span class="bar-index">[${i}]</span>`;
    c.appendChild(b);
  });
}

function logMsg(m){document.getElementById('log').innerHTML=`<div style="padding:2px 0;border-bottom:1px solid #334155">R${round}: ${m}</div>`+document.getElementById('log').innerHTML}

function updateScore(ok){if(ok){score+=10+streak*5;streak++}else{streak=0}document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak}

function findInsertPos(){
  let pos=keyIdx;while(pos>0&&arr[pos-1]>arr[keyIdx])pos--;return pos;
}

function startRound(){
  arr=gen();keyIdx=1;phase='decide';
  render({key:1});
  document.getElementById('startBtn').style.display='none';
  ['stepBtn','autoBtn','resetBtn'].forEach(id=>document.getElementById(id).style.display='');
  document.getElementById('round').textContent=round;
  document.getElementById('messageArea').innerHTML='';
  showQ();
}

function showQ(){
  if(keyIdx>=arr.length){
    render({sorted:arr.length-1});
    document.getElementById('messageArea').innerHTML='<div class="message correct">Array sorted!</div>';
    document.getElementById('choicesArea').innerHTML='';
    round++;document.getElementById('startBtn').style.display='';document.getElementById('startBtn').textContent='Next Round';
    ['stepBtn','autoBtn','resetBtn'].forEach(id=>document.getElementById(id).style.display='none');
    if(autoTimer){clearInterval(autoTimer);autoTimer=null}
    logMsg('Sorted!');return;
  }
  const kv=arr[keyIdx],ipos=findInsertPos();
  let choices=[];
  if(phase==='decide'){
    // Should we shift left?
    const shouldShift=keyIdx>0&&arr[keyIdx-1]>kv;
    const newKeyPos=keyIdx-1;
    choices=[
      {text:`Shift arr[${keyIdx-1}]=${arr[keyIdx-1]} right (it's > ${kv})`,correct:shouldShift},
      {text:`Keep arr[${keyIdx}] in place — already sorted`,correct:!shouldShift},
      {text:`Insert ${kv} at position 0 immediately`,correct:false}
    ];
  }else{
    choices=[
      {text:`Insert at position ${ipos} — correct spot found!`,correct:true},
      {text:`Insert at position ${keyIdx} — end of sorted part`,correct:false},
      {text:`Insert at position ${Math.max(0,ipos-1)}`,correct:false}
    ];
  }
  choices.sort(()=>Math.random()-.5);
  let html=`<p style="margin-bottom:8px;color:#94a3b8">Key element: arr[${keyIdx}]=${kv}. What happens?</p>`;
  choices.forEach(c=>{html+=`<button class="choice-btn" onclick="answer(${c.correct},${JSON.stringify(c.text).replace(/"/g,'&quot;')},this)">${c.text}</button>`});
  document.getElementById('choicesArea').innerHTML=html;
}

function answer(ok,txt,el){
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  el.classList.add(ok?'correct':'wrong');
  document.getElementById('messageArea').innerHTML=`<div class="message ${ok?'correct':'wrong'}">${ok?'Correct! +'+(10+streak*5)+' points':'Wrong!'}</div>`;
  updateScore(ok);logMsg((ok?'Correct':'Wrong')+': '+txt);
  setTimeout(()=>doStep(),700);
}

function doStep(){
  document.getElementById('messageArea').innerHTML='';
  if(keyIdx>=arr.length){showQ();return}
  if(phase==='decide'){
    const shouldShift=keyIdx>0&&arr[keyIdx-1]>arr[keyIdx];
    if(shouldShift){
      phase='insert';
    }else{
      keyIdx++;phase='decide';
    }
  }else{
    const ipos=findInsertPos();
    let idx=keyIdx;
    while(idx>ipos){arr[idx]=arr[idx-1];idx--}
    arr[ipos]=arr[keyIdx]||arr[idx];
    // fix: proper insertion
    const temp=arr[keyIdx];
    idx=keyIdx;
    while(idx>ipos){arr[idx]=arr[idx-1];idx--}
    arr[ipos]=temp;
    render({inserting:ipos});
    keyIdx++;phase='decide';
  }
  setTimeout(()=>{render({key:keyIdx});showQ()},400);
}

function toggleAuto(){
  if(autoTimer){clearInterval(autoTimer);autoTimer=null;document.getElementById('autoBtn').textContent='Auto';return}
  document.getElementById('autoBtn').textContent='Pause';
  autoTimer=setInterval(()=>{if(keyIdx>=arr.length){clearInterval(autoTimer);autoTimer=null;showQ();return}doStep()},700);
}

function resetAll(){
  if(autoTimer)clearInterval(autoTimer);autoTimer=null;
  document.getElementById('startBtn').style.display='';document.getElementById('startBtn').textContent='Start Round';
  ['stepBtn','autoBtn','resetBtn'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('choicesArea').innerHTML='';document.getElementById('messageArea').innerHTML='';render();
}
</script>
</body>
</html>
