<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linked List Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #334155}
.topbar a{color:#38bdf8;text-decoration:none;font-weight:600}
.topbar h1{font-size:1.2rem;color:#f1f5f9}
.container{max-width:950px;margin:0 auto;padding:24px}
.score-bar{display:flex;justify-content:space-between;background:#1e293b;border-radius:12px;padding:16px 24px;margin-bottom:20px}
.score-val{color:#38bdf8;font-weight:700;font-size:1.3rem}
.ll-area{background:#1e293b;border-radius:12px;padding:24px;margin-bottom:20px;overflow-x:auto}
.ll-label{color:#94a3b8;font-weight:600;margin-bottom:16px}
.ll-visual{display:flex;align-items:center;gap:0;min-height:80px}
.ll-node{display:flex;align-items:center;flex-shrink:0}
.ll-box{padding:10px 16px;background:#334155;border:2px solid #475569;border-radius:8px;font-weight:700;text-align:center;min-width:60px;transition:all .4s}
.ll-box.head{border-color:#38bdf8;background:#1e3a5f}
.ll-box.highlight{border-color:#facc15;background:#422006}
.ll-box.inserting{border-color:#22c55e;background:#14532d}
.ll-box.deleting{border-color:#ef4444;background:#7f1d1d}
.ll-box.found{border-color:#a855f7;background:#581c87}
.ll-box small{display:block;font-size:.65rem;color:#94a3b8;font-weight:400}
.ll-arrow{color:#475569;font-size:1.2rem;padding:0 2px;flex-shrink:0}
.ll-null{color:#64748b;font-weight:600;padding:8px}
.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.btn{padding:10px 24px;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}
.btn-primary{background:#38bdf8;color:#0f172a}
.btn-secondary{background:#334155;color:#e2e8f0}
.choice-btn{display:block;width:100%;padding:12px 20px;margin-bottom:8px;background:#334155;color:#e2e8f0;border:2px solid #475569;border-radius:8px;font-size:1rem;cursor:pointer;text-align:left;transition:all .2s}
.choice-btn:hover{border-color:#38bdf8;background:#1e3a5f}
.choice-btn.correct{border-color:#22c55e;background:#14532d}
.choice-btn.wrong{border-color:#ef4444;background:#7f1d1d}
.message{text-align:center;font-size:1.1rem;padding:12px;border-radius:8px;margin-bottom:12px}
.message.correct{background:#14532d;color:#4ade80}
.message.wrong{background:#7f1d1d;color:#fca5a5}
.instructions{background:#1e293b;border-radius:12px;padding:20px;margin-bottom:20px}
.instructions h2{color:#38bdf8;margin-bottom:8px}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">&#8592; Home</a><h1>Linked List Game</h1></div>
<div class="container">
  <div class="score-bar">
    <span>Score: <span class="score-val" id="score">0</span></span>
    <span>Round: <span class="score-val" id="round">1</span></span>
    <span>Streak: <span class="score-val" id="streak">0</span> &#128293;</span>
  </div>
  <div class="ll-area"><div class="ll-label">Linked List:</div><div class="ll-visual" id="llVisual"></div></div>
  <div class="instructions"><h2>How to Play</h2><p>Linked lists store data in nodes with pointers. Predict what happens when you insert a node, delete a node, or traverse the list!</p></div>
  <div id="messageArea"></div>
  <div id="choicesArea"></div>
  <div class="btn-row">
    <button class="btn btn-primary" id="startBtn" onclick="startRound()">Start Round</button>
    <button class="btn btn-secondary" id="resetBtn" onclick="resetAll()" style="display:none">New List</button>
  </div>
</div>
<script>
let list=[],score=0,round=1,streak=0,taskType='',taskData={};

function renderList(hl={}){
  const el=document.getElementById('llVisual');el.innerHTML='';
  list.forEach((v,i)=>{
    if(i>0){const a=document.createElement('span');a.className='ll-arrow';a.textContent='\u2192';el.appendChild(a)}
    const node=document.createElement('div');node.className='ll-node';
    const box=document.createElement('div');box.className='ll-box';
    if(i===0)box.classList.add('head');
    if(hl.highlight===i)box.classList.add('highlight');
    if(hl.inserting===i)box.classList.add('inserting');
    if(hl.deleting===i)box.classList.add('deleting');
    if(hl.found===i)box.classList.add('found');
    box.innerHTML=`${v}<small>Node ${i}</small>`;
    node.appendChild(box);el.appendChild(node);
  });
  const nullEl=document.createElement('span');nullEl.className='ll-null';nullEl.textContent='\u2192 null';el.appendChild(nullEl);
}

function updateScore(ok){if(ok){score+=10+streak*5;streak++}else{streak=0}document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak}

function genList(){
  list=[];const n=4+Math.floor(Math.random()*3);
  while(list.length<n){const v=Math.floor(Math.random()*90)+10;if(!list.includes(v))list.push(v)}
}

function startRound(){
  genList();const r=Math.random();
  if(r<0.33)taskType='insert';
  else if(r<0.66)taskType='delete';
  else taskType='search';
  renderList();showQ();
  document.getElementById('startBtn').style.display='none';
  document.getElementById('resetBtn').style.display='';
  document.getElementById('round').textContent=round;
  document.getElementById('messageArea').innerHTML='';
}

function showQ(){
  if(taskType==='insert'){
    const val=Math.floor(Math.random()*90)+10;
    const pos=Math.floor(Math.random()*(list.length+1));
    taskData={val,pos};
    const newList=[...list];newList.splice(pos,0,val);
    const choices=[
      {text:`Insert ${val} at position ${pos}: [${newList}]`,correct:true},
      {text:`Insert ${val} at position ${Math.min(pos+1,list.length)}: [${[...list].splice(0,pos+1,val).concat(list.slice(pos+1))}]`,correct:false},
      {text:`Append ${val} at end: [${[...list,val]}]`,correct:false}
    ].sort(()=>Math.random()-.5);
    let html=`<p style="margin-bottom:8px;color:#94a3b8">Insert ${val} at position ${pos}. List: [${list}]</p>`;
    choices.forEach(c=>{html+=`<button class="choice-btn" onclick="answer(${c.correct},'insert',this)">${c.text}</button>`});
    document.getElementById('choicesArea').innerHTML=html;
  }else if(taskType==='delete'){
    const pos=Math.floor(Math.random()*list.length);
    const val=list[pos];
    taskData={pos,val};
    const newList=[...list];newList.splice(pos,1);
    const choices=[
      {text:`Delete node at pos ${pos} (value ${val}): [${newList}]`,correct:true},
      {text:`Delete first occurrence of ${val}: [${newList}]`,correct:true},
      {text:`Delete node at pos ${Math.min(pos+1,list.length-1)}: [${[...list].filter((_,i)=>i!==Math.min(pos+1,list.length-1))}]`,correct:false}
    ].sort(()=>Math.random()-.5);
    let html=`<p style="margin-bottom:8px;color:#94a3b8">Delete node at position ${pos} (value ${val}). List: [${list}]</p>`;
    choices.forEach(c=>{html+=`<button class="choice-btn" onclick="answer(${c.correct},'delete',this)">${c.text}</button>`});
    document.getElementById('choicesArea').innerHTML=html;
  }else{
    const val=list[Math.floor(Math.random()*list.length)];
    taskData={val,pos:list.indexOf(val)};
    const choices=[
      {text:`Search for ${val}: Found at position ${list.indexOf(val)}`,correct:true},
      {text:`Search for ${val}: Found at position ${list.length-1}`,correct:false},
      {text:`Search for ${val}: Not found`,correct:false}
    ].sort(()=>Math.random()-.5);
    let html=`<p style="margin-bottom:8px;color:#94a3b8">Search for value ${val}. List: [${list}]</p>`;
    choices.forEach(c=>{html+=`<button class="choice-btn" onclick="answer(${c.correct},'search',this)">${c.text}</button>`});
    document.getElementById('choicesArea').innerHTML=html;
  }
}

function answer(ok,type,el){
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  el.classList.add(ok?'correct':'wrong');
  document.getElementById('messageArea').innerHTML=`<div class="message ${ok?'correct':'wrong'}">${ok?'Correct! +'+(10+streak*5)+' points':'Wrong!'}</div>`;
  updateScore(ok);
  setTimeout(()=>{
    if(ok){
      if(type==='insert'){list.splice(taskData.pos,0,taskData.val);renderList({inserting:taskData.pos})}
      else if(type==='delete'){list.splice(taskData.pos,1);renderList({deleting:taskData.pos})}
      else{renderList({found:taskData.pos})}
    }
    round++;
    document.getElementById('startBtn').style.display='';document.getElementById('startBtn').textContent='Next Round';
    document.getElementById('resetBtn').style.display='none';
    document.getElementById('choicesArea').innerHTML='';
  },900);
}

function resetAll(){
  document.getElementById('startBtn').style.display='';document.getElementById('startBtn').textContent='Start Round';
  document.getElementById('resetBtn').style.display='none';
  document.getElementById('choicesArea').innerHTML='';document.getElementById('messageArea').innerHTML='';document.getElementById('llVisual').innerHTML='';
}
</script>
</body>
</html>
