<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BFS Traversal Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #334155}
.topbar a{color:#38bdf8;text-decoration:none;font-weight:600}
.topbar h1{font-size:1.2rem;color:#f1f5f9}
.container{max-width:950px;margin:0 auto;padding:24px}
.score-bar{display:flex;justify-content:space-between;background:#1e293b;border-radius:12px;padding:16px 24px;margin-bottom:20px}
.score-val{color:#38bdf8;font-weight:700;font-size:1.3rem}
.graph-area{position:relative;height:400px;background:#1e293b;border-radius:12px;margin-bottom:20px;overflow:hidden}
.graph-area svg{width:100%;height:100%}
.edge{stroke:#475569;stroke-width:2}
.edge.visited{stroke:#22c55e;stroke-width:3}
.node-circle{fill:#334155;stroke:#64748b;stroke-width:3;cursor:pointer;transition:all .3s}
.node-circle:hover{stroke:#38bdf8}
.node-circle.queued{fill:#1e3a5f;stroke:#facc15;stroke-width:3}
.node-circle.visited{fill:#14532d;stroke:#22c55e;stroke-width:3}
.node-circle.current{fill:#38bdf8;stroke:#f1f5f9;stroke-width:3;filter:drop-shadow(0 0 10px #38bdf8)}
.node-text{fill:#e2e8f0;font-size:18px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.queue-display{display:flex;gap:8px;align-items:center;background:#1e293b;border-radius:12px;padding:16px;margin-bottom:20px;overflow-x:auto}
.queue-label{color:#94a3b8;font-weight:600;margin-right:12px;white-space:nowrap}
.queue-item{width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#334155;font-weight:700;border:2px solid #475569;flex-shrink:0}
.queue-item.front{border-color:#facc15;background:#422006}
.visited-display{display:flex;gap:6px;align-items:center;background:#1e293b;border-radius:12px;padding:12px 16px;margin-bottom:20px;flex-wrap:wrap}
.visited-label{color:#94a3b8;font-weight:600;margin-right:8px}
.visited-item{padding:4px 10px;border-radius:6px;background:#14532d;color:#4ade80;font-weight:600;font-size:.85rem}
.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.btn{padding:10px 24px;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}
.btn-primary{background:#38bdf8;color:#0f172a}
.btn-secondary{background:#334155;color:#e2e8f0}
.choice-btn{display:block;width:100%;padding:12px 20px;margin-bottom:8px;background:#334155;color:#e2e8f0;border:2px solid #475569;border-radius:8px;font-size:1rem;cursor:pointer;text-align:left;transition:all .2s}
.choice-btn:hover{border-color:#38bdf8;background:#1e3a5f}
.choice-btn.correct{border-color:#22c55e;background:#14532d}
.choice-btn.wrong{border-color:#ef4444;background:#7f1d1d}
.message{text-align:center;font-size:1.1rem;padding:12px;border-radius:8px;margin-bottom:12px}
.message.correct{background:#14532d;color:#4ade80}
.message.wrong{background:#7f1d1d;color:#fca5a5}
.instructions{background:#1e293b;border-radius:12px;padding:20px;margin-bottom:20px}
.instructions h2{color:#38bdf8;margin-bottom:8px}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">&#8592; Home</a><h1>BFS Traversal Game</h1></div>
<div class="container">
  <div class="score-bar">
    <span>Score: <span class="score-val" id="score">0</span></span>
    <span>Round: <span class="score-val" id="round">1</span></span>
    <span>Streak: <span class="score-val" id="streak">0</span> &#128293;</span>
  </div>
  <div class="graph-area" id="graphArea"><svg id="graphSvg"></svg></div>
  <div class="visited-display"><span class="visited-label">Visited:</span><span id="visitedList"></span></div>
  <div class="queue-display"><span class="queue-label">Queue:</span><span id="queueList"></span></div>
  <div class="instructions"><h2>How to Play</h2><p>BFS visits nodes level by level using a queue. Click the correct next node to visit in BFS order!</p></div>
  <div id="messageArea"></div>
  <div id="choicesArea"></div>
  <div class="btn-row">
    <button class="btn btn-primary" id="startBtn" onclick="startRound()">Start Round</button>
    <button class="btn btn-secondary" id="resetBtn" onclick="resetAll()" style="display:none">New Graph</button>
  </div>
</div>
<script>
let nodes=[],edges=[],visited=new Set(),queue=[],current=null,score=0,round=1,streak=0;

function genGraph(){
  const n=7;nodes=[];edges=[];
  const names='ABCDEFG';
  for(let i=0;i<n;i++){
    const angle=(i/n)*Math.PI*2-Math.PI/2;
    const r=140;
    nodes.push({id:i,name:names[i],x:300+r*Math.cos(angle),y:190+r*Math.sin(angle),adj:[]});
  }
  // Create a connected graph
  for(let i=1;i<n;i++){
    const p=Math.floor(Math.random()*i);
    edges.push([p,i]);nodes[p].adj.push(i);nodes[i].adj.push(p);
  }
  for(let i=0;i<n-2;i++){
    let a=Math.floor(Math.random()*n),b=Math.floor(Math.random()*n);
    if(a!==b&&!edges.some(e=>(e[0]===a&&e[1]===b)||(e[0]===b&&e[1]===a))){
      edges.push([a,b]);nodes[a].adj.push(b);nodes[b].adj.push(a);
    }
  }
}

function renderGraph(){
  const svg=document.getElementById('graphSvg');svg.innerHTML='';
  edges.forEach(([a,b])=>{
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',nodes[a].x);line.setAttribute('y1',nodes[a].y);
    line.setAttribute('x2',nodes[b].x);line.setAttribute('y2',nodes[b].y);
    line.classList.add('edge');
    if(visited.has(a)&&visited.has(b))line.classList.add('visited');
    line.id=`edge-${a}-${b}`;svg.appendChild(line);
  });
  nodes.forEach(n=>{
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',n.x);c.setAttribute('cy',n.y);c.setAttribute('r',28);
    c.classList.add('node-circle');
    if(n.id===current)c.classList.add('current');
    else if(visited.has(n.id))c.classList.add('visited');
    else if(queue.includes(n.id))c.classList.add('queued');
    g.appendChild(c);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',n.x);t.setAttribute('y',n.y);t.classList.add('node-text');t.textContent=n.name;
    g.appendChild(t);svg.appendChild(g);
  });
}

function renderQueue(){
  const el=document.getElementById('queueList');
  el.innerHTML=queue.map((id,i)=>`<div class="queue-item ${i===0?'front':''}">${nodes[id].name}</div>`).join('');
}

function renderVisited(){
  const el=document.getElementById('visitedList');
  el.innerHTML=[...visited].map(id=>`<span class="visited-item">${nodes[id].name}</span>`).join('');
}

function updateScore(ok){if(ok){score+=10+streak*5;streak++}else{streak=0}document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak}

function getBFSNext(){
  if(queue.length===0)return-1;
  const front=queue[0];
  const neighbors=nodes[front].adj.filter(n=>!visited.has(n)&&!queue.includes(n));
  if(neighbors.length===0)return-1;
  return neighbors[Math.floor(Math.random()*neighbors.length)];
}

function startRound(){
  genGraph();visited=new Set();queue=[];current=null;
  const start=Math.floor(Math.random()*nodes.length);
  queue.push(start);visited.add(start);current=start;
  renderGraph();renderQueue();renderVisited();showQ();
  document.getElementById('startBtn').style.display='none';
  document.getElementById('resetBtn').style.display='';
  document.getElementById('round').textContent=round;
  document.getElementById('messageArea').innerHTML='';
}

function showQ(){
  const front=queue.length>0?queue[0]:null;
  const neighbors=front!==null?nodes[front].adj.filter(n=>!visited.has(n)&&!queue.includes(n)):[];
  if(neighbors.length===0&&queue.length<=1){
    document.getElementById('messageArea').innerHTML='<div class="message correct">BFS complete! All reachable nodes visited.</div>';
    document.getElementById('choicesArea').innerHTML='';
    round++;document.getElementById('startBtn').style.display='';document.getElementById('startBtn').textContent='Next Round';
    document.getElementById('resetBtn').style.display='none';
    return;
  }
  let choices=neighbors.map(n=>({node:n,text:nodes[n].name,correct:true}));
  // Add some wrong choices
  const unvisited=nodes.filter(n=>!visited.has(n.id)&&!queue.includes(n.id)&&!neighbors.includes(n.id));
  unvisited.slice(0,3).forEach(n=>choices.push({node:n.id,text:n.name,correct:false}));
  choices.sort(()=>Math.random()-.5);
  let html=`<p style="margin-bottom:8px;color:#94a3b8">Currently at ${nodes[front].name}. Which node to visit next (BFS)?</p>`;
  choices.forEach(c=>{html+=`<button class="choice-btn" onclick="answer(${c.correct},${c.node},this)">${c.text}</button>`});
  document.getElementById('choicesArea').innerHTML=html;
}

function answer(ok,nodeId,el){
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  el.classList.add(ok?'correct':'wrong');
  document.getElementById('messageArea').innerHTML=`<div class="message ${ok?'correct':'wrong'}">${ok?'Correct! +'+(10+streak*5)+' points':'Wrong! Next should be a neighbor of the queue front.'}</div>`;
  updateScore(ok);
  if(ok){
    queue.push(nodeId);visited.add(nodeId);
  }
  // Process queue front
  const front=queue[0];
  const frontNeighbors=nodes[front].adj.filter(n=>!visited.has(n)&&!queue.includes(n));
  if(frontNeighbors.length===0||ok){
    if(!ok){
      // Wrong answer: still advance
      queue.shift();current=queue.length>0?queue[0]:null;
    }
  }
  // Actually for BFS: dequeue front, add all neighbors
  queue.shift();
  const f=visited.size>0?[...visited].pop():0;
  nodes[front].adj.filter(n=>!visited.has(n)&&!queue.includes(n)).forEach(n=>{queue.push(n);visited.add(n)});
  current=queue.length>0?queue[0]:null;
  renderGraph();renderQueue();renderVisited();
  setTimeout(()=>showQ(),700);
}

function resetAll(){
  document.getElementById('startBtn').style.display='';document.getElementById('startBtn').textContent='Start Round';
  document.getElementById('resetBtn').style.display='none';
  document.getElementById('choicesArea').innerHTML='';document.getElementById('messageArea').innerHTML='';
  document.getElementById('graphSvg').innerHTML='';
  document.getElementById('queueList').innerHTML='';document.getElementById('visitedList').innerHTML='';
}
</script>
</body>
</html>
