<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stack Operations Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #334155}
.topbar a{color:#38bdf8;text-decoration:none;font-weight:600}
.topbar h1{font-size:1.2rem;color:#f1f5f9}
.container{max-width:800px;margin:0 auto;padding:24px}
.score-bar{display:flex;justify-content:space-between;background:#1e293b;border-radius:12px;padding:16px 24px;margin-bottom:20px}
.score-val{color:#38bdf8;font-weight:700;font-size:1.3rem}
.stack-area{display:flex;justify-content:center;gap:40px;margin-bottom:24px;align-items:flex-end}
.stack-visual{background:#1e293b;border-radius:12px;padding:20px;min-width:200px;position:relative}
.stack-base{width:100%;height:4px;background:#475569;border-radius:2px;margin-top:8px}
.stack-label{color:#94a3b8;font-weight:600;margin-bottom:12px;text-align:center}
.stack-items{display:flex;flex-direction:column-reverse;gap:4px;min-height:200px;align-items:center}
.stack-item{width:160px;padding:10px;text-align:center;background:#334155;border:2px solid #475569;border-radius:8px;font-weight:700;transition:all .4s}
.stack-item.top{border-color:#facc15;background:#422006}
.stack-item.popping{border-color:#ef4444;background:#7f1d1d;animation:popAnim .4s}
.stack-item.pushing{border-color:#22c55e;background:#14532d;animation:pushAnim .4s}
@keyframes popAnim{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-30px);opacity:0}}
@keyframes pushAnim{0%{transform:translateY(-30px);opacity:0}100%{transform:translateY(0);opacity:1}}
.op-history{background:#1e293b;border-radius:12px;padding:16px;margin-bottom:20px}
.op-history h3{color:#94a3b8;margin-bottom:8px;font-size:.9rem}
.op-list{display:flex;gap:8px;flex-wrap:wrap}
.op-tag{padding:4px 10px;border-radius:6px;font-size:.8rem;font-weight:600}
.op-tag.push{background:#14532d;color:#4ade80}
.op-tag.pop{background:#7f1d1d;color:#fca5a5}
.op-tag.peek{background:#422006;color:#facc15}
.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.btn{padding:10px 24px;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}
.btn-primary{background:#38bdf8;color:#0f172a}
.btn-secondary{background:#334155;color:#e2e8f0}
.choice-btn{display:block;width:100%;padding:12px 20px;margin-bottom:8px;background:#334155;color:#e2e8f0;border:2px solid #475569;border-radius:8px;font-size:1rem;cursor:pointer;text-align:left;transition:all .2s}
.choice-btn:hover{border-color:#38bdf8;background:#1e3a5f}
.choice-btn.correct{border-color:#22c55e;background:#14532d}
.choice-btn.wrong{border-color:#ef4444;background:#7f1d1d}
.message{text-align:center;font-size:1.1rem;padding:12px;border-radius:8px;margin-bottom:12px}
.message.correct{background:#14532d;color:#4ade80}
.message.wrong{background:#7f1d1d;color:#fca5a5}
.instructions{background:#1e293b;border-radius:12px;padding:20px;margin-bottom:20px}
.instructions h2{color:#38bdf8;margin-bottom:8px}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">&#8592; Home</a><h1>Stack Operations Game</h1></div>
<div class="container">
  <div class="score-bar">
    <span>Score: <span class="score-val" id="score">0</span></span>
    <span>Round: <span class="score-val" id="round">1</span></span>
    <span>Streak: <span class="score-val" id="streak">0</span> &#128293;</span>
  </div>
  <div class="stack-area">
    <div class="stack-visual">
      <div class="stack-label">Stack (top &#8593;)</div>
      <div class="stack-items" id="stackItems"></div>
      <div class="stack-base"></div>
    </div>
  </div>
  <div class="op-history"><h3>Operations Performed:</h3><div class="op-list" id="opList"></div></div>
  <div class="instructions"><h2>How to Play</h2><p>Stack is LIFO (Last In, First Out). Given a sequence of operations, predict the stack state, top element, or which operation comes next!</p></div>
  <div id="messageArea"></div>
  <div id="choicesArea"></div>
  <div class="btn-row">
    <button class="btn btn-primary" id="startBtn" onclick="startRound()">Start Round</button>
    <button class="btn btn-secondary" id="resetBtn" onclick="resetAll()" style="display:none">New Round</button>
  </div>
</div>
<script>
let stack=[],ops=[],opIdx=0,score=0,round=1,streak=0,answered=false;

function renderStack(){
  const el=document.getElementById('stackItems');el.innerHTML='';
  stack.forEach((v,i)=>{
    const d=document.createElement('div');d.className='stack-item';
    if(i===stack.length-1)d.classList.add('top');
    d.textContent=v;el.appendChild(d);
  });
}

function renderOps(){
  const el=document.getElementById('opList');el.innerHTML='';
  ops.slice(0,opIdx).forEach(o=>{
    const tag=document.createElement('span');tag.className='op-tag '+o.type;
    tag.textContent=o.type==='push'?`push(${o.val})`:o.type==='pop'?'pop()':'peek()';
    el.appendChild(tag);
  });
}

function updateScore(ok){if(ok){score+=10+streak*5;streak++}else{streak=0}document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak}

function genOps(){
  ops=[];let s=[];
  const count=4+Math.floor(Math.random()*3);
  for(let i=0;i<count;i++){
    const r=Math.random();
    if(s.length===0||r<0.5){
      const v=Math.floor(Math.random()*90)+10;
      ops.push({type:'push',val:v});s.push(v);
    }else if(r<0.8){
      ops.push({type:'pop',val:s.pop()});
    }else{
      ops.push({type:'peek',val:s[s.length-1]});
    }
  }
}

function startRound(){
  stack=[];opIdx=0;answered=false;genOps();
  renderStack();renderOps();showQ();
  document.getElementById('startBtn').style.display='none';
  document.getElementById('resetBtn').style.display='';
  document.getElementById('round').textContent=round;
  document.getElementById('messageArea').innerHTML='';
}

function showQ(){
  if(opIdx>=ops.length){
    document.getElementById('messageArea').innerHTML='<div class="message correct">All operations complete!</div>';
    document.getElementById('choicesArea').innerHTML='';
    round++;document.getElementById('startBtn').style.display='';document.getElementById('startBtn').textContent='Next Round';
    document.getElementById('resetBtn').style.display='none';
    return;
  }
  const op=ops[opIdx];
  answered=false;
  let choices=[];
  if(op.type==='push'){
    const afterPush=[...stack,op.val];
    choices=[
      {text:`After push(${op.val}): Stack = [${afterPush}]`,correct:true},
      {text:`After push(${op.val}): Stack = [${op.val},...${stack}]`,correct:false},
      {text:`After push(${op.val}): Stack = [${stack}] (no change)`,correct:false}
    ];
  }else if(op.type==='pop'){
    const popped=stack[stack.length-1];
    const afterPop=stack.slice(0,-1);
    choices=[
      {text:`Pop returns ${popped}, stack becomes [${afterPop}]`,correct:true},
      {text:`Pop returns ${stack[0]}, stack becomes [${afterPop}]`,correct:false},
      {text:`Pop returns ${popped}, stack stays [${stack}]`,correct:false}
    ];
  }else{
    choices=[
      {text:`Peek returns ${stack[stack.length-1]} (top element)`,correct:true},
      {text:`Peek returns ${stack[0]} (bottom element)`,correct:false},
      {text:`Peek removes ${stack[stack.length-1]} from stack`,correct:false}
    ];
  }
  choices.sort(()=>Math.random()-.5);
  let html=`<p style="margin-bottom:8px;color:#94a3b8">Operation ${opIdx+1}/${ops.length}. Current stack: [${stack}]</p>`;
  choices.forEach(c=>{html+=`<button class="choice-btn" onclick="answer(${c.correct},this)">${c.text}</button>`});
  document.getElementById('choicesArea').innerHTML=html;
}

function answer(ok,el){
  if(answered)return;answered=true;
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  el.classList.add(ok?'correct':'wrong');
  document.getElementById('messageArea').innerHTML=`<div class="message ${ok?'correct':'wrong'}">${ok?'Correct! +'+(10+streak*5)+' points':'Wrong!'}</div>`;
  updateScore(ok);
  setTimeout(()=>{
    const op=ops[opIdx];
    if(op.type==='push')stack.push(op.val);
    else if(op.type==='pop')stack.pop();
    opIdx++;renderStack();renderOps();showQ();
  },700);
}

function resetAll(){
  document.getElementById('startBtn').style.display='';document.getElementById('startBtn').textContent='Start Round';
  document.getElementById('resetBtn').style.display='none';
  document.getElementById('choicesArea').innerHTML='';document.getElementById('messageArea').innerHTML='';
  document.getElementById('stackItems').innerHTML='';document.getElementById('opList').innerHTML='';
}
</script>
</body>
</html>
