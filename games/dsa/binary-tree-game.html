<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary Search Tree Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #334155}
.topbar a{color:#38bdf8;text-decoration:none;font-weight:600}
.topbar h1{font-size:1.2rem;color:#f1f5f9}
.container{max-width:950px;margin:0 auto;padding:24px}
.score-bar{display:flex;justify-content:space-between;background:#1e293b;border-radius:12px;padding:16px 24px;margin-bottom:20px}
.score-val{color:#38bdf8;font-weight:700;font-size:1.3rem}
.tree-area{background:#1e293b;border-radius:12px;padding:20px;margin-bottom:20px;overflow-x:auto;min-height:300px}
.tree-visual{position:relative;min-height:280px}
.tree-node{position:absolute;display:flex;flex-direction:column;align-items:center}
.tree-circle{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;border:3px solid #475565;transition:all .4s;z-index:1}
.tree-circle.root{border-color:#38bdf8;background:#1e3a5f}
.tree-circle.inserting{border-color:#22c55e;background:#14532d}
.tree-circle.comparing{border-color:#facc15;background:#422006}
.tree-circle.found{border-color:#a855f7;background:#581c87}
.tree-line{position:absolute;background:#475565;width:2px;z-index:0}
.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.btn{padding:10px 24px;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}
.btn-primary{background:#38bdf8;color:#0f172a}
.btn-secondary{background:#334155;color:#e2e8f0}
.choice-btn{display:block;width:100%;padding:12px 20px;margin-bottom:8px;background:#334155;color:#e2e8f0;border:2px solid #475569;border-radius:8px;font-size:1rem;cursor:pointer;text-align:left;transition:all .2s}
.choice-btn:hover{border-color:#38bdf8;background:#1e3a5f}
.choice-btn.correct{border-color:#22c55e;background:#14532d}
.choice-btn.wrong{border-color:#ef4444;background:#7f1d1d}
.message{text-align:center;font-size:1.1rem;padding:12px;border-radius:8px;margin-bottom:12px}
.message.correct{background:#14532d;color:#4ade80}
.message.wrong{background:#7f1d1d;color:#fca5a5}
.instructions{background:#1e293b;border-radius:12px;padding:20px;margin-bottom:20px}
.instructions h2{color:#38bdf8;margin-bottom:8px}
.inorder-display{background:#1e293b;border-radius:12px;padding:12px 20px;margin-bottom:20px;text-align:center}
.inorder-label{color:#94a3b8;font-size:.85rem;margin-bottom:4px}
.inorder-val{color:#38bdf8;font-weight:700;font-size:1.1rem}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">&#8592; Home</a><h1>Binary Search Tree Game</h1></div>
<div class="container">
  <div class="score-bar">
    <span>Score: <span class="score-val" id="score">0</span></span>
    <span>Round: <span class="score-val" id="round">1</span></span>
    <span>Streak: <span class="score-val" id="streak">0</span> &#128293;</span>
  </div>
  <div class="inorder-display"><div class="inorder-label">In-order traversal:</div><div class="inorder-val" id="inorder">-</div></div>
  <div class="tree-area"><div class="tree-visual" id="treeVisual"></div></div>
  <div class="instructions"><h2>How to Play</h2><p>BST property: left &lt; parent &lt; right. Predict where a new value will be inserted, or trace the search path!</p></div>
  <div id="messageArea"></div>
  <div id="choicesArea"></div>
  <div class="btn-row">
    <button class="btn btn-primary" id="startBtn" onclick="startRound()">Start Round</button>
    <button class="btn btn-secondary" id="resetBtn" onclick="resetAll()" style="display:none">New Tree</button>
  </div>
</div>
<script>
let tree=null,score=0,round=1,streak=0,insertVal=0;

function Node(val,left=null,right=null){return{val,left,right}}

function insert(root,val){
  if(!root)return Node(val);
  if(val<root.val)root.left=insert(root.left,val);
  else if(val>root.val)root.right=insert(root.right,val);
  return root;
}

function inorder(root,res=[]){if(root){inorder(root.left,res);res.push(root.val);inorder(root.right,res)}return res}

function renderTree(node,x,y,dx,hl={}){
  if(!node)return;
  const el=document.getElementById('treeVisual');
  if(node.left){
    const line=document.createElement('div');line.className='tree-line';
    line.style.cssText=`left:${x}px;top:${y+24}px;width:2px;height:${dy=28}px;transform-origin:top;transform:rotate(${Math.atan2(28,dx)*180/Math.PI}deg)`;
    el.appendChild(line);
    renderTree(node.left,x-dx,y+56,dx/2,hl);
  }
  if(node.right){
    const line=document.createElement('div');line.className='tree-line';
    line.style.cssText=`left:${x}px;top:${y+24}px;width:2px;height:28px;transform-origin:top;transform:rotate(${-Math.atan2(28,dx)*180/Math.PI}deg)`;
    el.appendChild(line);
    renderTree(node.right,x+dx,y+56,dx/2,hl);
  }
  const nd=document.createElement('div');nd.className='tree-node';nd.style.left=(x-24)+'px';nd.style.top=y+'px';
  const circ=document.createElement('div');circ.className='tree-circle';
  if(!node.left&&!node.right&&hl.root)circ.classList.add('root');
  if(hl.comparing===node.val)circ.classList.add('comparing');
  if(hl.found===node.val)circ.classList.add('found');
  if(hl.inserting===node.val)circ.classList.add('inserting');
  circ.textContent=node.val;nd.appendChild(circ);el.appendChild(nd);
}

function render(hl={}){
  document.getElementById('treeVisual').innerHTML='';
  if(tree)renderTree(tree,300,20,120,hl);
  document.getElementById('inorder').textContent=inorder(tree).join(' \u2192 ');
}

function updateScore(ok){if(ok){score+=10+streak*5;streak++}else{streak=0}document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak}

function countNodes(root){return root?1+countNodes(root.left)+countNodes(root.right):0}

function startRound(){
  tree=null;
  const vals=[50,30,70,20,40,60,80].sort(()=>Math.random()-.5).slice(0,4+Math.floor(Math.random()*2));
  vals.forEach(v=>tree=insert(tree,v));
  // Pick a value to insert
  insertVal=Math.floor(Math.random()*90)+5;
  while(inorder(tree).includes(insertVal))insertVal=Math.floor(Math.random()*90)+5;
  render({root:true});showQ();
  document.getElementById('startBtn').style.display='none';
  document.getElementById('resetBtn').style.display='';
  document.getElementById('round').textContent=round;
  document.getElementById('messageArea').innerHTML='';
}

function showQ(){
  const path=[];let cur=tree;
  while(cur){path.push(cur.val);if(insertVal<cur.val)cur=cur.left;else cur=cur.right}
  const choices=[
    {text:`Path: ${path.join(' \u2192 ')} \u2192 insert at ${path[path.length-1]}'s ${insertVal<path[path.length-1]?'left':'right'}`,correct:true},
    {text:`Path: ${path.slice(0,Math.max(1,path.length-1)).join(' \u2192 ')} \u2192 insert as child of ${path[Math.max(0,path.length-2)]}`,correct:false},
    {text:`Insert directly as root (new root)`,correct:false},
    {text:`${insertVal} already exists in tree`,correct:false}
  ].sort(()=>Math.random()-.5);
  let html=`<p style="margin-bottom:8px;color:#94a3b8">Insert value ${insertVal}. Where does it go?</p>`;
  choices.forEach(c=>{html+=`<button class="choice-btn" onclick="answer(${c.correct},this)">${c.text}</button>`});
  document.getElementById('choicesArea').innerHTML=html;
}

function answer(ok,el){
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  el.classList.add(ok?'correct':'wrong');
  document.getElementById('messageArea').innerHTML=`<div class="message ${ok?'correct':'wrong'}">${ok?'Correct! +'+(10+streak*5)+' points':'Wrong!'}</div>`;
  updateScore(ok);
  setTimeout(()=>{
    tree=insert(tree,insertVal);render({inserting:insertVal});
    round++;document.getElementById('startBtn').style.display='';document.getElementById('startBtn').textContent='Next Round';
    document.getElementById('resetBtn').style.display='none';
    document.getElementById('choicesArea').innerHTML='';
  },900);
}

function resetAll(){
  document.getElementById('startBtn').style.display='';document.getElementById('startBtn').textContent='Start Round';
  document.getElementById('resetBtn').style.display='none';
  document.getElementById('choicesArea').innerHTML='';document.getElementById('messageArea').innerHTML='';
  document.getElementById('treeVisual').innerHTML='';document.getElementById('inorder').textContent='-';
}
</script>
</body>
</html>
