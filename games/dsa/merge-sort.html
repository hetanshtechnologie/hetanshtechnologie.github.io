<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merge Sort Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #334155}
.topbar a{color:#38bdf8;text-decoration:none;font-weight:600}
.topbar h1{font-size:1.2rem;color:#f1f5f9}
.container{max-width:950px;margin:0 auto;padding:24px}
.score-bar{display:flex;justify-content:space-between;background:#1e293b;border-radius:12px;padding:16px 24px;margin-bottom:20px}
.score-val{color:#38bdf8;font-weight:700;font-size:1.3rem}
.split-view{display:flex;gap:16px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.subarray{background:#1e293b;border-radius:12px;padding:16px;min-width:120px;text-align:center;border:2px solid #334155}
.subarray.active{border-color:#38bdf8}
.subarray.merged{border-color:#22c55e}
.subarray h3{font-size:.85rem;color:#94a3b8;margin-bottom:8px}
.elements{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.el{width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;background:#334155}
.el.highlight{background:#38bdf8;color:#0f172a}
.array-container{display:flex;gap:6px;justify-content:center;align-items:flex-end;height:240px;padding:20px;background:#1e293b;border-radius:12px;margin-bottom:20px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bar-inner{width:52px;border-radius:6px 6px 0 0;transition:all .4s}
.bar-label{font-size:14px;font-weight:700;margin-bottom:6px}
.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.btn{padding:10px 24px;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}
.btn-primary{background:#38bdf8;color:#0f172a}
.btn-secondary{background:#334155;color:#e2e8f0}
.btn-success{background:#22c55e;color:#fff}
.choice-btn{display:block;width:100%;padding:12px 20px;margin-bottom:8px;background:#334155;color:#e2e8f0;border:2px solid #475569;border-radius:8px;font-size:1rem;cursor:pointer;text-align:left;transition:all .2s}
.choice-btn:hover{border-color:#38bdf8;background:#1e3a5f}
.choice-btn.correct{border-color:#22c55e;background:#14532d}
.choice-btn.wrong{border-color:#ef4444;background:#7f1d1d}
.message{text-align:center;font-size:1.1rem;padding:12px;border-radius:8px;margin-bottom:12px}
.message.correct{background:#14532d;color:#4ade80}
.message.wrong{background:#7f1d1d;color:#fca5a5}
.instructions{background:#1e293b;border-radius:12px;padding:20px;margin-bottom:20px}
.instructions h2{color:#38bdf8;margin-bottom:8px}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">&#8592; Home</a><h1>Merge Sort Game</h1></div>
<div class="container">
  <div class="score-bar">
    <span>Score: <span class="score-val" id="score">0</span></span>
    <span>Round: <span class="score-val" id="round">1</span></span>
    <span>Streak: <span class="score-val" id="streak">0</span> &#128293;</span>
  </div>
  <div class="array-container" id="mainArray"></div>
  <div class="split-view" id="splitView"></div>
  <div class="instructions"><h2>How to Play</h2><p>Merge sort recursively splits the array, then merges sorted halves. Predict the split points or the merged result!</p></div>
  <div id="messageArea"></div>
  <div id="choicesArea"></div>
  <div class="btn-row">
    <button class="btn btn-primary" id="startBtn" onclick="startRound()">Start Round</button>
    <button class="btn btn-secondary" id="stepBtn" onclick="doStep()" style="display:none">Step</button>
    <button class="btn btn-secondary" id="resetBtn" onclick="resetAll()" style="display:none">New Array</button>
  </div>
</div>
<script>
let arr=[],origArr=[],score=0,round=1,streak=0,mergeQueue=[],phase='split',autoTimer=null;

function gen(n=8){let a=[];while(a.length<n){let v=Math.floor(Math.random()*50)+5;if(!a.includes(v))a.push(v)}return a}

function renderMain(hl={}){
  const c=document.getElementById('mainArray');c.innerHTML='';const mx=Math.max(...arr);
  arr.forEach((v,i)=>{
    const b=document.createElement('div');b.className='bar';
    const h=(v/mx)*200;
    b.innerHTML=`<span class="bar-label">${v}</span><div class="bar-inner" style="height:${h}px;background:hsl(${200+i*12},60%,50%)"></div>`;
    c.appendChild(b);
  });
}

function renderSplits(splits){
  const c=document.getElementById('splitView');c.innerHTML='';
  splits.forEach((s,i)=>{
    const d=document.createElement('div');d.className='subarray';
    d.innerHTML=`<h3>Subarray ${i+1}</h3><div class="elements">${s.map(v=>`<div class="el">${v}</div>`).join('')}</div>`;
    c.appendChild(d);
  });
}

function logMsg(m){document.getElementById('log')&&0;document.getElementById('messageArea')}

function updateScore(ok){if(ok){score+=10+streak*5;streak++}else{streak=0}document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak}

function getAllSplits(a,start=0,splits=[]){
  if(a.length<=1)return splits;
  const mid=Math.floor(a.length/2);
  splits.push({left:a.slice(0,mid),right:a.slice(mid)});
  getAllSplits(a.slice(0,mid),start,splits);
  getAllSplits(a.slice(mid),start+mid,splits);
  return splits;
}

function mergeHalves(l,r){
  let res=[],i=0,j=0;
  while(i<l.length&&j<r.length){if(l[i]<=r[j])res.push(l[i++]);else res.push(r[j++])}
  while(i<l.length)res.push(l[i++]);while(j<r.length)res.push(r[j++]);
  return res;
}

function makeMergeChoices(l,r){
  const correct=mergeHalves(l,r);
  let wrongs=[];
  // Wrong 1: reversed
  wrongs.push([...correct].reverse());
  // Wrong 2: sorted wrong
  wrongs.push([...l,...r].sort((a,b)=>b-a));
  // Wrong 3: one element off
  let w3=[...correct];if(w3.length>2)[w3[0],w3[1]]=[w3[1],w3[0]];wrongs.push(w3);
  const options=[correct,...wrongs.slice(0,3)].sort(()=>Math.random()-.5);
  return{correct,options,correctStr:JSON.stringify(correct)};
}

function startRound(){
  arr=gen(8);origArr=[...arr];
  document.getElementById('startBtn').style.display='none';
  ['stepBtn','resetBtn'].forEach(id=>document.getElementById(id).style.display='');
  document.getElementById('round').textContent=round;
  document.getElementById('messageArea').innerHTML='';
  document.getElementById('choicesArea').innerHTML='';
  // Build merge queue (bottom up)
  mergeQueue=[];
  buildMergeQueue([...arr]);
  phase='merge';
  renderMain();renderQueue();
  showQ();
}

function buildMergeQueue(a){
  if(a.length<=1)return a;
  const mid=Math.floor(a.length/2);
  const l=buildMergeQueue(a.slice(0,mid));
  const r=buildMergeQueue(a.slice(mid));
  mergeQueue.push({left:l,right:r});
  return mergeHalves(l,r);
}

function renderQueue(){
  const c=document.getElementById('splitView');c.innerHTML='';
  mergeQueue.forEach((m,i)=>{
    const d=document.createElement('div');d.className=`subarray ${i===0?'active':''}`;
    d.innerHTML=`<h3>Merge ${i+1}</h3><div class="elements">
      <div style="margin-right:8px">${m.left.map(v=>`<div class="el">${v}</div>`).join('')}</div>
      <div style="color:#475569;display:flex;align-items:center;font-size:1.5rem">+</div>
      <div style="margin-left:8px">${m.right.map(v=>`<div class="el">${v}</div>`).join('')}</div>
    </div>`;
    c.appendChild(d);
  });
}

function showQ(){
  if(mergeQueue.length===0){
    document.getElementById('messageArea').innerHTML='<div class="message correct">All merges done! Array sorted!</div>';
    document.getElementById('choicesArea').innerHTML='';
    round++;document.getElementById('startBtn').style.display='';document.getElementById('startBtn').textContent='Next Round';
    ['stepBtn','resetBtn'].forEach(id=>document.getElementById(id).style.display='none');
    document.getElementById('splitView').innerHTML='';
    return;
  }
  const m=mergeQueue[0];
  const{correct,options,correctStr}=makeMergeChoices(m.left,m.right);
  let html=`<p style="margin-bottom:8px;color:#94a3b8">Merge [${m.left}] + [${m.right}]. What's the result?</p>`;
  options.forEach(opt=>{
    const isCorrect=JSON.stringify(opt)===correctStr;
    html+=`<button class="choice-btn" data-correct="${isCorrect}" onclick="answer(this)">${JSON.stringify(opt)}</button>`;
  });
  document.getElementById('choicesArea').innerHTML=html;
}

function answer(el){
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  const ok=el.dataset.correct==='true';
  el.classList.add(ok?'correct':'wrong');
  document.getElementById('messageArea').innerHTML=`<div class="message ${ok?'correct':'wrong'}">${ok?'Correct! +'+(10+streak*5)+' points':'Wrong!'}</div>`;
  updateScore(ok);
  if(!ok)document.querySelectorAll('.choice-btn').forEach(b=>{if(b.dataset.correct==='true')b.classList.add('correct')});
  setTimeout(()=>doStep(),900);
}

function doStep(){
  document.getElementById('messageArea').innerHTML='';
  if(mergeQueue.length===0)return showQ();
  const m=mergeQueue.shift();
  const merged=mergeHalves(m.left,m.right);
  // Update arr with merged result (simplified: rebuild from queue)
  renderMain();renderQueue();
  showQ();
}

function resetAll(){
  if(autoTimer)clearInterval(autoTimer);
  document.getElementById('startBtn').style.display='';document.getElementById('startBtn').textContent='Start Round';
  ['stepBtn','resetBtn'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('choicesArea').innerHTML='';document.getElementById('messageArea').innerHTML='';
  document.getElementById('splitView').innerHTML='';document.getElementById('mainArray').innerHTML='';
}
</script>
</body>
</html>
