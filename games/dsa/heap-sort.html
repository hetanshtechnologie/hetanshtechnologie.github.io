<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heap Sort Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #334155}
.topbar a{color:#38bdf8;text-decoration:none;font-weight:600}
.topbar h1{font-size:1.2rem;color:#f1f5f9}
.container{max-width:950px;margin:0 auto;padding:24px}
.score-bar{display:flex;justify-content:space-between;background:#1e293b;border-radius:12px;padding:16px 24px;margin-bottom:20px}
.score-val{color:#38bdf8;font-weight:700;font-size:1.3rem}
.heap-display{display:flex;justify-content:center;padding:24px;background:#1e293b;border-radius:12px;margin-bottom:20px;overflow-x:auto}
.heap-level{display:flex;justify-content:center;gap:8px;margin-bottom:16px;position:relative}
.heap-node{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;border:3px solid #334155;transition:all .4s;flex-shrink:0}
.heap-node.heapifying{border-color:#facc15;box-shadow:0 0 16px #facc15}
.heap-node.violating{border-color:#ef4444;box-shadow:0 0 16px #ef4444}
.heap-node.sorted{border-color:#22c55e;background:#14532d}
.heap-node.swapping{border-color:#a855f7;box-shadow:0 0 20px #a855f7}
.arr-display{display:flex;gap:6px;justify-content:center;margin-bottom:20px;background:#1e293b;border-radius:12px;padding:16px}
.arr-el{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#334155;font-weight:700;font-size:1rem;transition:all .3s}
.arr-el.active{background:#38bdf8;color:#0f172a}
.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.btn{padding:10px 24px;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}
.btn-primary{background:#38bdf8;color:#0f172a}
.btn-secondary{background:#334155;color:#e2e8f0}
.choice-btn{display:block;width:100%;padding:12px 20px;margin-bottom:8px;background:#334155;color:#e2e8f0;border:2px solid #475569;border-radius:8px;font-size:1rem;cursor:pointer;text-align:left;transition:all .2s}
.choice-btn:hover{border-color:#38bdf8;background:#1e3a5f}
.choice-btn.correct{border-color:#22c55e;background:#14532d}
.choice-btn.wrong{border-color:#ef4444;background:#7f1d1d}
.message{text-align:center;font-size:1.1rem;padding:12px;border-radius:8px;margin-bottom:12px}
.message.correct{background:#14532d;color:#4ade80}
.message.wrong{background:#7f1d1d;color:#fca5a5}
.instructions{background:#1e293b;border-radius:12px;padding:20px;margin-bottom:20px}
.instructions h2{color:#38bdf8;margin-bottom:8px}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">&#8592; Home</a><h1>Heap Sort Game</h1></div>
<div class="container">
  <div class="score-bar">
    <span>Score: <span class="score-val" id="score">0</span></span>
    <span>Round: <span class="score-val" id="round">1</span></span>
    <span>Streak: <span class="score-val" id="streak">0</span> &#128293;</span>
  </div>
  <div class="arr-display" id="arrDisplay"></div>
  <div class="heap-display" id="heapDisplay"></div>
  <div class="instructions"><h2>How to Play</h2><p>Heap sort builds a max-heap, then extracts the max. Predict heapify steps, choose correct swaps, or identify violations!</p></div>
  <div id="messageArea"></div>
  <div id="choicesArea"></div>
  <div class="btn-row">
    <button class="btn btn-primary" id="startBtn" onclick="startRound()">Start Round</button>
    <button class="btn btn-secondary" id="stepBtn" onclick="doStep()" style="display:none">Step</button>
    <button class="btn btn-secondary" id="resetBtn" onclick="resetAll()" style="display:none">New Array</button>
  </div>
</div>
<script>
let arr=[],score=0,round=1,streak=0,heapSize=0,phase='build',curIdx=0,autoTimer=null;

function gen(n=7){let a=[];while(a.length<n){let v=Math.floor(Math.random()*50)+5;if(!a.includes(v))a.push(v)}return a}

function parent(i){return Math.floor((i-1)/2)}
function left(i){return 2*i+1}
function right(i){return 2*i+2}

function renderArr(active=-1){
  const c=document.getElementById('arrDisplay');c.innerHTML='';
  arr.forEach((v,i)=>{
    const d=document.createElement('div');d.className='arr-el';
    if(i===active)d.classList.add('active');
    if(i>=heapSize&&phase==='extract')d.style.opacity='.4';
    d.textContent=v;c.appendChild(d);
  });
}

function renderHeap(heapifying=-1,violating=-1,swapping=-1,sortedEnd=-1){
  const c=document.getElementById('heapDisplay');c.innerHTML='';
  if(heapSize===0){c.innerHTML='<p style="color:#94a3b8">Heap is empty</p>';return}
  const levels=Math.ceil(Math.log2(heapSize+1));
  for(let lvl=0;lvl<levels;lvl++){
    const row=document.createElement('div');row.className='heap-level';
    const start=Math.pow(2,lvl)-1;const end=Math.min(Math.pow(2,lvl+1)-1,heapSize);
    for(let i=start;i<end;i++){
      if(i>=arr.length)break;
      const nd=document.createElement('div');nd.className='heap-node';
      if(i===heapifying)nd.classList.add('heapifying');
      if(i===violating)nd.classList.add('violating');
      if(i===swapping)nd.classList.add('swapping');
      if(sortedEnd>=0&&i>=sortedEnd)nd.classList.add('sorted');
      nd.textContent=arr[i];row.appendChild(nd);
    }
    c.appendChild(row);
  }
}

function updateScore(ok){if(ok){score+=10+streak*5;streak++}else{streak=0}document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak}

function heapify(i,hSize){
  let largest=i;const l=left(i),r=right(i);
  if(l<hSize&&arr[l]>arr[largest])largest=l;
  if(r<hSize&&arr[r]>arr[largest])largest=r;
  return largest!==i?largest:-1;
}

function startRound(){
  arr=gen(7);heapSize=arr.length;phase='build';curIdx=Math.floor(arr.length/2)-1;
  renderArr();renderHeap();showQ();
  document.getElementById('startBtn').style.display='none';
  ['stepBtn','resetBtn'].forEach(id=>document.getElementById(id).style.display='');
  document.getElementById('round').textContent=round;
  document.getElementById('messageArea').innerHTML='';
}

function showQ(){
  if(phase==='build'&&curIdx<0){
    phase='extract';curIdx=0;
    document.getElementById('messageArea').innerHTML='<div class="message correct">Max-heap built! Now extracting...</div>';
  }
  if(phase==='extract'&&heapSize<=1){
    renderArr();renderHeap(-1,-1,-1,0);
    document.getElementById('messageArea').innerHTML='<div class="message correct">Heap sorted!</div>';
    document.getElementById('choicesArea').innerHTML='';
    round++;document.getElementById('startBtn').style.display='';document.getElementById('startBtn').textContent='Next Round';
    ['stepBtn','resetBtn'].forEach(id=>document.getElementById(id).style.display='none');
    return;
  }
  renderArr(phase==='extract'&&heapSize<arr.length?heapSize:-1);

  if(phase==='build'){
    const l=left(curIdx),r=right(curIdx);
    const lVal=l<heapSize?arr[l]:-Infinity;
    const rVal=r<heapSize?arr[r]:-Infinity;
    const maxChild=lVal>rVal?l:r;const maxVal=Math.max(lVal,rVal);
    const needsSwap=arr[curIdx]<maxVal;
    renderHeap(needsSwap?curIdx:-1,-1,-1);
    const choices=[
      {text:`Swap arr[${curIdx}]=${arr[curIdx]} with arr[${maxChild}]=${arr[maxChild]} (max child)`,correct:needsSwap&&maxChild===maxChild},
      {text:`No swap needed — heap property satisfied`,correct:!needsSwap},
      {text:`Swap arr[${curIdx}] with arr[${parent(curIdx)>=0?parent(curIdx):0}] (parent)`,correct:false},
      {text:`Swap left child with right child`,correct:false}
    ].sort(()=>Math.random()-.5);
    let html=`<p style="margin-bottom:8px;color:#94a3b8">Heapify node ${curIdx} (value ${arr[curIdx]}). Left=${l<heapSize?arr[l]:'-'}, Right=${r<heapSize?arr[r]:'-'}</p>`;
    choices.forEach(c=>{html+=`<button class="choice-btn" onclick="answer(${c.correct},this)">${c.text}</button>`});
    document.getElementById('choicesArea').innerHTML=html;
  }else{
    const choices=[
      {text:`Swap root ${arr[0]} with last element ${arr[heapSize-1]}`,correct:true},
      {text:`Remove root ${arr[0]} directly`,correct:false},
      {text:`Re-heapify root first`,correct:false},
      {text:`Swap root with left child`,correct:false}
    ].sort(()=>Math.random()-.5);
    renderHeap(0);
    let html=`<p style="margin-bottom:8px;color:#94a3b8">Extract phase: Heap size=${heapSize}. Root=${arr[0]}</p>`;
    choices.forEach(c=>{html+=`<button class="choice-btn" onclick="answer(${c.correct},this)">${c.text}</button>`});
    document.getElementById('choicesArea').innerHTML=html;
  }
}

function answer(ok,el){
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  el.classList.add(ok?'correct':'wrong');
  document.getElementById('messageArea').innerHTML=`<div class="message ${ok?'correct':'wrong'}">${ok?'Correct! +'+(10+streak*5)+' points':'Wrong!'}</div>`;
  updateScore(ok);
  setTimeout(()=>doStep(),700);
}

function doStep(){
  document.getElementById('messageArea').innerHTML='';
  if(phase==='build'){
    const l=left(curIdx),r=right(curIdx);
    const lVal=l<heapSize?arr[l]:-Infinity;
    const rVal=r<heapSize?arr[r]:-Infinity;
    if(arr[curIdx]<Math.max(lVal,rVal)){
      const maxC=lVal>rVal?l:r;
      [arr[curIdx],arr[maxC]]=[arr[maxC],arr[curIdx]];
      renderArr();renderHeap(maxC);
    }else{renderArr();renderHeap()}
    curIdx--;
  }else{
    [arr[0],arr[heapSize-1]]=[arr[heapSize-1],arr[0]];
    heapSize--;
    let i=0;
    while(true){
      const l=left(i),r=right(i);let mx=i;
      if(l<heapSize&&arr[l]>arr[mx])mx=l;
      if(r<heapSize&&arr[r]>arr[mx])mx=r;
      if(mx===i)break;
      [arr[i],arr[mx]]=[arr[mx],arr[i]];i=mx;
    }
    renderArr();renderHeap(-1,-1,-1,heapSize);
  }
  setTimeout(()=>showQ(),500);
}

function resetAll(){
  document.getElementById('startBtn').style.display='';document.getElementById('startBtn').textContent='Start Round';
  ['stepBtn','resetBtn'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('choicesArea').innerHTML='';document.getElementById('messageArea').innerHTML='';
  document.getElementById('arrDisplay').innerHTML='';document.getElementById('heapDisplay').innerHTML='';
}
</script>
</body>
</html>
