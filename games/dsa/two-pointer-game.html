<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two Pointer Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #334155}
.topbar a{color:#38bdf8;text-decoration:none;font-weight:600}
.topbar h1{font-size:1.2rem;color:#f1f5f9}
.container{max-width:900px;margin:0 auto;padding:24px}
.score-bar{display:flex;justify-content:space-between;background:#1e293b;border-radius:12px;padding:16px 24px;margin-bottom:20px}
.score-val{color:#38bdf8;font-weight:700;font-size:1.3rem}
.target-display{display:flex;gap:16px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.target-box{background:#1e293b;border-radius:12px;padding:12px 24px;text-align:center}
.target-box h3{color:#94a3b8;font-size:.8rem;margin-bottom:4px}
.target-box .val{color:#facc15;font-size:1.5rem;font-weight:700}
.array-container{display:flex;gap:8px;justify-content:center;align-items:flex-end;height:280px;padding:20px;background:#1e293b;border-radius:12px;margin-bottom:20px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transition:all .3s;border-radius:6px 6px 0 0}
.bar-inner{width:56px;border-radius:6px 6px 0 0;transition:all .4s}
.bar-label{font-size:15px;font-weight:700;margin-bottom:6px}
.bar-index{font-size:11px;color:#94a3b8;margin-top:4px}
.bar.pointer-left .bar-inner{box-shadow:0 0 16px #22c55e;border:2px solid #22c55e}
.bar.pointer-right .bar-inner{box-shadow:0 0 16px #ef4444;border:2px solid #ef4444}
.bar.matched .bar-inner{box-shadow:0 0 20px #facc15;background:#facc15!important}
.bar .pointer-label{position:absolute;top:-24px;font-size:12px;font-weight:700;color:#fff;padding:2px 8px;border-radius:4px}
.bar.pointer-left .pointer-label{background:#22c55e}
.bar.pointer-right .pointer-label{background:#ef4444}
.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.btn{padding:10px 24px;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}
.btn-primary{background:#38bdf8;color:#0f172a}
.btn-secondary{background:#334155;color:#e2e8f0}
.choice-btn{display:block;width:100%;padding:12px 20px;margin-bottom:8px;background:#334155;color:#e2e8f0;border:2px solid #475569;border-radius:8px;font-size:1rem;cursor:pointer;text-align:left;transition:all .2s}
.choice-btn:hover{border-color:#38bdf8;background:#1e3a5f}
.choice-btn.correct{border-color:#22c55e;background:#14532d}
.choice-btn.wrong{border-color:#ef4444;background:#7f1d1d}
.message{text-align:center;font-size:1.1rem;padding:12px;border-radius:8px;margin-bottom:12px}
.message.correct{background:#14532d;color:#4ade80}
.message.wrong{background:#7f1d1d;color:#fca5a5}
.instructions{background:#1e293b;border-radius:12px;padding:20px;margin-bottom:20px}
.instructions h2{color:#38bdf8;margin-bottom:8px}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">&#8592; Home</a><h1>Two Pointer Game</h1></div>
<div class="container">
  <div class="score-bar">
    <span>Score: <span class="score-val" id="score">0</span></span>
    <span>Round: <span class="score-val" id="round">1</span></span>
    <span>Streak: <span class="score-val" id="streak">0</span> &#128293;</span>
  </div>
  <div class="target-display">
    <div class="target-box"><h3>Target Sum</h3><div class="val" id="targetVal">-</div></div>
    <div class="target-box"><h3>Left Pointer</h3><div class="val" id="leftVal">-</div></div>
    <div class="target-box"><h3>Right Pointer</h3><div class="val" id="rightVal">-</div></div>
    <div class="target-box"><h3>Current Sum</h3><div class="val" id="curSum">-</div></div>
  </div>
  <div class="array-container" id="arrayContainer"></div>
  <div class="instructions"><h2>How to Play</h2><p>Two pointers approach: one at start, one at end of a sorted array. Move pointers to find a pair that sums to the target!</p></div>
  <div id="messageArea"></div>
  <div id="choicesArea"></div>
  <div class="btn-row">
    <button class="btn btn-primary" id="startBtn" onclick="startRound()">Start Round</button>
    <button class="btn btn-secondary" id="resetBtn" onclick="resetAll()" style="display:none">New Array</button>
  </div>
</div>
<script>
let arr=[],target=0,left=0,right=0,score=0,round=1,streak=0,found=false;

function genArr(n=8){
  let a=[];while(a.length<n){const v=Math.floor(Math.random()*40)+5;if(!a.includes(v))a.push(v)}
  return a.sort((a,b)=>a-b);
}

function render(){
  const c=document.getElementById('arrayContainer');c.innerHTML='';const mx=Math.max(...arr);
  arr.forEach((v,i)=>{
    const b=document.createElement('div');b.className='bar';b.style.position='relative';
    if(i===left)b.classList.add('pointer-left');
    if(i===right)b.classList.add('pointer-right');
    if(found&&(i===left||i===right))b.classList.add('matched');
    const h=(v/mx)*220;
    b.innerHTML=`<div class="pointer-label">${i===left?'L':i===right?'R':''}</div><span class="bar-label">${v}</span><div class="bar-inner" style="height:${h}px;background:hsl(${200+i*12},60%,48%)"></div><span class="bar-index">[${i}]</span>`;
    c.appendChild(b);
  });
  document.getElementById('leftVal').textContent=arr[left]!==undefined?arr[left]:'-';
  document.getElementById('rightVal').textContent=arr[right]!==undefined?arr[right]:'-';
  document.getElementById('curSum').textContent=left<=right?arr[left]+arr[right]:'-';
}

function updateScore(ok){if(ok){score+=10+streak*5;streak++}else{streak=0}document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak}

function startRound(){
  arr=genArr();left=0;right=arr.length-1;found=false;
  // Ensure a pair exists
  const i1=Math.floor(Math.random()*arr.length);
  let i2=Math.floor(Math.random()*arr.length);
  while(i2===i1)i2=Math.floor(Math.random()*arr.length);
  target=arr[i1]+arr[i2];
  document.getElementById('targetVal').textContent=target;
  render();showQ();
  document.getElementById('startBtn').style.display='none';
  document.getElementById('resetBtn').style.display='';
  document.getElementById('round').textContent=round;
  document.getElementById('messageArea').innerHTML='';
}

function showQ(){
  if(found)return;
  if(left>=right){
    document.getElementById('messageArea').innerHTML='<div class="message wrong">Pointers crossed — no pair found (this shouldn\'t happen)!</div>';
    round++;document.getElementById('startBtn').style.display='';document.getElementById('startBtn').textContent='Next Round';
    document.getElementById('resetBtn').style.display='none';document.getElementById('choicesArea').innerHTML='';
    return;
  }
  const sum=arr[left]+arr[right];
  let choices=[];
  if(sum===target){
    choices=[{text:`Found! arr[${left}]+arr[${right}] = ${arr[left]}+${arr[right]} = ${target}`,correct:true}];
  }else if(sum>target){
    choices=[
      {text:`Sum ${sum} > target ${target} → Move RIGHT pointer left (decrease sum)`,correct:true},
      {text:`Sum ${sum} > target ${target} → Move LEFT pointer right (increase sum)`,correct:false},
      {text:`Sum ${sum} > target ${target} → Move both pointers inward`,correct:false}
    ];
  }else{
    choices=[
      {text:`Sum ${sum} < target ${target} → Move LEFT pointer right (increase sum)`,correct:true},
      {text:`Sum ${sum} < target ${target} → Move RIGHT pointer left (decrease sum)`,correct:false},
      {text:`Sum ${sum} < target ${target} → Move both pointers outward`,correct:false}
    ];
  }
  choices.sort(()=>Math.random()-.5);
  let html=`<p style="margin-bottom:8px;color:#94a3b8">arr[${left}]+arr[${right}] = ${arr[left]}+${arr[right]} = ${sum}. Target = ${target}</p>`;
  choices.forEach(c=>{html+=`<button class="choice-btn" onclick="answer('${sum===target?'found':sum>target?'right':'left'}','${c.correct==='true'?'true':'false'}',this)">${c.text}</button>`});
  document.getElementById('choicesArea').innerHTML=html;
}

function answer(action,correctStr,el){
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  const ok=correctStr==='true';
  el.classList.add(ok?'correct':'wrong');
  document.getElementById('messageArea').innerHTML=`<div class="message ${ok?'correct':'wrong'}">${ok?'Correct! +'+(10+streak*5)+' points':'Wrong!'}</div>`;
  updateScore(ok);
  setTimeout(()=>{
    if(action==='found'){
      found=true;render();
      document.getElementById('messageArea').innerHTML=`<div class="message correct">Pair found: ${arr[left]}+${arr[right]}=${target}! +${10+((streak>0?streak-1:0))*5} points</div>`;
      round++;document.getElementById('startBtn').style.display='';document.getElementById('startBtn').textContent='Next Round';
      document.getElementById('resetBtn').style.display='none';
      document.getElementById('choicesArea').innerHTML='';
    }else if(action==='right'){
      right--;
    }else{
      left++;
    }
    if(!found){render();showQ()}
  },700);
}

function resetAll(){
  document.getElementById('startBtn').style.display='';document.getElementById('startBtn').textContent='Start Round';
  document.getElementById('resetBtn').style.display='none';
  document.getElementById('choicesArea').innerHTML='';document.getElementById('messageArea').innerHTML='';
  document.getElementById('arrayContainer').innerHTML='';
  document.getElementById('targetVal').textContent='-';
  document.getElementById('leftVal').textContent='-';
  document.getElementById('rightVal').textContent='-';
  document.getElementById('curSum').textContent='-';
}
</script>
</body>
</html>
