<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shape Memory - Memory Game</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:#1e293b;border-bottom:1px solid #334155}
.top-bar a{color:#818cf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px;font-weight:700}
.stats{display:flex;justify-content:center;gap:32px;padding:16px;background:#1e293b;margin:16px;border-radius:12px}
.stat{text-align:center}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8}
.stat-value{font-size:24px;font-weight:700;color:#818cf8}
#board{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:20px}
.shape-sequence{display:flex;gap:12px;font-size:48px;min-height:80px;flex-wrap:wrap;justify-content:center}
.shape-sequence .item{opacity:0.3;transition:opacity .3s}
.shape-sequence .item.active{opacity:1}
.btn{padding:12px 32px;background:#818cf8;color:#0f172a;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{background:#6366f1}
.info{color:#94a3b8;text-align:center}
.choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.choice-btn{width:72px;height:72px;background:#334155;border:none;border-radius:12px;font-size:36px;cursor:pointer;transition:transform .2s,background .2s}
.choice-btn:hover{transform:scale(1.15);background:#475569}
.start-screen,.complete{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:20px}
.start-screen h2{font-size:28px;color:#818cf8}
.start-screen p{color:#94a3b8;text-align:center;max-width:400px}
.complete h2{color:#34d399}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="top-bar">
  <a href="../index.html">← Back</a>
  <h1>Shape Memory</h1>
  <span></span>
</div>
<div class="stats">
  <div class="stat"><div class="stat-label">Level</div><div class="stat-value" id="level">1</div></div>
  <div class="stat"><div class="stat-label">Score</div><div class="stat-value" id="score">0</div></div>
  <div class="stat"><div class="stat-label">Best</div><div class="stat-value" id="best">0</div></div>
</div>
<div id="board">
  <div class="start-screen" id="startScreen">
    <h2>Shape Memory</h2>
    <p>Watch the shape sequence, then recreate it by picking shapes in order!</p>
    <button class="btn" onclick="startGame()">Play</button>
  </div>
  <div class="info" id="info"></div>
  <div class="shape-sequence" id="shapeDisplay"></div>
  <div class="choices" id="choices"></div>
  <div class="complete hidden" id="complete">
    <h2>Game Over!</h2>
    <p id="completeMsg"></p>
    <button class="btn" onclick="startGame()">Play Again</button>
  </div>
</div>
<script>
const SHAPES=['△','□','◇','○','☆','⬡','⬢','⬟','⬟','⬟','⬢','⬟'];
let level=1,score=0,best=0,sequence=[],playerPick=[];
const shapeDisplay=document.getElementById('shapeDisplay');
const choicesDiv=document.getElementById('choices');
const info=document.getElementById('info');
const complete=document.getElementById('complete');
const startScreen=document.getElementById('startScreen');

function startGame(){
  level=1;score=0;
  document.getElementById('score').textContent='0';
  document.getElementById('level').textContent='1';
  startScreen.classList.add('hidden');complete.classList.add('hidden');
  nextRound();
}
function nextRound(){
  let len=level+2;
  sequence=[];playerPick=[];
  for(let i=0;i<len;i++)sequence.push(SHAPES[Math.floor(Math.random()*SHAPES.length)]);
  shapeDisplay.innerHTML='';choicesDiv.innerHTML='';
  info.textContent='Watch the sequence!';
  let i=0;
  const iv=setInterval(()=>{
    if(i<len){
      let s=document.createElement('span');s.textContent=sequence[i];s.className='item active';
      shapeDisplay.appendChild(s);i++;
    }else{
      clearInterval(iv);
      shapeDisplay.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));
      info.textContent='Now pick '+len+' shapes in order!';
      let btns=[...new Set(SHAPES)].sort(()=>Math.random()-0.5);
      btns.forEach(e=>{
        let b=document.createElement('button');b.className='choice-btn';b.textContent=e;
        b.onclick=()=>pickShape(e);choicesDiv.appendChild(b);
      });
    }
  },700);
}
function pickShape(e){
  playerPick.push(e);
  let idx=playerPick.length-1;
  if(playerPick[idx]!==sequence[idx]){
    info.textContent='Wrong order!';
    choicesDiv.innerHTML='';shapeDisplay.innerHTML='<span style="font-size:48px">✗</span>';
    if(score>best){best=score;document.getElementById('best').textContent=best}
    setTimeout(()=>{complete.classList.remove('hidden');
      document.getElementById('completeMsg').textContent='Score: '+score+' | Level reached: '+level;
    },1000);return;
  }
  if(playerPick.length===sequence.length){
    score+=level*10;level++;
    document.getElementById('score').textContent=score;
    document.getElementById('level').textContent=level;
    info.textContent='Correct!';choicesDiv.innerHTML='';
    shapeDisplay.innerHTML='<span style="font-size:48px;color:#34d399">✓</span>';
    setTimeout(()=>nextRound(),800);
  }
}
</script>
</body>
</html>
