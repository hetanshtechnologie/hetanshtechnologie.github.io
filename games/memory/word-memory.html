<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Memory - Memory Game</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:#1e293b;border-bottom:1px solid #334155}
.top-bar a{color:#818cf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px;font-weight:700}
.stats{display:flex;justify-content:center;gap:32px;padding:16px;background:#1e293b;margin:16px;border-radius:12px}
.stat{text-align:center}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8}
.stat-value{font-size:24px;font-weight:700;color:#818cf8}
#board{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:20px}
.word-display{font-size:36px;font-weight:700;color:#818cf8;min-height:60px;display:flex;align-items:center}
.btn{padding:12px 32px;background:#818cf8;color:#0f172a;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{background:#6366f1}
.btn-yes{background:#22c55e}.btn-yes:hover{background:#16a34a}
.btn-no{background:#ef4444}.btn-no:hover{background:#dc2626}
.info{color:#94a3b8;text-align:center}
.choices{display:flex;gap:16px}
.start-screen,.complete{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:20px}
.start-screen h2{font-size:28px;color:#818cf8}
.start-screen p{color:#94a3b8;text-align:center;max-width:400px}
.complete h2{color:#34d399}
.hidden{display:none!important}
.progress{color:#94a3b8;font-size:14px}
</style>
</head>
<body>
<div class="top-bar">
  <a href="../index.html">← Back</a>
  <h1>Word Memory</h1>
  <span></span>
</div>
<div class="stats">
  <div class="stat"><div class="stat-label">Level</div><div class="stat-value" id="level">1</div></div>
  <div class="stat"><div class="stat-label">Score</div><div class="stat-value" id="score">0</div></div>
  <div class="stat"><div class="stat-label">Best</div><div class="stat-value" id="best">0</div></div>
</div>
<div id="board">
  <div class="start-screen" id="startScreen">
    <h2>Word Memory</h2>
    <p>Watch words flash on screen, then answer if the current word was shown!</p>
    <button class="btn" onclick="startGame()">Play</button>
  </div>
  <div class="info" id="info"></div>
  <div class="progress" id="progress"></div>
  <div class="word-display" id="wordDisplay"></div>
  <div class="choices" id="choices">
    <button class="btn btn-yes" onclick="answer(true)">Yes ✓</button>
    <button class="btn btn-no" onclick="answer(false)">No ✗</button>
  </div>
  <div class="complete hidden" id="complete">
    <h2>Game Over!</h2>
    <p id="completeMsg"></p>
    <button class="btn" onclick="startGame()">Play Again</button>
  </div>
</div>
<script>
const WORDS=['apple','banana','cherry','dog','eagle','flame','guitar','house','igloo','jungle','kite','lemon','mango','night','ocean','piano','queen','river','storm','tiger','ultra','vivid','whale','xenon','yield','zebra','brick','cloud','dance','ember','frost','glow','haze','iron','jazz','knot','lens','maple','nova','orbit','pearl','quilt','rope','solar','thorn','unity','vapor','wisp','xerox','youth','zinc'];
let level=1,score=0,best=0,wordSet=[],testWords=[],testIdx=0,phase='show',showIdx=0;
const wordDisplay=document.getElementById('wordDisplay');
const info=document.getElementById('info');
const progress=document.getElementById('progress');
const choices=document.getElementById('choices');
const complete=document.getElementById('complete');
const startScreen=document.getElementById('startScreen');

function startGame(){
  level=1;score=0;
  document.getElementById('score').textContent='0';
  document.getElementById('level').textContent='1';
  startScreen.classList.add('hidden');
  complete.classList.add('hidden');
  choices.style.display='flex';
  nextRound();
}
function nextRound(){
  let numWords=level+3;
  let shuffled=[...WORDS].sort(()=>Math.random()-0.5);
  wordSet=new Set();
  for(let i=0;i<numWords;i++)wordSet.add(shuffled[i]);
  testWords=[...shuffled.slice(numWords,numWords+Math.floor(numWords/2)+1)];
  let yesCount=Math.floor(testWords.length*0.6);
  for(let i=0;i<yesCount;i++){
    let from=[...wordSet];testWords[i]=from[Math.floor(Math.random()*from.length)];
  }
  testWords.sort(()=>Math.random()-0.5);
  testIdx=0;phase='show';showIdx=0;
  info.textContent='Memorize these '+numWords+' words:';
  progress.textContent='';
  showWords();
}
function showWords(){
  let arr=[...wordSet];
  if(showIdx>=arr.length){
    info.textContent='Was this word in the list?';phase='test';showNextTest();return;
  }
  wordDisplay.textContent=arr[showIdx];
  progress.textContent=(showIdx+1)+'/'+arr.length;
  showIdx++;
  setTimeout(()=>showWords(),800);
}
function showNextTest(){
  if(testIdx>=testWords.length){
    score+=level*10;level++;
    document.getElementById('score').textContent=score;
    document.getElementById('level').textContent=level;
    info.textContent='Round complete!';
    wordDisplay.textContent='✓';wordDisplay.style.color='#34d399';
    choices.style.display='none';
    setTimeout(()=>nextRound(),1000);return;
  }
  wordDisplay.textContent=testWords[testIdx];
  wordDisplay.style.color='#e2e8f0';
  progress.textContent=(testIdx+1)+'/'+testWords.length;
}
function answer(yes){
  if(phase!=='test')return;
  let correct=wordSet.has(testWords[testIdx]);
  if(yes===correct){
    testIdx++;showNextTest();
  }else{
    info.textContent='Wrong! "'+testWords[testIdx]}" was '+(correct?'in':'not in')+' the list.';
    wordDisplay.style.color='#ef4444';choices.style.display='none';
    if(score>best){best=score;document.getElementById('best').textContent=best}
    setTimeout(()=>{complete.classList.remove('hidden');
      document.getElementById('completeMsg').textContent='Score: '+score+' | Level reached: '+level;
    },1200);
  }
}
</script>
</body>
</html>
