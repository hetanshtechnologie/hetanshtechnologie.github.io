<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter Memory - Memory Game</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:#1e293b;border-bottom:1px solid #334155}
.top-bar a{color:#818cf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px;font-weight:700}
.stats{display:flex;justify-content:center;gap:32px;padding:16px;background:#1e293b;margin:16px;border-radius:12px}
.stat{text-align:center}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8}
.stat-value{font-size:24px;font-weight:700;color:#818cf8}
#board{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:20px}
.letters-display{display:flex;gap:8px;min-height:60px;flex-wrap:wrap;justify-content:center}
.letter-item{width:48px;height:48px;background:#334155;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;transition:all .3s;color:#e2e8f0}
.letter-item.active{background:#818cf8;color:#0f172a;transform:scale(1.1)}
.letter-item.picked{background:#065f46;color:#e2e8f0}
.letter-item.wrong{background:#7f1d1d;color:#ef4444}
.letter-grid{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:500px}
.letter-btn{width:44px;height:44px;background:#334155;border:none;border-radius:6px;color:#e2e8f0;font-size:18px;font-weight:600;cursor:pointer;transition:transform .2s,background .2s}
.letter-btn:hover{transform:scale(1.1);background:#475569}
.btn{padding:12px 32px;background:#818cf8;color:#0f172a;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{background:#6366f1}
.info{color:#94a3b8;text-align:center}
.start-screen,.complete{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:20px}
.start-screen h2{font-size:28px;color:#818cf8}
.start-screen p{color:#94a3b8;text-align:center;max-width:400px}
.complete h2{color:#34d399}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="top-bar">
  <a href="../index.html">← Back</a>
  <h1>Letter Memory</h1>
  <span></span>
</div>
<div class="stats">
  <div class="stat"><div class="stat-label">Level</div><div class="stat-value" id="level">1</div></div>
  <div class="stat"><div class="stat-label">Score</div><div class="stat-value" id="score">0</div></div>
  <div class="stat"><div class="stat-label">Best</div><div class="stat-value" id="best">0</div></div>
</div>
<div id="board">
  <div class="start-screen" id="startScreen">
    <h2>Letter Memory</h2>
    <p>Watch letters appear in order, then pick them back!</p>
    <button class="btn" onclick="startGame()">Play</button>
  </div>
  <div class="info" id="info"></div>
  <div class="letters-display" id="lettersDisplay"></div>
  <div class="letter-grid" id="letterGrid"></div>
  <div class="complete hidden" id="complete">
    <h2>Game Over!</h2>
    <p id="completeMsg"></p>
    <button class="btn" onclick="startGame()">Play Again</button>
  </div>
</div>
<script>
const LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
let level=1,score=0,best=0,sequence=[],playerPick=[];
const lettersDisplay=document.getElementById('lettersDisplay');
const letterGrid=document.getElementById('letterGrid');
const info=document.getElementById('info');
const complete=document.getElementById('complete');
const startScreen=document.getElementById('startScreen');

function startGame(){
  level=1;score=0;
  document.getElementById('score').textContent='0';
  document.getElementById('level').textContent='1';
  startScreen.classList.add('hidden');complete.classList.add('hidden');
  nextRound();
}
function nextRound(){
  let len=level+2;
  sequence=[];playerPick=[];
  let pool=[...LETTERS].sort(()=>Math.random()-0.5);
  for(let i=0;i<len;i++)sequence.push(pool[i]);
  lettersDisplay.innerHTML='';letterGrid.innerHTML='';
  info.textContent='Watch the letters!';
  let i=0;
  const iv=setInterval(()=>{
    if(i<len){
      let el=document.createElement('div');el.className='letter-item active';el.textContent=sequence[i];
      lettersDisplay.appendChild(el);i++;
    }else{
      clearInterval(iv);
      lettersDisplay.querySelectorAll('.letter-item').forEach(x=>x.classList.remove('active'));
      info.textContent='Now pick '+len+' letters in order!';
      let btns=[...LETTERS].sort(()=>Math.random()-0.5);
      btns.forEach(l=>{
        let b=document.createElement('button');b.className='letter-btn';b.textContent=l;
        b.onclick=()=>pickLetter(l);letterGrid.appendChild(b);
      });
    }
  },600);
}
function pickLetter(l){
  playerPick.push(l);
  let idx=playerPick.length-1;
  let display=lettersDisplay.children[idx];
  if(l===sequence[idx]){
    display.className='letter-item picked';
  }else{
    display.className='letter-item wrong';display.textContent=l;
    info.textContent='Wrong letter!';
    letterGrid.innerHTML='';
    if(score>best){best=score;document.getElementById('best').textContent=best}
    setTimeout(()=>{complete.classList.remove('hidden');
      document.getElementById('completeMsg').textContent='Score: '+score+' | Level reached: '+level;
    },1000);return;
  }
  if(playerPick.length===sequence.length){
    letterGrid.innerHTML='';score+=level*10;level++;
    document.getElementById('score').textContent=score;
    document.getElementById('level').textContent=level;
    info.textContent='Correct!';
    setTimeout(()=>nextRound(),800);
  }
}
</script>
</body>
</html>
