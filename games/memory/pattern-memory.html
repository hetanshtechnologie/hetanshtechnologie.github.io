<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern Memory - Memory Game</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:#1e293b;border-bottom:1px solid #334155}
.top-bar a{color:#818cf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px;font-weight:700}
.stats{display:flex;justify-content:center;gap:32px;padding:16px;background:#1e293b;margin:16px;border-radius:12px}
.stat{text-align:center}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8}
.stat-value{font-size:24px;font-weight:700;color:#818cf8}
#board{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:20px}
.grid{display:grid;gap:6px}
.cell{width:64px;height:64px;background:#1e293b;border-radius:8px;cursor:pointer;transition:background .3s;border:2px solid #334155;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:transparent}
.cell:hover{background:#334155}
.cell.highlight{background:#818cf8;color:#0f172a}
.cell.clicked{background:#065f46;color:#e2e8f0;border-color:#065f46}
.cell.wrong{background:#7f1d1d;color:#ef4444;border-color:#ef4444}
.btn{padding:12px 32px;background:#818cf8;color:#0f172a;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{background:#6366f1}
.info{color:#94a3b8;text-align:center}
.start-screen,.complete{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:20px}
.start-screen h2{font-size:28px;color:#818cf8}
.start-screen p{color:#94a3b8;text-align:center;max-width:400px}
.complete h2{color:#34d399}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="top-bar">
  <a href="../index.html">← Back</a>
  <h1>Pattern Memory</h1>
  <span></span>
</div>
<div class="stats">
  <div class="stat"><div class="stat-label">Level</div><div class="stat-value" id="level">1</div></div>
  <div class="stat"><div class="stat-label">Score</div><div class="stat-value" id="score">0</div></div>
  <div class="stat"><div class="stat-label">Best</div><div class="stat-value" id="best">0</div></div>
</div>
<div id="board">
  <div class="start-screen" id="startScreen">
    <h2>Pattern Memory</h2>
    <p>A numbered pattern appears on the grid. Memorize it, then click cells 1, 2, 3... in order!</p>
    <button class="btn" onclick="startGame()">Play</button>
  </div>
  <div class="info" id="info"></div>
  <div class="grid" id="grid"></div>
  <div class="complete hidden" id="complete">
    <h2>Game Over!</h2>
    <p id="completeMsg"></p>
    <button class="btn" onclick="startGame()">Play Again</button>
  </div>
</div>
<script>
let level=1,score=0,best=0,gridSize=4,sequence=[],playerPick=[],playing=false;
const gridDiv=document.getElementById('grid');
const info=document.getElementById('info');
const complete=document.getElementById('complete');
const startScreen=document.getElementById('startScreen');

function startGame(){
  level=1;score=0;
  document.getElementById('score').textContent='0';
  document.getElementById('level').textContent='1';
  startScreen.classList.add('hidden');complete.classList.add('hidden');
  nextRound();
}
function nextRound(){
  gridSize=Math.min(3+Math.floor((level-1)/2),5);
  let numShow=Math.min(level+3,gridSize*gridSize);
  sequence=[];playerPick=[];playing=false;
  let positions=[];
  for(let i=0;i<gridSize*gridSize;i++)positions.push(i);
  positions.sort(()=>Math.random()-0.5);
  for(let i=0;i<numShow;i++)sequence.push({pos:positions[i],num:i+1});
  gridDiv.style.gridTemplateColumns='repeat('+gridSize+',64px)';
  gridDiv.innerHTML='';
  for(let i=0;i<gridSize*gridSize;i++){
    let cell=document.createElement('div');cell.className='cell';cell.dataset.idx=i;
    cell.onclick=()=>clickCell(cell,i);
    gridDiv.appendChild(cell);
  }
  info.textContent='Memorize the pattern!';
  showPattern(0);
}
function showPattern(i){
  if(i>=sequence.length){
    info.textContent='Click cells in order 1-'+sequence.length+'!';playing=true;
    gridDiv.querySelectorAll('.cell').forEach(c=>{c.classList.remove('highlight');c.textContent='';c.style.color='transparent'});
    return;
  }
  let cell=gridDiv.children[sequence[i].pos];
  cell.classList.add('highlight');cell.textContent=sequence[i].num;cell.style.color='#0f172a';
  setTimeout(()=>{
    cell.classList.remove('highlight');cell.textContent='';cell.style.color='transparent';
    setTimeout(()=>showPattern(i+1),100);
  },500);
}
function clickCell(cell,idx){
  if(!playing)return;
  let expected=sequence[playerPick.length].pos;
  if(idx===expected){
    cell.classList.add('clicked');cell.textContent=sequence[playerPick.length].num;cell.style.color='#e2e8f0';
    playerPick.push(idx);
    if(playerPick.length===sequence.length){
      playing=false;score+=level*10;level++;
      document.getElementById('score').textContent=score;
      document.getElementById('level').textContent=level;
      info.textContent='Correct!';
      setTimeout(()=>nextRound(),800);
    }
  }else{
    cell.classList.add('wrong');playing=false;
    info.textContent='Wrong cell!';
    if(score>best){best=score;document.getElementById('best').textContent=best}
    setTimeout(()=>{complete.classList.remove('hidden');
      document.getElementById('completeMsg').textContent='Score: '+score+' | Level reached: '+level;
    },1000);
  }
}
</script>
</body>
</html>
