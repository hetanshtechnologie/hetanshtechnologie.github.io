<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Memory - Memory Game</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:#1e293b;border-bottom:1px solid #334155}
.top-bar a{color:#818cf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px;font-weight:700}
.stats{display:flex;justify-content:center;gap:32px;padding:16px;background:#1e293b;margin:16px;border-radius:12px}
.stat{text-align:center}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8}
.stat-value{font-size:24px;font-weight:700;color:#818cf8}
#board{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:20px}
.number-display{font-size:80px;font-weight:700;color:#818cf8;min-height:100px;display:flex;align-items:center;justify-content:center;letter-spacing:8px}
.btn{padding:12px 32px;background:#818cf8;color:#0f172a;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{background:#6366f1}
.info{color:#94a3b8;text-align:center}
.input-area{display:flex;gap:8px;align-items:center}
.input-area input{padding:12px 16px;background:#334155;border:2px solid #475569;border-radius:8px;color:#e2e8f0;font-size:22px;font-family:inherit;width:250px;text-align:center;letter-spacing:4px}
.input-area input:focus{outline:none;border-color:#818cf8}
.start-screen,.complete{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:20px}
.start-screen h2{font-size:28px;color:#818cf8}
.start-screen p{color:#94a3b8;text-align:center;max-width:400px}
.complete h2{color:#34d399}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="top-bar">
  <a href="../index.html">← Back</a>
  <h1>Number Memory</h1>
  <span></span>
</div>
<div class="stats">
  <div class="stat"><div class="stat-label">Level</div><div class="stat-value" id="level">1</div></div>
  <div class="stat"><div class="stat-label">Digits</div><div class="stat-value" id="digits">1</div></div>
  <div class="stat"><div class="stat-label">Best</div><div class="stat-value" id="best">0</div></div>
</div>
<div id="board">
  <div class="start-screen" id="startScreen">
    <h2>Number Memory</h2>
    <p>A number appears for 3 seconds. Memorize it and type it back! Digits increase each level.</p>
    <button class="btn" onclick="startGame()">Play</button>
  </div>
  <div class="info" id="info"></div>
  <div class="number-display" id="numberDisplay"></div>
  <div class="input-area hidden" id="inputArea">
    <input type="text" id="answer" placeholder="Type the number">
    <button class="btn" onclick="checkAnswer()">Submit</button>
  </div>
  <div class="complete hidden" id="complete">
    <h2>Game Over!</h2>
    <p id="completeMsg"></p>
    <button class="btn" onclick="startGame()">Play Again</button>
  </div>
</div>
<script>
let level=1,bestLevel=0,number='';
const numberDisplay=document.getElementById('numberDisplay');
const info=document.getElementById('info');
const inputArea=document.getElementById('inputArea');
const answer=document.getElementById('answer');
const complete=document.getElementById('complete');
const startScreen=document.getElementById('startScreen');

function startGame(){
  level=1;
  document.getElementById('level').textContent='1';
  document.getElementById('digits').textContent='1';
  startScreen.classList.add('hidden');complete.classList.add('hidden');
  inputArea.classList.add('hidden');
  nextRound();
}
function nextRound(){
  let digits=level;
  number='';
  for(let i=0;i<digits;i++)number+=Math.floor(Math.random()*10);
  document.getElementById('digits').textContent=digits;
  document.getElementById('level').textContent=level;
  numberDisplay.textContent=number;numberDisplay.style.color='#818cf8';
  info.textContent='Memorize! ('+digits+' digit'+(digits>1?'s':'')+')';
  inputArea.classList.add('hidden');
  setTimeout(()=>{
    numberDisplay.textContent='?';numberDisplay.style.color='#f59e0b';
    info.textContent='Type the '+digits+' digits!';
    inputArea.classList.remove('hidden');answer.value='';answer.focus();
  },3000);
}
function checkAnswer(){
  let input=answer.value.trim();
  if(input===number){
    level++;
    document.getElementById('level').textContent=level;
    numberDisplay.textContent='✓';numberDisplay.style.color='#34d399';
    info.textContent='Correct!';
    inputArea.classList.add('hidden');
    setTimeout(()=>nextRound(),1000);
  }else{
    if(level>bestLevel){bestLevel=level;document.getElementById('best').textContent=bestLevel}
    numberDisplay.textContent=number;numberDisplay.style.color='#ef4444';
    info.textContent='Wrong! It was '+number;
    inputArea.classList.add('hidden');
    setTimeout(()=>{complete.classList.remove('hidden');
      document.getElementById('completeMsg').textContent='Reached level '+level+' ('+level+' digits) | Best: '+bestLevel+' digits';
    },1500);
  }
}
answer.addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer()});
</script>
</body>
</html>
