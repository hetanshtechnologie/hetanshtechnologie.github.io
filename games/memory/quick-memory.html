<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Memory - Memory Game</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:#1e293b;border-bottom:1px solid #334155}
.top-bar a{color:#818cf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px;font-weight:700}
.stats{display:flex;justify-content:center;gap:32px;padding:16px;background:#1e293b;margin:16px;border-radius:12px}
.stat{text-align:center}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8}
.stat-value{font-size:24px;font-weight:700;color:#818cf8}
#board{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:20px}
.grid{display:grid;gap:6px}
.cell{width:60px;height:60px;background:#1e293b;border-radius:8px;cursor:pointer;transition:background .3s;border:2px solid #334155;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:transparent}
.cell:hover{background:#334155}
.cell.show{background:#818cf8;color:#0f172a}
.cell.clicked{background:#065f46;color:#e2e8f0;border-color:#065f46}
.cell.wrong{background:#7f1d1d;color:#ef4444;border-color:#ef4444}
.cell.correct{color:#e2e8f0}
.btn{padding:12px 32px;background:#818cf8;color:#0f172a;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{background:#6366f1}
.info{color:#94a3b8;text-align:center}
.start-screen,.complete{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:20px}
.start-screen h2{font-size:28px;color:#818cf8}
.start-screen p{color:#94a3b8;text-align:center;max-width:400px}
.complete h2{color:#34d399}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="top-bar">
  <a href="../index.html">← Back</a>
  <h1>Quick Memory</h1>
  <span></span>
</div>
<div class="stats">
  <div class="stat"><div class="stat-label">Level</div><div class="stat-value" id="level">1</div></div>
  <div class="stat"><div class="stat-label">Score</div><div class="stat-value" id="score">0</div></div>
  <div class="stat"><div class="stat-label">Best</div><div class="stat-value" id="best">0</div></div>
</div>
<div id="board">
  <div class="start-screen" id="startScreen">
    <h2>Quick Memory</h2>
    <p>Numbers flash briefly on the grid. Remember which cells had numbers and what they were!</p>
    <button class="btn" onclick="startGame()">Play</button>
  </div>
  <div class="info" id="info"></div>
  <div class="grid" id="grid"></div>
  <div class="complete hidden" id="complete">
    <h2>Game Over!</h2>
    <p id="completeMsg"></p>
    <button class="btn" onclick="startGame()">Play Again</button>
  </div>
</div>
<script>
let level=1,score=0,best=0,gridSize=4,cells=[],playerClicks=[],expected=[],playing=false;
const gridDiv=document.getElementById('grid');
const info=document.getElementById('info');
const complete=document.getElementById('complete');
const startScreen=document.getElementById('startScreen');

function startGame(){
  level=1;score=0;
  document.getElementById('score').textContent='0';
  document.getElementById('level').textContent='1';
  startScreen.classList.add('hidden');complete.classList.add('hidden');
  nextRound();
}
function nextRound(){
  gridSize=Math.min(3+Math.floor((level-1)/2),5);
  let numShow=Math.min(level+2,gridSize*gridSize);
  cells=[];playerClicks=[];expected=[];playing=false;
  let positions=[];
  for(let i=0;i<gridSize*gridSize;i++)positions.push(i);
  positions.sort(()=>Math.random()-0.5);
  let nums=[];for(let i=1;i<=9;i++)nums.push(i);nums.sort(()=>Math.random()-0.5);
  for(let i=0;i<numShow;i++)expected.push({pos:positions[i],num:nums[i%nums.length]});
  gridDiv.style.gridTemplateColumns='repeat('+gridSize+',60px)';
  gridDiv.innerHTML='';
  for(let i=0;i<gridSize*gridSize;i++){
    let cell=document.createElement('div');cell.className='cell';cell.dataset.idx=i;
    cell.onclick=()=>clickCell(cell,i);
    gridDiv.appendChild(cell);
  }
  info.textContent='Watch! ('+(level<3?'1s':'0.6s')+')';
  showNumbers(0);
}
function showNumbers(i){
  if(i>=expected.length){
    gridDiv.querySelectorAll('.cell').forEach(c=>{c.classList.remove('show')});
    info.textContent='Click the cells that had numbers (any order)!';
    playing=true;return;
  }
  let cell=gridDiv.children[expected[i].pos];
  cell.classList.add('show');cell.textContent=expected[i].num;
  let delay=level<3?500:300;
  setTimeout(()=>{
    cell.classList.remove('show');
    setTimeout(()=>showNumbers(i+1),50);
  },delay);
}
function clickCell(cell,idx){
  if(!playing||cell.classList.contains('clicked'))return;
  let found=expected.find(e=>e.pos===idx);
  if(found){
    cell.classList.add('clicked','correct');cell.textContent=found.num;
    playerClicks.push(idx);
    if(playerClicks.length===expected.length){
      playing=false;score+=level*10;level++;
      document.getElementById('score').textContent=score;
      document.getElementById('level').textContent=level;
      info.textContent='Perfect recall!';
      setTimeout(()=>nextRound(),800);
    }
  }else{
    cell.classList.add('wrong');cell.textContent='✗';
    info.textContent='That cell was empty!';
    playing=false;
    expected.forEach(e=>{
      let c=gridDiv.children[e.pos];
      if(!c.classList.contains('clicked')){c.classList.add('correct');c.textContent=e.num;c.style.color='#f59e0b'}
    });
    if(score>best){best=score;document.getElementById('best').textContent=best}
    setTimeout(()=>{complete.classList.remove('hidden');
      document.getElementById('completeMsg').textContent='Score: '+score+' | Level reached: '+level;
    },1200);
  }
}
</script>
</body>
</html>
