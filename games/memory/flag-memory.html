<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flag Memory - Memory Game</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:#1e293b;border-bottom:1px solid #334155}
.top-bar a{color:#818cf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px;font-weight:700}
.stats{display:flex;justify-content:center;gap:32px;padding:16px;background:#1e293b;margin:16px;border-radius:12px}
.stat{text-align:center}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8}
.stat-value{font-size:24px;font-weight:700;color:#818cf8}
#board{flex:1;display:grid;gap:10px;padding:16px;justify-content:center;align-content:start}
.card{width:90px;height:90px;background:#1e293b;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .3s;position:relative;border:2px solid #334155}
.card:hover{background:#334155}
.card.flipped{background:#0f172a}
.card.matched{background:#065f46;border-color:#065f46;pointer-events:none}
.card .front,.card .back{position:absolute;width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:10px;backface-visibility:hidden;flex-direction:column}
.card .front{background:#475569;font-size:20px}
.card .back{transform:rotateY(180deg);font-size:14px;text-align:center;padding:4px}
.card .flag{font-size:32px;margin-bottom:4px}
.start-screen,.complete{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:20px}
.start-screen h2,.complete h2{font-size:28px;color:#818cf8}
.start-screen p{color:#94a3b8;text-align:center;max-width:400px}
.btn{padding:12px 32px;background:#818cf8;color:#0f172a;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{background:#6366f1}
.complete h2{color:#34d399}
</style>
</head>
<body>
<div class="top-bar">
  <a href="../index.html">← Back</a>
  <h1>Flag Memory</h1>
  <span></span>
</div>
<div class="stats">
  <div class="stat"><div class="stat-label">Level</div><div class="stat-value" id="level">1</div></div>
  <div class="stat"><div class="stat-label">Pairs</div><div class="stat-value" id="score">0/0</div></div>
  <div class="stat"><div class="stat-label">Moves</div><div class="stat-value" id="moves">0</div></div>
</div>
<div id="board"></div>
<div class="start-screen" id="startScreen" style="display:flex">
  <h2>Flag Memory</h2>
  <p>Match country flags with their names!</p>
  <button class="btn" onclick="startGame()">Play</button>
</div>
<div class="complete" id="complete">
  <h2>Level Complete!</h2>
  <p id="completeMsg"></p>
  <button class="btn" onclick="nextLevel()">Next Level</button>
</div>
<script>
const FLAGS=[
  {flag:'🇮🇳',name:'India'},{flag:'🇺🇸',name:'USA'},{flag:'🇬🇧',name:'UK'},{flag:'🇯🇵',name:'Japan'},
  {flag:'🇫🇷',name:'France'},{flag:'🇩🇪',name:'Germany'},{flag:'🇧🇷',name:'Brazil'},{flag:'🇦🇺',name:'Australia'},
  {flag:'🇨🇦',name:'Canada'},{flag:'🇮🇹',name:'Italy'},{flag:'🇪🇸',name:'Spain'},{flag:'🇲🇽',name:'Mexico'},
  {flag:'🇰🇷',name:'S.Korea'},{flag:'🇨🇳',name:'China'},{flag:'🇷🇺',name:'Russia'},{flag:'🇿🇦',name:'S.Africa'},
  {flag:'🇳🇬',name:'Nigeria'},{flag:'🇪🇬',name:'Egypt'},{flag:'🇦🇷',name:'Argentina'},{flag:'🇹🇷',name:'Turkey'}
];
let level=1,pairs,flipped=[],matched=0,moves=0,lock=false;
const board=document.getElementById('board');
function startGame(){document.getElementById('startScreen').style.display='none';document.getElementById('complete').style.display='none';board.style.display='grid';initLevel()}
function initLevel(){
  matched=0;moves=0;flipped=[];lock=false;
  document.getElementById('level').textContent=level;
  pairs=Math.min(level+2,10);
  document.getElementById('score').textContent='0/'+pairs;
  document.getElementById('moves').textContent='0';
  board.style.gridTemplateColumns='repeat(4,90px)';board.innerHTML='';
  let chosen=FLAGS.slice(0,pairs).sort(()=>Math.random()-0.5);
  let deck=[];
  chosen.forEach(f=>{deck.push({type:'flag',data:f.flag,match:f.name});deck.push({type:'name',data:f.name,match:f.name})});
  for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
  deck.forEach(e=>{
    let c=document.createElement('div');c.className='card';c.dataset.match=e.match;c.dataset.type=e.type;
    let content=e.type==='flag'?'<div class="front">?</div><div class="back"><span class="flag">'+e.data+'</span></div>':
      '<div class="front">?</div><div class="back">'+e.data+'</div>';
    c.innerHTML=content;
    c.onclick=()=>flip(c);board.appendChild(c);
  });
}
function flip(c){
  if(lock||c.classList.contains('flipped')||c.classList.contains('matched'))return;
  c.classList.add('flipped');flipped.push(c);
  if(flipped.length===2){moves++;document.getElementById('moves').textContent=moves;lock=true;
    if(flipped[0].dataset.match===flipped[1].dataset.match){
      flipped[0].classList.add('matched');flipped[1].classList.add('matched');
      matched++;document.getElementById('score').textContent=matched+'/'+pairs;
      flipped=[];lock=false;
      if(matched===pairs)setTimeout(()=>levelComplete(),500);
    }else{setTimeout(()=>{flipped[0].classList.remove('flipped');flipped[1].classList.remove('flipped');flipped=[];lock=false},800)}
  }
}
function levelComplete(){
  document.getElementById('completeMsg').textContent='All '+pairs+' flags in '+moves+' moves!';
  document.getElementById('complete').style.display='flex';board.style.display='none';
}
function nextLevel(){level++;initLevel();document.getElementById('complete').style.display='none';board.style.display='grid'}
</script>
</body>
</html>
