<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Memory - Memory Game</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:#1e293b;border-bottom:1px solid #334155}
.top-bar a{color:#818cf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px;font-weight:700}
.stats{display:flex;justify-content:center;gap:32px;padding:16px;background:#1e293b;margin:16px;border-radius:12px}
.stat{text-align:center}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8}
.stat-value{font-size:24px;font-weight:700;color:#818cf8}
#board{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:20px}
.equation{font-size:48px;font-weight:700;color:#818cf8;min-height:70px;display:flex;align-items:center}
.btn{padding:12px 32px;background:#818cf8;color:#0f172a;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{background:#6366f1}
.info{color:#94a3b8;text-align:center}
.input-area{display:flex;gap:8px;align-items:center}
.input-area input{padding:12px 16px;background:#334155;border:2px solid #475569;border-radius:8px;color:#e2e8f0;font-size:18px;font-family:inherit;width:150px;text-align:center}
.input-area input:focus{outline:none;border-color:#818cf8}
.choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.choice-btn{padding:14px 28px;background:#334155;border:none;border-radius:10px;color:#e2e8f0;font-size:22px;font-weight:700;cursor:pointer;transition:transform .2s,background .2s;font-family:inherit}
.choice-btn:hover{transform:scale(1.08);background:#475569}
.start-screen,.complete{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:20px}
.start-screen h2{font-size:28px;color:#818cf8}
.start-screen p{color:#94a3b8;text-align:center;max-width:400px}
.complete h2{color:#34d399}
.hidden{display:none!important}
.progress{color:#94a3b8;font-size:14px}
</style>
</head>
<body>
<div class="top-bar">
  <a href="../index.html">← Back</a>
  <h1>Math Memory</h1>
  <span></span>
</div>
<div class="stats">
  <div class="stat"><div class="stat-label">Level</div><div class="stat-value" id="level">1</div></div>
  <div class="stat"><div class="stat-label">Score</div><div class="stat-value" id="score">0</div></div>
  <div class="stat"><div class="stat-label">Best</div><div class="stat-value" id="best">0</div></div>
</div>
<div id="board">
  <div class="start-screen" id="startScreen">
    <h2>Math Memory</h2>
    <p>Watch math equations appear, then answer them from memory!</p>
    <button class="btn" onclick="startGame()">Play</button>
  </div>
  <div class="info" id="info"></div>
  <div class="progress" id="progress"></div>
  <div class="equation" id="equation"></div>
  <div class="choices" id="choices"></div>
  <div class="complete hidden" id="complete">
    <h2>Game Over!</h2>
    <p id="completeMsg"></p>
    <button class="btn" onclick="startGame()">Play Again</button>
  </div>
</div>
<script>
let level=1,score=0,best=0,equations=[],testIdx=0,phase='show',showIdx=0;
const equation=document.getElementById('equation');
const choicesDiv=document.getElementById('choices');
const info=document.getElementById('info');
const progress=document.getElementById('progress');
const complete=document.getElementById('complete');
const startScreen=document.getElementById('startScreen');

function genEquation(lvl){
  let ops=['+','-','×'];
  let op=ops[Math.floor(Math.random()*ops.length)];
  let a,b,ans;
  let max=10+lvl*5;
  if(op==='+'){a=Math.floor(Math.random()*max)+1;b=Math.floor(Math.random()*max)+1;ans=a+b}
  else if(op==='-'){a=Math.floor(Math.random()*max)+1;b=Math.floor(Math.random()*a)+1;ans=a-b}
  else{a=Math.floor(Math.random()*12)+1;b=Math.floor(Math.random()*12)+1;ans=a*b}
  return{eq:a+' '+op+' '+b,ans:ans};
}
function startGame(){
  level=1;score=0;
  document.getElementById('score').textContent='0';
  document.getElementById('level').textContent='1';
  startScreen.classList.add('hidden');complete.classList.add('hidden');
  choicesDiv.style.display='flex';
  nextRound();
}
function nextRound(){
  let numEqs=Math.min(level+1,6);
  equations=[];testIdx=0;showIdx=0;phase='show';
  for(let i=0;i<numEqs;i++)equations.push(genEquation(level));
  info.textContent='Memorize these equations!';
  progress.textContent='';
  choicesDiv.innerHTML='';
  showEquations();
}
function showEquations(){
  if(showIdx>=equations.length){
    phase='test';testIdx=0;info.textContent='What was the answer?';showTest();return;
  }
  equation.textContent=equations[showIdx].eq;
  progress.textContent=(showIdx+1)+'/'+equations.length;
  showIdx++;
  setTimeout(()=>showEquations(),1500);
}
function showTest(){
  if(testIdx>=equations.length){
    score+=level*10;level++;
    document.getElementById('score').textContent=score;
    document.getElementById('level').textContent=level;
    info.textContent='All correct!';
    equation.textContent='✓';equation.style.color='#34d399';choicesDiv.style.display='none';
    setTimeout(()=>{equation.style.color='#818cf8';nextRound()},1000);return;
  }
  equation.textContent='?';equation.style.color='#e2e8f0';
  progress.textContent=(testIdx+1)+'/'+equations.length;
  let correct=equations[testIdx].ans;
  let opts=[correct];
  while(opts.length<4){
    let wrong=correct+Math.floor(Math.random()*11)-5;
    if(wrong!==correct&&!opts.includes(wrong)&&wrong>=0)opts.push(wrong);
  }
  opts.sort(()=>Math.random()-0.5);
  choicesDiv.innerHTML='';
  opts.forEach(o=>{
    let b=document.createElement('button');b.className='choice-btn';b.textContent=o;
    b.onclick=()=>checkAnswer(o);
    choicesDiv.appendChild(b);
  });
}
function checkAnswer(ans){
  if(ans===equations[testIdx].ans){
    testIdx++;showTest();
  }else{
    info.textContent='Wrong! '+equations[testIdx].eq+' = '+equations[testIdx].ans;
    equation.style.color='#ef4444';choicesDiv.style.display='none';
    if(score>best){best=score;document.getElementById('best').textContent=best}
    setTimeout(()=>{complete.classList.remove('hidden');
      document.getElementById('completeMsg').textContent='Score: '+score+' | Level reached: '+level;
    },1500);
  }
}
</script>
</body>
</html>
