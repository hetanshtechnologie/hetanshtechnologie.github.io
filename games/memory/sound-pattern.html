<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound Pattern - Memory Game</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:#1e293b;border-bottom:1px solid #334155}
.top-bar a{color:#818cf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px;font-weight:700}
.stats{display:flex;justify-content:center;gap:32px;padding:16px;background:#1e293b;margin:16px;border-radius:12px}
.stat{text-align:center}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8}
.stat-value{font-size:24px;font-weight:700;color:#818cf8}
#board{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:24px}
.circles{display:grid;gap:16px}
.circle{width:80px;height:80px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .2s,box-shadow .3s,opacity .3s;opacity:0.6}
.circle:hover{transform:scale(1.1)}
.circle.active{opacity:1;box-shadow:0 0 30px rgba(255,255,255,0.3);transform:scale(1.15)}
.circle.picked{border-color:#e2e8f0;opacity:1;transform:scale(1.1)}
.btn{padding:12px 32px;background:#818cf8;color:#0f172a;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{background:#6366f1}
.info{color:#94a3b8;text-align:center}
.start-screen,.complete{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:20px}
.start-screen h2{font-size:28px;color:#818cf8}
.start-screen p{color:#94a3b8;text-align:center;max-width:400px}
.complete h2{color:#34d399}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="top-bar">
  <a href="../index.html">← Back</a>
  <h1>Sound Pattern</h1>
  <span></span>
</div>
<div class="stats">
  <div class="stat"><div class="stat-label">Level</div><div class="stat-value" id="level">1</div></div>
  <div class="stat"><div class="stat-label">Score</div><div class="stat-value" id="score">0</div></div>
  <div class="stat"><div class="stat-label">Best</div><div class="stat-value" id="best">0</div></div>
</div>
<div id="board">
  <div class="start-screen" id="startScreen">
    <h2>Sound Pattern</h2>
    <p>Watch the circles flash in a pattern, then repeat it!</p>
    <button class="btn" onclick="startGame()">Play</button>
  </div>
  <div class="info" id="info"></div>
  <div class="circles" id="circles"></div>
  <div class="complete hidden" id="complete">
    <h2>Game Over!</h2>
    <p id="completeMsg"></p>
    <button class="btn" onclick="startGame()">Play Again</button>
  </div>
</div>
<script>
const COLORS=['#ef4444','#3b82f6','#22c55e','#eab308','#8b5cf6','#ec4899'];
let level=1,score=0,best=0,sequence=[],playerPick=[],playing=false;
const circlesDiv=document.getElementById('circles');
const info=document.getElementById('info');
const complete=document.getElementById('complete');
const startScreen=document.getElementById('startScreen');

function startGame(){
  level=1;score=0;
  document.getElementById('score').textContent='0';
  document.getElementById('level').textContent='1';
  startScreen.classList.add('hidden');complete.classList.add('hidden');
  nextRound();
}
function nextRound(){
  let numColors=Math.min(level+2,6);
  let cols=Math.ceil(numColors/2);
  circlesDiv.style.gridTemplateColumns='repeat('+cols+',80px)';
  circlesDiv.innerHTML='';playerPick=[];playing=false;
  sequence=[];
  for(let i=0;i<level+2;i++)sequence.push(Math.floor(Math.random()*numColors));
  for(let i=0;i<numColors;i++){
    let c=document.createElement('div');c.className='circle';
    c.style.background=COLORS[i];c.dataset.idx=i;
    c.onclick=()=>pickCircle(i);
    circlesDiv.appendChild(c);
  }
  info.textContent='Watch the pattern...';
  flashPattern(0);
}
function flashPattern(i){
  if(i>=sequence.length){
    info.textContent='Repeat the '+sequence.length+'-step pattern!';playing=true;return;
  }
  circlesDiv.children[sequence[i]].classList.add('active');
  setTimeout(()=>{
    circlesDiv.children[sequence[i]].classList.remove('active');
    setTimeout(()=>flashPattern(i+1),150);
  },400);
}
function pickCircle(idx){
  if(!playing)return;
  circlesDiv.children[idx].classList.add('picked');
  setTimeout(()=>circlesDiv.children[idx].classList.remove('picked'),300);
  playerPick.push(idx);
  let i=playerPick.length-1;
  if(playerPick[i]!==sequence[i]){
    info.textContent='Wrong pattern!';
    playing=false;
    if(score>best){best=score;document.getElementById('best').textContent=best}
    setTimeout(()=>{complete.classList.remove('hidden');
      document.getElementById('completeMsg').textContent='Score: '+score+' | Level reached: '+level;
    },1000);return;
  }
  if(playerPick.length===sequence.length){
    playing=false;score+=level*10;level++;
    document.getElementById('score').textContent=score;
    document.getElementById('level').textContent=level;
    info.textContent='Correct!';
    setTimeout(()=>nextRound(),800);
  }
}
</script>
</body>
</html>
