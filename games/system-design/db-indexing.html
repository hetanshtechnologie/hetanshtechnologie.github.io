<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DB Indexing Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #334155}
.topbar a{color:#38bdf8;text-decoration:none;font-size:14px}
.topbar h1{font-size:18px;color:#f8fafc}
.hud{display:flex;justify-content:center;gap:32px;padding:16px;background:#1e293b;border-bottom:1px solid #334155}
.hud-item{font-size:14px;color:#94a3b8}
.hud-item span{color:#38bdf8;font-weight:700;font-size:20px;margin-right:4px}
.game-area{max-width:900px;margin:24px auto;padding:0 16px}
.query-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;margin:16px 0;text-align:center}
.query-card h3{margin-bottom:8px}
.query-code{background:#0f172a;border-radius:8px;padding:14px;font-family:monospace;font-size:13px;color:#4ade80;margin:12px 0;text-align:left;white-space:pre-wrap}
.table-view{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;margin:16px 0}
.table-view h3{font-size:14px;margin-bottom:12px}
.schema-table{width:100%;border-collapse:collapse;font-size:12px}
.schema-table th{background:#334155;padding:8px;text-align:left;color:#f8fafc;border-bottom:2px solid #475569}
.schema-table td{padding:8px;border-bottom:1px solid #334155;color:#94a3b8}
.choices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.choice-btn{background:#334155;border:2px solid #475569;border-radius:10px;padding:10px 18px;color:#e2e8f0;cursor:pointer;font-size:13px;transition:all .2s}
.choice-btn:hover{border-color:#38bdf8}
.choice-btn.correct{border-color:#4ade80;background:rgba(74,222,128,.1);color:#4ade80}
.choice-btn.wrong{border-color:#f87171;background:rgba(248,113,113,.1);color:#f87171}
.feedback{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;margin:16px 0;display:none;text-align:center}
.feedback.show{display:block}
.next-btn{background:#38bdf8;color:#0f172a;border:none;border-radius:8px;padding:12px 28px;font-size:14px;font-weight:600;cursor:pointer;margin:16px auto;display:block}
.perf-compare{display:flex;gap:16px;justify-content:center;margin:12px 0}
.perf-box{background:#334155;border-radius:8px;padding:10px 16px;text-align:center;min-width:100px}
.perf-box .value{font-size:20px;font-weight:700}
.perf-box .label{font-size:10px;color:#94a3b8;margin-top:2px}
.game-over{display:none;text-align:center;padding:40px}
.game-over h2{font-size:28px;color:#f8fafc;margin-bottom:12px}
.game-over .final-score{font-size:48px;color:#38bdf8;font-weight:700}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">Back</a><h1>DB Indexing Game</h1></div>
<div class="hud">
<div class="hud-item"><span id="score">0</span>Score</div>
<div class="hud-item"><span id="round">1</span>/15</div>
<div class="hud-item"><span id="queries">0</span>Optimized</div>
</div>
<div class="game-area">
<div id="game-content">
<div class="query-card">
<h3 id="query-title">Optimize This Query</h3>
<div class="query-code" id="query-code"></div>
</div>
<div class="table-view">
<h3>Table Schema</h3>
<table class="schema-table" id="schema-table">
<thead><tr><th>Column</th><th>Type</th><th>Notes</th></tr></thead>
<tbody id="schema-body"></tbody>
</table>
</div>
<div class="perf-compare">
<div class="perf-box"><div class="value" style="color:#f87171" id="no-index">Full Scan</div><div class="label">Without Index</div></div>
<div class="perf-box"><div class="value" style="color:#4ade80" id="with-index">--</div><div class="label">With Index</div></div>
</div>
<div class="choices" id="choices"></div>
<div class="feedback" id="feedback"><h3 id="fb-title"></h3><p id="fb-text"></p></div>
<button class="next-btn" id="next-btn" style="display:none" onclick="nextRound()">Next</button>
</div>
<div class="game-over" id="game-over">
<h2>Index Master!</h2>
<div class="final-score" id="final-score">0</div>
<p>points earned</p>
<button class="next-btn" onclick="restart()">Play Again</button>
</div>
</div>
<script>
var score=0,round=0,maxRounds=15,optimized=0,answered=false;
var scenarios=[
{query:"SELECT * FROM users WHERE email = 'alice@test.com'",schema:[{col:"id",type:"INT",note:"PK"},{col:"name",type:"VARCHAR(100)"},{col:"email",type:"VARCHAR(255)",note:"UNIQUE"},{col:"created_at",type:"TIMESTAMP"}],correct:"Index on email",reason:"Equality lookup on email needs B-tree index. O(log n) vs O(n) full scan."},
{query:"SELECT * FROM orders WHERE user_id=42 AND status='pending' ORDER BY created_at DESC",schema:[{col:"id",type:"INT",note:"PK"},{col:"user_id",type:"INT"},{col:"status",type:"VARCHAR(20)"},{col:"created_at",type:"TIMESTAMP"}],correct:"Composite index on (user_id, status, created_at)",reason:"Composite index covers filter + sort. Most selective column first."},
{query:"SELECT COUNT(*) FROM products WHERE category='electronics' AND price>100",schema:[{col:"id",type:"INT",note:"PK"},{col:"name",type:"VARCHAR(200)"},{col:"category",type:"VARCHAR(50)"},{col:"price",type:"DECIMAL"}],correct:"Index on (category, price)",reason:"Composite index on both filter columns enables index-only scan."},
{query:"SELECT * FROM logs WHERE message LIKE '%error%' AND created_at > '2024-01-01'",schema:[{col:"id",type:"BIGINT",note:"PK"},{col:"message",type:"TEXT"},{col:"created_at",type:"TIMESTAMP"}],correct:"Index on created_at only",reason:"LIKE with leading wildcard cannot use B-tree index. Index the date range."},
{query:"SELECT * FROM users ORDER BY last_login DESC LIMIT 10",schema:[{col:"id",type:"INT",note:"PK"},{col:"name",type:"VARCHAR(100)"},{col:"last_login",type:"TIMESTAMP"}],correct:"Index on last_login DESC",reason:"Index on sort column enables efficient LIMIT without full sort."},
{query:"SELECT * FROM orders WHERE YEAR(created_at)=2024",schema:[{col:"id",type:"INT",note:"PK"},{col:"amount",type:"DECIMAL"},{col:"created_at",type:"TIMESTAMP"}],correct:"Rewrite query then index created_at",reason:"Function on column prevents index use. Rewrite to use range."},
{query:"SELECT u.name, COUNT(o.id) FROM users u JOIN orders o ON u.id=o.user_id GROUP BY u.id",schema:[{col:"users.id",type:"INT",note:"PK"},{col:"orders.user_id",type:"INT"},{col:"orders.id",type:"INT",note:"PK"}],correct:"Index on orders.user_id (FK)",reason:"JOIN on foreign key needs index. Users PK already exists."},
{query:"SELECT * FROM products WHERE JSON_EXTRACT(attrs,'$.color')='red'",schema:[{col:"id",type:"INT",note:"PK"},{col:"name",type:"VARCHAR(200)"},{col:"attrs",type:"JSON"}],correct:"Generated column + index",reason:"Virtual/generated column with index enables JSON querying."},
{query:"SELECT DISTINCT user_id FROM orders WHERE created_at > DATE_SUB(NOW(), INTERVAL 7 DAY)",schema:[{col:"id",type:"INT",note:"PK"},{col:"user_id",type:"INT"},{col:"created_at",type:"TIMESTAMP"}],correct:"Index on (created_at, user_id)",reason:"Covering index avoids table lookup for DISTINCT."},
{query:"SELECT * FROM events WHERE tenant_id=5 AND event_type='click' AND ts > UNIX_TIMESTAMP()-3600",schema:[{col:"id",type:"BIGINT",note:"PK"},{col:"tenant_id",type:"INT"},{col:"event_type",type:"VARCHAR(50)"},{col:"ts",type:"INT"}],correct:"Index on (tenant_id, event_type, ts)",reason:"Multi-tenant query needs composite index with tenant first."},
{query:"UPDATE users SET last_seen=NOW() WHERE session_token='abc123'",schema:[{col:"id",type:"INT",note:"PK"},{col:"session_token",type:"VARCHAR(64)"},{col:"last_seen",type:"TIMESTAMP"}],correct:"Index on session_token",reason:"UPDATE with WHERE clause needs index on session_token."},
{query:"SELECT * FROM inventory WHERE product_id IN (1,2,3,4,5) AND warehouse='A'",schema:[{col:"id",type:"INT",note:"PK"},{col:"product_id",type:"INT"},{col:"warehouse",type:"VARCHAR(10)"},{col:"quantity",type:"INT"}],correct:"Index on (warehouse, product_id)",reason:"Composite index for IN list + equality filter."},
{query:"SELECT * FROM comments WHERE post_id=42 ORDER BY created_at LIMIT 20 OFFSET 40",schema:[{col:"id",type:"INT",note:"PK"},{col:"post_id",type:"INT"},{col:"body",type:"TEXT"},{col:"created_at",type:"TIMESTAMP"}],correct:"Index on (post_id, created_at)",reason:"Pagination with ORDER BY needs composite index."},
{query:"DELETE FROM sessions WHERE expires_at < NOW()",schema:[{col:"id",type:"INT",note:"PK"},{col:"token",type:"VARCHAR(64)"},{col:"expires_at",type:"TIMESTAMP"}],correct:"Index on expires_at",reason:"DELETE with range condition needs index on expires_at."},
{query:"SELECT * FROM users WHERE status='active' AND country='US' AND age BETWEEN 18 AND 30",schema:[{col:"id",type:"INT",note:"PK"},{col:"status",type:"VARCHAR(20)"},{col:"country",type:"VARCHAR(2)"},{col:"age",type:"INT"}],correct:"Index on (status, country, age)",reason:"Composite index with equality columns first, range last."}
];
function startRound(){
answered=false;
var s=scenarios[round%scenarios.length];
document.getElementById("query-title").textContent="Optimize This Query";
document.getElementById("query-code").textContent=s.query;
var tbody=document.getElementById("schema-body");
tbody.innerHTML="";
s.schema.forEach(function(c){
var tr=document.createElement("tr");
tr.innerHTML="<td style='color:#e2e8f0;font-weight:600'>"+c.col+"</td><td>"+c.type+"</td><td>"+(c.note||"--")+"</td>";
tbody.appendChild(tr);
});
document.getElementById("no-index").textContent="O(n) = ~"+(Math.floor(Math.random()*900)+100)+"ms";
document.getElementById("feedback").className="feedback";
document.getElementById("next-btn").style.display="none";
var choices=[
"Index on first WHERE column",
"Composite index covering all filters",
"Full-text index",
"No index needed"
];
document.getElementById("choices").innerHTML=choices.map(function(c,i){
var isCorrect=c===s.correct||(i===1&&s.correct.indexOf("Composite")>=0)||(i===0&&s.correct.indexOf("Index on")===0&&s.correct.indexOf("Composite")<0);
return "<button class='choice-btn' data-correct='"+(isCorrect?"true":"false")+"' onclick=\"answer(this)\">"+c+"</button>";
}).join("");
document.getElementById("choices").setAttribute("data-correct-answer",s.correct);
document.getElementById("choices").setAttribute("data-reason",s.reason);
}
function answer(btn){
if(answered)return;answered=true;
var correct=btn.getAttribute("data-correct")==="true";
var s=scenarios[round%scenarios.length];
if(correct){score+=10;optimized++;}else{score=Math.max(0,score-3);}
document.querySelectorAll(".choice-btn").forEach(function(b){
if(b.getAttribute("data-correct")==="true")b.classList.add("correct");
else if(b===btn&&!correct)b.classList.add("wrong");
b.style.pointerEvents="none";
});
document.getElementById("with-index").textContent="O(log n) = ~"+(Math.floor(Math.random()*9)+1)+"ms";
var fb=document.getElementById("feedback");
fb.className="feedback show "+(correct?"correct-fb":"wrong-fb");
fb.style.borderColor=correct?"#4ade80":"#f87171";
document.getElementById("fb-title").textContent=correct?"Correct!":"Wrong";
document.getElementById("fb-text").textContent=s.reason;
document.getElementById("score").textContent=score;
document.getElementById("queries").textContent=optimized;
document.getElementById("next-btn").style.display="block";
}
function nextRound(){
round++;
if(round>=maxRounds){
document.getElementById("game-content").style.display="none";
document.getElementById("game-over").style.display="block";
document.getElementById("final-score").textContent=score;return;
}
document.getElementById("round").textContent=round+1;
startRound();
}
function restart(){
score=0;round=0;optimized=0;
document.getElementById("game-content").style.display="block";
document.getElementById("game-over").style.display="none";
document.getElementById("round").textContent=1;
document.getElementById("score").textContent=0;
startRound();
}
startRound();
</script>
</body>
</html>
