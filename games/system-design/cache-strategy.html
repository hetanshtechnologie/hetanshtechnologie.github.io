<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cache Strategy Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #334155}
.topbar a{color:#38bdf8;text-decoration:none;font-size:14px}
.topbar h1{font-size:18px;color:#f8fafc}
.hud{display:flex;justify-content:center;gap:32px;padding:16px;background:#1e293b;border-bottom:1px solid #334155}
.hud-item{font-size:14px;color:#94a3b8}
.hud-item span{color:#38bdf8;font-weight:700;font-size:20px;margin-right:4px}
.game-area{max-width:960px;margin:24px auto;padding:0 16px}
.cache-visual{display:flex;gap:20px;justify-content:center;margin:20px 0;flex-wrap:wrap}
.cache-col{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;flex:1;min-width:250px}
.cache-col h3{font-size:14px;color:#f8fafc;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.cache-col h3::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%}
.cache-col.cache-h::h3::before{background:#38bdf8}
.cache-col.cache-l::h3::before{background:#a78bfa}
.cache-col.db-col::h3::before{background:#fbbf24}
.cache-slot{background:#334155;border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:12px;display:flex;justify-content:space-between;align-items:center;animation:slideIn .3s}
.cache-slot .key{color:#e2e8f0;font-weight:600}
.cache-slot .freq{color:#94a3b8;font-size:11px}
.cache-slot .tag{font-size:10px;padding:2px 6px;border-radius:4px}
.tag-hit{background:rgba(74,222,128,.2);color:#4ade80}
.tag-miss{background:rgba(248,113,113,.2);color:#f87171}
.tag-evict{background:rgba(251,191,36,.2);color:#fbbf24}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.incoming{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;margin:20px 0;text-align:center}
.incoming h3{font-size:14px;margin-bottom:12px}
.access-sequence{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.access-item{background:#334155;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;border:2px solid transparent}
.access-item:hover{border-color:#38bdf8}
.access-item.current{border-color:#38bdf8;box-shadow:0 0 12px rgba(56,189,248,.3)}
.access-item.done-hit{border-color:#4ade80;opacity:.6}
.access-item.done-miss{border-color:#f87171;opacity:.6}
.choices{display:flex;gap:12px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.choice-btn{background:#334155;border:2px solid #475569;border-radius:10px;padding:12px 20px;color:#e2e8f0;cursor:pointer;font-size:13px;transition:all .2s}
.choice-btn:hover{border-color:#38bdf8}
.choice-btn.correct{border-color:#4ade80;background:rgba(74,222,128,.1);color:#4ade80}
.choice-btn.wrong{border-color:#f87171;background:rgba(248,113,113,.1);color:#f87171}
.feedback{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;margin:16px 0;display:none;text-align:center}
.feedback.show{display:block}
.next-btn{background:#38bdf8;color:#0f172a;border:none;border-radius:8px;padding:12px 28px;font-size:14px;font-weight:600;cursor:pointer;margin:16px auto;display:block}
.next-btn:hover{background:#7dd3fc}
.stats-row{display:flex;justify-content:center;gap:24px;margin:12px 0;font-size:13px;color:#94a3b8}
.game-over{display:none;text-align:center;padding:40px}
.game-over h2{font-size:28px;color:#f8fafc;margin-bottom:12px}
.game-over .final-score{font-size:48px;color:#38bdf8;font-weight:700}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">← Back</a><h1>Cache Strategy Game</h1></div>
<div class="hud">
<div class="hud-item"><span id="score">0</span>Score</div>
<div class="hud-item"><span id="round">1</span>/15</div>
<div class="hud-item"><span id="hit-rate">0%</span>Hit Rate</div>
</div>
<div class="game-area">
<div id="game-content">
<div class="cache-visual">
<div class="cache-col cache-h"><h3>L1 Hot Cache (3 slots)</h3><div id="l1-cache"></div></div>
<div class="cache-col cache-l"><h3>L2 Warm Cache (5 slots)</h3><div id="l2-cache"></div></div>
<div class="cache-col db-col"><h3>Database</h3><div id="db-items"></div></div>
</div>
<div class="incoming">
<h3 id="q-title">Next Access</h3>
<div class="access-sequence" id="access-seq"></div>
<p style="color:#94a3b8;font-size:13px;margin-top:8px" id="access-desc">Choose the correct cache action</p>
</div>
<div class="choices" id="choices"></div>
<div class="stats-row">
<span>L1: <b id="l1-count">0</b> items</span>
<span>L2: <b id="l2-count">0</b> items</span>
<span>Hits: <b id="hits">0</b></span>
<span>Misses: <b id="misses">0</b></span>
</div>
<div class="feedback" id="feedback"><h3 id="fb-title"></h3><p id="fb-text"></p></div>
<button class="next-btn" id="next-btn" style="display:none" onclick="nextRound()">Next →</button>
</div>
<div class="game-over" id="game-over">
<h2>Cache Master!</h2>
<div class="final-score" id="final-score">0</div>
<p>points earned</p>
<button class="next-btn" onclick="restart()">Play Again</button>
</div>
</div>
<script>
let score=0,round=0,maxRounds=15,hits=0,misses=0,answered=false;
let l1=[],l2=[],l1Max=3,l2Max=5;
let dbItems=['user:1','user:2','user:3','order:10','order:20','product:5','product:8','cart:3','cart:7','session:1'];
const policies=['Write-Through','Write-Back','Write-Around','Cache-Aside','Read-Through'];
let accessQueue=[],currentIdx=0;
function init(){
score=0;round=0;hits=0;misses=0;l1=[];l2=[];
generateAccessQueue();
renderCache();startRound();
}
function generateAccessQueue(){
const queue=[];
for(let i=0;i<20;i++){
queue.push(dbItems[Math.floor(Math.random()*dbItems.length)]);
}
accessQueue=queue;currentIdx=0;
renderAccessQueue();
}
function renderAccessQueue(){
const el=document.getElementById('access-seq');
el.innerHTML=accessQueue.slice(currentIdx,currentIdx+5).map((k,i)=>`<div class="access-item ${i===0?'current':''}" id="acc-${i}">${k}</div>`).join('');
}
function renderCache(){
document.getElementById('l1-cache').innerHTML=l1.map(e=>`<div class="cache-slot"><span class="key">${e.key}</span><span class="freq">freq:${e.freq}</span></div>`).join('')||'<div style="color:#475569;font-size:12px;text-align:center;padding:20px">Empty</div>';
document.getElementById('l2-cache').innerHTML=l2.map(e=>`<div class="cache-slot"><span class="key">${e.key}</span><span class="freq">freq:${e.freq}</span></div>`).join('')||'<div style="color:#475569;font-size:12px;text-align:center;padding:20px">Empty</div>';
document.getElementById('db-items').innerHTML=dbItems.map(k=>`<div class="cache-slot"><span class="key">${k}</span><span class="tag tag-hit">DB</span></div>`).join('');
document.getElementById('l1-count').textContent=l1.length;
document.getElementById('l2-count').textContent=l2.length;
document.getElementById('hits').textContent=hits;
document.getElementById('misses').textContent=misses;
const total=hits+misses;
document.getElementById('hit-rate').textContent=total?Math.round(hits/total*100)+'%':'0%';
}
function startRound(){
answered=false;
document.getElementById('feedback').className='feedback';
document.getElementById('next-btn').style.display='none';
document.getElementById('choices').innerHTML='';
renderAccessQueue();
const key=accessQueue[currentIdx];
const inL1=l1.find(e=>e.key===key);
const inL2=l2.find(e=>e.key===key);
let correctAction,explanation;
if(inL1){correctAction='L1 Hit — Return immediately';explanation='Data found in L1 hot cache. Fastest access, no eviction needed.';}
else if(inL2){correctAction='L2 Hit → Promote to L1';explanation='Data in L2 warm cache. Promote to L1 for faster future access.';}
else{correctAction='Cache Miss → Fetch from DB → Store in L2';explanation='Not in any cache. Fetch from database, store in L2.';}
document.getElementById('q-title').textContent=`Access: ${key}`;
document.getElementById('access-desc').textContent=inL1?'Found in L1!':inL2?'Found in L2!':'Not cached!';
let choices=[
correctAction,
'L1 Hit → Evict oldest from L2',
'Cache Miss → Store in L1 directly',
'Write-Back to database'
].sort(()=>Math.random()-.5);
document.getElementById('choices').innerHTML=choices.map((c,i)=>`<button class="choice-btn" onclick="answer('${c.replace(/'/g,"\\'")}','${correctAction.replace(/'/g,"\\'")}')">${c}</button>`).join('');
}
function answer(chosen,correct){
if(answered)return;answered=true;
const isCorrect=chosen===correct;
const key=accessQueue[currentIdx];
const inL1=l1.find(e=>e.key===key);
const inL2=l2.find(e=>e.key===key);
if(isCorrect){score+=10;hits++;}else{misses++;}
if(inL1){inL1.freq++;}
else if(inL2){l2=l2.filter(e=>e.key!==key);if(l1.length>=l1Max){l2.push(l1.shift());}l1.push({key,freq:1});}
else{if(l2.length>=l2Max){l2.shift();}l2.push({key,freq:1});}
document.querySelectorAll('.access-item')[0]?.classList.add(isCorrect?'done-hit':'done-miss');
document.querySelectorAll('.choice-btn').forEach(b=>{
if(b.textContent===correct)b.classList.add('correct');
else if(b.textContent!==correct&&b.textContent===chosen)b.classList.add('wrong');
b.style.pointerEvents='none';
});
const fb=document.getElementById('feedback');
fb.className='feedback show '+(isCorrect?'correct-fb':'wrong-fb');
fb.style.borderColor=isCorrect?'#4ade80':'#f87171';
document.getElementById('fb-title').textContent=isCorrect?'✓ Correct!':'✗ Wrong';
document.getElementById('fb-text').textContent=correct;
document.getElementById('score').textContent=score;
renderCache();renderAccessQueue();
document.getElementById('next-btn').style.display='block';
}
function nextRound(){
round++;currentIdx++;
if(round>=maxRounds||currentIdx>=accessQueue.length){
document.getElementById('game-content').style.display='none';
document.getElementById('game-over').style.display='block';
document.getElementById('final-score').textContent=score;return;
}
document.getElementById('round').textContent=round+1;
generateAccessQueue();startRound();
}
function restart(){init();document.getElementById('game-content').style.display='block';document.getElementById('game-over').style.display='none';document.getElementById('round').textContent=1;}
init();
</script>
</body>
</html>
