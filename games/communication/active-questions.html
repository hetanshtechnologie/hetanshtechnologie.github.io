<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Questions Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .top-bar {
            background-color: #1e293b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .top-bar a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 16px;
        }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar h1 {
            margin-left: 20px;
            font-size: 24px;
            color: #f1f5f9;
        }
        .game-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            font-size: 18px;
        }
        .stats span { color: #94a3b8; }
        .stats strong { color: #38bdf8; }
        .level-info {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 16px;
        }
        .scenario {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #6366f1;
        }
        .scenario h3 {
            color: #6366f1;
            margin-bottom: 15px;
        }
        .scenario p {
            line-height: 1.6;
            font-size: 16px;
        }
        .question-type {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 18px;
            text-align: center;
            border: 2px solid #475569;
            font-style: italic;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #334155;
            border: 2px solid #475569;
            color: #e2e8f0;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: #6366f1;
            transform: translateX(5px);
        }
        .option-btn.correct {
            background-color: #166534;
            border-color: #22c55e;
        }
        .option-btn.incorrect {
            background-color: #991b1b;
            border-color: #ef4444;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .explanation {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #f59e0b;
        }
        .explanation h4 {
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .next-btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin: 20px auto;
            transition: transform 0.2s;
        }
        .next-btn:hover { transform: scale(1.05); }
        .game-over {
            text-align: center;
            display: none;
        }
        .game-over h2 {
            color: #6366f1;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .final-score {
            font-size: 24px;
            margin: 20px 0;
        }
        .play-again-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .play-again-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../index.html">← Back to Games</a>
        <h1>Active Questions</h1>
    </div>

    <div class="game-container">
        <div class="header">
            <h2>Master the Art of Questioning</h2>
            <div class="stats">
                <span>Score: <strong id="score">0</strong></span>
                <span>Question: <strong id="question-num">1</strong>/10</span>
            </div>
        </div>

        <div class="level-info" id="level-info">Level 1: Open vs Closed Questions</div>

        <div class="scenario" id="scenario">
            <h3>Question Analysis:</h3>
            <p id="scenario-text"></p>
        </div>

        <div class="question-type" id="question-type"></div>

        <div class="options" id="options"></div>

        <div class="explanation" id="explanation">
            <h4>Explanation:</h4>
            <p id="explanation-text"></p>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>

        <div class="game-over" id="game-over">
            <h2>Game Complete!</h2>
            <p class="final-score">Your Final Score: <strong id="final-score">0</strong>/10</p>
            <p id="performance"></p>
            <button class="play-again-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const levels = [
            { name: "Level 1: Open vs Closed Questions", questions: 3 },
            { name: "Level 2: Question Types", questions: 3 },
            { name: "Level 3: Advanced Questioning", questions: 4 }
        ];

        const questions = [
            // Level 1
            {
                scenario: "Identify the type of this question:",
                question: "Did you finish the report?",
                options: [
                    "Open question - can be answered with yes/no",
                    "Closed question - can only be answered with yes/no",
                    "Leading question - suggests a particular answer",
                    "Rhetorical question - doesn't require an answer"
                ],
                correct: 1,
                explanation: "Closed questions can be answered with yes/no or simple factual responses. They limit the conversation and don't encourage elaboration."
            },
            {
                scenario: "Identify the type of this question:",
                question: "What challenges did you face with the project?",
                options: [
                    "Closed question - requires yes/no answer",
                    "Open question - encourages detailed response",
                    "Probing question - follows up on previous answer",
                    "Hypothetical question - asks about imaginary situation"
                ],
                correct: 1,
                explanation: "Open questions cannot be answered with yes/no and encourage detailed, thoughtful responses. They start with what, how, why, tell me about..."
            },
            {
                scenario: "Identify the type of this question:",
                question: "Don't you think we should reconsider this approach?",
                options: [
                    "Open question - invites discussion",
                    "Closed question - requires yes/no answer",
                    "Leading question - suggests the 'correct' answer",
                    "Clarifying question - seeks to understand better"
                ],
                correct: 2,
                explanation: "Leading questions contain embedded assumptions and suggest the answer the questioner wants. They're manipulative and discourage honest responses."
            },
            // Level 2
            {
                scenario: "Which question would be most effective for understanding a team member's perspective?",
                options: [
                    "Are you happy with your work?",
                    "Tell me about your experience with the new process.",
                    "Don't you like the new system?",
                    "Is everything okay?"
                ],
                correct: 1,
                explanation: "This open-ended question invites detailed sharing about their experience, rather than limiting them to yes/no responses."
            },
            {
                scenario: "Which question would be best for diagnosing a problem?",
                options: [
                    "What specific steps did you take before the error occurred?",
                    "Did you do something wrong?",
                    "Why didn't you fix this?",
                    "Is the system broken?"
                ],
                correct: 0,
                explanation: "This question is specific, non-accusatory, and invites a detailed description of the process to identify where things went wrong."
            },
            {
                scenario: "Which question would be most effective for encouraging creative thinking?",
                options: [
                    "Can you solve this problem?",
                    "What if we approached this from a completely different angle?",
                    "Don't you think we should try the obvious solution first?",
                    "Is there only one way to do this?"
                ],
                correct: 1,
                explanation: "Hypothetical questions ('What if...') encourage creative thinking by removing constraints and exploring possibilities."
            },
            // Level 3
            {
                scenario: "Which question would be most effective for building rapport?",
                options: [
                    "What's your role in the company?",
                    "What do you enjoy most about your work?",
                    "How long have you been working here?",
                    "Do you like your job?"
                ],
                correct: 1,
                explanation: "This question invites positive sharing and helps you understand what motivates them, creating connection through shared values."
            },
            {
                scenario: "Which question would be most effective for resolving a disagreement?",
                options: [
                    "Can't you see my point of view?",
                    "What would need to be true for your approach to work?",
                    "Don't you agree that I'm right?",
                    "Why won't you listen to reason?"
                ],
                correct: 1,
                explanation: "This question seeks understanding of their perspective and opens the door to finding common ground, rather than forcing agreement."
            },
            {
                scenario: "Which question would be most effective for mentoring?",
                options: [
                    "Did you learn from your mistake?",
                    "What would you do differently next time?",
                    "Why did you fail?",
                    "Don't you think you should have known better?"
                ],
                correct: 1,
                explanation: "This question encourages reflection and self-directed learning, which is more powerful than pointing out mistakes."
            },
            {
                scenario: "Which question would be most effective for a job interview?",
                options: [
                    "Can you do this job?",
                    "Tell me about a time when you successfully handled a similar challenge.",
                    "Are you a hard worker?",
                    "Do you have the skills we need?"
                ],
                correct: 1,
                explanation: "Behavioral questions ('Tell me about a time...') provide evidence of past performance, which is the best predictor of future behavior."
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('scenario-text').textContent = q.scenario;
            document.getElementById('question-type').textContent = q.question;
            document.getElementById('question-num').textContent = currentQuestion + 1;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            updateLevelInfo();
        }

        function checkAnswer(index) {
            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) btn.classList.add('correct');
                if (i === index && i !== q.correct) btn.classList.add('incorrect');
            });

            if (index === q.correct) {
                score += 10;
                document.getElementById('score').textContent = score;
            }

            document.getElementById('explanation-text').textContent = q.explanation;
            document.getElementById('explanation').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showGameOver();
            } else {
                loadQuestion();
            }
        }

        function updateLevelInfo() {
            let levelIndex = 0;
            let questionsSoFar = 0;
            
            for (let i = 0; i < levels.length; i++) {
                questionsSoFar += levels[i].questions;
                if (currentQuestion < questionsSoFar) {
                    levelIndex = i;
                    break;
                }
            }
            
            document.getElementById('level-info').textContent = levels[levelIndex].name;
        }

        function showGameOver() {
            document.getElementById('scenario').style.display = 'none';
            document.getElementById('question-type').style.display = 'none';
            document.getElementById('options').style.display = 'none';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('level-info').style.display = 'none';
            
            document.getElementById('final-score').textContent = score;
            
            let performance = '';
            if (score >= 90) performance = 'Outstanding! You are a questioning expert!';
            else if (score >= 70) performance = 'Great job! You have strong questioning skills.';
            else if (score >= 50) performance = 'Good effort! Keep practicing to improve.';
            else performance = 'Keep practicing! Effective questioning takes time to master.';
            
            document.getElementById('performance').textContent = performance;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            
            document.getElementById('scenario').style.display = 'block';
            document.getElementById('question-type').style.display = 'block';
            document.getElementById('options').style.display = 'flex';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-info').style.display = 'block';
            
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
