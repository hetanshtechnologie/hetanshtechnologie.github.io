<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persuasion Techniques Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .top-bar {
            background-color: #1e293b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .top-bar a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 16px;
        }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar h1 {
            margin-left: 20px;
            font-size: 24px;
            color: #f1f5f9;
        }
        .game-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            font-size: 18px;
        }
        .stats span { color: #94a3b8; }
        .stats strong { color: #38bdf8; }
        .level-info {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 16px;
        }
        .scenario {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #22c55e;
        }
        .scenario h3 {
            color: #22c55e;
            margin-bottom: 15px;
        }
        .scenario p {
            line-height: 1.6;
            font-size: 16px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #334155;
            border: 2px solid #475569;
            color: #e2e8f0;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: #22c55e;
            transform: translateX(5px);
        }
        .option-btn.correct {
            background-color: #166534;
            border-color: #22c55e;
        }
        .option-btn.incorrect {
            background-color: #991b1b;
            border-color: #ef4444;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .explanation {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #f59e0b;
        }
        .explanation h4 {
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .next-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin: 20px auto;
            transition: transform 0.2s;
        }
        .next-btn:hover { transform: scale(1.05); }
        .game-over {
            text-align: center;
            display: none;
        }
        .game-over h2 {
            color: #22c55e;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .final-score {
            font-size: 24px;
            margin: 20px 0;
        }
        .play-again-btn {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .play-again-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../index.html">← Back to Games</a>
        <h1>Persuasion Techniques</h1>
    </div>

    <div class="game-container">
        <div class="header">
            <h2>Identify Persuasion Methods</h2>
            <div class="stats">
                <span>Score: <strong id="score">0</strong></span>
                <span>Question: <strong id="question-num">1</strong>/10</span>
            </div>
        </div>

        <div class="level-info" id="level-info">Level 1: Aristotle's Rhetoric (Ethos/Pathos/Logos)</div>

        <div class="scenario" id="scenario">
            <h3>Persuasion Scenario:</h3>
            <p id="scenario-text"></p>
        </div>

        <div class="options" id="options"></div>

        <div class="explanation" id="explanation">
            <h4>Explanation:</h4>
            <p id="explanation-text"></p>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>

        <div class="game-over" id="game-over">
            <h2>Game Complete!</h2>
            <p class="final-score">Your Final Score: <strong id="final-score">0</strong>/10</p>
            <p id="performance"></p>
            <button class="play-again-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const levels = [
            { name: "Level 1: Aristotle's Rhetoric (Ethos/Pathos/Logos)", questions: 3 },
            { name: "Level 2: Modern Persuasion Techniques", questions: 3 },
            { name: "Level 3: Advanced Persuasion", questions: 4 }
        ];

        const questions = [
            // Level 1
            {
                scenario: "A doctor recommends a medication, saying: 'As a physician with 20 years of experience, I've seen this medication help thousands of patients.'",
                options: [
                    "Ethos - appeal to credibility and authority",
                    "Pathos - appeal to emotions",
                    "Logos - appeal to logic and reason",
                    "No persuasion technique used"
                ],
                correct: 0,
                explanation: "Ethos establishes credibility through the speaker's qualifications and experience. The doctor uses their professional authority to persuade."
            },
            {
                scenario: "An advertisement shows a heartwarming story of a family reuniting after using a travel service, with emotional music playing in the background.",
                options: [
                    "Ethos - appeal to credibility",
                    "Pathos - appeal to emotions",
                    "Logos - appeal to logic",
                    "No persuasion technique used"
                ],
                correct: 1,
                explanation: "Pathos appeals to emotions. The heartwarming story and music are designed to create an emotional response that motivates action."
            },
            {
                scenario: "A salesperson presents statistics: '95% of customers report satisfaction, and our product lasts 30% longer than competitors based on independent testing.'",
                options: [
                    "Ethos - appeal to authority",
                    "Pathos - appeal to emotions",
                    "Logos - appeal to logic with evidence",
                    "No persuasion technique used"
                ],
                correct: 2,
                explanation: "Logos uses logic, facts, and evidence to persuade. Statistics and comparisons appeal to reason rather than emotion or authority."
            },
            // Level 2
            {
                scenario: "A charity campaign shows a single child's story with photos, then asks for donations to help 'children like Maria'.",
                options: [
                    "Bandwagon effect - everyone is doing it",
                    "Identifiable victim effect - one person's story is more powerful than statistics",
                    "Social proof - showing others have donated",
                    "Reciprocity - giving something first"
                ],
                correct: 1,
                explanation: "The identifiable victim effect shows that people respond more strongly to one person's story than abstract statistics. It personalizes the issue."
            },
            {
                scenario: "A store displays 'Only 3 left in stock!' and 'Sale ends tonight!' next to a product.",
                options: [
                    "Scarcity and urgency - limited availability creates desire",
                    "Authority - expert endorsement",
                    "Social proof - showing popularity",
                    "Reciprocity - giving something free"
                ],
                correct: 0,
                explanation: "Scarcity (limited quantity) and urgency (limited time) create fear of missing out, which motivates immediate action rather than delayed decision-making."
            },
            {
                scenario: "A influencer posts: 'I love this product so much! And you can get 20% off with my code. Thanks to everyone who supported my last recommendation!'",
                options: [
                    "Reciprocity - giving a discount after receiving support",
                    "Authority - expert recommendation",
                    "Scarcity - limited time offer",
                    "Commitment - getting small yeses first"
                ],
                correct: 0,
                explanation: "Reciprocity works by giving something (discount, exclusive offer) after receiving something (support, loyalty), creating a sense of obligation to reciprocate."
            },
            // Level 3
            {
                scenario: "A manager says: 'I know you're talented and ambitious. This project could be your breakthrough. But it requires someone willing to go the extra mile.'",
                options: [
                    "Ethos - manager's authority",
                    "Pathos - appealing to aspirations and identity",
                    "Logos - logical career benefits",
                    "Foot-in-the-door - small commitment leads to larger ones"
                ],
                correct: 1,
                explanation: "This appeals to the listener's self-image as talented and ambitious, and their aspirations for career advancement. It's identity-based persuasion."
            },
            {
                scenario: "A negotiator says: 'I appreciate your flexibility on the timeline. Since you've adjusted that, perhaps you could also consider adjusting the budget slightly.'",
                options: [
                    "Door-in-the-face - starting with large request",
                    "Reciprocity - giving something to get something",
                    "Anchoring - setting high initial expectation",
                    "Social proof - others have agreed"
                ],
                correct: 1,
                explanation: "Reciprocity in negotiation: acknowledging the other party's concession creates a sense of obligation to make a similar concession."
            },
            {
                scenario: "A politician says: 'You have a choice: continue with the same failed policies or join us in building a better future. Which will you choose?'",
                options: [
                    "False dilemma - presenting only two options",
                    "Bandwagon - everyone is choosing us",
                    "Fear appeal - warning of danger",
                    "Authority - expert endorsement"
                ],
                correct: 0,
                explanation: "A false dilemma presents only two options when more exist. It simplifies complex issues to make one option seem clearly better."
            },
            {
                scenario: "A book club member says: 'I've read this book and it changed my perspective. Before we discuss, let me share three key insights that might help everyone get more from it.'",
                options: [
                    "Commitment and consistency - getting agreement on small points first",
                    "Authority - positioning as expert",
                    "Social proof - others liked it",
                    "Scarcity - limited time to read"
                ],
                correct: 0,
                explanation: "By getting agreement on small points first (insights), the speaker creates consistency that makes it harder to disagree with larger conclusions."
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('scenario-text').textContent = q.scenario;
            document.getElementById('question-num').textContent = currentQuestion + 1;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            updateLevelInfo();
        }

        function checkAnswer(index) {
            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) btn.classList.add('correct');
                if (i === index && i !== q.correct) btn.classList.add('incorrect');
            });

            if (index === q.correct) {
                score += 10;
                document.getElementById('score').textContent = score;
            }

            document.getElementById('explanation-text').textContent = q.explanation;
            document.getElementById('explanation').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showGameOver();
            } else {
                loadQuestion();
            }
        }

        function updateLevelInfo() {
            let levelIndex = 0;
            let questionsSoFar = 0;
            
            for (let i = 0; i < levels.length; i++) {
                questionsSoFar += levels[i].questions;
                if (currentQuestion < questionsSoFar) {
                    levelIndex = i;
                    break;
                }
            }
            
            document.getElementById('level-info').textContent = levels[levelIndex].name;
        }

        function showGameOver() {
            document.getElementById('scenario').style.display = 'none';
            document.getElementById('options').style.display = 'none';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('level-info').style.display = 'none';
            
            document.getElementById('final-score').textContent = score;
            
            let performance = '';
            if (score >= 90) performance = 'Outstanding! You are a persuasion expert!';
            else if (score >= 70) performance = 'Great job! You understand persuasion techniques well.';
            else if (score >= 50) performance = 'Good effort! Keep practicing to improve.';
            else performance = 'Keep practicing! Persuasion techniques take time to master.';
            
            document.getElementById('performance').textContent = performance;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            
            document.getElementById('scenario').style.display = 'block';
            document.getElementById('options').style.display = 'flex';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-info').style.display = 'block';
            
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
