<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communication Styles Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .top-bar {
            background-color: #1e293b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .top-bar a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 16px;
        }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar h1 {
            margin-left: 20px;
            font-size: 24px;
            color: #f1f5f9;
        }
        .game-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            font-size: 18px;
        }
        .stats span { color: #94a3b8; }
        .stats strong { color: #38bdf8; }
        .level-info {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 16px;
        }
        .scenario {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #8b5cf6;
        }
        .scenario h3 {
            color: #8b5cf6;
            margin-bottom: 15px;
        }
        .scenario p {
            line-height: 1.6;
            font-size: 16px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #334155;
            border: 2px solid #475569;
            color: #e2e8f0;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: #8b5cf6;
            transform: translateX(5px);
        }
        .option-btn.correct {
            background-color: #166534;
            border-color: #22c55e;
        }
        .option-btn.incorrect {
            background-color: #991b1b;
            border-color: #ef4444;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .explanation {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #f59e0b;
        }
        .explanation h4 {
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .next-btn {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin: 20px auto;
            transition: transform 0.2s;
        }
        .next-btn:hover { transform: scale(1.05); }
        .game-over {
            text-align: center;
            display: none;
        }
        .game-over h2 {
            color: #8b5cf6;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .final-score {
            font-size: 24px;
            margin: 20px 0;
        }
        .play-again-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .play-again-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../index.html">← Back to Games</a>
        <h1>Communication Styles</h1>
    </div>

    <div class="game-container">
        <div class="header">
            <h2>Match Communication Styles to Scenarios</h2>
            <div class="stats">
                <span>Score: <strong id="score">0</strong></span>
                <span>Question: <strong id="question-num">1</strong>/10</span>
            </div>
        </div>

        <div class="level-info" id="level-info">Level 1: Basic Communication Styles</div>

        <div class="scenario" id="scenario">
            <h3>Scenario:</h3>
            <p id="scenario-text"></p>
        </div>

        <div class="options" id="options"></div>

        <div class="explanation" id="explanation">
            <h4>Explanation:</h4>
            <p id="explanation-text"></p>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>

        <div class="game-over" id="game-over">
            <h2>Game Complete!</h2>
            <p class="final-score">Your Final Score: <strong id="final-score">0</strong>/10</p>
            <p id="performance"></p>
            <button class="play-again-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const levels = [
            { name: "Level 1: Basic Communication Styles", questions: 3 },
            { name: "Level 2: Style Adaptation", questions: 3 },
            { name: "Level 3: Advanced Style Matching", questions: 4 }
        ];

        const questions = [
            // Level 1
            {
                scenario: "A manager who gives direct instructions, expects quick results, and focuses on bottom-line outcomes.",
                options: [
                    "Passive communication style",
                    "Aggressive communication style",
                    "Analytical communication style",
                    "Driver communication style"
                ],
                correct: 3,
                explanation: "The Driver style is direct, results-oriented, and focused on efficiency. They want clear information and quick decisions."
            },
            {
                scenario: "A colleague who asks many questions, wants detailed information, and takes time to make careful decisions.",
                options: [
                    "Expressive communication style",
                    "Amiable communication style",
                    "Analytical communication style",
                    "Driver communication style"
                ],
                correct: 2,
                explanation: "The Analytical style values accuracy, data, and logic. They take time to analyze information before making decisions."
            },
            {
                scenario: "A friend who is enthusiastic, shares ideas freely, focuses on the big picture, and inspires others with their vision.",
                options: [
                    "Analytical communication style",
                    "Driver communication style",
                    "Expressive communication style",
                    "Amiable communication style"
                ],
                correct: 2,
                explanation: "The Expressive style is enthusiastic, visionary, and focuses on possibilities. They inspire others with their passion and ideas."
            },
            // Level 2
            {
                scenario: "You need to communicate with someone who prefers detailed data and careful analysis. How should you adapt?",
                options: [
                    "Present your ideas enthusiastically with big-picture thinking",
                    "Provide detailed data, evidence, and logical analysis",
                    "Focus on building personal relationships first",
                    "Be direct and get straight to the point"
                ],
                correct: 1,
                explanation: "When communicating with analytical types, provide the data and analysis they need. They want to see evidence before making decisions."
            },
            {
                scenario: "You're presenting to someone who values relationships and team harmony. What approach works best?",
                options: [
                    "Be direct and focus on results",
                    "Present detailed spreadsheets and data",
                    "Emphasize how the change affects the team and build consensus",
                    "Focus on innovation and creative possibilities"
                ],
                correct: 2,
                explanation: "The Amiable style values harmony and relationships. Focus on how decisions affect people and involve them in consensus-building."
            },
            {
                scenario: "You need to communicate a complex change to someone who is results-oriented and impatient. What works best?",
                options: [
                    "Provide lengthy detailed analysis",
                    "Focus on personal relationships and feelings",
                    "Be direct, concise, and focus on outcomes and benefits",
                    "Present creative alternatives and possibilities"
                ],
                correct: 2,
                explanation: "Drivers want direct communication focused on results. Be concise and show how the change achieves goals."
            },
            // Level 3
            {
                scenario: "In a team meeting with members of all communication styles, how do you ensure everyone is engaged?",
                options: [
                    "Use only data and analysis",
                    "Focus only on the big picture",
                    "Adapt your communication to address each style's needs",
                    "Use the style you're most comfortable with"
                ],
                correct: 2,
                explanation: "Effective communicators adapt their style to reach all audience members. Address data needs, personal impacts, results, and vision."
            },
            {
                scenario: "You're negotiating with someone who is highly analytical and detail-oriented. What's the best approach?",
                options: [
                    "Use emotional appeals and personal stories",
                    "Be vague and focus on relationships",
                    "Present thorough data, detailed analysis, and logical arguments",
                    "Focus on creative solutions and possibilities"
                ],
                correct: 2,
                explanation: "Analytical types need data and logic. Present thorough information, detailed analysis, and avoid emotional appeals."
            },
            {
                scenario: "A team member with an expressive style seems disengaged during a detailed technical presentation. How can you re-engage them?",
                options: [
                    "Give them more data to analyze",
                    "Ask them to share their vision for how this could be implemented creatively",
                    "Tell them to focus on the details",
                    "Move on without their input"
                ],
                correct: 1,
                explanation: "Expressive types engage when they can share ideas and possibilities. Ask for their creative input to re-engage them."
            },
            {
                scenario: "You're leading a team with mixed communication styles through a crisis. How do you communicate most effectively?",
                options: [
                    "Use the same style for everyone for consistency",
                    "Focus only on the analytical team members",
                    "Adapt your approach to address each style's concerns while maintaining clear overall messaging",
                    "Let each person communicate in their own style without coordination"
                ],
                correct: 2,
                explanation: "In crises, clear messaging adapted to different styles ensures everyone understands and can contribute effectively."
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('scenario-text').textContent = q.scenario;
            document.getElementById('question-num').textContent = currentQuestion + 1;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            updateLevelInfo();
        }

        function checkAnswer(index) {
            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) btn.classList.add('correct');
                if (i === index && i !== q.correct) btn.classList.add('incorrect');
            });

            if (index === q.correct) {
                score += 10;
                document.getElementById('score').textContent = score;
            }

            document.getElementById('explanation-text').textContent = q.explanation;
            document.getElementById('explanation').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showGameOver();
            } else {
                loadQuestion();
            }
        }

        function updateLevelInfo() {
            let levelIndex = 0;
            let questionsSoFar = 0;
            
            for (let i = 0; i < levels.length; i++) {
                questionsSoFar += levels[i].questions;
                if (currentQuestion < questionsSoFar) {
                    levelIndex = i;
                    break;
                }
            }
            
            document.getElementById('level-info').textContent = levels[levelIndex].name;
        }

        function showGameOver() {
            document.getElementById('scenario').style.display = 'none';
            document.getElementById('options').style.display = 'none';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('level-info').style.display = 'none';
            
            document.getElementById('final-score').textContent = score;
            
            let performance = '';
            if (score >= 90) performance = 'Outstanding! You are a communication styles expert!';
            else if (score >= 70) performance = 'Great job! You understand communication styles well.';
            else if (score >= 50) performance = 'Good effort! Keep practicing to improve.';
            else performance = 'Keep practicing! Understanding communication styles takes time.';
            
            document.getElementById('performance').textContent = performance;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            
            document.getElementById('scenario').style.display = 'block';
            document.getElementById('options').style.display = 'flex';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-info').style.display = 'block';
            
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
