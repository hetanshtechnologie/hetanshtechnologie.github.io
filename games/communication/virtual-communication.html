<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Communication Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .top-bar {
            background-color: #1e293b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .top-bar a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 16px;
        }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar h1 {
            margin-left: 20px;
            font-size: 24px;
            color: #f1f5f9;
        }
        .game-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            font-size: 18px;
        }
        .stats span { color: #94a3b8; }
        .stats strong { color: #38bdf8; }
        .level-info {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 16px;
        }
        .scenario {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #8b5cf6;
        }
        .scenario h3 {
            color: #8b5cf6;
            margin-bottom: 15px;
        }
        .scenario p {
            line-height: 1.6;
            font-size: 16px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #334155;
            border: 2px solid #475569;
            color: #e2e8f0;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: #8b5cf6;
            transform: translateX(5px);
        }
        .option-btn.correct {
            background-color: #166534;
            border-color: #22c55e;
        }
        .option-btn.incorrect {
            background-color: #991b1b;
            border-color: #ef4444;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .explanation {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #f59e0b;
        }
        .explanation h4 {
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .next-btn {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin: 20px auto;
            transition: transform 0.2s;
        }
        .next-btn:hover { transform: scale(1.05); }
        .game-over {
            text-align: center;
            display: none;
        }
        .game-over h2 {
            color: #8b5cf6;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .final-score {
            font-size: 24px;
            margin: 20px 0;
        }
        .play-again-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .play-again-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../index.html">← Back to Games</a>
        <h1>Virtual Communication</h1>
    </div>

    <div class="game-container">
        <div class="header">
            <h2>Master Remote Work Communication</h2>
            <div class="stats">
                <span>Score: <strong id="score">0</strong></span>
                <span>Question: <strong id="question-num">1</strong>/10</span>
            </div>
        </div>

        <div class="level-info" id="level-info">Level 1: Virtual Meeting Basics</div>

        <div class="scenario" id="scenario">
            <h3>Virtual Communication Scenario:</h3>
            <p id="scenario-text"></p>
        </div>

        <div class="options" id="options"></div>

        <div class="explanation" id="explanation">
            <h4>Explanation:</h4>
            <p id="explanation-text"></p>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>

        <div class="game-over" id="game-over">
            <h2>Game Complete!</h2>
            <p class="final-score">Your Final Score: <strong id="final-score">0</strong>/10</p>
            <p id="performance"></p>
            <button class="play-again-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const levels = [
            { name: "Level 1: Virtual Meeting Basics", questions: 3 },
            { name: "Level 2: Remote Team Communication", questions: 3 },
            { name: "Level 3: Advanced Virtual Skills", questions: 4 }
        ];

        const questions = [
            // Level 1
            {
                scenario: "You're hosting a virtual meeting and notice some participants have their cameras off. What's the best approach?",
                options: [
                    "Ignore it and continue the meeting",
                    "Politely request cameras on for better engagement, but respect those who can't",
                    "Demand everyone turn cameras on or leave the meeting",
                    "Send a follow-up email complaining about it"
                ],
                correct: 1,
                explanation: "Respecting personal circumstances while encouraging engagement is professional. Some may have valid reasons for cameras off."
            },
            {
                scenario: "During a video call, you notice someone is multitasking and not paying attention. What's the best response?",
                options: [
                    "Call them out publicly in the meeting",
                    "Directly ask them a question to re-engage them",
                    "Send them a private message asking if everything is okay",
                    "Ignore it and hope they start paying attention"
                ],
                correct: 2,
                explanation: "Private messages address the issue without embarrassing the person. It shows concern while maintaining their dignity."
            },
            {
                scenario: "You're presenting virtually and your internet connection starts lagging. What's the best approach?",
                options: [
                    "Keep going and hope it resolves",
                    "Acknowledge the issue, switch to audio-only if needed, and share your slides for reference",
                    "End the meeting immediately",
                    "Blame your internet provider"
                ],
                correct: 1,
                explanation: "Being transparent about technical issues and providing alternatives shows professionalism and ensures the message gets through."
            },
            // Level 2
            {
                scenario: "You need to give feedback to a remote team member. What's the best channel?",
                options: [
                    "Send a long email with all the feedback",
                    "Schedule a video call to discuss feedback in real-time",
                    "Post feedback in the team chat for everyone to see",
                    "Wait until they're back in the office"
                ],
                correct: 1,
                explanation: "Video calls allow for real-time discussion, clarification, and emotional connection - important for sensitive feedback."
            },
            {
                scenario: "Your remote team member seems disengaged in meetings lately. What's the best approach?",
                options: [
                    "Send them a message asking what's wrong",
                    "Schedule a casual virtual coffee chat to check in",
                    "Increase the number of meetings to monitor them",
                    "Assign them more work to keep them busy"
                ],
                correct: 1,
                explanation: "Casual check-ins in a non-work context can help identify issues and show you care about them as a person."
            },
            {
                scenario: "You need to communicate an urgent issue to your remote team. What's the most effective approach?",
                options: [
                    "Send an email and wait for responses",
                    "Post in the team chat and call key team members directly",
                    "Wait until the next scheduled meeting",
                    "Send a text message to each person"
                ],
                correct: 1,
                explanation: "Urgent issues need immediate attention. Chat provides quick broadcast, while direct calls ensure key people are reached."
            },
            // Level 3
            {
                scenario: "You're leading a virtual workshop with international participants across different time zones. How do you ensure inclusivity?",
                options: [
                    "Schedule at the most convenient time for your location",
                    "Rotate meeting times to accommodate different time zones fairly",
                    "Ask everyone to adjust to your time zone",
                    "Only include participants from similar time zones"
                ],
                correct: 1,
                explanation: "Rotating times shows respect for all participants and ensures no one consistently has to attend at inconvenient hours."
            },
            {
                scenario: "Your remote team uses multiple communication channels (Slack, email, Teams). How do you prevent information silos?",
                important: [
                    "Use only one channel for everything",
                    "Establish clear guidelines for which channel to use for what purpose",
                    "Let everyone choose their preferred channel",
                    "Send the same message on all channels"
                ],
                correct: 1,
                explanation: "Clear channel guidelines prevent confusion and ensure important information reaches everyone through the right medium."
            },
            {
                scenario: "You're conducting a virtual training session and engagement is low. What's the best strategy?",
                options: [
                    "Continue with your presentation regardless",
                    "Add interactive elements like polls, breakout rooms, and Q&A",
                    "End the session early",
                    "Send a recording and ask them to watch later"
                ],
                correct: 1,
                explanation: "Interactive elements break up passive listening and re-engage participants. Variety is key in virtual environments."
            },
            {
                scenario: "Your team has members across different cultures working remotely. How do you build team cohesion?",
                options: [
                    "Only communicate about work tasks",
                    "Create virtual social opportunities and be mindful of cultural differences in communication",
                    "Treat everyone the same regardless of culture",
                    "Focus only on performance metrics"
                ],
                correct: 1,
                explanation: "Building cohesion requires both social connection and cultural awareness. Virtual social events help build relationships."
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('scenario-text').textContent = q.scenario;
            document.getElementById('question-num').textContent = currentQuestion + 1;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            const options = q.options || q.important;
            options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            updateLevelInfo();
        }

        function checkAnswer(index) {
            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) btn.classList.add('correct');
                if (i === index && i !== q.correct) btn.classList.add('incorrect');
            });

            if (index === q.correct) {
                score += 10;
                document.getElementById('score').textContent = score;
            }

            document.getElementById('explanation-text').textContent = q.explanation;
            document.getElementById('explanation').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showGameOver();
            } else {
                loadQuestion();
            }
        }

        function updateLevelInfo() {
            let levelIndex = 0;
            let questionsSoFar = 0;
            
            for (let i = 0; i < levels.length; i++) {
                questionsSoFar += levels[i].questions;
                if (currentQuestion < questionsSoFar) {
                    levelIndex = i;
                    break;
                }
            }
            
            document.getElementById('level-info').textContent = levels[levelIndex].name;
        }

        function showGameOver() {
            document.getElementById('scenario').style.display = 'none';
            document.getElementById('options').style.display = 'none';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('level-info').style.display = 'none';
            
            document.getElementById('final-score').textContent = score;
            
            let performance = '';
            if (score >= 90) performance = 'Outstanding! You are a virtual communication expert!';
            else if (score >= 70) performance = 'Great job! You have strong remote communication skills.';
            else if (score >= 50) performance = 'Good effort! Keep practicing to improve.';
            else performance = 'Keep practicing! Virtual communication skills are essential today.';
            
            document.getElementById('performance').textContent = performance;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            
            document.getElementById('scenario').style.display = 'block';
            document.getElementById('options').style.display = 'flex';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-info').style.display = 'block';
            
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
