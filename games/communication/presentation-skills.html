<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation Skills Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .top-bar {
            background-color: #1e293b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .top-bar a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 16px;
        }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar h1 {
            margin-left: 20px;
            font-size: 24px;
            color: #f1f5f9;
        }
        .game-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            font-size: 18px;
        }
        .stats span { color: #94a3b8; }
        .stats strong { color: #38bdf8; }
        .level-info {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 16px;
        }
        .scenario {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #8b5cf6;
        }
        .scenario h3 {
            color: #8b5cf6;
            margin-bottom: 15px;
        }
        .scenario p {
            line-height: 1.6;
            font-size: 16px;
        }
        .rating-container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .rating-question {
            margin-bottom: 20px;
        }
        .rating-question h4 {
            color: #f1f5f9;
            margin-bottom: 10px;
        }
        .rating-options {
            display: flex;
            gap: 10px;
        }
        .rating-btn {
            background-color: #334155;
            border: 2px solid #475569;
            color: #e2e8f0;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .rating-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: #8b5cf6;
        }
        .rating-btn.selected {
            background-color: #8b5cf6;
            border-color: #a78bfa;
            color: white;
        }
        .rating-btn.correct {
            background-color: #166534;
            border-color: #22c55e;
        }
        .rating-btn.incorrect {
            background-color: #991b1b;
            border-color: #ef4444;
        }
        .submit-btn {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        .submit-btn:hover { transform: scale(1.05); }
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .explanation {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #f59e0b;
        }
        .explanation h4 {
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .next-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0f172a;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin: 20px auto;
            transition: transform 0.2s;
        }
        .next-btn:hover { transform: scale(1.05); }
        .game-over {
            text-align: center;
            display: none;
        }
        .game-over h2 {
            color: #8b5cf6;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .final-score {
            font-size: 24px;
            margin: 20px 0;
        }
        .play-again-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .play-again-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../index.html">← Back to Games</a>
        <h1>Presentation Skills</h1>
    </div>

    <div class="game-container">
        <div class="header">
            <h2>Master the Art of Presenting</h2>
            <div class="stats">
                <span>Score: <strong id="score">0</strong></span>
                <span>Question: <strong id="question-num">1</strong>/10</span>
            </div>
        </div>

        <div class="level-info" id="level-info">Level 1: Basic Presentation Elements</div>

        <div class="scenario" id="scenario">
            <h3>Rate This Presentation:</h3>
            <p id="scenario-text"></p>
        </div>

        <div class="rating-container" id="rating-container">
            <div class="rating-question" id="rating-questions"></div>
            <button class="submit-btn" id="submit-btn" onclick="submitRatings()" disabled>Submit Ratings</button>
        </div>

        <div class="explanation" id="explanation">
            <h4>Explanation:</h4>
            <p id="explanation-text"></p>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>

        <div class="game-over" id="game-over">
            <h2>Game Complete!</h2>
            <p class="final-score">Your Final Score: <strong id="final-score">0</strong>/10</p>
            <p id="performance"></p>
            <button class="play-again-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const levels = [
            { name: "Level 1: Basic Presentation Elements", questions: 3 },
            { name: "Level 2: Delivery Techniques", questions: 3 },
            { name: "Level 3: Advanced Presentation Skills", questions: 4 }
        ];

        const questions = [
            // Level 1
            {
                scenario: "A presenter stands behind a podium, reads directly from their slides, maintains a monotone voice, and avoids eye contact with the audience.",
                ratings: [
                    { question: "Eye Contact", correct: 1 },
                    { question: "Voice Variety", correct: 1 },
                    { question: "Engagement", correct: 1 }
                ],
                explanation: "This presenter demonstrates poor skills: no eye contact (1/5), monotone voice (1/5), and low engagement by reading slides (1/5). Effective presenters look at the audience, vary their tone, and engage actively."
            },
            {
                scenario: "A speaker makes strong eye contact, uses hand gestures naturally, varies their vocal tone, and asks the audience questions throughout.",
                ratings: [
                    { question: "Eye Contact", correct: 5 },
                    { question: "Voice Variety", correct: 4 },
                    { question: "Engagement", correct: 5 }
                ],
                explanation: "Excellent skills: strong eye contact (5/5), good vocal variety (4/5), and high engagement through questions (5/5). This creates a dynamic, interactive presentation."
            },
            {
                scenario: "A presenter makes occasional eye contact, speaks clearly but at a steady pace, uses minimal gestures, and covers key points without engaging the audience.",
                ratings: [
                    { question: "Eye Contact", correct: 3 },
                    { question: "Voice Variety", correct: 3 },
                    { question: "Engagement", correct: 2 }
                ],
                explanation: "Moderate skills: some eye contact (3/5), consistent but not varied pace (3/5), minimal engagement (2/5). Room for improvement in audience interaction and vocal dynamics."
            },
            // Level 2
            {
                scenario: "A presenter uses powerful pauses, maintains open body language, moves purposefully around the stage, and adapts content based on audience reactions.",
                ratings: [
                    { question: "Body Language", correct: 5 },
                    { question: "Stage Presence", correct: 5 },
                    { question: "Adaptability", correct: 5 }
                ],
                explanation: "Outstanding delivery: open body language (5/5), confident stage presence (5/5), and excellent adaptability (5/5). This is how professional speakers engage audiences."
            },
            {
                scenario: "A presenter fidgets with their hands, stays behind the podium, reads notes frequently, and doesn't adjust when audience looks confused.",
                ratings: [
                    { question: "Body Language", correct: 2 },
                    { question: "Stage Presence", correct: 1 },
                    { question: "Adaptability", correct: 1 }
                ],
                explanation: "Poor delivery: nervous fidgeting (2/5), static position (1/5), no adaptation to audience (1/5). Needs work on confident body language and reading the room."
            },
            {
                scenario: "A presenter uses occasional gestures, stands mostly in one spot but makes eye contact, varies pace somewhat, and notices when audience is disengaged.",
                ratings: [
                    { question: "Body Language", correct: 3 },
                    { question: "Stage Presence", correct: 3 },
                    { question: "Adaptability", correct: 3 }
                ],
                explanation: "Developing skills: some gestures (3/5), limited movement but good eye contact (3/5), notices disengagement (3/5). Good foundation to build upon."
            },
            // Level 3
            {
                scenario: "A presenter uses storytelling, data visualization, audience participation, and clear transitions. They handle technical difficulties calmly and continue smoothly.",
                ratings: [
                    { question: "Content Structure", correct: 5 },
                    { question: "Visual Aids", correct: 4 },
                    { question: "Problem Handling", correct: 5 }
                ],
                explanation: "Expert-level presentation: strong storytelling and structure (5/5), effective visuals (4/5), and excellent problem handling (5/5). This is how top speakers manage challenges."
            },
            {
                scenario: "A presenter has too much text on slides, rushes through key points, doesn't pause for questions, and panics when the projector fails.",
                ratings: [
                    { question: "Content Structure", correct: 2 },
                    { question: "Visual Aids", correct: 1 },
                    { question: "Problem Handling", correct: 1 }
                ],
                explanation: "Needs significant improvement: poor pacing (2/5), text-heavy slides (1/5), and panicked response to problems (1/5). Focus on simplifying visuals and practicing contingencies."
            },
            {
                scenario: "A presenter uses compelling visuals, tells relevant stories, builds in Q&A time, and when Wi-Fi fails, they continue with their talk and address questions offline.",
                ratings: [
                    { question: "Content Structure", correct: 4 },
                    { question: "Visual Aids", correct: 5 },
                    { question: "Problem Handling", correct: 4 }
                ],
                explanation: "Strong presentation: good structure with stories (4/5), excellent visuals (5/5), and calm problem handling (4/5). Minor room for improvement in contingency planning."
            },
            {
                scenario: "A presenter engages the audience with polls, uses simple but effective graphics, maintains energy throughout, and when a video fails to play, they describe the content vividly.",
                ratings: [
                    { question: "Content Structure", correct: 5 },
                    { question: "Visual Aids", correct: 4 },
                    { question: "Problem Handling", correct: 5 }
                ],
                explanation: "Excellent skills: audience engagement (5/5), effective visuals (4/5), and creative problem-solving (5/5). This shows true presentation mastery."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedRatings = {};

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('scenario-text').textContent = q.scenario;
            document.getElementById('question-num').textContent = currentQuestion + 1;
            
            const ratingContainer = document.getElementById('rating-questions');
            ratingContainer.innerHTML = '';
            selectedRatings = {};
            
            q.ratings.forEach((rating, index) => {
                const ratingDiv = document.createElement('div');
                ratingDiv.className = 'rating-question';
                ratingDiv.innerHTML = `
                    <h4>${rating.question}</h4>
                    <div class="rating-options" id="rating-${index}">
                        ${[1,2,3,4,5].map(value => `
                            <button class="rating-btn" onclick="selectRating(${index}, ${value})" data-value="${value}">${value}</button>
                        `).join('')}
                    </div>
                `;
                ratingContainer.appendChild(ratingDiv);
            });

            document.getElementById('submit-btn').disabled = true;
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            updateLevelInfo();
        }

        function selectRating(index, value) {
            selectedRatings[index] = value;
            
            const buttons = document.querySelectorAll(`#rating-${index} .rating-btn`);
            buttons.forEach(btn => {
                btn.classList.remove('selected');
                if (parseInt(btn.dataset.value) === value) {
                    btn.classList.add('selected');
                }
            });

            const allSelected = Object.keys(selectedRatings).length === questions[currentQuestion].ratings.length;
            document.getElementById('submit-btn').disabled = !allSelected;
        }

        function submitRatings() {
            const q = questions[currentQuestion];
            let questionScore = 0;
            
            q.ratings.forEach((rating, index) => {
                const buttons = document.querySelectorAll(`#rating-${index} .rating-btn`);
                buttons.forEach(btn => {
                    btn.disabled = true;
                    const value = parseInt(btn.dataset.value);
                    if (value === rating.correct) {
                        btn.classList.add('correct');
                    } else if (value === selectedRatings[index] && value !== rating.correct) {
                        btn.classList.add('incorrect');
                    }
                });
                
                if (selectedRatings[index] === rating.correct) {
                    questionScore += 10;
                } else {
                    const diff = Math.abs(selectedRatings[index] - rating.correct);
                    questionScore += Math.max(0, 3 - diff);
                }
            });
            
            score += Math.round(questionScore / q.ratings.length);
            document.getElementById('score').textContent = score;

            document.getElementById('explanation-text').textContent = q.explanation;
            document.getElementById('explanation').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showGameOver();
            } else {
                loadQuestion();
            }
        }

        function updateLevelInfo() {
            let levelIndex = 0;
            let questionsSoFar = 0;
            
            for (let i = 0; i < levels.length; i++) {
                questionsSoFar += levels[i].questions;
                if (currentQuestion < questionsSoFar) {
                    levelIndex = i;
                    break;
                }
            }
            
            document.getElementById('level-info').textContent = levels[levelIndex].name;
        }

        function showGameOver() {
            document.getElementById('scenario').style.display = 'none';
            document.getElementById('rating-container').style.display = 'none';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('level-info').style.display = 'none';
            
            document.getElementById('final-score').textContent = score;
            
            let performance = '';
            if (score >= 90) performance = 'Outstanding! You are a presentation expert!';
            else if (score >= 70) performance = 'Great job! You have strong presentation skills.';
            else if (score >= 50) performance = 'Good effort! Keep practicing to improve.';
            else performance = 'Keep practicing! Presentation skills take time to master.';
            
            document.getElementById('performance').textContent = performance;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            
            document.getElementById('scenario').style.display = 'block';
            document.getElementById('rating-container').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'block';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-info').style.display = 'block';
            
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
