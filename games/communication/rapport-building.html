<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapport Building Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .top-bar {
            background-color: #1e293b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .top-bar a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 16px;
        }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar h1 {
            margin-left: 20px;
            font-size: 24px;
            color: #f1f5f9;
        }
        .game-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            font-size: 18px;
        }
        .stats span { color: #94a3b8; }
        .stats strong { color: #38bdf8; }
        .level-info {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 16px;
        }
        .scenario {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #22c55e;
        }
        .scenario h3 {
            color: #22c55e;
            margin-bottom: 15px;
        }
        .scenario p {
            line-height: 1.6;
            font-size: 16px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #334155;
            border: 2px solid #475569;
            color: #e2e8f0;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: #22c55e;
            transform: translateX(5px);
        }
        .option-btn.correct {
            background-color: #166534;
            border-color: #22c55e;
        }
        .option-btn.incorrect {
            background-color: #991b1b;
            border-color: #ef4444;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .explanation {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #f59e0b;
        }
        .explanation h4 {
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .next-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin: 20px auto;
            transition: transform 0.2s;
        }
        .next-btn:hover { transform: scale(1.05); }
        .game-over {
            text-align: center;
            display: none;
        }
        .game-over h2 {
            color: #22c55e;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .final-score {
            font-size: 24px;
            margin: 20px 0;
        }
        .play-again-btn {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .play-again-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../index.html">← Back to Games</a>
        <h1>Rapport Building</h1>
    </div>

    <div class="game-container">
        <div class="header">
            <h2>Master the Art of Building Rapport</h2>
            <div class="stats">
                <span>Score: <strong id="score">0</strong></span>
                <span>Question: <strong id="question-num">1</strong>/10</span>
            </div>
        </div>

        <div class="level-info" id="level-info">Level 1: Basic Rapport Building</div>

        <div class="scenario" id="scenario">
            <h3>Rapport Building Scenario:</h3>
            <p id="scenario-text"></p>
        </div>

        <div class="options" id="options"></div>

        <div class="explanation" id="explanation">
            <h4>Explanation:</h4>
            <p id="explanation-text"></p>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>

        <div class="game-over" id="game-over">
            <h2>Game Complete!</h2>
            <p class="final-score">Your Final Score: <strong id="final-score">0</strong>/10</p>
            <p id="performance"></p>
            <button class="play-again-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const levels = [
            { name: "Level 1: Basic Rapport Building", questions: 3 },
            { name: "Level 2: Advanced Rapport", questions: 3 },
            { name: "Level 3: Rapport Mastery", questions: 4 }
        ];

        const questions = [
            // Level 1
            {
                scenario: "You're meeting a new colleague for the first time. What's the best way to start building rapport?",
                options: [
                    "Immediately talk about work and deadlines",
                    "Find common ground by asking about their interests or background",
                    "Tell them all about yourself first",
                    "Wait for them to start the conversation"
                ],
                correct: 1,
                explanation: "Finding common ground creates connection. Asking about interests shows genuine interest in them as a person."
            },
            {
                scenario: "During a conversation, you notice the other person is leaning in and making eye contact. What does this indicate?",
                options: [
                    "They're trying to intimidate you",
                    "They're interested and engaged in the conversation",
                    "They're bored and want to leave",
                    "They're checking if you're lying"
                ],
                correct: 1,
                explanation: "Leaning in and eye contact are signs of engagement and interest. This is positive rapport building happening naturally."
            },
            {
                scenario: "You want to build rapport with someone who seems reserved. What's the best approach?",
                options: [
                    "Be extra enthusiastic to draw them out",
                    "Match their energy level and give them space to open up",
                    "Keep asking personal questions until they warm up",
                    "Talk louder and faster to keep their attention"
                ],
                correct: 1,
                explanation: "Matching energy levels creates comfort. Reserved people need time and space to open up naturally."
            },
            // Level 2
            {
                scenario: "You're trying to build rapport with a client who loves gardening. What's a good approach?",
                options: [
                    "Pretend to be interested even though you're not",
                    "Ask genuine questions about their gardening and share what you know if relevant",
                    "Change the subject to business immediately",
                    "Tell them gardening is boring"
                ],
                correct: 1,
                explanation: "Genuine interest in their passion builds authentic connection. Even if you don't share the interest, curiosity creates rapport."
            },
            {
                scenario: "During a meeting, you realize you and a colleague both lived in the same city. How do you use this?",
                options: [
                    "Ignore it and focus on work only",
                    "Mention the connection briefly to create common ground, then transition to work topics",
                    "Spend the entire meeting talking about that city",
                    "Use it to prove you have more in common than they think"
                ],
                correct: 1,
                explanation: "Common experiences create quick connection. Mentioning it briefly builds rapport without derailing the meeting."
            },
            {
                scenario: "You notice a team member seems stressed. How do you build rapport while addressing this?",
                options: [
                    "Tell them to relax because stress is bad for them",
                    "Acknowledge their stress and offer support without being intrusive",
                    "Share your own stress stories to show you understand",
                    "Ignore it because it's not your business"
                ],
                correct: 1,
                explanation: "Acknowledging without prying shows care while respecting boundaries. Offering support opens the door without pressure."
            },
            // Level 3
            {
                scenario: "You need to build rapport quickly with someone from a completely different background. What's most effective?",
                options: [
                    "Focus only on professional topics",
                    "Be curious about their experiences and find universal human connections",
                    "Pretend you have more in common than you do",
                    "Let them do all the talking"
                ],
                correct: 1,
                explanation: "Universal human experiences (challenges, dreams, family, work) create connection across any background."
            },
            {
                scenario: "In a high-stakes negotiation, how do you build rapport while maintaining your position?",
                options: [
                    "Be aggressive to show you mean business",
                    "Find areas of agreement, acknowledge their perspective, and build on shared interests",
                    "Avoid personal conversation entirely",
                    "Try to befriend them before discussing business"
                ],
                correct: 1,
                explanation: "Acknowledging their perspective while finding common ground builds trust without compromising your position."
            },
            {
                scenario: "You're leading a team through a difficult change. How do you maintain rapport?",
                options: [
                    "Just give orders and expect compliance",
                    "Be transparent about challenges, listen to concerns, and show genuine care for how the change affects them",
                    "Avoid difficult conversations about the change",
                    "Pretend everything is fine"
                ],
                correct: 1,
                explanation: "Transparency, listening, and genuine care during difficult times build deeper rapport than during easy times."
            },
            {
                scenario: "You've made a mistake that affected a colleague. How do you repair rapport?",
                options: [
                    "Wait for them to bring it up",
                    "Acknowledge the mistake, take responsibility, apologize sincerely, and ask how you can make it right",
                    "Blame circumstances or other factors",
                    "Just move on and hope they forget"
                ],
                correct: 1,
                explanation: "Genuine acknowledgment, responsibility, and repair attempts are the fastest way to rebuild damaged rapport."
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('scenario-text').textContent = q.scenario;
            document.getElementById('question-num').textContent = currentQuestion + 1;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            updateLevelInfo();
        }

        function checkAnswer(index) {
            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) btn.classList.add('correct');
                if (i === index && i !== q.correct) btn.classList.add('incorrect');
            });

            if (index === q.correct) {
                score += 10;
                document.getElementById('score').textContent = score;
            }

            document.getElementById('explanation-text').textContent = q.explanation;
            document.getElementById('explanation').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showGameOver();
            } else {
                loadQuestion();
            }
        }

        function updateLevelInfo() {
            let levelIndex = 0;
            let questionsSoFar = 0;
            
            for (let i = 0; i < levels.length; i++) {
                questionsSoFar += levels[i].questions;
                if (currentQuestion < questionsSoFar) {
                    levelIndex = i;
                    break;
                }
            }
            
            document.getElementById('level-info').textContent = levels[levelIndex].name;
        }

        function showGameOver() {
            document.getElementById('scenario').style.display = 'none';
            document.getElementById('options').style.display = 'none';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('level-info').style.display = 'none';
            
            document.getElementById('final-score').textContent = score;
            
            let performance = '';
            if (score >= 90) performance = 'Outstanding! You are a rapport building expert!';
            else if (score >= 70) performance = 'Great job! You have strong rapport building skills.';
            else if (score >= 50) performance = 'Good effort! Keep practicing to improve.';
            else performance = 'Keep practicing! Building rapport is a valuable skill.';
            
            document.getElementById('performance').textContent = performance;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            
            document.getElementById('scenario').style.display = 'block';
            document.getElementById('options').style.display = 'flex';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-info').style.display = 'block';
            
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
