<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross-Cultural Communication Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .top-bar {
            background-color: #1e293b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .top-bar a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 16px;
        }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar h1 {
            margin-left: 20px;
            font-size: 24px;
            color: #f1f5f9;
        }
        .game-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            font-size: 18px;
        }
        .stats span { color: #94a3b8; }
        .stats strong { color: #38bdf8; }
        .level-info {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 16px;
        }
        .scenario {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #06b6d4;
        }
        .scenario h3 {
            color: #06b6d4;
            margin-bottom: 15px;
        }
        .scenario p {
            line-height: 1.6;
            font-size: 16px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #334155;
            border: 2px solid #475569;
            color: #e2e8f0;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: #06b6d4;
            transform: translateX(5px);
        }
        .option-btn.correct {
            background-color: #166534;
            border-color: #22c55e;
        }
        .option-btn.incorrect {
            background-color: #991b1b;
            border-color: #ef4444;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .explanation {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #f59e0b;
        }
        .explanation h4 {
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .next-btn {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin: 20px auto;
            transition: transform 0.2s;
        }
        .next-btn:hover { transform: scale(1.05); }
        .game-over {
            text-align: center;
            display: none;
        }
        .game-over h2 {
            color: #06b6d4;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .final-score {
            font-size: 24px;
            margin: 20px 0;
        }
        .play-again-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .play-again-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../index.html">← Back to Games</a>
        <h1>Cross-Cultural Communication</h1>
    </div>

    <div class="game-container">
        <div class="header">
            <h2>Navigate Cultural Differences</h2>
            <div class="stats">
                <span>Score: <strong id="score">0</strong></span>
                <span>Question: <strong id="question-num">1</strong>/10</span>
            </div>
        </div>

        <div class="level-info" id="level-info">Level 1: Cultural Awareness</div>

        <div class="scenario" id="scenario">
            <h3>Cross-Cultural Scenario:</h3>
            <p id="scenario-text"></p>
        </div>

        <div class="options" id="options"></div>

        <div class="explanation" id="explanation">
            <h4>Explanation:</h4>
            <p id="explanation-text"></p>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>

        <div class="game-over" id="game-over">
            <h2>Game Complete!</h2>
            <p class="final-score">Your Final Score: <strong id="final-score">0</strong>/10</p>
            <p id="performance"></p>
            <button class="play-again-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const levels = [
            { name: "Level 1: Cultural Awareness", questions: 3 },
            { name: "Level 2: Communication Norms", questions: 3 },
            { name: "Level 3: Advanced Cultural Competence", questions: 4 }
        ];

        const questions = [
            // Level 1
            {
                scenario: "Your Japanese colleague bows slightly when greeting you. How should you respond?",
                options: [
                    "Ignore it and just shake their hand",
                    "Bow back, even if imperfectly, to show respect for their custom",
                    "Tell them they don't need to do that in your country",
                    "Laugh because it seems funny"
                ],
                correct: 1,
                explanation: "Responding to cultural gestures with respect shows appreciation. Even a slight bow acknowledges their custom and builds goodwill."
            },
            {
                scenario: "In some Middle Eastern cultures, it's considered rude to show the sole of your shoe. What's the best approach?",
                options: [
                    "Make sure to cross your legs to show your shoe sole",
                    "Be mindful of your body positioning and avoid pointing your feet at others",
                    "Tell them it's a silly custom",
                    "Ignore it because it doesn't apply to you"
                ],
                correct: 1,
                explanation: "Being aware of and respecting cultural norms shows sensitivity. Adapting your behavior demonstrates cultural intelligence."
            },
            {
                scenario: "A colleague from a high-context culture (where communication is indirect) seems to be agreeing with you, but you sense hesitation. What should you do?",
                options: [
                    "Assume they agree and move forward",
                    "Ask open-ended questions to understand their true feelings",
                    "Tell them to be more direct",
                    "Ignore the hesitation and continue"
                ],
                correct: 1,
                explanation: "High-context cultures often communicate indirectly. Asking open-ended questions helps understand true feelings without causing embarrassment."
            },
            // Level 2
            {
                scenario: "In some Asian cultures, silence during conversation is considered respectful, not awkward. How should you adapt?",
                options: [
                    "Fill the silence immediately to make them comfortable",
                    "Accept silence as part of the conversation and don't rush to fill it",
                    "Tell them they should speak more",
                    "Assume they're not interested and end the conversation"
                ],
                correct: 1,
                explanation: "Different cultures have different norms around silence. Accepting it shows respect for their communication style."
            },
            {
                scenario: "In Germany, punctuality is highly valued. You're meeting a German business partner. What's the best approach?",
                options: [
                    "Arrive 15 minutes late to show you're relaxed",
                    "Arrive exactly on time or a few minutes early",
                    "Arrive whenever convenient",
                    "Don't worry about time, they'll understand"
                ],
                correct: 1,
                explanation: "In cultures that value punctuality, being on time shows respect and professionalism. Lateness can be seen as disrespectful."
            },
            {
                scenario: "In some Latin American cultures, personal space is smaller and touching during conversation is common. How should you adapt?",
                options: [
                    "Step back to maintain your preferred distance",
                    "Accept the closer proximity and occasional touching as friendly",
                    "Tell them they're too close",
                    "Leave the conversation immediately"
                ],
                correct: 1,
                explanation: "Respecting cultural norms around personal space shows adaptation. Different cultures have different comfort zones."
            },
            // Level 3
            {
                scenario: "You're presenting to a multicultural team. How do you ensure effective communication?",
                options: [
                    "Use your native language and assume everyone will understand",
                    "Speak slowly, avoid idioms, and check for understanding regularly",
                    "Use only visual aids to avoid language issues",
                    "Let the most dominant culture guide the communication"
                ],
                clear: 1,
                explanation: "Clear communication across cultures involves simple language, avoiding idioms, and checking understanding. This ensures everyone can participate."
            },
            {
                scenario: "A colleague from a collectivist culture emphasizes 'we' over 'I' in team discussions. What does this indicate?",
                options: [
                    "They don't have individual opinions",
                    "They value group harmony and collective achievement",
                    "They're trying to take credit for the team",
                    "They're being vague on purpose"
                ],
                correct: 1,
                explanation: "Collectivist cultures prioritize group harmony and shared success over individual recognition. This is a sign of teamwork, not lack of individuality."
            },
            {
                scenario: "In some cultures, 'yes' might mean 'I hear you' rather than 'I agree.' How should you interpret responses?",
                options: [
                    "Always take 'yes' at face value",
                    "Pay attention to nonverbal cues and context to understand true meaning",
                    "Assume they're being dishonest",
                    "Ask them to repeat themselves"
                ],
                correct: 1,
                explanation: "In high-context cultures, 'yes' often means 'I'm listening' not 'I agree.' Context and nonverbal cues help interpret true meaning."
            },
            {
                scenario: "You're working with a team from a culture that values hierarchy. How should you address concerns?",
                options: [
                    "Go directly to the most junior person with the issue",
                    "Address concerns through the appropriate hierarchical channels",
                    "Ignore hierarchy and communicate directly with anyone",
                    "Complain about the hierarchy being inefficient"
                ],
                correct: 1,
                explanation: "Respecting hierarchical cultures means working through proper channels. This shows respect and ensures effective communication."
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('scenario-text').textContent = q.scenario;
            document.getElementById('question-num').textContent = currentQuestion + 1;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            updateLevelInfo();
        }

        function checkAnswer(index) {
            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) btn.classList.add('correct');
                if (i === index && i !== q.correct) btn.classList.add('incorrect');
            });

            if (index === q.correct) {
                score += 10;
                document.getElementById('score').textContent = score;
            }

            document.getElementById('explanation-text').textContent = q.explanation;
            document.getElementById('explanation').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showGameOver();
            } else {
                loadQuestion();
            }
        }

        function updateLevelInfo() {
            let levelIndex = 0;
            let questionsSoFar = 0;
            
            for (let i = 0; i < levels.length; i++) {
                questionsSoFar += levels[i].questions;
                if (currentQuestion < questionsSoFar) {
                    levelIndex = i;
                    break;
                }
            }
            
            document.getElementById('level-info').textContent = levels[levelIndex].name;
        }

        function showGameOver() {
            document.getElementById('scenario').style.display = 'none';
            document.getElementById('options').style.display = 'none';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('level-info').style.display = 'none';
            
            document.getElementById('final-score').textContent = score;
            
            let performance = '';
            if (score >= 90) performance = 'Outstanding! You are a cross-cultural communication expert!';
            else if (score >= 70) performance = 'Great job! You have strong cultural awareness.';
            else if (score >= 50) performance = 'Good effort! Keep practicing to improve.';
            else performance = 'Keep practicing! Cross-cultural competence takes time to develop.';
            
            document.getElementById('performance').textContent = performance;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            
            document.getElementById('scenario').style.display = 'block';
            document.getElementById('options').style.display = 'flex';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-info').style.display = 'block';
            
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
