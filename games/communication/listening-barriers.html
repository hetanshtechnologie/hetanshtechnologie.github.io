<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listening Barriers Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .top-bar {
            background-color: #1e293b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .top-bar a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 16px;
        }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar h1 {
            margin-left: 20px;
            font-size: 24px;
            color: #f1f5f9;
        }
        .game-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            font-size: 18px;
        }
        .stats span { color: #94a3b8; }
        .stats strong { color: #38bdf8; }
        .level-info {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 16px;
        }
        .scenario {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #f97316;
        }
        .scenario h3 {
            color: #f97316;
            margin-bottom: 15px;
        }
        .scenario p {
            line-height: 1.6;
            font-size: 16px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #334155;
            border: 2px solid #475569;
            color: #e2e8f0;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: #f97316;
            transform: translateX(5px);
        }
        .option-btn.correct {
            background-color: #166534;
            border-color: #22c55e;
        }
        .option-btn.incorrect {
            background-color: #991b1b;
            border-color: #ef4444;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .explanation {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #f59e0b;
        }
        .explanation h4 {
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .next-btn {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin: 20px auto;
            transition: transform 0.2s;
        }
        .next-btn:hover { transform: scale(1.05); }
        .game-over {
            text-align: center;
            display: none;
        }
        .game-over h2 {
            color: #f97316;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .final-score {
            font-size: 24px;
            margin: 20px 0;
        }
        .play-again-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .play-again-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../index.html">← Back to Games</a>
        <h1>Listening Barriers</h1>
    </div>

    <div class="game-container">
        <div class="header">
            <h2>Identify Barriers to Effective Listening</h2>
            <div class="stats">
                <span>Score: <strong id="score">0</strong></span>
                <span>Question: <strong id="question-num">1</strong>/10</span>
            </div>
        </div>

        <div class="level-info" id="level-info">Level 1: Common Listening Barriers</div>

        <div class="scenario" id="scenario">
            <h3>Listening Scenario:</h3>
            <p id="scenario-text"></p>
        </div>

        <div class="options" id="options"></div>

        <div class="explanation" id="explanation">
            <h4>Explanation:</h4>
            <p id="explanation-text"></p>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>

        <div class="game-over" id="game-over">
            <h2>Game Complete!</h2>
            <p class="final-score">Your Final Score: <strong id="final-score">0</strong>/10</p>
            <p id="performance"></p>
            <button class="play-again-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const levels = [
            { name: "Level 1: Common Listening Barriers", questions: 3 },
            { name: "Level 2: Psychological Barriers", questions: 3 },
            { name: "Level 3: Overcoming Barriers", questions: 4 }
        ];

        const questions = [
            // Level 1
            {
                scenario: "While your colleague is explaining a problem, you're already formulating your response before they finish speaking.",
                options: [
                    "Selective listening",
                    "Rehearsing - planning what to say next",
                    "Defensive listening",
                    "Ambient noise"
                ],
                correct: 1,
                explanation: "Rehearsing is when you focus on your response rather than listening. It prevents you from fully hearing what the speaker is saying."
            },
            {
                scenario: "You're listening to a presentation, but you're distracted by notifications on your phone.",
                options: [
                    "Information overload",
                    "External distractions",
                    "Semantic barriers",
                    "Cultural differences"
                ],
                correct: 1,
                explanation: "External distractions include environmental factors like phones, noise, or other interruptions that pull your attention away from listening."
            },
            {
                scenario: "You dismiss a suggestion from a junior colleague because 'they don't have enough experience.'",
                options: [
                    "Emotional barriers",
                    "Prejudgment or bias",
                    "Information overload",
                    "Physical barriers"
                ],
                correct: 1,
                explanation: "Prejudgment is when you decide someone has nothing valuable to say based on assumptions about their background, experience, or position."
            },
            // Level 2
            {
                scenario: "You feel anxious about an upcoming performance review, so you can't focus on what your manager is saying during a meeting.",
                options: [
                    "External distractions",
                    "Emotional state - anxiety affecting focus",
                    "Semantic barriers",
                    "Cultural differences"
                ],
                correct: 1,
                explanation: "Your emotional state can be a powerful barrier. Anxiety, anger, or excitement can prevent you from fully listening to others."
            },
            {
                scenario: "You're listening to a technical expert use jargon you don't understand, so you mentally tune out.",
                options: [
                    "Semantic barriers - language/jargon you don't understand",
                    "Prejudgment",
                    "External distractions",
                    "Rehearsing"
                ],
                correct: 0,
                explanation: "Semantic barriers occur when language, jargon, or terminology creates a gap in understanding. This can cause listeners to disengage."
            },
            {
                scenario: "You're tired after a long day and find yourself drifting off during a conversation.",
                options: [
                    "Information overload",
                    "Physical/physiological barriers - fatigue",
                    "Emotional barriers",
                    "Cultural differences"
                ],
                correct: 1,
                explanation: "Physical barriers include fatigue, hunger, illness, or discomfort. Your body's state directly impacts your ability to listen effectively."
            },
            // Level 3
            {
                scenario: "A speaker is using long, complex sentences that are hard to follow.",
                options: [
                    "Prejudgment",
                    "Semantic complexity barrier",
                    "Emotional barriers",
                    "Cultural differences"
                ],
                correct: 1,
                explanation: "When speakers use overly complex language or structure, it creates a semantic barrier that makes listening difficult."
            },
            {
                scenario: "You strongly disagree with the speaker's viewpoint and find yourself getting angry.",
                options: [
                    "External distractions",
                    "Emotional barrier - defensiveness",
                    "Information overload",
                    "Physical barriers"
                ],
                correct: 1,
                explanation: "When we disagree strongly, we often become defensive or angry, which prevents us from truly listening to understand."
            },
            {
                scenario: "You're in a meeting where too much information is being presented too quickly.",
                options: [
                    "Semantic barriers",
                    "Information overload",
                    "Physical barriers",
                    "Cultural differences"
                ],
                correct: 1,
                explanation: "Information overload occurs when we receive more information than we can process, causing us to shut down or miss important points."
            },
            {
                scenario: "You're speaking with someone from a different culture who has different communication norms.",
                options: [
                    "Emotional barriers",
                    "Cultural communication barriers",
                    "Information overload",
                    "Physical barriers"
                ],
                correct: 1,
                explanation: "Cultural barriers arise from different communication styles, values, and norms that can lead to misunderstandings."
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('scenario-text').textContent = q.scenario;
            document.getElementById('question-num').textContent = currentQuestion + 1;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            updateLevelInfo();
        }

        function checkAnswer(index) {
            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) btn.classList.add('correct');
                if (i === index && i !== q.correct) btn.classList.add('incorrect');
            });

            if (index === q.correct) {
                score += 10;
                document.getElementById('score').textContent = score;
            }

            document.getElementById('explanation-text').textContent = q.explanation;
            document.getElementById('explanation').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showGameOver();
            } else {
                loadQuestion();
            }
        }

        function updateLevelInfo() {
            let levelIndex = 0;
            let questionsSoFar = 0;
            
            for (let i = 0; i < levels.length; i++) {
                questionsSoFar += levels[i].questions;
                if (currentQuestion < questionsSoFar) {
                    levelIndex = i;
                    break;
                }
            }
            
            document.getElementById('level-info').textContent = levels[levelIndex].name;
        }

        function showGameOver() {
            document.getElementById('scenario').style.display = 'none';
            document.getElementById('options').style.display = 'none';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('level-info').style.display = 'none';
            
            document.getElementById('final-score').textContent = score;
            
            let performance = '';
            if (score >= 90) performance = 'Outstanding! You can identify and overcome listening barriers!';
            else if (score >= 70) performance = 'Great job! You recognize most listening barriers.';
            else if (score >= 50) performance = 'Good effort! Keep practicing to improve.';
            else performance = 'Keep practicing! Identifying barriers is the first step to overcoming them.';
            
            document.getElementById('performance').textContent = performance;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            
            document.getElementById('scenario').style.display = 'block';
            document.getElementById('options').style.display = 'flex';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-info').style.display = 'block';
            
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
