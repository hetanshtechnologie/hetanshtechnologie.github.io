<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empathy Builder Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .top-bar {
            background-color: #1e293b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .top-bar a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 16px;
        }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar h1 {
            margin-left: 20px;
            font-size: 24px;
            color: #f1f5f9;
        }
        .game-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            font-size: 18px;
        }
        .stats span { color: #94a3b8; }
        .stats strong { color: #38bdf8; }
        .level-info {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 16px;
        }
        .scenario {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #f43f5e;
        }
        .scenario h3 {
            color: #f43f5e;
            margin-bottom: 15px;
        }
        .scenario p {
            line-height: 1.6;
            font-size: 16px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #334155;
            border: 2px solid #475569;
            color: #e2e8f0;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: #f43f5e;
            transform: translateX(5px);
        }
        .option-btn.correct {
            background-color: #166534;
            border-color: #22c55e;
        }
        .option-btn.incorrect {
            background-color: #991b1b;
            border-color: #ef4444;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .explanation {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #f59e0b;
        }
        .explanation h4 {
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .next-btn {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin: 20px auto;
            transition: transform 0.2s;
        }
        .next-btn:hover { transform: scale(1.05); }
        .game-over {
            text-align: center;
            display: none;
        }
        .game-over h2 {
            color: #f43f5e;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .final-score {
            font-size: 24px;
            margin: 20px 0;
        }
        .play-again-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .play-again-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../index.html">← Back to Games</a>
        <h1>Empathy Builder</h1>
    </div>

    <div class="game-container">
        <div class="header">
            <h2>Build Your Empathy Skills</h2>
            <div class="stats">
                <span>Score: <strong id="score">0</strong></span>
                <span>Question: <strong id="question-num">1</strong>/10</span>
            </div>
        </div>

        <div class="level-info" id="level-info">Level 1: Basic Empathy</div>

        <div class="scenario" id="scenario">
            <h3>Empathy Scenario:</h3>
            <p id="scenario-text"></p>
        </div>

        <div class="options" id="options"></div>

        <div class="explanation" id="explanation">
            <h4>Explanation:</h4>
            <p id="explanation-text"></p>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>

        <div class="game-over" id="game-over">
            <h2>Game Complete!</h2>
            <p class="final-score">Your Final Score: <strong id="final-score">0</strong>/10</p>
            <p id="performance"></p>
            <button class="play-again-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const levels = [
            { name: "Level 1: Basic Empathy", questions: 3 },
            { name: "Level 2: Advanced Empathy", questions: 3 },
            { name: "Level 3: Empathy Mastery", questions: 4 }
        ];

        const questions = [
            // Level 1
            {
                scenario: "Your friend tells you they just failed an important exam they studied hard for.",
                options: [
                    "Don't worry, you'll pass next time.",
                    "I can see how disappointed you must feel. You worked so hard for this.",
                    "At least it's just one exam.",
                    "You should have studied more."
                ],
                correct: 1,
                explanation: "Empathetic responses acknowledge feelings and show understanding of the person's experience, rather than minimizing or blaming."
            },
            {
                scenario: "Your colleague mentions they're overwhelmed with their workload.",
                options: [
                    "We're all busy, you just need to manage your time better.",
                    "It sounds like you're feeling really stressed. What would help most right now?",
                    "You should talk to your manager about it.",
                    "I'm busier than you and I'm handling it."
                ],
                correct: 1,
                explanation: "This response validates their feelings and asks how to help, showing genuine care rather than comparison or unsolicited advice."
            },
            {
                scenario: "Your child comes home upset because a friend excluded them from a game.",
                options: [
                    "You'll make other friends.",
                    "That must have hurt a lot. Being left out is really painful.",
                    "Just ignore them.",
                    "Maybe you did something to upset them."
                ],
                correct: 1,
                explanation: "Children need their feelings validated. This response acknowledges the pain without minimizing, dismissing, or assigning blame."
            },
            // Level 2
            {
                scenario: "An employee shares that their parent is ill and they're struggling to balance work and caregiving.",
                options: [
                    "I'm sure they'll get better soon.",
                    "I can only imagine how difficult this must be. Caring for a sick parent while working is incredibly challenging. What support do you need from us?",
                    "You should take a leave of absence.",
                    "Other people have sick parents and they manage."
                ],
                correct: 1,
                explanation: "This validates the complexity of their situation, acknowledges the difficulty, and asks what they need - showing deep empathy and support."
            },
            {
                scenario: "A friend going through a divorce says they feel like a failure.",
                options: [
                    "You're not a failure - your ex is the problem.",
                    "I hear how much pain you're in. This is a loss, and it's okay to grieve. You're not failing - you're going through something incredibly hard.",
                    "Just move on, there are plenty of fish in the sea.",
                    "I told you not to marry them."
                ],
                correct: 1,
                explanation: "This response validates their pain, reframes their self-judgment, and normalizes their grief without trying to fix or minimize."
            },
            {
                scenario: "A team member admits they're struggling with a new technology and feels embarrassed.",
                options: [
                    "It's not that hard, just watch some tutorials.",
                    "Learning new technology can feel overwhelming, especially when everyone else seems to get it. What would make it feel more manageable?",
                    "You should have kept up with the latest tech.",
                    "Don't worry, no one notices."
                ],
                correct: 1,
                explanation: "This normalizes their experience, validates the difficulty, and asks how to help - turning embarrassment into a learning opportunity."
            },
            // Level 3
            {
                scenario: "A colleague from a different cultural background shares that they feel excluded in meetings.",
                options: [
                    "That's just how meetings are here.",
                    "I appreciate you telling me this. Feeling excluded must be really uncomfortable. Can you help me understand what would make you feel more included?",
                    "You should speak up more.",
                    "I don't think anyone is excluding you on purpose."
                ],
                correct: 1,
                explanation: "This shows cultural humility - thanking them for sharing, validating their experience, and asking them to educate you rather than assuming you understand."
            },
            {
                scenario: "A friend who recently became a parent says they feel guilty about returning to work.",
                options: [
                    "You need to provide for your family.",
                    "The guilt of leaving your child must be weighing heavily. Society puts so much pressure on new parents. What would help you feel more at peace with this?",
                    "All working parents feel that way, you'll get used to it.",
                    "At least you have a job."
                ],
                correct: 1,
                explanation: "This acknowledges the specific pain, contextualizes it (societal pressure), and asks what would help - showing deep understanding of their unique situation."
            },
            {
                scenario: "A team member shares they're going through a mental health challenge.",
                options: [
                    "Everyone gets stressed sometimes.",
                    "Thank you for trusting me with this. Mental health challenges take real courage to face. What would be most helpful from me right now?",
                    "Have you tried exercise and meditation?",
                    "You should see a therapist."
                ],
                correct: 1,
                explanation: "This validates their courage, expresses gratitude for their trust, and asks how to help - respecting their autonomy while showing support."
            },
            {
                scenario: "An employee mentions they're struggling with imposter syndrome in their new role.",
                options: [
                    "You were hired for a reason.",
                    "Feeling like you don't belong is actually really common, especially in new roles. What specific situations trigger those feelings most?",
                    "Just fake it until you make it.",
                    "You'll grow out of it."
                ],
                correct: 1,
                explanation: "This normalizes their experience, validates their feelings, and asks for specifics to provide targeted support - showing genuine understanding."
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('scenario-text').textContent = q.scenario;
            document.getElementById('question-num').textContent = currentQuestion + 1;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            updateLevelInfo();
        }

        function checkAnswer(index) {
            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) btn.classList.add('correct');
                if (i === index && i !== q.correct) btn.classList.add('incorrect');
            });

            if (index === q.correct) {
                score += 10;
                document.getElementById('score').textContent = score;
            }

            document.getElementById('explanation-text').textContent = q.explanation;
            document.getElementById('explanation').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showGameOver();
            } else {
                loadQuestion();
            }
        }

        function updateLevelInfo() {
            let levelIndex = 0;
            let questionsSoFar = 0;
            
            for (let i = 0; i < levels.length; i++) {
                questionsSoFar += levels[i].questions;
                if (currentQuestion < questionsSoFar) {
                    levelIndex = i;
                    break;
                }
            }
            
            document.getElementById('level-info').textContent = levels[levelIndex].name;
        }

        function showGameOver() {
            document.getElementById('scenario').style.display = 'none';
            document.getElementById('options').style.display = 'none';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('level-info').style.display = 'none';
            
            document.getElementById('final-score').textContent = score;
            
            let performance = '';
            if (score >= 90) performance = 'Outstanding! You have exceptional empathy skills!';
            else if (score >= 70) performance = 'Great job! You demonstrate strong empathy.';
            else if (score >= 50) performance = 'Good effort! Keep practicing to deepen your empathy.';
            else performance = 'Keep practicing! Empathy is a skill that grows with practice.';
            
            document.getElementById('performance').textContent = performance;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            
            document.getElementById('scenario').style.display = 'block';
            document.getElementById('options').style.display = 'flex';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-info').style.display = 'block';
            
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
