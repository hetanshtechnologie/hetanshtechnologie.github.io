<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assertiveness Skills Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .top-bar {
            background-color: #1e293b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .top-bar a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 16px;
        }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar h1 {
            margin-left: 20px;
            font-size: 24px;
            color: #f1f5f9;
        }
        .game-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            font-size: 18px;
        }
        .stats span { color: #94a3b8; }
        .stats strong { color: #38bdf8; }
        .level-info {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 16px;
        }
        .scenario {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #eab308;
        }
        .scenario h3 {
            color: #eab308;
            margin-bottom: 15px;
        }
        .scenario p {
            line-height: 1.6;
            font-size: 16px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #334155;
            border: 2px solid #475569;
            color: #e2e8f0;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: #eab308;
            transform: translateX(5px);
        }
        .option-btn.correct {
            background-color: #166534;
            border-color: #22c55e;
        }
        .option-btn.incorrect {
            background-color: #991b1b;
            border-color: #ef4444;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .explanation {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #f59e0b;
        }
        .explanation h4 {
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .next-btn {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #0f172a;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin: 20px auto;
            transition: transform 0.2s;
        }
        .next-btn:hover { transform: scale(1.05); }
        .game-over {
            text-align: center;
            display: none;
        }
        .game-over h2 {
            color: #eab308;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .final-score {
            font-size: 24px;
            margin: 20px 0;
        }
        .play-again-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .play-again-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../index.html">← Back to Games</a>
        <h1>Assertiveness Skills</h1>
    </div>

    <div class="game-container">
        <div class="header">
            <h2>Master Assertive Communication</h2>
            <div class="stats">
                <span>Score: <strong id="score">0</strong></span>
                <span>Question: <strong id="question-num">1</strong>/10</span>
            </div>
        </div>

        <div class="level-info" id="level-info">Level 1: Identifying Communication Styles</div>

        <div class="scenario" id="scenario">
            <h3>Communication Scenario:</h3>
            <p id="scenario-text"></p>
        </div>

        <div class="options" id="options"></div>

        <div class="explanation" id="explanation">
            <h4>Explanation:</h4>
            <p id="explanation-text"></p>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>

        <div class="game-over" id="game-over">
            <h2>Game Complete!</h2>
            <p class="final-score">Your Final Score: <strong id="final-score">0</strong>/10</p>
            <p id="performance"></p>
            <button class="play-again-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const levels = [
            { name: "Level 1: Identifying Communication Styles", questions: 3 },
            { name: "Level 2: Assertive Responses", questions: 3 },
            { name: "Level 3: Advanced Assertiveness", questions: 4 }
        ];

        const questions = [
            // Level 1
            {
                scenario: "Your colleague takes credit for your idea in a meeting. Which response is PASSIVE?",
                options: [
                    "I notice you presented my idea as yours. I'd like us to acknowledge contributions accurately.",
                    "That's my idea and you stole it! You always do this!",
                    "It doesn't matter who came up with it, as long as it helps the team.",
                    "I'm disappointed but I'll just let it go this time."
                ],
                correct: 3,
                explanation: "Passive responses avoid confrontation and suppress your own needs. This response minimizes your feelings and avoids addressing the issue."
            },
            {
                scenario: "Someone cuts in front of you in line. Which response is AGGRESSIVE?",
                options: [
                    "Excuse me, I was here first.",
                    "Hey! What's wrong with you? Can't you see I'm waiting?",
                    "I was waiting here. Could you please go to the back of the line?",
                    "I guess it doesn't matter..."
                ],
                correct: 1,
                explanation: "Aggressive responses attack the other person with insults or threats. This response attacks their character rather than addressing the behavior."
            },
            {
                scenario: "Your friend cancels plans at the last minute for the third time. Which response is ASSERTIVE?",
                options: [
                    "Whatever, it's fine.",
                    "You always do this! I'm done with you!",
                    "I feel disappointed when plans are canceled last minute. Can we discuss how to avoid this?",
                    "I understand, things come up."
                ],
                correct: 2,
                explanation: "Assertive responses express feelings clearly while respecting others. This uses 'I' statements, describes the impact, and seeks a solution."
            },
            // Level 2
            {
                scenario: "Your boss assigns you extra work when you're already at capacity. Which is the best assertive response?",
                options: [
                    "No, I'm too busy.",
                    "Fine, I'll do it, but I'm not happy about it.",
                    "I can take this on, but I'll need to deprioritize Project X. Which would you prefer I focus on?",
                    "You always give me too much work. This isn't fair."
                ],
                correct: 2,
                explanation: "This response is honest about capacity, offers a solution, and gives the boss information to make a decision. It's respectful while setting boundaries."
            },
            {
                scenario: "A friend asks to borrow money you can't afford to lend. Which is assertive?",
                options: [
                    "Sure, no problem!",
                    "Are you kidding me? You never pay people back!",
                    "I'm not able to lend money right now, but I can help you explore other options.",
                    "I'll think about it" (and then avoid them)
                ],
                correct: 2,
                explanation: "This response is direct and honest, maintains the relationship, and offers alternative help. It respects both your boundaries and their needs."
            },
            {
                scenario: "Your partner makes a comment about your appearance that bothers you. Which is assertive?",
                options: [
                    "You're so mean! I can't believe you said that!",
                    "It's fine, I don't care.",
                    "When you comment on my appearance that way, it makes me feel self-conscious. I'd appreciate it if you didn't.",
                    "You always criticize me. You're never happy."
                ],
                correct: 2,
                explanation: "This uses the SBI model: describes the situation, the specific behavior, and the impact. It's direct without being attacking."
            },
            // Level 3
            {
                scenario: "A colleague frequently interrupts you in meetings. What's the most effective assertive approach?",
                options: [
                    "Stop interrupting me!",
                    "I'll just speak quieter so I don't have to deal with it.",
                    "I'd like to finish my thought. When I'm done, I'd love to hear your perspective.",
                    "You always do this. It's so disrespectful."
                ],
                correct: 2,
                explanation: "This response sets a boundary, acknowledges their perspective, and creates a collaborative solution. It's respectful while being clear."
            },
            {
                scenario: "Your team member misses a deadline affecting your work. How do you assertively address this?",
                options: [
                    "You're unreliable and I can't count on you.",
                    "It's okay, I'll just work extra hours to cover for you.",
                    "When the deadline was missed, it impacted my ability to start my part. Can we discuss how to prevent this in the future?",
                    "I'm not saying anything, but I'm really angry."
                ],
                correct: 2,
                explanation: "This focuses on the impact rather than attacking the person, and seeks a solution. It's constructive and maintains the working relationship."
            },
            {
                scenario: "You disagree with a team decision. How do you assertively express your view?",
                options: [
                    "That's a terrible idea and it will fail.",
                    "I guess I'll just go along with it even though I disagree.",
                    "I see the reasoning behind this approach, but I have some concerns about [specific issue]. Could we consider [alternative]?",
                    "Fine, but when it fails, don't come to me."
                ],
                correct: 2,
                explanation: "This acknowledges the existing perspective, raises specific concerns, and offers an alternative. It's respectful while being honest."
            },
            {
                scenario: "You need to decline a request from someone you respect. What's assertive?",
                options: [
                    "I don't want to do that.",
                    "I'd love to, but I'm swamped" (making excuses)",
                    "I appreciate you thinking of me, but I'm not able to commit to that right now.",
                    "Let me check my schedule" (then avoid responding)
                ],
                correct: 2,
                explanation: "This response is direct, respectful, and honest without making excuses. It maintains the relationship while being clear about your boundaries."
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('scenario-text').textContent = q.scenario;
            document.getElementById('question-num').textContent = currentQuestion + 1;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            updateLevelInfo();
        }

        function checkAnswer(index) {
            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) btn.classList.add('correct');
                if (i === index && i !== q.correct) btn.classList.add('incorrect');
            });

            if (index === q.correct) {
                score += 10;
                document.getElementById('score').textContent = score;
            }

            document.getElementById('explanation-text').textContent = q.explanation;
            document.getElementById('explanation').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showGameOver();
            } else {
                loadQuestion();
            }
        }

        function updateLevelInfo() {
            let levelIndex = 0;
            let questionsSoFar = 0;
            
            for (let i = 0; i < levels.length; i++) {
                questionsSoFar += levels[i].questions;
                if (currentQuestion < questionsSoFar) {
                    levelIndex = i;
                    break;
                }
            }
            
            document.getElementById('level-info').textContent = levels[levelIndex].name;
        }

        function showGameOver() {
            document.getElementById('scenario').style.display = 'none';
            document.getElementById('options').style.display = 'none';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('level-info').style.display = 'none';
            
            document.getElementById('final-score').textContent = score;
            
            let performance = '';
            if (score >= 90) performance = 'Outstanding! You are an assertiveness expert!';
            else if (score >= 70) performance = 'Great job! You have strong assertiveness skills.';
            else if (score >= 50) performance = 'Good effort! Keep practicing to improve.';
            else performance = 'Keep practicing! Assertiveness takes time to master.';
            
            document.getElementById('performance').textContent = performance;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            
            document.getElementById('scenario').style.display = 'block';
            document.getElementById('options').style.display = 'flex';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-info').style.display = 'block';
            
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
