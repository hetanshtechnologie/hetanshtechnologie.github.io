<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarity Check Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .top-bar {
            background-color: #1e293b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .top-bar a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 16px;
        }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar h1 {
            margin-left: 20px;
            font-size: 24px;
            color: #f1f5f9;
        }
        .game-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            font-size: 18px;
        }
        .stats span { color: #94a3b8; }
        .stats strong { color: #38bdf8; }
        .level-info {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 16px;
        }
        .unclear-sentence {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #10b981;
        }
        .unclear-sentence h3 {
            color: #10b981;
            margin-bottom: 15px;
        }
        .unclear-sentence p {
            line-height: 1.6;
            font-size: 18px;
            font-style: italic;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #334155;
            border: 2px solid #475569;
            color: #e2e8f0;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: #10b981;
            transform: translateX(5px);
        }
        .option-btn.correct {
            background-color: #166534;
            border-color: #22c55e;
        }
        .option-btn.incorrect {
            background-color: #991b1b;
            border-color: #ef4444;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .explanation {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #f59e0b;
        }
        .explanation h4 {
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .next-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin: 20px auto;
            transition: transform 0.2s;
        }
        .next-btn:hover { transform: scale(1.05); }
        .game-over {
            text-align: center;
            display: none;
        }
        .game-over h2 {
            color: #10b981;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .final-score {
            font-size: 24px;
            margin: 20px 0;
        }
        .play-again-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .play-again-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../index.html">← Back to Games</a>
        <h1>Clarity Check</h1>
    </div>

    <div class="game-container">
        <div class="header">
            <h2>Master Clear Communication</h2>
            <div class="stats">
                <span>Score: <strong id="score">0</strong></span>
                <span>Question: <strong id="question-num">1</strong>/10</span>
            </div>
        </div>

        <div class="level-info" id="level-info">Level 1: Basic Clarity</div>

        <div class="unclear-sentence" id="unclear-sentence">
            <h3>Rewrite This Unclear Sentence:</h3>
            <p id="sentence-text"></p>
        </div>

        <div class="options" id="options"></div>

        <div class="explanation" id="explanation">
            <h4>Explanation:</h4>
            <p id="explanation-text"></p>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>

        <div class="game-over" id="game-over">
            <h2>Game Complete!</h2>
            <p class="final-score">Your Final Score: <strong id="final-score">0</strong>/10</p>
            <p id="performance"></p>
            <button class="play-again-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const levels = [
            { name: "Level 1: Basic Clarity", questions: 3 },
            { name: "Level 2: Professional Clarity", questions: 3 },
            { name: "Level 3: Advanced Clarity", questions: 4 }
        ];

        const questions = [
            // Level 1
            {
                sentence: "We need to basically utilize our synergies to leverage our core competencies in order to drive forward with the initiative.",
                options: [
                    "We should use our strengths to move the project forward.",
                    "Basically, we need to synergize our competencies forward.",
                    "Our synergies need to be leveraged for initiative driving.",
                    "We must utilize core competencies for synergy leverage."
                ],
                correct: 0,
                explanation: "Clear communication avoids jargon and buzzwords. 'Use our strengths' is direct and understandable, while the original is filled with corporate-speak."
            },
            {
                sentence: "At this point in time, we are currently in the process of considering the possibility of potentially implementing the new system.",
                options: [
                    "We are thinking about implementing the new system.",
                    "We are in the process of considering the possibility.",
                    "The implementation consideration is currently ongoing.",
                    "We might potentially be considering the new system."
                ],
                correct: 0,
                explanation: "Redundant phrases like 'at this point in time' and 'currently in the process of' add no value. Remove them for clearer communication."
            },
            {
                sentence: "It is absolutely imperative that all employees must ensure they are compliant with the new policy.",
                options: [
                    "All employees must follow the new policy.",
                    "It is imperative that employees ensure compliance.",
                    "All employees must ensure policy compliance.",
                    "Employees are required to be compliant with the policy."
                ],
                correct: 0,
                explanation: "Redundant words like 'absolutely imperative' and 'must ensure' create wordiness. Simple, direct language is clearer."
            },
            // Level 2
            {
                sentence: "The reason why we are late is because the traffic was bad and also we couldn't find parking.",
                options: [
                    "We are late because of traffic and parking issues.",
                    "The reason for our lateness is due to traffic and parking.",
                    "We were delayed by traffic and couldn't find parking.",
                    "Traffic and parking problems made us late."
                ],
                correct: 2,
                explanation: "This version is active, specific, and avoids the redundant 'the reason why... is because' construction."
            },
            {
                sentence: "Please be advised that the meeting has been rescheduled to a different time.",
                options: [
                    "The meeting has been rescheduled.",
                    "Please be advised of the meeting time change.",
                    "The meeting time has been changed to a different time.",
                    "Notice: The meeting has been moved to another time."
                ],
                correct: 0,
                explanation: " 'Please be advised' is unnecessary formality. Just state the fact directly."
            },
            {
                sentence: "I wanted to reach out to touch base with you regarding the project update.",
                options: [
                    "I'm contacting you about the project update.",
                    "I wanted to reach out to you for a touch base.",
                    "This is regarding a project update touch base.",
                    "I am reaching out to touch base regarding the update."
                ],
                correct: 0,
                explanation: " 'Reach out to touch base' is redundant corporate jargon. Simple language is more professional."
            },
            // Level 3
            {
                sentence: "Due to the fact that the weather was inclement, we were forced to make the decision to postpone the event.",
                options: [
                    "We postponed the event due to bad weather.",
                    "The inclement weather forced us to make the decision to postpone.",
                    "Due to the inclement weather, we were forced to postpone.",
                    "Bad weather caused us to decide to postpone the event."
                ],
                correct: 0,
                explanation: "This removes unnecessary complexity ('due to the fact that', 'forced to make the decision') and states the cause-effect clearly."
            },
            {
                sentence: "It is not uncommon for people to experience feelings of anxiety when they are faced with public speaking situations.",
                options: [
                    "Many people feel anxious about public speaking.",
                    "People often experience anxiety when faced with public speaking.",
                    "It is common for people to feel anxious about public speaking.",
                    "Public speaking often causes feelings of anxiety in people."
                ],
                correct: 0,
                explanation: "Double negatives ('not uncommon') are confusing. Positive statements are clearer and more direct."
            },
            {
                sentence: "The implementation of the new software system is slated to commence at the beginning of next month.",
                options: [
                    "The new software will start next month.",
                    "The implementation of the new software is scheduled to begin next month.",
                    "We will begin using the new software next month.",
                    "The new software system implementation will commence next month."
                ],
                correct: 0,
                explanation: "Simple, direct language ('will start') is clearer than formal jargon ('slated to commence')."
            },
            {
                sentence: "I am writing to inform you that your application has been received and is currently under review.",
                options: [
                    "We received your application and are reviewing it.",
                    "Your application has been received and is under review.",
                    "This is to inform you that your application is being reviewed.",
                    "I am writing to inform you of your application status."
                ],
                correct: 0,
                explanation: "Active voice ('We received') is clearer than passive voice. Remove unnecessary formal phrases like 'I am writing to inform you'."
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('sentence-text').textContent = q.sentence;
            document.getElementById('question-num').textContent = currentQuestion + 1;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            updateLevelInfo();
        }

        function checkAnswer(index) {
            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) btn.classList.add('correct');
                if (i === index && i !== q.correct) btn.classList.add('incorrect');
            });

            if (index === q.correct) {
                score += 10;
                document.getElementById('score').textContent = score;
            }

            document.getElementById('explanation-text').textContent = q.explanation;
            document.getElementById('explanation').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showGameOver();
            } else {
                loadQuestion();
            }
        }

        function updateLevelInfo() {
            let levelIndex = 0;
            let questionsSoFar = 0;
            
            for (let i = 0; i < levels.length; i++) {
                questionsSoFar += levels[i].questions;
                if (currentQuestion < questionsSoFar) {
                    levelIndex = i;
                    break;
                }
            }
            
            document.getElementById('level-info').textContent = levels[levelIndex].name;
        }

        function showGameOver() {
            document.getElementById('unclear-sentence').style.display = 'none';
            document.getElementById('options').style.display = 'none';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('level-info').style.display = 'none';
            
            document.getElementById('final-score').textContent = score;
            
            let performance = '';
            if (score >= 90) performance = 'Outstanding! You are a clarity expert!';
            else if (score >= 70) performance = 'Great job! You have strong clarity skills.';
            else if (score >= 50) performance = 'Good effort! Keep practicing to improve.';
            else performance = 'Keep practicing! Clear communication takes time to master.';
            
            document.getElementById('performance').textContent = performance;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            
            document.getElementById('unclear-sentence').style.display = 'block';
            document.getElementById('options').style.display = 'flex';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-info').style.display = 'block';
            
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
