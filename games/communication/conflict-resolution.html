<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conflict Resolution Skills Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .top-bar {
            background-color: #1e293b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .top-bar a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 16px;
        }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar h1 {
            margin-left: 20px;
            font-size: 24px;
            color: #f1f5f9;
        }
        .game-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            font-size: 18px;
        }
        .stats span { color: #94a3b8; }
        .stats strong { color: #38bdf8; }
        .level-info {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 16px;
        }
        .scenario {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #f59e0b;
        }
        .scenario h3 {
            color: #f59e0b;
            margin-bottom: 15px;
        }
        .scenario p {
            line-height: 1.6;
            font-size: 16px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #334155;
            border: 2px solid #475569;
            color: #e2e8f0;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: #f59e0b;
            transform: translateX(5px);
        }
        .option-btn.correct {
            background-color: #166534;
            border-color: #22c55e;
        }
        .option-btn.incorrect {
            background-color: #991b1b;
            border-color: #ef4444;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .explanation {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #38bdf8;
        }
        .explanation h4 {
            color: #38bdf8;
            margin-bottom: 10px;
        }
        .next-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0f172a;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin: 20px auto;
            transition: transform 0.2s;
        }
        .next-btn:hover { transform: scale(1.05); }
        .game-over {
            text-align: center;
            display: none;
        }
        .game-over h2 {
            color: #f59e0b;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .final-score {
            font-size: 24px;
            margin: 20px 0;
        }
        .play-again-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .play-again-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../index.html">← Back to Games</a>
        <h1>Conflict Resolution Skills</h1>
    </div>

    <div class="game-container">
        <div class="header">
            <h2>Master the Art of Conflict Resolution</h2>
            <div class="stats">
                <span>Score: <strong id="score">0</strong></span>
                <span>Question: <strong id="question-num">1</strong>/10</span>
            </div>
        </div>

        <div class="level-info" id="level-info">Level 1: Basic Conflict Resolution</div>

        <div class="scenario" id="scenario">
            <h3>Conflict Scenario:</h3>
            <p id="scenario-text"></p>
        </div>

        <div class="options" id="options"></div>

        <div class="explanation" id="explanation">
            <h4>Explanation:</h4>
            <p id="explanation-text"></p>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>

        <div class="game-over" id="game-over">
            <h2>Game Complete!</h2>
            <p class="final-score">Your Final Score: <strong id="final-score">0</strong>/10</p>
            <p id="performance"></p>
            <button class="play-again-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const levels = [
            { name: "Level 1: Basic Conflict Resolution", questions: 3 },
            { name: "Level 2: Workplace Conflicts", questions: 3 },
            { name: "Level 3: Complex Conflicts", questions: 4 }
        ];

        const questions = [
            // Level 1
            {
                scenario: "Your roommate consistently leaves dirty dishes in the sink for days, and it's starting to bother you. You want to address this without creating tension.",
                options: [
                    "Leave a passive-aggressive note on the dishes",
                    "Wait until you're angry and then yell at them",
                    "Have a calm conversation: 'Hey, I've noticed the dishes pile up. Can we agree on a cleaning schedule that works for both of us?'",
                    "Just clean them yourself and resent them silently"
                ],
                correct: 2,
                explanation: "This response addresses the issue directly but calmly, uses 'I' statements, and proposes a collaborative solution. It avoids blame while seeking mutual agreement."
            },
            {
                scenario: "Two team members are arguing about the best approach to a project. One wants to use new technology, while the other prefers the tried-and-true method.",
                options: [
                    "Tell them to figure it out themselves",
                    "Pick the approach you personally prefer and mandate it",
                    "Facilitate a discussion where both present pros/cons, and guide them to evaluate based on project goals",
                    "Split the project so each uses their preferred approach"
                ],
                correct: 2,
                explanation: "This approach is collaborative and interest-based. It focuses on the project's goals rather than personal preferences, and helps both parties find common ground through structured discussion."
            },
            {
                scenario: "Your neighbor plays loud music late at night. You've asked them twice to turn it down, but they continue. Now it's 11 PM and the music is loud again.",
                options: [
                    "Call the police immediately",
                    "Play your music even louder to make a point",
                    "Go over calmly and say: 'I know you enjoy your music, but I have to work early. Could we agree on quiet hours after 10 PM?'",
                    "Leave another angry note on their door"
                ],
                correct: 2,
                explanation: "This response acknowledges their perspective, states your needs clearly, and proposes a specific, reasonable solution. It maintains the relationship while addressing the issue."
            },
            // Level 2
            {
                scenario: "A colleague took credit for your idea in a meeting. Now you're both assigned to work together on implementing it.",
                options: [
                    "Confront them publicly in the next meeting",
                    "Do the work but sabotage it so it fails",
                    "Request a private meeting and say: 'I noticed you presented my idea as yours. I'd like us to acknowledge contributions accurately moving forward. How can we handle this?'",
                    "Report them to HR immediately without talking to them"
                ],
                correct: 2,
                explanation: "This addresses the issue privately and directly, focuses on future behavior rather than past actions, and seeks to establish clear expectations for collaboration."
            },
            {
                scenario: "Your boss gave you a performance review that you feel is unfair. They criticized work you did under tight deadlines they set.",
                options: [
                    "Start looking for a new job immediately",
                    "Complain about your boss to other colleagues",
                    "Request a follow-up meeting to discuss specific examples and clarify expectations: 'I'd like to understand your perspective better so I can meet expectations moving forward.'",
                    "Write a defensive email copying senior management"
                ],
                correct: 2,
                explanation: "This approach seeks understanding rather than confrontation, focuses on future improvement, and opens dialogue. It's professional and solution-oriented."
            },
            {
                scenario: "A client is upset about project delays and threatens to cancel the contract. The delays were partly due to their own late approvals.",
                options: [
                    "Blame the client and tell them it's their fault",
                    "Offer a discount to make them stay",
                    "Acknowledge the impact: 'I understand your frustration with the timeline. Let's review what happened together and create a realistic plan forward with clear milestones for both sides.'",
                    "Tell them you'll do better next time without addressing current issues"
                ],
                correct: 2,
                explanation: "This response validates their feelings, takes shared responsibility, and creates a collaborative plan. It addresses the root cause without assigning blame."
            },
            // Level 3
            {
                scenario: "Two department heads are in a turf war over budget allocation. Both claim their department is more critical to company success. Tension is affecting team morale.",
                options: [
                    "Let them fight it out and whoever yells louder gets the budget",
                    "Split the budget equally so both are equally unhappy",
                    "Facilitate a strategic session focused on company goals, have each present how their budget supports those goals, and work with leadership to establish clear ROI criteria",
                    "Take the decision away from both and make it yourself"
                ],
                correct: 2,
                explanation: "This shifts the focus from personal/departmental interests to organizational goals, creates transparency, and establishes objective criteria. It's a systems-level approach to conflict."
            },
            {
                scenario: "Your business partner wants to take the company in a completely different direction than what you originally agreed upon. They've already started making changes without consulting you.",
                options: [
                    "Miror their behavior and start making your own changes without consulting them",
                    "Issue an ultimatum: 'It's my way or we dissolve the partnership'",
                    "Call an emergency meeting to address the breach of trust, then negotiate a process for making major decisions together going forward",
                    "Lawyer up and prepare for a legal battle"
                ],
                correct: 2,
                explanation: "This addresses both the immediate issue (lack of consultation) and the systemic problem (decision-making process). It protects the relationship while establishing boundaries."
            },
            {
                scenario: "A long-term employee has been resistant to company changes and is influencing others to resist as well. Direct conversations haven't worked.",
                options: [
                    "Fire them immediately for insubordination",
                    "Ignore the situation and hope it resolves itself",
                    "Understand their concerns through deeper listening, involve them as a change champion, and if needed, create a performance improvement plan with clear expectations",
                    "Isolate them from the team by reassigning their projects"
                ],
                correct: 2,
                explanation: "This approach seeks to understand root causes, potentially transforms a critic into an advocate, and has a structured fallback plan. It balances empathy with accountability."
            },
            {
                scenario: "During a family gathering, a relative makes politically offensive comments that upset several people. The family is split on how to handle it.",
                options: [
                    "Kick them out of the gathering",
                    "Pretend nothing happened to keep the peace",
                    "Privately address it: 'I value our relationship, but those comments hurt people here. Can we agree to avoid political topics today?' If they continue, calmly set a boundary and remove yourself from the conversation.",
                    "Argue with them publicly to prove them wrong"
                ],
                correct: 2,
                explanation: "This maintains the relationship while setting clear boundaries. It's private, respectful, and has a backup plan if the person doesn't respect the boundary."
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('scenario-text').textContent = q.scenario;
            document.getElementById('question-num').textContent = currentQuestion + 1;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            updateLevelInfo();
        }

        function checkAnswer(index) {
            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) btn.classList.add('correct');
                if (i === index && i !== q.correct) btn.classList.add('incorrect');
            });

            if (index === q.correct) {
                score += 10;
                document.getElementById('score').textContent = score;
            }

            document.getElementById('explanation-text').textContent = q.explanation;
            document.getElementById('explanation').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showGameOver();
            } else {
                loadQuestion();
            }
        }

        function updateLevelInfo() {
            let levelIndex = 0;
            let questionsSoFar = 0;
            
            for (let i = 0; i < levels.length; i++) {
                questionsSoFar += levels[i].questions;
                if (currentQuestion < questionsSoFar) {
                    levelIndex = i;
                    break;
                }
            }
            
            document.getElementById('level-info').textContent = levels[levelIndex].name;
        }

        function showGameOver() {
            document.getElementById('scenario').style.display = 'none';
            document.getElementById('options').style.display = 'none';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('level-info').style.display = 'none';
            
            document.getElementById('final-score').textContent = score;
            
            let performance = '';
            if (score >= 90) performance = 'Outstanding! You are a conflict resolution expert!';
            else if (score >= 70) performance = 'Great job! You have strong conflict resolution skills.';
            else if (score >= 50) performance = 'Good effort! Keep practicing to improve.';
            else performance = 'Keep practicing! Conflict resolution takes time to master.';
            
            document.getElementById('performance').textContent = performance;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            
            document.getElementById('scenario').style.display = 'block';
            document.getElementById('options').style.display = 'flex';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-info').style.display = 'block';
            
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
