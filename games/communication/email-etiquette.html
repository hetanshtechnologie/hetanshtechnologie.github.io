<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Etiquette Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .top-bar {
            background-color: #1e293b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .top-bar a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 16px;
        }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar h1 {
            margin-left: 20px;
            font-size: 24px;
            color: #f1f5f9;
        }
        .game-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            font-size: 18px;
        }
        .stats span { color: #94a3b8; }
        .stats strong { color: #38bdf8; }
        .level-info {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 16px;
        }
        .scenario {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #a855f7;
        }
        .scenario h3 {
            color: #a855f7;
            margin-bottom: 15px;
        }
        .scenario p {
            line-height: 1.6;
            font-size: 16px;
        }
        .email-preview {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid #475569;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #334155;
            border: 2px solid #475569;
            color: #e2e8f0;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: #a855f7;
            transform: translateX(5px);
        }
        .option-btn.correct {
            background-color: #166534;
            border-color: #22c55e;
        }
        .option-btn.incorrect {
            background-color: #991b1b;
            border-color: #ef4444;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .explanation {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #f59e0b;
        }
        .explanation h4 {
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .next-btn {
            background: linear-gradient(135deg, #a855f7, #9333ea);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin: 20px auto;
            transition: transform 0.2s;
        }
        .next-btn:hover { transform: scale(1.05); }
        .game-over {
            text-align: center;
            display: none;
        }
        .game-over h2 {
            color: #a855f7;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .final-score {
            font-size: 24px;
            margin: 20px 0;
        }
        .play-again-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .play-again-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../index.html">← Back to Games</a>
        <h1>Email Etiquette</h1>
    </div>

    <div class="game-container">
        <div class="header">
            <h2>Master Professional Email Communication</h2>
            <div class="stats">
                <span>Score: <strong id="score">0</strong></span>
                <span>Question: <strong id="question-num">1</strong>/10</span>
            </div>
        </div>

        <div class="level-info" id="level-info">Level 1: Basic Email Etiquette</div>

        <div class="scenario" id="scenario">
            <h3>Email Scenario:</h3>
            <p id="scenario-text"></p>
        </div>

        <div class="options" id="options"></div>

        <div class="explanation" id="explanation">
            <h4>Explanation:</h4>
            <p id="explanation-text"></p>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>

        <div class="game-over" id="game-over">
            <h2>Game Complete!</h2>
            <p class="final-score">Your Final Score: <strong id="final-score">0</strong>/10</p>
            <p id="performance"></p>
            <button class="play-again-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const levels = [
            { name: "Level 1: Basic Email Etiquette", questions: 3 },
            { name: "Level 2: Professional Communication", questions: 3 },
            { name: "Level 3: Advanced Email Skills", questions: 4 }
        ];

        const questions = [
            // Level 1
            {
                scenario: "You receive an email from a colleague with a question about a project deadline. What's the best subject line for your reply?",
                options: [
                    "Re: Re: Re: Question",
                    "RE: Project Deadline Question",
                    "Answer to your question",
                    "About the deadline"
                ],
                correct: 1,
                explanation: "Keep the original subject line with 'RE:' prefix. This maintains email threading, makes it easy to find, and follows professional conventions."
            },
            {
                scenario: "You need to email your team about a meeting change. What's the most professional approach?",
                options: [
                    "Quick heads up - meeting moved to 3pm",
                    "URGENT: Meeting time change!!!",
                    "Meeting Time Update: Changed from 2pm to 3pm today",
                    "fyi meeting is at 3 now"
                ],
                correct: 2,
                explanation: "Clear, specific subject lines with proper capitalization and punctuation show professionalism and help recipients prioritize and find information."
            },
            {
                scenario: "You're writing to a client you've never met before. How should you start the email?",
                options: [
                    "Hey there!",
                    "Dear [Name], I hope this email finds you well.",
                    "To whom it may concern",
                    "Hi,"
                ],
                correct: 1,
                explanation: "For new professional contacts, use a formal greeting with their name. It shows respect and professionalism while being warm and personal."
            },
            // Level 2
            {
                scenario: "A client sends an angry email about a service issue. What's the best response approach?",
                options: [
                    "Ignore the email until you calm down",
                    "Respond immediately to show you care",
                    "Acknowledge their frustration, apologize, and outline specific next steps",
                    "Forward the email to your manager to handle"
                ],
                correct: 2,
                explanation: "Acknowledging emotions, taking responsibility, and providing concrete solutions shows professionalism and helps de-escalate the situation."
            },
            {
                scenario: "You need to send a sensitive announcement to your department. What's the best approach?",
                options: [
                    "Send it late Friday afternoon so people don't worry over the weekend",
                    "Send it Monday morning so people have the week to process",
                    "Send it during work hours with clear, factual information and offer to discuss concerns",
                    "Just mention it in the next team meeting without an email"
                ],
                correct: 2,
                explanation: "Sensitive information should be communicated during work hours when support is available, with clear facts and an opportunity for questions."
            },
            {
                scenario: "You accidentally hit 'Reply All' to an email that should have gone to one person. What's the best response?",
                options: [
                    "Send another Reply All correcting yourself",
                    "Do nothing and hope no one notices",
                    "Send a brief, professional correction to the group",
                    "Call everyone to explain the mistake"
                ],
                correct: 2,
                explanation: "A brief, professional acknowledgment of the mistake shows accountability and maintains trust. Over-apologizing draws more attention to the error."
            },
            // Level 3
            {
                scenario: "You're sending a proposal to a potential partner. What structure works best?",
                options: [
                    "Long paragraphs explaining everything in detail",
                    "Bullet points with clear sections: Introduction, Proposal, Benefits, Next Steps",
                    "Just attach the proposal document without explanation",
                    "Write everything in the subject line to save time"
                ],
                correct: 1,
                explanation: "Professional proposals should be scannable with clear sections. Busy executives appreciate structured content that's easy to review quickly."
            },
            {
                scenario: "You need to follow up with someone who hasn't responded to your email. What's the best approach?",
                options: [
                    "Send the same email again every day until they respond",
                    "Send a polite follow-up asking if they received your previous email and if they need any additional information",
                    "Call them immediately to ask why they haven't responded",
                    "Post about it on social media to get their attention"
                ],
                correct: 1,
                explanation: "Polite follow-ups that offer assistance show professionalism. They acknowledge the person might be busy while gently reminding them of your request."
            },
            {
                scenario: "You're sending an email with multiple attachments. What's the best practice?",
                options: [
                    "Attach all files without explanation",
                    "Reference each attachment in the email body and explain their relevance",
                    "Just write 'see attachments' at the end",
                    "Send each attachment in a separate email"
                ],
                correct: 1,
                explanation: "Referencing attachments with context helps recipients understand what to review first and why each document matters."
            },
            {
                scenario: "You need to decline a meeting invitation politely. What's the best response?",
                options: [
                    "Just decline without explanation",
                    "Explain why you can't attend and suggest alternative ways to contribute",
                    "Ignore the invitation",
                    "Accept but don't attend"
                ],
                correct: 1,
                explanation: "Declining politely with alternatives shows respect for the organizer's time while offering to contribute in other ways maintains the relationship."
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('scenario-text').textContent = q.scenario;
            document.getElementById('question-num').textContent = currentQuestion + 1;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            updateLevelInfo();
        }

        function checkAnswer(index) {
            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) btn.classList.add('correct');
                if (i === index && i !== q.correct) btn.classList.add('incorrect');
            });

            if (index === q.correct) {
                score += 10;
                document.getElementById('score').textContent = score;
            }

            document.getElementById('explanation-text').textContent = q.explanation;
            document.getElementById('explanation').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showGameOver();
            } else {
                loadQuestion();
            }
        }

        function updateLevelInfo() {
            let levelIndex = 0;
            let questionsSoFar = 0;
            
            for (let i = 0; i < levels.length; i++) {
                questionsSoFar += levels[i].questions;
                if (currentQuestion < questionsSoFar) {
                    levelIndex = i;
                    break;
                }
            }
            
            document.getElementById('level-info').textContent = levels[levelIndex].name;
        }

        function showGameOver() {
            document.getElementById('scenario').style.display = 'none';
            document.getElementById('options').style.display = 'none';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('level-info').style.display = 'none';
            
            document.getElementById('final-score').textContent = score;
            
            let performance = '';
            if (score >= 90) performance = 'Outstanding! You are an email etiquette expert!';
            else if (score >= 70) performance = 'Great job! You have strong email communication skills.';
            else if (score >= 50) performance = 'Good effort! Keep practicing to improve.';
            else performance = 'Keep practicing! Email etiquette takes time to master.';
            
            document.getElementById('performance').textContent = performance;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            
            document.getElementById('scenario').style.display = 'block';
            document.getElementById('options').style.display = 'flex';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-info').style.display = 'block';
            
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
