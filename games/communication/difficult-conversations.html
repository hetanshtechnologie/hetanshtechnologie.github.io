<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Difficult Conversations Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .top-bar {
            background-color: #1e293b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .top-bar a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 16px;
        }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar h1 {
            margin-left: 20px;
            font-size: 24px;
            color: #f1f5f9;
        }
        .game-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            font-size: 18px;
        }
        .stats span { color: #94a3b8; }
        .stats strong { color: #38bdf8; }
        .level-info {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 16px;
        }
        .scenario {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #ef4444;
        }
        .scenario h3 {
            color: #ef4444;
            margin-bottom: 15px;
        }
        .scenario p {
            line-height: 1.6;
            font-size: 16px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #334155;
            border: 2px solid #475569;
            color: #e2e8f0;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: #ef4444;
            transform: translateX(5px);
        }
        .option-btn.correct {
            background-color: #166534;
            border-color: #22c55e;
        }
        .option-btn.incorrect {
            background-color: #991b1b;
            border-color: #ef4444;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .explanation {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #f59e0b;
        }
        .explanation h4 {
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .next-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin: 20px auto;
            transition: transform 0.2s;
        }
        .next-btn:hover { transform: scale(1.05); }
        .game-over {
            text-align: center;
            display: none;
        }
        .game-over h2 {
            color: #ef4444;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .final-score {
            font-size: 24px;
            margin: 20px 0;
        }
        .play-again-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .play-again-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../index.html">← Back to Games</a>
        <h1>Difficult Conversations</h1>
    </div>

    <div class="game-container">
        <div class="header">
            <h2>Master Difficult Conversations</h2>
            <div class="stats">
                <span>Score: <strong id="score">0</strong></span>
                <span>Question: <strong id="question-num">1</strong>/10</span>
            </div>
        </div>

        <div class="level-info" id="level-info">Level 1: Basic Difficult Conversations</div>

        <div class="scenario" id="scenario">
            <h3>Difficult Conversation Scenario:</h3>
            <p id="scenario-text"></p>
        </div>

        <div class="options" id="options"></div>

        <div class="explanation" id="explanation">
            <h4>Explanation:</h4>
            <p id="explanation-text"></p>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>

        <div class="game-over" id="game-over">
            <h2>Game Complete!</h2>
            <p class="final-score">Your Final Score: <strong id="final-score">0</strong>/10</p>
            <p id="performance"></p>
            <button class="play-again-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const levels = [
            { name: "Level 1: Basic Difficult Conversations", questions: 3 },
            { name: "Level 2: Advanced Difficult Conversations", questions: 3 },
            { name: "Level 3: Complex Scenarios", questions: 4 }
        ];

        const questions = [
            // Level 1
            {
                scenario: "An employee repeatedly misses deadlines, affecting the team. How do you start the conversation?",
                options: [
                    "You're always late with your work and it's causing problems.",
                    "I've noticed some deadline challenges recently. Can we talk about what's happening and how I can support you?",
                    "If you don't start meeting deadlines, there will be consequences.",
                    "Everyone else manages to meet deadlines, what's your problem?"
                ],
                correct: 1,
                explanation: "Starting with observation rather than accusation, showing concern, and offering support creates a constructive conversation."
            },
            {
                scenario: "A colleague made a mistake that affected your project. How do you address it?",
                options: [
                    "Your mistake ruined everything!",
                    "I want to understand what happened with the project. Can we discuss how to prevent this in the future?",
                    "I'll just fix it myself and never trust you again.",
                    "You need to be more careful next time."
                ],
                correct: 1,
                explanation: "Focusing on understanding and prevention rather than blame creates a learning opportunity and maintains the relationship."
            },
            {
                scenario: "Your boss gives you criticism that you feel is unfair. How do you respond?",
                options: [
                    "That's completely unfair and you're wrong!",
                    "I appreciate the feedback. Can you help me understand your perspective so I can address your concerns?",
                    "Whatever you say, I'll just agree.",
                    "I'll make sure to tell everyone how unfair you are."
                ],
                correct: 1,
                explanation: "Seeking to understand before responding shows maturity and opens dialogue. It may reveal new perspectives."
            },
            // Level 2
            {
                scenario: "A team member's negative attitude is affecting team morale. How do you address this?",
                options: [
                    "Everyone thinks you're being negative and it's bringing us down.",
                    "I've noticed some tension in team interactions. Can we talk about how we can improve team dynamics?",
                    "You need to change your attitude or leave the team.",
                    "I'm going to talk to HR about your behavior."
                ],
                correct: 1,
                explanation: "Addressing the behavior rather than attacking the person, and focusing on team improvement creates a constructive approach."
            },
            {
                scenario: "You need to deliver bad news to a client about a project delay. How do you approach it?",
                options: [
                    "Hope they don't notice the delay",
                    "Be transparent about the delay, explain the原因, and present a revised timeline with solutions",
                    "Blame the delay on your team",
                    "Offer a discount without explaining why"
                ],
                correct: 1,
                explanation: "Transparency, explanation, and solutions show professionalism and respect for the client relationship."
            },
            {
                scenario: "A friend tells you something that makes you uncomfortable. How do you handle it?",
                options: [
                    "Just ignore it and pretend nothing happened",
                    "Express your discomfort respectfully while maintaining the friendship",
                    "End the friendship immediately",
                    "Tell them they're wrong to feel that way"
                ],
                correct: 1,
                explanation: "Honest communication about boundaries, done respectfully, maintains authenticity in the relationship."
            },
            // Level 3
            {
                scenario: "You need to address a sensitive topic with someone from a different cultural background. How do you proceed?",
                options: [
                    "Approach it exactly the same way as with anyone else",
                    "Research cultural norms and adapt your approach while being respectful",
                    "Avoid the conversation entirely",
                    "Let them bring it up first"
                ],
                correct: 1,
                explanation: "Cultural awareness and adaptation shows respect and increases the likelihood of a productive conversation."
            },
            {
                scenario: "During a difficult conversation, the other person becomes emotional and starts crying. What's your response?",
                options: [
                    "Tell them to calm down",
                    "Acknowledge their feelings, offer a break if needed, and continue when they're ready",
                    "Ignore the tears and continue with your points",
                    "End the conversation immediately"
                ],
                correct: 1,
                explanation: "Acknowledging emotions and offering space shows empathy and respect, allowing the conversation to continue productively."
            },
            {
                scenario: "You're mediating a conflict between two team members who refuse to communicate. How do you approach it?",
                options: [
                    "Make them work together until they figure it out",
                    "Meet with each individually first to understand perspectives, then facilitate a structured conversation",
                    "Take sides with whoever seems more reasonable",
                    "Reassign them to different teams"
                ],
                correct: 1,
                explanation: "Individual meetings build understanding, while structured facilitation creates a safe space for resolution."
            },
            {
                scenario: "You need to give feedback to someone who has a history of becoming defensive. How do you approach it?",
                options: [
                    "Don't give feedback to avoid conflict",
                    "Use specific examples, focus on impact, and ask for their perspective first",
                    "Give the feedback in front of others for accountability",
                    "Be extra harsh so they know you're serious"
                ],
                correct: 1,
                explanation: "Specific, impact-focused feedback with their input reduces defensiveness and encourages ownership."
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('scenario-text').textContent = q.scenario;
            document.getElementById('question-num').textContent = currentQuestion + 1;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            updateLevelInfo();
        }

        function checkAnswer(index) {
            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) btn.classList.add('correct');
                if (i === index && i !== q.correct) btn.classList.add('incorrect');
            });

            if (index === q.correct) {
                score += 10;
                document.getElementById('score').textContent = score;
            }

            document.getElementById('explanation-text').textContent = q.explanation;
            document.getElementById('explanation').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showGameOver();
            } else {
                loadQuestion();
            }
        }

        function updateLevelInfo() {
            let levelIndex = 0;
            let questionsSoFar = 0;
            
            for (let i = 0; i < levels.length; i++) {
                questionsSoFar += levels[i].questions;
                if (currentQuestion < questionsSoFar) {
                    levelIndex = i;
                    break;
                }
            }
            
            document.getElementById('level-info').textContent = levels[levelIndex].name;
        }

        function showGameOver() {
            document.getElementById('scenario').style.display = 'none';
            document.getElementById('options').style.display = 'none';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('level-info').style.display = 'none';
            
            document.getElementById('final-score').textContent = score;
            
            let performance = '';
            if (score >= 90) performance = 'Outstanding! You can handle difficult conversations with skill!';
            else if (score >= 70) performance = 'Great job! You have strong difficult conversation skills.';
            else if (score >= 50) performance = 'Good effort! Keep practicing to improve.';
            else performance = 'Keep practicing! Handling difficult conversations takes courage and skill.';
            
            document.getElementById('performance').textContent = performance;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            
            document.getElementById('scenario').style.display = 'block';
            document.getElementById('options').style.display = 'flex';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-info').style.display = 'block';
            
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
