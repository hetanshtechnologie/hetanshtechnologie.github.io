<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonverbal Communication Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .top-bar {
            background-color: #1e293b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .top-bar a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 16px;
        }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar h1 {
            margin-left: 20px;
            font-size: 24px;
            color: #f1f5f9;
        }
        .game-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            font-size: 18px;
        }
        .stats span { color: #94a3b8; }
        .stats strong { color: #38bdf8; }
        .level-info {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 16px;
        }
        .match-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 20px;
        }
        .column {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
        }
        .column h3 {
            color: #38bdf8;
            margin-bottom: 15px;
            text-align: center;
        }
        .match-item {
            background-color: #334155;
            border: 2px solid #475569;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        .match-item:hover:not(.selected):not(.matched):not(.disabled) {
            background-color: #475569;
            border-color: #38bdf8;
        }
        .match-item.selected {
            background-color: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
        }
        .match-item.matched {
            background-color: #166534;
            border-color: #22c55e;
            cursor: default;
        }
        .match-item.incorrect {
            background-color: #991b1b;
            border-color: #ef4444;
        }
        .match-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .reset-btn {
            background: linear-gradient(135deg, #475569, #334155);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 5px;
            transition: transform 0.2s;
        }
        .reset-btn:hover { transform: scale(1.05); }
        .explanation {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #f59e0b;
        }
        .explanation h4 {
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .next-btn {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: #0f172a;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin: 20px auto;
            transition: transform 0.2s;
        }
        .next-btn:hover { transform: scale(1.05); }
        .game-over {
            text-align: center;
            display: none;
        }
        .game-over h2 {
            color: #38bdf8;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .final-score {
            font-size: 24px;
            margin: 20px 0;
        }
        .play-again-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .play-again-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../index.html">← Back to Games</a>
        <h1>Nonverbal Communication</h1>
    </div>

    <div class="game-container">
        <div class="header">
            <h2>Match Body Language to Meanings</h2>
            <div class="stats">
                <span>Score: <strong id="score">0</strong></span>
                <span>Matches: <strong id="matches">0</strong>/4</span>
            </div>
        </div>

        <div class="level-info" id="level-info">Level 1: Basic Body Language</div>

        <div class="match-container" id="match-container">
            <div class="column" id="gestures-column">
                <h3>Body Language Gestures</h3>
                <div id="gestures"></div>
            </div>
            <div class="column" id="meanings-column">
                <h3>Meanings</h3>
                <div id="meanings"></div>
            </div>
        </div>

        <div style="text-align: center; margin: 20px 0;">
            <button class="reset-btn" onclick="resetMatches()">Reset Current Round</button>
        </div>

        <div class="explanation" id="explanation">
            <h4>Round Complete!</h4>
            <p id="explanation-text"></p>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Round →</button>

        <div class="game-over" id="game-over">
            <h2>Game Complete!</h2>
            <p class="final-score">Your Final Score: <strong id="final-score">0</strong>/100</p>
            <p id="performance"></p>
            <button class="play-again-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const levels = [
            { name: "Level 1: Basic Body Language", rounds: 2 },
            { name: "Level 2: Emotional Expressions", rounds: 2 },
            { name: "Level 3: Complex Signals", rounds: 2 }
        ];

        const rounds = [
            // Level 1
            {
                gestures: [
                    { id: 1, text: "Crossed arms" },
                    { id: 2, text: "Leaning forward" },
                    { id: 3, text: "Avoiding eye contact" },
                    { id: 4, text: "Open palms" }
                ],
                meanings: [
                    { id: 1, text: "Defensive or uncomfortable" },
                    { id: 2, text: "Interest and engagement" },
                    { id: 3, text: "Nervousness or dishonesty" },
                    { id: 4, text: "Honesty and openness" }
                ],
                explanation: "These basic gestures reveal underlying attitudes. Crossed arms often signal defensiveness, while open palms suggest honesty. Leaning forward shows interest, and avoiding eye contact may indicate discomfort."
            },
            {
                gestures: [
                    { id: 1, text: "Fidgeting" },
                    { id: 2, text: "Mirroring your posture" },
                    { id: 3, text: "Checking phone during conversation" },
                    { id: 4, text: "Maintained eye contact" }
                ],
                meanings: [
                    { id: 1, text: "Anxiety or impatience" },
                    { id: 2, text: "Rapport and agreement" },
                    { id: 3, text: "Disinterest or disrespect" },
                    { id: 4, text: "Confidence and attention" }
                ],
                explanation: "Fidgeting shows nervousness, while mirroring indicates connection. Phone checking signals disinterest, and sustained eye contact demonstrates confidence and engagement."
            },
            // Level 2
            {
                gestures: [
                    { id: 1, text: "Genuine smile (Duchenne)" },
                    { id: 2, text: "Tight jaw" },
                    { id: 3, text: "Raised eyebrows" },
                    { id: 4, text: "Slumped shoulders" }
                ],
                meanings: [
                    { id: 1, text: "True happiness" },
                    { id: 2, text: "Stress or anger" },
                    { id: 3, text: "Surprise or interest" },
                    { id: 4, text: "Sadness or defeat" }
                ],
                explanation: "Facial expressions and posture reveal emotions. A genuine smile involves the eyes, while jaw tension signals stress. Raised eyebrows show surprise, and slumped shoulders indicate defeat."
            },
            {
                gestures: [
                    { id: 1, text: "Rapid speech" },
                    { id: 2, text: "Speaking slowly with pauses" },
                    { id: 3, text: "High-pitched voice" },
                    { id: 4, text: "Whispering" }
                ],
                meanings: [
                    { id: 1, text: "Nervousness or excitement" },
                    { id: 2, text: "Confidence and authority" },
                    { id: 3, text: "Anxiety or uncertainty" },
                    { id: 4, text: "Intimacy or secrecy" }
                ],
                explanation: "Vocal patterns are powerful nonverbal cues. Rapid speech often signals anxiety, while slow, paused speech conveys confidence. High pitch can indicate stress, and whispering creates intimacy."
            },
            // Level 3
            {
                gestures: [
                    { id: 1, text: "Feet pointing toward exit" },
                    { id: 2, text: "Steepling fingers" },
                    { id: 3, text: "Touching face while speaking" },
                    { id: 4, text: "Leaning back with hands behind head" }
                ],
                meanings: [
                    { id: 1, text: "Desire to leave the situation" },
                    { id: 2, text: "Confidence or superiority" },
                    { id: 3, text: "Deception or discomfort" },
                    { id: 4, text: "Dominance or relaxation" }
                ],
                explanation: "Subtle signals reveal true intentions. Feet direction shows where someone wants to go, steepling indicates confidence, face-touching can signal deception, and leaning back shows either dominance or comfort."
            },
            {
                gestures: [
                    { id: 1, text: "Palms facing down" },
                    { id: 2, text: "Thumbs up" },
                    { id: 3, text: "Tapping fingers" },
                    { id: 4, text: "Rubbing hands together" }
                ],
                meanings: [
                    { id: 1, text: "Authority or dominance" },
                    { id: 2, text: "Approval or optimism" },
                    { id: 3, text: "Impatience or boredom" },
                    { id: 4, text: "Anticipation or excitement" }
                ],
                explanation: "Hand gestures communicate power and emotion. Palms down show authority, thumbs up indicates approval, finger tapping signals impatience, and rubbing hands together shows anticipation."
            }
        ];

        let currentRound = 0;
        let score = 0;
        let matchedPairs = 0;
        let selectedGesture = null;
        let selectedMeaning = null;
        let matchedIds = { gestures: [], meanings: [] };

        function loadRound() {
            const round = rounds[currentRound];
            matchedPairs = 0;
            selectedGesture = null;
            selectedMeaning = null;
            matchedIds = { gestures: [], meanings: [] };
            
            document.getElementById('matches').textContent = '0';
            
            const gesturesContainer = document.getElementById('gestures');
            const meaningsContainer = document.getElementById('meanings');
            
            gesturesContainer.innerHTML = '';
            meaningsContainer.innerHTML = '';
            
            const shuffledGestures = [...round.gestures].sort(() => Math.random() - 0.5);
            const shuffledMeanings = [...round.meanings].sort(() => Math.random() - 0.5);
            
            shuffledGestures.forEach(gesture => {
                const div = document.createElement('div');
                div.className = 'match-item';
                div.textContent = gesture.text;
                div.dataset.id = gesture.id;
                div.onclick = () => selectGesture(div, gesture.id);
                gesturesContainer.appendChild(div);
            });
            
            shuffledMeanings.forEach(meaning => {
                const div = document.createElement('div');
                div.className = 'match-item';
                div.textContent = meaning.text;
                div.dataset.id = meaning.id;
                div.onclick = () => selectMeaning(div, meaning.id);
                meaningsContainer.appendChild(div);
            });

            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            updateLevelInfo();
        }

        function selectGesture(element, id) {
            if (matchedIds.gestures.includes(id)) return;
            
            document.querySelectorAll('#gestures .match-item').forEach(item => {
                if (!item.classList.contains('matched')) {
                    item.classList.remove('selected');
                }
            });
            
            element.classList.add('selected');
            selectedGesture = { element, id };
            
            if (selectedMeaning) {
                checkMatch();
            }
        }

        function selectMeaning(element, id) {
            if (matchedIds.meanings.includes(id)) return;
            
            document.querySelectorAll('#meanings .match-item').forEach(item => {
                if (!item.classList.contains('matched')) {
                    item.classList.remove('selected');
                }
            });
            
            element.classList.add('selected');
            selectedMeaning = { element, id };
            
            if (selectedGesture) {
                checkMatch();
            }
        }

        function checkMatch() {
            const round = rounds[currentRound];
            const correctGesture = round.gestures.find(g => g.id === selectedGesture.id);
            const correctMeaning = round.meanings.find(m => m.id === selectedMeaning.id);
            
            if (selectedGesture.id === selectedMeaning.id) {
                selectedGesture.element.classList.remove('selected');
                selectedMeaning.element.classList.remove('selected');
                selectedGesture.element.classList.add('matched');
                selectedMeaning.element.classList.add('matched');
                matchedIds.gestures.push(selectedGesture.id);
                matchedIds.meanings.push(selectedMeaning.id);
                matchedPairs++;
                score += 10;
                document.getElementById('score').textContent = score;
                document.getElementById('matches').textContent = matchedPairs;
            } else {
                selectedGesture.element.classList.add('incorrect');
                selectedMeaning.element.classList.add('incorrect');
                
                setTimeout(() => {
                    selectedGesture.element.classList.remove('selected', 'incorrect');
                    selectedMeaning.element.classList.remove('selected', 'incorrect');
                    selectedGesture = null;
                    selectedMeaning = null;
                }, 1000);
                return;
            }
            
            selectedGesture = null;
            selectedMeaning = null;
            
            if (matchedPairs === 4) {
                document.getElementById('explanation-text').textContent = round.explanation;
                document.getElementById('explanation').style.display = 'block';
                document.getElementById('next-btn').style.display = 'block';
            }
        }

        function resetMatches() {
            loadRound();
        }

        function nextQuestion() {
            currentRound++;
            if (currentRound >= rounds.length) {
                showGameOver();
            } else {
                loadRound();
            }
        }

        function updateLevelInfo() {
            let levelIndex = 0;
            let roundsSoFar = 0;
            
            for (let i = 0; i < levels.length; i++) {
                roundsSoFar += levels[i].rounds;
                if (currentRound < roundsSoFar) {
                    levelIndex = i;
                    break;
                }
            }
            
            document.getElementById('level-info').textContent = levels[levelIndex].name;
        }

        function showGameOver() {
            document.getElementById('match-container').style.display = 'none';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('level-info').style.display = 'none';
            
            document.getElementById('final-score').textContent = score;
            
            let performance = '';
            if (score >= 90) performance = 'Outstanding! You are a nonverbal communication expert!';
            else if (score >= 70) performance = 'Great job! You have strong nonverbal skills.';
            else if (score >= 50) performance = 'Good effort! Keep practicing to improve.';
            else performance = 'Keep practicing! Nonverbal communication takes time to master.';
            
            document.getElementById('performance').textContent = performance;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            currentRound = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            
            document.getElementById('match-container').style.display = 'grid';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-info').style.display = 'block';
            
            loadRound();
        }

        loadRound();
    </script>
</body>
</html>
