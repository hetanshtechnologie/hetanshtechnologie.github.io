<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Negotiation Skills Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .top-bar {
            background-color: #1e293b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .top-bar a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 16px;
        }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar h1 {
            margin-left: 20px;
            font-size: 24px;
            color: #f1f5f9;
        }
        .game-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            font-size: 18px;
        }
        .stats span { color: #94a3b8; }
        .stats strong { color: #38bdf8; }
        .level-info {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 16px;
        }
        .scenario {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #ec4899;
        }
        .scenario h3 {
            color: #ec4899;
            margin-bottom: 15px;
        }
        .scenario p {
            line-height: 1.6;
            font-size: 16px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #334155;
            border: 2px solid #475569;
            color: #e2e8f0;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: #ec4899;
            transform: translateX(5px);
        }
        .option-btn.correct {
            background-color: #166534;
            border-color: #22c55e;
        }
        .option-btn.incorrect {
            background-color: #991b1b;
            border-color: #ef4444;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .explanation {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #f59e0b;
        }
        .explanation h4 {
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .next-btn {
            background: linear-gradient(135deg, #ec4899, #db2777);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin: 20px auto;
            transition: transform 0.2s;
        }
        .next-btn:hover { transform: scale(1.05); }
        .game-over {
            text-align: center;
            display: none;
        }
        .game-over h2 {
            color: #ec4899;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .final-score {
            font-size: 24px;
            margin: 20px 0;
        }
        .play-again-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .play-again-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../index.html">← Back to Games</a>
        <h1>Negotiation Skills</h1>
    </div>

    <div class="game-container">
        <div class="header">
            <h2>Master the Art of Win-Win Negotiation</h2>
            <div class="stats">
                <span>Score: <strong id="score">0</strong></span>
                <span>Question: <strong id="question-num">1</strong>/10</span>
            </div>
        </div>

        <div class="level-info" id="level-info">Level 1: Basic Negotiation Principles</div>

        <div class="scenario" id="scenario">
            <h3>Negotiation Scenario:</h3>
            <p id="scenario-text"></p>
        </div>

        <div class="options" id="options"></div>

        <div class="explanation" id="explanation">
            <h4>Explanation:</h4>
            <p id="explanation-text"></p>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>

        <div class="game-over" id="game-over">
            <h2>Game Complete!</h2>
            <p class="final-score">Your Final Score: <strong id="final-score">0</strong>/10</p>
            <p id="performance"></p>
            <button class="play-again-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const levels = [
            { name: "Level 1: Basic Negotiation Principles", questions: 3 },
            { name: "Level 2: Workplace Negotiations", questions: 3 },
            { name: "Level 3: Complex Negotiations", questions: 4 }
        ];

        const questions = [
            // Level 1
            {
                scenario: "You're buying a car. The dealer wants $25,000. You know the fair market value is $22,000, and you're willing to pay up to $23,000.",
                options: [
                    "Offer $20,000 and refuse to budge",
                    "Accept the $25,000 price to avoid conflict",
                    "Present your research on market value and propose $22,000, asking what would make this work for both of you",
                    "Threaten to buy from a competitor unless they drop to $20,000"
                ],
                correct: 2,
                explanation: "This approach uses information as power, proposes a fair price based on data, and seeks mutual satisfaction. It's collaborative rather than adversarial."
            },
            {
                scenario: "Your employee asks for a $10,000 raise. You have a budget of $7,000 for raises this year.",
                options: [
                    "Tell them raises aren't possible right now",
                    "Give them the full $10,000 even though it exceeds your budget",
                    "Explain budget constraints and propose $7,000 now with a performance plan for the remainder",
                    "Offer them a different title but no raise"
                ],
                correct: 2,
                explanation: "This response is transparent about constraints while showing commitment to the employee's growth. It creates a path forward that respects both needs."
            },
            {
                scenario: "You're negotiating with a vendor for office supplies. They offer a 10% discount for a one-year contract.",
                options: [
                    "Accept immediately to secure the discount",
                    "Ask for 15% and threaten to find another vendor",
                    "Explore what other terms could be adjusted - payment terms, delivery schedule, or service levels to create more value",
                    "Reject the offer and look elsewhere"
                ],
                correct: 2,
                explanation: "This expands the negotiation beyond price to create value for both parties. Looking at multiple variables often reveals opportunities for win-win outcomes."
            },
            // Level 2
            {
                scenario: "You want to work from home two days a week. Your manager prefers full-time office presence.",
                options: [
                    "Work from home without asking permission",
                    "Present data showing your productivity has been high, propose a trial period, and suggest regular check-ins to address concerns",
                    "Demand to work from home or you'll quit",
                    "Accept the full-time office requirement without discussion"
                ],
                correct: 1,
                explanation: "This approach uses evidence, proposes a low-risk trial, and addresses the manager's concerns proactively. It's assertive while respecting the relationship."
            },
            {
                scenario: "Your team needs additional resources, but the budget is allocated to another department's project.",
                options: [
                    "Go over your manager's head to senior leadership",
                    "Present a business case showing ROI of your project and explore creative solutions like shared resources or phased implementation",
                    "Cut corners on your project to stay within budget",
                    "Blame the other department for taking resources"
                ],
                correct: 1,
                explanation: "This focuses on business value rather than blame, seeks creative solutions, and presents a professional case. It builds rather than damages relationships."
            },
            {
                scenario: "A client wants a 30% price reduction but you can only offer 15% without losing money.",
                options: [
                    "Lose the client by refusing any reduction",
                    "Give them 30% to keep the business",
                    "Explain your cost structure transparently, offer 15% with added value or extended terms, and explore what outcome they're really trying to achieve",
                    "Offer 30% but reduce quality to compensate"
                ],
                correct: 2,
                explanation: "Transparency builds trust. Adding value beyond price and understanding their underlying needs can create solutions that work for both parties."
            },
            // Level 3
            {
                scenario: "Two departments need the same conference room at the same time for important meetings. Neither can reschedule.",
                options: [
                    "Let seniority determine who gets the room",
                    "Flip a coin to decide",
                    "Explore alternatives: split the time, use different rooms, have one meeting virtually, or find a creative solution that addresses both teams' core needs",
                    "The first to book it gets priority regardless of importance"
                ],
                correct: 2,
                explanation: "This expands the negotiation beyond the obvious constraint. By exploring alternatives and understanding each team's needs, creative solutions often emerge."
            },
            {
                scenario: "You're negotiating a job offer. The salary is $80,000 but you want $90,000. The company seems firm on their offer.",
                options: [
                    "Reject the offer outright",
                    "Accept but plan to negotiate again in six months",
                    "Ask about total compensation - bonus potential, equity, professional development budget, flexible work arrangements, and other benefits that could bridge the gap",
                    "Give an ultimatum: $90,000 or nothing"
                ],
                correct: 2,
                explanation: "Salary is just one component of total compensation. Exploring other benefits can close the gap while respecting the employer's constraints."
            },
            {
                scenario: "Your business partner wants to dissolve the partnership. You want to continue but their reasons are valid.",
                options: [
                    "Refuse to let them leave and tie them up in legal battles",
                    "Agree to dissolve but demand they compensate you fully",
                    "Explore a structured transition that protects both parties' interests, considers buyout options, and preserves the relationship for potential future collaboration",
                    "Bad-mouth them to mutual contacts"
                ],
                correct: 2,
                explanation: "Even in separation, maintaining dignity and finding fair solutions protects reputations and leaves doors open. This approach focuses on process and fairness."
            },
            {
                scenario: "During a salary negotiation, the other party uses aggressive tactics - interruptions, personal attacks, and impossible deadlines.",
                options: [
                    "Match their aggressive tactics",
                    "Walk out of the negotiation immediately",
                    "Stay calm, redirect to issues not people, take a break if needed, and set boundaries: 'I'm happy to continue discussing this respectfully'",
                    "Cave to their demands to end the confrontation"
                ],
                correct: 2,
                explanation: "Remaining professional while setting boundaries protects you and maintains your leverage. It also models the behavior you want in the negotiation."
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('scenario-text').textContent = q.scenario;
            document.getElementById('question-num').textContent = currentQuestion + 1;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            updateLevelInfo();
        }

        function checkAnswer(index) {
            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) btn.classList.add('correct');
                if (i === index && i !== q.correct) btn.classList.add('incorrect');
            });

            if (index === q.correct) {
                score += 10;
                document.getElementById('score').textContent = score;
            }

            document.getElementById('explanation-text').textContent = q.explanation;
            document.getElementById('explanation').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showGameOver();
            } else {
                loadQuestion();
            }
        }

        function updateLevelInfo() {
            let levelIndex = 0;
            let questionsSoFar = 0;
            
            for (let i = 0; i < levels.length; i++) {
                questionsSoFar += levels[i].questions;
                if (currentQuestion < questionsSoFar) {
                    levelIndex = i;
                    break;
                }
            }
            
            document.getElementById('level-info').textContent = levels[levelIndex].name;
        }

        function showGameOver() {
            document.getElementById('scenario').style.display = 'none';
            document.getElementById('options').style.display = 'none';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('level-info').style.display = 'none';
            
            document.getElementById('final-score').textContent = score;
            
            let performance = '';
            if (score >= 90) performance = 'Outstanding! You are a negotiation expert!';
            else if (score >= 70) performance = 'Great job! You have strong negotiation skills.';
            else if (score >= 50) performance = 'Good effort! Keep practicing to improve.';
            else performance = 'Keep practicing! Negotiation skills take time to master.';
            
            document.getElementById('performance').textContent = performance;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            
            document.getElementById('scenario').style.display = 'block';
            document.getElementById('options').style.display = 'flex';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-info').style.display = 'block';
            
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
