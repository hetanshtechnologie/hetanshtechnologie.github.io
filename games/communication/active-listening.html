<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Listening Skills Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .top-bar {
            background-color: #1e293b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .top-bar a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 16px;
        }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar h1 {
            margin-left: 20px;
            font-size: 24px;
            color: #f1f5f9;
        }
        .game-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            font-size: 18px;
        }
        .stats span { color: #94a3b8; }
        .stats strong { color: #38bdf8; }
        .level-info {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 16px;
        }
        .scenario {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #38bdf8;
        }
        .scenario h3 {
            color: #38bdf8;
            margin-bottom: 15px;
        }
        .scenario p {
            line-height: 1.6;
            font-size: 16px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #334155;
            border: 2px solid #475569;
            color: #e2e8f0;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: #38bdf8;
            transform: translateX(5px);
        }
        .option-btn.correct {
            background-color: #166534;
            border-color: #22c55e;
        }
        .option-btn.incorrect {
            background-color: #991b1b;
            border-color: #ef4444;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .explanation {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #f59e0b;
        }
        .explanation h4 {
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .next-btn {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: #0f172a;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin: 20px auto;
            transition: transform 0.2s;
        }
        .next-btn:hover { transform: scale(1.05); }
        .game-over {
            text-align: center;
            display: none;
        }
        .game-over h2 {
            color: #38bdf8;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .final-score {
            font-size: 24px;
            margin: 20px 0;
        }
        .play-again-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .play-again-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../index.html">← Back to Games</a>
        <h1>Active Listening Skills</h1>
    </div>

    <div class="game-container">
        <div class="header">
            <h2>Master the Art of Active Listening</h2>
            <div class="stats">
                <span>Score: <strong id="score">0</strong></span>
                <span>Question: <strong id="question-num">1</strong>/10</span>
            </div>
        </div>

        <div class="level-info" id="level-info">Level 1: Basic Listening Techniques</div>

        <div class="scenario" id="scenario">
            <h3>Scenario:</h3>
            <p id="scenario-text"></p>
        </div>

        <div class="options" id="options"></div>

        <div class="explanation" id="explanation">
            <h4>Explanation:</h4>
            <p id="explanation-text"></p>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>

        <div class="game-over" id="game-over">
            <h2>Game Complete!</h2>
            <p class="final-score">Your Final Score: <strong id="final-score">0</strong>/10</p>
            <p id="performance"></p>
            <button class="play-again-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const levels = [
            { name: "Level 1: Basic Listening Techniques", questions: 3 },
            { name: "Level 2: Advanced Empathy Skills", questions: 3 },
            { name: "Level 3: Professional Listening", questions: 4 }
        ];

        const questions = [
            // Level 1
            {
                scenario: "Your colleague tells you: 'I'm so frustrated with this project. The deadline keeps getting moved up and I can't keep pace.' They look stressed and are speaking quickly.",
                options: [
                    "Tell them to just work harder and manage their time better",
                    "Reflect back: 'It sounds like you're feeling overwhelmed by the shifting deadlines'",
                    "Change the subject to something more positive",
                    "Give them advice on project management techniques"
                ],
                correct: 1,
                explanation: "Reflective listening involves paraphrasing what the speaker said to show understanding. This validates their feelings and encourages them to share more, rather than jumping to solutions."
            },
            {
                scenario: "Your friend is sharing a personal problem about their relationship. They pause mid-sentence and look at you expectantly.",
                options: [
                    "Immediately offer your opinion on what they should do",
                    "Stay silent and maintain eye contact to encourage them to continue",
                    "Check your phone quickly while they pause",
                    "Share a similar story from your own experience"
                ],
                correct: 1,
                explanation: "Silence is a powerful active listening tool. It gives the speaker time to gather their thoughts and shows you're fully present and attentive without rushing them."
            },
            {
                scenario: "A team member says: 'I don't think my ideas are being heard in meetings. Nobody seems interested when I speak.'",
                options: [
                    "That's just how meetings are sometimes",
                    "You should speak up more confidently",
                    "I hear you saying that you feel your contributions aren't valued. Can you tell me more about specific situations?",
                    "Let me email the meeting organizer about this"
                ],
                correct: 2,
                explanation: "This response combines reflection ('I hear you saying...') with open-ended questioning. It acknowledges their feelings while inviting them to elaborate, showing genuine interest."
            },
            // Level 2
            {
                scenario: "During a performance review, an employee says: 'I've been working so hard this quarter, but my numbers aren't showing it. I feel like a failure.'",
                options: [
                    "Don't feel that way - your numbers will improve",
                    "You're not a failure, everyone has bad quarters",
                    "I can hear how much this is weighing on you. The effort you're putting in is important, and I want to understand what obstacles you're facing",
                    "Let's look at the data and figure out what went wrong"
                ],
                correct: 2,
                explanation: "This response validates their emotional experience first ('I can hear how much this is weighing on you'), acknowledges their effort, and then invites exploration - a key empathy skill."
            },
            {
                scenario: "Your partner tells you: 'I feel like we never spend quality time together anymore. You're always on your phone or working.'",
                options: [
                    "That's not true, we spent time together last weekend",
                    "I'm busy because I'm working hard for our family",
                    "You're right, I've been distracted. I miss our time together too. What could we do to reconnect?",
                    "We can schedule date nights if that would help"
                ],
                correct: 2,
                explanation: "This response validates their feeling, takes responsibility, shares your own feelings (emotional attunement), and collaboratively seeks solutions - showing deep empathy."
            },
            {
                scenario: "A student approaches you after class and says: 'I don't understand anything in this subject. I feel so stupid compared to everyone else.'",
                options: [
                    "You're not stupid - just study more",
                    "Let me explain it again more slowly",
                    "I can see this is really discouraging for you. Feeling lost in a new subject is completely normal. What specific part feels most confusing right now?",
                    "You should come to office hours more often"
                ],
                correct: 2,
                explanation: "This response validates their feelings, normalizes the experience to reduce shame, and asks a specific question to address their immediate need - demonstrating empathetic listening."
            },
            // Level 3
            {
                scenario: "A client calls with a complaint: 'Your product arrived damaged and I've wasted half my day dealing with this. This is unacceptable!'",
                options: [
                    "Calm down, we'll send you a replacement",
                    "It's not our fault - it must have happened during shipping",
                    "I completely understand your frustration. This is not the experience we want for our customers. Let me take full responsibility and get this resolved for you immediately. Can you tell me exactly what damage you're seeing?",
                    "We have a 30-day return policy you can use"
                ],
                correct: 2,
                explanation: "This response validates their emotion, takes ownership, reassures them, and asks for specific information - all key active listening and empathy skills in customer service."
            },
            {
                scenario: "During a negotiation, your counterpart says: 'We feel the proposed timeline is unrealistic and sets us up for failure.'",
                options: [
                    "Other companies have met tighter deadlines",
                    "The timeline is non-negotiable",
                    "I appreciate you sharing that concern. You're worried about setting realistic expectations and delivering quality work. What timeline would you feel confident committing to?",
                    "Let me check with my team and get back to you"
                ],
                correct: 2,
                explanation: "This response demonstrates reflective listening, validates their perspective, and invites their input - creating collaborative problem-solving rather than defensiveness."
            },
            {
                scenario: "A friend going through a divorce tells you: 'I don't know who I am anymore. Twenty years of marriage and now I'm starting over at 45.'",
                options: [
                    "You'll be fine, there are plenty of fish in the sea",
                    "At least you don't have kids to worry about",
                    "I hear how disorienting this must feel. Losing a major part of your identity is incredibly painful. There's no rush to have it all figured out right now.",
                    "My cousin went through the same thing and she's doing great now"
                ],
                correct: 2,
                explanation: "This response validates the complexity of identity loss, normalizes their pain, and removes pressure - showing deep empathetic understanding without trying to fix or minimize."
            },
            {
                scenario: "An employee who just received critical feedback says: 'I feel like no matter what I do, it's never good enough around here.'",
                options: [
                    "That feedback was meant to help you grow",
                    "I understand it's hard to hear, but the feedback came from a place of wanting to see you succeed. Your work matters to this team. What support would help you feel more confident going forward?",
                    "Everyone gets feedback - you need to toughen up",
                    "Let's go over the feedback point by point"
                ],
                correct: 1,
                explanation: "This response acknowledges their emotional state, reframes the feedback constructively, affirms their value, and asks what they need - balancing empathy with professional development."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let currentLevel = 0;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('scenario-text').textContent = q.scenario;
            document.getElementById('question-num').textContent = currentQuestion + 1;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            updateLevelInfo();
        }

        function checkAnswer(index) {
            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) btn.classList.add('correct');
                if (i === index && i !== q.correct) btn.classList.add('incorrect');
            });

            if (index === q.correct) {
                score += 10;
                document.getElementById('score').textContent = score;
            }

            document.getElementById('explanation-text').textContent = q.explanation;
            document.getElementById('explanation').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showGameOver();
            } else {
                loadQuestion();
            }
        }

        function updateLevelInfo() {
            let levelIndex = 0;
            let questionsSoFar = 0;
            
            for (let i = 0; i < levels.length; i++) {
                questionsSoFar += levels[i].questions;
                if (currentQuestion < questionsSoFar) {
                    levelIndex = i;
                    break;
                }
            }
            
            document.getElementById('level-info').textContent = levels[levelIndex].name;
        }

        function showGameOver() {
            document.getElementById('scenario').style.display = 'none';
            document.getElementById('options').style.display = 'none';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('level-info').style.display = 'none';
            
            document.getElementById('final-score').textContent = score;
            
            let performance = '';
            if (score >= 90) performance = 'Outstanding! You are an active listening expert!';
            else if (score >= 70) performance = 'Great job! You have strong listening skills.';
            else if (score >= 50) performance = 'Good effort! Keep practicing to improve.';
            else performance = 'Keep practicing! Active listening takes time to master.';
            
            document.getElementById('performance').textContent = performance;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            
            document.getElementById('scenario').style.display = 'block';
            document.getElementById('options').style.display = 'flex';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-info').style.display = 'block';
            
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
