<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Speaking Skills Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .top-bar {
            background-color: #1e293b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .top-bar a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 16px;
        }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar h1 {
            margin-left: 20px;
            font-size: 24px;
            color: #f1f5f9;
        }
        .game-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            font-size: 18px;
        }
        .stats span { color: #94a3b8; }
        .stats strong { color: #38bdf8; }
        .level-info {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 16px;
        }
        .scenario {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #06b6d4;
        }
        .scenario h3 {
            color: #06b6d4;
            margin-bottom: 15px;
        }
        .scenario p {
            line-height: 1.6;
            font-size: 16px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #334155;
            border: 2px solid #475569;
            color: #e2e8f0;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: #06b6d4;
            transform: translateX(5px);
        }
        .option-btn.correct {
            background-color: #166534;
            border-color: #22c55e;
        }
        .option-btn.incorrect {
            background-color: #991b1b;
            border-color: #ef4444;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .explanation {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #f59e0b;
        }
        .explanation h4 {
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .next-btn {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin: 20px auto;
            transition: transform 0.2s;
        }
        .next-btn:hover { transform: scale(1.05); }
        .game-over {
            text-align: center;
            display: none;
        }
        .game-over h2 {
            color: #06b6d4;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .final-score {
            font-size: 24px;
            margin: 20px 0;
        }
        .play-again-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .play-again-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../index.html">← Back to Games</a>
        <h1>Public Speaking Skills</h1>
    </div>

    <div class="game-container">
        <div class="header">
            <h2>Master the Art of Public Speaking</h2>
            <div class="stats">
                <span>Score: <strong id="score">0</strong></span>
                <span>Question: <strong id="question-num">1</strong>/10</span>
            </div>
        </div>

        <div class="level-info" id="level-info">Level 1: Speech Structure Fundamentals</div>

        <div class="scenario" id="scenario">
            <h3>Speech Structure Question:</h3>
            <p id="scenario-text"></p>
        </div>

        <div class="options" id="options"></div>

        <div class="explanation" id="explanation">
            <h4>Explanation:</h4>
            <p id="explanation-text"></p>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>

        <div class="game-over" id="game-over">
            <h2>Game Complete!</h2>
            <p class="final-score">Your Final Score: <strong id="final-score">0</strong>/10</p>
            <p id="performance"></p>
            <button class="play-again-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const levels = [
            { name: "Level 1: Speech Structure Fundamentals", questions: 3 },
            { name: "Level 2: Delivery Techniques", questions: 3 },
            { name: "Level 3: Advanced Public Speaking", questions: 4 }
        ];

        const questions = [
            // Level 1
            {
                scenario: "You're giving a 10-minute presentation. What's the ideal structure for the opening?",
                options: [
                    "Start with 'Um, hello, my name is...' and apologize for being nervous",
                    "Begin with a compelling hook, state your thesis, and preview your main points",
                    "Jump directly into your first main point",
                    "Read your entire speech introduction word-for-word from notes"
                ],
                correct: 1,
                explanation: "A strong opening hooks the audience, establishes credibility, and provides a roadmap. Starting with confidence and purpose engages listeners from the start."
            },
            {
                scenario: "In the body of your speech, you have three main points. What's the best way to organize them?",
                options: [
                    "Present all points in a random order",
                    "Use a clear structure like chronological, problem-solution, or cause-effect, with transitions between points",
                    "Spend equal time on each point regardless of importance",
                    "Only cover the points you remember without a clear structure"
                ],
                correct: 1,
                explanation: "Logical organization helps audiences follow your message. Clear structures and transitions make your speech memorable and professional."
            },
            {
                scenario: "How should you conclude your speech effectively?",
                options: [
                    "Say 'That's it' and walk off stage",
                    "Summarize your main points, restate your key message, and end with a clear call to action or memorable closing",
                    "Introduce new information to leave them thinking",
                    "Apologize for taking up their time"
                ],
                correct: 1,
                explanation: "A strong conclusion reinforces your message, provides closure, and gives the audience a clear next step. It's your last impression—make it count."
            },
            // Level 2
            {
                scenario: "You notice the audience starting to look bored halfway through your speech. What's the best response?",
                options: [
                    "Speak louder to regain their attention",
                    "Rush through the remaining content to finish early",
                    "Engage them with a question, story, or interactive element to re-energize the presentation",
                    "Ignore it and continue with your planned delivery"
                ],
                correct: 2,
                explanation: "Adapting to audience energy shows skill. Interactive elements, stories, or questions can re-engage listeners and make your message more impactful."
            },
            {
                scenario: "You're asked to give a last-minute presentation with no preparation time. What's your priority?",
                options: [
                    "Wing it and hope for the best",
                    "Quickly outline 1-3 key messages, structure them logically, and focus on clear delivery",
                    "Try to cover everything you know about the topic",
                    "Decline the opportunity because you're not prepared"
                ],
                correct: 1,
                explanation: "With limited time, focus on a few key messages rather than trying to cover everything. Simple structure with clear delivery is better than disorganized content."
            },
            {
                scenario: "How should you handle nervousness before a speech?",
                options: [
                    "Avoid eye contact and look at the floor",
                    "Use nervous energy positively - channel it into enthusiasm and movement",
                    "Drink alcohol to calm your nerves",
                    "Speak as quickly as possible to get it over with"
                ],
                correct: 1,
                explanation: "Nervousness is normal and can be transformed into positive energy. Channeling it into enthusiasm makes you more engaging rather than less."
            },
            // Level 3
            {
                scenario: "You're presenting complex data to a non-technical audience. How should you approach it?",
                options: [
                    "Use technical jargon to show expertise",
                    "Use analogies, visual aids, and storytelling to make the data relatable and memorable",
                    "Skip the data and just give your opinion",
                    "Provide the raw data and let them interpret it"
                ],
                correct: 1,
                explanation: "Making complex information accessible shows mastery. Analogies and stories create connections that data alone cannot."
            },
            {
                scenario: "During Q&A, someone asks a hostile question designed to embarrass you. How do you respond?",
                options: [
                    "Attack the questioner personally",
                    "Ignore the question and move to the next one",
                    "Stay calm, acknowledge the question respectfully, provide a thoughtful answer, and if needed, offer to discuss further offline",
                    "Deflect by saying 'That's a good question' and not answering"
                ],
                correct: 2,
                explanation: "Handling difficult questions with grace demonstrates professionalism and credibility. It shows you can think on your feet and maintain composure."
            },
            {
                scenario: "You're giving a TED-style talk. What's the ideal length and structure?",
                options: [
                    "45 minutes to cover everything in depth",
                    "18 minutes or less, with one core idea, personal stories, and a clear takeaway",
                    "As long as needed to cover the topic thoroughly",
                    "5 minutes so you don't lose the audience"
                ],
                correct: 1,
                explanation: "TED talks demonstrate that shorter, focused presentations with one core idea and personal stories are more impactful than lengthy lectures."
            },
            {
                scenario: "How should you use visual aids in a presentation?",
                options: [
                    "Put all your notes on slides and read from them",
                    "Use visuals that support your message, keep slides simple, and maintain eye contact with the audience",
                    "Avoid visual aids entirely to keep focus on you",
                    "Use as many animations and effects as possible to impress the audience"
                ],
                correct: 1,
                explanation: "Visual aids should enhance, not replace, your presentation. Simple, supportive visuals with maintained eye contact create the best audience experience."
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('scenario-text').textContent = q.scenario;
            document.getElementById('question-num').textContent = currentQuestion + 1;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            updateLevelInfo();
        }

        function checkAnswer(index) {
            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) btn.classList.add('correct');
                if (i === index && i !== q.correct) btn.classList.add('incorrect');
            });

            if (index === q.correct) {
                score += 10;
                document.getElementById('score').textContent = score;
            }

            document.getElementById('explanation-text').textContent = q.explanation;
            document.getElementById('explanation').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showGameOver();
            } else {
                loadQuestion();
            }
        }

        function updateLevelInfo() {
            let levelIndex = 0;
            let questionsSoFar = 0;
            
            for (let i = 0; i < levels.length; i++) {
                questionsSoFar += levels[i].questions;
                if (currentQuestion < questionsSoFar) {
                    levelIndex = i;
                    break;
                }
            }
            
            document.getElementById('level-info').textContent = levels[levelIndex].name;
        }

        function showGameOver() {
            document.getElementById('scenario').style.display = 'none';
            document.getElementById('options').style.display = 'none';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('level-info').style.display = 'none';
            
            document.getElementById('final-score').textContent = score;
            
            let performance = '';
            if (score >= 90) performance = 'Outstanding! You are a public speaking expert!';
            else if (score >= 70) performance = 'Great job! You have strong public speaking skills.';
            else if (score >= 50) performance = 'Good effort! Keep practicing to improve.';
            else performance = 'Keep practicing! Public speaking skills take time to master.';
            
            document.getElementById('performance').textContent = performance;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            
            document.getElementById('scenario').style.display = 'block';
            document.getElementById('options').style.display = 'flex';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-info').style.display = 'block';
            
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
