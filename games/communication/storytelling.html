<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storytelling Skills Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .top-bar {
            background-color: #1e293b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .top-bar a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 16px;
        }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar h1 {
            margin-left: 20px;
            font-size: 24px;
            color: #f1f5f9;
        }
        .game-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            font-size: 18px;
        }
        .stats span { color: #94a3b8; }
        .stats strong { color: #38bdf8; }
        .level-info {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 16px;
        }
        .scenario {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #f97316;
        }
        .scenario h3 {
            color: #f97316;
            margin-bottom: 15px;
        }
        .scenario p {
            line-height: 1.6;
            font-size: 16px;
        }
        .ordering-container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .ordering-container h4 {
            color: #f97316;
            margin-bottom: 15px;
        }
        .story-elements {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .story-element {
            background-color: #334155;
            border: 2px solid #475569;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: grab;
            transition: all 0.2s ease;
            user-select: none;
        }
        .story-element:hover {
            background-color: #475569;
            border-color: #f97316;
        }
        .story-element.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }
        .story-element.drag-over {
            border-color: #38bdf8;
            background-color: #1e3a5f;
        }
        .story-element.correct {
            background-color: #166534;
            border-color: #22c55e;
        }
        .story-element.incorrect {
            background-color: #991b1b;
            border-color: #ef4444;
        }
        .submit-btn {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        .submit-btn:hover { transform: scale(1.05); }
        .reset-btn {
            background: linear-gradient(135deg, #475569, #334155);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 5px;
            transition: transform 0.2s;
        }
        .reset-btn:hover { transform: scale(1.05); }
        .explanation {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #f59e0b;
        }
        .explanation h4 {
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .next-btn {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin: 20px auto;
            transition: transform 0.2s;
        }
        .next-btn:hover { transform: scale(1.05); }
        .game-over {
            text-align: center;
            display: none;
        }
        .game-over h2 {
            color: #f97316;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .final-score {
            font-size: 24px;
            margin: 20px 0;
        }
        .play-again-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .play-again-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../index.html">← Back to Games</a>
        <h1>Storytelling Skills</h1>
    </div>

    <div class="game-container">
        <div class="header">
            <h2>Master the Narrative Arc</h2>
            <div class="stats">
                <span>Score: <strong id="score">0</strong></span>
                <span>Question: <strong id="question-num">1</strong>/10</span>
            </div>
        </div>

        <div class="level-info" id="level-info">Level 1: Basic Story Structure</div>

        <div class="scenario" id="scenario">
            <h3>Story Scenario:</h3>
            <p id="scenario-text"></p>
        </div>

        <div class="ordering-container" id="ordering-container">
            <h4>Drag to arrange in correct narrative order:</h4>
            <div class="story-elements" id="story-elements"></div>
            <div style="margin-top: 15px;">
                <button class="submit-btn" onclick="checkOrder()">Check Order</button>
                <button class="reset-btn" onclick="resetOrder()">Reset</button>
            </div>
        </div>

        <div class="explanation" id="explanation">
            <h4>Explanation:</h4>
            <p id="explanation-text"></p>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>

        <div class="game-over" id="game-over">
            <h2>Game Complete!</h2>
            <p class="final-score">Your Final Score: <strong id="final-score">0</strong>/10</p>
            <p id="performance"></p>
            <button class="play-again-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const levels = [
            { name: "Level 1: Basic Story Structure", questions: 3 },
            { name: "Level 2: Emotional Arcs", questions: 3 },
            { name: "Level 3: Advanced Storytelling", questions: 4 }
        ];

        const questions = [
            // Level 1
            {
                scenario: "Arrange the basic elements of a story in the correct order:",
                elements: [
                    "Exposition - Introduce characters and setting",
                    "Inciting Incident - Something disrupts normal life",
                    "Rising Action - Challenges build tension",
                    "Climax - The peak of conflict",
                    "Falling Action - Consequences unfold",
                    "Resolution - Story concludes"
                ],
                correctOrder: [0, 1, 2, 3, 4, 5],
                explanation: "The classic narrative arc follows this structure: setup → disruption → building tension → peak → consequences → conclusion. This pattern is fundamental to storytelling."
            },
            {
                scenario: "Order these story elements for maximum emotional impact:",
                elements: [
                    "Establish normalcy and what the character values",
                    "Introduce a threat to what they value",
                    "Show the character struggling to protect it",
                    "The moment of greatest loss or danger",
                    "The character finds unexpected strength or help",
                    "A new normal emerges, changed but hopeful"
                ],
                correctOrder: [0, 1, 2, 3, 4, 5],
                explanation: "This structure builds emotional investment by first establishing what matters, then threatening it, creating tension, hitting rock bottom, showing resilience, and offering hope."
            },
            {
                scenario: "Arrange these elements for a persuasive business story:",
                elements: [
                    "The current situation and why it matters",
                    "The problem or challenge faced",
                    "Failed attempts or obstacles encountered",
                    "The breakthrough or solution discovered",
                    "The results and benefits achieved",
                    "The lesson or call to action"
                ],
                correctOrder: [0, 1, 2, 3, 4, 5],
                explanation: "Business stories follow problem → struggle → solution → results → action. This structure makes the solution compelling by showing the journey to get there."
            },
            // Level 2
            {
                scenario: "Order these elements for a hero's journey story:",
                elements: [
                    "The ordinary world of the hero",
                    "Call to adventure and refusal",
                    "Meeting the mentor and accepting the quest",
                    "Crossing the threshold into the unknown",
                    "Tests, allies, and enemies",
                    "The ordeal and return with the elixir"
                ],
                correctOrder: [0, 1, 2, 3, 4, 5],
                explanation: "The hero's journey follows Campbell's monomyth: ordinary world → call → mentor → threshold → trials → return. This universal pattern resonates across cultures."
            },
            {
                scenario: "Arrange these elements for a story that builds suspense:",
                elements: [
                    "Mysterious opening that raises questions",
                    "Clues that hint at something bigger",
                    "Rising tension with each revelation",
                    "False sense of security",
                    "The shocking truth revealed",
                    "Resolution that recontextualizes everything"
                ],
                correctOrder: [0, 1, 2, 3, 4, 5],
                explanation: "Suspense builds through mystery → clues → tension → false calm → revelation → reinterpretation. This keeps audiences engaged and guessing."
            },
            {
                scenario: "Order these elements for a redemption story:",
                elements: [
                    "The character's fall from grace",
                    "The consequences and isolation",
                    "A moment of self-reflection",
                    "The choice to change",
                    "The difficult journey of atonement",
                    "Acceptance and forgiveness"
                ],
                correctOrder: [0, 1, 2, 3, 4, 5],
                explanation: "Redemption stories follow: fall → consequences → reflection → choice → journey → forgiveness. This arc shows transformation is possible through effort."
            },
            // Level 3
            {
                scenario: "Order these elements for a story that teaches a complex lesson:",
                elements: [
                    "The character's initial worldview",
                    "An experience that challenges that view",
                    "Resistance and denial of the new truth",
                    "Repeated encounters with the lesson",
                    "The breaking point where denial fails",
                    "Embracing the new understanding"
                ],
                correctOrder: [0, 1, 2, 3, 4, 5],
                explanation: "Teaching through story requires: worldview → challenge → resistance → repetition → breaking point → acceptance. This mirrors how people actually learn difficult truths."
            },
            {
                scenario: "Order these elements for a story about personal growth:",
                elements: [
                    "The comfort zone and its limitations",
                    "The call to something greater",
                    "The fear and resistance to change",
                    "Taking the first difficult step",
                    "Setbacks and learning from failure",
                    "Emerging stronger with new capabilities"
                ],
                correctOrder: [0, 1, 2, 3, 4, 5],
                explanation: "Growth stories follow: comfort → call → fear → action → setbacks → transformation. This realistic arc shows growth requires both desire and difficulty."
            },
            {
                scenario: "Order these elements for a story that builds empathy:",
                elements: [
                    "Show the character's daily life and struggles",
                    "Reveal their inner thoughts and fears",
                    "Introduce the moment of crisis",
                    "Let the audience feel their vulnerability",
                    "Show their choice despite the fear",
                    "The outcome that honors their courage"
                ],
                correctOrder: [0, 1, 2, 3, 4, 5],
                explanation: "Empathy stories build connection through: daily life → inner world → crisis → vulnerability → choice → outcome. This structure makes characters relatable and human."
            },
            {
                scenario: "Order these elements for a story that inspires action:",
                elements: [
                    "The现状 that needs to change",
                    "The vision of what could be",
                    "The obstacles that seem insurmountable",
                    "The first brave step taken",
                    "The momentum that builds",
                    "The achieved change that inspires others"
                ],
                correctOrder: [0, 1, 2, 3, 4, 5],
                explanation: "Inspirational stories follow:现状 → vision → obstacles → first step → momentum → impact. This shows change is possible and starts with action."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let draggedElement = null;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('scenario-text').textContent = q.scenario;
            document.getElementById('question-num').textContent = currentQuestion + 1;
            
            const elementsContainer = document.getElementById('story-elements');
            elementsContainer.innerHTML = '';
            
            const shuffledElements = [...q.elements].sort(() => Math.random() - 0.5);
            
            shuffledElements.forEach((element, index) => {
                const div = document.createElement('div');
                div.className = 'story-element';
                div.textContent = element;
                div.draggable = true;
                div.dataset.originalIndex = q.elements.indexOf(element);
                
                div.addEventListener('dragstart', handleDragStart);
                div.addEventListener('dragover', handleDragOver);
                div.addEventListener('drop', handleDrop);
                div.addEventListener('dragend', handleDragEnd);
                
                elementsContainer.appendChild(div);
            });

            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            updateLevelInfo();
        }

        function handleDragStart(e) {
            draggedElement = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            this.classList.add('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            if (draggedElement !== this) {
                const container = document.getElementById('story-elements');
                const allElements = [...container.children];
                const draggedIndex = allElements.indexOf(draggedElement);
                const targetIndex = allElements.indexOf(this);
                
                if (draggedIndex < targetIndex) {
                    container.insertBefore(draggedElement, this.nextSibling);
                } else {
                    container.insertBefore(draggedElement, this);
                }
            }
            this.classList.remove('drag-over');
        }

        function handleDragEnd() {
            this.classList.remove('dragging');
            document.querySelectorAll('.story-element').forEach(el => {
                el.classList.remove('drag-over');
            });
        }

        function checkOrder() {
            const q = questions[currentQuestion];
            const container = document.getElementById('story-elements');
            const elements = [...container.children];
            
            let correctCount = 0;
            
            elements.forEach((element, index) => {
                const originalIndex = parseInt(element.dataset.originalIndex);
                if (q.correctOrder[index] === originalIndex) {
                    element.classList.add('correct');
                    element.classList.remove('incorrect');
                    correctCount++;
                } else {
                    element.classList.add('incorrect');
                    element.classList.remove('correct');
                }
                element.draggable = false;
            });
            
            const points = Math.round((correctCount / q.elements.length) * 10);
            score += points;
            document.getElementById('score').textContent = score;

            document.getElementById('explanation-text').textContent = q.explanation;
            document.getElementById('explanation').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
            document.querySelector('.submit-btn').disabled = true;
        }

        function resetOrder() {
            loadQuestion();
            document.querySelector('.submit-btn').disabled = false;
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showGameOver();
            } else {
                loadQuestion();
                document.querySelector('.submit-btn').disabled = false;
            }
        }

        function updateLevelInfo() {
            let levelIndex = 0;
            let questionsSoFar = 0;
            
            for (let i = 0; i < levels.length; i++) {
                questionsSoFar += levels[i].questions;
                if (currentQuestion < questionsSoFar) {
                    levelIndex = i;
                    break;
                }
            }
            
            document.getElementById('level-info').textContent = levels[levelIndex].name;
        }

        function showGameOver() {
            document.getElementById('scenario').style.display = 'none';
            document.getElementById('ordering-container').style.display = 'none';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('level-info').style.display = 'none';
            
            document.getElementById('final-score').textContent = score;
            
            let performance = '';
            if (score >= 90) performance = 'Outstanding! You are a storytelling master!';
            else if (score >= 70) performance = 'Great job! You understand narrative structure well.';
            else if (score >= 50) performance = 'Good effort! Keep practicing to improve.';
            else performance = 'Keep practicing! Storytelling skills take time to master.';
            
            document.getElementById('performance').textContent = performance;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            
            document.getElementById('scenario').style.display = 'block';
            document.getElementById('ordering-container').style.display = 'block';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-info').style.display = 'block';
            document.querySelector('.submit-btn').disabled = false;
            
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
