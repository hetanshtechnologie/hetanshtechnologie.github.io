<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evolution & Natural Selection</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #334155}
.topbar a{color:#38bdf8;text-decoration:none;font-weight:600}.topbar a:hover{text-decoration:underline}
.topbar h1{font-size:1.2rem}
.game-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
.stats{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.stats span{background:#1e293b;padding:8px 14px;border-radius:8px;border:1px solid #334155;font-size:.9rem}
.scenario-card{background:#1e293b;border-radius:16px;padding:24px;max-width:600px;width:100%;border:2px solid #334155}
.scenario-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.scenario-emoji{font-size:2.5rem}
.scenario-title{font-size:1.1rem;font-weight:600}
.scenario-desc{font-size:.95rem;color:#94a3b8;line-height:1.5;margin-bottom:16px}
.q-text{font-size:1rem;margin:12px 0;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:#0f172a;color:#e2e8f0;border:2px solid #475569;padding:12px 16px;border-radius:10px;font-size:.9rem;cursor:pointer;transition:all .2s;text-align:left}
.opt:hover{border-color:#38bdf8}
.opt.correct{border-color:#22c55e;background:rgba(34,197,94,0.15)}
.opt.wrong{border-color:#ef4444;background:rgba(239,68,68,0.15)}
.opt.disabled{pointer-events:none;opacity:.7}
.fb{margin-top:12px;padding:10px;border-radius:8px;font-size:.9rem;min-height:2em}
.btn{background:#38bdf8;color:#0f172a;border:none;padding:10px 22px;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer}
.btn:hover{background:#7dd3fc}
.btn.sec{background:#475569;color:#e2e8f0}
.timeline{display:flex;gap:8px;margin:8px 0;align-items:center;justify-content:center;flex-wrap:wrap}
.timeline-step{background:#0f172a;border:1px solid #334155;padding:6px 12px;border-radius:20px;font-size:.75rem;color:#94a3b8}
.timeline-step.active{border-color:#f59e0b;color:#f59e0b}
.timeline-arrow{color:#475569}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">⬅ Back</a><h1>🦎 Evolution & Natural Selection</h1></div>
<div class="game-wrap">
<div class="stats">
<span>⭐ Score: <b id="score">0</b></span>
<span>📊 Level: <b id="level">1</b></span>
<span>❓ Q: <b id="qnum">1</b>/8</span>
</div>
<div class="scenario-card" id="card"></div>
<div class="fb" id="fb" style="max-width:600px;width:100%"></div>
<button class="btn" id="next-btn" style="display:none" onclick="nextQ()">Next ➡️</button>
</div>
<script>
let score=0,level=1,qNum=0,answered=false;
const questions=[
  {emoji:'🦩',title:'Flamingo Beak Length',desc:'In a population of flamingos, some have longer beaks that reach deeper water. A drought makes shallow water scarce.',
   q:'Which individuals are more likely to survive and reproduce?',opts:['Longer-beaked flamingos','Shorter-beaked flamingos','Both equally','Neither survives'],ans:0,
   explain:'Natural selection favors longer beaks — individuals with advantageous traits survive and reproduce more.'},
  {emoji:'🐛',title:'Peppered Moths',desc:'Before industrial pollution, light-colored moths hid well on light bark. Pollution darkened the trees.',
   q:'What happened to the moth population over time?',opts:['Dark moths increased in frequency','Light moths increased','No change','All moths died'],ans:0,
   explain:'Dark moths were better camouflaged on dark bark, avoiding predators and reproducing more.'},
  {emoji:'🦒',title:'Giraffe Necks',desc:'Ancestral giraffes had varying neck lengths. Those with longer necks could reach higher leaves.',
   q:'This is an example of:',opts:['Directional selection','Stabilizing selection','Disruptive selection','No selection'],ans:0,
   explain:'Directional selection shifts the population toward one extreme (longer necks).'},
  {emoji:'🦎',title:'Lizard Survival',desc:'On an island, lizards come in green and brown. The ground is brown volcanic rock with few trees.',
   q:'Which color is selected for?',opts:['Brown','Green','Both equally','Neither — camouflage doesn\'t matter'],ans:0,
   explain:'Brown lizards are better camouflaged against the rock, avoiding predation.'},
  {emoji:'🐢',title:'Turtle Shell Thickness',desc:'Turtles with thicker shells survive predator attacks better. Thinner-shelled turtles reproduce faster.',
   q:'This creates a trade-off called:',opts:['Balancing selection','Directional selection','Genetic drift','Founder effect'],ans:0,
   explain:'Balancing selection maintains variation — thick shells (survival) vs. fast reproduction.'},
  {emoji:'🐝',title:'Bee Resistance',desc:'Some bees have genes for Varroa mite resistance. Mites are killing most bee colonies.',
   q:'What will happen to the bee population over many generations?',opts:['More resistant bees will dominate','All bees will die','No change','Mites will disappear'],ans:0,
   explain:'Natural selection will increase the frequency of resistance genes in the population.'},
  {emoji:'🐾',title:'Antibiotic Resistance',desc:'A colony of bacteria is exposed to antibiotics. Most die, but some have resistance genes.',
   q:'After several generations, what happens?',opts:['Resistant bacteria become common','All bacteria become resistant immediately','Bacteria evolve immunity instantly','The antibiotic keeps working'],ans:0,
   explain:'Resistant bacteria survive, reproduce, and pass resistance to offspring — classic natural selection.'},
  {emoji:'🐦',title:'Darwin\'s Finches',desc:'Finches on different Galápagos islands have different beak shapes adapted to different foods.',
   q:'This pattern is called:',opts:['Adaptive radiation','Convergent evolution','Artificial selection','Genetic engineering'],ans:0,
   explain:'Adaptive radiation: one ancestor diversifies into many species adapted to different niches.'},
  {emoji:'🐺',title:'Wolf Pack',desc:'In a harsh winter, thinner wolves struggle to hunt. Only well-fed wolves survive to spring breeding.',
   q:'What is this an example of?',opts:['Natural selection','Artificial selection','Genetic mutation','Lamarckism'],ans:0,
   explain:'Environmental pressure selects for traits (stronger/thicker wolves) that improve survival.'},
  {emoji:'🌺',title:'Flower Color',desc:'Hummingbirds prefer red flowers. In an area with mostly blue flowers, some mutant red ones appear.',
   q:'What happens over time?',opts:['Red flowers increase','Blue flowers increase','Both equal','Flowers disappear'],ans:0,
   explain:'Pollinators preferentially visit red flowers, increasing their reproductive success.'},
];
let shuffled=[...questions].sort(()=>Math.random()-0.5);

function showQ(){
  if(qNum>=8){showResults();return}
  answered=false;
  document.getElementById('fb').textContent='';document.getElementById('fb').style.background='transparent';
  document.getElementById('next-btn').style.display='none';
  document.getElementById('qnum').textContent=qNum+1;
  let q=shuffled[qNum];
  let timeline=['Variation','Environmental Pressure','Differential Survival','Reproduction','Adaptation'];
  let html='<div class="scenario-header"><div class="scenario-emoji">'+q.emoji+'</div><div class="scenario-title">'+q.title+'</div></div>';
  html+='<div class="scenario-desc">'+q.desc+'</div>';
  html+='<div class="timeline">';
  timeline.forEach((t,i)=>{if(i>0)html+='<span class="timeline-arrow">→</span>';html+='<span class="timeline-step '+(i<=2?'active':'')+'">'+t+'</span>'});
  html+='</div>';
  html+='<div class="q-text">'+q.q+'</div><div class="opts">';
  q.opts.forEach((o,i)=>{html+='<button class="opt" onclick="check('+i+')">'+o+'</button>'});
  html+='</div>';
  document.getElementById('card').innerHTML=html;
}

function check(i){
  if(answered)return;answered=true;
  let q=shuffled[qNum];
  document.querySelectorAll('.opt').forEach((b,j)=>{if(j===q.ans)b.classList.add('correct');if(j===i&&i!==q.ans)b.classList.add('wrong')});
  let fb=document.getElementById('fb');
  if(i===q.ans){let pts=15+level*5;score+=pts;fb.innerHTML='✅ '+q.explain+' <b>+'+pts+' pts</b>';fb.style.background='rgba(34,197,94,0.15)'}
  else{fb.innerHTML='❌ '+q.explain;fb.style.background='rgba(239,68,68,0.15)'}
  document.getElementById('score').textContent=score;document.getElementById('next-btn').style.display='inline-block';
}

function nextQ(){qNum++;showQ()}
function showResults(){
  document.getElementById('card').innerHTML='<div style="text-align:center"><div style="font-size:3rem;margin-bottom:12px">🏆</div><div style="font-size:1.3rem">Level '+level+' Complete! Score: '+score+'</div><div style="margin-top:16px"><button class="btn" onclick="nextLevel()">Next Level ⬆️</button> <button class="btn sec" onclick="restart()">↺ Restart</button></div></div>';
  document.getElementById('fb').textContent='';document.getElementById('next-btn').style.display='none';
}
function nextLevel(){level++;qNum=0;shuffled=[...questions].sort(()=>Math.random()-0.5);document.getElementById('level').textContent=level;showQ()}
function restart(){score=0;level=1;qNum=0;document.getElementById('score').textContent=0;document.getElementById('level').textContent=1;shuffled=[...questions].sort(()=>Math.random()-0.5);showQ()}
showQ();
</script>
</body>
</html>
