<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cell Biology - Organelles</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #334155}
.topbar a{color:#38bdf8;text-decoration:none;font-weight:600}.topbar a:hover{text-decoration:underline}
.topbar h1{font-size:1.2rem}
.game-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
.stats{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.stats span{background:#1e293b;padding:8px 14px;border-radius:8px;border:1px solid #334155;font-size:.9rem}
.cell-display{width:300px;height:220px;border:50% / 40%;background:radial-gradient(ellipse,#1e3a5f 0%,#1e293b 70%);border:3px solid #38bdf8;border-radius:50%;position:relative;margin:8px 0}
.nucleus{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;background:#475569;border-radius:50%;border:3px solid #64748b;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.card{background:#1e293b;border-radius:16px;padding:20px;max-width:550px;width:100%;text-align:center;border:2px solid #334155}
.q-text{font-size:1rem;margin:10px 0;line-height:1.4}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{background:#0f172a;color:#e2e8f0;border:2px solid #475569;padding:12px;border-radius:8px;font-size:.85rem;cursor:pointer;transition:all .2s}
.opt:hover{border-color:#38bdf8}
.opt.correct{border-color:#22c55e;background:rgba(34,197,94,0.15)}
.opt.wrong{border-color:#ef4444;background:rgba(239,68,68,0.15)}
.opt.disabled{pointer-events:none;opacity:.7}
.fb{margin-top:10px;padding:10px;border-radius:8px;font-size:.9rem;min-height:2em}
.btn{background:#38bdf8;color:#0f172a;border:none;padding:10px 22px;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer}
.btn:hover{background:#7dd3fc}
.btn.sec{background:#475569;color:#e2e8f0}
.progress{width:100%;max-width:550px;height:6px;background:#1e293b;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#38bdf8,#22c55e);transition:width .3s}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">⬅ Back</a><h1>🔬 Cell Biology — Organelles</h1></div>
<div class="game-wrap">
<div class="stats">
<span>⭐ Score: <b id="score">0</b></span>
<span>📊 Level: <b id="level">1</b></span>
<span>❓ Q: <b id="qnum">1</b>/10</span>
</div>
<div class="progress"><div class="progress-fill" id="progress" style="width:0%"></div></div>
<div class="cell-display">
<div class="nucleus">🧬</div>
</div>
<div class="card">
<div class="q-text" id="qtext"></div>
<div class="opts" id="opts"></div>
<div class="fb" id="fb"></div>
</div>
<button class="btn" id="next-btn" style="display:none" onclick="nextQ()">Next ➡️</button>
</div>
<script>
let score=0,level=1,qNum=0,answered=false;
const questions=[
  {q:'Which organelle is the "powerhouse of the cell"?',opts:['Mitochondria','Ribosome','Lysosome','Golgi apparatus'],ans:0,explain:'Mitochondria produce ATP (energy) through cellular respiration.'},
  {q:'Which organelle makes proteins?',opts:['Ribosome','Nucleus','Vacuole','Chloroplast'],ans:0,explain:'Ribosomes read mRNA and assemble amino acids into proteins.'},
  {q:'Which organelle contains DNA and controls the cell?',opts:['Nucleus','Mitochondria','Ribosome','Peroxisome'],ans:0,explain:'The nucleus houses DNA and regulates gene expression.'},
  {q:'Which organelle digests waste and foreign material?',opts:['Lysosome','Ribosome','Golgi body','ER'],ans:0,explain:'Lysosomes contain digestive enzymes to break down waste.'},
  {q:'Which organelle modifies and packages proteins?',opts:['Golgi apparatus','Mitochondria','Nucleus','Ribosome'],ans:0,explain:'The Golgi apparatus modifies, sorts, and packages proteins for transport.'},
  {q:'Which organelle is the site of photosynthesis in plants?',opts:['Chloroplast','Mitochondria','Ribosome','Lysosome'],ans:0,explain:'Chloroplasts capture light energy and convert it to chemical energy.'},
  {q:'Which structure regulates what enters and exits the cell?',opts:['Cell membrane','Cell wall','Nucleus','Ribosome'],ans:0,explain:'The cell membrane is selectively permeable, controlling transport.'},
  {q:'Which organelle folds and transports proteins (rough has ribosomes)?',opts:['Endoplasmic reticulum','Lysosome','Peroxisome','Vacuole'],ans:0,explain:'ER: Rough ER has ribosomes (protein synthesis), Smooth ER makes lipids.'},
  {q:'Which organelle is found in plant cells and stores water?',opts:['Vacuole','Lysosome','Ribosome','Mitochondria'],ans:0,explain:'Large central vacuole maintains turgor pressure in plant cells.'},
  {q:'What is the jelly-like substance that fills the cell?',opts:['Cytoplasm','Nucleus','Cell wall','Ribosome'],ans:0,explain:'Cytoplasm fills the cell and suspends organelles.'},
  {q:'Which organelle breaks down fatty acids and detoxifies?',opts:['Peroxisome','Ribosome','Golgi body','Vacuole'],ans:0,explain:'Peroxisomes break down fatty acids and neutralize hydrogen peroxide.'},
  {q:'What gives plant cells their rigid shape?',opts:['Cell wall','Cell membrane','Nucleus','Vacuole'],ans:0,explain:'The cell wall (made of cellulose) provides structural support.'},
];
let shuffled=[...questions].sort(()=>Math.random()-0.5);

function showQ(){
  if(qNum>=10){showResults();return}
  answered=false;
  document.getElementById('fb').textContent='';document.getElementById('fb').style.background='transparent';
  document.getElementById('next-btn').style.display='none';
  document.getElementById('qnum').textContent=qNum+1;
  document.getElementById('progress').style.width=(qNum/10*100)+'%';
  let q=shuffled[qNum];document.getElementById('qtext').textContent=q.q;
  const opts=document.getElementById('opts');opts.innerHTML='';
  q.opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>check(i);opts.appendChild(b)});
}

function check(i){
  if(answered)return;answered=true;
  let q=shuffled[qNum];
  document.querySelectorAll('.opt').forEach((b,j)=>{if(j===q.ans)b.classList.add('correct');if(j===i&&i!==q.ans)b.classList.add('wrong')});
  let fb=document.getElementById('fb');
  if(i===q.ans){let pts=10+level*5;score+=pts;fb.innerHTML='✅ '+q.explain+' <b>+'+pts+' pts</b>';fb.style.background='rgba(34,197,94,0.15)'}
  else{fb.innerHTML='❌ '+q.explain;fb.style.background='rgba(239,68,68,0.15)'}
  document.getElementById('score').textContent=score;document.getElementById('next-btn').style.display='inline-block';
}

function nextQ(){qNum++;showQ()}
function showResults(){
  document.getElementById('progress').style.width='100%';
  document.getElementById('qtext').innerHTML='🏆 Level '+level+' Complete! Score: '+score;
  document.getElementById('opts').innerHTML='<button class="btn" onclick="nextLevel()">Next Level ⬆️</button> <button class="btn sec" onclick="restart()">↺ Restart</button>';
  document.getElementById('fb').textContent='';document.getElementById('next-btn').style.display='none';
}
function nextLevel(){level++;qNum=0;shuffled=[...questions].sort(()=>Math.random()-0.5);document.getElementById('level').textContent=level;showQ()}
function restart(){score=0;level=1;qNum=0;document.getElementById('score').textContent=0;document.getElementById('level').textContent=1;shuffled=[...questions].sort(()=>Math.random()-0.5);showQ()}
showQ();
</script>
</body>
</html>
