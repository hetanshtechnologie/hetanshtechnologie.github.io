<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chemical Bonds</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #334155}
.topbar a{color:#38bdf8;text-decoration:none;font-weight:600}.topbar a:hover{text-decoration:underline}
.topbar h1{font-size:1.2rem}
.game-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
.stats{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.stats span{background:#1e293b;padding:8px 14px;border-radius:8px;border:1px solid #334155;font-size:.9rem}
.scene{font-size:3rem;text-align:center;margin:8px 0;letter-spacing:4px}
.card{background:#1e293b;border-radius:16px;padding:24px;max-width:600px;width:100%;text-align:center;border:2px solid #334155}
.q-text{font-size:1.05rem;margin:16px 0;line-height:1.5}
.bond-options{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
.bond-btn{background:#0f172a;color:#e2e8f0;border:2px solid #475569;padding:16px;border-radius:12px;font-size:1rem;cursor:pointer;transition:all .2s;text-align:center}
.bond-btn:hover{border-color:#38bdf8;transform:translateY(-2px)}
.bond-btn.correct{border-color:#22c55e;background:rgba(34,197,94,0.15)}
.bond-btn.wrong{border-color:#ef4444;background:rgba(239,68,68,0.15)}
.bond-btn.disabled{pointer-events:none;opacity:.7}
.bond-btn .emoji{font-size:2rem;display:block;margin-bottom:6px}
.fb{margin-top:12px;padding:10px;border-radius:8px;font-size:.95rem;min-height:2em}
.btn{background:#38bdf8;color:#0f172a;border:none;padding:10px 22px;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer}
.btn:hover{background:#7dd3fc}
.btn.sec{background:#475569;color:#e2e8f0}
.info-box{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px;font-size:.8rem;color:#94a3b8;margin-top:8px;text-align:left}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">⬅ Back</a><h1>🔗 Chemical Bonds</h1></div>
<div class="game-wrap">
<div class="stats">
<span>⭐ Score: <b id="score">0</b></span>
<span>📊 Level: <b id="level">1</b></span>
<span>❓ Q: <b id="qnum">1</b>/10</span>
</div>
<div class="scene" id="scene">🧂</div>
<div class="card">
<div class="q-text" id="qtext"></div>
<div class="bond-options" id="opts">
<button class="bond-btn" onclick="pick('ionic')"><span class="emoji">⚡</span>Ionic</button>
<button class="bond-btn" onclick="pick('covalent')"><span class="emoji">🤝</span>Covalent</button>
<button class="bond-btn" onclick="pick('metallic')"><span class="emoji">🔩</span>Metallic</button>
</div>
<div class="fb" id="fb"></div>
<div class="info-box" id="info">
<strong>💡 Remember:</strong> Ionic = transfer electrons (metal+nonmetal) | Covalent = share electrons (nonmetal+nonmetal) | Metallic = electron sea (metals only)
</div>
</div>
<button class="btn" id="next-btn" style="display:none" onclick="nextQ()">Next ➡️</button>
</div>
<script>
let score=0,level=1,qNum=0,answered=false;
const questions=[
  {scene:'🧂',q:'NaCl (table salt) is formed when sodium reacts with chlorine. What type of bond?',ans:'ionic',explain:'Na transfers an electron to Cl — ionic bond between a metal and nonmetal.'},
  {scene:'💧',q:'H₂O (water) has two hydrogen atoms sharing electrons with oxygen. Bond type?',ans:'covalent',explain:'O and H are both nonmetals sharing electrons — covalent bond.'},
  {scene:'🔩',q:'Pure iron (Fe) has iron atoms in a sea of delocalized electrons. Bond type?',ans:'metallic',explain:'Metal atoms share a "sea" of electrons — metallic bond.'},
  {scene:'🧪',q:'MgO (magnesium oxide) — magnesium transfers electrons to oxygen. Bond type?',ans:'ionic',explain:'Mg (metal) transfers electrons to O (nonmetal) — ionic bond.'},
  {scene:'⛽',q:'CH₄ (methane) — carbon shares electrons with four hydrogen atoms. Bond type?',ans:'covalent',explain:'C and H are nonmetals sharing electrons — covalent bond.'},
  {scene:'🥇',q:'Gold (Au) atoms share delocalized electrons. What bond type?',ans:'metallic',explain:'Gold is a pure metal — metallic bonding with delocalized electrons.'},
  {scene:'🧪',q:'KCl (potassium chloride) — K gives an electron to Cl. Bond type?',ans:'ionic',explain:'Potassium (metal) transfers electron to chlorine (nonmetal) — ionic.'},
  {scene:'🌬️',q:'CO₂ (carbon dioxide) — carbon shares double bonds with oxygen. Bond type?',ans:'covalent',explain:'C and O are both nonmetals sharing electrons — covalent bond.'},
  {scene:'🔗',q:'Steel is iron mixed with carbon. The iron-iron bonds are:',ans:'metallic',explain:'Steel\'s iron atoms are held by metallic bonds; carbon atoms fit between them.'},
  {scene:'🧪',q:'CaF₂ (calcium fluoride) — Ca transfers electrons to F. Bond type?',ans:'ionic',explain:'Calcium (metal) transfers electrons to fluorine (nonmetal) — ionic.'},
  {scene:'🔬',q:'N₂ (nitrogen gas) — two nitrogen atoms share a triple bond. Bond type?',ans:'covalent',explain:'N≡N triple bond — two nonmetals sharing three pairs of electrons.'},
  {scene:'🔩',q:'Copper (Cu) in electrical wiring — metallic bond allows:',ans:'metallic',explain:'Metallic bonding allows free electron movement — why metals conduct electricity.'},
  {scene:'🧂',q:'LiF (lithium fluoride) — lithium gives an electron to fluorine. Bond type?',ans:'ionic',explain:'Li (alkali metal) transfers electron to F (halogen) — ionic bond.'},
  {scene:'💧',q:'NH₃ (ammonia) — nitrogen shares electrons with three hydrogens. Bond type?',ans:'covalent',explain:'N and H are nonmetals sharing electrons — covalent bonds.'},
  {scene:'🪙',q:'Brass is a copper-zinc alloy. The copper-copper bonds are:',ans:'metallic',explain:'In alloys, metal atoms are held by metallic bonds.'},
  {scene:'🧪',q:'Na₂O (sodium oxide) — Na transfers electrons to O. Bond type?',ans:'ionic',explain:'Sodium (metal) transfers electrons to oxygen (nonmetal) — ionic.'},
  {scene:'🔬',q:'O₂ (oxygen gas) — two oxygen atoms share a double bond. Bond type?',ans:'covalent',explain:'O=O double bond — two nonmetals sharing two pairs of electrons.'},
  {scene:'⚙️',q:'Tungsten (W) has extremely high melting point. The bond type is:',ans:'metallic',explain:'Tungsten\'s strong metallic bonds require enormous energy to break.'},
  {scene:'🧂',q:'MgCl₂ (magnesium chloride) — Mg transfers electrons to Cl. Bond type?',ans:'ionic',explain:'Magnesium (metal) transfers 2 electrons to chlorine atoms — ionic bond.'},
  {scene:'💨',q:'HF (hydrogen fluoride) — hydrogen shares electrons with fluorine. Bond type?',ans:'covalent',explain:'H and F are nonmetals sharing electrons — polar covalent bond.'},
];
let shuffled=[...questions].sort(()=>Math.random()-0.5);

function showQ(){
  if(qNum>=10){showResults();return}
  answered=false;
  document.getElementById('fb').textContent='';document.getElementById('fb').style.background='transparent';
  document.getElementById('next-btn').style.display='none';
  document.getElementById('qnum').textContent=qNum+1;
  let q=shuffled[qNum];
  document.getElementById('scene').textContent=q.scene;
  document.getElementById('qtext').textContent=q.q;
  document.querySelectorAll('.bond-btn').forEach(b=>{b.classList.remove('correct','wrong','disabled')});
}

function pick(type){
  if(answered)return;answered=true;
  let q=shuffled[qNum];
  document.querySelectorAll('.bond-btn').forEach(b=>{b.classList.add('disabled')});
  let btns=document.querySelectorAll('.bond-btn');
  let types=['ionic','covalent','metallic'];
  btns[types.indexOf(q.ans)].classList.add('correct');
  if(type!==q.ans)btns[types.indexOf(type)].classList.add('wrong');
  let fb=document.getElementById('fb');
  if(type===q.ans){let pts=10+level*5;score+=pts;fb.innerHTML='✅ '+q.explain+' <b>+'+pts+' pts</b>';fb.style.background='rgba(34,197,94,0.15)'}
  else{fb.innerHTML='❌ '+q.explain;fb.style.background='rgba(239,68,68,0.15)'}
  document.getElementById('score').textContent=score;document.getElementById('next-btn').style.display='inline-block';
}

function nextQ(){qNum++;showQ()}
function showResults(){
  document.getElementById('scene').textContent='🏆';
  document.getElementById('qtext').innerHTML='Level '+level+' Complete! Score: '+score;
  document.getElementById('opts').innerHTML='<button class="btn" onclick="nextLevel()">Next Level ⬆️</button> <button class="btn sec" onclick="restart()">↺ Restart</button>';
  document.getElementById('fb').textContent='';document.getElementById('next-btn').style.display='none';
}
function nextLevel(){level++;qNum=0;shuffled=[...questions].sort(()=>Math.random()-0.5);document.getElementById('level').textContent=level;showQ()}
function restart(){score=0;level=1;qNum=0;document.getElementById('score').textContent=0;document.getElementById('level').textContent=1;shuffled=[...questions].sort(()=>Math.random()-0.5);showQ()}
showQ();
</script>
</body>
</html>
