<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Periodic Table Quiz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #334155}
.topbar a{color:#38bdf8;text-decoration:none;font-weight:600}.topbar a:hover{text-decoration:underline}
.topbar h1{font-size:1.2rem}
.game-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
.stats{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.stats span{background:#1e293b;padding:8px 14px;border-radius:8px;border:1px solid #334155;font-size:.9rem}
.element-display{width:160px;height:160px;border:3px solid #38bdf8;border-radius:16px;background:#1e293b;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.el-num{position:absolute;top:8px;left:12px;font-size:.75rem;color:#94a3b8}
.el-symbol{font-size:3.5rem;font-weight:900;color:#38bdf8}
.el-mass{font-size:.8rem;color:#64748b;margin-top:4px}
.card{background:#1e293b;border-radius:16px;padding:24px;max-width:600px;width:100%;text-align:center;border:2px solid #334155}
.q-text{font-size:1.05rem;margin:16px 0;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{background:#0f172a;color:#e2e8f0;border:2px solid #475569;padding:14px;border-radius:10px;font-size:.9rem;cursor:pointer;transition:all .2s}
.opt:hover{border-color:#38bdf8}
.opt.correct{border-color:#22c55e;background:rgba(34,197,94,0.15)}
.opt.wrong{border-color:#ef4444;background:rgba(239,68,68,0.15)}
.opt.disabled{pointer-events:none;opacity:.7}
.fb{margin-top:12px;padding:10px;border-radius:8px;font-size:.95rem;min-height:2em}
.btn{background:#38bdf8;color:#0f172a;border:none;padding:10px 22px;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer}
.btn:hover{background:#7dd3fc}
.btn.sec{background:#475569;color:#e2e8f0}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">⬅ Back</a><h1>⚛️ Periodic Table Quiz</h1></div>
<div class="game-wrap">
<div class="stats">
<span>⭐ Score: <b id="score">0</b></span>
<span>📊 Level: <b id="level">1</b></span>
<span>❓ Q: <b id="qnum">1</b>/10</span>
</div>
<div class="element-display" id="el-display">
<span class="el-num" id="el-num">1</span>
<span class="el-symbol" id="el-sym">H</span>
<span class="el-mass" id="el-mass">1.008</span>
</div>
<div class="card">
<div class="q-text" id="qtext"></div>
<div class="opts" id="opts"></div>
<div class="fb" id="fb"></div>
</div>
<button class="btn" id="next-btn" style="display:none" onclick="nextQ()">Next ➡️</button>
</div>
<script>
let score=0,level=1,qNum=0,answered=false;
const elements=[
  {sym:'H',name:'Hydrogen',num:1,mass:'1.008',group:'Nonmetal',qtype:'name'},
  {sym:'He',name:'Helium',num:2,mass:'4.003',group:'Noble Gas',qtype:'name'},
  {sym:'Li',name:'Lithium',num:3,mass:'6.941',group:'Alkali Metal',qtype:'name'},
  {sym:'C',name:'Carbon',num:6,mass:'12.011',group:'Nonmetal',qtype:'name'},
  {sym:'N',name:'Nitrogen',num:7,mass:'14.007',group:'Nonmetal',qtype:'name'},
  {sym:'O',name:'Oxygen',num:8,mass:'15.999',group:'Nonmetal',qtype:'name'},
  {sym:'Na',name:'Sodium',num:11,mass:'22.990',group:'Alkali Metal',qtype:'name'},
  {sym:'Fe',name:'Iron',num:26,mass:'55.845',group:'Transition Metal',qtype:'name'},
  {sym:'Cu',name:'Copper',num:29,mass:'63.546',group:'Transition Metal',qtype:'name'},
  {sym:'Au',name:'Gold',num:79,mass:'196.97',group:'Transition Metal',qtype:'name'},
  {sym:'Ag',name:'Silver',num:47,mass:'107.87',group:'Transition Metal',qtype:'name'},
  {sym:'Ca',name:'Calcium',num:20,mass:'40.078',group:'Alkaline Earth',qtype:'name'},
  {sym:'Cl',name:'Chlorine',num:17,mass:'35.453',group:'Halogen',qtype:'name'},
  {sym:'Ne',name:'Neon',num:10,mass:'20.180',group:'Noble Gas',qtype:'name'},
  {sym:'K',name:'Potassium',num:19,mass:'39.098',group:'Alkali Metal',qtype:'name'},
  {sym:'Mg',name:'Magnesium',num:12,mass:'24.305',group:'Alkaline Earth',qtype:'name'},
  {sym:'Al',name:'Aluminum',num:13,mass:'26.982',group:'Post-Transition',qtype:'name'},
  {sym:'Si',name:'Silicon',num:14,mass:'28.086',group:'Metalloid',qtype:'name'},
  {sym:'S',name:'Sulfur',num:16,mass:'32.065',group:'Nonmetal',qtype:'name'},
  {sym:'P',name:'Phosphorus',num:15,mass:'30.974',group:'Nonmetal',qtype:'name'},
  {sym:'Ti',name:'Titanium',num:22,mass:'47.867',group:'Transition Metal',qtype:'name'},
  {sym:'Zn',name:'Zinc',num:30,mass:'65.380',group:'Transition Metal',qtype:'name'},
  {sym:'Br',name:'Bromine',num:35,mass:'79.904',group:'Halogen',qtype:'name'},
  {sym:'I',name:'Iodine',num:53,mass:'126.90',group:'Halogen',qtype:'name'},
  {sym:'W',name:'Tungsten',num:74,mass:'183.84',group:'Transition Metal',qtype:'name'},
];

function makeQuestion(){
  let type=Math.random();
  if(type<0.4){
    // given element, pick correct name
    let el=elements[Math.floor(Math.random()*elements.length)];
    let wrongs=elements.filter(e=>e.name!==el.name).sort(()=>Math.random()-0.5).slice(0,3);
    let opts=[el.name,...wrongs.map(w=>w.name)].sort(()=>Math.random()-0.5);
    return {type:'name',el,q:'What is the name of element '+el.sym+'?',opts,ans:opts.indexOf(el.name)};
  }else if(type<0.7){
    // given name, pick correct symbol
    let el=elements[Math.floor(Math.random()*elements.length)];
    let wrongs=elements.filter(e=>e.sym!==el.sym).sort(()=>Math.random()-0.5).slice(0,3);
    let opts=[el.sym,...wrongs.map(w=>w.sym)].sort(()=>Math.random()-0.5);
    return {type:'symbol',el,q:'What is the chemical symbol for '+el.name+'?',opts,ans:opts.indexOf(el.sym)};
  }else{
    // given element, pick group
    let el=elements[Math.floor(Math.random()*elements.length)];
    let groups=[...new Set(elements.map(e=>e.group))];
    let wrongs=groups.filter(g=>g!==el.group).sort(()=>Math.random()-0.5).slice(0,3);
    let opts=[el.group,...wrongs].sort(()=>Math.random()-0.5);
    return {type:'group',el,q:'Which group does '+el.name+' ('+el.sym+') belong to?',opts,ans:opts.indexOf(el.group)};
  }
}

let currentQ;

function showQ(){
  if(qNum>=10){showResults();return}
  answered=false;
  document.getElementById('fb').textContent='';document.getElementById('fb').style.background='transparent';
  document.getElementById('next-btn').style.display='none';
  document.getElementById('qnum').textContent=qNum+1;
  currentQ=makeQuestion();
  document.getElementById('el-num').textContent=currentQ.el.num;
  document.getElementById('el-sym').textContent=currentQ.el.sym;
  document.getElementById('el-mass').textContent=currentQ.el.mass;
  document.getElementById('qtext').textContent=currentQ.q;
  const opts=document.getElementById('opts');opts.innerHTML='';
  currentQ.opts.forEach((o,i)=>{
    const b=document.createElement('button');b.className='opt';b.textContent=o;
    b.onclick=()=>check(i);opts.appendChild(b);
  });
}

function check(i){
  if(answered)return;answered=true;
  document.querySelectorAll('.opt').forEach((b,j)=>{if(j===currentQ.ans)b.classList.add('correct');if(j===i&&i!==currentQ.ans)b.classList.add('wrong')});
  let fb=document.getElementById('fb');
  if(i===currentQ.ans){let pts=10+level*5;score+=pts;fb.innerHTML='✅ Correct! '+currentQ.el.name+' ('+currentQ.el.sym+') — atomic number '+currentQ.el.num+'. <b>+'+pts+' pts</b>';fb.style.background='rgba(34,197,94,0.15)'}
  else{fb.innerHTML='❌ Wrong! The answer is <b>'+currentQ.opts[currentQ.ans]+'</b>. '+currentQ.el.name+' is atomic number '+currentQ.el.num+'.';fb.style.background='rgba(239,68,68,0.15)'}
  document.getElementById('score').textContent=score;document.getElementById('next-btn').style.display='inline-block';
}

function nextQ(){qNum++;showQ()}
function showResults(){
  document.getElementById('el-display').innerHTML='<div style="font-size:3rem">🏆</div>';
  document.getElementById('qtext').innerHTML='Level '+level+' Complete! Score: '+score;
  document.getElementById('opts').innerHTML='<button class="btn" onclick="nextLevel()">Next Level ⬆️</button> <button class="btn sec" onclick="restart()">↺ Restart</button>';
  document.getElementById('fb').textContent='';document.getElementById('next-btn').style.display='none';
}
function nextLevel(){level++;qNum=0;document.getElementById('level').textContent=level;showQ()}
function restart(){score=0;level=1;qNum=0;document.getElementById('score').textContent=0;document.getElementById('level').textContent=1;showQ()}
showQ();
</script>
</body>
</html>
