<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speed, Distance & Time</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #334155}
.topbar a{color:#38bdf8;text-decoration:none;font-weight:600}.topbar a:hover{text-decoration:underline}
.topbar h1{font-size:1.2rem}
.game-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
.stats{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.stats span{background:#1e293b;padding:8px 14px;border-radius:8px;border:1px solid #334155;font-size:.9rem}
.formula-display{background:#1e293b;border:2px solid #334155;border-radius:12px;padding:16px;text-align:center;max-width:400px;width:100%}
.formula-display .formula{font-size:1.8rem;font-weight:700;color:#f59e0b;margin:8px 0}
.formula-display .vars{font-size:.85rem;color:#94a3b8}
.card{background:#1e293b;border-radius:16px;padding:24px;max-width:600px;width:100%;text-align:center;border:2px solid #334155}
.scenario-icon{font-size:3rem;margin:8px 0}
.q-text{font-size:1rem;margin:12px 0;line-height:1.5}
.answer-section{margin:16px 0}
.answer-input{background:#0f172a;border:2px solid #475569;color:#e2e8f0;padding:12px;border-radius:8px;font-size:1.2rem;text-align:center;width:120px;outline:none}
.answer-input:focus{border-color:#38bdf8}
.answer-input.correct{border-color:#22c55e}
.answer-input.wrong{border-color:#ef4444}
.unit{color:#94a3b8;margin-left:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opt{background:#0f172a;color:#e2e8f0;border:2px solid #475569;padding:10px;border-radius:8px;font-size:.85rem;cursor:pointer;transition:all .2s}
.opt:hover{border-color:#38bdf8}
.opt.correct{border-color:#22c55e;background:rgba(34,197,94,0.15)}
.opt.wrong{border-color:#ef4444;background:rgba(239,68,68,0.15)}
.opt.disabled{pointer-events:none;opacity:.7}
.fb{margin-top:12px;padding:10px;border-radius:8px;font-size:.9rem;min-height:2em}
.btn{background:#38bdf8;color:#0f172a;border:none;padding:10px 22px;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer}
.btn:hover{background:#7dd3fc}
.btn.sec{background:#475569;color:#e2e8f0}
.hint-box{background:#0f172a;border:1px solid #475569;border-radius:8px;padding:10px;font-size:.8rem;color:#94a3b8;margin-top:8px;text-align:left}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">⬅ Back</a><h1>🏃 Speed, Distance & Time</h1></div>
<div class="game-wrap">
<div class="stats">
<span>⭐ Score: <b id="score">0</b></span>
<span>📊 Level: <b id="level">1</b></span>
<span>❓ Q: <b id="qnum">1</b>/8</span>
</div>
<div class="formula-display">
<div class="formula">s = d ÷ t</div>
<div class="vars">speed = distance ÷ time | d = s × t | t = d ÷ s</div>
</div>
<div class="card">
<div class="scenario-icon" id="icon">🚗</div>
<div class="q-text" id="qtext"></div>
<div id="input-area"></div>
<div class="fb" id="fb"></div>
<div class="hint-box" id="hint" style="display:none"></div>
</div>
<div style="display:flex;gap:10px">
<button class="btn sec" onclick="showHintBox()">💡 Hint</button>
<button class="btn sec" onclick="showAnswer()">👁️ Show Answer</button>
<button class="btn" id="next-btn" style="display:none" onclick="nextQ()">Next ➡️</button>
</div>
</div>
<script>
let score=0,level=1,qNum=0,answered=false;
const questions=[
  {icon:'🚗',q:'A car travels 150 km in 3 hours. What is its average speed?',type:'number',answer:50,unit:'km/h',hint:'Speed = Distance ÷ Time = 150 ÷ 3'},
  {icon:'🏃',q:'A runner covers 400 meters in 50 seconds. What is their speed?',type:'number',answer:8,unit:'m/s',hint:'Speed = 400 ÷ 50 = 8 m/s'},
  {icon:'✈️',q:'An airplane flies at 800 km/h. How far does it travel in 2.5 hours?',type:'number',answer:2000,unit:'km',hint:'Distance = Speed × Time = 800 × 2.5'},
  {icon:'🚴',q:'A cyclist rides at 15 km/h. How long to travel 45 km?',type:'number',answer:3,unit:'hours',hint:'Time = Distance ÷ Speed = 45 ÷ 15'},
  {icon:'🚂',q:'A train travels 360 km in 4 hours. What is its speed?',type:'number',answer:90,unit:'km/h',hint:'Speed = 360 ÷ 4 = 90 km/h'},
  {icon:'🚶',q:'Walking at 5 km/h, how far do you get in 2.4 hours?',type:'number',answer:12,unit:'km',hint:'Distance = 5 × 2.4 = 12 km'},
  {icon:'🚀',q:'Light travels at 300,000 km/s. How far in 0.01 seconds?',type:'number',answer:3000,unit:'km',hint:'Distance = 300,000 × 0.01 = 3,000 km'},
  {icon:'🐢',q:'A turtle moves at 0.5 m/s. How long to cross a 2m road?',type:'number',answer:4,unit:'seconds',hint:'Time = 2 ÷ 0.5 = 4 seconds'},
  {icon:'⚽',q:'A ball rolls 30 meters in 6 seconds. Speed?',type:'number',answer:5,unit:'m/s',hint:'Speed = 30 ÷ 6 = 5 m/s'},
  {icon:'🏊',q:'A swimmer goes 200m in 100s. What is their speed?',type:'number',answer:2,unit:'m/s',hint:'Speed = 200 ÷ 100 = 2 m/s'},
  {icon:'🏍️',q:'Motorcycle at 120 km/h — distance in 1.5 hours?',type:'number',answer:180,unit:'km',hint:'Distance = 120 × 1.5 = 180 km'},
  {icon:'🛹',q:'Skateboarder travels 60m in 12s. Speed?',type:'number',answer:5,unit:'m/s',hint:'Speed = 60 ÷ 12 = 5 m/s'},
];
let shuffled=[...questions].sort(()=>Math.random()-0.5);

function showQ(){
  if(qNum>=8){showResults();return}
  answered=false;
  document.getElementById('fb').textContent='';document.getElementById('fb').style.background='transparent';
  document.getElementById('next-btn').style.display='none';
  document.getElementById('hint').style.display='none';
  document.getElementById('qnum').textContent=qNum+1;
  let q=shuffled[qNum];
  document.getElementById('icon').textContent=q.icon;
  document.getElementById('qtext').textContent=q.q;
  let html='<div class="answer-section"><input class="answer-input" id="ans" type="number" placeholder="?" autofocus><span class="unit">'+q.unit+'</span></div>';
  html+='<button class="btn" onclick="checkAnswer()" style="margin-top:8px">Check ✅</button>';
  document.getElementById('input-area').innerHTML=html;
  document.getElementById('ans').addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer()});
}

function checkAnswer(){
  if(answered)return;
  let q=shuffled[qNum];
  let val=parseFloat(document.getElementById('ans').value);
  if(isNaN(val))return;
  answered=true;
  let input=document.getElementById('ans');
  if(Math.abs(val-q.answer)<0.01){
    input.classList.add('correct');
    let pts=15+level*5;score+=pts;
    document.getElementById('fb').innerHTML='✅ Correct! '+q.hint+' <b>+'+pts+' pts</b>';
    document.getElementById('fb').style.background='rgba(34,197,94,0.15)';
  }else{
    input.classList.add('wrong');
    document.getElementById('fb').innerHTML='❌ Wrong! The answer is <b>'+q.answer+' '+q.unit+'</b>. '+q.hint;
    document.getElementById('fb').style.background='rgba(239,68,68,0.15)';
  }
  input.disabled=true;document.getElementById('score').textContent=score;
  document.getElementById('next-btn').style.display='inline-block';
}

function showHintBox(){
  if(shuffled[qNum])document.getElementById('hint').textContent='💡 '+shuffled[qNum].hint;
  document.getElementById('hint').style.display='block';
}
function showAnswer(){
  if(!answered&&shuffled[qNum]){
    document.getElementById('ans').value=shuffled[qNum].answer;checkAnswer();
  }
}

function nextQ(){qNum++;showQ()}
function showResults(){
  document.getElementById('input-area').innerHTML='';
  document.getElementById('icon').textContent='🏆';
  document.getElementById('qtext').innerHTML='Level '+level+' Complete! Score: '+score;
  document.getElementById('fb').innerHTML='<button class="btn" onclick="nextLevel()">Next Level ⬆️</button> <button class="btn sec" onclick="restart()">↺ Restart</button>';
  document.getElementById('next-btn').style.display='none';
}
function nextLevel(){level++;qNum=0;shuffled=[...questions].sort(()=>Math.random()-0.5);document.getElementById('level').textContent=level;showQ()}
function restart(){score=0;level=1;qNum=0;document.getElementById('score').textContent=0;document.getElementById('level').textContent=1;shuffled=[...questions].sort(()=>Math.random()-0.5);showQ()}
showQ();
</script>
</body>
</html>
