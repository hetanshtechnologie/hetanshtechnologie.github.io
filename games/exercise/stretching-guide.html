<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stretching Guide 🧘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top-bar{width:100%;padding:12px 20px;background:#1e293b;display:flex;justify-content:space-between;align-items:center}
.top-bar a{color:#38bdf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px}
.game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:500px;padding:20px}
.hidden{display:none}
.result-card{background:#1e293b;border-radius:16px;padding:30px;text-align:center}
.result-card h2{color:#06b6d4}
.result-card p{color:#94a3b8;margin:5px 0}
.play-again{background:#06b6d4;color:#0f172a;border:none;padding:14px 40px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:15px}
.stretch-card{background:#1e293b;border-radius:16px;padding:24px;text-align:center;width:100%;margin:10px 0}
.stretch-emoji{font-size:64px;margin:10px 0}
.stretch-name{font-size:22px;font-weight:bold;color:#06b6d4;margin:5px 0}
.stretch-desc{font-size:14px;color:#94a3b8;margin:5px 0}
.hold-timer{font-size:48px;font-weight:bold;color:#f59e0b;font-family:'Courier New',monospace;margin:10px 0}
.hold-bar{width:100%;height:12px;background:#0f172a;border-radius:6px;margin:10px 0;overflow:hidden}
.hold-fill{height:100%;background:linear-gradient(90deg,#06b6d4,#22d3ee);border-radius:6px;transition:width .1s linear}
.stretch-progress{display:flex;gap:6px;margin:10px 0}
.stretch-dot{width:12px;height:12px;border-radius:50%;background:#334155}
.stretch-dot.done{background:#22c55e}
.stretch-dot.current{background:#06b6d4}
.btn{padding:12px 24px;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
.btn-start{background:#06b6d4;color:#0f172a}
.btn-next{background:#22c55e;color:#fff}
.btn-hold{background:#f59e0b;color:#0f172a;width:160px;height:160px;border-radius:50%;font-size:20px}
.btn-hold:active{transform:scale(.95)}
.score-display{display:flex;gap:15px;margin:10px 0}
.score-box{background:#1e293b;padding:10px 18px;border-radius:10px;text-align:center}
.score-box .label{font-size:12px;color:#94a3b8}
.score-box .value{font-size:20px;font-weight:bold;color:#06b6d4}
</style>
</head>
<body>
<div class="top-bar"><a href="../index.html">← Back</a><h1>Stretching Guide 🧘</h1><span></span></div>
<div class="game" id="startScreen">
  <div style="font-size:80px;animation:bounce 1s infinite">🧘</div>
  <style>@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}</style>
  <h2 style="margin:15px 0">Stretching Routine</h2>
  <p style="color:#94a3b8;text-align:center">Follow along with stretches!<br>Hold each stretch for the timer.</p>
  <button class="play-again btn btn-start" onclick="startRoutine()">Start Routine</button>
</div>
<div class="game hidden" id="gameScreen">
  <div class="score-display">
    <div class="score-box"><div class="label">STRETCH</div><div class="value" id="stretchNum">1/8</div></div>
    <div class="score-box"><div class="label">HELD</div><div class="value" id="heldCount">0</div></div>
  </div>
  <div class="stretch-progress" id="stretchDots"></div>
  <div class="stretch-card">
    <div class="stretch-emoji" id="stretchEmoji">🙆</div>
    <div class="stretch-name" id="stretchName">Neck Roll</div>
    <div class="stretch-desc" id="stretchDesc">Slowly roll your neck in circles</div>
    <div class="hold-bar"><div class="hold-fill" id="holdFill" style="width:0%"></div></div>
    <div class="hold-timer" id="holdTimer">15</div>
    <div style="color:#94a3b8;font-size:13px">Hold the button to stretch</div>
  </div>
  <button class="btn btn-hold" id="holdBtn" onmousedown="startHold()" onmouseup="stopHold()" ontouchstart="startHold()" ontouchend="stopHold()">HOLD TO STRETCH</button>
</div>
<div class="game hidden" id="resultScreen">
  <div class="result-card">
    <div style="font-size:80px">🏆</div>
    <h2>Great Stretching!</h2>
    <p>Stretches Completed: <span id="finalStretches">0</span>/8</p>
    <p>Total Hold Time: <span id="finalTime">0s</span></p>
    <p>Score: <span id="finalScore">0</span></p>
    <button class="play-again" onclick="resetGame()">Play Again</button>
  </div>
</div>
<script>
const stretches=[
  {emoji:'🙆',name:'Neck Roll',desc:'Slowly roll your neck in circles',hold:15},
  {emoji:'🙆‍♂️',name:'Shoulder Stretch',desc:'Pull one arm across your chest',hold:20},
  {emoji:'手臂',name:'Triceps Stretch',desc:'Pull elbow behind your head',hold:20},
  {emoji:'🧘',name:'Seated Forward Bend',desc:'Reach for your toes while seated',hold:25},
  {emoji:'🦵',name:'Quad Stretch',desc:'Pull your foot to your glutes',hold:20},
  {emoji:'🧘‍♀️',name:'Butterfly Stretch',desc:'Press soles of feet together',hold:20},
  {emoji:'🤸',name:'Cat-Cow Stretch',desc:'Alternate arching and rounding back',hold:15},
  {emoji:'🧘',name:'Child\'s Pose',desc:'Sit back on heels, arms forward',hold:20}
];
let currentStretch=0,totalHeld=0,holdTime=0,holdInt=null,holding=false,score=0,completed=0;
function startRoutine(){document.getElementById('startScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');currentStretch=0;totalHeld=0;completed=0;score=0;buildDots();showStretch()}
function buildDots(){let d=document.getElementById('stretchDots');d.innerHTML='';stretches.forEach((_,i)=>{let dot=document.createElement('div');dot.className='stretch-dot';dot.id='sd'+i;d.appendChild(dot)});updateDots()}
function updateDots(){stretches.forEach((_,i)=>{let dot=document.getElementById('sd'+i);if(!dot)return;dot.className='stretch-dot';if(i<currentStretch)dot.classList.add('done');if(i===currentStretch)dot.classList.add('current')})}
function showStretch(){
  if(currentStretch>=stretches.length){endGame();return}
  let s=stretches[currentStretch];holdTime=s.hold;
  document.getElementById('stretchEmoji').textContent=s.emoji;
  document.getElementById('stretchName').textContent=s.name;
  document.getElementById('stretchDesc').textContent=s.desc;
  document.getElementById('holdTimer').textContent=holdTime;
  document.getElementById('holdFill').style.width='0%';
  document.getElementById('stretchNum').textContent=(currentStretch+1)+'/'+stretches.length;
  updateDots();
}
function startHold(){
  if(holding)return;holding=true;
  holdInt=setInterval(()=>{
    holdTime-=0.1;
    let pct=((stretches[currentStretch].hold-holdTime)/stretches[currentStretch].hold)*100;
    document.getElementById('holdFill').style.width=Math.max(0,pct)+'%';
    document.getElementById('holdTimer').textContent=Math.max(0,Math.ceil(holdTime));
    totalHeld++;score+=5;
    if(holdTime<=0){
      clearInterval(holdInt);holding=false;completed++;score+=50;
      currentStretch++;showStretch();
    }
  },100);
}
function stopHold(){if(holding){clearInterval(holdInt);holding=false}}
function resetGame(){document.getElementById('resultScreen').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden')}
function endGame(){clearInterval(holdInt);document.getElementById('gameScreen').classList.add('hidden');document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('finalStretches').textContent=completed;document.getElementById('finalTime').textContent=totalHeld/10+'s';document.getElementById('finalScore').textContent=score}
</script>
</body></html>
