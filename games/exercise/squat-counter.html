<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Squat Counter 🏋️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top-bar{width:100%;padding:12px 20px;background:#1e293b;display:flex;justify-content:space-between;align-items:center}
.top-bar a{color:#38bdf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px;color:#e2e8f0}
.game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:500px;padding:20px}
.big-emoji{font-size:80px;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.counter{font-size:72px;font-weight:bold;color:#a78bfa;margin:10px 0}
.timer{font-size:28px;color:#f59e0b;margin:5px 0}
.level-info{font-size:16px;color:#94a3b8;margin:5px 0}
.tap-btn{width:180px;height:180px;border-radius:50%;background:linear-gradient(135deg,#a78bfa,#7c3aed);border:none;color:#fff;font-size:28px;font-weight:bold;cursor:pointer;margin:20px 0;transition:transform .1s}
.tap-btn:active{transform:scale(.92)}
.progress-bar{width:100%;height:12px;background:#1e293b;border-radius:6px;margin:10px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#c084fc);border-radius:6px;transition:width .3s}
.hidden{display:none}
.result-card{background:#1e293b;border-radius:16px;padding:30px;text-align:center}
.result-card h2{color:#a78bfa;margin-bottom:10px}
.result-card p{color:#94a3b8;margin:5px 0}
.play-again{background:#a78bfa;color:#fff;border:none;padding:14px 40px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:15px}
.play-again:hover{background:#c4b5fd}
.score-display{display:flex;gap:20px;margin:10px 0}
.score-box{background:#1e293b;padding:10px 20px;border-radius:10px;text-align:center}
.score-box .label{font-size:12px;color:#94a3b8}
.score-box .value{font-size:22px;font-weight:bold;color:#a78bfa}
</style>
</head>
<body>
<div class="top-bar"><a href="../index.html">← Back</a><h1>Squat Counter 🏋️</h1><span></span></div>
<div class="game" id="startScreen">
  <div class="big-emoji">🦵</div>
  <h2 style="margin:15px 0">Squat Counter</h2>
  <p style="color:#94a3b8;text-align:center">Tap each time you complete a squat!<br>Reach target reps to level up.</p>
  <button class="play-again" onclick="startGame()">Start</button>
</div>
<div class="game hidden" id="gameScreen">
  <div class="timer" id="timer">⏱️ 0:00</div>
  <div class="level-info" id="levelInfo">Level 1 - Target: 8</div>
  <div class="score-display">
    <div class="score-box"><div class="label">REPS</div><div class="value" id="repCount">0</div></div>
    <div class="score-box"><div class="label">TARGET</div><div class="value" id="targetDisplay">8</div></div>
  </div>
  <div class="big-emoji" id="exerciseEmoji">🦵</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div id="status" style="min-height:24px;color:#22c55e;font-size:16px"></div>
  <button class="tap-btn" onclick="doRep()">SQUAT!</button>
</div>
<div class="game hidden" id="resultScreen">
  <div class="result-card">
    <div class="big-emoji" style="animation:none">🏆</div>
    <h2>Leg Day Complete!</h2>
    <p>Total Reps: <span id="finalReps">0</span></p>
    <p>Time: <span id="finalTime">0:00</span></p>
    <p>Level: <span id="finalLevel">1</span></p>
    <p>Score: <span id="finalScore">0</span></p>
    <button class="play-again" onclick="resetGame()">Play Again</button>
  </div>
</div>
<script>
let level=1,reps=0,target=8,score=0,seconds=0,timerInt=null,started=false,emojis=['🦵','🏋️','🔥','💪'];
function startGame(){document.getElementById('startScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');level=1;reps=0;target=8;score=0;seconds=0;updateDisplay();timerInt=setInterval(()=>{seconds++;document.getElementById('timer').textContent='⏱️ '+fmt(seconds)},1000);started=true}
function fmt(s){let m=Math.floor(s/60);return m+':'+(s%60<10?'0':'')+(s%60)}
function doRep(){
  if(!started)return;
  reps++;score+=10+level*3;
  let e=document.getElementById('exerciseEmoji');
  e.textContent=emojis[Math.floor(Math.random()*emojis.length)];
  e.style.transform='scale(1.3)';setTimeout(()=>e.style.transform='scale(1)',150);
  if(reps>=target){
    level++;target+=5+level;reps=0;
    document.getElementById('status').textContent='🎉 Level '+level+'!';
  }else{document.getElementById('status').textContent=''}
  updateDisplay();
}
function updateDisplay(){
  document.getElementById('repCount').textContent=reps;
  document.getElementById('targetDisplay').textContent=target;
  document.getElementById('levelInfo').textContent='Level '+level+' - Target: '+target;
  document.getElementById('progressFill').style.width=(reps/target*100)+'%';
}
function resetGame(){clearInterval(timerInt);started=false;document.getElementById('resultScreen').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden')}
function endGame(){started=false;clearInterval(timerInt);document.getElementById('gameScreen').classList.add('hidden');document.getElementById('resultScreen').classList.remove('hidden');document.getElementById('finalReps').textContent=Math.floor(score/10);document.getElementById('finalTime').textContent=fmt(seconds);document.getElementById('finalLevel').textContent=level;document.getElementById('finalScore').textContent=score}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!document.getElementById('gameScreen').classList.contains('hidden')){e.preventDefault();doRep()}});
</script>
</body></html>
