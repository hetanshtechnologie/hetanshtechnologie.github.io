<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cardio Zone ❤️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top-bar{width:100%;padding:12px 20px;background:#1e293b;display:flex;justify-content:space-between;align-items:center}
.top-bar a{color:#38bdf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px}
.game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:500px;padding:20px}
.hidden{display:none}
.result-card{background:#1e293b;border-radius:16px;padding:30px;text-align:center}
.result-card h2{color:#ef4444}
.result-card p{color:#94a3b8;margin:5px 0}
.play-again{background:#ef4444;color:#fff;border:none;padding:14px 40px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:15px}
.heart-big{font-size:80px;color:#ef4444}
.heart-beat{animation:heartbeat 1s infinite}
@keyframes heartbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
.zone-card{background:#1e293b;border-radius:16px;padding:20px;width:100%;margin:8px 0}
.zone-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.zone-bar{height:20px;border-radius:10px;display:flex;align-items:center;padding:0 12px;font-size:12px;font-weight:bold;color:#fff}
.age-input{display:flex;gap:10px;margin:15px 0;align-items:center}
.age-input label{color:#94a3b8;font-size:14px}
.age-input input{width:80px;padding:10px;border-radius:8px;background:#0f172a;border:2px solid #334155;color:#e2e8f0;font-size:18px;text-align:center}
.btn{padding:12px 24px;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
.btn-start{background:#ef4444;color:#fff}
.quiz-section{width:100%;margin:15px 0}
.quiz-q{font-size:18px;font-weight:bold;margin:10px 0;color:#ef4444;text-align:center}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.quiz-opt{padding:12px;border-radius:10px;background:#0f172a;border:2px solid #334155;color:#e2e8f0;font-size:14px;cursor:pointer;text-align:left}
.quiz-opt:hover{border-color:#ef4444}
.quiz-opt.correct{border-color:#22c55e;background:#166534}
.quiz-opt.wrong{border-color:#ef4444;background:#7f1d1d}
.quiz-opt:disabled{cursor:default}
.feedback{font-size:16px;min-height:24px;margin:10px 0;font-weight:bold;text-align:center}
.score-display{display:flex;gap:15px;margin:10px 0}
.score-box{background:#1e293b;padding:10px 18px;border-radius:10px;text-align:center}
.score-box .label{font-size:12px;color:#94a3b8}
.score-box .value{font-size:22px;font-weight:bold;color:#ef4444}
.progress-bar{width:100%;height:12px;background:#1e293b;border-radius:6px;margin:10px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#ef4444,#f97316);border-radius:6px;transition:width .3s}
</style>
</head>
<body>
<div class="top-bar"><a href="../index.html">← Back</a><h1>Cardio Zone ❤️</h1><span></span></div>
<div class="game" id="startScreen">
  <div class="heart-big heart-beat">❤️</div>
  <h2 style="margin:15px 0">Heart Rate Zone Quiz</h2>
  <p style="color:#94a3b8;text-align:center">Learn about heart rate training zones!<br>Calculate zones and answer quiz questions.</p>
  <div class="age-input">
    <label>Your Age:</label>
    <input type="number" id="ageInput" value="25" min="10" max="100">
  </div>
  <button class="play-again btn btn-start" onclick="startGame()">Start</button>
</div>
<div class="game hidden" id="gameScreen">
  <div class="score-display">
    <div class="score-box"><div class="label">SCORE</div><div class="value" id="scoreVal">0</div></div>
    <div class="score-box"><div class="label">Q#</div><div class="value" id="qNum">1/8</div></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div id="zonesSection"></div>
  <div class="quiz-section">
    <div class="quiz-q" id="quizQ"></div>
    <div class="quiz-opts" id="quizOpts"></div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>
<div class="game hidden" id="resultScreen">
  <div class="result-card">
    <div class="heart-big" style="animation:none">🏆</div>
    <h2>Heart Health Expert!</h2>
    <p>Correct: <span id="finalCorrect">0</span>/8</p>
    <p>Score: <span id="finalScore">0</span></p>
    <p id="finalMsg"></p>
    <button class="play-again" onclick="resetGame()">Play Again</button>
  </div>
</div>
<script>
let age=25,score=0,correctCount=0,currentQ=0,answered=false;
const zones=[
  {name:'Zone 1 - Warm Up',color:'#3b82f6',pct:[50,60],desc:'Easy effort, recovery'},
  {name:'Zone 2 - Fat Burn',color:'#22c55e',pct:[60,70],desc:'Moderate, endurance'},
  {name:'Zone 3 - Cardio',color:'#f59e0b',pct:[70,80],desc:'Challenging, aerobic'},
  {name:'Zone 4 - Hard',color:'#f97316',pct:[80,90],desc:'Intense, anaerobic'},
  {name:'Zone 5 - Maximum',color:'#ef4444',pct:[90,100],desc:'All-out effort'}
];
const quizQuestions=[
  {q:'Which zone burns the most fat percentage-wise?',opts:['Zone 5','Zone 1','Zone 2','Zone 4'],correct:2},
  {q:'What is maximum heart rate approximately?',opts:['220 - age','200 - age','240 - age','180 + age'],correct:0},
  {q:'Zone 3 is best for improving...',opts:['Flexibility','Aerobic capacity','Muscle mass','Bone density'],correct:1},
  {q:'How long should you stay in Zone 5?',opts:['30+ minutes','5-10 minutes','1-2 minutes','60 minutes'],correct:1},
  {q:'Which zone should most training be in?',opts:['Zone 5','Zone 1','Zone 2','Zone 4'],correct:2},
  {q:'Heart rate recovery after exercise should be...',opts:['Very slow','Faster is better','Same for everyone','Doesn\'t matter'],correct:1},
  {q:'Zone 1 is primarily used for...',opts:['Racing','Warm-up & recovery','Building muscle','Stretching'],correct:1},
  {q:'Training in Zone 4 helps with...',opts:['Recovery','Speed & power','Flexibility','Balance'],correct:1}
];
function startGame(){
  age=parseInt(document.getElementById('ageInput').value)||25;
  document.getElementById('startScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');
  score=0;correctCount=0;currentQ=0;showZones();showQuiz();
}
function showZones(){
  let maxHR=220-age;let sec=document.getElementById('zonesSection');sec.innerHTML='';
  let title=document.createElement('div');title.style.cssText='text-align:center;color:#94a3b8;font-size:14px;margin-bottom:8px';
  title.textContent='Max HR: '+maxHR+' bpm | Your Zones:';sec.appendChild(title);
  zones.forEach(z=>{
    let card=document.createElement('div');card.className='zone-card';
    let bpm1=Math.round(maxHR*z.pct[0]/100),bpm2=Math.round(maxHR*z.pct[1]/100);
    card.innerHTML=`<div class="zone-header"><span style="font-size:16px;font-weight:bold;color:${z.color}">${z.name}</span><span style="color:#94a3b8;font-size:13px">${bpm1}-${bpm2} bpm</span></div><div class="zone-bar" style="background:${z.color};width:${z.pct[1]}%">${z.desc}</div>`;
    sec.appendChild(card);
  });
}
function showQuiz(){
  if(currentQ>=quizQuestions.length){endGame();return}
  answered=false;let q=quizQuestions[currentQ];
  document.getElementById('quizQ').textContent=q.q;
  document.getElementById('qNum').textContent=(currentQ+1)+'/'+quizQuestions.length;
  document.getElementById('progressFill').style.width=(currentQ/quizQuestions.length*100)+'%';
  document.getElementById('feedback').textContent='';
  let opts=document.getElementById('quizOpts');opts.innerHTML='';
  q.opts.forEach((opt,i)=>{
    let btn=document.createElement('button');btn.className='quiz-opt';btn.textContent=opt;
    btn.onclick=()=>checkAnswer(i,q.correct,btn);opts.appendChild(btn);
  });
}
function checkAnswer(idx,correct,btn){
  if(answered)return;answered=true;
  document.querySelectorAll('.quiz-opt').forEach(b=>b.disabled=true);
  if(idx===correct){btn.classList.add('correct');correctCount++;score+=100;
    document.getElementById('feedback').textContent='✅ Correct!';document.getElementById('feedback').style.color='#22c55e';
  }else{btn.classList.add('wrong');document.querySelectorAll('.quiz-opt').forEach(b=>{if(b===opts.children[correct])b.classList.add('correct')});
    let correctBtn=document.querySelectorAll('.quiz-opt')[correct];if(correctBtn)correctBtn.classList.add('correct');
    document.getElementById('feedback').textContent='❌ Study those zones!';document.getElementById('feedback').style.color='#ef4444';
  }
  document.getElementById('scoreVal').textContent=score;
  currentQ++;setTimeout(showQuiz,1500);
}
function resetGame(){document.getElementById('resultScreen').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden')}
function endGame(){document.getElementById('gameScreen').classList.add('hidden');document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('finalCorrect').textContent=correctCount;document.getElementById('finalScore').textContent=score;
  let pct=correctCount/quizQuestions.length*100;
  document.getElementById('finalMsg').textContent=pct>=75?'❤️ Heart health master!':pct>=50?'💪 Good knowledge!':'📚 Learn your zones!'}
</script>
</body></html>
