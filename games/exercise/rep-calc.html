<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rep Calculator 🔢</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top-bar{width:100%;padding:12px 20px;background:#1e293b;display:flex;justify-content:space-between;align-items:center}
.top-bar a{color:#38bdf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px}
.game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:500px;padding:20px}
.hidden{display:none}
.result-card{background:#1e293b;border-radius:16px;padding:30px;text-align:center}
.result-card h2{color:#38bdf8}
.result-card p{color:#94a3b8;margin:5px 0}
.play-again{background:#38bdf8;color:#0f172a;border:none;padding:14px 40px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:15px}
.calc-card{background:#1e293b;border-radius:16px;padding:24px;width:100%;margin:10px 0}
.calc-row{display:flex;gap:10px;margin:10px 0;align-items:center}
.calc-label{font-size:14px;color:#94a3b8;width:80px}
.calc-input{flex:1;padding:10px;border-radius:8px;background:#0f172a;border:2px solid #334155;color:#e2e8f0;font-size:16px;text-align:center}
.calc-input:focus{outline:none;border-color:#38bdf8}
.result-big{font-size:48px;font-weight:bold;color:#38bdf8;text-align:center;margin:15px 0}
.result-label{font-size:14px;color:#94a3b8;text-align:center}
.sets-grid{width:100%;margin:10px 0}
.set-row{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid #334155}
.set-num{color:#94a3b8;font-size:14px;width:40px}
.set-val{color:#e2e8f0;font-size:16px;flex:1}
.set-x{color:#64748b}
.challenge-card{background:#1e293b;border-radius:16px;padding:24px;width:100%;margin:10px 0;text-align:center}
.challenge-q{font-size:18px;margin:10px 0;color:#f59e0b}
.challenge-input{width:120px;padding:12px;border-radius:8px;background:#0f172a;border:2px solid #334155;color:#e2e8f0;font-size:20px;text-align:center}
.submit-btn{padding:10px 30px;border:none;border-radius:8px;background:#38bdf8;color:#0f172a;font-size:16px;font-weight:bold;cursor:pointer;margin:5px}
.submit-btn:hover{background:#7dd3fc}
.feedback{font-size:18px;min-height:28px;margin:10px 0;font-weight:bold}
.score-display{display:flex;gap:15px;margin:10px 0}
.score-box{background:#1e293b;padding:10px 18px;border-radius:10px;text-align:center}
.score-box .label{font-size:12px;color:#94a3b8}
.score-box .value{font-size:22px;font-weight:bold;color:#38bdf8}
</style>
</head>
<body>
<div class="top-bar"><a href="../index.html">← Back</a><h1>Rep Calculator 🔢</h1><span></span></div>
<div class="game" id="startScreen">
  <div style="font-size:80px;animation:bounce 1s infinite">🔢</div>
  <style>@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}</style>
  <h2 style="margin:15px 0">Rep Calculator</h2>
  <p style="color:#94a3b8;text-align:center">Calculate total reps across sets!<br>Solve math challenges for bonus points.</p>
  <button class="play-again" onclick="startGame()">Start</button>
</div>
<div class="game hidden" id="gameScreen">
  <div class="score-display">
    <div class="score-box"><div class="label">CHALLENGES</div><div class="value" id="qNum">0/8</div></div>
    <div class="score-box"><div class="label">SCORE</div><div class="value" id="scoreVal">0</div></div>
  </div>
  <div class="challenge-card">
    <div style="font-size:32px;margin:5px 0">💪</div>
    <div class="challenge-q" id="challengeQ"></div>
    <div style="margin:10px 0">
      <input type="number" class="challenge-input" id="answerInput" onkeydown="if(event.key==='Enter')checkAnswer()">
    </div>
    <button class="submit-btn" onclick="checkAnswer()">Submit</button>
    <div class="feedback" id="feedback"></div>
  </div>
  <div id="calcSection" style="width:100%">
    <div class="calc-card">
      <h3 style="color:#38bdf8;margin-bottom:10px">Quick Calculator</h3>
      <div class="calc-row"><span class="calc-label">Sets:</span><input type="number" class="calc-input" id="numSets" value="3" min="1" max="20" oninput="calcTotal()"></div>
      <div class="calc-row"><span class="calc-label">Reps:</span><input type="number" class="calc-input" id="numReps" value="10" min="1" max="100" oninput="calcTotal()"></div>
      <div class="calc-row"><span class="calc-label">Weight:</span><input type="number" class="calc-input" id="numWeight" value="0" min="0" max="1000" placeholder="lbs/kg" oninput="calcTotal()"></div>
      <div class="result-label">Total Reps</div>
      <div class="result-big" id="totalReps">30</div>
      <div class="result-label">Total Volume (reps × weight)</div>
      <div class="result-big" id="totalVolume" style="font-size:28px">0</div>
    </div>
  </div>
</div>
<div class="game hidden" id="resultScreen">
  <div class="result-card">
    <div style="font-size:80px">🏆</div>
    <h2>Math Master!</h2>
    <p>Challenges: <span id="finalQ">0</span>/8</p>
    <p>Score: <span id="finalScore">0</span></p>
    <p id="finalMsg"></p>
    <button class="play-again" onclick="resetGame()">Play Again</button>
  </div>
</div>
<script>
let currentQ=0,totalQ=8,score=0,correctCount=0,answer=0;
function startGame(){document.getElementById('startScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');currentQ=0;score=0;correctCount=0;newChallenge();calcTotal()}
function newChallenge(){
  if(currentQ>=totalQ){endGame();return}
  let type=Math.floor(Math.random()*4);
  let s1=Math.floor(Math.random()*10)+1,r1=Math.floor(Math.random()*15)+1;
  let s2=Math.floor(Math.random()*10)+1,r2=Math.floor(Math.random()*15)+1;
  let q='',a=0;
  switch(type){
    case 0:q=`If you do ${r1} reps × ${s1} sets, total reps?`;a=r1*s1;break;
    case 1:q=`Set 1: ${r1} reps, Set 2: ${r2} reps. Total?`;a=r1+r2;break;
    case 2:q=`${s1} sets of ${r1} reps, minus ${Math.floor(r1/2)} missed reps. Total?`;a=s1*r1-Math.floor(r1/2);break;
    case 3:q=`If each set adds 2 more reps (starting ${r1}), ${s1} sets total?`;a=s1*r1+2*(s1*(s1-1)/2);break;
  }
  answer=a;document.getElementById('challengeQ').textContent=q;
  document.getElementById('answerInput').value='';document.getElementById('answerInput').focus();
  document.getElementById('feedback').textContent='';document.getElementById('qNum').textContent=(currentQ+1)+'/'+totalQ;
}
function checkAnswer(){
  let userAns=parseInt(document.getElementById('answerInput').value);
  if(isNaN(userAns))return;
  if(userAns===answer){correctCount++;score+=100;document.getElementById('feedback').textContent='✅ Correct! +100';document.getElementById('feedback').style.color='#22c55e'}
  else{document.getElementById('feedback').textContent='❌ Answer: '+answer;document.getElementById('feedback').style.color='#ef4444'}
  document.getElementById('scoreVal').textContent=score;
  currentQ++;setTimeout(newChallenge,1200);
}
function calcTotal(){
  let sets=parseInt(document.getElementById('numSets').value)||0;
  let reps=parseInt(document.getElementById('numReps').value)||0;
  let weight=parseInt(document.getElementById('numWeight').value)||0;
  document.getElementById('totalReps').textContent=sets*reps;
  document.getElementById('totalVolume').textContent=(sets*reps*weight)+(weight>0?' lbs':'');
}
function resetGame(){document.getElementById('resultScreen').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden')}
function endGame(){document.getElementById('gameScreen').classList.add('hidden');document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('finalQ').textContent=correctCount;document.getElementById('finalScore').textContent=score;
  document.getElementById('finalMsg').textContent=correctCount>=7?'🌟 Math whiz!':correctCount>=4?'💪 Nice work!':'📚 Practice more!'}
</script>
</body></html>
