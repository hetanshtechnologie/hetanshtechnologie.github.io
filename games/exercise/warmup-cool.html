<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warm-Up & Cool-Down 🌡️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top-bar{width:100%;padding:12px 20px;background:#1e293b;display:flex;justify-content:space-between;align-items:center}
.top-bar a{color:#38bdf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px}
.game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:500px;padding:20px}
.hidden{display:none}
.result-card{background:#1e293b;border-radius:16px;padding:30px;text-align:center}
.result-card h2{color:#f59e0b}
.result-card p{color:#94a3b8;margin:5px 0}
.play-again{background:#f59e0b;color:#0f172a;border:none;padding:14px 40px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:15px}
.order-area{width:100%;margin:10px 0}
.order-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:#1e293b;margin:6px 0;cursor:grab;transition:all .2s;border:2px solid transparent}
.order-item:active{cursor:grabbing;border-color:#f59e0b;background:#2a1f00}
.order-item .num{width:28px;height:28px;border-radius:50%;background:#334155;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;flex-shrink:0}
.order-item .emoji{font-size:24px;flex-shrink:0}
.order-item .name{flex:1;font-size:15px}
.order-item .arrows{display:flex;flex-direction:column;gap:2px}
.order-item .arr{width:28px;height:28px;border-radius:6px;background:#334155;border:none;color:#e2e8f0;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.order-item .arr:hover{background:#475569}
.order-item.correct{border-color:#22c55e;background:#166534}
.order-item.wrong{border-color:#ef4444;background:#7f1d1d}
.check-btn{padding:14px 40px;border:none;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn-check{background:#22c55e;color:#fff}
.btn-next{background:#38bdf8;color:#0f172a}
.feedback{font-size:18px;min-height:28px;margin:10px 0;font-weight:bold;text-align:center}
.score-display{display:flex;gap:15px;margin:10px 0}
.score-box{background:#1e293b;padding:10px 18px;border-radius:10px;text-align:center}
.score-box .label{font-size:12px;color:#94a3b8}
.score-box .value{font-size:22px;font-weight:bold;color:#f59e0b}
.progress-bar{width:100%;height:12px;background:#1e293b;border-radius:6px;margin:10px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#f59e0b,#fbbf24);border-radius:6px;transition:width .3s}
.round-label{font-size:16px;color:#f59e0b;margin:5px 0;font-weight:bold}
</style>
</head>
<body>
<div class="top-bar"><a href="../index.html">← Back</a><h1>Warm-Up & Cool-Down 🌡️</h1><span></span></div>
<div class="game" id="startScreen">
  <div style="font-size:80px;animation:bounce 1s infinite">🌡️</div>
  <style>@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}</style>
  <h2 style="margin:15px 0">Order the Exercises</h2>
  <p style="color:#94a3b8;text-align:center">Put exercises in the correct order!<br>Warm-up comes first, cool-down last.</p>
  <button class="play-again" onclick="startGame()">Start</button>
</div>
<div class="game hidden" id="gameScreen">
  <div class="score-display">
    <div class="score-box"><div class="label">ROUND</div><div class="value" id="roundVal">1/5</div></div>
    <div class="score-box"><div class="label">SCORE</div><div class="value" id="scoreVal">0</div></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="round-label" id="roundLabel">Put in correct order:</div>
  <div class="order-area" id="orderArea"></div>
  <div class="feedback" id="feedback"></div>
  <button class="check-btn btn-check" id="checkBtn" onclick="checkOrder()">Check Order</button>
</div>
<div class="game hidden" id="resultScreen">
  <div class="result-card">
    <div style="font-size:80px">🏆</div>
    <h2>Order Master!</h2>
    <p>Rounds: <span id="finalRounds">0</span>/5</p>
    <p>Score: <span id="finalScore">0</span></p>
    <p id="finalMsg"></p>
    <button class="play-again" onclick="resetGame()">Play Again</button>
  </div>
</div>
<script>
const rounds=[
  {title:'Warm-Up Sequence',items:[
    {emoji:'🚶',name:'Light Walking'},{emoji:'🔄',name:'Arm Circles'},{emoji:'🦵',name:'Leg Swings'},
    {emoji:'🏃',name:'Light Jogging'},{emoji:'💪',name:'Dynamic Stretches'}
  ]},
  {title:'Full Workout Order',items:[
    {emoji:'🧘',name:'Warm-Up Stretches'},{emoji:'💪',name:'Strength Training'},{emoji:'🏃',name:'Cardio'},
    {emoji:'🔥',name:'HIIT Circuit'},{emoji:'🧘',name:'Cool-Down Stretch'}
  ]},
  {title:'Cool-Down Sequence',items:[
    {emoji:'🚶',name:'Slow Walking'},{emoji:'🧘',name:'Static Stretches'},{emoji:'💨',name:'Deep Breathing'},
    {emoji:'💧',name:'Hydration'},{emoji:'😌',name:'Relaxation'}
  ]},
  {title:'Pre-Run Routine',items:[
    {emoji:'🧘',name:'Dynamic Warm-Up'},{emoji:'🦵',name:'High Knees'},{emoji:'🏃',name:'Easy Jog'},
    {emoji:'💨',name:'Breathing Exercises'},{emoji:'💪',name:'Starting Stretches'}
  ]},
  {title:'Post-Workout Order',items:[
    {emoji:'🚶',name:'Cool-Down Walk'},{emoji:'🧘',name:'Static Stretching'},{emoji:'💧',name:'Drink Water'},
    {emoji:'🍌',name:'Eat Recovery Food'},{emoji:'😴',name:'Rest'}
  ]}
];
let currentRound=0,score=0,correctRounds=0,answered=false;
function startGame(){document.getElementById('startScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');currentRound=0;score=0;correctRounds=0;showRound()}
function showRound(){
  if(currentRound>=rounds.length){endGame();return}
  answered=false;let r=rounds[currentRound];
  document.getElementById('roundLabel').textContent=r.title;
  document.getElementById('roundVal').textContent=(currentRound+1)+'/'+rounds.length;
  document.getElementById('progressFill').style.width=(currentRound/rounds.length*100)+'%';
  document.getElementById('feedback').textContent='';document.getElementById('checkBtn').className='check-btn btn-check';document.getElementById('checkBtn').textContent='Check Order';
  let area=document.getElementById('orderArea');area.innerHTML='';
  let shuffled=[...r.items].sort(()=>Math.random()-0.5);
  shuffled.forEach((item,i)=>{
    let div=document.createElement('div');div.className='order-item';
    div.innerHTML=`<div class="num">${i+1}</div><span class="emoji">${item.emoji}</span><span class="name">${item.name}</span><div class="arrows"><button class="arr" onclick="moveItem(this,-1)">▲</button><button class="arr" onclick="moveItem(this,1)">▼</button></div>`;
    div.dataset.name=item.name;area.appendChild(div);
  });
}
function moveItem(btn,dir){
  if(answered)return;
  let item=btn.closest('.order-item');let area=document.getElementById('orderArea');
  let items=[...area.children];let idx=items.indexOf(item);
  if(dir===-1&&idx>0){area.insertBefore(item,items[idx-1])}
  else if(dir===1&&idx<items.length-1){area.insertBefore(items[idx+1],item)}
  updateNums();
}
function updateNums(){let items=[...document.getElementById('orderArea').children];items.forEach((it,i)=>{it.querySelector('.num').textContent=i+1})}
function checkOrder(){
  if(answered)return;answered=true;
  let r=rounds[currentRound];let items=[...document.getElementById('orderArea').children];
  let correct=true;
  items.forEach((item,i)=>{
    item.classList.remove('correct','wrong');
    if(item.dataset.name===r.items[i].name){item.classList.add('correct')}
    else{item.classList.add('wrong');correct=false}
  });
  if(correct){correctRounds++;score+=200;document.getElementById('feedback').textContent='✅ Perfect order! +200';document.getElementById('feedback').style.color='#22c55e'}
  else{document.getElementById('feedback').textContent='❌ Not quite right!';document.getElementById('feedback').style.color='#ef4444'}
  document.getElementById('scoreVal').textContent=score;
  document.getElementById('checkBtn').className='check-btn btn-next';document.getElementById('checkBtn').textContent='Next Round';
  document.getElementById('checkBtn').onclick=()=>{currentRound++;showRound()};
}
function resetGame(){document.getElementById('resultScreen').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden')}
function endGame(){document.getElementById('gameScreen').classList.add('hidden');document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('finalRounds').textContent=correctRounds;document.getElementById('finalScore').textContent=score;
  let pct=correctRounds/rounds.length*100;
  document.getElementById('finalMsg').textContent=pct>=80?'🌟 Perfect ordering!':pct>=60?'💪 Good knowledge!':'📚 Learn proper sequence!'}
</script>
</body></html>
