<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workout Circuit 🔄</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top-bar{width:100%;padding:12px 20px;background:#1e293b;display:flex;justify-content:space-between;align-items:center}
.top-bar a{color:#38bdf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px}
.game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:500px;padding:20px}
.hidden{display:none}
.result-card{background:#1e293b;border-radius:16px;padding:30px;text-align:center}
.result-card h2{color:#8b5cf6}
.result-card p{color:#94a3b8;margin:5px 0}
.play-again{background:#8b5cf6;color:#fff;border:none;padding:14px 40px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:15px}
.circuit{display:flex;flex-direction:column;gap:8px;width:100%;margin:10px 0}
.circuit-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:#1e293b;transition:all .3s}
.circuit-item.active{background:#8b5cf6;border:2px solid #a78bfa}
.circuit-item.done{background:#166534;border:2px solid #22c55e}
.circuit-item .emoji{font-size:28px}
.circuit-item .name{font-weight:bold;flex:1}
.circuit-item .reps{color:#94a3b8;font-size:14px}
.circuit-item .check{color:#22c55e;font-size:20px}
.tap-btn{width:180px;height:180px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#7c3aed);border:none;color:#fff;font-size:20px;font-weight:bold;cursor:pointer;transition:transform .1s}
.tap-btn:active{transform:scale(.92)}
.progress-bar{width:100%;height:12px;background:#1e293b;border-radius:6px;margin:10px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#a78bfa);border-radius:6px;transition:width .3s}
.score-display{display:flex;gap:15px;margin:10px 0}
.score-box{background:#1e293b;padding:10px 18px;border-radius:10px;text-align:center}
.score-box .label{font-size:12px;color:#94a3b8}
.score-box .value{font-size:22px;font-weight:bold;color:#8b5cf6}
.current-exercise{font-size:24px;color:#8b5cf6;margin:10px 0;font-weight:bold}
</style>
</head>
<body>
<div class="top-bar"><a href="../index.html">← Back</a><h1>Workout Circuit 🔄</h1><span></span></div>
<div class="game" id="startScreen">
  <div class="big-emoji" style="font-size:80px;animation:bounce 1s infinite">🔄</div>
  <style>@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}</style>
  <h2 style="margin:15px 0">Workout Circuit</h2>
  <p style="color:#94a3b8;text-align:center">Complete the full circuit!<br>Push-ups → Squats → Plank → Burpees</p>
  <div style="margin:10px 0;color:#94a3b8;font-size:14px">Each round: complete all 4 exercises</div>
  <button class="play-again" onclick="startGame()">Start Circuit</button>
</div>
<div class="game hidden" id="gameScreen">
  <div id="timer" style="font-size:24px;color:#f59e0b">⏱️ 0:00</div>
  <div class="score-display">
    <div class="score-box"><div class="label">ROUNDS</div><div class="value" id="roundVal">0</div></div>
    <div class="score-box"><div class="label">REPS</div><div class="value" id="totalReps">0</div></div>
  </div>
  <div class="current-exercise" id="currentName">Push-Ups</div>
  <div style="font-size:16px;color:#94a3b8" id="repGoal">Target: 5</div>
  <div class="circuit" id="circuitList"></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div id="status" style="min-height:24px;color:#22c55e;font-size:16px"></div>
  <button class="tap-btn" onclick="doRep()">TAP!</button>
</div>
<div class="game hidden" id="resultScreen">
  <div class="result-card">
    <div class="big-emoji" style="font-size:80px;animation:none">🏆</div>
    <h2>Circuit Complete!</h2>
    <p>Rounds: <span id="finalRounds">0</span></p>
    <p>Total Reps: <span id="finalReps">0</span></p>
    <p>Time: <span id="finalTime">0:00</span></p>
    <p>Score: <span id="finalScore">0</span></p>
    <button class="play-again" onclick="resetGame()">Play Again</button>
  </div>
</div>
<script>
const exercises=[
  {name:'Push-Ups',emoji:'💪',reps:5},{name:'Squats',emoji:'🦵',reps:8},
  {name:'Plank Hold',emoji:'🧘',reps:10},{name:'Burpees',emoji:'🔥',reps:3}
];
let currentEx=0,rounds=0,repCount=0,score=0,seconds=0,timerInt=null,started=false;
function startGame(){document.getElementById('startScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');currentEx=0;rounds=0;repCount=0;score=0;seconds=0;buildCircuit();updateDisplay();
  timerInt=setInterval(()=>{seconds++;document.getElementById('timer').textContent='⏱️ '+fmt(seconds)},1000);started=true}
function fmt(s){let m=Math.floor(s/60);return m+':'+(s%60<10?'0':'')+(s%60)}
function buildCircuit(){
  let list=document.getElementById('circuitList');list.innerHTML='';
  exercises.forEach((ex,i)=>{
    let item=document.createElement('div');item.className='circuit-item';item.id='ci'+i;
    item.innerHTML=`<span class="emoji">${ex.emoji}</span><span class="name">${ex.name}</span><span class="reps" id="cr${i}">0/${ex.reps}</span><span class="check" id="cc${i}"></span>`;
    list.appendChild(item);
  });
  updateCircuit();
}
function updateCircuit(){
  exercises.forEach((ex,i)=>{
    let el=document.getElementById('ci'+i);el.className='circuit-item';
    if(i<currentEx)el.classList.add('done');
    else if(i===currentEx)el.classList.add('active');
    let done=i<currentEx?ex.reps:(i===currentEx?repCount:0);
    document.getElementById('cr'+i).textContent=done+'/'+ex.reps;
    document.getElementById('cc'+i).textContent=i<currentEx?'✅':'';
  });
  document.getElementById('currentName').textContent=currentEx<4?exercises[currentEx].emoji+' '+exercises[currentEx].name:'🎉 Round Complete!';
  document.getElementById('repGoal').textContent=currentEx<4?'Target: '+exercises[currentEx].reps:'Next round starting...';
}
function doRep(){
  if(!started||currentEx>=4)return;
  repCount++;score+=10;let ex=exercises[currentEx];
  if(repCount>=ex.reps){currentEx++;repCount=0;
    if(currentEx>=4){rounds++;currentEx=0;score+=100;document.getElementById('status').textContent='🎉 Round '+rounds+' complete! +100 bonus'}
    else{document.getElementById('status').textContent=''}
  }else{document.getElementById('status').textContent=''}
  updateCircuit();updateDisplay();
}
function updateDisplay(){document.getElementById('roundVal').textContent=rounds;document.getElementById('totalReps').textContent=Math.floor(score/10);
  let totalDone=exercises.slice(0,currentEx).reduce((a,b)=>a+b.reps,0)+repCount;
  let totalTarget=exercises.reduce((a,b)=>a+b.reps,0);
  document.getElementById('progressFill').style.width=(totalDone/totalTarget*100)+'%';
}
function resetGame(){clearInterval(timerInt);started=false;document.getElementById('resultScreen').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden')}
function endGame(){started=false;clearInterval(timerInt);document.getElementById('gameScreen').classList.add('hidden');document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('finalRounds').textContent=rounds;document.getElementById('finalReps').textContent=Math.floor(score/10);document.getElementById('finalTime').textContent=fmt(seconds);document.getElementById('finalScore').textContent=score}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!document.getElementById('gameScreen').classList.contains('hidden')){e.preventDefault();doRep()}});
</script>
</body></html>
