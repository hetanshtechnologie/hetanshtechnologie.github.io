<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>High Knees 🏃</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top-bar{width:100%;padding:12px 20px;background:#1e293b;display:flex;justify-content:space-between;align-items:center}
.top-bar a{color:#38bdf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px}
.game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:500px;padding:20px}
.big-emoji{font-size:80px;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.hidden{display:none}
.result-card{background:#1e293b;border-radius:16px;padding:30px;text-align:center}
.result-card h2{color:#f59e0b}
.result-card p{color:#94a3b8;margin:5px 0}
.play-again{background:#f59e0b;color:#0f172a;border:none;padding:14px 40px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:15px}
.tap-btn{width:180px;height:180px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ea580c);border:none;color:#fff;font-size:22px;font-weight:bold;cursor:pointer;transition:transform .1s}
.tap-btn:active{transform:scale(.92)}
.score-display{display:flex;gap:15px;margin:10px 0}
.score-box{background:#1e293b;padding:10px 18px;border-radius:10px;text-align:center}
.score-box .label{font-size:12px;color:#94a3b8}
.score-box .value{font-size:22px;font-weight:bold;color:#f59e0b}
.knee-anim{font-size:60px;transition:transform .1s}
.knee-up{transform:translateY(-20px)}
.progress-bar{width:100%;height:12px;background:#1e293b;border-radius:6px;margin:10px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#f59e0b,#fb923c);border-radius:6px;transition:width .3s}
.speed-display{font-size:18px;color:#f59e0b;min-height:24px}
</style>
</head>
<body>
<div class="top-bar"><a href="../index.html">← Back</a><h1>High Knees 🏃</h1><span></span></div>
<div class="game" id="startScreen">
  <div class="big-emoji">🏃</div>
  <h2 style="margin:15px 0">High Knees Speed Challenge</h2>
  <p style="color:#94a3b8;text-align:center">Tap as fast as you can!<br>Count those high knees!</p>
  <button class="play-again" onclick="startGame()">Start</button>
</div>
<div class="game hidden" id="gameScreen">
  <div id="timer" style="font-size:24px;color:#f59e0b">⏱️ 0:00</div>
  <div class="score-display">
    <div class="score-box"><div class="label">KNEES</div><div class="value" id="repCount">0</div></div>
    <div class="score-box"><div class="label">LEVEL</div><div class="value" id="levelVal">1</div></div>
    <div class="score-box"><div class="label">BEST/S</div><div class="value" id="bestSpeed">0</div></div>
  </div>
  <div id="kneeAnim" class="knee-anim">🦵</div>
  <div style="width:100%;height:12px;background:#1e293b;border-radius:6px;margin:10px 0;overflow:hidden">
    <div id="progressFill" style="height:100%;background:linear-gradient(90deg,#f59e0b,#fb923c);border-radius:6px;transition:width .3s;width:0%"></div>
  </div>
  <div class="speed-display" id="speedDisp">Tap fast!</div>
  <button class="tap-btn" onclick="doKnee()">KNEE UP!</button>
</div>
<div class="game hidden" id="resultScreen">
  <div class="result-card">
    <div class="big-emoji" style="animation:none">🏆</div>
    <h2>Speed Runner!</h2>
    <p>Total Knees: <span id="finalReps">0</span></p>
    <p>Time: <span id="finalTime">0:00</span></p>
    <p>Level: <span id="finalLevel">1</span></p>
    <p>Best Speed: <span id="finalSpeed">0</span>/s</p>
    <p>Score: <span id="finalScore">0</span></p>
    <button class="play-again" onclick="resetGame()">Play Again</button>
  </div>
</div>
<script>
let reps=0,level=1,target=20,score=0,seconds=0,timerInt=null,started=false,taps=0,bestSpd=0,speedInt=null;
function startGame(){document.getElementById('startScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');reps=0;level=1;target=20;score=0;seconds=0;taps=0;bestSpd=0;updateDisplay();timerInt=setInterval(()=>{seconds++;document.getElementById('timer').textContent='⏱️ '+fmt(seconds)},1000);
  speedInt=setInterval(()=>{let spd=taps;taps=0;if(spd>bestSpd){bestSpd=spd;document.getElementById('bestSpeed').textContent=bestSpd}
    let d=document.getElementById('speedDisp');d.textContent=spd+'/sec';
    if(spd>15){d.textContent+=' 🔥';d.style.color='#ef4444'}else if(spd>8){d.textContent+=' 💪';d.style.color='#f59e0b'}else{d.style.color='#94a3b8'}},1000);started=true}
function fmt(s){let m=Math.floor(s/60);return m+':'+(s%60<10?'0':'')+(s%60)}
function doKnee(){
  if(!started)return;reps++;taps++;score+=10+level*3;
  let k=document.getElementById('kneeAnim');k.classList.add('knee-up');setTimeout(()=>k.classList.remove('knee-up'),100);
  if(reps>=target){level++;target+=15+level*3;reps=0}
  updateDisplay();
}
function updateDisplay(){document.getElementById('repCount').textContent=reps;document.getElementById('levelVal').textContent=level;document.getElementById('progressFill').style.width=(reps/target*100)+'%'}
function resetGame(){clearInterval(timerInt);clearInterval(speedInt);started=false;document.getElementById('resultScreen').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden')}
function endGame(){started=false;clearInterval(timerInt);clearInterval(speedInt);document.getElementById('gameScreen').classList.add('hidden');document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('finalReps').textContent=reps;document.getElementById('finalTime').textContent=fmt(seconds);document.getElementById('finalLevel').textContent=level;document.getElementById('finalSpeed').textContent=bestSpd;document.getElementById('finalScore').textContent=score}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!document.getElementById('gameScreen').classList.contains('hidden')){e.preventDefault();doKnee()}});
</script>
</body></html>
