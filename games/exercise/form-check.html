<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Form Check ✅</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top-bar{width:100%;padding:12px 20px;background:#1e293b;display:flex;justify-content:space-between;align-items:center}
.top-bar a{color:#38bdf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px}
.game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:500px;padding:20px}
.hidden{display:none}
.result-card{background:#1e293b;border-radius:16px;padding:30px;text-align:center}
.result-card h2{color:#22c55e}
.result-card p{color:#94a3b8;margin:5px 0}
.play-again{background:#22c55e;color:#0f172a;border:none;padding:14px 40px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:15px}
.question-card{background:#1e293b;border-radius:16px;padding:24px;text-align:center;width:100%;margin:10px 0}
.q-emoji{font-size:48px;margin:5px 0}
.q-title{font-size:18px;font-weight:bold;color:#22c55e;margin:5px 0}
.q-desc{font-size:14px;color:#94a3b8;margin:5px 0}
.form-options{display:flex;flex-direction:column;gap:10px;margin:15px 0;width:100%}
.form-opt{padding:16px;border-radius:12px;background:#0f172a;border:2px solid #334155;color:#e2e8f0;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}
.form-opt:hover{border-color:#22c55e}
.form-opt.correct{border-color:#22c55e;background:#166534}
.form-opt.wrong{border-color:#ef4444;background:#7f1d1d}
.form-opt:disabled{cursor:default}
.feedback{font-size:18px;min-height:28px;margin:10px 0;font-weight:bold}
.score-display{display:flex;gap:15px;margin:10px 0}
.score-box{background:#1e293b;padding:10px 18px;border-radius:10px;text-align:center}
.score-box .label{font-size:12px;color:#94a3b8}
.score-box .value{font-size:22px;font-weight:bold;color:#22c55e}
.progress-bar{width:100%;height:12px;background:#1e293b;border-radius:6px;margin:10px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#22c55e,#4ade80);border-radius:6px;transition:width .3s}
</style>
</head>
<body>
<div class="top-bar"><a href="../index.html">← Back</a><h1>Form Check ✅</h1><span></span></div>
<div class="game" id="startScreen">
  <div style="font-size:80px;animation:bounce 1s infinite">✅</div>
  <style>@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}</style>
  <h2 style="margin:15px 0">Exercise Form Check</h2>
  <p style="color:#94a3b8;text-align:center">Can you identify correct vs incorrect form?<br>Learn proper exercise technique!</p>
  <button class="play-again" onclick="startQuiz()">Start Quiz</button>
</div>
<div class="game hidden" id="gameScreen">
  <div class="score-display">
    <div class="score-box"><div class="label">CORRECT</div><div class="value" id="correctVal">0</div></div>
    <div class="score-box"><div class="label">Q#</div><div class="value" id="qNum">1/8</div></div>
    <div class="score-box"><div class="label">SCORE</div><div class="value" id="scoreVal">0</div></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="question-card">
    <div class="q-title" id="qTitle">Exercise Form</div>
    <div class="q-desc" id="qDesc"></div>
    <div class="form-options" id="optionsGrid"></div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>
<div class="game hidden" id="resultScreen">
  <div class="result-card">
    <div style="font-size:80px">🏆</div>
    <h2>Form Expert!</h2>
    <p>Correct: <span id="finalCorrect">0</span>/8</p>
    <p>Score: <span id="finalScore">0</span></p>
    <p id="finalMsg"></p>
    <button class="play-again" onclick="resetGame()">Play Again</button>
  </div>
</div>
<script>
const questions=[
  {exercise:'Squat',correct:'Keep knees tracking over toes, back straight',wrong1:'Let knees cave inward past toes',wrong2:'Round your lower back significantly',wrong3:'Rise up on toes during the movement'},
  {exercise:'Push-Up',correct:'Maintain straight body line from head to heels',wrong1:'Let hips sag toward the floor',wrong2:'Flare elbows out at 90 degrees',wrong3:'Only go halfway down'},
  {exercise:'Deadlift',correct:'Hinge at hips, keep bar close to body',wrong1:'Round your back to lift the weight',wrong2:'Let the bar drift away from legs',wrong3:'Hyperextend your lower back at the top'},
  {exercise:'Plank',correct:'Keep body in straight line, engage core',wrong1:'Let hips pike up in the air',wrong2:'Sag your hips toward the ground',wrong3:'Hold your breath the entire time'},
  {exercise:'Lunge',correct:'Step forward, lower until both knees at 90°',wrong1:'Let front knee extend past toes',wrong2:'Keep back leg straight and locked',wrong3:'Lean way forward over the front leg'},
  {exercise:'Bicep Curl',correct:'Keep elbows fixed at your sides',wrong1:'Swing body to generate momentum',wrong2:'Let elbows drift forward',wrong3:'Use a grip wider than shoulder width'},
  {exercise:'Overhead Press',correct:'Press bar straight up, core braced',wrong1:'Arch your back excessively',wrong2:'Press the bar forward instead of up',wrong3:'Lock knees during the movement'},
  {exercise:'Row',correct:'Pull to your lower chest, squeeze shoulder blades',wrong1:'Round your back to pull',wrong2:'Use only arm strength, no back engagement',wrong3:'Let your body swing back and forth'}
];
let currentQ=0,score=0,correctCount=0,answered=false;
function startQuiz(){document.getElementById('startScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');currentQ=0;score=0;correctCount=0;showQuestion()}
function showQuestion(){
  if(currentQ>=questions.length){endGame();return}
  answered=false;let q=questions[currentQ];
  document.getElementById('qTitle').textContent=q.exercise+' - Correct Form:';
  document.getElementById('qDesc').textContent='Which description is the CORRECT form?';
  document.getElementById('feedback').textContent='';
  document.getElementById('qNum').textContent=(currentQ+1)+'/'+questions.length;
  document.getElementById('progressFill').style.width=(currentQ/questions.length*100)+'%';
  let opts=[q.correct,q.wrong1,q.wrong2,q.wrong3].sort(()=>Math.random()-0.5);
  let grid=document.getElementById('optionsGrid');grid.innerHTML='';
  opts.forEach(opt=>{
    let btn=document.createElement('button');btn.className='form-opt';btn.textContent=opt;
    btn.onclick=()=>checkAnswer(opt,q.correct,btn);grid.appendChild(btn);
  });
}
function checkAnswer(answer,correct,btn){
  if(answered)return;answered=true;
  document.querySelectorAll('.form-opt').forEach(b=>b.disabled=true);
  if(answer===correct){btn.classList.add('correct');correctCount++;score+=125;
    document.getElementById('feedback').textContent='✅ Perfect form knowledge!';document.getElementById('feedback').style.color='#22c55e';
  }else{btn.classList.add('wrong');score=0;
    document.querySelectorAll('.form-opt').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});
    document.getElementById('feedback').textContent='❌ That\'s incorrect form!';document.getElementById('feedback').style.color='#ef4444';
  }
  document.getElementById('correctVal').textContent=correctCount;document.getElementById('scoreVal').textContent=score;
  setTimeout(()=>{currentQ++;showQuestion()},1800);
}
function resetGame(){document.getElementById('resultScreen').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden')}
function endGame(){document.getElementById('gameScreen').classList.add('hidden');document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('finalCorrect').textContent=correctCount;document.getElementById('finalScore').textContent=score;
  let pct=correctCount/questions.length*100;
  document.getElementById('finalMsg').textContent=pct>=75?'🌟 Form expert!':pct>=50?'💪 Getting there!':'📚 Study up on form!'}
</script>
</body></html>
