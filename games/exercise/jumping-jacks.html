<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jumping Jacks ⭐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top-bar{width:100%;padding:12px 20px;background:#1e293b;display:flex;justify-content:space-between;align-items:center}
.top-bar a{color:#38bdf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px}
.game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:500px;padding:20px}
.big-emoji{font-size:80px}
.star-anim{display:inline-block;animation:starPop .3s}
@keyframes starPop{0%{transform:scale(0) rotate(0)}100%{transform:scale(1) rotate(360deg)}}
.counter{font-size:72px;font-weight:bold;color:#f59e0b;margin:10px 0}
.bpm-bar{display:flex;gap:4px;margin:10px 0}
.bpm-dot{width:12px;height:12px;border-radius:50%;background:#334155;transition:background .1s}
.bpm-dot.active{background:#f59e0b}
.hidden{display:none}
.result-card{background:#1e293b;border-radius:16px;padding:30px;text-align:center}
.result-card h2{color:#f59e0b}
.result-card p{color:#94a3b8;margin:5px 0}
.play-again{background:#f59e0b;color:#0f172a;border:none;padding:14px 40px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:15px}
.tap-btn{width:180px;height:180px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#d97706);border:none;color:#0f172a;font-size:24px;font-weight:bold;cursor:pointer;transition:transform .1s}
.tap-btn:active{transform:scale(.92)}
.score-display{display:flex;gap:20px;margin:10px 0}
.score-box{background:#1e293b;padding:10px 20px;border-radius:10px;text-align:center}
.score-box .label{font-size:12px;color:#94a3b8}
.score-box .value{font-size:22px;font-weight:bold;color:#f59e0b}
.rhythm-guide{color:#94a3b8;font-size:14px;margin:5px 0}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
</style>
</head>
<body>
<div class="top-bar"><a href="../index.html">← Back</a><h1>Jumping Jacks ⭐</h1><span></span></div>
<div class="game" id="startScreen">
  <div class="big-emoji">⭐</div>
  <h2 style="margin:15px 0">Jumping Jack Counter</h2>
  <p style="color:#94a3b8;text-align:center">Tap in rhythm to count jumping jacks!<br>Keep a steady pace for bonus points.</p>
  <button class="play-again" onclick="startGame()">Start</button>
</div>
<div class="game hidden" id="gameScreen">
  <div class="timer" id="timer" style="font-size:24px;color:#f59e0b">⏱️ 0:00</div>
  <div class="score-display">
    <div class="score-box"><div class="label">JACKS</div><div class="value" id="repCount">0</div></div>
    <div class="score-box"><div class="label">LEVEL</div><div class="value" id="levelVal">1</div></div>
    <div class="score-box"><div class="label">STREAK</div><div class="value" id="streakVal">0</div></div>
  </div>
  <div class="bpm-bar" id="bpmBar"></div>
  <div class="rhythm-guide" id="rhythmGuide">Keep the rhythm!</div>
  <div class="big-emoji" id="exerciseEmoji" style="animation:bounce 1s infinite">⭐</div>
  <div style="width:100%;height:12px;background:#1e293b;border-radius:6px;margin:10px 0;overflow:hidden">
    <div id="progressFill" style="height:100%;background:linear-gradient(90deg,#f59e0b,#fbbf24);border-radius:6px;transition:width .3s;width:0%"></div>
  </div>
  <button class="tap-btn" onclick="doRep()">JUMP!</button>
</div>
<div class="game hidden" id="resultScreen">
  <div class="result-card">
    <div class="big-emoji" style="animation:none">🏆</div>
    <h2>Jumping Complete!</h2>
    <p>Total Jacks: <span id="finalReps">0</span></p>
    <p>Time: <span id="finalTime">0:00</span></p>
    <p>Level: <span id="finalLevel">1</span></p>
    <p>Best Streak: <span id="finalStreak">0</span></p>
    <p>Score: <span id="finalScore">0</span></p>
    <button class="play-again" onclick="resetGame()">Play Again</button>
  </div>
</div>
<style>@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}</style>
<script>
let level=1,reps=0,target=20,score=0,seconds=0,timerInt=null,started=false,streak=0,bestStreak=0,lastTap=0,bpmHistory=[];
function initBpmBar(){let bar=document.getElementById('bpmBar');bar.innerHTML='';for(let i=0;i<10;i++){let d=document.createElement('div');d.className='bpm-dot';bar.appendChild(d)}}
function startGame(){document.getElementById('startScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');level=1;reps=0;target=20;score=0;seconds=0;streak=0;bestStreak=0;bpmHistory=[];initBpmBar();updateDisplay();timerInt=setInterval(()=>{seconds++;document.getElementById('timer').textContent='⏱️ '+fmt(seconds);updateBpm()},1000);started=true}
function fmt(s){let m=Math.floor(s/60);return m+':'+(s%60<10?'0':'')+(s%60)}
function doRep(){
  if(!started)return;
  let now=Date.now();
  if(lastTap>0){let gap=now-lastTap;bpmHistory.push(gap);if(bpmHistory.length>10)bpmHistory.shift()}
  lastTap=now;reps++;
  let avgBpm=bpmHistory.length>2?60000/(bpmHistory.reduce((a,b)=>a+b)/bpmHistory.length):0;
  let rhythmBonus=avgBpm>60&&avgBpm<180?Math.floor(avgBpm/30):0;
  streak++;if(streak>bestStreak)bestStreak=streak;
  score+=10+level*2+rhythmBonus;
  let e=document.getElementById('exerciseEmoji');
  e.textContent=['⭐','🌟','✨','💫'][Math.floor(Math.random()*4)];
  e.style.transform='scale(1.3)';setTimeout(()=>e.style.transform='scale(1)',150);
  if(reps>=target){level++;target+=10+level*2;reps=0;document.getElementById('rhythmGuide').textContent='🎉 Level '+level+'!'}
  updateDisplay();
}
function updateBpm(){let dots=document.querySelectorAll('.bpm-dot');let avgBpm=bpmHistory.length>1?60000/(bpmHistory.reduce((a,b)=>a+b)/bpmHistory.length):0;
  let active=Math.min(Math.floor(avgBpm/20),10);dots.forEach((d,i)=>d.classList.toggle('active',i<active))}
function updateDisplay(){
  document.getElementById('repCount').textContent=reps;document.getElementById('levelVal').textContent=level;document.getElementById('streakVal').textContent=streak;
  document.getElementById('progressFill').style.width=(reps/target*100)+'%';
}
function resetGame(){clearInterval(timerInt);started=false;document.getElementById('resultScreen').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden')}
function endGame(){started=false;clearInterval(timerInt);document.getElementById('gameScreen').classList.add('hidden');document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('finalReps').textContent=Math.floor(score/10);document.getElementById('finalTime').textContent=fmt(seconds);document.getElementById('finalLevel').textContent=level;document.getElementById('finalStreak').textContent=bestStreak;document.getElementById('finalScore').textContent=score}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!document.getElementById('gameScreen').classList.contains('hidden')){e.preventDefault();doRep()}});
</script>
</body></html>
