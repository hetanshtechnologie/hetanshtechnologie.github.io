<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exercise Safety ⚠️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top-bar{width:100%;padding:12px 20px;background:#1e293b;display:flex;justify-content:space-between;align-items:center}
.top-bar a{color:#38bdf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px}
.game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:500px;padding:20px}
.hidden{display:none}
.result-card{background:#1e293b;border-radius:16px;padding:30px;text-align:center}
.result-card h2{color:#ef4444}
.result-card p{color:#94a3b8;margin:5px 0}
.play-again{background:#ef4444;color:#fff;border:none;padding:14px 40px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:15px}
.scenario-card{background:#1e293b;border-radius:16px;padding:24px;width:100%;margin:10px 0}
.scenario-emoji{font-size:48px;text-align:center;margin:5px 0}
.scenario-text{font-size:16px;text-align:center;margin:10px 0;color:#e2e8f0;line-height:1.4}
.safe-opts{display:flex;gap:10px;margin:15px 0;width:100%}
.safe-btn{flex:1;padding:16px;border-radius:12px;border:2px solid #334155;background:#0f172a;color:#e2e8f0;font-size:16px;font-weight:bold;cursor:pointer;transition:all .2s;text-align:center}
.safe-btn.safe:hover{border-color:#22c55e}
.safe-btn.unsafe:hover{border-color:#ef4444}
.safe-btn.correct{border-color:#22c55e;background:#166534}
.safe-btn.wrong{border-color:#ef4444;background:#7f1d1d}
.safe-btn:disabled{cursor:default}
.feedback{font-size:16px;min-height:24px;margin:10px 0;font-weight:bold;text-align:center}
.explanation{font-size:14px;color:#94a3b8;text-align:center;margin:5px 0;line-height:1.4}
.score-display{display:flex;gap:15px;margin:10px 0}
.score-box{background:#1e293b;padding:10px 18px;border-radius:10px;text-align:center}
.score-box .label{font-size:12px;color:#94a3b8}
.score-box .value{font-size:22px;font-weight:bold;color:#ef4444}
.progress-bar{width:100%;height:12px;background:#1e293b;border-radius:6px;margin:10px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#ef4444,#f97316);border-radius:6px;transition:width .3s}
</style>
</head>
<body>
<div class="top-bar"><a href="../index.html">← Back</a><h1>Exercise Safety ⚠️</h1><span></span></div>
<div class="game" id="startScreen">
  <div style="font-size:80px;animation:bounce 1s infinite">⚠️</div>
  <style>@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}</style>
  <h2 style="margin:15px 0">Exercise Safety Quiz</h2>
  <p style="color:#94a3b8;text-align:center">Identify safe vs unsafe exercise practices!<br>Learn to prevent injuries.</p>
  <button class="play-again" onclick="startGame()">Start</button>
</div>
<div class="game hidden" id="gameScreen">
  <div class="score-display">
    <div class="score-box"><div class="label">CORRECT</div><div class="value" id="correctVal">0</div></div>
    <div class="score-box"><div class="label">Q#</div><div class="value" id="qNum">1/10</div></div>
    <div class="score-box"><div class="label">SCORE</div><div class="value" id="scoreVal">0</div></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="scenario-card">
    <div class="scenario-emoji" id="sEmoji">⚠️</div>
    <div class="scenario-text" id="sText"></div>
    <div class="safe-opts">
      <button class="safe-btn safe" onclick="answer(true)">✅ SAFE</button>
      <button class="safe-btn unsafe" onclick="answer(false)">🚫 UNSAFE</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="explanation" id="explanation"></div>
  </div>
</div>
<div class="game hidden" id="resultScreen">
  <div class="result-card">
    <div style="font-size:80px">🏆</div>
    <h2>Safety Expert!</h2>
    <p>Correct: <span id="finalCorrect">0</span>/10</p>
    <p>Score: <span id="finalScore">0</span></p>
    <p id="finalMsg"></p>
    <button class="play-again" onclick="resetGame()">Play Again</button>
  </div>
</div>
<script>
const scenarios=[
  {emoji:'🏋️',text:'Lifting weights with a rounded back',safe:false,explain:'Always keep a neutral spine during lifting to prevent back injuries.'},
  {emoji:'💧',text:'Drinking water during exercise',safe:true,explain:'Staying hydrated is essential during exercise.'},
  {emoji:'🏃',text:'Running without any warm-up',safe:false,explain:'Always warm up before intense exercise to prevent muscle strains.'},
  {emoji:'🧘',text:'Stretching before a workout',safe:true,explain:'Dynamic stretching helps prepare muscles for activity.'},
  {emoji:'🏋️',text:'Using a spotter for heavy bench press',safe:true,explain:'A spotter can help prevent the bar from falling on you.'},
  {emoji:'💪',text:'Exercising through sharp joint pain',safe:false,explain:'Sharp pain means stop immediately - it could indicate injury.'},
  {emoji:'😴',text:'Getting 7-8 hours of sleep before training',safe:true,explain:'Adequate rest helps muscle recovery and performance.'},
  {emoji:'🏥',text:'Ignoring a warm-up because you\'re "in a rush"',safe:false,explain:'Even a 5-minute warm-up is better than none.'},
  {emoji:'🍎',text:'Eating a balanced meal 2 hours before exercise',safe:true,explain:'Proper nutrition fuels your workout.'},
  {emoji:'🏋️',text:'Ego lifting - using too much weight with bad form',safe:false,explain:'Proper form with lighter weight is safer and more effective.'}
];
let currentQ=0,score=0,correctCount=0,answered=false;
function startGame(){document.getElementById('startScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');currentQ=0;score=0;correctCount=0;showScenario()}
function showScenario(){
  if(currentQ>=scenarios.length){endGame();return}
  answered=false;let s=scenarios[currentQ];
  document.getElementById('sEmoji').textContent=s.emoji;document.getElementById('sText').textContent=s.text;
  document.getElementById('feedback').textContent='';document.getElementById('explanation').textContent='';
  document.getElementById('qNum').textContent=(currentQ+1)+'/'+scenarios.length;
  document.getElementById('progressFill').style.width=(currentQ/scenarios.length*100)+'%';
  document.querySelectorAll('.safe-btn').forEach(b=>{b.disabled=false;b.classList.remove('correct','wrong')});
}
function answer(userSaidSafe){
  if(answered)return;answered=true;
  let s=scenarios[currentQ];
  document.querySelectorAll('.safe-btn').forEach(b=>b.disabled=true);
  let isCorrect=userSaidSafe===s.safe;
  if(isCorrect){correctCount++;score+=100;
    document.getElementById('feedback').textContent='✅ Correct!';document.getElementById('feedback').style.color='#22c55e';
  }else{
    document.getElementById('feedback').textContent='❌ Incorrect!';document.getElementById('feedback').style.color='#ef4444';
  }
  document.getElementById('explanation').textContent=s.explain;
  if(s.safe){document.querySelector('.safe-btn.safe').classList.add('correct')}else{document.querySelector('.safe-btn.unsafe').classList.add('correct')}
  document.getElementById('correctVal').textContent=correctCount;document.getElementById('scoreVal').textContent=score;
  currentQ++;setTimeout(showScenario,2500);
}
function resetGame(){document.getElementById('resultScreen').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden')}
function endGame(){document.getElementById('gameScreen').classList.add('hidden');document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('finalCorrect').textContent=correctCount;document.getElementById('finalScore').textContent=score;
  let pct=correctCount/scenarios.length*100;
  document.getElementById('finalMsg').textContent=pct>=80?'🌟 Safety champion!':pct>=60?'⚠️ Good awareness!':'📚 Review safety rules!'}
</script>
</body></html>
