<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Burpee Counter 🔥</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top-bar{width:100%;padding:12px 20px;background:#1e293b;display:flex;justify-content:space-between;align-items:center}
.top-bar a{color:#38bdf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px}
.game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:500px;padding:20px}
.big-emoji{font-size:80px;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.hidden{display:none}
.result-card{background:#1e293b;border-radius:16px;padding:30px;text-align:center}
.result-card h2{color:#ef4444}
.result-card p{color:#94a3b8;margin:5px 0}
.play-again{background:#ef4444;color:#fff;border:none;padding:14px 40px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:15px}
.tap-btn{width:180px;height:180px;border-radius:50%;background:linear-gradient(135deg,#ef4444,#dc2626);border:none;color:#fff;font-size:22px;font-weight:bold;cursor:pointer;transition:transform .1s}
.tap-btn:active{transform:scale(.92)}
.score-display{display:flex;gap:15px;margin:10px 0}
.score-box{background:#1e293b;padding:10px 18px;border-radius:10px;text-align:center}
.score-box .label{font-size:12px;color:#94a3b8}
.score-box .value{font-size:22px;font-weight:bold;color:#ef4444}
.phase-bar{display:flex;gap:8px;margin:10px 0}
.phase{padding:8px 14px;border-radius:8px;background:#1e293b;color:#64748b;font-size:13px;transition:all .2s}
.phase.active{background:#ef4444;color:#fff}
.phase.done{background:#22c55e;color:#fff}
.progress-bar{width:100%;height:12px;background:#1e293b;border-radius:6px;margin:10px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#ef4444,#f97316);border-radius:6px;transition:width .3s}
</style>
</head>
<body>
<div class="top-bar"><a href="../index.html">← Back</a><h1>Burpee Counter 🔥</h1><span></span></div>
<div class="game" id="startScreen">
  <div class="big-emoji">🔥</div>
  <h2 style="margin:15px 0">Burpee Challenge</h2>
  <p style="color:#94a3b8;text-align:center">Tap through each phase of the burpee:<br>Squat → Plank → Push-up → Jump</p>
  <button class="play-again" onclick="startGame()">Start</button>
</div>
<div class="game hidden" id="gameScreen">
  <div id="timer" style="font-size:24px;color:#f59e0b">⏱️ 0:00</div>
  <div class="score-display">
    <div class="score-box"><div class="label">BURPEES</div><div class="value" id="repCount">0</div></div>
    <div class="score-box"><div class="label">LEVEL</div><div class="value" id="levelVal">1</div></div>
  </div>
  <div class="phase-bar" id="phaseBar">
    <div class="phase" id="p1">1.Squat</div>
    <div class="phase" id="p2">2.Plank</div>
    <div class="phase" id="p3">3.Push</div>
    <div class="phase" id="p4">4.Jump</div>
  </div>
  <div style="width:100%;height:12px;background:#1e293b;border-radius:6px;margin:10px 0;overflow:hidden">
    <div id="progressFill" style="height:100%;background:linear-gradient(90deg,#ef4444,#f97316);border-radius:6px;transition:width .3s;width:0%"></div>
  </div>
  <div id="phaseText" style="font-size:20px;color:#ef4444;min-height:28px;margin:5px 0">Next: Squat</div>
  <div class="big-emoji" id="exerciseEmoji" style="animation:bounce 1s infinite">🔥</div>
  <button class="tap-btn" onclick="doPhase()">NEXT PHASE</button>
</div>
<div class="game hidden" id="resultScreen">
  <div class="result-card">
    <div class="big-emoji" style="animation:none">🏆</div>
    <h2>Burpee Burn!</h2>
    <p>Total Burpees: <span id="finalReps">0</span></p>
    <p>Time: <span id="finalTime">0:00</span></p>
    <p>Level: <span id="finalLevel">1</span></p>
    <p>Score: <span id="finalScore">0</span></p>
    <button class="play-again" onclick="resetGame()">Play Again</button>
  </div>
</div>
<script>
let phase=0,reps=0,level=1,target=5,score=0,seconds=0,timerInt=null,started=false;
const phases=['Squat','Plank','Push','Jump'];
const phaseEmoji=['🧎','💪','🏋️','🚀'];
function startGame(){document.getElementById('startScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');phase=0;reps=0;level=1;target=5;score=0;seconds=0;updatePhases();updateDisplay();timerInt=setInterval(()=>{seconds++;document.getElementById('timer').textContent='⏱️ '+fmt(seconds)},1000);started=true}
function fmt(s){let m=Math.floor(s/60);return m+':'+(s%60<10?'0':'')+(s%60)}
function doPhase(){
  if(!started)return;
  phase++;score+=5+level;
  if(phase>=4){
    phase=0;reps++;
    document.getElementById('exerciseEmoji').textContent='🎉';
    document.getElementById('exerciseEmoji').style.transform='scale(1.4)';
    setTimeout(()=>document.getElementById('exerciseEmoji').style.transform='scale(1)',200);
    if(reps>=target){level++;target+=3+level;reps=0}
  }else{
    document.getElementById('exerciseEmoji').textContent=phaseEmoji[phase];
    document.getElementById('exerciseEmoji').style.transform='scale(1.2)';
    setTimeout(()=>document.getElementById('exerciseEmoji').style.transform='scale(1)',150);
  }
  updatePhases();updateDisplay();
}
function updatePhases(){
  for(let i=0;i<4;i++){let el=document.getElementById('p'+(i+1));el.className='phase';if(i<phase)el.classList.add('done');if(i===phase)el.classList.add('active')}
  document.getElementById('phaseText').textContent=phase<4?'Current: '+phases[phase]:'✅ Burpee Complete!';
}
function updateDisplay(){
  document.getElementById('repCount').textContent=reps;document.getElementById('levelVal').textContent=level;
  document.getElementById('progressFill').style.width=(reps/target*100)+'%';
}
function resetGame(){clearInterval(timerInt);started=false;document.getElementById('resultScreen').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden')}
function endGame(){started=false;clearInterval(timerInt);document.getElementById('gameScreen').classList.add('hidden');document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('finalReps').textContent=reps;document.getElementById('finalTime').textContent=fmt(seconds);document.getElementById('finalLevel').textContent=level;document.getElementById('finalScore').textContent=score}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!document.getElementById('gameScreen').classList.contains('hidden')){e.preventDefault();doPhase()}});
</script>
</body></html>
