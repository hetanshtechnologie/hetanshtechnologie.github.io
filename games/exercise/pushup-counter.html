<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Push-Up Counter 💪</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top-bar{width:100%;padding:12px 20px;background:#1e293b;display:flex;justify-content:space-between;align-items:center}
.top-bar a{color:#38bdf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px;color:#e2e8f0}
.game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:500px;padding:20px}
.big-emoji{font-size:80px;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.counter{font-size:72px;font-weight:bold;color:#38bdf8;margin:10px 0}
.timer{font-size:28px;color:#f59e0b;margin:5px 0}
.level-info{font-size:16px;color:#94a3b8;margin:5px 0}
.tap-btn{width:180px;height:180px;border-radius:50%;background:linear-gradient(135deg,#38bdf8,#0ea5e9);border:none;color:#0f172a;font-size:28px;font-weight:bold;cursor:pointer;margin:20px 0;transition:transform .1s}
.tap-btn:active{transform:scale(.92)}
.progress-bar{width:100%;height:12px;background:#1e293b;border-radius:6px;margin:10px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#38bdf8,#22d3ee);border-radius:6px;transition:width .3s}
.status{font-size:16px;color:#22c55e;margin:5px 0;min-height:24px}
.hidden{display:none}
.result-card{background:#1e293b;border-radius:16px;padding:30px;text-align:center;margin:10px 0}
.result-card h2{color:#38bdf8;margin-bottom:10px}
.result-card p{color:#94a3b8;margin:5px 0}
.play-again{background:#38bdf8;color:#0f172a;border:none;padding:14px 40px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:15px}
.play-again:hover{background:#7dd3fc}
.score-display{display:flex;gap:20px;margin:10px 0}
.score-box{background:#1e293b;padding:10px 20px;border-radius:10px;text-align:center}
.score-box .label{font-size:12px;color:#94a3b8}
.score-box .value{font-size:22px;font-weight:bold;color:#38bdf8}
</style>
</head>
<body>
<div class="top-bar"><a href="../index.html">← Back</a><h1>Push-Up Counter 💪</h1><span></span></div>
<div class="game" id="startScreen">
  <div class="big-emoji">🏋️</div>
  <h2 style="margin:15px 0">Push-Up Counter</h2>
  <p style="color:#94a3b8;text-align:center">Tap the button each time you complete a push-up!<br>Reach the target reps to level up.</p>
  <div class="level-info">Level 1 - Target: 5 reps</div>
  <button class="play-again" onclick="startGame()">Start</button>
</div>
<div class="game hidden" id="gameScreen">
  <div class="timer" id="timer">⏱️ 0:00</div>
  <div class="level-info" id="levelInfo">Level 1</div>
  <div class="score-display">
    <div class="score-box"><div class="label">REPS</div><div class="value" id="repCount">0</div></div>
    <div class="score-box"><div class="label">TARGET</div><div class="value" id="targetDisplay">5</div></div>
  </div>
  <div class="big-emoji" id="exerciseEmoji">🏋️</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="status" id="status"></div>
  <button class="tap-btn" id="tapBtn" onclick="doRep()">TAP!</button>
  <div style="color:#64748b;font-size:13px;margin-top:10px">Tap each time you complete a rep</div>
</div>
<div class="game hidden" id="resultScreen">
  <div class="result-card">
    <div class="big-emoji" style="animation:none">🏆</div>
    <h2>Workout Complete!</h2>
    <p>Reps: <span id="finalReps">0</span></p>
    <p>Time: <span id="finalTime">0:00</span></p>
    <p>Level Reached: <span id="finalLevel">1</span></p>
    <p>Score: <span id="finalScore">0</span></p>
    <button class="play-again" onclick="resetGame()">Play Again</button>
  </div>
</div>
<script>
let level=1,reps=0,target=5,score=0,seconds=0,timerInt=null,started=false;
const emojis=['🏋️','💪','🔥','⚡','🏆','🎉'];
function startGame(){document.getElementById('startScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');resetVars();timerInt=setInterval(tick,1000);started=true}
function resetVars(){level=1;reps=0;target=5;score=0;seconds=0;updateDisplay()}
function tick(){seconds++;document.getElementById('timer').textContent='⏱️ '+fmtTime(seconds)}
function fmtTime(s){let m=Math.floor(s/60);return m+':'+(s%60<10?'0':'')+(s%60)}
function doRep(){
  if(!started)return;
  reps++;score+=10+level*2;
  document.getElementById('exerciseEmoji').textContent=emojis[Math.floor(Math.random()*emojis.length)];
  document.getElementById('exerciseEmoji').style.transform='scale(1.3)';
  setTimeout(()=>document.getElementById('exerciseEmoji').style.transform='scale(1)',150);
  if(reps>=target){
    level++;target+=3+level;reps=0;
    document.getElementById('status').textContent='🎉 Level '+level+'!';
    document.getElementById('status').style.color='#22c55e';
  }else{
    document.getElementById('status').textContent='';
  }
  updateDisplay();
}
function updateDisplay(){
  document.getElementById('repCount').textContent=reps;
  document.getElementById('targetDisplay').textContent=target;
  document.getElementById('levelInfo').textContent='Level '+level;
  document.getElementById('progressFill').style.width=(reps/target*100)+'%';
}
function endGame(){
  started=false;clearInterval(timerInt);
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('finalReps').textContent=score/10;
  document.getElementById('finalTime').textContent=fmtTime(seconds);
  document.getElementById('finalLevel').textContent=level;
  document.getElementById('finalScore').textContent=score;
}
function resetGame(){
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
  document.getElementById('status').textContent='';
}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!document.getElementById('gameScreen').classList.contains('hidden')){e.preventDefault();doRep()}});
</script>
</body></html>
