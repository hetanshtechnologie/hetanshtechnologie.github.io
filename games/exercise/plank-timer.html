<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plank Timer 🧘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top-bar{width:100%;padding:12px 20px;background:#1e293b;display:flex;justify-content:space-between;align-items:center}
.top-bar a{color:#38bdf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px}
.game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:500px;padding:20px}
.big-emoji{font-size:80px}
.pulse{animation:pulse .5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.timer-display{font-size:96px;font-weight:bold;color:#22d3ee;font-family:'Courier New',monospace}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.target{font-size:18px;color:#f59e0b;margin:10px 0}
.progress-bar{width:100%;height:14px;background:#1e293b;border-radius:7px;margin:10px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#22d3ee,#38bdf8);border-radius:7px;transition:width .5s linear}
.hidden{display:none}
.result-card{background:#1e293b;border-radius:16px;padding:30px;text-align:center}
.result-card h2{color:#22d3ee;margin-bottom:10px}
.result-card p{color:#94a3b8;margin:5px 0}
.play-again{background:#22d3ee;color:#0f172a;border:none;padding:14px 40px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:15px}
.btn-group{display:flex;gap:10px;margin-top:15px}
.btn{padding:12px 24px;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
.btn-start{background:#22d3ee;color:#0f172a}
.btn-stop{background:#ef4444;color:#fff}
.level-sel{display:flex;gap:10px;margin:15px 0}
.level-opt{padding:10px 20px;border:2px solid #334155;border-radius:10px;background:#1e293b;color:#e2e8f0;cursor:pointer;font-size:14px}
.level-opt.active{border-color:#22d3ee;background:#0e2a3a}
</style>
</head>
<body>
<div class="top-bar"><a href="../index.html">← Back</a><h1>Plank Timer 🧘</h1><span></span></div>
<div class="game" id="startScreen">
  <div class="big-emoji">🧘</div>
  <h2 style="margin:15px 0">Plank Hold Challenge</h2>
  <p style="color:#94a3b8;text-align:center">Hold your plank as long as you can!<br>Choose your target time:</p>
  <div class="level-sel">
    <div class="level-opt active" onclick="setTarget(30,this)">30s</div>
    <div class="level-opt" onclick="setTarget(60,this)">60s</div>
    <div class="level-opt" onclick="setTarget(120,this)">120s</div>
    <div class="level-opt" onclick="setTarget(300,this)">5min</div>
  </div>
  <button class="play-again btn btn-start" onclick="startPlank()">Start Plank!</button>
</div>
<div class="game hidden" id="gameScreen">
  <div class="big-emoji" id="emoji" style="animation:none">🧘</div>
  <div class="target">Target: <span id="targetDisp">60</span>s</div>
  <div class="timer-display" id="timerDisplay">0:00</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div id="status" style="min-height:24px;font-size:18px;color:#22c55e;margin:5px 0"></div>
  <button class="btn btn-stop" onclick="stopPlank()" style="margin-top:15px">STOP</button>
</div>
<div class="game hidden" id="resultScreen">
  <div class="result-card">
    <div class="big-emoji" style="animation:none">🏆</div>
    <h2>Great Hold!</h2>
    <p>You held for: <span id="finalTime" style="font-size:24px;color:#22d3ee;font-weight:bold">0s</span></p>
    <p>Target: <span id="finalTarget">60s</span></p>
    <p>Status: <span id="finalStatus">Keep going!</span></p>
    <p>Score: <span id="finalScore">0</span></p>
    <button class="play-again" onclick="resetGame()">Play Again</button>
  </div>
</div>
<script>
let target=60,elapsed=0,timerInt=null,started=false;
function setTarget(t,el){target=t;document.querySelectorAll('.level-opt').forEach(e=>e.classList.remove('active'));el.classList.add('active');document.getElementById('targetDisp').textContent=t>=60?Math.floor(t/60)+'min':t+'s'}
function startPlank(){document.getElementById('startScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');elapsed=0;updateTimer();timerInt=setInterval(()=>{elapsed++;updateTimer();updateProgress()},1000);started=true}
function updateTimer(){let m=Math.floor(elapsed/60),s=elapsed%60;document.getElementById('timerDisplay').textContent=m+':'+(s<10?'0':'')+s;let d=document.getElementById('timerDisplay');if(elapsed%10===0&&elapsed>0){d.classList.add('shake');setTimeout(()=>d.classList.remove('shake'),300)}}
function updateProgress(){let pct=Math.min(elapsed/target*100,100);document.getElementById('progressFill').style.width=pct+'%';
  if(pct>=100){document.getElementById('status').textContent='🎉 Target reached!';document.getElementById('emoji').textContent='🏆';document.getElementById('emoji').classList.add('pulse')}
  else if(pct>=75){document.getElementById('status').textContent='Almost there!';document.getElementById('emoji').textContent='💪';document.getElementById('emoji').classList.remove('pulse')}
  else if(pct>=50){document.getElementById('status').textContent='Halfway!';document.getElementById('emoji').textContent='🔥'}
  else{document.getElementById('status').textContent='Keep holding!';document.getElementById='emoji').textContent='🧘'}
}
function stopPlank(){if(!started)return;clearInterval(timerInt);started=false;let score=Math.floor(elapsed*5+(elapsed>=target?500:0));
  document.getElementById('gameScreen').classList.add('hidden');document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('finalTime').textContent=elapsed+'s';document.getElementById('finalTarget').textContent=target+'s';
  document.getElementById('finalStatus').textContent=elapsed>=target?'✅ Target reached!':'Try again!';
  document.getElementById('finalScore').textContent=score}
function resetGame(){document.getElementById('resultScreen').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden');document.getElementById('emoji').classList.remove('pulse')}
</script>
</body></html>
