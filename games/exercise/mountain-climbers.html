<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mountain Climbers 🏔️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top-bar{width:100%;padding:12px 20px;background:#1e293b;display:flex;justify-content:space-between;align-items:center}
.top-bar a{color:#38bdf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px}
.game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:500px;padding:20px}
.big-emoji{font-size:80px;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.hidden{display:none}
.result-card{background:#1e293b;border-radius:16px;padding:30px;text-align:center}
.result-card h2{color:#22c55e}
.result-card p{color:#94a3b8;margin:5px 0}
.play-again{background:#22c55e;color:#0f172a;border:none;padding:14px 40px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:15px}
.tap-btn{width:180px;height:180px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#16a34a);border:none;color:#fff;font-size:22px;font-weight:bold;cursor:pointer;transition:transform .1s}
.tap-btn:active{transform:scale(.92)}
.score-display{display:flex;gap:15px;margin:10px 0}
.score-box{background:#1e293b;padding:10px 18px;border-radius:10px;text-align:center}
.score-box .label{font-size:12px;color:#94a3b8}
.score-box .value{font-size:22px;font-weight:bold;color:#22c55e}
.mountain{font-size:40px;margin:5px 0}
.progress-bar{width:100%;height:12px;background:#1e293b;border-radius:6px;margin:10px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#22c55e,#4ade80);border-radius:6px;transition:width .3s}
.speed-indicator{font-size:16px;color:#f59e0b;min-height:24px}
</style>
</head>
<body>
<div class="top-bar"><a href="../index.html">← Back</a><h1>Mountain Climbers 🏔️</h1><span></span></div>
<div class="game" id="startScreen">
  <div class="big-emoji">🏔️</div>
  <h2 style="margin:15px 0">Mountain Climbers</h2>
  <p style="color:#94a3b8;text-align:center">Tap rapidly to count mountain climbers!<br>Speed matters - faster = more points!</p>
  <button class="play-again" onclick="startGame()">Start</button>
</div>
<div class="game hidden" id="gameScreen">
  <div id="timer" style="font-size:24px;color:#f59e0b">⏱️ 0:00</div>
  <div class="score-display">
    <div class="score-box"><div class="label">CLIMBS</div><div class="value" id="repCount">0</div></div>
    <div class="score-box"><div class="label">LEVEL</div><div class="value" id="levelVal">1</div></div>
    <div class="score-box"><div class="label">SPEED</div><div class="value" id="speedVal">0</div></div>
  </div>
  <div class="mountain">🏔️⛰️🏔️</div>
  <div style="width:100%;height:12px;background:#1e293b;border-radius:6px;margin:10px 0;overflow:hidden">
    <div id="progressFill" style="height:100%;background:linear-gradient(90deg,#22c55e,#4ade80);border-radius:6px;transition:width .3s;width:0%"></div>
  </div>
  <div class="speed-indicator" id="speedIndicator">Tap fast!</div>
  <div class="big-emoji" id="exerciseEmoji" style="animation:bounce 1s infinite">🏔️</div>
  <button class="tap-btn" onclick="doClimb()">CLIMB!</button>
</div>
<div class="game hidden" id="resultScreen">
  <div class="result-card">
    <div class="big-emoji" style="animation:none">🏆</div>
    <h2>Summit Reached!</h2>
    <p>Total Climbs: <span id="finalReps">0</span></p>
    <p>Time: <span id="finalTime">0:00</span></p>
    <p>Level: <span id="finalLevel">1</span></p>
    <p>Max Speed: <span id="finalSpeed">0</span>/s</p>
    <p>Score: <span id="finalScore">0</span></p>
    <button class="play-again" onclick="resetGame()">Play Again</button>
  </div>
</div>
<script>
let reps=0,level=1,target=15,score=0,seconds=0,timerInt=null,started=false,lastTap=0,taps=0,maxSpeed=0,speedCheck=null;
function startGame(){document.getElementById('startScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');reps=0;level=1;target=15;score=0;seconds=0;taps=0;maxSpeed=0;updateDisplay();timerInt=setInterval(()=>{seconds++;document.getElementById('timer').textContent='⏱️ '+fmt(seconds)},1000);
  speedCheck=setInterval(()=>{let spd=taps;taps=0;if(spd>maxSpeed)maxSpeed=spd;document.getElementById('speedVal').textContent=spd+'/s';
    if(spd>10)document.getElementById('speedIndicator').textContent='🔥 On Fire!';
    else if(spd>5)document.getElementById('speedIndicator').textContent='💪 Good pace!';
    else document.getElementById('speedIndicator').textContent='Keep climbing!'},1000);started=true}
function fmt(s){let m=Math.floor(s/60);return m+':'+(s%60<10?'0':'')+(s%60)}
function doClimb(){
  if(!started)return;reps++;taps++;score+=10+level*2;
  let e=document.getElementById('exerciseEmoji');e.textContent=['🏔️','⛰️','🧗','🏃'][Math.floor(Math.random()*4)];e.style.transform='scale(1.3)';setTimeout(()=>e.style.transform='scale(1)',150);
  if(reps>=target){level++;target+=10+level*2;reps=0}
  updateDisplay();
}
function updateDisplay(){document.getElementById('repCount').textContent=reps;document.getElementById('levelVal').textContent=level;document.getElementById('progressFill').style.width=(reps/target*100)+'%'}
function resetGame(){clearInterval(timerInt);clearInterval(speedCheck);started=false;document.getElementById('resultScreen').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden')}
function endGame(){started=false;clearInterval(timerInt);clearInterval(speedCheck);document.getElementById('gameScreen').classList.add('hidden');document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('finalReps').textContent=reps;document.getElementById('finalTime').textContent=fmt(seconds);document.getElementById('finalLevel').textContent=level;document.getElementById('finalSpeed').textContent=maxSpeed;document.getElementById('finalScore').textContent=score}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!document.getElementById('gameScreen').classList.contains('hidden')){e.preventDefault();doClimb()}});
</script>
</body></html>
