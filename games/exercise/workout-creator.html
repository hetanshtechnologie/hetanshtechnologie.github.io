<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workout Creator 🛠️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top-bar{width:100%;padding:12px 20px;background:#1e293b;display:flex;justify-content:space-between;align-items:center}
.top-bar a{color:#38bdf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px}
.game{flex:1;display:flex;flex-direction:column;align-items:center;width:100%;max-width:600px;padding:15px;overflow-y:auto}
.hidden{display:none}
.result-card{background:#1e293b;border-radius:16px;padding:30px;text-align:center}
.result-card h2{color:#8b5cf6}
.result-card p{color:#94a3b8;margin:5px 0}
.play-again{background:#8b5cf6;color:#fff;border:none;padding:14px 40px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:15px}
.section-title{font-size:16px;font-weight:bold;color:#8b5cf6;margin:12px 0 8px;width:100%;display:flex;align-items:center;gap:8px}
.exercise-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.ex-card{padding:12px;border-radius:12px;background:#1e293b;border:2px solid #334155;cursor:pointer;transition:all .2s;text-align:center}
.ex-card:hover{border-color:#8b5cf6}
.ex-card.selected{border-color:#8b5cf6;background:#2a1a4a}
.ex-card .emoji{font-size:28px}
.ex-card .name{font-size:13px;font-weight:bold;margin:4px 0}
.ex-card .target{font-size:11px;color:#94a3b8}
.workout-list{width:100%;margin:10px 0}
.workout-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:#1e293b;margin:5px 0}
.workout-item .w-num{width:24px;height:24px;border-radius:50%;background:#8b5cf6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold}
.workout-item .w-emoji{font-size:22px}
.workout-item .w-info{flex:1}
.workout-item .w-name{font-size:14px;font-weight:bold}
.workout-item .w-detail{font-size:12px;color:#94a3b8}
.workout-item .w-remove{background:none;border:none;color:#ef4444;cursor:pointer;font-size:16px;padding:4px}
.config-row{display:flex;gap:8px;margin:5px 0;width:100%}
.config-row label{color:#94a3b8;font-size:13px;flex:1}
.config-row input{width:70px;padding:6px;border-radius:6px;background:#0f172a;border:1px solid #334155;color:#e2e8f0;text-align:center;font-size:13px}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer}
.btn-primary{background:#8b5cf6;color:#fff}
.btn-danger{background:#ef4444;color:#fff}
.btn-success{background:#22c55e;color:#fff}
.btn-sm{padding:6px 14px;font-size:12px}
.workout-summary{background:#1e293b;border-radius:12px;padding:16px;width:100%;margin:10px 0}
.summary-row{display:flex;justify-content:space-between;padding:4px 0;color:#94a3b8;font-size:14px}
.summary-row .val{color:#8b5cf6;font-weight:bold}
.empty-msg{color:#64748b;text-align:center;padding:20px;font-size:14px}
.bottom-actions{display:flex;gap:10px;margin-top:10px;width:100%}
.bottom-actions .btn{flex:1;text-align:center}
</style>
</head>
<body>
<div class="top-bar"><a href="../index.html">← Back</a><h1>Workout Creator 🛠️</h1><span></span></div>
<div class="game" id="createScreen">
  <div class="section-title">📚 Exercise Library</div>
  <div class="exercise-grid" id="exerciseGrid"></div>
  <div class="section-title">🏋️ Your Workout <span id="countLabel" style="font-weight:normal;color:#94a3b8;font-size:13px">(0 exercises)</span></div>
  <div class="workout-list" id="workoutList">
    <div class="empty-msg">Tap exercises above to add them to your workout!</div>
  </div>
  <div class="workout-summary" id="summary" style="display:none">
    <div class="summary-row"><span>Exercises:</span><span class="val" id="sumEx">0</span></div>
    <div class="summary-row"><span>Est. Time:</span><span class="val" id="sumTime">0 min</span></div>
    <div class="summary-row"><span>Difficulty:</span><span class="val" id="sumDiff">-</span></div>
    <div class="summary-row"><span>Focus:</span><span class="val" id="sumFocus">-</span></div>
  </div>
  <div class="bottom-actions">
    <button class="btn btn-danger btn-sm" onclick="clearWorkout()">Clear All</button>
    <button class="btn btn-primary btn-sm" onclick="saveWorkout()" id="saveBtn">Save & View</button>
  </div>
</div>
<div class="game hidden" id="viewScreen">
  <div style="font-size:60px;margin:10px 0">🏋️</div>
  <h2 style="color:#8b5cf6;margin:10px 0" id="workoutTitle">My Workout</h2>
  <div id="viewList" style="width:100%"></div>
  <div class="workout-summary" id="viewSummary"></div>
  <div style="display:flex;gap:10px;margin-top:10px;width:100%">
    <button class="btn btn-primary" onclick="editWorkout()" style="flex:1">Edit Workout</button>
    <button class="btn btn-success" onclick="shareWorkout()" style="flex:1">Share</button>
  </div>
  <div id="shareOutput" class="hidden" style="width:100%;margin-top:10px">
    <textarea id="shareText" readonly style="width:100%;height:100px;border-radius:8px;background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:10px;font-size:13px;resize:none"></textarea>
    <button class="btn btn-primary btn-sm" onclick="copyShare()" style="margin-top:5px">Copy to Clipboard</button>
  </div>
</div>
<script>
const exercises=[
  {emoji:'💪',name:'Push-Ups',target:'Chest, Triceps',cat:'strength',time:3},
  {emoji:'🦵',name:'Squats',target:'Quads, Glutes',cat:'strength',time:3},
  {emoji:'🏋️',name:'Lunges',target:'Legs, Balance',cat:'strength',time:4},
  {emoji:'🧘',name:'Plank',target:'Core',cat:'core',time:2},
  {emoji:'🔥',name:'Burpees',target:'Full Body',cat:'cardio',time:5},
  {emoji:'⭐',name:'Jumping Jacks',target:'Cardio',cat:'cardio',time:3},
  {emoji:'🏔️',name:'Mountain Climbers',target:'Core, Cardio',cat:'cardio',time:4},
  {emoji:'🏃',name:'High Knees',target:'Cardio, Legs',cat:'cardio',time:3},
  {emoji:'🤸',name:'Sit-Ups',target:'Abs',cat:'core',time:3},
  {emoji:'💪',name:'Dips',target:'Triceps',cat:'strength',time:3},
  {emoji:'🧘',name:'Glute Bridges',target:'Glutes, Hamstrings',cat:'strength',time:3},
  {emoji:'🔄',name:'Jump Rope',target:'Cardio, Coordination',cat:'cardio',time:4}
];
let workout=[];
function init(){let grid=document.getElementById('exerciseGrid');grid.innerHTML='';
  exercises.forEach((ex,i)=>{
    let card=document.createElement('div');card.className='ex-card';card.id='ex'+i;
    card.innerHTML=`<div class="emoji">${ex.emoji}</div><div class="name">${ex.name}</div><div class="target">${ex.target}</div>`;
    card.onclick=()=>addToWorkout(i);grid.appendChild(card);
  });
}
function addToWorkout(idx){
  workout.push({...exercises[idx],sets:3,reps:10});updateWorkoutList();
}
function removeFromWorkout(idx){workout.splice(idx,1);updateWorkoutList()}
function updateWorkoutList(){
  let list=document.getElementById('workoutList');
  if(workout.length===0){list.innerHTML='<div class="empty-msg">Tap exercises above to add them!</div>';document.getElementById('summary').style.display='none';document.getElementById('countLabel').textContent='(0 exercises)';return}
  list.innerHTML='';document.getElementById('summary').style.display='block';
  document.getElementById('countLabel').textContent='('+workout.length+' exercises)';
  let totalTime=0,catCount={strength:0,cardio:0,core:0};
  workout.forEach((w,i)=>{
    catCount[w.cat]=(catCount[w.cat]||0)+1;
    let item=document.createElement('div');item.className='workout-item';
    item.innerHTML=`<div class="w-num">${i+1}</div><span class="w-emoji">${w.emoji}</span><div class="w-info"><div class="w-name">${w.name}</div><div class="w-detail"><input type="number" value="${w.sets}" min="1" max="20" style="width:35px;padding:2px;border-radius:4px;background:#0f172a;border:1px solid #334155;color:#e2e8f0;text-align:center;font-size:12px" onchange="workout[${i}].sets=+this.value;updateSummary()"> sets × <input type="number" value="${w.reps}" min="1" max="100" style="width:35px;padding:2px;border-radius:4px;background:#0f172a;border:1px solid #334155;color:#e2e8f0;text-align:center;font-size:12px" onchange="workout[${i}].reps=+this.value;updateSummary()"> reps</div></div><button class="w-remove" onclick="removeFromWorkout(${i})">✕</button>`;
    list.appendChild(item);totalTime+=w.sets*w.time;
  });
  updateSummary();
}
function updateSummary(){
  let totalTime=0,totalSets=0,cats={};
  workout.forEach(w=>{totalTime+=w.sets*w.time;totalSets+=w.sets;cats[w.cat]=(cats[w.cat]||0)+1});
  document.getElementById('sumEx').textContent=workout.length;
  document.getElementById('sumTime').textContent=totalTime+' min';
  let diff=totalSets<=15?'Easy':totalSets<=30?'Medium':totalSets<=50?'Hard':'Extreme';
  document.getElementById('sumDiff').textContent=diff;
  let focus=Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(e=>e[0]).join(', ');
  document.getElementById('sumFocus').textContent=focus||'-';
}
function clearWorkout(){workout=[];updateWorkoutList()}
function saveWorkout(){if(workout.length===0){alert('Add some exercises first!');return}
  document.getElementById('createScreen').classList.add('hidden');document.getElementById('viewScreen').classList.remove('hidden');
  let list=document.getElementById('viewList');list.innerHTML='';let totalTime=0;
  workout.forEach((w,i)=>{
    totalTime+=w.sets*w.time;
    let item=document.createElement('div');item.className='workout-item';
    item.innerHTML=`<div class="w-num">${i+1}</div><span class="w-emoji">${w.emoji}</span><div class="w-info"><div class="w-name">${w.name}</div><div class="w-detail">${w.sets} sets × ${w.reps} reps (${w.sets*w.time} min) - ${w.target}</div></div>`;
    list.appendChild(item);
  });
  document.getElementById('viewSummary').innerHTML=`<div class="summary-row"><span>Total Exercises:</span><span class="val">${workout.length}</span></div><div class="summary-row"><span>Est. Duration:</span><span class="val">${totalTime} min</span></div>`;
}
function editWorkout(){document.getElementById('viewScreen').classList.add('hidden');document.getElementById('createScreen').classList.remove('hidden')}
function shareWorkout(){
  let text='🏋️ My Workout:\n\n';workout.forEach((w,i)=>text+=(i+1)+'. '+w.emoji+' '+w.name+' - '+w.sets+'x'+w.reps+'\n');
  document.getElementById('shareText').value=text;document.getElementById('shareOutput').classList.remove('hidden');
}
function copyShare(){document.getElementById('shareText').select();document.execCommand('alert');alert('Copied!')}
init();
</script>
</body></html>
