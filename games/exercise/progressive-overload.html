<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Progressive Overload 📈</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top-bar{width:100%;padding:12px 20px;background:#1e293b;display:flex;justify-content:space-between;align-items:center}
.top-bar a{color:#38bdf8;text-decoration:none;font-size:14px}
.top-bar h1{font-size:18px}
.game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:500px;padding:20px}
.hidden{display:none}
.result-card{background:#1e293b;border-radius:16px;padding:30px;text-align:center}
.result-card h2{color:#22c55e}
.result-card p{color:#94a3b8;margin:5px 0}
.play-again{background:#22c55e;color:#0f172a;border:none;padding:14px 40px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:15px}
.tracker-card{background:#1e293b;border-radius:16px;padding:20px;width:100%;margin:8px 0}
.tracker-title{font-size:16px;font-weight:bold;color:#22c55e;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.weeks-grid{width:100%}
.week-row{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #334155}
.week-label{width:60px;color:#94a3b8;font-size:13px}
.week-input{flex:1;padding:8px;border-radius:6px;background:#0f172a;border:1px solid #334155;color:#e2e8f0;font-size:14px;text-align:center}
.week-input:focus{outline:none;border-color:#22c55e}
.arrow{font-size:16px;width:30px;text-align:center}
.arrow.up{color:#22c55e}
.arrow.down{color:#ef4444}
.arrow.same{color:#f59e0b}
.total-row{display:flex;justify-content:space-between;padding:12px;border-top:2px solid #334155;margin-top:8px}
.total-label{color:#94a3b8;font-weight:bold}
.total-value{color:#22c55e;font-weight:bold;font-size:18px}
.chart-area{width:100%;height:150px;background:#0f172a;border-radius:12px;margin:10px 0;position:relative;overflow:hidden;padding:10px}
.chart-bar{position:absolute;bottom:10px;width:30px;border-radius:6px 6px 0 0;transition:height .3s}
.chart-labels{display:flex;justify-content:space-around;margin-top:5px}
.chart-label{font-size:11px;color:#94a3b8}
.add-exercise{display:flex;gap:8px;margin:10px 0;width:100%}
.add-exercise select,.add-exercise input{padding:10px;border-radius:8px;background:#0f172a;border:2px solid #334155;color:#e2e8f0;font-size:14px}
.add-exercise select{flex:1}
.add-exercise input{width:80px}
.add-btn{padding:10px 20px;border:none;border-radius:8px;background:#22c55e;color:#0f172a;font-weight:bold;cursor:pointer}
.score-display{display:flex;gap:15px;margin:10px 0}
.score-box{background:#1e293b;padding:10px 18px;border-radius:10px;text-align:center}
.score-box .label{font-size:12px;color:#94a3b8}
.score-box .value{font-size:22px;font-weight:bold;color:#22c55e}
.btn{padding:12px 24px;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
.btn-primary{background:#22c55e;color:#0f172a}
</style>
</head>
<body>
<div class="top-bar"><a href="../index.html">← Back</a><h1>Progressive Overload 📈</h1><span></span></div>
<div class="game" id="startScreen">
  <div style="font-size:80px;animation:bounce 1s infinite">📈</div>
  <style>@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}</style>
  <h2 style="margin:15px 0">Progressive Overload Tracker</h2>
  <p style="color:#94a3b8;text-align:center">Track your progress across weeks!<br>Enter weights/reps and see your gains.</p>
  <button class="play-again btn btn-primary" onclick="startTracker()">Start Tracking</button>
</div>
<div class="game hidden" id="gameScreen">
  <div class="score-display">
    <div class="score-box"><div class="label">EXERCISE</div><div class="value" id="exerciseVal">Bench Press</div></div>
    <div class="score-box"><div class="label">WEEKS</div><div class="value" id="weeksVal">0</div></div>
    <div class="score-box"><div class="label">GROWTH</div><div class="value" id="growthVal">0%</div></div>
  </div>
  <div class="add-exercise">
    <select id="exerciseSelect">
      <option>Bench Press</option><option>Squat</option><option>Deadlift</option><option>Overhead Press</option><option>Barbell Row</option>
    </select>
    <input type="number" id="weightInput" placeholder="lbs" min="0">
    <input type="number" id="repsInput" placeholder="reps" min="1" value="10">
    <button class="add-btn" onclick="addWeek()">Add Week</button>
  </div>
  <div class="tracker-card">
    <div class="tracker-title">📊 Week-by-Week Progress</div>
    <div class="weeks-grid" id="weeksGrid"></div>
  </div>
  <div class="chart-area" id="chartArea"></div>
  <button class="btn btn-primary" onclick="endTracker()" style="margin-top:10px">Finish Tracking</button>
</div>
<div class="game hidden" id="resultScreen">
  <div class="result-card">
    <div style="font-size:80px">🏆</div>
    <h2>Progress Tracked!</h2>
    <p>Weeks: <span id="finalWeeks">0</span></p>
    <p>Exercise: <span id="finalExercise">-</span></p>
    <p>Growth: <span id="finalGrowth">0%</span></p>
    <p>Score: <span id="finalScore">0</span></p>
    <p id="finalMsg"></p>
    <button class="play-again" onclick="resetGame()">Play Again</button>
  </div>
</div>
<script>
let weeks=[],score=0;
function startTracker(){document.getElementById('startScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');weeks=[];updateDisplay()}
function addWeek(){
  let w=parseInt(document.getElementById('weightInput').value)||0;
  let r=parseInt(document.getElementById('repsInput').value)||10;
  let ex=document.getElementById('exerciseSelect').value;
  if(w<=0){alert('Enter a weight!');return}
  weeks.push({weight:w,reps:r,volume:w*r,exercise:ex});
  score+=50;if(weeks.length>1&&weeks[weeks.length-1].volume>weeks[weeks.length-2].volume)score+=100;
  document.getElementById('exerciseVal').textContent=ex;
  document.getElementById('weightInput').value='';updateDisplay();
}
function updateDisplay(){
  let grid=document.getElementById('weeksGrid');grid.innerHTML='';
  weeks.forEach((w,i)=>{
    let row=document.createElement('div');row.className='week-row';
    let arrow='→',cls='same';
    if(i>0){
      if(w.volume>weeks[i-1].volume){arrow='↑';cls='up'}
      else if(w.volume<weeks[i-1].volume){arrow='↓';cls='down'}
    }
    row.innerHTML=`<span class="week-label">Week ${i+1}</span><span style="color:#e2e8f0;flex:1">${w.weight} lbs × ${w.reps} reps</span><span style="color:#94a3b8;width:80px;text-align:right">Vol: ${w.volume}</span><span class="arrow ${cls}">${arrow}</span>`;
    grid.appendChild(row);
  });
  document.getElementById('weeksVal').textContent=weeks.length;
  let growth=0;if(weeks.length>1)growth=Math.round((weeks[weeks.length-1].volume-weeks[0].volume)/weeks[0].volume*100);
  document.getElementById('growthVal').textContent=growth+'%';
  drawChart();
}
function drawChart(){
  let chart=document.getElementById('chartArea');chart.innerHTML='';
  if(weeks.length<2)return;
  let maxVol=Math.max(...weeks.map(w=>w.volume));let barW=Math.min(30,Math.floor(450/weeks.length));
  weeks.forEach((w,i)=>{
    let h=Math.max(10,(w.volume/maxVol)*120);
    let bar=document.createElement('div');bar.className='chart-bar';
    bar.style.cssText=`left:${10+i*(barW+8)}px;height:${h}px;width:${barW}px;background:${w.volume>(i>0?weeks[i-1].volume:0)?'#22c55e':'#f59e0b'}`;
    bar.title='Week '+(i+1)+': '+w.volume;
    chart.appendChild(bar);
  });
}
function endTracker(){
  if(weeks.length<2){alert('Add at least 2 weeks!');return}
  document.getElementById('gameScreen').classList.add('hidden');document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('finalWeeks').textContent=weeks.length;
  document.getElementById('finalExercise').textContent=weeks[0].exercise;
  let growth=Math.round((weeks[weeks.length-1].volume-weeks[0].volume)/weeks[0].volume*100);
  document.getElementById('finalGrowth').textContent=growth+'%';document.getElementById('finalScore').textContent=score;
  document.getElementById('finalMsg').textContent=growth>0?'📈 Great progress! Keep pushing!':'📉 Try to increase weight or reps next week!'}
function resetGame(){document.getElementById('resultScreen').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden')}
</script>
</body></html>
