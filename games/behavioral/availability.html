<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Availability Heuristic Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;border-bottom:1px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:14px}
.topbar h1{margin-left:16px;font-size:18px;color:#e2e8f0}
.container{max-width:760px;margin:0 auto;padding:24px}
.stats{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stat{background:#1e293b;padding:12px 20px;border-radius:10px;flex:1;min-width:100px;text-align:center}
.stat .label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
.stat .value{font-size:24px;font-weight:700;color:#60a5fa;margin-top:4px}
.card{background:#1e293b;border-radius:12px;padding:28px;margin-bottom:20px;border:1px solid #334155}
.card h2{font-size:16px;color:#94a3b8;margin-bottom:8px;font-weight:500}
.scenario{font-size:17px;line-height:1.7;margin-bottom:20px;color:#e2e8f0}
.options{display:flex;flex-direction:column;gap:10px}
.option{background:#0f172a;border:2px solid #334155;border-radius:10px;padding:14px 18px;cursor:pointer;transition:all .2s;font-size:15px;text-align:left;color:#e2e8f0}
.option:hover{border-color:#60a5fa;background:#1a2744}
.option.correct{border-color:#22c55e;background:#052e16;color:#86efac}
.option.wrong{border-color:#ef4444;background:#450a0a;color:#fca5a5}
.option.disabled{pointer-events:none}
.explanation{margin-top:16px;padding:16px;background:#0f172a;border-radius:8px;border-left:4px solid #60a5fa;font-size:14px;line-height:1.6;color:#cbd5e1;display:none}
.explanation.show{display:block}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;transition:background .2s}
.btn:hover{background:#2563eb}
.btn-row{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.game-over{text-align:center;padding:40px 20px}
.game-over h2{font-size:28px;margin-bottom:12px;color:#60a5fa}
.game-over p{font-size:16px;color:#94a3b8;margin-bottom:24px}
.progress-bar{width:100%;height:6px;background:#334155;border-radius:3px;margin-bottom:24px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:3px;transition:width .3s}
.hidden{display:none}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">&larr; Back to Games</a><h1>Availability Heuristic</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
<div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
<div class="stat"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
<div class="stat"><div class="label">Question</div><div class="value" id="qnum">1/10</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div id="game-area"></div>
</div>
<script>
const qs=[
{q:"After seeing a plane crash on the news, you feel flying is more dangerous than driving. Statistically, driving is far more dangerous. This is:",options:["Good risk assessment","Availability Heuristic — vivid media coverage makes plane crashes seem more common","Statistical literacy","Fear response"],answer:1,explanation:"Availability Heuristic (Tversky & Kahneman): We judge probability by how easily examples come to mind. Dramatic plane crashes are vivid and memorable, making them seem more frequent than statistically common car accidents."},
{q:"You overestimate the crime rate in your city because you saw 3 robbery reports on the news today. This is:",options:["Informed citizen","Availability Heuristic — recent vivid examples inflate perceived frequency","Good news consumption","Statistical awareness"],answer:1,explanation:"Media Availability: News disproportionately covers dramatic crimes, making them cognitively available. You judge crime by how easily you can recall examples, not by actual rates."},
{q:"After an earthquake in your region, everyone buys earthquake insurance. Before the event, almost nobody had it. This is:",options:["Smart preparation","Availability Heuristic + recency — the event made earthquake risk vivid and salient","Insurance marketing","Government mandate"],answer:1,explanation:"Event-Driven Availability: The recent earthquake made the risk cognitively available. Before the event, earthquake risk was abstract and forgettable; after, it feels immediate and likely."},
{q:"People fear shark attacks more than heart disease, despite heart disease killing thousands more. The shark fear is driven by:",options:["Rational risk assessment","Availability Heuristic — dramatic shark attacks are vivid and memorable","Shark danger being high","Heart disease being rare"],answer:1,explanation:"Vividness Bias: Shark attacks are dramatic, visual, and emotionally charged — easily recalled. Heart disease is abstract, gradual, and mundane — hard to recall as vivid examples."},
{q:"A doctor diagnoses the disease they just studied in a medical conference, even though the patient's symptoms better match a different condition. This is:",options:["Good continuing education","Availability Heuristic — recently learned information is more cognitively available","Medical expertise","Patient's fault"],answer:1,explanation:"Medical Availability: Recently encountered information becomes more available in memory, making doctors over-diagnose conditions they recently learned about."},
{q:"You judge the likelihood of winning the lottery by recalling stories of winners you've heard about, not by the actual odds. This is:",options:["Good intuition","Availability Heuristic — winner stories are available, loser stories are not","Mathematical reasoning","Hope"],answer:1,explanation:"Winner Availability: Media covers winners but not the millions of losers. Your brain uses available winner stories as a frequency estimate, dramatically inflating perceived odds."},
{q:"After a friend tells a story about a car accident on a highway, you avoid that highway for weeks. This is:",options:["Safety consciousness","Availability Heuristic — the vivid personal story made the risk feel more likely","Good memory","Highway danger"],answer:1,explanation:"Personal Story Availability: Vivid, personally-relevant stories are more available than statistics. One friend's accident story outweighs years of safe driving statistics."},
{q:"A company experienced one data breach. Now they over-invest in cybersecurity while under-investing in employee health benefits (which kill more employees). This is:",options:["Good security focus","Availability Bias — the salient breach distorted risk allocation","Proper budgeting","IT priority"],answer:1,explanation:"Availability-Driven Resource Allocation: The memorable breach gets disproportionate attention and resources, while less dramatic but more impactful risks (health) are underfunded."},
{q:"You think tornadoes are more deadly than asthma because tornadoes get more news coverage. Actual data shows asthma kills 10x more. This is:",options:["Correct assessment","Availability Heuristic — tornado coverage makes them seem deadlier than asthma","Tornado danger","Asthma is rare"],answer:1,explanation:"Media Availability Distortion: Tornadoes are dramatic, visual, and newsworthy. Asthma is chronic, invisible, and mundane. Coverage distorts perceived mortality rates."},
{q:"After reading about a lottery winner who quit their job and bought a mansion, you daydream about doing the same. The availability of this narrative is:",options:["Inspiring","An availability distortion — millions of losers are invisible, one winner is salient","Financial planning","Realistic"],answer:1,explanation:"Selective Availability: One winner's story is vivid and available. The statistical reality (millions of losers) is invisible. Your brain uses the available story as a reference point."},
{q:"During flu season, people overestimate flu risk because they hear about cases everywhere. This is:",options:["Good awareness","Availability Heuristic — exposure to cases inflates perceived prevalence beyond actual rates","Seasonal illness","Medical advice"],answer:1,explanation:"Seasonal Availability: Hearing about flu cases constantly during flu season makes the risk feel more threatening than base rates justify. The information environment skews perception."},
{q:"After seeing a documentary about shark attacks, you're terrified of swimming in the ocean. The documentary created:",options:["Good ocean awareness","Availability Bias — emotional content made shark attacks cognitively over-represented","Realistic fear","Marine knowledge"],answer:1,explanation:"Documentary Availability: Emotional, visual content creates strong memories that are easily recalled. The documentary made shark attacks far more available in your mind than they statistically warrant."},
{q:"A city council increases fire department funding after a dramatic fire but doesn't fund road safety (which causes more deaths). This is:",options:["Smart budgeting","Availability Bias in policy — dramatic events get more resources than statistical risks","Fire safety priority","Political pressure"],answer:1,explanation:"Policy Availability Bias: Dramatic, visible events (fires) trigger stronger policy responses than statistical killers (road safety). Media coverage drives resource allocation."},
{q:"You judge a neighborhood as dangerous because you saw one crime report there, while ignoring 364 crime-free days. This is:",options:["Good safety assessment","Availability Heuristic — one vivid example outweighs the statistical base rate","Street smarts","Crime awareness"],answer:1,explanation:"Base Rate Neglect via Availability: One salient crime event dominates your mental model. The 364 uneventful days are cognitively invisible — you judge by the available example, not the statistical pattern."},
{q:"Investors sell stocks after seeing dramatic market crash news, even when fundamentals are sound. This is:",options:["Smart investing","Availability Heuristic — vivid crash narratives trigger panic selling","Risk management","Market analysis"],answer:1,explanation:"Financial Availability: Dramatic crash stories from 2008, 2020, etc. are vivid and easily recalled. After seeing crash coverage, investors overestimate the probability of further losses."},
{q:"You're more afraid of dying in a terrorist attack than in a car accident, despite car accidents being 1000x more likely. This is:",options:["Rational fear","Availability Heuristic — terrorism is vivid and memorable, car accidents are mundane","Safety concern","Statistical awareness"],answer:1,explanation:"Terrorism Availability: Terrorist attacks are dramatic, covered extensively, and emotionally charged. Car accidents are routine, invisible, and forgettable — despite being far deadlier."},
{q:"After hearing about a food contamination scare, you avoid all products from that company for months, even after the issue is resolved. This is:",options:["Good food safety","Availability Heuristic — the contamination story remains cognitively available, overriding new information","Brand loyalty","Consumer awareness"],answer:1,explanation:"Persistence of Availability: Once a dramatic event is encoded in memory, it remains available for a long time. New safety information doesn't easily replace the vivid contamination memory."},
{q:"A manager rates a new hire lower because they heard one story about the hire's previous company having layoffs. This is:",options:["Good reference checking","Availability Bias — one available story influenced the entire evaluation","Thorough vetting","Management skill"],answer:1,explanation:"Reference Availability: One vivid story about the candidate's previous company became disproportionately influential in the evaluation, overriding other available evidence."},
{q:"People who watch more crime TV shows overestimate crime rates. This is because:",options:["Crime shows are educational","Availability Heuristic — fictional crime becomes cognitively available and influences real-world judgments","Entertainment value","Cultural awareness"],answer:1,explanation:"Fictional Availability: Crime shows create vivid, easily recalled examples that the brain treats as data points. Heavy viewers have more available 'crime memories,' inflating perceived crime rates."},
{q:"To combat the Availability Heuristic, the best strategy is:",options:["Avoid all news and information","Seek out base rate statistics and compare with available examples","Trust your gut feeling","Only listen to vivid stories"],answer:1,explanation:"Statistical Thinking: Actively seeking base rate data counteracts availability bias. When you check actual numbers against your intuitive estimates, you can identify and correct distortions."}
];
let state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:[]};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getQ(){return shuffle([...qs]).slice(0,10)}
function updateStats(){document.getElementById('score').textContent=state.score;document.getElementById('level').textContent=state.level;document.getElementById('streak').textContent=state.streak;document.getElementById('qnum').textContent=`${state.q+1}/${state.questions.length}`;document.getElementById('progress').style.width=`${((state.q)/state.questions.length)*100}%`}
function renderQ(){if(state.q>=state.questions.length){renderOver();return}const q=state.questions[state.q];state.answered=false;document.getElementById('game-area').innerHTML=`<div class="card"><h2>Availability Heuristic</h2><div class="scenario">${q.q}</div><div class="options" id="options"></div><div class="explanation" id="explanation"></div><div class="btn-row"><button class="btn hidden" id="nextBtn" onclick="nextQ()">Next →</button></div></div>`;const opts=document.getElementById('options');q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>pick(i,b);opts.appendChild(b)});updateStats()}
function pick(i,btn){if(state.answered)return;state.answered=true;const q=state.questions[state.q];document.querySelectorAll('.option').forEach(b=>b.classList.add('disabled'));if(i===q.answer){btn.classList.add('correct');state.score+=10+state.streak*5;state.streak++;if(state.streak>state.maxStreak)state.maxStreak=state.streak;if(state.streak>=3)state.level=Math.floor(state.streak/3)+1}else{btn.classList.add('wrong');document.querySelectorAll('.option')[q.answer].classList.add('correct');state.streak=0}document.getElementById('explanation').textContent=q.explanation;document.getElementById('explanation').classList.add('show');document.getElementById('nextBtn').classList.remove('hidden');updateStats()}
function nextQ(){state.q++;renderQ()}
function renderOver(){const g=state.maxStreak>=8?'Availability Expert!':state.maxStreak>=5?'Heuristic Aware':state.maxStreak>=3?'Seeing Availability':'Keep Analyzing';document.getElementById('game-area').innerHTML=`<div class="card game-over"><h2>Availability Complete!</h2><p>Score: <strong>${state.score}</strong> | Max Streak: <strong>${state.maxStreak}</strong></p><p style="font-size:20px;color:#60a5fa;margin-bottom:24px">${g}</p><div class="btn-row"><button class="btn" onclick="resetGame()">Play Again</button></div></div>`;document.getElementById('progress').style.width='100%'}
function resetGame(){state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:getQ()};renderQ()}
state.questions=getQ();renderQ();
</script>
</body>
</html>
