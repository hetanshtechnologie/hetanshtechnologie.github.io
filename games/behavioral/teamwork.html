<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teamwork Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;border-bottom:1px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:14px}
.topbar h1{margin-left:16px;font-size:18px;color:#e2e8f0}
.container{max-width:760px;margin:0 auto;padding:24px}
.stats{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stat{background:#1e293b;padding:12px 20px;border-radius:10px;flex:1;min-width:100px;text-align:center}
.stat .label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
.stat .value{font-size:24px;font-weight:700;color:#60a5fa;margin-top:4px}
.card{background:#1e293b;border-radius:12px;padding:28px;margin-bottom:20px;border:1px solid #334155}
.card h2{font-size:16px;color:#94a3b8;margin-bottom:8px;font-weight:500}
.scenario{font-size:17px;line-height:1.7;margin-bottom:20px;color:#e2e8f0}
.options{display:flex;flex-direction:column;gap:10px}
.option{background:#0f172a;border:2px solid #334155;border-radius:10px;padding:14px 18px;cursor:pointer;transition:all .2s;font-size:15px;text-align:left;color:#e2e8f0}
.option:hover{border-color:#60a5fa;background:#1a2744}
.option.correct{border-color:#22c55e;background:#052e16;color:#86efac}
.option.wrong{border-color:#ef4444;background:#450a0a;color:#fca5a5}
.option.disabled{pointer-events:none}
.explanation{margin-top:16px;padding:16px;background:#0f172a;border-radius:8px;border-left:4px solid #60a5fa;font-size:14px;line-height:1.6;color:#cbd5e1;display:none}
.explanation.show{display:block}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;transition:background .2s}
.btn:hover{background:#2563eb}
.btn-row{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.game-over{text-align:center;padding:40px 20px}
.game-over h2{font-size:28px;margin-bottom:12px;color:#60a5fa}
.game-over p{font-size:16px;color:#94a3b8;margin-bottom:24px}
.progress-bar{width:100%;height:6px;background:#334155;border-radius:3px;margin-bottom:24px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:3px;transition:width .3s}
.hidden{display:none}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">&larr; Back to Games</a><h1>Teamwork Dynamics</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
<div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
<div class="stat"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
<div class="stat"><div class="label">Question</div><div class="value" id="qnum">1/10</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div id="game-area"></div>
</div>
<script>
const qs=[
{q:"A newly formed team is polite, avoids conflict, and members are cautious about their roles. Which of Tuckman's stages are they in?",options:["Storming","Norming","Forming","Performing"],answer:2,explanation:"Forming: Team members are polite, uncertain, and focused on orientation. They avoid conflict and test boundaries to understand the team's structure and norms."},
{q:"Team members start arguing about roles, processes, and direction. Which Tuckman stage?",options:["Forming","Storming","Norming","Adjourning"],answer:1,explanation:"Storming: Conflict emerges as members push against boundaries, challenge ideas, and compete for status. This is necessary but uncomfortable — it leads to genuine alignment."},
{q:"A team member consistently dominates meetings while others stay silent. What Belbin role is missing?",options:["Team Worker","Monitor Evaluator","Plant","Resource Investigator"],answer:1,explanation:"Monitor Evaluator: Provides balanced, critical thinking. Without this role, dominant voices go unchallenged and the team makes biased decisions."},
{q:"Two team members have a personality conflict. As a leader, the best first step:",options:["Ignore it and hope it resolves","Mediate a private conversation to understand both perspectives","Separate them permanently","Tell one to leave the team"],answer:1,explanation:"Conflict resolution begins with understanding both sides. Private mediation allows honest communication without public embarrassment, often resolving misunderstandings."},
{q:"A team has high individual talent but produces poor results. Most likely issue:",options:["Need more talented people","Lack of team cohesion and shared purpose","Pay is too low","Office is too small"],answer:1,explanation:"Talent without cohesion fails. Shared goals, trust, psychological safety, and coordinated effort matter more than individual brilliance. This is the 'Dream Team' paradox."},
{q:"In Belbin's framework, who ensures the team doesn't make hasty decisions?",options:["Shaper","Resource Investigator","Monitor Evaluator","Completer Finisher"],answer:2,explanation:"Monitor Evaluator: Steadies the team by thinking critically and objectively. They analyze options carefully, preventing impulsive decisions driven by enthusiasm."},
{q:"A team member always volunteers for tasks but never completes them. What role mismatch might this be?",options:["Shaper → too aggressive","Resource Investigator → starts but loses interest","Team Worker → avoids conflict","Plant → too creative"],answer:1,explanation:"Resource Investigator: Enthusiastic networker who explores opportunities but may lose interest once the initial excitement fades. Pairing with Completer Finisher helps."},
{q:"Google's Project Aristotle found the #1 predictor of team effectiveness was:",options:["Individual intelligence of team members","Psychological safety","Working in the same location","Similar backgrounds"],answer:1,explanation:"Psychological Safety: Team members feel safe to take risks, speak up, and be vulnerable without fear of punishment. It's the foundation of effective teamwork."},
{q:"A cross-functional team has members from engineering, marketing, and finance. What's the biggest challenge?",options:["Different time zones","Conflicting jargon, priorities, and mental models","Too many people","Not enough meetings"],answer:1,explanation:"Cross-functional teams struggle with different professional languages, priorities, and problem-solving approaches. Building shared understanding is the primary challenge."},
{q:"A team leader makes all decisions without consulting anyone. According to Tuckman, this team will likely:",options:["Perform well under clear direction","Get stuck in Storming due to lack of autonomy","Achieve high Norming quickly","Successfully adjourn"],answer:1,explanation:"Autocratic leadership suppresses autonomy and voice, key to team development. Without participation, team members disengage and conflict festers beneath the surface."},
{q:"After a major project, a team feels sad about disbanding. This is Tuckman's:",options:["Performing","Norming","Storming","Adjourning"],answer:3,explanation:"Adjourning: Teams that formed strong bonds experience grief when the team disbands. Recognizing this emotional response validates the team's meaningful work together."},
{q:"A team member consistently plays 'Devil's Advocate.' In Belbin's framework, this is:",options:["Team Worker","Monitor Evaluator","Specialist","Shaper"],answer:1,explanation:"Monitor Evaluator and Specialist roles often play devil's advocate. They provide critical thinking that prevents groupthink and ensures decisions are well-tested."},
{q:"A team uses 'round-robin' brainstorming where everyone speaks in turn. This technique:",options:["Slows down creative flow","Ensures equal participation and reduces dominance","Produces lower quality ideas","Only works for small teams"],answer:1,explanation:"Structured turn-taking ensures all voices are heard, reduces social loafing, and prevents dominant personalities from controlling the conversation."},
{q:"A team reaches the Performing stage. What characterizes their interaction?",options:["Frequent arguments","Fluid roles, shared leadership, high trust and efficiency","Everyone agrees on everything","Formal communication only"],answer:1,explanation:"Performing: Teams operate with minimal supervision. Roles flex based on task needs, leadership is shared, and the focus is on results rather than process."},
{q:"Two team members have different work styles — one wants detailed plans, the other wants flexibility. This is:",options:["Personality conflict","A generational difference","A legitimate diversity of working styles that needs accommodation","Evidence the team is failing"],answer:2,explanation:"Working style diversity is normal and beneficial. Accommodating different approaches (structured vs flexible) through explicit agreements leverages the diversity."},
{q:"A team that avoids all conflict and makes decisions too quickly is suffering from:",options:["Groupthink","Analysis paralysis","Too much leadership","Over-norming"],answer:0,explanation:"Groupthink: The desire for harmony overrides realistic evaluation. Teams self-censor, assume consensus, and don't explore alternatives — leading to poor decisions."},
{q:"Which Belbin role helps build team morale and facilitates cooperation?",options:["Shaper","Plant","Team Worker","Specialist"],answer:2,explanation:"Team Worker: Diplomatic, perceptive, and cooperative. They build relationships, prevent friction, and help team members work together harmoniously."},
{q:"A remote team struggles with trust and communication. Best intervention:",options:["More meetings","Establish regular virtual social interactions + clear async communication norms","Switch back to in-office","Replace team members"],answer:1,explanation:"Remote teams need intentional trust-building (social interactions) and structured communication (async norms) to compensate for missing informal interactions."},
{q:"After a failed project, a team leader blames individuals rather than examining systemic issues. This is:",options:["Accountability","Fundamental Attribution Error applied to teams","Good leadership","Necessary discipline"],answer:1,explanation:"Fundamental Attribution Error: Overemphasizing individual causes while ignoring situational/systemic factors. Effective post-mortems examine processes, not just people."},
{q:"A team has a 'Shaper' who drives action but clashes with others. Best management approach:",options:["Remove them from the team","Channel their energy toward goals while pairing with diplomatic Team Workers","Let them lead everything","Ignore the conflict"],answer:1,explanation:"Shapers bring drive and energy but need balance. Pairing with Team Workers and setting clear behavioral expectations channels their intensity productively."}
];
let state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:[]};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getQ(){return shuffle([...qs]).slice(0,10)}
function updateStats(){document.getElementById('score').textContent=state.score;document.getElementById('level').textContent=state.level;document.getElementById('streak').textContent=state.streak;document.getElementById('qnum').textContent=`${state.q+1}/${state.questions.length}`;document.getElementById('progress').style.width=`${((state.q)/state.questions.length)*100}%`}
function renderQ(){if(state.q>=state.questions.length){renderOver();return}const q=state.questions[state.q];state.answered=false;document.getElementById('game-area').innerHTML=`<div class="card"><h2>Team Dynamics Scenario</h2><div class="scenario">${q.q}</div><div class="options" id="options"></div><div class="explanation" id="explanation"></div><div class="btn-row"><button class="btn hidden" id="nextBtn" onclick="nextQ()">Next →</button></div></div>`;const opts=document.getElementById('options');q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>pick(i,b);opts.appendChild(b)});updateStats()}
function pick(i,btn){if(state.answered)return;state.answered=true;const q=state.questions[state.q];document.querySelectorAll('.option').forEach(b=>b.classList.add('disabled'));if(i===q.answer){btn.classList.add('correct');state.score+=10+state.streak*5;state.streak++;if(state.streak>state.maxStreak)state.maxStreak=state.streak;if(state.streak>=3)state.level=Math.floor(state.streak/3)+1}else{btn.classList.add('wrong');document.querySelectorAll('.option')[q.answer].classList.add('correct');state.streak=0}document.getElementById('explanation').textContent=q.explanation;document.getElementById('explanation').classList.add('show');document.getElementById('nextBtn').classList.remove('hidden');updateStats()}
function nextQ(){state.q++;renderQ()}
function renderOver(){const g=state.maxStreak>=8?'Team Dynamics Expert!':state.maxStreak>=5?'Team Player':state.maxStreak>=3?'Growing Together':'Keep Learning';document.getElementById('game-area').innerHTML=`<div class="card game-over"><h2>Teamwork Complete!</h2><p>Score: <strong>${state.score}</strong> | Max Streak: <strong>${state.maxStreak}</strong></p><p style="font-size:20px;color:#60a5fa;margin-bottom:24px">${g}</p><div class="btn-row"><button class="btn" onclick="resetGame()">Play Again</button></div></div>`;document.getElementById('progress').style.width='100%'}
function resetGame(){state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:getQ()};renderQ()}
state.questions=getQ();renderQ();
</script>
</body>
</html>
