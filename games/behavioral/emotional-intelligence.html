<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emotional Intelligence Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;border-bottom:1px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:14px}
.topbar a:hover{text-decoration:underline}
.topbar h1{margin-left:16px;font-size:18px;color:#e2e8f0}
.container{max-width:760px;margin:0 auto;padding:24px}
.stats{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stat{background:#1e293b;padding:12px 20px;border-radius:10px;flex:1;min-width:100px;text-align:center}
.stat .label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
.stat .value{font-size:24px;font-weight:700;color:#60a5fa;margin-top:4px}
.card{background:#1e293b;border-radius:12px;padding:28px;margin-bottom:20px;border:1px solid #334155}
.card h2{font-size:16px;color:#94a3b8;margin-bottom:8px;font-weight:500}
.scenario{font-size:17px;line-height:1.7;margin-bottom:20px;color:#e2e8f0}
.options{display:flex;flex-direction:column;gap:10px}
.option{background:#0f172a;border:2px solid #334155;border-radius:10px;padding:14px 18px;cursor:pointer;transition:all .2s;font-size:15px;text-align:left;color:#e2e8f0}
.option:hover{border-color:#60a5fa;background:#1a2744}
.option.correct{border-color:#22c55e;background:#052e16;color:#86efac}
.option.wrong{border-color:#ef4444;background:#450a0a;color:#fca5a5}
.option.disabled{pointer-events:none}
.explanation{margin-top:16px;padding:16px;background:#0f172a;border-radius:8px;border-left:4px solid #60a5fa;font-size:14px;line-height:1.6;color:#cbd5e1;display:none}
.explanation.show{display:block}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;transition:background .2s}
.btn:hover{background:#2563eb}
.btn-row{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.game-over{text-align:center;padding:40px 20px}
.game-over h2{font-size:28px;margin-bottom:12px;color:#60a5fa}
.game-over p{font-size:16px;color:#94a3b8;margin-bottom:24px}
.progress-bar{width:100%;height:6px;background:#334155;border-radius:3px;margin-bottom:24px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:3px;transition:width .3s}
.hidden{display:none}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">&larr; Back to Games</a><h1>Emotional Intelligence</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
<div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
<div class="stat"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
<div class="stat"><div class="label">Question</div><div class="value" id="qnum">1/10</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div id="game-area"></div>
</div>
<script>
const qs=[
{q:"Your colleague snaps at you during a meeting. They've been working 60-hour weeks. What's the most emotionally intelligent response?",options:["Snap back to establish boundaries","Ignore it completely","Recognize they may be stressed and address it privately later","Report them to HR immediately"],answer:2,explanation:"Emotional intelligence involves empathy — recognizing others' emotional states and responding thoughtfully. Addressing it privately shows both awareness and respect."},
{q:"You're feeling frustrated because your project was rejected. Which response demonstrates highest EI?",options:["Suppress the frustration and pretend it's fine","Blame the reviewers for not understanding","Acknowledge your frustration, then seek constructive feedback","Quit the project entirely"],answer:2,explanation:"Self-awareness (acknowledging frustration) combined with constructive action is a hallmark of high EI. Neither suppression nor blame is productive."},
{q:"A friend shares devastating personal news. What's the best EI response?",options:["Immediately try to fix the problem","Share a similar story about yourself","Listen actively, validate their feelings, and ask how you can help","Tell them to stay positive"],answer:2,explanation:"Empathetic listening without judgment or rushing to solutions demonstrates social awareness. Validating emotions before problem-solving is key."},
{q:"You notice a team member has been unusually quiet in meetings for two weeks. Best approach?",options:["Call them out publicly in the next meeting","Pretend you haven't noticed","Have a private, caring check-in conversation","Tell their manager"],answer:2,explanation:"Social awareness involves noticing changes in behavior. A private, caring approach shows empathy and creates safety for them to share."},
{q:"During a heated argument, you feel your heart racing and face getting hot. What should you do?",options:["Keep arguing to prove your point","Take a brief pause, breathe, and resume when calm","Yell louder to assert dominance","Walk away permanently"],answer:1,explanation:"Self-regulation is managing emotions in real-time. Recognizing physiological signs of anger and taking a pause prevents reactive behavior you might regret."},
{q:"You receive harsh criticism on your work. The highest EI response is:",options:["Defend yourself immediately","Reject the criticism as unfair","Thank them, separate emotional reaction from content, and evaluate objectively","Ignore it completely"],answer:2,explanation:"High EI means not letting emotional reactions override rational evaluation. You can acknowledge the delivery while still extracting useful feedback."},
{q:"Your manager gives you an impossible deadline. What's the EI-healthy approach?",options:["Accept silently to avoid conflict","Refuse outright","Communicate your concerns respectfully, propose alternatives, and negotiate","Complain to colleagues"],answer:2,explanation:"Assertive communication — expressing needs while respecting others — is a core EI skill. It balances self-expression with relationship preservation."},
{q:"A team member takes credit for your idea in a meeting. How do you handle this with high EI?",options:["Interrupt and call them out publicly","Let it go but harbor resentment","Address it privately, explain the impact, and suggest how to handle credit-sharing in future","Immediately start looking for a new job"],answer:2,explanation:"Direct, private confrontation with a forward-looking solution demonstrates self-assertion without aggression, and preserves the working relationship."},
{q:"You're leading a team through a major change. What EI strategy helps most?",options:["Present the facts and expect compliance","Acknowledge people's fears, communicate openly, and involve them in the transition","Delay the announcement as long as possible","Focus only on the positive outcomes"],answer:1,explanation:"Change triggers anxiety. Emotionally intelligent leaders validate concerns, maintain transparency, and give people agency — reducing resistance and building trust."},
{q:"After a personal failure, you notice negative self-talk spiraling. Best EI intervention?",options:["Believe every negative thought","Distract yourself with work","Recognize the pattern, challenge irrational thoughts, practice self-compassion","Pretend the failure didn't happen"],answer:2,explanation:"Self-awareness of negative thought patterns + self-compassion is the EI approach. Neither rumination nor denial is healthy — balanced self-reflection is key."},
{q:"Your partner seems distant. You feel anxious and suspicious. What's the healthiest EI response?",options:["Accuse them of something","Spy on their phone","Express your feelings using 'I' statements and ask what's going on","Pretend everything is fine"],answer:2,explanation:"Emotional regulation + assertive communication: Expressing vulnerability ('I feel anxious') without accusation creates space for honest dialogue."},
{q:"You're in a negotiation and realize the other person is feeling cornered. What do you do?",options:["Press harder for your advantage","Change the dynamic — acknowledge their position, find common ground","Walk away from the deal","Ignore their feelings — it's just business"],answer:1,explanation:"Social awareness in negotiations: recognizing when pushing harder will backfire. Building rapport and finding win-win solutions creates better long-term outcomes."},
{q:"A friend always vents to you but never asks about your life. What's the EI-healthy response?",options:["Stop talking to them","Gently set boundaries while maintaining the friendship","Tell them they're selfish","Start venting exclusively to them"],answer:1,explanation:"Healthy boundaries are essential for emotional wellbeing. EI means asserting your needs compassionately without ending the relationship."},
{q:"You made a public mistake in a presentation. What's the most emotionally mature response?",options:["Pretend it didn't happen","Make excuses and blame technology","Acknowledge it briefly with humor, correct yourself, and move on","Apologize profusely for 10 minutes"],answer:2,explanation:"Self-confidence and self-regulation: Brief acknowledgment shows humility without dwelling. Humor diffuses tension and shows emotional resilience."},
{q:"During a performance review, your employee becomes defensive. How do you proceed?",options:["Push through with the criticism","Abandon the feedback entirely","Pause, acknowledge their feelings, then reframe feedback constructively","Write them up for being unprofessional"],answer:2,explanation:"Social awareness: Recognizing defensiveness as a natural response. Adapting your approach while maintaining the conversation demonstrates emotional flexibility."},
{q:"You're feeling overwhelmed with competing priorities. Best EI strategy?",options:["Work harder and longer hours","Say yes to everything to avoid letting people down","Assess what matters most, communicate realistic timelines, ask for help","Complain on social media"],answer:2,explanation:"Self-awareness (recognizing overwhelm) + self-regulation (prioritizing) + social skills (communicating boundaries) — all EI components working together."},
{q:"A colleague gossips about another team member to you. What's the EI response?",options:["Join in to build rapport","Redirect the conversation or set a boundary","Listen but don't participate","Immediately tell the person being discussed"],answer:1,explanation:"EI involves maintaining integrity while managing social dynamics. Redirecting or setting boundaries shows you won't participate in harmful behavior."},
{q:"You feel envious of a friend's success. What's the healthiest EI approach?",options:["Distance yourself from the friend","Suppress the envy completely","Acknowledge the feeling without judgment, reflect on what it tells you about your own goals","Criticize their success to feel better"],answer:2,explanation:"Self-awareness means acknowledging envy without shame. It often signals unmet aspirations — using it as information rather than acting on it is emotionally mature."},
{q:"During conflict, you realize you might be wrong. Best response?",options:["Double down on your position","Ignore the doubt","Admit uncertainty, ask for clarification, and be willing to update your view","Change your position immediately to end conflict"],answer:2,explanation:"Intellectual humility and self-awareness: Admitting uncertainty shows strength, not weakness. It builds trust and leads to better outcomes."},
{q:"After receiving praise, you feel uncomfortable and want to deflect. This response reflects:",options:["Healthy humility","Impostor syndrome and difficulty accepting positive feedback","Natural modesty","Cultural norms"],answer:1,explanation:"Difficulty accepting genuine praise often reflects impostor syndrome. EI involves developing the capacity to receive positive feedback gracefully."}
];
let state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:[]};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getQ(){return shuffle([...qs]).slice(0,10)}
function updateStats(){
document.getElementById('score').textContent=state.score;
document.getElementById('level').textContent=state.level;
document.getElementById('streak').textContent=state.streak;
document.getElementById('qnum').textContent=`${state.q+1}/${state.questions.length}`;
document.getElementById('progress').style.width=`${((state.q)/state.questions.length)*100}%`;
}
function renderQ(){
if(state.q>=state.questions.length){renderOver();return}
const q=state.questions[state.q];state.answered=false;
document.getElementById('game-area').innerHTML=`<div class="card"><h2>Emotional Intelligence Scenario</h2><div class="scenario">${q.q}</div><div class="options" id="options"></div><div class="explanation" id="explanation"></div><div class="btn-row"><button class="btn hidden" id="nextBtn" onclick="nextQ()">Next →</button></div></div>`;
const opts=document.getElementById('options');
q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>pick(i,b);opts.appendChild(b)});
updateStats();
}
function pick(i,btn){
if(state.answered)return;state.answered=true;
const q=state.questions[state.q];
document.querySelectorAll('.option').forEach(b=>b.classList.add('disabled'));
if(i===q.answer){btn.classList.add('correct');state.score+=10+state.streak*5;state.streak++;if(state.streak>state.maxStreak)state.maxStreak=state.streak;if(state.streak>=3)state.level=Math.floor(state.streak/3)+1}
else{btn.classList.add('wrong');document.querySelectorAll('.option')[q.answer].classList.add('correct');state.streak=0}
document.getElementById('explanation').textContent=q.explanation;
document.getElementById('explanation').classList.add('show');
document.getElementById('nextBtn').classList.remove('hidden');
updateStats();
}
function nextQ(){state.q++;renderQ()}
function renderOver(){
const g=state.maxStreak>=8?'Emotionally Intelligent!':state.maxStreak>=5?'Good EQ Awareness':state.maxStreak>=3?'Growing Empathy':'Keep Learning';
document.getElementById('game-area').innerHTML=`<div class="card game-over"><h2>EQ Assessment Complete!</h2><p>Score: <strong>${state.score}</strong> | Max Streak: <strong>${state.maxStreak}</strong></p><p style="font-size:20px;color:#60a5fa;margin-bottom:24px">${g}</p><div class="btn-row"><button class="btn" onclick="resetGame()">Play Again</button></div></div>`;
document.getElementById('progress').style.width='100%';
}
function resetGame(){state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:getQ()};renderQ()}
state.questions=getQ();renderQ();
</script>
</body>
</html>
