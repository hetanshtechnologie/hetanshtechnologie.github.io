<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cognitive Bias Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;border-bottom:1px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:14px}
.topbar a:hover{text-decoration:underline}
.topbar h1{margin-left:16px;font-size:18px;color:#e2e8f0}
.container{max-width:760px;margin:0 auto;padding:24px}
.stats{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stat{background:#1e293b;padding:12px 20px;border-radius:10px;flex:1;min-width:100px;text-align:center}
.stat .label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
.stat .value{font-size:24px;font-weight:700;color:#60a5fa;margin-top:4px}
.card{background:#1e293b;border-radius:12px;padding:28px;margin-bottom:20px;border:1px solid #334155}
.card h2{font-size:16px;color:#94a3b8;margin-bottom:8px;font-weight:500}
.scenario{font-size:17px;line-height:1.7;margin-bottom:20px;color:#e2e8f0}
.options{display:flex;flex-direction:column;gap:10px}
.option{background:#0f172a;border:2px solid #334155;border-radius:10px;padding:14px 18px;cursor:pointer;transition:all .2s;font-size:15px;text-align:left;color:#e2e8f0}
.option:hover{border-color:#60a5fa;background:#1a2744}
.option.correct{border-color:#22c55e;background:#052e16;color:#86efac}
.option.wrong{border-color:#ef4444;background:#450a0a;color:#fca5a5}
.option.disabled{pointer-events:none}
.explanation{margin-top:16px;padding:16px;background:#0f172a;border-radius:8px;border-left:4px solid #60a5fa;font-size:14px;line-height:1.6;color:#cbd5e1;display:none}
.explanation.show{display:block}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;transition:background .2s}
.btn:hover{background:#2563eb}
.btn:disabled{background:#334155;cursor:not-allowed}
.btn-row{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.game-over{text-align:center;padding:40px 20px}
.game-over h2{font-size:28px;margin-bottom:12px;color:#60a5fa}
.game-over p{font-size:16px;color:#94a3b8;margin-bottom:24px}
.progress-bar{width:100%;height:6px;background:#334155;border-radius:3px;margin-bottom:24px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:3px;transition:width .3s}
.hidden{display:none}
</style>
</head>
<body>
<div class="topbar">
<a href="../index.html">&larr; Back to Games</a>
<h1>Cognitive Bias Identifier</h1>
</div>
<div class="container">
<div class="stats">
<div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
<div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
<div class="stat"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
<div class="stat"><div class="label">Question</div><div class="value" id="qnum">1/10</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div id="game-area"></div>
</div>
<script>
const allQuestions=[
{q:"Sarah saw 3 negative reviews for a restaurant and decided to never eat there, ignoring hundreds of positive ones.",options:["Anchoring Bias","Confirmation Bias","Negativity Bias","Survivorship Bias"],answer:2,explanation:"Negativity Bias: People give more weight to negative information than positive. Sarah focused on 3 bad reviews while ignoring hundreds of good ones."},
{q:"After buying an expensive non-refundable ticket, Tom attends a terrible show instead of doing something enjoyable.",options:["Sunk Cost Fallacy","Loss Aversion","Hindsight Bias","Framing Effect"],answer:0,explanation:"Sunk Cost Fallacy: Continuing a behavior because of previously invested resources (money, time) rather than future value. Tom wastes more time on a bad show."},
{q:"After hearing a stock tip from a friend, Mike only notices news articles confirming the stock will rise.",options:["Confirmation Bias","Anchoring","Bandwagon Effect","Dunning-Kruger"],answer:0,explanation:"Confirmation Bias: Seeking information that confirms pre-existing beliefs while ignoring contradictory evidence. Mike filters information to match his expectation."},
{q:"A manager rates an employee highly on all criteria after they gave one brilliant presentation.",options:["Halo Effect","Recency Bias","Halo Effect","Survivorship Bias"],answer:0,explanation:"Halo Effect: One positive trait influences overall perception. One great presentation colored the manager's entire evaluation of the employee."},
{q:"People estimate the number of African countries in the UN higher after being asked if it's more or less than 50.",options:["Framing Effect","Anchoring Bias","Base Rate Neglect","Gambler's Fallacy"],answer:1,explanation:"Anchoring Bias: An initial number (50) influences subsequent estimates even when irrelevant. The anchor skews judgment toward that reference point."},
{q:"After a plane crash makes headlines, John refuses to fly despite statistics showing it's the safest transport.",options:["Availability Heuristic","Negativity Bias","Confirmation Bias","Status Quo Bias"],answer:0,explanation:"Availability Heuristic: Overestimating likelihood of events that come easily to mind. Vivid media coverage makes plane crashes seem more common than they are."},
{q:"Lisa believes she could have predicted the housing market crash if she had just paid attention.",options:["Hindsight Bias","Overconfidence","Optimism Bias","Dunning-Kruger"],answer:0,explanation:"Hindsight Bias: The 'I knew it all along' effect. After learning an outcome, people believe they would have predicted it, rewriting their memory."},
{q:"Mark always takes the same route to work and never considers alternatives even though there may be faster ones.",options:["Status Quo Bias","Anchoring","Sunk Cost","Bandwagon Effect"],answer:0,explanation:"Status Quo Bias: Preference for the current state of affairs. Changes from the baseline are perceived as losses, so Mark sticks with familiar routines."},
{q:"After winning the lottery, Jenny attributes it to her special 'lucky number strategy' rather than pure chance.",options:["Illusory Correlation","Optimism Bias","Self-Serving Bias","Dunning-Kruger"],answer:0,explanation:"Illusory Correlation: Perceiving a relationship between variables where none exists. Jenny connects unrelated events (lucky numbers and winning)."},
{q:"A CEO dismisses expert warnings about a new market, believing her past successes guarantee future wins.",options:["Overconfidence Bias","Anchoring","Halo Effect","Authority Bias"],answer:0,explanation:"Overconfidence Bias: Excessive confidence in one's own judgments and abilities. Past success doesn't guarantee future outcomes, but the CEO overestimates her predictive ability."},
{q:"Tommy thinks his favorite sports team wins because of skill but loses because of bad refereeing.",options:["Self-Serving Bias","Fundamental Attribution Error","Confirmation Bias","Halo Effect"],answer:0,explanation:"Self-Serving Bias: Attributing successes to internal factors (skill) and failures to external factors (referees) to protect self-esteem."},
{q:"During a study, participants who knew a painting was expensive rated it as more aesthetically pleasing.",options:["Price-Quality Bias","Anchoring","Authority Bias","Bandwagon Effect"],answer:0,explanation:"Price-Quality Bias (Anchoring): The high price acts as an anchor, leading people to perceive higher quality and aesthetic value."},
{q:"After her friend group all started meditation, Amy begins meditating too without researching its benefits.",options:["Bandwagon Effect","Social Proof","Conformity","All of the above"],answer:3,explanation:"All three: Bandwagon (joining because others do), Social Proof (using others' behavior as guidance), and Conformity (adjusting behavior to match group)."},
{q:"An interviewer forms a first impression in 30 seconds and spends the rest of the interview confirming it.",options:["Primacy Effect","Halo Effect","Confirmation Bias","Snap Judgment Bias"],answer:0,explanation:"Primacy Effect: First impressions have disproportionate influence on subsequent judgment. The interviewer anchors on initial impressions and seeks confirming evidence."},
{q:"People judge the probability of dying in a shark attack higher than dying from a falling vending machine.",options:["Availability Heuristic","Negativity Bias","Media Bias","Anchoring"],answer:0,explanation:"Availability Heuristic: Shark attacks are dramatic and memorable (available in memory), while vending machine deaths are mundane. Vividness inflates perceived probability."},
{q:"After being told a wine costs $90, wine tasters rate it superior to the same wine labeled $10.",options:["Anchoring Bias","Price-Quality Bias","Placebo Effect","Halo Effect"],answer:0,explanation:"Anchoring Bias: The price tag serves as an anchor that biases taste perception. The same wine tastes 'better' when people expect it to be expensive."},
{q:"Investors hold losing stocks too long hoping to break even, but sell winners quickly.",options:["Disposition Effect","Loss Aversion","Sunk Cost Fallacy","Endowment Effect"],answer:0,explanation:"Disposition Effect: Combining loss aversion and regret avoidance. Investors delay selling losers (to avoid realizing losses) and sell winners prematurely (to lock in gains)."},
{q:"After a colleague gets promoted, Jake assumes the process must have been fair and based purely on merit.",options:["Just-World Hypothesis","Optimism Bias","Fundamental Attribution Error","Halo Effect"],answer:0,explanation:"Just-World Hypothesis: Belief that people get what they deserve. Jake assumes the world is fair, ignoring potential bias or luck in the promotion process."},
{q:"A doctor prescribes expensive brand-name drugs when equally effective generics are available, because she associates price with quality.",options:["Anchoring Effect","Authority Bias","Status Quo Bias","All of the above"],answer:0,explanation:"Anchoring Effect: The high price of brand-name drugs serves as an anchor, leading the doctor to perceive them as superior despite equivalent effectiveness."},
{q:"During a brainstorming session, the team leader's initial idea dominates all subsequent discussion.",options:["Anchoring Bias","Groupthink","Authority Bias","All of the above"],answer:3,explanation:"All three: The leader's idea anchors the discussion (Anchoring), team members defer to authority (Authority Bias), and dissent is suppressed (Groupthink)."}
];
let state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:[]};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getQuestions(){return shuffle([...allQuestions]).slice(0,10)}
function updateStats(){
document.getElementById('score').textContent=state.score;
document.getElementById('level').textContent=state.level;
document.getElementById('streak').textContent=state.streak;
document.getElementById('qnum').textContent=`${state.q+1}/${state.questions.length}`;
document.getElementById('progress').style.width=`${((state.q)/state.questions.length)*100}%`;
}
function renderQuestion(){
if(state.q>=state.questions.length){renderGameOver();return}
const q=state.questions[state.q];
state.answered=false;
const area=document.getElementById('game-area');
area.innerHTML=`<div class="card"><h2>Identify the Cognitive Bias</h2><div class="scenario">${q.q}</div><div class="options" id="options"></div><div class="explanation" id="explanation"></div><div class="btn-row"><button class="btn hidden" id="nextBtn" onclick="nextQ()">Next Question →</button></div></div>`;
const opts=document.getElementById('options');
q.options.forEach((o,i)=>{
const btn=document.createElement('button');
btn.className='option';
btn.textContent=o;
btn.onclick=()=>selectAnswer(i,btn);
opts.appendChild(btn);
});
updateStats();
}
function selectAnswer(i,btn){
if(state.answered)return;
state.answered=true;
const q=state.questions[state.q];
const btns=document.querySelectorAll('.option');
btns.forEach(b=>b.classList.add('disabled'));
if(i===q.answer){btn.classList.add('correct');state.score+=10+state.streak*5;state.streak++;if(state.streak>state.maxStreak)state.maxStreak=state.streak;if(state.streak>=3)state.level=Math.floor(state.streak/3)+1}
else{btn.classList.add('wrong');btns[q.answer].classList.add('correct');state.streak=0}
document.getElementById('explanation').textContent=q.explanation;
document.getElementById('explanation').classList.add('show');
document.getElementById('nextBtn').classList.remove('hidden');
updateStats();
}
function nextQ(){state.q++;renderQuestion()}
function renderGameOver(){
const pct=Math.round((state.score/(state.questions.length*10))*100);
let grade=state.maxStreak>=8?'Cognitive Bias Expert!':state.maxStreak>=5?'Bias Aware':state.maxStreak>=3?'Getting There':'Keep Learning';
document.getElementById('game-area').innerHTML=`<div class="card game-over"><h2>Game Over!</h2><p>Your Score: <strong>${state.score}</strong> | Max Streak: <strong>${state.maxStreak}</strong></p><p style="font-size:20px;color:#60a5fa;margin-bottom:24px">${grade}</p><div class="btn-row"><button class="btn" onclick="resetGame()">Play Again</button></div></div>`;
document.getElementById('progress').style.width='100%';
}
function resetGame(){state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:shuffle([...allQuestions]).slice(0,10)};renderQuestion()}
state.questions=getQuestions();
renderQuestion();
</script>
</body>
</html>
