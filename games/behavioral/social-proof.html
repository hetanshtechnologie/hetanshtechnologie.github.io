<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Proof Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;border-bottom:1px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:14px}
.topbar h1{margin-left:16px;font-size:18px;color:#e2e8f0}
.container{max-width:760px;margin:0 auto;padding:24px}
.stats{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stat{background:#1e293b;padding:12px 20px;border-radius:10px;flex:1;min-width:100px;text-align:center}
.stat .label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
.stat .value{font-size:24px;font-weight:700;color:#60a5fa;margin-top:4px}
.card{background:#1e293b;border-radius:12px;padding:28px;margin-bottom:20px;border:1px solid #334155}
.card h2{font-size:16px;color:#94a3b8;margin-bottom:8px;font-weight:500}
.scenario{font-size:17px;line-height:1.7;margin-bottom:20px;color:#e2e8f0}
.options{display:flex;flex-direction:column;gap:10px}
.option{background:#0f172a;border:2px solid #334155;border-radius:10px;padding:14px 18px;cursor:pointer;transition:all .2s;font-size:15px;text-align:left;color:#e2e8f0}
.option:hover{border-color:#60a5fa;background:#1a2744}
.option.correct{border-color:#22c55e;background:#052e16;color:#86efac}
.option.wrong{border-color:#ef4444;background:#450a0a;color:#fca5a5}
.option.disabled{pointer-events:none}
.explanation{margin-top:16px;padding:16px;background:#0f172a;border-radius:8px;border-left:4px solid #60a5fa;font-size:14px;line-height:1.6;color:#cbd5e1;display:none}
.explanation.show{display:block}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;transition:background .2s}
.btn:hover{background:#2563eb}
.btn-row{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.game-over{text-align:center;padding:40px 20px}
.game-over h2{font-size:28px;margin-bottom:12px;color:#60a5fa}
.game-over p{font-size:16px;color:#94a3b8;margin-bottom:24px}
.progress-bar{width:100%;height:6px;background:#334155;border-radius:3px;margin-bottom:24px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:3px;transition:width .3s}
.hidden{display:none}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">&larr; Back to Games</a><h1>Social Proof</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
<div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
<div class="stat"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
<div class="stat"><div class="label">Question</div><div class="value" id="qnum">1/10</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div id="game-area"></div>
</div>
<script>
const qs=[
{q:"You choose a restaurant because it has a long line outside. This is:",options:["Confirmation bias","Social Proof (Cialdini)","Anchoring","Halo Effect"],answer:1,explanation:"Social Proof: When uncertain, people look to others' behavior as a guide. A long line signals 'this place must be good' — we use the crowd as information."},
{q:"An online store shows '12,847 people bought this today.' You're more likely to buy. Why?",options:["The product is objectively better","Social proof creates validation and urgency","You love numbers","It's cheaper"],answer:1,explanation:"Social proof numbers create both validation (many others chose this) and urgency (popular item might sell out). It's a powerful persuasion technique."},
{q:"In Asch's conformity experiments, ~75% of participants gave obviously wrong answers when confederates did. This shows:",options:["Poor eyesight","Conformity pressure overrides individual judgment","The experiment was flawed","People prefer wrong answers"],answer:1,explanation:"Asch Conformity Study: Group pressure can make people deny what they clearly see. Social conformity is so powerful it overrides direct sensory evidence."},
{q:"You walk into a party where everyone is standing. You stand too, even though chairs are available. This is:",options:["Informational Social Influence","Normative Social Influence","Both A and B","Neither"],answer:2,explanation:"Both: You might stand because you assume standing is the norm (normative) or because you think there's a reason to stand you don't know about (informational)."},
{q:"During an emergency, a crowd watches but nobody helps. Each person assumes someone else will act. This is:",options:["Social Proof","Bystander Effect (diffusion of responsibility)","Groupthink","Conformity"],answer:1,explanation:"Bystander Effect: The presence of others diffuses personal responsibility. Each individual assumes someone else will (or should) take action, so nobody does."},
{q:"A company hires candidates who remind them of successful employees. They mistake similarity for competence. This is:",options:["Social Proof gone wrong — using irrelevant social information","Nepotism","Meritocracy","Due diligence"],answer:0,explanation:"Misapplied Social Proof: Using 'someone like them succeeded' as evidence of competence is a logical error. Similarity in appearance/background doesn't predict performance."},
{q:"You see a product with 4.8 stars and 10,000 reviews vs 5.0 stars and 3 reviews. You choose the first. Why?",options:["More reviews = more social proof = more reliable rating","You can't do math","Three reviews is plenty","Stars don't matter"],answer:0,explanation:"Social Proof scales with number of data points. A high rating from thousands is more meaningful than a perfect rating from three — more people = more reliable signal."},
{q:"Your friend group all started crypto investing. You join without researching. This is:",options:["Smart investing","Social Proof + Bandwagon Effect + Fear of Missing Out","Diversification","Due diligence"],answer:1,explanation:"Multiple social influence forces combine: Social Proof (others are doing it), Bandwagon (everyone's jumping on), and FOMO (fear of missing potential gains)."},
{q:"A restaurant displays 'Voted Best Pizza in Town' on its sign. Even if you don't know the source, you assume quality. This is:",options:["Authority bias","Social Proof via third-party endorsement","Halo Effect","Anchoring"],answer:1,explanation:"Third-party endorsements are a form of social proof. The 'vote' implies many people evaluated and chose this restaurant, providing collective judgment as a quality signal."},
{q:"During a fire alarm at work, only one person heads for the exit. Others hesitate until that person moves, then follow. This demonstrates:",options:["Leadership","Social Proof in emergency — first mover triggers collective action","Laziness","Fear"],answer:1,explanation:"First-mover Social Proof: In ambiguous situations, one person's decisive action provides the social cue others need to act. This is why designated fire wardens are effective."},
{q:"You buy a book because it's a 'New York Times Bestseller.' This relies on:",options:["Social Proof (collective reader judgment)","Authority Bias (NYT is authoritative)","Both","Neither"],answer:2,explanation:"Bestseller lists combine social proof (millions of readers chose this) with authority (the NYT brand validates the choice). Both mechanisms reinforce the decision."},
{q:"A charity shows a photo of one starving child instead of showing statistics about millions. This is:",options:["Effective use of identifiable victim effect, which overrides social proof","Social Proof","Statistical reasoning","Guilt manipulation"],answer:0,explanation:"Identifiable Victim Effect: People respond more to one identifiable person's suffering than abstract statistics about millions. It's the opposite of social proof — one individual outweighs many."},
{q:"You notice your coworkers all work late, so you stay late too even when your work is done. This is:",options:["Productivity","Normative Conformity — adjusting behavior to match perceived group norms","Social Proof","Both B and C"],answer:3,explanation:"Workplace presenteeism driven by both normative conformity (wanting to fit in) and social proof (everyone's doing it, so it must be expected)."},
{q:"Online reviews for a new product show 50 five-star reviews all posted within 1 hour. Best interpretation:",options:["Great product everyone loves","Likely fake/manipulated social proof","Normal review pattern","The product is popular"],answer:1,explanation:"Authentic social proof is distributed over time. An unnatural cluster of identical ratings is a red flag for manufactured social proof (fake reviews)."},
{q:"A news anchor says 'Most Americans agree that...' This rhetorical device is:",options:["Factual reporting","Social Proof framing — implying consensus to influence opinion","Statistical analysis","Political commentary"],answer:1,explanation:"'Most people think...' is social proof in rhetoric. It implies consensus (you should agree because everyone else does) without necessarily providing solid evidence."},
{q:"You're unsure about a medical treatment but see that many patients in forums report positive outcomes. This is:",options:["Definitive proof the treatment works","Useful social proof but shouldn't replace medical evidence","Worthless information","The best evidence available"],answer:1,explanation:"Patient forums provide social proof (others' experiences) but suffer from selection bias (positive experiences are overreported). Medical evidence should guide decisions."},
{q:"A company's landing page shows logos of recognizable clients. This is:",options:["Anchoring","Social Proof via association with trusted brands","Halo Effect","Branding only"],answer:1,explanation:"Client logos provide social proof: 'If these reputable companies trust us, you should too.' It transfers the trust people have in known brands to the unknown company."},
{q:"You adopt a new slang word because everyone at school uses it, not because you like it. This is:",options:["Language evolution","Normative Social Influence — conforming to fit in","Informational Social Influence","Personal preference"],answer:1,explanation:"Normative Influence: You conform to meet social expectations and gain acceptance, not because you believe the behavior is correct. The motivation is belonging, not accuracy."},
{q:"A self-help guru claims 'Thousands have transformed their lives with my method!' Without evidence, this is:",options:["Proof of effectiveness","Social Proof claim designed to persuade through implied popularity","Honest advertising","Scientific evidence"],answer:1,explanation:"Unverified social proof claims are persuasive rhetoric, not evidence. The number 'thousands' creates an impression of widespread success without any verifiable data."},
{q:"Solomon Asch also found that conformity decreased when: one confederate gave the correct answer. This shows:",options:["Conformity is absolute","Social proof weakens when the consensus breaks — even one dissenter empowers others","People are always independent","The experiment was wrong"],answer:1,explanation:"The Asch dissent effect: One ally breaks the unanimity of the group, dramatically reducing conformity. This shows social proof depends on perceived consensus, not just numbers."}
];
let state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:[]};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getQ(){return shuffle([...qs]).slice(0,10)}
function updateStats(){document.getElementById('score').textContent=state.score;document.getElementById('level').textContent=state.level;document.getElementById('streak').textContent=state.streak;document.getElementById('qnum').textContent=`${state.q+1}/${state.questions.length}`;document.getElementById('progress').style.width=`${((state.q)/state.questions.length)*100}%`}
function renderQ(){if(state.q>=state.questions.length){renderOver();return}const q=state.questions[state.q];state.answered=false;document.getElementById('game-area').innerHTML=`<div class="card"><h2>Social Proof Scenario</h2><div class="scenario">${q.q}</div><div class="options" id="options"></div><div class="explanation" id="explanation"></div><div class="btn-row"><button class="btn hidden" id="nextBtn" onclick="nextQ()">Next →</button></div></div>`;const opts=document.getElementById('options');q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>pick(i,b);opts.appendChild(b)});updateStats()}
function pick(i,btn){if(state.answered)return;state.answered=true;const q=state.questions[state.q];document.querySelectorAll('.option').forEach(b=>b.classList.add('disabled'));if(i===q.answer){btn.classList.add('correct');state.score+=10+state.streak*5;state.streak++;if(state.streak>state.maxStreak)state.maxStreak=state.streak;if(state.streak>=3)state.level=Math.floor(state.streak/3)+1}else{btn.classList.add('wrong');document.querySelectorAll('.option')[q.answer].classList.add('correct');state.streak=0}document.getElementById('explanation').textContent=q.explanation;document.getElementById('explanation').classList.add('show');document.getElementById('nextBtn').classList.remove('hidden');updateStats()}
function nextQ(){state.q++;renderQ()}
function renderOver(){const g=state.maxStreak>=8?'Social Proof Expert!':state.maxStreak>=5?'Crowd Aware':state.maxStreak>=3?'Learning Influence':'Keep Exploring';document.getElementById('game-area').innerHTML=`<div class="card game-over"><h2>Social Proof Complete!</h2><p>Score: <strong>${state.score}</strong> | Max Streak: <strong>${state.maxStreak}</strong></p><p style="font-size:20px;color:#60a5fa;margin-bottom:24px">${g}</p><div class="btn-row"><button class="btn" onclick="resetGame()">Play Again</button></div></div>`;document.getElementById('progress').style.width='100%'}
function resetGame(){state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:getQ()};renderQ()}
state.questions=getQ();renderQ();
</script>
</body>
</html>
