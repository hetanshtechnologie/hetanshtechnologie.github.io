<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leadership Styles Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;border-bottom:1px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:14px}
.topbar h1{margin-left:16px;font-size:18px;color:#e2e8f0}
.container{max-width:760px;margin:0 auto;padding:24px}
.stats{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stat{background:#1e293b;padding:12px 20px;border-radius:10px;flex:1;min-width:100px;text-align:center}
.stat .label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
.stat .value{font-size:24px;font-weight:700;color:#60a5fa;margin-top:4px}
.card{background:#1e293b;border-radius:12px;padding:28px;margin-bottom:20px;border:1px solid #334155}
.card h2{font-size:16px;color:#94a3b8;margin-bottom:8px;font-weight:500}
.scenario{font-size:17px;line-height:1.7;margin-bottom:20px;color:#e2e8f0}
.options{display:flex;flex-direction:column;gap:10px}
.option{background:#0f172a;border:2px solid #334155;border-radius:10px;padding:14px 18px;cursor:pointer;transition:all .2s;font-size:15px;text-align:left;color:#e2e8f0}
.option:hover{border-color:#60a5fa;background:#1a2744}
.option.correct{border-color:#22c55e;background:#052e16;color:#86efac}
.option.wrong{border-color:#ef4444;background:#450a0a;color:#fca5a5}
.option.disabled{pointer-events:none}
.explanation{margin-top:16px;padding:16px;background:#0f172a;border-radius:8px;border-left:4px solid #60a5fa;font-size:14px;line-height:1.6;color:#cbd5e1;display:none}
.explanation.show{display:block}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;transition:background .2s}
.btn:hover{background:#2563eb}
.btn-row{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.game-over{text-align:center;padding:40px 20px}
.game-over h2{font-size:28px;margin-bottom:12px;color:#60a5fa}
.game-over p{font-size:16px;color:#94a3b8;margin-bottom:24px}
.progress-bar{width:100%;height:6px;background:#334155;border-radius:3px;margin-bottom:24px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:3px;transition:width .3s}
.hidden{display:none}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">&larr; Back to Games</a><h1>Leadership Styles</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
<div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
<div class="stat"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
<div class="stat"><div class="label">Question</div><div class="value" id="qnum">1/10</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div id="game-area"></div>
</div>
<script>
const qs=[
{q:"A CEO makes all strategic decisions without consulting her VPs. She announces changes via email with no discussion. This is:",options:["Democratic leadership","Autocratic leadership","Laissez-faire leadership","Transactional leadership"],answer:1,explanation:"Autocratic leadership: One person makes all decisions with little or no input from others. Effective in crises but demotivating long-term."},
{q:"A manager asks the team to vote on the project approach, then implements the majority choice. This is:",options:["Autocratic","Democratic/Participative","Laissez-faire","Servant leadership"],answer:1,explanation:"Democratic/Participative leadership: Involves team members in decision-making while the leader retains final authority. Builds buy-in and leverages collective intelligence."},
{q:"A manager gives no direction, rarely communicates, and lets the team figure everything out. This is:",options:["Democratic","Autocratic","Laissez-faire","Transformational"],answer:2,explanation:"Laissez-faire: Hands-off leadership with minimal intervention. Effective with highly skilled, self-motivated teams but leads to chaos with inexperienced groups."},
{q:"A leader focuses on removing obstacles for team members and asks 'How can I help you succeed?' This is:",options:["Transactional leadership","Servant leadership","Autocratic leadership","Situational leadership"],answer:1,explanation:"Servant Leadership (Greenleaf): The leader's primary role is to serve the team — removing barriers, developing people, and prioritizing their growth and wellbeing."},
{q:"During a fire emergency, the best leadership style is:",options:["Democratic — let everyone vote","Autocratic — clear, direct commands","Laissez-faire — let people figure it out","Transformational — inspire them"],answer:1,explanation:"Situational Leadership: In emergencies, autocratic/directive leadership saves lives. Clear commands with no debate is appropriate when safety and speed are critical."},
{q:"A leader articulates a compelling vision, inspires the team, and connects daily work to a larger purpose. This is:",options:["Transactional leadership","Transformational leadership","Laissez-faire leadership","Bureaucratic leadership"],answer:1,explanation:"Transformational Leadership (Burns/Bass): Inspires followers through vision, intellectual stimulation, individual consideration, and idealized influence."},
{q:"A leader rewards performance with bonuses and punishes missed targets. This is:",options:["Transformational","Transactional","Servant","Democratic"],answer:1,explanation:"Transactional Leadership: Based on exchanges — rewards for performance, consequences for failure. Effective for clear, defined tasks but doesn't inspire beyond the transaction."},
{q:"A manager adapts their style based on each team member's competence and commitment level. This is:",options:["Autocratic","Democratic","Situational Leadership (Hersey & Blanchard)","Transformational"],answer:2,explanation:"Situational Leadership: Matching leadership style (telling, selling, participating, delegating) to the follower's development level for the specific task."},
{q:"A leader focuses on maintaining existing procedures, following rules, and avoiding risk. This is:",options:["Transformational","Bureaucratic leadership","Democratic","Servant leadership"],answer:1,explanation:"Bureaucratic leadership: Relies on established rules, hierarchy, and procedures. Effective in regulated industries but stifles innovation."},
{q:"A CEO models ethical behavior, maintains integrity under pressure, and puts company values first. This is:",options:["Autocratic","Charismatic/Transformational","Laissez-faire","Transactional"],answer:1,explanation:"Charismatic/Transformational leaders lead by example. Their personal integrity and values-based decision-making inspire followers to emulate their behavior."},
{q:"A manager empowers a junior employee to lead a project, providing support but not direction. Best described as:",options:["Laissez-faire","Situational (delegating style)","Autocratic","Bureaucratic"],answer:1,explanation:"Situational Leadership — Delegating: For high-competence, high-commitment individuals, providing autonomy with availability for support is optimal."},
{q:"A team consistently meets targets but shows no innovation or extra effort. The leader most likely practices:",options:["Transformational leadership","Transactional leadership only","Servant leadership","Democratic leadership"],answer:1,explanation:"Pure transactional leadership produces compliance but not commitment. Without transformational elements (vision, inspiration), teams do only what's required."},
{q:"A leader who listens actively, empathizes with struggles, and develops individual relationships practices:",options:["Autocratic leadership","Servant/Emotionally Intelligent leadership","Bureaucratic leadership","Laissez-faire leadership"],answer:1,explanation:"Servant leadership combined with EI: Prioritizing people, showing empathy, and developing individuals creates loyalty and high performance."},
{q:"Hersey & Blanchard's model suggests you should 'tell' a new employee what to do when:",options:["They're high competence, high commitment","They're low competence, high commitment (enthusiastic beginner)","They're low competence, low commitment","They're experienced and confident"],answer:1,explanation:"Telling (S1): For enthusiastic beginners — high motivation but low skill. They need clear direction paired with their enthusiasm to build competence."},
{q:"A board of directors votes on strategy while the CEO provides analysis but doesn't push for a specific choice. This is:",options:["Autocratic","Democratic","Laissez-faire","Situational"],answer:1,explanation:"Democratic governance: The board collectively decides while the CEO informs but doesn't dictate. This is appropriate for high-stakes strategic decisions."},
{q:"Research suggests the most effective leadership approach is:",options:["Always autocratic","Always democratic","Matching style to situation and people (situational)","Always transformational"],answer:2,explanation:"No single style works everywhere. Effective leaders flex between styles based on context, team maturity, urgency, and task complexity. Situational flexibility is key."},
{q:"A manager creates a culture where failure is treated as learning. This approach aligns with:",options:["Transactional leadership","Autocratic leadership","Growth Mindset + Psychological Safety","Bureaucratic leadership"],answer:2,explanation:"Growth Mindset (Dweck) + Psychological Safety (Edmondson): Creating an environment where mistakes are learning opportunities drives innovation and risk-taking."},
{q:"During organizational restructuring, a leader communicates openly, acknowledges anxiety, and provides regular updates. This is:",options:["Autocratic — taking charge","Servant leadership — prioritizing people's emotional needs","Laissez-faire — avoiding the issue","Transactional — offering bonuses"],answer:1,explanation:"Servant leadership during change: Acknowledging people's concerns and communicating transparently builds trust and reduces resistance during uncertainty."},
{q:"A leader who develops future leaders rather than creating dependence practices:",options:["Autocratic leadership","Transactional leadership","Transformational/Servant leadership","Laissez-faire leadership"],answer:2,explanation:"Transformational/Servant leaders develop others' capabilities. The goal is not dependence on the leader but building the team's autonomous capacity."},
{q:"Blake & Mouton's Managerial Grid suggests the ideal leadership style is:",options:["High concern for production only","High concern for people only","High concern for both production and people","Low concern for both"],answer:2,explanation:"The 9,9 'Team Management' style balances high task concern with high people concern. This produces the best long-term results through committed, capable teams."}
];
let state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:[]};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getQ(){return shuffle([...qs]).slice(0,10)}
function updateStats(){document.getElementById('score').textContent=state.score;document.getElementById('level').textContent=state.level;document.getElementById('streak').textContent=state.streak;document.getElementById('qnum').textContent=`${state.q+1}/${state.questions.length}`;document.getElementById('progress').style.width=`${((state.q)/state.questions.length)*100}%`}
function renderQ(){if(state.q>=state.questions.length){renderOver();return}const q=state.questions[state.q];state.answered=false;document.getElementById('game-area').innerHTML=`<div class="card"><h2>Leadership Scenario</h2><div class="scenario">${q.q}</div><div class="options" id="options"></div><div class="explanation" id="explanation"></div><div class="btn-row"><button class="btn hidden" id="nextBtn" onclick="nextQ()">Next →</button></div></div>`;const opts=document.getElementById('options');q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>pick(i,b);opts.appendChild(b)});updateStats()}
function pick(i,btn){if(state.answered)return;state.answered=true;const q=state.questions[state.q];document.querySelectorAll('.option').forEach(b=>b.classList.add('disabled'));if(i===q.answer){btn.classList.add('correct');state.score+=10+state.streak*5;state.streak++;if(state.streak>state.maxStreak)state.maxStreak=state.streak;if(state.streak>=3)state.level=Math.floor(state.streak/3)+1}else{btn.classList.add('wrong');document.querySelectorAll('.option')[q.answer].classList.add('correct');state.streak=0}document.getElementById('explanation').textContent=q.explanation;document.getElementById('explanation').classList.add('show');document.getElementById('nextBtn').classList.remove('hidden');updateStats()}
function nextQ(){state.q++;renderQ()}
function renderOver(){const g=state.maxStreak>=8?'Leadership Expert!':state.maxStreak>=5?'Emerging Leader':state.maxStreak>=3?'Developing Style':'Keep Leading';document.getElementById('game-area').innerHTML=`<div class="card game-over"><h2>Leadership Complete!</h2><p>Score: <strong>${state.score}</strong> | Max Streak: <strong>${state.maxStreak}</strong></p><p style="font-size:20px;color:#60a5fa;margin-bottom:24px">${g}</p><div class="btn-row"><button class="btn" onclick="resetGame()">Play Again</button></div></div>`;document.getElementById('progress').style.width='100%'}
function resetGame(){state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:getQ()};renderQ()}
state.questions=getQ();renderQ();
</script>
</body>
</html>
