<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perception Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;border-bottom:1px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:14px}
.topbar h1{margin-left:16px;font-size:18px;color:#e2e8f0}
.container{max-width:760px;margin:0 auto;padding:24px}
.stats{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stat{background:#1e293b;padding:12px 20px;border-radius:10px;flex:1;min-width:100px;text-align:center}
.stat .label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
.stat .value{font-size:24px;font-weight:700;color:#60a5fa;margin-top:4px}
.card{background:#1e293b;border-radius:12px;padding:28px;margin-bottom:20px;border:1px solid #334155}
.card h2{font-size:16px;color:#94a3b8;margin-bottom:8px;font-weight:500}
.scenario{font-size:17px;line-height:1.7;margin-bottom:20px;color:#e2e8f0}
.options{display:flex;flex-direction:column;gap:10px}
.option{background:#0f172a;border:2px solid #334155;border-radius:10px;padding:14px 18px;cursor:pointer;transition:all .2s;font-size:15px;text-align:left;color:#e2e8f0}
.option:hover{border-color:#60a5fa;background:#1a2744}
.option.correct{border-color:#22c55e;background:#052e16;color:#86efac}
.option.wrong{border-color:#ef4444;background:#450a0a;color:#fca5a5}
.option.disabled{pointer-events:none}
.explanation{margin-top:16px;padding:16px;background:#0f172a;border-radius:8px;border-left:4px solid #60a5fa;font-size:14px;line-height:1.6;color:#cbd5e1;display:none}
.explanation.show{display:block}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;transition:background .2s}
.btn:hover{background:#2563eb}
.btn-row{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.game-over{text-align:center;padding:40px 20px}
.game-over h2{font-size:28px;margin-bottom:12px;color:#60a5fa}
.game-over p{font-size:16px;color:#94a3b8;margin-bottom:24px}
.progress-bar{width:100%;height:6px;background:#334155;border-radius:3px;margin-bottom:24px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:3px;transition:width .3s}
.hidden{display:none}
.illusion-box{text-align:center;padding:20px;margin:16px 0;background:#0f172a;border-radius:12px;border:1px solid #334155}
.color-block{display:inline-block;width:120px;height:80px;border-radius:8px;margin:8px;line-height:80px;font-weight:700;font-size:14px}
.muller-lyer{display:flex;justify-content:center;gap:40px;margin:16px 0}
.arrow-shape{font-size:48px;color:#60a5fa}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">&larr; Back to Games</a><h1>Perception & Attention</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
<div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
<div class="stat"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
<div class="stat"><div class="label">Question</div><div class="value" id="qnum">1/10</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div id="game-area"></div>
</div>
<script>
const qs=[
{q:"<div class='illusion-box'><div class='muller-lyer'><div class='arrow-shape'>&lt;---→</div><div class='arrow-shape'>←---&gt;</div></div><p style='color:#94a3b8;font-size:13px'>Which line looks longer?</p></div>The Muller-Lyer illusion tricks you because:",options:["One line is actually longer","Your brain misinterprets depth cues from the arrows","Your eyes are defective","The colors trick you"],answer:1,explanation:"Muller-Lyer Illusion: Inward-pointing arrows make lines look shorter, outward-pointing arrows make them look longer. Your brain applies 3D depth rules to 2D lines."},
{q:"<div class='illusion-box'><div style='font-size:36px;color:#60a5fa;font-weight:700;letter-spacing:8px'>A B C</div><p style='margin-top:8px;font-size:36px;color:#60a5fa;font-weight:700;letter-spacing:8px'>1 2 3</p><p style='color:#94a3b8;font-size:13px;margin-top:8px'>Same shape or different?</p></div>The middle characters are ambiguous. This demonstrates:",options:["Change blindness","Selective attention","Ambiguous figures and top-down processing","Inattentional blindness"],answer:2,explanation:"Top-down processing: Your brain uses context (letters vs numbers) to interpret the same ambiguous shape differently. Perception is constructed, not just received."},
{q:"During a basketball game, you're asked to count passes between white-shirted players. You miss a person in a gorilla suit walking through. This is:",options:["Change blindness","Inattentional blindness","Stereoscopic vision","Gestalt principle"],answer:1,explanation:"Inattentional Blindness (Simons & Chabris, 1999): When attention is focused on one task, we can fail to notice even obvious, unexpected stimuli in plain sight."},
{q:"You notice a 'dalmatian' in a spotted black-and-white image that initially looked like random dots. Once you see it, you can't unsee it. This is:",options:["Gestalt figure-ground organization","Change blindness","Selective attention only","Optical illusion"],answer:0,explanation:"Gestalt Principle of Figure-Ground: The brain organizes visual input into figure (object) and ground (background). Once the pattern is recognized, it becomes permanent."},
{q:"After staring at a red image for 30 seconds, you see a green afterimage. This is because:",options:["Your eyes are tired","Photoreceptor adaptation — red-sensitive cones fatigue","The screen is defective","Green is complementary to red in design"],answer:1,explanation:"Afterimage Effect: Prolonged exposure to a color fatigues specific cone cells. When you look away, the opposing cones (green-sensitive) are relatively more active, creating a complementary afterimage."},
{q:"You're in a noisy restaurant but can follow one conversation. This is the:",options:["Cocktail Party Effect","Change Blindness","McGurk Effect","Stroop Effect"],answer:0,explanation:"Cocktail Party Effect: Selective auditory attention allows you to focus on one sound source while filtering out others. Your brain uses spatial cues and voice characteristics."},
{q:"Reading this sentence is harder than it should be:<br><span style='color:#ff4444;font-size:20px;font-weight:700'>GREEN</span> <span style='color:#44ff44;font-size:20px;font-weight:700'>RED</span> <span style='color:#4444ff;font-size:20px;font-weight:700'>YELLOW</span><br>This is the:",options:["McGurk Effect","Stroop Effect","Ebbinghaus Illusion","Ponzo Illusion"],answer:1,explanation:"Stroop Effect: When color words are printed in mismatching ink colors, naming the ink color is slower because reading is more automatic than color naming. It demonstrates automatic processing."},
{q:"In a change blindness experiment, a person talking to you is secretly replaced by someone else during a brief interruption. Most people don't notice because:",options:["The replacement looks identical","Change detection requires attention to the specific changed feature","Humans have perfect memory","The replacement speaks the same words"],answer:1,explanation:"Change Blindness: We don't have a detailed mental picture of scenes. Change detection requires attention to the specific feature that changed — without focused attention, even major changes go unnoticed."},
{q:"Two circles of the same size look different when surrounded by larger vs smaller circles. This is the:",options:["Ebbinghaus Illitude","Ponzo Illusion","Muller-Lyer Illusion","Zollner Illusion"],answer:0,explanation:"Ebbinghaus (Titchener) Circles: A circle surrounded by large circles appears smaller than the same circle surrounded by small circles. Context alters size perception."},
{q:"During a magic show, the magician makes a coin 'disappear.' The technique relies on:",options:[" sleight of hand only","Misdirection — controlling your attention away from the secret move","Advanced technology","Your poor eyesight"],answer:1,explanation:"Misdirection exploits selective attention. The magician directs your attention (gaze, focus) away from the critical moment, making the 'impossible' possible."},
{q:"You hear 'baa' but see a video of someone saying 'gaa.' You perceive 'daa.' This is the:",options:["Stroop Effect","McGurk Effect","Cocktail Party Effect","Binaural Effect"],answer:1,explanation:"McGurk Effect: Visual speech information (lip movements) overrides auditory information, creating a merged perception. Vision can literally change what you hear."},
{q:"<div class='illusion-box'><div style='display:flex;justify-content:center;align-items:center;gap:16px'><div style='width:40px;height:40px;background:#e2e8f0;border-radius:4px'></div><div style='width:40px;height:40px;background:#e2e8f0;border-radius:50%'></div></div><p style='color:#94a3b8;font-size:13px;margin-top:12px'>Similar brightness? Check with a color picker!</p></div>The same white appears different on different backgrounds due to:",options:["Color blindness","Simultaneous Contrast Effect","Change blindness","Foveal vision"],answer:1,explanation:"Simultaneous Contrast: A color's appearance is influenced by surrounding colors. The same gray looks lighter on dark backgrounds and darker on light backgrounds."},
{q:"After driving the same route daily, you arrive at work with no memory of the drive. This is:",options:["Amnesia","Automatic processing / Highway Hypnosis","Sleep driving","Dissociative disorder"],answer:1,explanation:"Automatic Processing: Familiar, well-practiced tasks can be performed with minimal conscious attention. The brain automates routine behaviors, freeing cognitive resources."},
{q:"A short person looks taller when standing next to very tall people. This is an example of:",options:["Size constancy","Relative Size Perception / Contrast Effect","Muller-Lyer","Ponzo"],answer:1,explanation:"Relative Size Perception: We judge size by comparison to nearby objects/people. The same person appears taller or shorter depending on the reference frame."},
{q:"In the Müller-Lyer illusion, even knowing the lines are equal, they still look different. This demonstrates:",options:["Perception is entirely voluntary","Top-down processing can be overridden by bottom-up processing","We can control all perception","Knowledge eliminates all illusions"],answer:1,explanation:"Bottom-up processing (raw visual data) can override top-down knowledge. Even when you know the truth, your visual system still processes the illusion automatically."},
{q:"You notice a specific car model everywhere after buying one. This is:",options:["There are suddenly more of that car","Selective Attention + Availability Heuristic","Statistical anomaly","Confirmation bias only"],answer:1,explanation:"Selective Attention makes previously unnoticed items salient. Combined with the Availability Heuristic (recently noticed items seem more common), creating the illusion of increased frequency."},
{q:"The Necker cube appears to flip between two 3D orientations. This demonstrates:",options:["Binocular rivalry","Multistable perception — the brain alternates between valid interpretations","Eye defects","Motion perception"],answer:1,explanation:"Multistable Perception: When a stimulus has two equally valid interpretations, the brain spontaneously alternates between them. It can't maintain both simultaneously."},
{q:"You overestimate the time between traffic light changes when waiting. This is because:",options:["Traffic lights are broken","Internal clock speed changes with arousal/attention","Time passes differently at night","Watches are inaccurate"],answer:1,explanation:"Internal Clock Theory: When attending to time, internal 'pulses' are counted more, making time seem to pass more slowly. Arousal and attention affect subjective time perception."},
{q:"After entering a dark room, it takes 20-30 minutes to see clearly. This is:",options:["Blindness","Dark Adaptation — rod cells regenerate rhodopsin","Your eyes need cleaning","Light sensitivity"],answer:1,explanation:"Dark Adaptation: Rod photoreceptors need time to regenerate rhodopsin (light-sensitive pigment). Full adaptation takes 30-40 minutes, improving sensitivity 1000x."},
{q:"A musician plays a wrong note but the audience doesn't notice because they're focused on the melody. This is:",options:["Inattentional blindness applied to auditory processing","Good musicianship","Lucky timing","Auditory illusion"],answer:0,explanation:"Auditory Inattentional Blindness: Focus on the melody (stream) causes the brain to filter out individual 'wrong' notes. Attention determines what gets processed."}
];
let state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:[]};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getQ(){return shuffle([...qs]).slice(0,10)}
function updateStats(){document.getElementById('score').textContent=state.score;document.getElementById('level').textContent=state.level;document.getElementById('streak').textContent=state.streak;document.getElementById('qnum').textContent=`${state.q+1}/${state.questions.length}`;document.getElementById('progress').style.width=`${((state.q)/state.questions.length)*100}%`}
function renderQ(){if(state.q>=state.questions.length){renderOver();return}const q=state.questions[state.q];state.answered=false;document.getElementById('game-area').innerHTML=`<div class="card"><h2>Perception Challenge</h2><div class="scenario">${q.q}</div><div class="options" id="options"></div><div class="explanation" id="explanation"></div><div class="btn-row"><button class="btn hidden" id="nextBtn" onclick="nextQ()">Next →</button></div></div>`;const opts=document.getElementById('options');q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>pick(i,b);opts.appendChild(b)});updateStats()}
function pick(i,btn){if(state.answered)return;state.answered=true;const q=state.questions[state.q];document.querySelectorAll('.option').forEach(b=>b.classList.add('disabled'));if(i===q.answer){btn.classList.add('correct');state.score+=10+state.streak*5;state.streak++;if(state.streak>state.maxStreak)state.maxStreak=state.streak;if(state.streak>=3)state.level=Math.floor(state.streak/3)+1}else{btn.classList.add('wrong');document.querySelectorAll('.option')[q.answer].classList.add('correct');state.streak=0}document.getElementById('explanation').textContent=q.explanation;document.getElementById('explanation').classList.add('show');document.getElementById('nextBtn').classList.remove('hidden');updateStats()}
function nextQ(){state.q++;renderQ()}
function renderOver(){const g=state.maxStreak>=8?'Perception Master!':state.maxStreak>=5?'Sharp Observer':state.maxStreak>=3?'Train Your Eyes':'Keep Watching';document.getElementById('game-area').innerHTML=`<div class="card game-over"><h2>Perception Complete!</h2><p>Score: <strong>${state.score}</strong> | Max Streak: <strong>${state.maxStreak}</strong></p><p style="font-size:20px;color:#60a5fa;margin-bottom:24px">${g}</p><div class="btn-row"><button class="btn" onclick="resetGame()">Play Again</button></div></div>`;document.getElementById('progress').style.width='100%'}
function resetGame(){state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:getQ()};renderQ()}
state.questions=getQ();renderQ();
</script>
</body>
</html>
