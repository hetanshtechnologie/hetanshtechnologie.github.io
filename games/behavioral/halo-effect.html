<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halo Effect Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;border-bottom:1px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:14px}
.topbar h1{margin-left:16px;font-size:18px;color:#e2e8f0}
.container{max-width:760px;margin:0 auto;padding:24px}
.stats{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stat{background:#1e293b;padding:12px 20px;border-radius:10px;flex:1;min-width:100px;text-align:center}
.stat .label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
.stat .value{font-size:24px;font-weight:700;color:#60a5fa;margin-top:4px}
.card{background:#1e293b;border-radius:12px;padding:28px;margin-bottom:20px;border:1px solid #334155}
.card h2{font-size:16px;color:#94a3b8;margin-bottom:8px;font-weight:500}
.scenario{font-size:17px;line-height:1.7;margin-bottom:20px;color:#e2e8f0}
.options{display:flex;flex-direction:column;gap:10px}
.option{background:#0f172a;border:2px solid #334155;border-radius:10px;padding:14px 18px;cursor:pointer;transition:all .2s;font-size:15px;text-align:left;color:#e2e8f0}
.option:hover{border-color:#60a5fa;background:#1a2744}
.option.correct{border-color:#22c55e;background:#052e16;color:#86efac}
.option.wrong{border-color:#ef4444;background:#450a0a;color:#fca5a5}
.option.disabled{pointer-events:none}
.explanation{margin-top:16px;padding:16px;background:#0f172a;border-radius:8px;border-left:4px solid #60a5fa;font-size:14px;line-height:1.6;color:#cbd5e1;display:none}
.explanation.show{display:block}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;transition:background .2s}
.btn:hover{background:#2563eb}
.btn-row{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.game-over{text-align:center;padding:40px 20px}
.game-over h2{font-size:28px;margin-bottom:12px;color:#60a5fa}
.game-over p{font-size:16px;color:#94a3b8;margin-bottom:24px}
.progress-bar{width:100%;height:6px;background:#334155;border-radius:3px;margin-bottom:24px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:3px;transition:width .3s}
.hidden{display:none}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">&larr; Back to Games</a><h1>Halo & Horn Effect</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
<div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
<div class="stat"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
<div class="stat"><div class="label">Question</div><div class="value" id="qnum">1/10</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div id="game-area"></div>
</div>
<script>
const qs=[
{q:"A new employee is attractive and well-dressed. You automatically assume they're also intelligent and competent. This is:",options:["Good judgment","Halo Effect — one positive trait colors overall perception","Logical deduction","Fact-based assessment"],answer:1,explanation:"Halo Effect (Thorndike): One salient positive characteristic (attractiveness) creates a positive glow that influences all other judgments (intelligence, competence) without evidence."},
{q:"An employee who is always late gets negative performance reviews on ALL criteria, even tasks they excel at. This is:",options:["Fair evaluation","Horn Effect — one negative trait creates overall negative perception","Good management","Honest feedback"],answer:1,explanation:"Horn Effect: The opposite of Halo — one negative trait (tardiness) casts a negative shadow over all evaluations, even unrelated qualities. Both are unfair distortions."},
{q:"Celebrity endorsements work because consumers:",options:["Trust celebrities' product knowledge","Transfer positive feelings about the celebrity to the product (Halo Effect)","Like spending money","Want to be celebrities"],answer:1,explanation:"Celebrity Halo Effect: Positive feelings about the celebrity (attractiveness, likability) transfer to the endorsed product, improving perception regardless of product quality."},
{q:"A professor who gives an engaging first lecture receives higher ratings on all course evaluations, including 'organization' which students haven't yet experienced. This is:",options:["Good teaching","Halo Effect — engaging style creates positive bias for all criteria","Student laziness","Course quality"],answer:1,explanation:"Teaching Halo: Engaging first impressions create positive expectations that bias all subsequent evaluations. Students rate organization, clarity, etc. higher because they already like the professor."},
{q:"You meet someone at a party who tells great jokes. You later rate them as more trustworthy, intelligent, and kind than evidence supports. This is:",options:["Good social skills","Halo Effect — humor created a positive halo over unrelated traits","Accurate judgment","Party chemistry"],answer:1,explanation:"Social Halo: Positive social traits (humor, warmth) create halos that extend to unrelated domains. Being funny makes someone seem more trustworthy — logically unconnected but psychologically real."},
{q:"In hiring, structured interviews reduce Halo Effect because:",options:["They're shorter","They evaluate specific criteria independently rather than forming a global impression","They're more fun","They eliminate first impressions"],answer:1,explanation:"Structured interviews counter Halo by requiring separate ratings for specific competencies. Unstructured interviews allow global impressions to dominate, enabling the Halo Effect."},
{q:"A company's attractive logo and clean website make you assume their product quality is high. This is:",options:["Good design","Halo Effect — visual appeal creates quality expectations","Marketing truth","Product assessment"],answer:1,explanation:"Brand Halo: Visual design quality (logo, website) creates a halo that influences perceived product quality. Companies invest in design partly because of this bias."},
{q:"A movie with a famous director receives better reviews before anyone has seen it. Critics are influenced by:",options:["The director's actual skill","Halo Effect — reputation creates expectation of quality","Movie marketing","Critical standards"],answer:1,explanation:"Reputation Halo: A respected name (director, actor, studio) creates expectations that bias evaluation. Critics may unconsciously rate films higher when a renowned name is attached."},
{q:"You assume a well-dressed person at a job interview is also more competent than a casually dressed candidate with equal qualifications. This is:",options:["Professional judgment","Halo Effect — appearance biasing competence assessment","Dress code compliance","Interview protocol"],answer:1,explanation:"Appearance Halo: Clothing and grooming create halos that influence competence judgments. Studies show attractive/well-dressed people are rated as more intelligent and capable."},
{q:"After receiving one negative comment about your work from a colleague, you assume they don't like you at all. This is:",options:["Perceptive reading","Horn Effect — one negative data point creates a globally negative impression","Good intuition","Social awareness"],answer:1,explanation:"Horn Effect in Social Judgments: One negative interaction can create an overall negative perception that colors all future interactions with that person."},
{q:"A teacher who is warm and friendly is rated as more knowledgeable than one who is cold but equally expert. This demonstrates:",options:["Student error","Halo Effect — warmth creates a knowledge halo","Teaching quality","Expertise is subjective"],answer:1,explanation:"Warmth-Competence Halo: Social warmth creates a halo over perceived competence. This is why charismatic but less knowledgeable people are often perceived as more expert."},
{q:"In performance reviews, managers often rate employees similarly across all criteria. This ' halo error' means:",options:["Employees are consistently good","Managers are using a single global impression rather than evaluating each dimension","Reviews are accurate","Employees improve uniformly"],answer:1,explanation:"Rating Error: Halo Effect causes managers to let one strong/weak trait influence all ratings. Employees receive similar scores across dimensions rather than differentiated assessments."},
{q:"A product with Apple's branding is assumed to be better than an identical product with a generic brand. This is:",options:["Better engineering","Brand Halo Effect — brand equity transfers to perceived quality","Price difference","Marketing"],answer:1,explanation:"Brand Halo: Strong brands create halos that transfer positive associations to all products. The same specifications feel better when associated with a premium brand."},
{q:"A beautiful person is also assumed to be happier, more successful, and healthier. This 'attractiveness halo' is:",options:["Usually accurate","A cognitive bias — attractiveness has limited correlation with these traits","Universal truth","Social reality"],answer:1,explanation:"Attractiveness Halo: Physical attractiveness creates halos across unrelated domains. While there are small statistical correlations, the perceived magnitude of the effect far exceeds reality."},
{q:"During negotiations, someone who smiles and makes eye contact is perceived as more honest. This is:",options:["Reading body language correctly","Halo Effect — likability creating an honesty halo","Good communication","Trust assessment"],answer:1,explanation:"Likability-Honesty Halo: People who seem likable are also perceived as more honest, competent, and trustworthy — even when there's no evidence for these traits."},
{q:"A restaurant with a Michelin star is assumed to have better service, atmosphere, and value — not just food. This is:",options:["Correct assumption","Halo Effect — food quality creates positive bias for all aspects","Michelin criteria","Restaurant marketing"],answer:1,explanation:"Michelin Halo: The food quality award creates a halo that inflates perceptions of service, ambiance, and value — none of which are rated by Michelin inspectors."},
{q:"Research shows the Halo Effect is strongest when:",options:["You know someone well","First impressions are being formed and information is limited","You're analyzing data","You dislike the person"],answer:1,explanation:"Halo is strongest in early impressions with limited information. As you learn more about someone, individual traits can override the initial halo — but first impressions are powerful."},
{q:"To counteract the Halo Effect in hiring, companies should:",options:["Only hire friends","Use structured interviews with blind resume screening","Trust first impressions","Skip interviews"],answer:1,explanation:"Blind screening + structured evaluation reduces Halo by removing appearance, voice, and name from initial assessment. Independent criteria evaluation prevents global impression bias."},
{q:"The reverse Halo Effect (Horn Effect) is particularly dangerous in:",options:["Fashion","Performance reviews, criminal justice, and medical diagnosis — where impartiality is critical","Entertainment","Sports"],answer:1,explanation:"Horn Effect in high-stakes settings: One negative trait (race, accent, appearance) can bias judges, doctors, and managers to rate everything else negatively — with serious consequences."},
{q:"Self-awareness of the Halo Effect helps because:",options:["It eliminates the bias entirely","It doesn't eliminate it, but knowing about it helps you catch and correct biased judgments","It makes you arrogant","It doesn't help at all"],answer:1,explanation:"Awareness doesn't eliminate Halo (it's automatic), but it enables correction. When you notice yourself making global judgments, you can consciously separate criteria and evaluate independently."}
];
let state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:[]};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getQ(){return shuffle([...qs]).slice(0,10)}
function updateStats(){document.getElementById('score').textContent=state.score;document.getElementById('level').textContent=state.level;document.getElementById('streak').textContent=state.streak;document.getElementById('qnum').textContent=`${state.q+1}/${state.questions.length}`;document.getElementById('progress').style.width=`${((state.q)/state.questions.length)*100}%`}
function renderQ(){if(state.q>=state.questions.length){renderOver();return}const q=state.questions[state.q];state.answered=false;document.getElementById('game-area').innerHTML=`<div class="card"><h2>Halo / Horn Effect</h2><div class="scenario">${q.q}</div><div class="options" id="options"></div><div class="explanation" id="explanation"></div><div class="btn-row"><button class="btn hidden" id="nextBtn" onclick="nextQ()">Next →</button></div></div>`;const opts=document.getElementById('options');q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>pick(i,b);opts.appendChild(b)});updateStats()}
function pick(i,btn){if(state.answered)return;state.answered=true;const q=state.questions[state.q];document.querySelectorAll('.option').forEach(b=>b.classList.add('disabled'));if(i===q.answer){btn.classList.add('correct');state.score+=10+state.streak*5;state.streak++;if(state.streak>state.maxStreak)state.maxStreak=state.streak;if(state.streak>=3)state.level=Math.floor(state.streak/3)+1}else{btn.classList.add('wrong');document.querySelectorAll('.option')[q.answer].classList.add('correct');state.streak=0}document.getElementById('explanation').textContent=q.explanation;document.getElementById('explanation').classList.add('show');document.getElementById('nextBtn').classList.remove('hidden');updateStats()}
function nextQ(){state.q++;renderQ()}
function renderOver(){const g=state.maxStreak>=8?'Halo Expert!':state.maxStreak>=5?'Impression Aware':state.maxStreak>=3?'Seeing Through Halos':'Keep Observing';document.getElementById('game-area').innerHTML=`<div class="card game-over"><h2>Halo Effect Complete!</h2><p>Score: <strong>${state.score}</strong> | Max Streak: <strong>${state.maxStreak}</strong></p><p style="font-size:20px;color:#60a5fa;margin-bottom:24px">${g}</p><div class="btn-row"><button class="btn" onclick="resetGame()">Play Again</button></div></div>`;document.getElementById('progress').style.width='100%'}
function resetGame(){state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:getQ()};renderQ()}
state.questions=getQ();renderQ();
</script>
</body>
</html>
