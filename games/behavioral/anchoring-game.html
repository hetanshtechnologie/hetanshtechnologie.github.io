<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anchoring Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;border-bottom:1px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:14px}
.topbar h1{margin-left:16px;font-size:18px;color:#e2e8f0}
.container{max-width:760px;margin:0 auto;padding:24px}
.stats{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stat{background:#1e293b;padding:12px 20px;border-radius:10px;flex:1;min-width:100px;text-align:center}
.stat .label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
.stat .value{font-size:24px;font-weight:700;color:#60a5fa;margin-top:4px}
.card{background:#1e293b;border-radius:12px;padding:28px;margin-bottom:20px;border:1px solid #334155}
.card h2{font-size:16px;color:#94a3b8;margin-bottom:8px;font-weight:500}
.scenario{font-size:17px;line-height:1.7;margin-bottom:20px;color:#e2e8f0}
.options{display:flex;flex-direction:column;gap:10px}
.option{background:#0f172a;border:2px solid #334155;border-radius:10px;padding:14px 18px;cursor:pointer;transition:all .2s;font-size:15px;text-align:left;color:#e2e8f0}
.option:hover{border-color:#60a5fa;background:#1a2744}
.option.correct{border-color:#22c55e;background:#052e16;color:#86efac}
.option.wrong{border-color:#ef4444;background:#450a0a;color:#fca5a5}
.option.disabled{pointer-events:none}
.explanation{margin-top:16px;padding:16px;background:#0f172a;border-radius:8px;border-left:4px solid #60a5fa;font-size:14px;line-height:1.6;color:#cbd5e1;display:none}
.explanation.show{display:block}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;transition:background .2s}
.btn:hover{background:#2563eb}
.btn-row{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.game-over{text-align:center;padding:40px 20px}
.game-over h2{font-size:28px;margin-bottom:12px;color:#60a5fa}
.game-over p{font-size:16px;color:#94a3b8;margin-bottom:24px}
.progress-bar{width:100%;height:6px;background:#334155;border-radius:3px;margin-bottom:24px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:3px;transition:width .3s}
.hidden{display:none}
.anchors-demo{text-align:center;padding:20px;margin:16px 0;background:#0f172a;border-radius:12px;border:1px solid #334155}
.anchor-val{font-size:36px;font-weight:700;color:#60a5fa}
.anchor-label{font-size:13px;color:#94a3b8;margin-top:4px}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">&larr; Back to Games</a><h1>Anchoring Bias</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
<div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
<div class="stat"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
<div class="stat"><div class="label">Question</div><div class="value" id="qnum">1/10</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div id="game-area"></div>
</div>
<script>
const qs=[
{q:"<div class='anchors-demo'><div class='anchor-val'>$50</div><div class='anchor-label'>First price shown for a $30 item</div></div>When you see a $50 price tag first, then the real price of $30, you feel like it's a bargain. This is:",options:["Loss Aversion","Anchoring Bias","Framing Effect","Halo Effect"],answer:1,explanation:"Anchoring: The first number ($50) sets a reference point. Even though $50 was arbitrary, it makes $30 feel like a deal by comparison."},
{q:"A real estate agent shows you a $1.5M house first, then a $900K house. You think the second is a great deal. The $1.5M house served as:",options:["A decoy","An anchor that inflated perceived value of the second house","Market research","A distraction"],answer:1,explanation:"Anchoring in pricing: The expensive house sets a high anchor, making the $900K house seem reasonable even if it's overpriced for its features."},
{q:"Participants asked 'Is the population of Canada more or less than 100 million?' then estimate the actual number guess much higher than those asked 'more or less than 10 million.' This is:",options:["Framing Effect","Anchoring and Adjustment","Knowledge deficit","Statistical error"],answer:1,explanation:"Anchoring and Adjustment (Tversky & Kahneman): Even arbitrary numbers influence subsequent estimates. People 'adjust' from the anchor but insufficiently."},
{q:"A car salesman says the sticker price is $45,000 but offers it for $38,000. You feel you saved $7,000. The sticker price is:",options:["Fair market value","An artificially high anchor to create perception of savings","The actual price","Irrelevant"],answer:1,explanation:"Strategic Anchoring: The inflated sticker price is an anchor designed to make the 'discounted' price feel like a win. The $38K may still be above fair market value."},
{q:"You're negotiating a salary. The employer offers $80K. Even though you wanted $100K, you negotiate from $80K upward. This is:",options:["Smart negotiation","Being anchored by the employer's initial offer","Loss aversion","Satisficing"],answer:1,explanation:"Negotiation Anchoring: The first number in any negotiation disproportionately influences the final outcome. Starting low anchors the entire negotiation range downward."},
{q:"A wine list shows a $300 bottle at the top. Most people order the $80 bottle next to it. The $300 bottle exists primarily to:",options:["Sell expensive wine","Serve as an anchor making mid-range wines seem reasonable","Impress customers","Test wine knowledge"],answer:1,explanation:"Decoy Anchoring: The extreme price makes other options feel moderate by comparison. Restaurants deliberately use this to increase average spending."},
{q:"In salary negotiations, research shows the first number mentioned typically determines the final outcome within what range?",options:["Within 5% of the first offer","Within 15-20% of the first offer","Within 50% of the first offer","No predictable range"],answer:1,explanation:"Research shows final negotiation outcomes cluster around the initial anchor, typically settling within 15-20% of the first number mentioned."},
{q:"A judge sentences more harshly when the prosecutor requests a higher sentence, even when the judge knows the request is arbitrary. This is:",options:["Judicial bias","Anchoring in legal decision-making","Proper judicial process","Statistical artifact"],answer:1,explanation:"Judicial Anchoring: Studies show judges are susceptible to anchoring. Prosecution sentencing requests influence final sentences, undermining the ideal of objective justice."},
{q:"You're asked to estimate the temperature in Paris. If first told the temperature in Berlin is 35C, your estimate shifts higher. This demonstrates anchoring even when:",options:["The anchor is completely irrelevant to the task","The anchor is related to the task","You have good knowledge","You're an expert"],answer:0,explanation:"Irrelevant Anchors: Even anchors that have nothing to do with the estimate (Berlin temperature for Paris) still influence judgments. The effect is remarkably robust."},
{q:"Online stores show 'Original Price: $200, Now Only: $99!' The crossed-out $200 serves as:",options:["Accurate pricing information","An anchor to make $99 feel like a great deal","The real price","A mistake"],answer:1,explanation:"Price Anchoring in E-commerce: The 'original price' (real or fabricated) creates a reference point that makes the current price feel discounted, even if $99 was always the intended price."},
{q:"Tversky and Kahneman's classic study asked about UN African countries after asking 'more or less than 50?' vs 'more or less than 10?' The estimates differed by approximately:",options:["5%","25%","50%","100%"],answer:1,explanation:"The high anchor group estimated ~25% more countries than the low anchor group. Even a completely arbitrary number shifted estimates by roughly 25%."},
{q:"After being exposed to a high number, even experts (judges, doctors, real estate agents) show anchoring effects. This means:",options:["Experts are immune to anchoring","Anchoring affects everyone, including experts","Only novices are affected","Expertise eliminates the bias"],answer:1,explanation:"Anchoring is one of the most robust cognitive biases — it affects novices and experts alike. Expertise reduces but does not eliminate the effect."},
{q:"You see a house listed at $500K, then see an identical house listed at $450K. The second house seems cheaper even though $450K might be overpriced. This is:",options:["Good comparison shopping","Anchoring to the first listing distorting value perception","Market forces","Confirmation bias"],answer:1,explanation:"Comparative Anchoring: The first listing becomes the reference point. The second house's value is judged relative to the anchor rather than on its own merits."},
{q:"A study found that real estate agents gave very different price estimates for the same house depending on the listing price shown to them. This demonstrates:",options:["Agents are incompetent","Anchoring affects professional judgments in domain-relevant tasks","Market varies","House quality is subjective"],answer:1,explanation:"Professional Anchoring (Northcraft & Neale, 1987): Even domain experts (real estate agents) are influenced by arbitrary anchors when making domain-specific judgments."},
{q:"The 'anchoring and adjustment' heuristic differs from 'selective accessibility' because:",options:["They're the same thing","Adjustment is insufficient from the anchor; selective accessibility is biased information retrieval","Adjustment is rational; selective accessibility is not","There's no difference"],answer:1,explanation:"Two mechanisms: Adjustment (incomplete departure from anchor) and Selective Accessibility (anchor makes anchor-consistent information more accessible). Both produce anchoring."},
{q:"In salary negotiations, how can you best counter anchoring?",options:["Accept the first offer","Make the first offer yourself to set a favorable anchor","Don't negotiate","Ask a friend what to do"],answer:1,explanation:"Counter-anchoring: Making the first (reasonable) offer sets the anchor in your favor. The other party will then adjust from your number, leading to a better outcome."},
{q:"A store prices a 'premium' subscription at $29.99/month next to a 'basic' at $9.99. Most choose basic. The premium price serves as:",options:["A decoy anchor making basic seem affordable","Market pricing","A premium option","Irrational pricing"],answer:0,explanation:"Decoy Effect + Anchoring: The high premium price makes the basic option feel like good value. Without the anchor, $9.99/month might seem expensive."},
{q:"After seeing a car accident, witnesses estimate the car was going 'about 40 mph.' But those asked 'was it over 70 mph?' estimate higher. This is:",options:["Memory failure","Anchoring on the suggested number in legal testimony","Honest reporting","Conformity bias"],answer:1,explanation:"Anchoring in Eyewitness Testimony: Question wording with numeric anchors (70 mph vs 30 mph) significantly alters witness estimates, with implications for legal proceedings."},
{q:"You're buying furniture. The salesperson shows a $5,000 sofa first, then a $2,000 one. You buy the $2,000 one without comparing to competitors. The anchor:",options:["Helped you make a good decision","Prevented objective market comparison by anchoring within the store's range","Was irrelevant","Saved you money"],answer:1,explanation:"Within-store Anchoring: By anchoring you within their price range, the salesperson prevents you from comparing to external options. You feel you saved $3,000 but may have overpaid."},
{q:"Research on anchoring shows the effect works even when participants are:",options:["Warned about anchoring","Aware the anchor is random and meaningless","Both A and B","Neither A nor B"],answer:2,explanation:"One of anchoring's most remarkable features: Even when people know the anchor is arbitrary and are warned about the bias, it still influences their judgments."}
];
let state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:[]};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getQ(){return shuffle([...qs]).slice(0,10)}
function updateStats(){document.getElementById('score').textContent=state.score;document.getElementById('level').textContent=state.level;document.getElementById('streak').textContent=state.streak;document.getElementById('qnum').textContent=`${state.q+1}/${state.questions.length}`;document.getElementById('progress').style.width=`${((state.q)/state.questions.length)*100}%`}
function renderQ(){if(state.q>=state.questions.length){renderOver();return}const q=state.questions[state.q];state.answered=false;document.getElementById('game-area').innerHTML=`<div class="card"><h2>Anchoring Scenario</h2><div class="scenario">${q.q}</div><div class="options" id="options"></div><div class="explanation" id="explanation"></div><div class="btn-row"><button class="btn hidden" id="nextBtn" onclick="nextQ()">Next →</button></div></div>`;const opts=document.getElementById('options');q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>pick(i,b);opts.appendChild(b)});updateStats()}
function pick(i,btn){if(state.answered)return;state.answered=true;const q=state.questions[state.q];document.querySelectorAll('.option').forEach(b=>b.classList.add('disabled'));if(i===q.answer){btn.classList.add('correct');state.score+=10+state.streak*5;state.streak++;if(state.streak>state.maxStreak)state.maxStreak=state.streak;if(state.streak>=3)state.level=Math.floor(state.streak/3)+1}else{btn.classList.add('wrong');document.querySelectorAll('.option')[q.answer].classList.add('correct');state.streak=0}document.getElementById('explanation').textContent=q.explanation;document.getElementById('explanation').classList.add('show');document.getElementById('nextBtn').classList.remove('hidden');updateStats()}
function nextQ(){state.q++;renderQ()}
function renderOver(){const g=state.maxStreak>=8?'Anchoring Expert!':state.maxStreak>=5?'Price Aware':state.maxStreak>=3?'Seeing Anchors':'Keep Noticing';document.getElementById('game-area').innerHTML=`<div class="card game-over"><h2>Anchoring Complete!</h2><p>Score: <strong>${state.score}</strong> | Max Streak: <strong>${state.maxStreak}</strong></p><p style="font-size:20px;color:#60a5fa;margin-bottom:24px">${g}</p><div class="btn-row"><button class="btn" onclick="resetGame()">Play Again</button></div></div>`;document.getElementById('progress').style.width='100%'}
function resetGame(){state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:getQ()};renderQ()}
state.questions=getQ();renderQ();
</script>
</body>
</html>
