<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Loop Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;border-bottom:1px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:14px}
.topbar h1{margin-left:16px;font-size:18px;color:#e2e8f0}
.container{max-width:760px;margin:0 auto;padding:24px}
.stats{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stat{background:#1e293b;padding:12px 20px;border-radius:10px;flex:1;min-width:100px;text-align:center}
.stat .label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
.stat .value{font-size:24px;font-weight:700;color:#60a5fa;margin-top:4px}
.card{background:#1e293b;border-radius:12px;padding:28px;margin-bottom:20px;border:1px solid #334155}
.card h2{font-size:16px;color:#94a3b8;margin-bottom:8px;font-weight:500}
.scenario{font-size:17px;line-height:1.7;margin-bottom:20px;color:#e2e8f0}
.options{display:flex;flex-direction:column;gap:10px}
.option{background:#0f172a;border:2px solid #334155;border-radius:10px;padding:14px 18px;cursor:pointer;transition:all .2s;font-size:15px;text-align:left;color:#e2e8f0}
.option:hover{border-color:#60a5fa;background:#1a2744}
.option.correct{border-color:#22c55e;background:#052e16;color:#86efac}
.option.wrong{border-color:#ef4444;background:#450a0a;color:#fca5a5}
.option.disabled{pointer-events:none}
.explanation{margin-top:16px;padding:16px;background:#0f172a;border-radius:8px;border-left:4px solid #60a5fa;font-size:14px;line-height:1.6;color:#cbd5e1;display:none}
.explanation.show{display:block}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;transition:background .2s}
.btn:hover{background:#2563eb}
.btn-row{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.game-over{text-align:center;padding:40px 20px}
.game-over h2{font-size:28px;margin-bottom:12px;color:#60a5fa}
.game-over p{font-size:16px;color:#94a3b8;margin-bottom:24px}
.progress-bar{width:100%;height:6px;background:#334155;border-radius:3px;margin-bottom:24px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:3px;transition:width .3s}
.hidden{display:none}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">&larr; Back to Games</a><h1>Habit Loop Builder</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
<div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
<div class="stat"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
<div class="stat"><div class="label">Question</div><div class="value" id="qnum">1/10</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div id="game-area"></div>
</div>
<script>
const qs=[
{q:"You always check your phone when you hear a notification sound. Identify the cue, routine, and reward.",options:["Cue: sound, Routine: check phone, Reward: novelty/dopamine","Cue: boredom, Routine: phone, Reward: distraction","Cue: notification, Routine: read, Reward: information","Cue: anxiety, Routine: scroll, Reward: relief"],answer:0,explanation:"Habit Loop (Duhigg): Cue (notification sound) triggers Routine (checking phone) which delivers Reward (novelty/dopamine hit). Understanding this loop is key to changing habits."},
{q:"You want to build a habit of reading before bed. Which strategy best leverages habit stacking?",options:["Buy more books","After brushing teeth (existing habit), read for 10 minutes","Set a phone reminder","Find a reading buddy"],answer:1,explanation:"Habit stacking (James Clear): Attach new habits to existing ones. 'After [current habit], I will [new habit]' uses existing neural pathways to anchor new behaviors."},
{q:"A habit tracker shows you've exercised 5 days in a row. Missing one day feels terrible. What psychological principle explains this?",options:["Loss aversion — streak loss is painful","Endowment effect — you value the streak because you own it","Commitment bias — you want to stay consistent","All of the above"],answer:3,explanation:"Multiple principles reinforce streaks: loss aversion (don't want to lose progress), endowment effect (valuing what you've built), and commitment/consistency bias."},
{q:"You're trying to break a snacking habit. The snack cupboard is next to the kettle. Best environmental design strategy?",options:["Try harder to resist","Move the snacks to an inconvenient location","Remove the snacks entirely","Eat the snacks faster so they're gone"],answer:1,explanation:"Environment design: Making bad habits less convenient (increasing friction) is more effective than relying on willpower alone. Out of sight, out of mind."},
{q:"After a stressful workday, you automatically pour a glass of wine. What is the cue in this habit loop?",options:["The wine bottle","Coming home from work","Stress/need to decompress","The glass"],answer:2,explanation:"The cue is internal (stress/emotional state), not external. The routine (wine) delivers the reward (relaxation). Identifying the true cue enables finding healthier alternatives."},
{q:"You want to wake up at 6am. You keep hitting snooze. What's the most effective approach?",options:["Set 10 alarms","Place alarm across the room + commit to specific first action","Use a louder alarm","Go to bed earlier"],answer:1,explanation:"Two key strategies: increase friction for the bad habit (must get up to turn off alarm) and specify the next action (immediately make bed) to reduce decision fatigue."},
{q:"Your gym habit is failing after 3 weeks. James Clear's research suggests you're in which phase?",options:["The Plateau of Latent Potential","The Valley of Disappointment","The Tipping Point","The Automation Phase"],answer:1,explanation:"The 'Valley of Disappointment' is where most people quit — effort isn't yet producing visible results. Habits feel like they're not working until a critical threshold is crossed."},
{q:"You notice you always eat junk food while watching TV. To break this habit, which Golden Rule of Habit Change applies?",options:["Remove the TV","Keep the cue, change the routine, keep the reward","Change the cue entirely","Remove all snacks from house"],answer:1,explanation:"Golden Rule: You can't extinguish a habit, only change it. Keep the same cue (TV time) and reward (relaxation) but substitute a healthier routine (e.g., healthy snack)."},
{q:"'I will meditate for 10 minutes at 7am in my living room' is better than 'I will meditate more' because:",options:["It's more specific","It reduces decision fatigue","It creates an implementation intention","All of the above"],answer:3,explanation:"Implementation intentions (when + where + what) dramatically increase follow-through. They pre-decide the behavior, eliminating the need for in-the-moment motivation."},
{q:"After meditating for 30 days straight, it starts feeling automatic. What neurological process occurred?",options:["Myelination of neural pathways","Basal ganglia took over the routine","Prefrontal cortex stopped being involved","Both A and B"],answer:3,explanation:"With repetition, habits transfer from conscious (prefrontal cortex) to automatic (basal ganglia) processing. Myelin strengthens neural pathways, making the behavior smoother."},
{q:"You reward yourself with ice cream after every workout. Months later, you crave ice cream when exercising. What happened?",options:["Classical conditioning — exercise became associated with reward","The habit loop broke down","You're addicted to ice cream","This is normal Pavlovian response"],answer:0,explanation:"Classical conditioning: The exercise (conditioned stimulus) becomes associated with the reward (ice cream). The brain anticipates the reward, creating a craving."},
{q:"A company uses a 21-day habit tracker with public accountability. Which principles does this leverage?",options:["Social accountability + commitment device + visual progress","Only social pressure","Just tracking","None — 21 days is a myth"],answer:0,explanation:"Public accountability creates social commitment, the tracker provides visual evidence of progress (endowment effect), and the commitment device makes the habit 'sticky.'"},
{q:"You want to stop biting your nails. You paint them with bitter nail polish. This strategy targets:",options:["The cue","The routine by adding negative consequences","The reward","The craving"],answer:1,explanation:"Adding a negative consequence to the routine (bitter taste) disrupts the habit loop at the behavior level. It's an aversion strategy that makes the routine less automatic."},
{q:"Your New Year's resolution to read 50 books fails by February. Most likely reason:",options:["You don't like reading","The goal was too vague and relied on willpower","You need a reading coach","Reading is outdated"],answer:1,explanation:"Vague goals + willpower reliance = failure. 'Read more' lacks the specificity, environment design, and habit stacking needed for lasting behavior change."},
{q:"A 'habit contract' where you agree to pay $50 to charity if you miss a workout works because:",options:["Financial loss aversion creates motivation","It's legally binding","Charities need money","It makes exercise more fun"],answer:0,explanation:"Loss aversion: Losing $50 feels twice as painful as gaining $50 feels good. The financial penalty leverages loss aversion as a commitment device."},
{q:"After running every morning for 6 months, you miss a day and feel zero urge to quit. What does this demonstrate?",options:["The habit has reached the 'automaticity' phase","You've built a 'never miss twice' rule into the identity","The habit is now self-reinforcing","All of the above"],answer:3,explanation:"Mature habits are resilient. The identity shift ('I'm a runner') plus automaticity plus the 'never miss twice' rule creates a habit that's very hard to break."},
{q:"You notice your best ideas come during long showers. The shower provides:",options:["Default Mode Network activation through routine/relaxation","Water-induced creativity","Temperature effects on cognition","Nothing — it's random"],answer:0,explanation:"Routine, low-demand activities like showering activate the Default Mode Network, which is linked to creative insights and problem-solving. Mind-wandering is productive."},
{q:"A 'habit scorecard' where you mark + for good habits, - for bad, and = for neutral is primarily useful for:",options:["Self-awareness of existing habit patterns","Motivating yourself through gamification","Accountability to others","Scientific research"],answer:0,explanation:"The first step to changing habits is awareness. A habit scorecard makes invisible patterns visible, which is essential for intentional habit modification."},
{q:"You successfully use 'temptation bundling' by only listening to your favorite podcast while exercising. This works because:",options:["The desired activity makes the necessary activity more appealing","It creates classical conditioning","It reduces decision fatigue","It builds willpower"],answer:0,explanation:"Temptation bundling (Katherine Milkman): Pairing something you want with something you need makes the 'need' activity more enjoyable and likely to stick."},
{q:"The '2-minute rule' states that any new habit should take less than 2 minutes to start. This works because:",options:["It eliminates the biggest barrier: starting","Short habits are more effective","It's scientifically proven to be optimal","2 minutes is the attention span limit"],answer:0,explanation:"The biggest barrier is starting. Making habits tiny (read one page, do one pushup) lowers the friction enough to begin. Once started, momentum often carries you forward."}
];
let state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:[]};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getQ(){return shuffle([...qs]).slice(0,10)}
function updateStats(){document.getElementById('score').textContent=state.score;document.getElementById('level').textContent=state.level;document.getElementById('streak').textContent=state.streak;document.getElementById('qnum').textContent=`${state.q+1}/${state.questions.length}`;document.getElementById('progress').style.width=`${((state.q)/state.questions.length)*100}%`}
function renderQ(){if(state.q>=state.questions.length){renderOver();return}const q=state.questions[state.q];state.answered=false;document.getElementById('game-area').innerHTML=`<div class="card"><h2>Habit Loop Analysis</h2><div class="scenario">${q.q}</div><div class="options" id="options"></div><div class="explanation" id="explanation"></div><div class="btn-row"><button class="btn hidden" id="nextBtn" onclick="nextQ()">Next →</button></div></div>`;const opts=document.getElementById('options');q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>pick(i,b);opts.appendChild(b)});updateStats()}
function pick(i,btn){if(state.answered)return;state.answered=true;const q=state.questions[state.q];document.querySelectorAll('.option').forEach(b=>b.classList.add('disabled'));if(i===q.answer){btn.classList.add('correct');state.score+=10+state.streak*5;state.streak++;if(state.streak>state.maxStreak)state.maxStreak=state.streak;if(state.streak>=3)state.level=Math.floor(state.streak/3)+1}else{btn.classList.add('wrong');document.querySelectorAll('.option')[q.answer].classList.add('correct');state.streak=0}document.getElementById('explanation').textContent=q.explanation;document.getElementById('explanation').classList.add('show');document.getElementById('nextBtn').classList.remove('hidden');updateStats()}
function nextQ(){state.q++;renderQ()}
function renderOver(){const g=state.maxStreak>=8?'Habit Master!':state.maxStreak>=5?'Habit Builder':state.maxStreak>=3?'Getting There':'Keep Building';document.getElementById('game-area').innerHTML=`<div class="card game-over"><h2>Habit Loop Complete!</h2><p>Score: <strong>${state.score}</strong> | Max Streak: <strong>${state.maxStreak}</strong></p><p style="font-size:20px;color:#60a5fa;margin-bottom:24px">${g}</p><div class="btn-row"><button class="btn" onclick="resetGame()">Play Again</button></div></div>`;document.getElementById('progress').style.width='100%'}
function resetGame(){state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:getQ()};renderQ()}
state.questions=getQ();renderQ();
</script>
</body>
</html>
