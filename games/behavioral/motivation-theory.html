<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motivation Theory Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;border-bottom:1px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:14px}
.topbar h1{margin-left:16px;font-size:18px;color:#e2e8f0}
.container{max-width:760px;margin:0 auto;padding:24px}
.stats{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stat{background:#1e293b;padding:12px 20px;border-radius:10px;flex:1;min-width:100px;text-align:center}
.stat .label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
.stat .value{font-size:24px;font-weight:700;color:#60a5fa;margin-top:4px}
.card{background:#1e293b;border-radius:12px;padding:28px;margin-bottom:20px;border:1px solid #334155}
.card h2{font-size:16px;color:#94a3b8;margin-bottom:8px;font-weight:500}
.scenario{font-size:17px;line-height:1.7;margin-bottom:20px;color:#e2e8f0}
.options{display:flex;flex-direction:column;gap:10px}
.option{background:#0f172a;border:2px solid #334155;border-radius:10px;padding:14px 18px;cursor:pointer;transition:all .2s;font-size:15px;text-align:left;color:#e2e8f0}
.option:hover{border-color:#60a5fa;background:#1a2744}
.option.correct{border-color:#22c55e;background:#052e16;color:#86efac}
.option.wrong{border-color:#ef4444;background:#450a0a;color:#fca5a5}
.option.disabled{pointer-events:none}
.explanation{margin-top:16px;padding:16px;background:#0f172a;border-radius:8px;border-left:4px solid #60a5fa;font-size:14px;line-height:1.6;color:#cbd5e1;display:none}
.explanation.show{display:block}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;transition:background .2s}
.btn:hover{background:#2563eb}
.btn-row{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.game-over{text-align:center;padding:40px 20px}
.game-over h2{font-size:28px;margin-bottom:12px;color:#60a5fa}
.game-over p{font-size:16px;color:#94a3b8;margin-bottom:24px}
.progress-bar{width:100%;height:6px;background:#334155;border-radius:3px;margin-bottom:24px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:3px;transition:width .3s}
.hidden{display:none}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">&larr; Back to Games</a><h1>Motivation Theory Match</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
<div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
<div class="stat"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
<div class="stat"><div class="label">Question</div><div class="value" id="qnum">1/10</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div id="game-area"></div>
</div>
<script>
const qs=[
{q:"An employee works primarily for the paycheck and job security. Which level of Maslow's hierarchy does this represent?",options:["Self-actualization","Esteem needs","Safety needs","Belonging needs"],answer:2,explanation:"Maslow's Hierarchy: Safety needs include financial security, job stability, and physical safety. The employee is motivated by basic security before higher needs."},
{q:"A worker becomes disengaged after being micromanaged despite good pay. Herzberg would attribute this to:",options:["Lack of hygiene factors","Lack of motivators","Low self-esteem","Poor working conditions"],answer:1,explanation:"Herzberg's Two-Factor Theory: Pay is a hygiene factor (prevents dissatisfaction). Micromanagement removes motivators (autonomy, responsibility), causing disengagement."},
{q:"A student studies hard because they find the subject genuinely fascinating. This is:",options:["Extrinsic motivation","Intrinsic motivation","Amotivation","Identified regulation"],answer:1,explanation:"Intrinsic motivation (Self-Determination Theory): Doing something for its inherent satisfaction rather than external rewards. The student is driven by curiosity and interest."},
{q:"A manager offers bonuses for meeting targets. According to Self-Determination Theory, this is:",options:["Intrinsic motivation","Integrated regulation","External regulation","Intrinsic regulation"],answer:2,explanation:"External regulation is the most controlled form of extrinsic motivation — behavior is performed for external rewards or to avoid punishment."},
{q:"An employee feels incompetent after being passed over for promotion repeatedly. According to Self-Determination Theory, which need is unfulfilled?",options:["Autonomy","Competence","Relatedness","All of the above"],answer:1,explanation:"Competence need: Feeling effective and capable. Repeated passed-over experiences undermine this fundamental psychological need, reducing motivation."},
{q:"A company creates 'stretch assignments' that challenge employees just beyond their current ability. This leverages:",options:["Vroom's Expectancy Theory","Maslow's Esteem needs","Csikszentmihalyi's Flow","Herzberg's Hygiene factors"],answer:2,explanation:"Flow State (Csikszentmihalyi): Optimal challenge slightly above current skill level creates engagement and intrinsic motivation. Too easy = boredom, too hard = anxiety."},
{q:"An employee says 'I'll do it because it aligns with my personal values.' According to SDT, this is:",options:["External regulation","Introjected regulation","Identified regulation","Intrinsic motivation"],answer:2,explanation:"Identified regulation: Behavior is valued and accepted as personally important. It's autonomous extrinsic motivation — done because it aligns with one's values."},
{q:"A salesperson is motivated by commission only when they believe effort leads to sales, and sales lead to rewards. This is:",options:["Herzberg's Two-Factor Theory","Vroom's Expectancy Theory","McClelland's Achievement Theory","Maslow's Hierarchy"],answer:1,explanation:"Vroom's Expectancy Theory: Motivation = Expectancy (effort→performance) × Instrumentality (performance→reward) × Valence (reward value). All three must be positive."},
{q:"After receiving a $5,000 bonus, an employee is motivated for 2 months then returns to baseline. This illustrates:",options:["Hedonic adaptation","Maslow's deficiency needs","Herzberg's hygiene factors","Deci's cognitive evaluation theory"],answer:0,explanation:"Hedonic Adaptation: People return to baseline happiness after positive events. The bonus provided temporary motivation that faded as it became the new normal."},
{q:"An employee joins a team sport and becomes more productive at work. McClelland would say:",options:["Social needs were met","Affiliation needs drive belonging, which increases motivation","They have high achievement needs","They fear failure"],answer:1,explanation:"McClelland's Needs Theory: Affiliation need — desire for friendly relationships. Fulfilling social needs at work increases overall motivation and engagement."},
{q:"A parent says 'Clean your room and you can watch TV.' Over time, the child only cleans when promised TV. This demonstrates:",options:["Overjustification effect — extrinsic rewards undermine intrinsic motivation","Positive reinforcement","Habit formation","Classical conditioning"],answer:0,explanation:"Overjustification Effect: Adding extrinsic rewards to already-intrinsically-motivated behaviors can reduce internal motivation. The child loses natural desire to clean."},
{q:"An entrepreneur works 80-hour weeks on their startup despite no salary. What motivation theory best explains this?",options:["Maslow's self-actualization","SDT — autonomy, competence, and relatedness in one venture","McClelland's high achievement need","All of the above"],answer:3,explanation:"Entrepreneurial drive often combines self-actualization (Maslow), need for achievement (McClelland), and the three basic needs of SDT (autonomy, competence, relatedness)."},
{q:"A manager implements 'job enrichment' by giving employees more responsibility and creative control. This is based on:",options:["Herzberg's Motivator-Hygiene Theory","Maslow's Esteem needs","SDT's autonomy need","All of the above"],answer:3,explanation:"Job enrichment (Herzberg) increases motivators. It also satisfies SDT's autonomy need and Maslow's esteem needs through trust and recognition."},
{q:"An employee performs better when they choose their own project methods vs being told how. This supports:",options:["SDT's autonomy need","Herzberg's motivator theory","Vroom's expectancy theory","All support autonomy's role"],answer:0,explanation:"SDT's Autonomy Need: Feeling volitional and self-endorsed in one's actions. When people choose their approach, motivation and performance increase."},
{q:"A company offers unlimited PTO but employees take less time off than before. Why?",options:["Fear of appearing less committed (social proof)","Loss aversion — fear of missing out on work","Both — plus status quo bias","Unlimited PTO doesn't work"],answer:2,explanation:"Multiple biases interact: social proof (seeing others not taking time off), loss aversion (fear of career impact), and status quo bias (maintaining current work patterns)."},
{q:"After winning an award, a researcher becomes MORE motivated to publish. According to SDT, what happened?",options:["Competence need was satisfied, increasing intrinsic motivation","They became extrinsically motivated by the award","They developed fear of losing status","Achievement motivation was activated"],answer:0,explanation:"SDT: Satisfying the competence need (feeling effective) increases intrinsic motivation and self-determined behavior, leading to MORE engagement."},
{q:"An employee rejects a promotion because it would require relocating away from family. According to Maslow:",options:["Love/belonging needs outweigh esteem needs","They're not ambitious","Safety needs are primary","Self-actualization isn't a priority"],answer:0,explanation:"Maslow's hierarchy: Lower-level needs (belonging) must be substantially met before higher needs (esteem, self-actualization) become primary motivators."},
{q:"A team leader publicly praises team members' unique strengths. This approach is grounded in:",options:["SDT's competence need + Reinforcement Theory","Only positive reinforcement","Maslow's esteem needs only","Herzberg's hygiene factors"],answer:0,explanation:"Public recognition satisfies competence needs (SDT) while providing positive reinforcement (behavior increased). It also touches esteem (Maslow) and motivators (Herzberg)."},
{q:"An employee says 'I do this work because it contributes to something bigger than myself.' This is:",options:["Self-transcendence motivation","Intrinsic motivation","Identified regulation","Self-actualization"],answer:0,explanation:"Self-transcendence: Motivation from connecting to something larger — purpose, mission, or contributing to others' wellbeing. A powerful intrinsic motivator."},
{q:"A manager notices that giving consistent, specific feedback improves performance more than annual bonuses. Best explanation:",options:["SDT's competence need + expectancy theory","Only positive reinforcement","Money doesn't motivate","Feedback is more fun"],answer:0,explanation:"Specific feedback builds competence (SDT) while strengthening expectancy beliefs (Vroom) — employees see how effort leads to improvement, which drives motivation."}
];
let state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:[]};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getQ(){return shuffle([...qs]).slice(0,10)}
function updateStats(){document.getElementById('score').textContent=state.score;document.getElementById('level').textContent=state.level;document.getElementById('streak').textContent=state.streak;document.getElementById('qnum').textContent=`${state.q+1}/${state.questions.length}`;document.getElementById('progress').style.width=`${((state.q)/state.questions.length)*100}%`}
function renderQ(){if(state.q>=state.questions.length){renderOver();return}const q=state.questions[state.q];state.answered=false;document.getElementById('game-area').innerHTML=`<div class="card"><h2>Motivation Theory Match</h2><div class="scenario">${q.q}</div><div class="options" id="options"></div><div class="explanation" id="explanation"></div><div class="btn-row"><button class="btn hidden" id="nextBtn" onclick="nextQ()">Next →</button></div></div>`;const opts=document.getElementById('options');q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>pick(i,b);opts.appendChild(b)});updateStats()}
function pick(i,btn){if(state.answered)return;state.answered=true;const q=state.questions[state.q];document.querySelectorAll('.option').forEach(b=>b.classList.add('disabled'));if(i===q.answer){btn.classList.add('correct');state.score+=10+state.streak*5;state.streak++;if(state.streak>state.maxStreak)state.maxStreak=state.streak;if(state.streak>=3)state.level=Math.floor(state.streak/3)+1}else{btn.classList.add('wrong');document.querySelectorAll('.option')[q.answer].classList.add('correct');state.streak=0}document.getElementById('explanation').textContent=q.explanation;document.getElementById('explanation').classList.add('show');document.getElementById('nextBtn').classList.remove('hidden');updateStats()}
function nextQ(){state.q++;renderQ()}
function renderOver(){const g=state.maxStreak>=8?'Motivation Expert!':state.maxStreak>=5?'Theory Master':state.maxStreak>=3?'Learning Motivation':'Keep Studying';document.getElementById('game-area').innerHTML=`<div class="card game-over"><h2>Theory Complete!</h2><p>Score: <strong>${state.score}</strong> | Max Streak: <strong>${state.maxStreak}</strong></p><p style="font-size:20px;color:#60a5fa;margin-bottom:24px">${g}</p><div class="btn-row"><button class="btn" onclick="resetGame()">Play Again</button></div></div>`;document.getElementById('progress').style.width='100%'}
function resetGame(){state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:getQ()};renderQ()}
state.questions=getQ();renderQ();
</script>
</body>
</html>
