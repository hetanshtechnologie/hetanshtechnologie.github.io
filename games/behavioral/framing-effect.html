<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Framing Effect Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;border-bottom:1px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:14px}
.topbar h1{margin-left:16px;font-size:18px;color:#e2e8f0}
.container{max-width:760px;margin:0 auto;padding:24px}
.stats{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stat{background:#1e293b;padding:12px 20px;border-radius:10px;flex:1;min-width:100px;text-align:center}
.stat .label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
.stat .value{font-size:24px;font-weight:700;color:#60a5fa;margin-top:4px}
.card{background:#1e293b;border-radius:12px;padding:28px;margin-bottom:20px;border:1px solid #334155}
.card h2{font-size:16px;color:#94a3b8;margin-bottom:8px;font-weight:500}
.scenario{font-size:17px;line-height:1.7;margin-bottom:20px;color:#e2e8f0}
.options{display:flex;flex-direction:column;gap:10px}
.option{background:#0f172a;border:2px solid #334155;border-radius:10px;padding:14px 18px;cursor:pointer;transition:all .2s;font-size:15px;text-align:left;color:#e2e8f0}
.option:hover{border-color:#60a5fa;background:#1a2744}
.option.correct{border-color:#22c55e;background:#052e16;color:#86efac}
.option.wrong{border-color:#ef4444;background:#450a0a;color:#fca5a5}
.option.disabled{pointer-events:none}
.explanation{margin-top:16px;padding:16px;background:#0f172a;border-radius:8px;border-left:4px solid #60a5fa;font-size:14px;line-height:1.6;color:#cbd5e1;display:none}
.explanation.show{display:block}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;transition:background .2s}
.btn:hover{background:#2563eb}
.btn-row{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.game-over{text-align:center;padding:40px 20px}
.game-over h2{font-size:28px;margin-bottom:12px;color:#60a5fa}
.game-over p{font-size:16px;color:#94a3b8;margin-bottom:24px}
.progress-bar{width:100%;height:6px;background:#334155;border-radius:3px;margin-bottom:24px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:3px;transition:width .3s}
.hidden{display:none}
.frame-demo{display:flex;gap:16px;margin:16px 0}
.frame-box{flex:1;padding:16px;background:#0f172a;border-radius:12px;border:1px solid #334155;text-align:center}
.frame-box h3{font-size:14px;margin-bottom:8px}
.frame-positive{border-color:#22c55e}
.frame-negative{border-color:#ef4444}
.frame-positive h3{color:#22c55e}
.frame-negative h3{color:#ef4444}
.frame-val{font-size:28px;font-weight:700;color:#e2e8f0;margin:8px 0}
.frame-sub{font-size:13px;color:#94a3b8}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">&larr; Back to Games</a><h1>Framing Effect</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
<div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
<div class="stat"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
<div class="stat"><div class="label">Question</div><div class="value" id="qnum">1/10</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div id="game-area"></div>
</div>
<script>
const qs=[
{q:"<div class='frame-demo'><div class='frame-box frame-positive'><h3>Option A</h3><div class='frame-val'>90% Survival Rate</div><div class='frame-sub'>Positive frame</div></div><div class='frame-box frame-negative'><h3>Option B</h3><div class='frame-val'>10% Mortality Rate</div><div class='frame-sub'>Negative frame</div></div></div>Both options describe the same surgery. But most people choose A over B. This is:",options:["Rational decision-making","Framing Effect — identical information yields different choices based on presentation","Statistical ignorance","Loss aversion"],answer:1,explanation:"Framing Effect (Tversky & Kahneman): The same information framed positively (90% survival) feels very different from the same information framed negatively (10% mortality)."},
{q:"A product labeled '95% Fat-Free' sells better than one labeled 'Contains 5% Fat.' This is:",options:["Better marketing","Framing Effect — positive frame is more persuasive","Better ingredients","Legal requirements"],answer:1,explanation:"Both labels describe the exact same product. The positive frame (95% fat-free) is more appealing because it emphasizes what's present rather than what's absent."},
{q:"You're told a meat is '75% lean' vs '25% fat.' You prefer the first even though it's identical. This is:",options:["Taste preference","Framing Effect","Anchoring","Health consciousness"],answer:1,explanation:"Positive framing (75% lean) emphasizes what you gain (lean meat) while negative framing (25% fat) emphasizes what you lose (fatty content). Same product, different feeling."},
{q:"A doctor says 'This treatment has a 90% success rate' vs 'This treatment fails 10% of the time.' A patient hearing the second frame is:",options:["Equally likely to agree","Less likely to agree — loss frame triggers risk aversion","More likely to agree","Angry at the doctor"],answer:1,explanation:"Loss Frame Effect: The mortality/failure frame activates loss aversion, making patients more risk-averse and less likely to choose the treatment."},
{q:"A news headline says 'Unemployment dropped to 5%' vs '95% of people are employed.' The first gets more attention because:",options:["It's more accurate","Negative/drop frames are more salient than positive/absolute frames","5% is a bigger number","Better journalism"],answer:1,explanation:"Asymmetric Framing: Negative frames (focus on what's bad — 5% unemployed) are processed more deeply than equivalent positive frames (95% employed). Negativity bias amplifies this."},
{q:"During a sale, 'Save $50!' feels more compelling than 'Pay $45 instead of $95' even though both convey the same discount. Why?",options:["$50 is a round number","Gain frame (saving) vs loss frame (paying) — gain framing is more attractive","Better marketing","Both are equally compelling"],answer:1,explanation:"Gain framing (what you save) feels better than loss framing (what you pay). The identical discount feels different depending on whether you focus on the gain or the loss."},
{q:"A politician says 'Crime increased by 2%' vs '98% of neighborhoods are safe.' Both are true. Which gets more votes?",options:["The 98% safe frame","The 2% crime increase frame — threat framing mobilizes voters","Neither affects votes","Both are equally effective"],answer:1,explanation:"Threat Framing: Emphasizing the small negative (2% crime increase) creates fear and urgency, which is more motivating for voter behavior than the equivalent positive frame."},
{q:"Your doctor says a medication has 'serious side effects in 1 out of 1,000 patients.' Another doctor says the same drug has a '99.9% safety rate.' You prefer the second doctor because:",options:["Better bedside manner","Framing makes the second feel safer even though the risk is identical","Better medication","Second doctor is more experienced"],answer:1,explanation:"Risk Framing: Low-probability risks feel larger when stated as events (1 in 1,000) than as rates (99.9% safe). The same risk feels different based on presentation."},
{q:"Investors are told: 'This fund lost money in 3 of the last 10 years' vs 'This fund made money in 7 of the last 10 years.' Most investors prefer the second fund. Both describe:",options:["Different funds","The exact same fund","The second fund is better","Neither is good"],answer:1,explanation:"Framing identical data differently changes investment preference. The positive frame (7 wins) feels better than the negative frame (3 losses), even though they describe the same performance."},
{q:"A store says '20% more free!' instead of '80% of normal price.' These are mathematically identical but the first:",options:["Is more accurate","Feels like a larger benefit due to positive gain framing","Is a better deal","Is illegal"],answer:1,explanation:"Gain Framing in Marketing: 'More free' emphasizes what you gain. '80% of price' emphasizes what you pay. Same economics, but the gain frame is more psychologically appealing."},
{q:"In the Asian Disease Problem, people choose the 'certain' option when outcomes are framed as lives saved (gain frame) but choose the 'gamble' when framed as deaths (loss frame). This is:",options:["Rational behavior","Framing Effect combined with Prospect Theory","People are random","Both options are equal"],answer:1,explanation:"Prospect Theory + Framing: Gain frames trigger risk aversion (choose the sure thing), loss frames trigger risk-seeking (gamble to avoid the sure loss). Same math, opposite choices."},
{q:"A restaurant describes a dish as 'hand-crafted with locally sourced ingredients' vs 'made in a factory with industrial ingredients.' The food is identical. This is:",options:["Truthful labeling","Framing Effect — positive vs negative framing of the same product","Legal requirement","Better ingredients"],answer:1,explanation:"Positive vs Negative Framing in Food: Identical products feel different when described with positive (artisanal, local) vs negative (factory, industrial) language."},
{q:"You're told a surgery has 'a 10% chance of death' vs 'a 90% chance of survival.' Your risk tolerance changes dramatically. This demonstrates:",options:["Medical knowledge","Framing Effect on risk perception","Surgical skill","Patient ignorance"],answer:1,explanation:"The identical probability feels very different depending on frame. People become risk-averse in the positive frame (protect the 90% survival) but risk-seeking in the negative frame (gamble against the 10% death)."},
{q:"A company's annual report highlights 'revenue grew 15%' but buries 'profits declined 3%.' This selective framing is:",options:["Standard reporting","Strategic positive framing to distract from negative information","Honest accounting","Investor protection"],answer:1,explanation:"Selective Framing: Organizations strategically emphasize positive metrics and minimize negative ones. Investors must look beyond the frame to see the complete picture."},
{q:"Politicians frame tax increases as 'investments in education' vs 'government taking your money.' The policy is identical. This is:",options:["Policy debate","Framing Effect in political persuasion","Economic analysis","Campaign strategy only"],answer:1,explanation:"Political Framing: The same policy feels very different depending on whether it's framed as investment (gain) or taking (loss). Framing shapes public opinion on identical policies."},
{q:"A researcher presents data as '85% effective' vs '15% failure rate.' Peer reviewers rate the study more favorably with the positive frame. Even experts are susceptible to:",options:["Framing effects — expertise doesn't eliminate the bias","Poor review standards","Statistical errors","Publication bias"],answer:0,explanation:"Even experts show framing effects. The same data presented positively or differently influences expert judgments, showing that framing is a deep cognitive bias."},
{q:"You're more likely to buy beef labeled '95% lean' than '5% fat.' If you saw both labels side-by-side, you'd realize they're the same. Framing works best when:",options:["You're an expert","You don't compare the frames directly","You're analytical","The product is cheap"],answer:1,explanation:"Framing works best in isolation — when people don't have the opportunity to compare different frames side-by-side. Direct comparison breaks the framing illusion."},
{q:"A charity asks for '$5 a month to save children' vs '$60 a year to save children.' The monthly frame gets more donations because:",options:["$5 is less money","Monthly framing feels like a smaller commitment (loss framing over shorter period)","Annual is too long","Both are equally effective"],answer:1,explanation:"Temporal Framing: Smaller, more frequent amounts feel less painful than equivalent larger amounts. $5/month feels like a minor loss vs $60/year as a bigger one."},
{q:"You choose a restaurant described as '85% customer satisfaction' over one with '15% customer complaints.' Both have identical ratings. This is:",options:["Good choice","Framing Effect — positive frame was more persuasive","Bad choice","You researched well"],answer:1,explanation:"Service Framing: Identical customer satisfaction rates feel different based on frame. The positive frame (85% satisfied) feels better than the negative frame (15% complaints), even though they're the same."},
{q:"Research shows framing effects decrease when people have:",options:["More time to decide","Deep domain expertise and analytical processing","Higher education only","Nothing — framing always works equally"],answer:1,explanation:"While framing affects everyone, its impact is reduced when people process information analytically rather than intuitively. Expertise and deliberate thinking provide some protection."}
];
let state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:[]};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getQ(){return shuffle([...qs]).slice(0,10)}
function updateStats(){document.getElementById('score').textContent=state.score;document.getElementById('level').textContent=state.level;document.getElementById('streak').textContent=state.streak;document.getElementById('qnum').textContent=`${state.q+1}/${state.questions.length}`;document.getElementById('progress').style.width=`${((state.q)/state.questions.length)*100}%`}
function renderQ(){if(state.q>=state.questions.length){renderOver();return}const q=state.questions[state.q];state.answered=false;document.getElementById('game-area').innerHTML=`<div class="card"><h2>Framing Effect</h2><div class="scenario">${q.q}</div><div class="options" id="options"></div><div class="explanation" id="explanation"></div><div class="btn-row"><button class="btn hidden" id="nextBtn" onclick="nextQ()">Next →</button></div></div>`;const opts=document.getElementById('options');q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>pick(i,b);opts.appendChild(b)});updateStats()}
function pick(i,btn){if(state.answered)return;state.answered=true;const q=state.questions[state.q];document.querySelectorAll('.option').forEach(b=>b.classList.add('disabled'));if(i===q.answer){btn.classList.add('correct');state.score+=10+state.streak*5;state.streak++;if(state.streak>state.maxStreak)state.maxStreak=state.streak;if(state.streak>=3)state.level=Math.floor(state.streak/3)+1}else{btn.classList.add('wrong');document.querySelectorAll('.option')[q.answer].classList.add('correct');state.streak=0}document.getElementById('explanation').textContent=q.explanation;document.getElementById('explanation').classList.add('show');document.getElementById('nextBtn').classList.remove('hidden');updateStats()}
function nextQ(){state.q++;renderQ()}
function renderOver(){const g=state.maxStreak>=8?'Framing Expert!':state.maxStreak>=5?'Frame Aware':state.maxStreak>=3?'Seeing Frames':'Keep Observing';document.getElementById('game-area').innerHTML=`<div class="card game-over"><h2>Framing Effect Complete!</h2><p>Score: <strong>${state.score}</strong> | Max Streak: <strong>${state.maxStreak}</strong></p><p style="font-size:20px;color:#60a5fa;margin-bottom:24px">${g}</p><div class="btn-row"><button class="btn" onclick="resetGame()">Play Again</button></div></div>`;document.getElementById('progress').style.width='100%'}
function resetGame(){state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:getQ()};renderQ()}
state.questions=getQ();renderQ();
</script>
</body>
</html>
