<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ethics Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;border-bottom:1px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:14px}
.topbar h1{margin-left:16px;font-size:18px;color:#e2e8f0}
.container{max-width:760px;margin:0 auto;padding:24px}
.stats{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stat{background:#1e293b;padding:12px 20px;border-radius:10px;flex:1;min-width:100px;text-align:center}
.stat .label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
.stat .value{font-size:24px;font-weight:700;color:#60a5fa;margin-top:4px}
.card{background:#1e293b;border-radius:12px;padding:28px;margin-bottom:20px;border:1px solid #334155}
.card h2{font-size:16px;color:#94a3b8;margin-bottom:8px;font-weight:500}
.scenario{font-size:17px;line-height:1.7;margin-bottom:20px;color:#e2e8f0}
.options{display:flex;flex-direction:column;gap:10px}
.option{background:#0f172a;border:2px solid #334155;border-radius:10px;padding:14px 18px;cursor:pointer;transition:all .2s;font-size:15px;text-align:left;color:#e2e8f0}
.option:hover{border-color:#60a5fa;background:#1a2744}
.option.correct{border-color:#22c55e;background:#052e16;color:#86efac}
.option.wrong{border-color:#ef4444;background:#450a0a;color:#fca5a5}
.option.disabled{pointer-events:none}
.explanation{margin-top:16px;padding:16px;background:#0f172a;border-radius:8px;border-left:4px solid #60a5fa;font-size:14px;line-height:1.6;color:#cbd5e1;display:none}
.explanation.show{display:block}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;transition:background .2s}
.btn:hover{background:#2563eb}
.btn-row{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.game-over{text-align:center;padding:40px 20px}
.game-over h2{font-size:28px;margin-bottom:12px;color:#60a5fa}
.game-over p{font-size:16px;color:#94a3b8;margin-bottom:24px}
.progress-bar{width:100%;height:6px;background:#334155;border-radius:3px;margin-bottom:24px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:3px;transition:width .3s}
.hidden{display:none}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">&larr; Back to Games</a><h1>Ethical Dilemmas</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
<div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
<div class="stat"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
<div class="stat"><div class="label">Question</div><div class="value" id="qnum">1/10</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div id="game-area"></div>
</div>
<script>
const qs=[
{q:"You discover your company is dumping waste illegally. Reporting it would cost your job and colleagues theirs. What ethical framework suggests reporting?",options:["Utilitarianism — greatest good for greatest number","Deontological ethics — duty to truth regardless of consequences","Virtue ethics — what would a person of integrity do?","All of the above support reporting"],answer:3,explanation:"All three frameworks support reporting: utilitarian (environmental harm affects many), deontological (duty to truth/law), virtue ethics (integrity requires action)."},
{q:"A self-driving car must choose between hitting a group of 3 pedestrians or swerving to hit 1 pedestrian. This is the:",options:["Trolley Problem applied to AI","Trolley Problem — no ethical debate","An engineering problem, not ethical","Unsolvable"],answer:0,explanation:"The Trolley Problem in AI ethics: How should autonomous systems make utilitarian vs deontological trade-offs? This remains a central debate in AI ethics."},
{q:"You're a doctor with 1 dying patient who needs a transplant. 5 patients need organs but are healthy. Should you sacrifice 1 to save 5?",options:["Yes — utilitarian calculus","No — each person has inviolable rights","Yes — it's the mathematically correct choice","Depends on the patients' ages"],answer:1,explanation:"Deontological ethics: People have rights that can't be violated regardless of outcomes. Killing one innocent person is inherently wrong, even to save five."},
{q:"Your friend asks you to lie to their partner about an affair. What ethical approach considers both loyalty and honesty?",options:["Only loyalty matters","Only honesty matters","Virtue ethics — finding the balance between competing virtues","Consequentialism — weigh outcomes only"],answer:2,explanation:"Virtue ethics considers how a person of good character would navigate competing values (loyalty, honesty, compassion) rather than applying rigid rules."},
{q:"A company pays minimum wage but could afford more. The CEO argues 'market rate' justifies it. From a justice perspective:",options:["Market rates are always fair","Rawls' theory suggests maximizing the position of the least advantaged","Justice means everyone gets the same","The CEO is correct"],answer:1,explanation:"Rawls' Justice as Fairness: If you didn't know your position in society (veil of ignorance), you'd design systems that protect the worst-off. The minimum wage argument fails this test."},
{q:"You witness a colleague taking credit for a junior employee's work. By staying silent, you are:",options:["Not involved — it's not your problem","Complicit through passive acceptance of injustice","Being professional by not gossiping","Following workplace norms"],answer:1,explanation:"Moral complicity: Silence in the face of injustice is not neutral. Ethical responsibility extends beyond direct actions to allowing harm through inaction."},
{q:"A pharmaceutical company prices a life-saving drug at $500/month when it costs $10 to produce. They cite R&D costs. Which ethical critique applies?",options:["Price gouging — exploiting need for profit","Utilitarian — fewer people get treatment, net harm increases","Rawlsian — unfair distribution of burden","All of the above"],answer:3,explanation:"Multiple ethical frameworks critique this: exploitation of need (deontological), reduced access creates more harm (utilitarian), and burdens fall on the most vulnerable (justice)."},
{q:"An employee uses company time for personal projects but produces excellent work. The utilitarian assessment:",options:["Clearly wrong — theft of time","Depends on net outcomes — does the benefit outweigh the cost?","Clearly right — creativity should be encouraged","Not an ethical issue"],answer:1,explanation:"Utilitarianism evaluates by outcomes. If the employee's personal projects lead to innovations that benefit the company more than the time cost, it could be justified."},
{q:"A whistleblower leaks classified documents showing government surveillance of citizens. Ethical tension:",options:["Clear-cut — always leak","Clear-cut — never leak","Tension between national security (utilitarian) and civil rights (deontological)","Not an ethical issue"],answer:2,explanation:"Core ethical tension: Security (utilitarian: protecting citizens) vs Rights (deontological: privacy is inviolable). Reasonable people disagree — that's what makes it a dilemma."},
{q:"You're on a jury. The defendant is clearly guilty but comes from a disadvantaged background. Should background influence the verdict?",options:["Yes — context matters for justice","No — guilt is independent of background","Yes — disadvantaged people deserve lighter sentences","Only if the judge decides"],answer:1,explanation:"Equal justice: The verdict should be based on evidence of the act, not the person's background. However, sentencing can appropriately consider mitigating circumstances."},
{q:"A tech company uses AI to screen job applicants but the AI shows racial bias. The company claims it's 'just data.' Ethical assessment:",options:["Data is objective — no bias possible","The company is responsible for biased tools they deploy","AI is a black box — nobody is responsible","Racial bias in hiring is legal"],answer:1,explanation:"Moral responsibility extends to tools we create. 'The algorithm did it' is not a defense — companies have ethical obligations to audit and correct biased systems."},
{q:"You find a wallet with $500 and no ID. Returning it vs keeping it — Kant's Categorical Imperative would say:",options:["Keep it — nobody's harmed","Return it — universalize the rule: 'everyone returns lost property'","Split the difference","It depends on your financial situation"],answer:1,explanation:"Kant's test: Could you universalize the maxim 'keep found wallets'? If everyone did, trust in society would collapse. Therefore, returning is the ethical duty."},
{q:"A charity spends 90% of donations on admin and executive salaries. They do some good work. Ethical evaluation:",options:["Any good work justifies it","Transparency matters — donors should know where money goes","Charity overhead is irrelevant","Charities shouldn't make money"],answer:1,explanation:"Ethical fundraising requires transparency. Even if some good is done, using donor money primarily for overhead violates the trust implicit in charitable giving."},
{q:"An employee is asked to fire a colleague they know is a single parent. The 'right' ethical approach:",options:["Refuse — too emotionally difficult","Do it professionally — the decision wasn't yours","Do it with compassion while being honest about the difficulty","Quit instead"],answer:2,explanation:"Ethical action can be compassionate AND professional. Delivering difficult news with honesty, empathy, and support (severance, references) balances organizational duty with human dignity."},
{q:"A news outlet publishes true but embarrassing information about a private citizen. Freedom of press vs privacy — which wins?",options:["Always freedom of press","Always privacy rights","Depends on public interest — proportionality matters","Neither matters"],answer:2,explanation:"Ethical journalism weighs public interest against privacy. Private citizens deserve more protection than public figures. Truth alone doesn't always justify publication."},
{q:"You're offered a bribe to approve a contract. You could donate the money to charity. Does that make it ethical?",options:["Yes — good outcome","No — the means are corrupt regardless of intended use","Yes — charity needs money","Depends on the amount"],answer:1,explanation:"Kant's deontological ethics: Actions are judged by their nature, not outcomes. Taking bribes is inherently corrupt — the intended charitable use doesn't transform the act."},
{q:"A hospital has 1 ventilator and 2 patients — a 5-year-old and an 80-year-old. Utilitarian approach suggests:",options:["Equal lottery","Prioritize the child (more life-years remaining)","Prioritize the elderly (more life experience)","Prioritize whoever arrived first"],answer:1,explanation:"Utilitarian logic often considers 'life-years saved' — maximizing total future wellbeing. However, this conflicts with equal worth of life, making it deeply controversial."},
{q:"Your company's product has a minor safety flaw. Fixing it costs $2M. A lawsuit would cost $500K. Ethical decision:",options:["Fix it — preventing harm is the ethical duty","Don't fix — cost-benefit analysis shows lawsuits are cheaper","Fix it — both legally and ethically","Ignore it — all products have flaws"],answer:2,explanation:"The ethical choice aligns with the legal one here: preventing known harm is both a moral duty and legal obligation. Cost-benefit on human safety is ethically indefensible."},
{q:"You mentor someone who then leaves your company for a competitor. You feel betrayed. Best ethical response:",options:["Never mentor anyone again","Recognize that developing people is inherently good, regardless of outcome","Badmouth them to the industry","Demand they stay"],answer:1,explanation:"Virtue ethics: The worth of mentoring isn't determined by whether the person stays. Developing others' capabilities is intrinsically valuable."},
{q:"A government wants to implement mass surveillance for safety. Kant would argue:",options:["Acceptable if it prevents terrorism","Wrong — treating citizens as means to an end (safety) violates their dignity","Right if citizens consent","Depends on the surveillance technology"],answer:1,explanation:"Kant's principle: People must be treated as ends in themselves, never merely as means. Mass surveillance treats citizens as tools for security, violating their inherent dignity."}
];
let state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:[]};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getQ(){return shuffle([...qs]).slice(0,10)}
function updateStats(){document.getElementById('score').textContent=state.score;document.getElementById('level').textContent=state.level;document.getElementById('streak').textContent=state.streak;document.getElementById('qnum').textContent=`${state.q+1}/${state.questions.length}`;document.getElementById('progress').style.width=`${((state.q)/state.questions.length)*100}%`}
function renderQ(){if(state.q>=state.questions.length){renderOver();return}const q=state.questions[state.q];state.answered=false;document.getElementById('game-area').innerHTML=`<div class="card"><h2>Ethical Dilemma</h2><div class="scenario">${q.q}</div><div class="options" id="options"></div><div class="explanation" id="explanation"></div><div class="btn-row"><button class="btn hidden" id="nextBtn" onclick="nextQ()">Next →</button></div></div>`;const opts=document.getElementById('options');q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>pick(i,b);opts.appendChild(b)});updateStats()}
function pick(i,btn){if(state.answered)return;state.answered=true;const q=state.questions[state.q];document.querySelectorAll('.option').forEach(b=>b.classList.add('disabled'));if(i===q.answer){btn.classList.add('correct');state.score+=10+state.streak*5;state.streak++;if(state.streak>state.maxStreak)state.maxStreak=state.streak;if(state.streak>=3)state.level=Math.floor(state.streak/3)+1}else{btn.classList.add('wrong');document.querySelectorAll('.option')[q.answer].classList.add('correct');state.streak=0}document.getElementById('explanation').textContent=q.explanation;document.getElementById('explanation').classList.add('show');document.getElementById('nextBtn').classList.remove('hidden');updateStats()}
function nextQ(){state.q++;renderQ()}
function renderOver(){const g=state.maxStreak>=8?'Ethical Thinker!':state.maxStreak>=5?'Morally Aware':state.maxStreak>=3?'Ethical Explorer':'Keep Reflecting';document.getElementById('game-area').innerHTML=`<div class="card game-over"><h2>Ethics Complete!</h2><p>Score: <strong>${state.score}</strong> | Max Streak: <strong>${state.maxStreak}</strong></p><p style="font-size:20px;color:#60a5fa;margin-bottom:24px">${g}</p><div class="btn-row"><button class="btn" onclick="resetGame()">Play Again</button></div></div>`;document.getElementById('progress').style.width='100%'}
function resetGame(){state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:getQ()};renderQ()}
state.questions=getQ();renderQ();
</script>
</body>
</html>
