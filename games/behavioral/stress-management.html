<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stress Management Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;border-bottom:1px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:14px}
.topbar h1{margin-left:16px;font-size:18px;color:#e2e8f0}
.container{max-width:760px;margin:0 auto;padding:24px}
.stats{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stat{background:#1e293b;padding:12px 20px;border-radius:10px;flex:1;min-width:100px;text-align:center}
.stat .label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
.stat .value{font-size:24px;font-weight:700;color:#60a5fa;margin-top:4px}
.card{background:#1e293b;border-radius:12px;padding:28px;margin-bottom:20px;border:1px solid #334155}
.card h2{font-size:16px;color:#94a3b8;margin-bottom:8px;font-weight:500}
.scenario{font-size:17px;line-height:1.7;margin-bottom:20px;color:#e2e8f0}
.options{display:flex;flex-direction:column;gap:10px}
.option{background:#0f172a;border:2px solid #334155;border-radius:10px;padding:14px 18px;cursor:pointer;transition:all .2s;font-size:15px;text-align:left;color:#e2e8f0}
.option:hover{border-color:#60a5fa;background:#1a2744}
.option.correct{border-color:#22c55e;background:#052e16;color:#86efac}
.option.wrong{border-color:#ef4444;background:#450a0a;color:#fca5a5}
.option.disabled{pointer-events:none}
.explanation{margin-top:16px;padding:16px;background:#0f172a;border-radius:8px;border-left:4px solid #60a5fa;font-size:14px;line-height:1.6;color:#cbd5e1;display:none}
.explanation.show{display:block}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;transition:background .2s}
.btn:hover{background:#2563eb}
.btn-row{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.game-over{text-align:center;padding:40px 20px}
.game-over h2{font-size:28px;margin-bottom:12px;color:#60a5fa}
.game-over p{font-size:16px;color:#94a3b8;margin-bottom:24px}
.progress-bar{width:100%;height:6px;background:#334155;border-radius:3px;margin-bottom:24px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:3px;transition:width .3s}
.hidden{display:none}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">&larr; Back to Games</a><h1>Stress Management</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
<div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
<div class="stat"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
<div class="stat"><div class="label">Question</div><div class="value" id="qnum">1/10</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div id="game-area"></div>
</div>
<script>
const qs=[
{q:"Your body shows physical symptoms: headaches, muscle tension, stomach issues. No medical cause found. Most likely explanation:",options:["You're imagining it","Chronic stress manifesting somatically","A rare disease","Poor diet only"],answer:1,explanation:"Somatic symptoms of stress: The body stores tension physically. Chronic stress activates the sympathetic nervous system, causing real physical symptoms even without medical disease."},
{q:"You feel overwhelmed by deadlines. Which coping strategy is MOST effective long-term?",options:["Avoiding the work entirely","Problem-focused coping: break tasks into smaller steps and prioritize","Emotional coping: vent to everyone","Substance use to relax"],answer:1,explanation:"Problem-focused coping directly addresses the stressor. Breaking tasks down restores sense of control (self-efficacy) and reduces the psychological threat of large tasks."},
{q:"After a traumatic event, you experience flashbacks and nightmares. This is consistent with:",options:["Normal stress response","PTSD symptoms","Generalized anxiety disorder","Bipolar disorder"],answer:1,explanation:"Flashbacks and nightmares are hallmark symptoms of PTSD (Post-Traumatic Stress Disorder). Professional help is recommended if these persist beyond a month."},
{q:"Your stress response includes: increased heart rate, dilated pupils, and heightened alertness. This is the:",options:["Parasympathetic nervous system","Fight-or-flight (sympathetic) response","Relaxation response","Rest-and-digest mode"],answer:1,explanation:"Fight-or-flight: The sympathetic nervous system releases adrenaline and cortisol, preparing the body to face or flee from threats. It's automatic and protective."},
{q:"You use deep breathing exercises to manage anxiety before a presentation. This activates:",options:["Fight-or-flight response","Parasympathetic (rest-and-digest) system","Adrenal glands","Hypothalamus stress response"],answer:1,explanation:"Deep breathing stimulates the vagus nerve, activating the parasympathetic system. This counteracts the fight-or-flight response, lowering heart rate and promoting calm."},
{q:"A colleague constantly criticizes you but you never address it. You develop insomnia. The insomnia is:",options:["Unrelated to work","A secondary stress symptom from unresolved conflict","Just bad sleep habits","Genetic only"],answer:1,explanation:"Unresolved interpersonal conflict creates chronic stress. The body's rumination and hypervigilance about the situation disrupt sleep patterns, even if you're not consciously thinking about it."},
{q:"Which of the following is the LEAST effective stress management strategy?",options:["Regular exercise","Social support","Rumination (replaying stressful events repeatedly)","Mindfulness meditation"],answer:2,explanation:"Rumination is counterproductive — it replays stress without solving it, keeping the stress response activated. The other options actively reduce cortisol and promote recovery."},
{q:"Your 'window of tolerance' has narrowed due to chronic stress. What does this mean?",options:["You can handle more stress","Small stressors now trigger intense reactions","You need more sleep","Your pain tolerance increased"],answer:1,explanation:"Window of Tolerance (Dan Siegel): Chronic stress narrows the zone where you can function optimally. Small triggers push you into hyperarousal (anxiety) or hypoarousal (shutdown)."},
{q:"You notice stress accumulating over weeks — irritability, fatigue, cynicism. This progression is consistent with:",options:["Acute stress","Burnout","Seasonal affective disorder","Normal aging"],answer:1,explanation:"Burnout (Maslach): Chronic workplace stress characterized by emotional exhaustion, depersonalization (cynicism), and reduced personal accomplishment. It develops gradually."},
{q:"After exercise, you feel calmer and think more clearly. This is because exercise:",options:["Releases endorphins and reduces cortisol","Only provides distraction","Makes you too tired to worry","Has no real chemical effect"],answer:0,explanation:"Exercise triggers endorphin release (natural painkillers/mood elevators) and metabolizes excess stress hormones like cortisol and adrenaline, producing a calming effect."},
{q:"A therapist asks you to write about your stressful experiences for 20 minutes daily. This is based on:",options:["Expressive writing research (Pennebaker)","Cognitive Behavioral Therapy only","Freudian free association","Random advice"],answer:0,explanation:"Pennebaker's Expressive Writing: Writing about emotional experiences for 15-20 minutes improves physical and psychological health by helping process and make meaning of stressors."},
{q:"You're so stressed you can't remember things clearly and make poor decisions. This is because:",options:["You're getting old","Chronic stress impairs prefrontal cortex and hippocampus function","You're not trying hard enough","Memory is unrelated to stress"],answer:1,explanation:"Chronic cortisol damages hippocampal neurons (memory) and impairs prefrontal cortex function (decision-making). The brain literally functions worse under sustained stress."},
{q:"Which is the strongest predictor of stress resilience?",options:["Income level","Social connections and support network","Intelligence","Physical strength"],answer:1,explanation:"Research consistently shows social support is the strongest predictor of resilience. Humans are social creatures — connection buffers against the physiological and psychological effects of stress."},
{q:"You practice mindfulness daily but still feel stressed at work. Why might mindfulness NOT fully eliminate stress?",options:["Mindfulness doesn't work","You're not doing it right","Mindfulness changes your relationship to stress, not the stressors themselves","You need medication instead"],answer:2,explanation:"Mindfulness doesn't remove stressors — it changes how you respond to them. It reduces reactivity and rumination but doesn't eliminate legitimate work stress. Addressing root causes is also needed."},
{q:"After a conflict with your partner, you go for a run and feel better. This coping strategy combines:",options:["Avoidance and distraction","Physical activity + emotional regulation","Denial and suppression","Externalization"],answer:1,explanation:"Exercise is both a physical stress outlet (metabolizes cortisol) and an emotion regulation strategy. It's one of the most evidence-based coping mechanisms available."},
{q:"You notice you're constantly scanning for threats at work even when things are calm. This hypervigilance:",options:["Is a normal protective instinct that's become maladaptive","Means you're paranoid","Shows you're a good employee","Is unrelated to stress"],answer:0,explanation:"Hypervigilance: When the threat-detection system stays activated after the stressor has passed. It was adaptive for survival but becomes exhausting and counterproductive in modern settings."},
{q:"A friend suggests 'just think positive' as stress management. Why is this advice problematic?",options:["Positive thinking actually works perfectly","It ignores the stressor and dismisses valid emotional responses","Negative thinking is better","It's too simple to be true"],answer:1,explanation:"Toxic positivity dismisses legitimate stress responses. Effective management acknowledges the stressor while developing adaptive coping — not pretending problems don't exist."},
{q:"Which breathing technique is most evidence-based for acute stress reduction?",options:["Rapid hyperventilation","4-7-8 breathing (or box breathing)","Holding breath as long as possible","Shallow chest breathing"],answer:1,explanation:"4-7-8 breathing (or box breathing) activates the parasympathetic nervous system. Extended exhales stimulate the vagus nerve, producing measurable calm within minutes."},
{q:"You're experiencing compassion fatigue from caring for others. This is:",options:["A sign you don't care enough","Burnout specifically from empathic engagement with others' suffering","Normal and nothing to worry about","Only affects medical professionals"],answer:1,explanation:"Compassion fatigue (secondary traumatic stress): Emotional exhaustion from prolonged exposure to others' suffering. It affects caregivers, teachers, social workers — anyone in helping professions."},
{q:"After weeks of insomnia and anxiety, you finally see a therapist. The BEST therapeutic approach for chronic stress and anxiety is:",options:["Avoidance therapy","Cognitive Behavioral Therapy (CBT)","Only medication","Positive affirmations only"],answer:1,explanation:"CBT is the gold standard for stress and anxiety. It addresses maladaptive thought patterns and behaviors, providing practical skills for managing and reducing stress responses."}
];
let state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:[]};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getQ(){return shuffle([...qs]).slice(0,10)}
function updateStats(){document.getElementById('score').textContent=state.score;document.getElementById('level').textContent=state.level;document.getElementById('streak').textContent=state.streak;document.getElementById('qnum').textContent=`${state.q+1}/${state.questions.length}`;document.getElementById('progress').style.width=`${((state.q)/state.questions.length)*100}%`}
function renderQ(){if(state.q>=state.questions.length){renderOver();return}const q=state.questions[state.q];state.answered=false;document.getElementById('game-area').innerHTML=`<div class="card"><h2>Stress Scenario</h2><div class="scenario">${q.q}</div><div class="options" id="options"></div><div class="explanation" id="explanation"></div><div class="btn-row"><button class="btn hidden" id="nextBtn" onclick="nextQ()">Next →</button></div></div>`;const opts=document.getElementById('options');q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>pick(i,b);opts.appendChild(b)});updateStats()}
function pick(i,btn){if(state.answered)return;state.answered=true;const q=state.questions[state.q];document.querySelectorAll('.option').forEach(b=>b.classList.add('disabled'));if(i===q.answer){btn.classList.add('correct');state.score+=10+state.streak*5;state.streak++;if(state.streak>state.maxStreak)state.maxStreak=state.streak;if(state.streak>=3)state.level=Math.floor(state.streak/3)+1}else{btn.classList.add('wrong');document.querySelectorAll('.option')[q.answer].classList.add('correct');state.streak=0}document.getElementById('explanation').textContent=q.explanation;document.getElementById('explanation').classList.add('show');document.getElementById('nextBtn').classList.remove('hidden');updateStats()}
function nextQ(){state.q++;renderQ()}
function renderOver(){const g=state.maxStreak>=8?'Stress Management Expert!':state.maxStreak>=5?'Wellness Aware':state.maxStreak>=3?'Learning Coping':'Keep Exploring';document.getElementById('game-area').innerHTML=`<div class="card game-over"><h2>Stress Management Complete!</h2><p>Score: <strong>${state.score}</strong> | Max Streak: <strong>${state.maxStreak}</strong></p><p style="font-size:20px;color:#60a5fa;margin-bottom:24px">${g}</p><div class="btn-row"><button class="btn" onclick="resetGame()">Play Again</button></div></div>`;document.getElementById('progress').style.width='100%'}
function resetGame(){state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:getQ()};renderQ()}
state.questions=getQ();renderQ();
</script>
</body>
</html>
