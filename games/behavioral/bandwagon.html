<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bandwagon Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.topbar{background:#1e293b;padding:12px 24px;display:flex;align-items:center;border-bottom:1px solid #334155}
.topbar a{color:#60a5fa;text-decoration:none;font-size:14px}
.topbar h1{margin-left:16px;font-size:18px;color:#e2e8f0}
.container{max-width:760px;margin:0 auto;padding:24px}
.stats{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stat{background:#1e293b;padding:12px 20px;border-radius:10px;flex:1;min-width:100px;text-align:center}
.stat .label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
.stat .value{font-size:24px;font-weight:700;color:#60a5fa;margin-top:4px}
.card{background:#1e293b;border-radius:12px;padding:28px;margin-bottom:20px;border:1px solid #334155}
.card h2{font-size:16px;color:#94a3b8;margin-bottom:8px;font-weight:500}
.scenario{font-size:17px;line-height:1.7;margin-bottom:20px;color:#e2e8f0}
.options{display:flex;flex-direction:column;gap:10px}
.option{background:#0f172a;border:2px solid #334155;border-radius:10px;padding:14px 18px;cursor:pointer;transition:all .2s;font-size:15px;text-align:left;color:#e2e8f0}
.option:hover{border-color:#60a5fa;background:#1a2744}
.option.correct{border-color:#22c55e;background:#052e16;color:#86efac}
.option.wrong{border-color:#ef4444;background:#450a0a;color:#fca5a5}
.option.disabled{pointer-events:none}
.explanation{margin-top:16px;padding:16px;background:#0f172a;border-radius:8px;border-left:4px solid #60a5fa;font-size:14px;line-height:1.6;color:#cbd5e1;display:none}
.explanation.show{display:block}
.btn{background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;transition:background .2s}
.btn:hover{background:#2563eb}
.btn-row{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.game-over{text-align:center;padding:40px 20px}
.game-over h2{font-size:28px;margin-bottom:12px;color:#60a5fa}
.game-over p{font-size:16px;color:#94a3b8;margin-bottom:24px}
.progress-bar{width:100%;height:6px;background:#334155;border-radius:3px;margin-bottom:24px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:3px;transition:width .3s}
.hidden{display:none}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html">&larr; Back to Games</a><h1>Bandwagon Effect</h1></div>
<div class="container">
<div class="stats">
<div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
<div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
<div class="stat"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
<div class="stat"><div class="label">Question</div><div class="value" id="qnum">1/10</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div id="game-area"></div>
</div>
<script>
const qs=[
{q:"A new restaurant opens and has a line out the door every night. Within weeks, everyone in town wants to eat there. This is:",options:["Great food quality","Bandwagon Effect — popularity creates more popularity","Good location","Lucky timing"],answer:1,explanation:"Bandwagon Effect: People do something primarily because others are doing it. The initial line creates social proof, which attracts more people, creating a self-reinforcing cycle."},
{q:"A political candidate starts polling at 5% but after media coverage of their 'surge,' they jump to 20%. What happened?",options:["Their policies improved","Media-framed momentum triggered the Bandwagon Effect","Voters became smarter","Polling errors"],answer:1,explanation:"Media-driven Bandwagon: Coverage of a candidate's momentum creates the perception of inevitability, causing more people to support them — a self-fulfilling prophecy."},
{q:"You buy a bestselling book you've never heard of because it's on the 'Bestseller' list. Your reasoning is:",options:["The book must be good if so many people bought it","I want to fit in with what's popular","I trust the bestseller list","All of the above — Bandwagon reasoning"],answer:3,explanation:"Bestseller lists combine social proof and bandwagon effect. Multiple motivations converge: quality inference, desire to fit in, and trust in the ranking system."},
{q:"A cryptocurrency rises 500% in a month. As news of gains spreads, more people buy, pushing the price higher. This is:",options:["Market fundamentals","Bandwagon-driven bubble — more buyers create the appearance of value","Smart investing","Government policy"],answer:1,explanation:"Bandwagon Bubbles: Rising prices attract more buyers (FOMO), which raises prices further, attracting more buyers. The cycle continues until the bubble bursts."},
{q:"You see 10,000 people liked a post on social media. You're more likely to like it too. This is:",options:["Algorithm influence","Bandwagon Effect — high engagement signals value","Your genuine preference","Social obligation"],answer:1,explanation:"Social Media Bandwagon: Visible engagement metrics (likes, shares, views) create bandwagon effects. High numbers signal 'this must be worth your attention.'"},
{q:"A student chooses a college major because 'everyone is doing it' despite having no interest in the field. This is:",options:["Smart career planning","Bandwagon Effect — following the crowd without independent assessment","Market analysis","Parental pressure only"],answer:1,explanation:"Career Bandwagon: Choosing based on popularity rather than personal aptitude/interest. The bandwagon creates artificial demand that may not match individual strengths."},
{q:"During a run on banks, people withdraw savings not because their bank is failing but because others are withdrawing. This is:",options:["Good financial sense","Bandwagon panic — others' actions create perceived threat","Random behavior","Bank regulation"],answer:1,explanation:"Panic Bandwagon: Others' withdrawal behavior is interpreted as information ('they must know something'), creating self-fulfilling bank runs even when the bank is solvent."},
{q:"A product goes viral on TikTok. Sales increase 1000% overnight despite the product being mediocre. This demonstrates:",options:["Product quality","The Bandwagon Effect amplified by social media — virality overrides product evaluation","Good marketing","Influencer importance"],answer:1,explanation:"Viral Bandwagon: Social media amplifies the bandwagon effect exponentially. Viral content creates rapid adoption that's independent of actual product quality."},
{q:"You start singing a song because everyone at the concert is singing it, even though you don't know the words. This is:",options:["Musical appreciation","Bandwagon Effect — social participation overrides personal knowledge","Concert etiquette","Peer pressure"],answer:1,explanation:"Social Bandwagon: Being surrounded by people doing the same activity creates powerful pressure to join in. The desire to belong overrides uncertainty about participating."},
{q:"A stock becomes a 'meme stock' and skyrockets. Buyers explicitly say they're buying 'because everyone else is.' This is:",options:["Investment strategy","Pure Bandwagon Effect — acknowledged social mimicry","Market research","Due diligence"],answer:1,explanation:"Meme Stock Bandwagon: Buyers openly acknowledge buying due to crowd behavior. The bandwagon creates value through collective action, independent of fundamental worth."},
{q:"An app shows '5 million downloads' prominently. This number primarily functions as:",options:["Technical information","Bandwagon signal — high download count implies trustworthiness and quality","Marketing requirement","Legal disclosure"],answer:1,explanation:"Download counts serve as bandwagon signals. High numbers create the impression of validated quality ('5 million people can't be wrong'), reducing perceived risk of trying."},
{q:"A restaurant uses a 'Queue Management' app that shows wait times. Long wait times paradoxically attract more customers because:",options:["Wait times indicate food quality","The visible queue serves as a Bandwagon signal","People enjoy waiting","The app is helpful"],answer:1,explanation:"Visible queues function as social proof. Long wait times signal popularity, which triggers the bandwagon effect — 'if so many people wait, it must be worth it.'"},
{q:"During a viral challenge, people participate not because it's fun but because 'everyone is doing it and I don't want to miss out.' This combines:",options:["FOMO only","Bandwagon Effect + Social Proof + Loss Aversion (fear of missing out)","Peer pressure","Trend following"],answer:1,explanation:"Triple threat: Bandwagon (everyone's doing it), Social Proof (others validate it), and Loss Aversion (FOMO — fear of missing the experience)."},
{q:"A political party gains seats not because of policy changes but because polls show them gaining momentum. This is:",options:["Good governance","Poll-driven Bandwagon — perceived winning attracts more supporters","Electoral fraud","Democracy working"],answer:1,explanation:"Electoral Bandwagon: Polls showing momentum attract supporters who want to back the winning side. Polls don't just measure opinion — they influence it."},
{q:"You download an app with 4.8 stars and 50,000 reviews over one with 4.9 stars and 100 reviews. The first choice is influenced by:",options:["Better features","Bandwagon Effect — review volume signals widespread adoption and trust","More reviews","App quality"],answer:1,explanation:"Volume-as-Quality: High review counts signal widespread adoption. The bandwagon heuristic says 'if many people use it, it's probably reliable' — volume overwrites rating."},
{q:"A gym membership increases after a TV show features it. People join not for fitness but to be part of the 'community' they see on screen. This is:",options:["Good marketing","Cultural Bandwagon — media creates aspirational social proof","Health consciousness","Community building"],answer:1,explanation:"Media Bandwagon: TV, movies, and social media create aspirational bandwagons. People join not for the core benefit but for social identity with what's popular."},
{q:"You notice that your opinion about a movie changes after seeing it has 95% on Rotten Tomatoes. Before knowing the score, you thought it was 'okay.' This is:",options:["Better understanding","Post-knowledge Bandwagon — social consensus retroactively changes your opinion","Critical analysis","Film expertise"],answer:1,explanation:"Retroactive Bandwagon: Learning that 'everyone loved it' makes you re-evaluate your own experience. The consensus becomes a lens through which you reinterpret your perception."},
{q:"A neighborhood's property values rise because 'everyone wants to move there.' The demand creates the desirability, not inherent quality. This is:",options:["Real estate fundamentals","Bandwagon-driven demand — popularity creates value independently of intrinsic worth","Good schools","Location advantage"],answer:1,explanation:"Real Estate Bandwagon: 'Hot neighborhoods' become desirable because others want to live there. Popularity itself becomes the primary value driver."},
{q:"A tech company's stock rises 200% despite having no revenue. Investors say 'everyone is investing, so it must be the future.' This is:",options:["Forward-thinking investment","Pure Bandwagon reasoning — collective belief creates perceived value","Market analysis","Tech innovation"],answer:1,explanation:"Speculative Bandwagon: When everyone believes something will be valuable, their collective action makes it temporarily valuable. The bandwagon can sustain prices until confidence breaks."},
{q:"The Bandwagon Effect is most dangerous when:",options:["Applied to fashion choices","Applied to financial decisions, political beliefs, and health choices — where the stakes are high","Applied to food preferences","Applied to entertainment"],answer:1,explanation:"Bandwagon effects are most harmful when applied to high-stakes domains (investing, voting, health). In these areas, independent evaluation matters more than popularity."}
];
let state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:[]};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getQ(){return shuffle([...qs]).slice(0,10)}
function updateStats(){document.getElementById('score').textContent=state.score;document.getElementById('level').textContent=state.level;document.getElementById('streak').textContent=state.streak;document.getElementById('qnum').textContent=`${state.q+1}/${state.questions.length}`;document.getElementById('progress').style.width=`${((state.q)/state.questions.length)*100}%`}
function renderQ(){if(state.q>=state.questions.length){renderOver();return}const q=state.questions[state.q];state.answered=false;document.getElementById('game-area').innerHTML=`<div class="card"><h2>Bandwagon Scenario</h2><div class="scenario">${q.q}</div><div class="options" id="options"></div><div class="explanation" id="explanation"></div><div class="btn-row"><button class="btn hidden" id="nextBtn" onclick="nextQ()">Next →</button></div></div>`;const opts=document.getElementById('options');q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>pick(i,b);opts.appendChild(b)});updateStats()}
function pick(i,btn){if(state.answered)return;state.answered=true;const q=state.questions[state.q];document.querySelectorAll('.option').forEach(b=>b.classList.add('disabled'));if(i===q.answer){btn.classList.add('correct');state.score+=10+state.streak*5;state.streak++;if(state.streak>state.maxStreak)state.maxStreak=state.streak;if(state.streak>=3)state.level=Math.floor(state.streak/3)+1}else{btn.classList.add('wrong');document.querySelectorAll('.option')[q.answer].classList.add('correct');state.streak=0}document.getElementById('explanation').textContent=q.explanation;document.getElementById('explanation').classList.add('show');document.getElementById('nextBtn').classList.remove('hidden');updateStats()}
function nextQ(){state.q++;renderQ()}
function renderOver(){const g=state.maxStreak>=8?'Bandwagon Expert!':state.maxStreak>=5?'Crowd Aware':state.maxStreak>=3?'Questioning Popularity':'Think Independently';document.getElementById('game-area').innerHTML=`<div class="card game-over"><h2>Bandwagon Complete!</h2><p>Score: <strong>${state.score}</strong> | Max Streak: <strong>${state.maxStreak}</strong></p><p style="font-size:20px;color:#60a5fa;margin-bottom:24px">${g}</p><div class="btn-row"><button class="btn" onclick="resetGame()">Play Again</button></div></div>`;document.getElementById('progress').style.width='100%'}
function resetGame(){state={score:0,level:1,streak:0,maxStreak:0,q:0,answered:false,questions:getQ()};renderQ()}
state.questions=getQ();renderQ();
</script>
</body>
</html>
