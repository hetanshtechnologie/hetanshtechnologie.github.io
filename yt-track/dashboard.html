<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Track — Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="brand-logo">&#9654;</span>
      <span class="brand-name">YT Track</span>
      <nav class="topnav">
        <a href="http://localhost/HetanshTechnologie/apps.html" class="nav-link" id="apps-link">All Apps</a>
        <a href="dashboard.html" class="nav-link active" id="dash-link">Dashboard</a>
        <a href="admin.html" class="nav-link hidden" id="admin-link">Admin</a>
      </nav>
    </div>
    <div class="topbar-right">
      <span class="user-email" id="user-email"></span>
      <span class="role-badge" id="role-badge"></span>
      <button class="btn btn-outline btn-small" id="logout-btn">Log out</button>
    </div>
  </header>

  <main class="container">
    <div class="grid">
      <section class="panel">
        <h2>Categories</h2>
        <form id="add-category-form" class="add-form add-form-col" novalidate>
          <input type="text" id="category-name" class="input" placeholder="New category name" autocomplete="off">
          <select id="category-parent" class="input">
            <option value="">No parent (root)</option>
          </select>
          <button type="submit" class="btn btn-primary">Add category</button>
        </form>
        <div id="category-tree"></div>
      </section>

      <section class="panel">
        <div id="overall-progress" class="summary-panel">
          <div class="summary-text">Loading&hellip;</div>
        </div>

        <form id="add-link-form" class="add-form" novalidate>
          <input type="url" id="link-url" class="input" placeholder="Paste a YouTube link to track..." autocomplete="off">
          <select id="link-category" class="input link-cat-select">
            <option value="">No category</option>
          </select>
          <button type="submit" id="add-link-submit" class="btn btn-primary">Add link</button>
        </form>

        <div class="filter-row">
          <label>Filter</label>
          <select id="filter-cat" class="input">
            <option value="">All links</option>
          </select>
        </div>

        <div id="link-list"></div>
      </section>
    </div>
  </main>

  <div id="player-overlay" class="player-overlay hidden">
    <div class="player-box">
      <button id="player-close" class="btn btn-outline btn-small" title="Close">&#10005;</button>
      <div id="player-frame"></div>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/client.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/render.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
