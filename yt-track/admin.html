<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Track — Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="brand-logo">&#9654;</span>
      <span class="brand-name">YT Track</span>
      <nav class="topnav">
        <a href="http://localhost/HetanshTechnologie/apps.html" class="nav-link" id="apps-link">All Apps</a>
        <a href="dashboard.html" class="nav-link" id="dash-link">Dashboard</a>
        <a href="admin.html" class="nav-link active" id="admin-link">Admin</a>
      </nav>
    </div>
    <div class="topbar-right">
      <span class="user-email" id="user-email"></span>
      <span class="role-badge admin" id="role-badge"></span>
      <button class="btn btn-outline btn-small" id="logout-btn">Log out</button>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Admin portal</h1>

    <div class="admin-tabs" id="admin-tabs">
      <button class="tab active" data-panel="users">Parents &amp; children</button>
      <button class="tab" data-panel="links">All links</button>
    </div>

    <section class="panel" id="users-panel">
      <h2>Parents &amp; children</h2>
      <form id="admin-add-child" class="add-form admin-add-child" novalidate>
        <select id="admin-child-parent" class="input"></select>
        <input type="text" id="admin-child-name" class="input" placeholder="Child name" autocomplete="off">
        <input type="email" id="admin-child-email" class="input" placeholder="Child Google email" autocomplete="off">
        <input type="text" id="admin-child-pin" class="input pin-input" maxlength="4" inputmode="numeric" placeholder="4-digit PIN" autocomplete="off">
        <button type="submit" class="btn btn-primary">Add child</button>
      </form>
      <div id="admin-users"></div>
    </section>

    <section class="panel hidden" id="links-panel">
      <h2>All links in this workspace</h2>
      <div id="admin-links"></div>
    </section>
  </main>

  <div id="player-overlay" class="player-overlay hidden">
    <div class="player-box">
      <button id="player-close" class="btn btn-outline btn-small" title="Close">&#10005;</button>
      <div id="player-frame"></div>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/client.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/render.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/plans.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
