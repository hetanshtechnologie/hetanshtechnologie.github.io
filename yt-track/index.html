<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Track — Sign in</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <div class="auth-shell">
    <header class="brand">
      <span class="brand-logo">&#9654;</span>
      <span class="brand-name">YT Track</span>
    </header>

    <main class="auth-card">
      <h1 id="auth-title">Sign in</h1>
      <p class="auth-sub">Track your YouTube playlists, one watch at a time.</p>

      <form id="auth-form" novalidate>
        <input type="hidden" id="auth-mode" value="login">
        <label class="field">
          <span>Email</span>
          <input type="email" id="auth-email" placeholder="you@example.com" autocomplete="email" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" id="auth-password" placeholder="Enter your password" autocomplete="current-password" required>
        </label>
        <div id="auth-error" class="alert alert-error"></div>
        <div id="auth-success" class="alert alert-success"></div>
        <p id="tenant-note" class="tenant-note" style="display:none">
          A private workspace (tenant) is created for your account automatically.
        </p>
        <button type="submit" id="auth-submit" class="btn btn-primary btn-block">Sign in</button>
      </form>

      <div class="divider"><span>or</span></div>
      <button type="button" id="google-btn" class="btn btn-google btn-block">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>

      <p id="auth-switch-text" class="auth-switch">
        Don't have an account? <a href="#" id="auth-switch" class="link">Sign up</a>
      </p>
    </main>

    <footer class="auth-footer">Multi-tenant YouTube playlist tracker</footer>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/client.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
