<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Topic - Hetansh Technologie Blog</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body>
  <nav class="blog-nav">
    <div class="container">
      <a href="../" class="logo">HetanshTechnologie</a>
      <div class="nav-links">
        <a href="../">Home</a>
        <a href="index.html" class="btn">Blog</a>
        <a href="login.html" id="nav-auth">Login</a>
      </div>
    </div>
  </nav>

  <section class="page-header">
    <div class="container">
      <h1>Create a New Topic</h1>
      <p>Organize articles under a topic category.</p>
    </div>
  </section>

  <main class="container" style="padding:32px 20px;">
    <div id="alert-container"></div>

    <div class="auth-form">
      <div class="card">
        <form id="topic-form">
          <div class="form-group">
            <label for="name">Topic Name</label>
            <input type="text" id="name" placeholder="e.g., Cloud Computing" required>
          </div>
          <div class="form-group">
            <label for="description">Description (optional)</label>
            <input type="text" id="description" placeholder="A short description of this topic">
          </div>
          <div class="form-group">
            <label for="slug">URL Slug</label>
            <input type="text" id="slug" placeholder="cloud-computing" required>
            <small style="color:#888;font-size:.8rem;">Auto-generated from name. Use lowercase with hyphens.</small>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Create Topic</button>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/blog.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const user = await getCurrentUser();
      const navAuth = document.getElementById('nav-auth');
      if (user) {
        navAuth.textContent = 'Logout';
        navAuth.href = '#';
        navAuth.addEventListener('click', async (e) => {
          e.preventDefault();
          await signOut();
          window.location.href = 'index.html';
        });
      } else {
        window.location.href = 'login.html?redirect=create-topic.html';
        return;
      }

      // Auto-generate slug from name
      document.getElementById('name').addEventListener('input', function() {
        const slugField = document.getElementById('slug');
        if (!slugField.dataset.userEdited) {
          slugField.value = slugify(this.value);
        }
      });
      document.getElementById('slug').addEventListener('input', function() {
        this.dataset.userEdited = 'true';
      });

      document.getElementById('topic-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        const description = document.getElementById('description').value.trim();
        const slug = document.getElementById('slug').value.trim();
        const btn = this.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = 'Creating...';
        try {
          await createTopic(name, description, slug);
          showAlert('alert-container', 'Topic created successfully!', 'success');
          setTimeout(() => { window.location.href = 'index.html'; }, 1500);
        } catch (err) {
          showAlert('alert-container', 'Failed to create topic: ' + err.message, 'error');
        }
        btn.disabled = false;
        btn.textContent = 'Create Topic';
      });
    });
  </script>
<script src="../js/analytics-tracker.js" defer></script>
</body>
</html>
