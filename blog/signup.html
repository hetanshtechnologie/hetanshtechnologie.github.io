<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16.png">
<link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Hetansh Technologie Blog</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body>
  <nav class="blog-nav">
    <div class="container">
      <a href="../" class="logo"><img src="../images/logo.png" alt="Hetansh Technologie" style="height:100px;width:auto;vertical-align:middle;border-radius:10px;object-fit:contain;position:relative;top:20px;"></a>
      <div class="nav-links">
        <a href="../">Home</a>
        <a href="index.html">Blog</a>
        <a href="login.html">Login</a>
      </div>
    </div>
  </nav>

  <section class="page-header">
    <div class="container">
      <h1>Join the Community</h1>
      <p>Create an account to write articles and participate in discussions.</p>
    </div>
  </section>

  <main class="container">
    <div class="auth-form">
      <div class="card">
        <div id="alert-container"></div>
        <h2>Sign Up</h2>
        <form id="signup-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="your-username" required>
          </div>
          <div class="form-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" placeholder="Your full name">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Create Account</button>
        </form>
        <div class="form-footer">
          Already have an account? <a href="login.html">Log in</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/blog.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      getCurrentUser().then(user => {
        if (user) window.location.href = 'index.html';
      });

      document.getElementById('signup-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const fullName = document.getElementById('fullname').value.trim() || username;
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btn = this.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = 'Creating account...';
        try {
          const { user, session } = await signUp(email, password, username, fullName);
          showAlert('alert-container', 'Account created! Check your email for confirmation. You can now log in.', 'success');
          setTimeout(() => { window.location.href = 'login.html'; }, 3000);
        } catch (err) {
          showAlert('alert-container', 'Sign up failed: ' + err.message, 'error');
        }
        btn.disabled = false;
        btn.textContent = 'Create Account';
      });
    });
  </script>
<script src="../js/analytics-tracker.js" defer></script>
</body>
</html>
