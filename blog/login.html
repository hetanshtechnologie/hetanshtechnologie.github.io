<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Hetansh Technologie Blog</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body>
  <nav class="blog-nav">
    <div class="container">
      <a href="../" class="logo">HetanshTechnologie</a>
      <div class="nav-links">
        <a href="../">Home</a>
        <a href="index.html">Blog</a>
        <a href="login.html" class="btn">Login</a>
      </div>
    </div>
  </nav>

  <section class="page-header">
    <div class="container">
      <h1>Welcome Back</h1>
      <p>Log in to write articles, ask questions, and join the discussion.</p>
    </div>
  </section>

  <main class="container">
    <div class="auth-form">
      <div class="card">
        <div id="alert-container"></div>
        <h2>Log In</h2>
        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Your password" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Log In</button>
        </form>
        <div style="text-align:center;margin:16px 0;color:#999;font-size:.85rem;">or</div>
        <button id="google-login-btn" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:8px;" onmouseover="this.style.background='#f8f8f8'" onmouseout="this.style.background='#fff'">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Continue with Google
        </button>
        <div class="form-footer">
          Don't have an account? <a href="signup.html">Sign up</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/blog.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      getCurrentUser().then(user => {
        if (user) window.location.href = 'index.html';
      });

      document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btn = this.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = 'Logging in...';
        try {
          await signIn(email, password);
          window.location.href = 'index.html';
        } catch (err) {
          showAlert('alert-container', 'Login failed: ' + err.message, 'error');
        }
        btn.disabled = false;
        btn.textContent = 'Log In';
      });

      document.getElementById('google-login-btn').addEventListener('click', async function() {
        var btn = this;
        btn.disabled = true;
        btn.textContent = 'Redirecting...';
        try {
          var client = window.supabase.createClient(
            'https://vgipghqejzbcoighktij.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnaXBnaHFlanpiY29pZ2hrdGlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MjQ2MjIsImV4cCI6MjA5NTMwMDYyMn0.KoDwAZarGWOLwKXOwycA8wuIiIrksvZy7dyaO0-ehUo'
          );
          var redirect = window.location.origin + window.location.pathname.replace(/login\.html.*/, 'index.html');
          var { error } = await client.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: redirect }
          });
          if (error) throw error;
        } catch (err) {
          showAlert('alert-container', 'Google login failed: ' + err.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Continue with Google';
        }
      });
    });
  </script>
<script src="../js/analytics-tracker.js" defer></script>
</body>
</html>
