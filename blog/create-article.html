<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16.png">
<link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write Article - Hetansh Technologie Blog</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body>
  <nav class="blog-nav">
    <div class="container">
      <a href="../" class="logo"><img src="../images/logo.png" alt="Hetansh Technologie" style="height:100px;width:auto;vertical-align:middle;border-radius:10px;object-fit:contain;position:relative;top:20px;"></a>
      <div class="nav-links">
        <a href="../">Home</a>
        <a href="index.html" class="btn">Blog</a>
        <a href="login.html" id="nav-auth">Login</a>
      </div>
    </div>
  </nav>

  <section class="page-header">
    <div class="container">
      <h1>Write an Article</h1>
      <p>Share your knowledge with the community. HTML content is supported.</p>
    </div>
  </section>

  <main class="container" style="padding:32px 20px;">
    <div id="alert-container"></div>

    <div class="auth-form" style="max-width:700px;">
      <div class="card">
        <form id="article-form">
          <div class="form-group">
            <label for="topic">Topic</label>
            <select id="topic" required>
              <option value="">Select a topic...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" placeholder="Your article title" required>
          </div>
          <div class="form-group">
            <label for="slug">URL Slug</label>
            <input type="text" id="slug" placeholder="your-article-slug" required>
            <small style="color:#888;font-size:.8rem;">Auto-generated from title. Use lowercase with hyphens.</small>
          </div>
          <div class="form-group">
            <label for="content">Content (HTML)</label>
            <textarea id="content" placeholder="Write your article content here. You can use HTML tags for formatting (e.g., &lt;h2&gt;, &lt;p&gt;, &lt;code&gt;, &lt;pre&gt;, &lt;img&gt;, &lt;a&gt;)." style="min-height:300px;" required></textarea>
          </div>
          <div class="form-group">
            <label for="featured_image">Featured Image URL (optional)</label>
            <input type="url" id="featured_image" placeholder="https://example.com/image.jpg">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Publish Article</button>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/blog.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const user = await getCurrentUser();
      const navAuth = document.getElementById('nav-auth');
      if (user) {
        navAuth.textContent = 'Logout';
        navAuth.href = '#';
        navAuth.addEventListener('click', async (e) => {
          e.preventDefault();
          await signOut();
          window.location.href = 'index.html';
        });
      } else {
        window.location.href = 'login.html?redirect=create-article.html';
        return;
      }

      // Load topics into select
      try {
        const topics = await getTopics();
        const select = document.getElementById('topic');
        topics.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.id;
          opt.textContent = t.name;
          select.appendChild(opt);
        });
        // Pre-select topic if specified in URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('topic')) {
          const matchingOpt = Array.from(select.options).find(o => o.textContent === urlParams.get('topic'));
          if (matchingOpt) matchingOpt.selected = true;
        }
      } catch (err) {
        showAlert('alert-container', 'Failed to load topics: ' + err.message, 'error');
      }

      // Auto-generate slug from title
      document.getElementById('title').addEventListener('input', function() {
        const slugField = document.getElementById('slug');
        if (!slugField.dataset.userEdited) {
          slugField.value = slugify(this.value);
        }
      });
      document.getElementById('slug').addEventListener('input', function() {
        this.dataset.userEdited = 'true';
      });

      document.getElementById('article-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const topicId = parseInt(document.getElementById('topic').value);
        const title = document.getElementById('title').value.trim();
        const slug = document.getElementById('slug').value.trim();
        const content = document.getElementById('content').value.trim();
        const featuredImage = document.getElementById('featured_image').value.trim() || null;
        const btn = this.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = 'Publishing...';
        try {
          await createArticle(topicId, title, slug, content, featuredImage);
          showAlert('alert-container', 'Article published!', 'success');
          setTimeout(() => { window.location.href = 'article.html?slug=' + slug; }, 1500);
        } catch (err) {
          showAlert('alert-container', 'Failed to publish: ' + err.message, 'error');
        }
        btn.disabled = false;
        btn.textContent = 'Publish Article';
      });
    });
  </script>
<script src="../js/analytics-tracker.js" defer></script>
</body>
</html>
