<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Articles - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
  </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body>
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <a href="../" class="text-blue-600 font-bold text-lg">HetanshTechnologie</a>
      <span class="text-gray-400">|</span>
      <a href="dashboard.html" class="font-semibold hover:text-blue-600">Admin</a>
      <span class="text-gray-400">/</span>
      <span class="text-gray-500">Blog Articles</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="user-email" class="text-sm text-gray-500"></span>
      <button onclick="signOut()" class="text-sm text-red-500 hover:underline">Logout</button>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">Blog Articles</h1>
      <a href="../blog/create-article.html" target="_blank" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">+ New Article</a>
    </div>
    <div id="alert"></div>
    <div id="loading" class="text-gray-500 mb-4">Loading articles...</div>
    <div id="articles-section" class="hidden overflow-x-auto bg-white rounded-xl shadow-sm border"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const user = await requireAdmin();
      if (!user) return;
      document.getElementById('user-email').textContent = user.email;
      await loadArticles();
    });

    async function loadArticles() {
      try {
        const { data, error } = await _admin
          .from('blog_articles')
          .select('*, blog_topics(name), blog_profiles(username, full_name)')
          .order('created_at', { ascending: false });

        if (error) throw error;

        document.getElementById('loading').classList.add('hidden');
        const div = document.getElementById('articles-section');
        div.classList.remove('hidden');

        if (!data || !data.length) {
          div.innerHTML = '<div class="p-6 text-gray-500 text-center">No articles yet.</div>';
          return;
        }

        div.innerHTML = `
          <table class="w-full text-sm">
            <thead><tr class="bg-gray-50 border-b text-left">
              <th class="p-3 font-semibold">#</th>
              <th class="p-3 font-semibold">Title</th>
              <th class="p-3 font-semibold">Topic</th>
              <th class="p-3 font-semibold">Author</th>
              <th class="p-3 font-semibold">Created</th>
              <th class="p-3 font-semibold">Actions</th>
            </tr></thead>
            <tbody>${data.map(a => `
              <tr class="border-b hover:bg-gray-50">
                <td class="p-3 font-mono text-xs">#${a.id}</td>
                <td class="p-3 font-medium">
                  <a href="../blog/article.html?slug=${encodeURIComponent(a.slug)}" target="_blank" class="text-blue-600 hover:underline">${escapeHtml(a.title)}</a>
                </td>
                <td class="p-3 text-xs">${a.blog_topics ? escapeHtml(a.blog_topics.name) : '-'}</td>
                <td class="p-3 text-xs text-gray-500">${escapeHtml(a.blog_profiles?.username || a.blog_profiles?.full_name || 'Unknown')}</td>
                <td class="p-3 text-xs text-gray-500 whitespace-nowrap">${new Date(a.created_at).toLocaleDateString()}</td>
                <td class="p-3 flex gap-2">
                  <a href="blog-edit-article.html?id=${a.id}" class="text-blue-600 hover:underline text-xs font-medium">Edit</a>
                  <button class="text-red-600 hover:underline text-xs font-medium delete-btn" data-id="${a.id}" data-title="${escapeHtml(a.title)}">Delete</button>
                </td>
              </tr>
            `).join('')}</tbody>
          </table>
          <div class="p-3 text-xs text-gray-400 border-t">Total: ${data.length} article${data.length !== 1 ? 's' : ''}</div>
        `;

        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', async function() {
            const id = parseInt(this.dataset.id);
            const title = this.dataset.title;
            if (!confirm(`Delete "${title}"?\n\nThis action cannot be undone.`)) return;
            this.disabled = true;
            this.textContent = 'Deleting...';
            try {
              const { error } = await _admin.from('blog_articles').delete().eq('id', id);
              if (error) throw error;
              this.closest('tr').remove();
              showAlert('Deleted successfully.', 'success');
            } catch (err) {
              showAlert('Failed to delete: ' + err.message, 'error');
              this.disabled = false;
              this.textContent = 'Delete';
            }
          });
        });
      } catch (err) {
        document.getElementById('loading').textContent = '';
        document.getElementById('alert').innerHTML = '<div class="bg-red-100 text-red-700 p-3 rounded text-sm mb-4">' + err.message + '</div>';
      }
    }

    function showAlert(msg, type) {
      const el = document.getElementById('alert');
      const bg = type === 'success' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';
      el.innerHTML = '<div class="' + bg + ' p-3 rounded text-sm mb-4">' + msg + '</div>';
      setTimeout(() => el.innerHTML = '', 4000);
    }
  </script>
<script src="../js/analytics-tracker.js" defer></script>
</body>
</html>
