<html lang="en">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16.png">
<link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacts - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
  </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body>
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <a href="../" class="text-blue-600 font-bold text-lg"><img src="../images/logo.png" alt="Hetansh Technologie" style="height:100px;width:auto;vertical-align:middle;border-radius:10px;object-fit:contain;position:relative;top:20px;">HetanshTechnologie</a>
      <span class="text-gray-400">|</span>
      <span class="font-semibold">Admin / Contacts</span>
    </div>
    <div class="flex items-center gap-4">
      <a href="dashboard.html" class="text-sm text-blue-600 hover:underline">Dashboard</a>
      <a href="job-applications.html" class="text-sm text-blue-600 hover:underline">Job Apps</a>
      <button onclick="signOut()" class="text-sm text-red-500 hover:underline">Logout</button>
    </div>
  </nav>

  <div class="max-w-5xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-6">Contact Form Submissions</h1>
    <div id="alert"></div>
    <div id="loading" class="text-gray-500">Loading contacts...</div>
    <div id="contacts-table" class="hidden overflow-x-auto bg-white rounded-xl shadow-sm border"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const user = await requireAdmin();
      if (!user) return;

      try {
        const { data, error } = await _admin
          .from('contact')
          .select('*')
          .neq('service', 'Newsletter Subscription')
          .order('created_at', { ascending: false });

        if (error) throw error;

        document.getElementById('loading').classList.add('hidden');
        const div = document.getElementById('contacts-table');
        div.classList.remove('hidden');

        if (!data.length) {
          div.innerHTML = '<div class="p-6 text-gray-500 text-center">No contact submissions yet.</div>';
          return;
        }

        div.innerHTML = `
          <table class="w-full text-sm">
            <thead><tr class="bg-gray-50 border-b text-left">
              <th class="p-3 font-semibold">Name</th>
              <th class="p-3 font-semibold">Email</th>
              <th class="p-3 font-semibold">Phone</th>
              <th class="p-3 font-semibold">Service</th>
              <th class="p-3 font-semibold">Message</th>
              <th class="p-3 font-semibold">Date</th>
              <th class="p-3 font-semibold">Actions</th>
            </tr></thead>
            <tbody>${data.map(r => `
              <tr class="border-b hover:bg-gray-50">
                <td class="p-3">${escapeHtml(r.name || '-')}</td>
                <td class="p-3">${escapeHtml(r.email)}</td>
                <td class="p-3">${escapeHtml(r.phone || '-')}</td>
                <td class="p-3"><span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-xs">${escapeHtml(r.service)}</span></td>
                <td class="p-3 max-w-xs truncate" title="${escapeHtml(r.message || '')}">${escapeHtml((r.message || '').substring(0, 80))}${(r.message || '').length > 80 ? '...' : ''}</td>
                <td class="p-3 text-gray-500 text-xs">${new Date(r.created_at).toLocaleString()}</td>
                <td class="p-3">
                  <button class="text-red-500 hover:underline text-xs delete-btn" data-id="${r.id}">Delete</button>
                </td>
              </tr>
            `).join('')}</tbody>
          </table>
          <div class="p-3 text-xs text-gray-400 border-t">Total: ${data.length} submission${data.length !== 1 ? 's' : ''}</div>
        `;

        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', async function() {
            if (!confirm('Delete this contact entry?')) return;
            try {
              const { error } = await _admin.from('contact').delete().eq('id', parseInt(this.dataset.id));
              if (error) throw error;
              this.closest('tr').remove();
            } catch (err) {
              document.getElementById('alert').innerHTML = '<div class="bg-red-100 text-red-700 p-3 rounded text-sm">' + err.message + '</div>';
            }
          });
        });
      } catch (err) {
        document.getElementById('loading').textContent = '';
        document.getElementById('alert').innerHTML = '<div class="bg-red-100 text-red-700 p-3 rounded text-sm">' + err.message + '</div>';
      }
    });
  </script>
<script src="../js/analytics-tracker.js" defer></script>
</body>
</html>
