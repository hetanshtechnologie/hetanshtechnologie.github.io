<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 50; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: #fff; border-radius: 12px; padding: 24px; width: 480px; max-width: 90vw; }
  </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body>
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <a href="../" class="text-blue-600 font-bold text-lg">HetanshTechnologie</a>
      <span class="text-gray-400">|</span>
      <span class="font-semibold">Admin / Users</span>
    </div>
    <div class="flex items-center gap-4">
      <a href="dashboard.html" class="text-sm text-blue-600 hover:underline">Dashboard</a>
      <span id="user-email" class="text-sm text-gray-500"></span>
      <button onclick="signOut()" class="text-sm text-red-500 hover:underline">Logout</button>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-6">Registered Users</h1>
    <div id="alert"></div>
    <div id="loading" class="text-gray-500">Loading users...</div>
    <div id="users-table" class="hidden overflow-x-auto bg-white rounded-xl shadow-sm border"></div>
  </div>

  <!-- Manage App Access Modal -->
  <div class="modal-overlay" id="apps-modal" onclick="if(event.target===this)closeAppsModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold text-lg" id="apps-modal-title">Manage App Access</h2>
        <button onclick="closeAppsModal()" class="text-gray-500 hover:text-black text-xl">&times;</button>
      </div>
      <p class="text-sm text-gray-500 mb-3">Select the applications this user can access.</p>
      <div id="apps-checkboxes" class="grid grid-cols-2 gap-2 mb-4 max-h-72 overflow-y-auto"></div>
      <div class="flex justify-end gap-2">
        <button onclick="closeAppsModal()" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg text-sm hover:bg-gray-200">Cancel</button>
        <button onclick="saveApps()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700">Save</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const user = await requireAdmin();
      if (!user) return;
      document.getElementById('user-email').textContent = user.email;
      await loadUsers();
    });

    async function getToken() {
      const s = await _admin.auth.getSession();
      if (!s.data?.session?.access_token) {
        await _admin.auth.refreshSession();
        const s2 = await _admin.auth.getSession();
        return s2.data?.session?.access_token;
      }
      return s.data.session.access_token;
    }

    const APP_OPTIONS = [
      { key: 'google', label: 'Google' },
      { key: 'todo', label: 'Todo' },
      { key: 'qna', label: 'QNA' },
      { key: 'ecommerce', label: 'Marketplace' },
      { key: 'eduerp', label: 'EduERP' },
      { key: 'expense-tracker', label: 'Expense Tracker' },
      { key: 'society', label: 'Society Management' },
      { key: 'projectpro', label: 'ProjectPro' },
      { key: 'jobportal', label: 'JobPortal' }
    ];

    const APP_COLORS = {
      google: { label: 'Google', cls: 'bg-blue-100 text-blue-700' },
      todo: { label: 'Todo', cls: 'bg-green-100 text-green-700' },
      qna: { label: 'QNA', cls: 'bg-purple-100 text-purple-700' },
      ecommerce: { label: 'Marketplace', cls: 'bg-orange-100 text-orange-700' },
      eduerp: { label: 'EduERP', cls: 'bg-yellow-100 text-yellow-700' },
      'expense-tracker': { label: 'Expense Tracker', cls: 'bg-emerald-100 text-emerald-700' },
      society: { label: 'Society Mgmt', cls: 'bg-indigo-100 text-indigo-700' },
      projectpro: { label: 'ProjectPro', cls: 'bg-teal-100 text-teal-700' },
      jobportal: { label: 'JobPortal', cls: 'bg-rose-100 text-rose-700' }
    };

    let usersCache = {};
    let appsUserId = null;
    let appsUserEmail = '';

    function appBadge(key) {
      const meta = APP_COLORS[key];
      if (!meta) return '<span class="bg-gray-100 text-gray-600 text-xs font-semibold px-2 py-0.5 rounded">' + escapeHtml(key) + '</span>';
      return '<span class="' + meta.cls + ' text-xs font-semibold px-2 py-0.5 rounded">' + escapeHtml(meta.label) + '</span>';
    }

    function openApps(userId) {
      const u = usersCache[userId];
      if (!u) return;
      appsUserId = userId;
      appsUserEmail = u.email;
      const set = new Set(u.apps || []);
      if (u.provider === 'google') set.add('google');
      document.getElementById('apps-modal-title').textContent = 'App Access - ' + u.email;
      const wrap = document.getElementById('apps-checkboxes');
      wrap.innerHTML = APP_OPTIONS.map(a => {
        const checked = set.has(a.key);
        const border = checked ? 'border-blue-300 bg-blue-50' : 'border-gray-200';
        return '<label class="flex items-center gap-2 p-2 rounded-lg border ' + border + ' cursor-pointer hover:bg-gray-50">' +
          '<input type="checkbox" value="' + a.key + '" class="app-checkbox" ' + (checked ? 'checked' : '') + '>' +
          '<span class="text-sm">' + a.label + '</span></label>';
      }).join('');
      document.getElementById('apps-modal').classList.add('open');
    }

    function closeAppsModal() {
      document.getElementById('apps-modal').classList.remove('open');
      appsUserId = null;
      appsUserEmail = '';
    }

    async function saveApps() {
      const userId = appsUserId;
      const email = appsUserEmail;
      const checked = Array.from(document.querySelectorAll('.app-checkbox:checked')).map(c => c.value);
      closeAppsModal();
      if (!userId) return;
      try {
        const token = await getToken();
        const res = await fetch('https://vgipghqejzbcoighktij.supabase.co/functions/v1/admin-manage-users', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'set_apps', user_id: userId, apps: checked })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        showAlert('App access updated for ' + email, 'success');
        loadUsers();
      } catch (err) {
        showAlert(err.message, 'error');
      }
    }

    async function loadUsers() {
      try {
        const token = await getToken();
        const res = await fetch('https://vgipghqejzbcoighktij.supabase.co/functions/v1/admin-list-users', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Failed to load users');
        const { users } = await res.json();
        usersCache = {};
        users.forEach(u => { usersCache[u.id] = u; });

        document.getElementById('loading').classList.add('hidden');
        const div = document.getElementById('users-table');
        div.classList.remove('hidden');

        if (!users.length) {
          div.innerHTML = '<div class="p-6 text-gray-500 text-center">No users found.</div>';
          return;
        }

        div.innerHTML = `
          <table class="w-full text-sm">
            <thead><tr class="bg-gray-50 border-b text-left">
              <th class="p-3 font-semibold">Email</th>
              <th class="p-3 font-semibold">Username</th>
              <th class="p-3 font-semibold">Full Name</th>
              <th class="p-3 font-semibold">Status</th>
              <th class="p-3 font-semibold">Apps Access</th>
              <th class="p-3 font-semibold">Joined</th>
              <th class="p-3 font-semibold">Last Login</th>
              <th class="p-3 font-semibold"></th>
            </tr></thead>
            <tbody>${users.map(u => {
              const isBanned = u.banned_until && new Date(u.banned_until) > new Date();
              return `
              <tr class="border-b hover:bg-gray-50">
                <td class="p-3">${escapeHtml(u.email)}</td>
                <td class="p-3">${escapeHtml(u.username || '-')}</td>
                <td class="p-3">${escapeHtml(u.full_name || '-')}</td>
                <td class="p-3">${isBanned ? '<span class="bg-red-100 text-red-700 text-xs font-semibold px-2 py-0.5 rounded">Inactive</span>' : '<span class="bg-green-100 text-green-700 text-xs font-semibold px-2 py-0.5 rounded">Active</span>'}</td>
                <td class="p-3">
                  <div class="flex flex-wrap gap-1 mb-1">${(u.apps || []).map(appBadge).join('') || '<span class="text-gray-400 text-xs">No apps</span>'}</div>
                  <button onclick="openApps('${u.id}')" class="text-xs text-blue-600 hover:underline">Manage Apps</button>
                </td>
                <td class="p-3 text-gray-500">${u.created_at ? new Date(u.created_at).toLocaleDateString() : '-'}</td>
                <td class="p-3 text-gray-500">${u.last_sign_in_at ? new Date(u.last_sign_in_at).toLocaleDateString() : '-'}</td>
                <td class="p-3 whitespace-nowrap">
                  <button onclick="toggleUserStatus('${u.id}')" class="text-xs ${isBanned ? 'text-green-600 hover:underline' : 'text-orange-600 hover:underline'} mr-2">${isBanned ? 'Activate' : 'Deactivate'}</button>
                  <button onclick="deleteUser('${u.id}', '${escapeHtml(u.email)}')" class="text-xs text-red-600 hover:underline">Delete</button>
                </td>
              </tr>`;}).join('')}</tbody>
          </table>
          <div class="p-3 text-xs text-gray-400 border-t">Total: ${users.length} user${users.length !== 1 ? 's' : ''}</div>`;
      } catch (err) {
        document.getElementById('loading').textContent = '';
        document.getElementById('alert').innerHTML = '<div class="bg-red-100 text-red-700 p-3 rounded text-sm">' + err.message + '</div>';
      }
    }

    async function manageUser(action, userId) {
      const token = await getToken();
      const res = await fetch('https://vgipghqejzbcoighktij.supabase.co/functions/v1/admin-manage-users', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, user_id: userId })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    async function toggleUserStatus(userId) {
      try {
        await manageUser('toggle_status', userId);
        showAlert('User status updated', 'success');
        loadUsers();
      } catch (err) {
        showAlert(err.message, 'error');
      }
    }

    async function deleteUser(userId, email) {
      if (!confirm('Permanently delete user ' + email + '?\n\nThis cannot be undone. Their blog/profile data will remain but the auth account will be removed.')) return;
      if (!confirm('Are you absolutely sure? Type the email to confirm.\n\nEmail: ' + email)) return;
      try {
        await manageUser('delete', userId);
        showAlert('User deleted: ' + email, 'success');
        loadUsers();
      } catch (err) {
        showAlert(err.message, 'error');
      }
    }
  </script>
<script src="../js/analytics-tracker.js" defer></script>
</body>
</html>
