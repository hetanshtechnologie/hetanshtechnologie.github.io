<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16.png">
<link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Plans - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 9999px; font-size: .75rem; font-weight: 600; }
    .badge-success { background: #dcfce7; color: #166534; }
    .badge-pending { background: #fef9c3; color: #854d0e; }
    .badge-error { background: #fee2e2; color: #991b1b; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 50; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: #fff; border-radius: 12px; padding: 24px; width: 420px; max-width: 90vw; }
    .modal-box h2 { margin-bottom: 16px; }
    .modal-box select { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; margin-bottom: 16px; }
    .modal-box select:focus { outline: none; border-color: #3b82f6; }
  </style>

</head>
<body>
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <a href="../" class="text-blue-600 font-bold text-lg"><img src="../images/logo.png" alt="Hetansh Technologie" style="height:100px;width:auto;vertical-align:middle;border-radius:10px;object-fit:contain;position:relative;top:20px;"></a>
      <span class="text-gray-400">|</span>
      <a href="dashboard.html" class="font-semibold text-gray-700 hover:text-blue-600">Admin</a>
      <span class="text-gray-400">/</span>
      <span class="text-gray-500">User Plans</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="user-email" class="text-sm text-gray-500"></span>
      <button onclick="signOut()" class="text-sm text-red-500 hover:underline">Logout</button>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-6">User Plans</h1>
    <div id="alert"></div>
    <div id="loading" class="text-gray-500">Loading users...</div>
    <div id="plans-table" class="hidden overflow-x-auto bg-white rounded-xl shadow-sm border"></div>
  </div>

  <!-- Assign Modal -->
  <div class="modal-overlay" id="assign-modal" onclick="if(event.target===this)closeAssignModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold text-lg" id="assign-modal-title">Assign Plan</h2>
        <button onclick="closeAssignModal()" class="text-gray-500 hover:text-black text-xl">&times;</button>
      </div>
      <select id="assign-plan-select"></select>
      <div class="flex justify-end gap-2">
        <button onclick="closeAssignModal()" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg text-sm hover:bg-gray-200">Cancel</button>
        <button onclick="confirmAssign()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700">Assign</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/admin.js"></script>
  <script>
    let assignUserId = null;
    let assignType = null;
    let qnaPlanOptions = [];
    let todoPlanOptions = [];
    let ecPlanOptions = [];

    document.addEventListener('DOMContentLoaded', async function() {
      const user = await requireAdmin();
      if (!user) return;
      document.getElementById('user-email').textContent = user.email;
      await loadPlanOptions();
      await loadUserPlans();
    });

    async function loadPlanOptions() {
      const { data: qna } = await _admin.from('qna_plans').select('id,name,price,active').order('id');
      qnaPlanOptions = (qna || []).filter(p => p.active).map(p => ({ id: p.id, name: p.name, price: p.price }));
      const { data: todo } = await _admin.from('todo_plans').select('id,name,price,active').order('id');
      todoPlanOptions = (todo || []).filter(p => p.active).map(p => ({ id: p.id, name: p.name, price: p.price }));
      const { data: ec } = await _admin.from('ec_plans').select('id,name,price,active').order('sort_order');
      ecPlanOptions = (ec || []).filter(p => p.active).map(p => ({ id: p.id, name: p.name, price: p.price }));
    }

    async function getToken() {
      let s = await _admin.auth.getSession();
      if (!s.data?.session?.access_token) {
        await _admin.auth.refreshSession();
        s = await _admin.auth.getSession();
      }
      return s.data?.session?.access_token;
    }

    async function loadUserPlans() {
      try {
        const token = await getToken();
        const res = await fetch('https://vgipghqejzbcoighktij.supabase.co/functions/v1/admin-list-user-plans', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({})
        });
        if (!res.ok) throw new Error('Failed to load user plans');
        const { users } = await res.json();

        document.getElementById('loading').classList.add('hidden');
        const div = document.getElementById('plans-table');
        div.classList.remove('hidden');

        if (!users.length) {
          div.innerHTML = '<div class="p-6 text-gray-500 text-center">No users found.</div>';
          return;
        }

        function planBadge(plan) {
          if (!plan) return '<span class="text-gray-400 text-xs">Free</span>';
          const isActive = plan.status === 'active';
          const isExpired = plan.end_date && new Date(plan.end_date) < new Date();
          const statusColor = plan.status === 'blocked' ? 'badge-error' : (isActive && !isExpired ? 'badge-success' : 'badge-pending');
          return '<div><span class="font-medium text-sm">' + escapeHtml(plan.plan_name) + '</span> <span class="badge ' + statusColor + '">' + plan.status + (isExpired ? ' (expired)' : '') + '</span></div>';
        }

        div.innerHTML = `
          <table class="w-full text-sm">
            <thead><tr class="bg-gray-50 border-b text-left">
              <th class="p-3 font-semibold">Email</th>
              <th class="p-3 font-semibold">QNA Plan</th>
              <th class="p-3 font-semibold">QNA Actions</th>
              <th class="p-3 font-semibold">Todo Plan</th>
              <th class="p-3 font-semibold">Todo Actions</th>
              <th class="p-3 font-semibold">EC Plan</th>
              <th class="p-3 font-semibold">EC Actions</th>
            </tr></thead>
            <tbody>${users.map(u => {
              const isBanned = u.banned_until && new Date(u.banned_until) > new Date();
              const emailClass = isBanned ? 'text-gray-400 line-through' : '';
              return `
              <tr class="border-b hover:bg-gray-50">
                <td class="p-3 ${emailClass}">${escapeHtml(u.email)}</td>
                <td class="p-3">${planBadge(u.qna_plan)}</td>
                <td class="p-3 whitespace-nowrap">${planActions(u.id, 'qna', u.qna_plan)}</td>
                <td class="p-3">${planBadge(u.todo_plan)}</td>
                <td class="p-3 whitespace-nowrap">${planActions(u.id, 'todo', u.todo_plan)}</td>
                <td class="p-3">${planBadge(u.ec_plan)}</td>
                <td class="p-3 whitespace-nowrap">${planActions(u.id, 'ec', u.ec_plan)}</td>
              </tr>`;}).join('')}</tbody>
          </table>
          <div class="p-3 text-xs text-gray-400 border-t">Total: ${users.length} user${users.length !== 1 ? 's' : ''}</div>`;
      } catch (err) {
        document.getElementById('loading').textContent = '';
        document.getElementById('alert').innerHTML = '<div class="bg-red-100 text-red-700 p-3 rounded text-sm">' + err.message + '</div>';
      }
    }

    function planActions(userId, type, plan) {
      const assignBtn = '<button onclick="openAssign(\'' + userId + '\', \'' + type + '\')" class="text-xs text-blue-600 hover:underline mr-2">' + (plan ? 'Change' : 'Assign') + '</button>';
      if (!plan) return assignBtn;
      const isBlocked = plan.status === 'blocked';
      return assignBtn +
        '<button onclick="managePlan(\'' + userId + '\', \'' + type + '\', \'' + (isBlocked ? 'unblock' : 'block') + '\')" class="text-xs ' + (isBlocked ? 'text-green-600 hover:underline' : 'text-orange-600 hover:underline') + ' mr-2">' + (isBlocked ? 'Unblock' : 'Block') + '</button>' +
        '<button onclick="managePlan(\'' + userId + '\', \'' + type + '\', \'delete\')" class="text-xs text-red-600 hover:underline">Delete</button>';
    }

    function openAssign(userId, type) {
      assignUserId = userId;
      assignType = type;
      const options = type === 'todo' ? todoPlanOptions : type === 'ec' ? ecPlanOptions : qnaPlanOptions;
      const sel = document.getElementById('assign-plan-select');
      sel.innerHTML = '<option value="">Select a plan...</option>' +
        options.map(p => '<option value="' + p.id + '">' + escapeHtml(p.name) + (p.price > 0 ? ' (&#8377;' + (p.price / 100).toFixed(2) + ')' : ' (Free)') + '</option>').join('');
      const typeLabel = type === 'todo' ? 'Todo' : type === 'ec' ? 'Ecommerce' : 'QNA';
      document.getElementById('assign-modal-title').textContent = typeLabel + ' Plan for ' + userId.substring(0, 8) + '...';
      document.getElementById('assign-modal').classList.add('open');
    }

    function closeAssignModal() {
      document.getElementById('assign-modal').classList.remove('open');
      assignUserId = null;
      assignType = null;
    }

    async function confirmAssign() {
      const planId = parseInt(document.getElementById('assign-plan-select').value);
      if (!planId) return alert('Select a plan');
      closeAssignModal();
      try {
        const token = await getToken();
        const res = await fetch('https://vgipghqejzbcoighktij.supabase.co/functions/v1/admin-manage-user-plans', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'assign', user_id: assignUserId, plan_type: assignType, plan_id: planId })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        showAlert(assignType.toUpperCase() + ' plan assigned', 'success');
        loadUserPlans();
      } catch (err) {
        showAlert(err.message, 'error');
      }
    }

    async function managePlan(userId, planType, action) {
      if (action === 'delete' && !confirm('Delete this ' + planType.toUpperCase() + ' plan for this user? They will be reverted to Free.')) return;
      try {
        const token = await getToken();
        const res = await fetch('https://vgipghqejzbcoighktij.supabase.co/functions/v1/admin-manage-user-plans', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, user_id: userId, plan_type: planType })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        showAlert(planType.toUpperCase() + ' plan ' + action + 'd successfully', 'success');
        loadUserPlans();
      } catch (err) {
        showAlert(err.message, 'error');
      }
    }
  </script>
<script src="../js/analytics-tracker.js" defer></script>
</body>
</html>
