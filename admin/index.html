<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Hetansh Technologie</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
  </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
    <script>if(location.hash==='#')history.replaceState(null,'',location.pathname+location.search)</script>
</head>
<body class="min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-2xl shadow-lg max-w-sm w-full text-center">
    <div class="text-4xl mb-4">&#128274;</div>
    <h1 class="text-2xl font-bold mb-2">Admin Panel</h1>
    <p class="text-gray-500 text-sm mb-6">Sign in with the admin account to continue.</p>
    <div id="alert"></div>

    <button onclick="handleSocialLogin()" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;background:#fff;cursor:pointer;font-weight:500;font-size:.9rem;margin-bottom:16px;">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.54 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.28-3.14.76-4.59l-7.98-6.19A23.99 23.99 0 0 0 0 24c0 3.77.87 7.35 2.56 10.56l7.98-5.97z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 5.97C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign in with Google
    </button>

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
      <hr style="flex:1;border:none;border-top:1px solid #e5e7eb;">
      <span style="color:#9ca3af;font-size:.85rem;">or email</span>
      <hr style="flex:1;border:none;border-top:1px solid #e5e7eb;">
    </div>

    <form id="login-form">
      <input type="email" id="email" placeholder="Email" class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-3 text-sm" required>
      <input type="password" id="password" placeholder="Password" class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-4 text-sm" required>
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700">Login</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const { data: { user } } = await _admin.auth.getUser();
      if (user && user.email === ADMIN_EMAIL) {
        window.location.href = 'dashboard.html';
        return;
      }
    });

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = this.querySelector('button');
      btn.disabled = true; btn.textContent = 'Checking...';
      try {
        const { data, error } = await _admin.auth.signInWithPassword({ email, password });
        if (error) throw error;
        if (data.user.email !== ADMIN_EMAIL) {
          await _admin.auth.signOut();
          document.getElementById('alert').innerHTML = '<div class="bg-red-100 text-red-700 p-2 rounded text-sm mb-4">Access denied. Admin only.</div>';
          btn.disabled = false; btn.textContent = 'Login';
          return;
        }
        window.location.href = 'dashboard.html';
      } catch (err) {
        document.getElementById('alert').innerHTML = '<div class="bg-red-100 text-red-700 p-2 rounded text-sm mb-4">' + err.message + '</div>';
      }
      btn.disabled = false; btn.textContent = 'Login';
    });
  </script>
<script src="../js/analytics-tracker.js" defer></script>
</body>
</html>
