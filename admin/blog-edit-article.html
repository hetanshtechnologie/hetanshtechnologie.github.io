<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16.png">
<link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Article - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
  </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body>
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <a href="../" class="text-blue-600 font-bold text-lg"><img src="../images/logo.png" alt="Hetansh Technologie" style="height:100px;width:auto;vertical-align:middle;border-radius:10px;object-fit:contain;position:relative;top:20px;"></a>
      <span class="text-gray-400">|</span>
      <a href="dashboard.html" class="font-semibold hover:text-blue-600">Admin</a>
      <span class="text-gray-400">/</span>
      <a href="blog-articles.html" class="hover:text-blue-600">Blog Articles</a>
      <span class="text-gray-400">/</span>
      <span class="text-gray-500">Edit</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="user-email" class="text-sm text-gray-500"></span>
      <button onclick="signOut()" class="text-sm text-red-500 hover:underline">Logout</button>
    </div>
  </nav>

  <div class="max-w-3xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-6">Edit Article</h1>
    <div id="alert"></div>
    <div id="loading" class="text-gray-500">Loading article...</div>

    <form id="edit-form" class="hidden bg-white rounded-xl shadow-sm border p-6">
      <div class="mb-4">
        <label class="block text-sm font-semibold mb-1">Topic</label>
        <select id="topic" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" required></select>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-semibold mb-1">Title</label>
        <input type="text" id="title" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" required>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-semibold mb-1">URL Slug</label>
        <input type="text" id="slug" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono text-xs" required>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-semibold mb-1">Content (HTML)</label>
        <textarea id="content" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono" style="min-height:400px;" required></textarea>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-semibold mb-1">Featured Image URL</label>
        <input type="url" id="featured_image" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
      </div>
      <div class="flex gap-3">
        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">Save Changes</button>
        <a href="blog-articles.html" class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg text-sm font-semibold hover:bg-gray-300">Cancel</a>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const user = await requireAdmin();
      if (!user) return;
      document.getElementById('user-email').textContent = user.email;

      const params = new URLSearchParams(window.location.search);
      const articleId = params.get('id');
      if (!articleId) { document.getElementById('loading').textContent = 'No article ID specified.'; return; }

      try {
        const { data: topics, error: tErr } = await _admin.from('blog_topics').select('*').order('name');
        if (tErr) throw tErr;
        const select = document.getElementById('topic');
        topics.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.id;
          opt.textContent = t.name;
          select.appendChild(opt);
        });

        const { data: article, error: aErr } = await _admin.from('blog_articles').select('*').eq('id', parseInt(articleId)).single();
        if (aErr) throw aErr;
        if (!article) { document.getElementById('loading').textContent = 'Article not found.'; return; }

        document.getElementById('topic').value = article.topic_id || '';
        document.getElementById('title').value = article.title;
        document.getElementById('slug').value = article.slug;
        document.getElementById('content').value = article.content;
        document.getElementById('featured_image').value = article.featured_image || '';

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('edit-form').classList.remove('hidden');
      } catch (err) {
        document.getElementById('loading').textContent = 'Error: ' + err.message;
      }

      document.getElementById('edit-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = this.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = 'Saving...';
        try {
          const { error } = await _admin.from('blog_articles').update({
            topic_id: parseInt(document.getElementById('topic').value),
            title: document.getElementById('title').value.trim(),
            slug: document.getElementById('slug').value.trim(),
            content: document.getElementById('content').value,
            featured_image: document.getElementById('featured_image').value.trim() || null,
            updated_at: new Date().toISOString()
          }).eq('id', parseInt(articleId));
          if (error) throw error;
          showAlert('Article updated successfully!', 'success');
          setTimeout(() => { window.location.href = 'blog-articles.html'; }, 1200);
        } catch (err) {
          showAlert('Failed to save: ' + err.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Save Changes';
        }
      });
    });

    function showAlert(msg, type) {
      const el = document.getElementById('alert');
      const bg = type === 'success' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';
      el.innerHTML = '<div class="' + bg + ' p-3 rounded text-sm mb-4">' + msg + '</div>';
    }
  </script>
<script src="../js/analytics-tracker.js" defer></script>
</body>
</html>
