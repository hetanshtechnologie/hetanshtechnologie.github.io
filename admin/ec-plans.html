<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16.png">
<link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecommerce Plans - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 50; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: #fff; border-radius: 12px; padding: 24px; width: 540px; max-width: 90vw; max-height: 90vh; overflow-y: auto; }
    .modal-box label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 4px; margin-top: 12px; }
    .modal-box input, .modal-box select { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
    .modal-box input:focus, .modal-box select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
    .modal-box .checkbox-group label { display: inline-flex; align-items: center; gap: 6px; font-weight: 400; font-size: 14px; margin-top: 0; cursor: pointer; }
    .modal-box .checkbox-group input[type=checkbox] { width: auto; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 9999px; font-size: .75rem; font-weight: 600; }
    .badge-success { background: #dcfce7; color: #166534; }
    .badge-error { background: #fee2e2; color: #991b1b; }
  </style>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body>
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <a href="../" class="text-blue-600 font-bold text-lg"><img src="../images/logo.png" alt="Hetansh Technologie" style="height:100px;width:auto;vertical-align:middle;border-radius:10px;object-fit:contain;position:relative;top:20px;"></a>
      <span class="text-gray-400">|</span>
      <a href="dashboard.html" class="font-semibold text-gray-700 hover:text-blue-600">Admin</a>
      <span class="text-gray-400">/</span>
      <span class="text-gray-500">Ecommerce Plans</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="user-email" class="text-sm text-gray-500"></span>
      <button onclick="signOut()" class="text-sm text-red-500 hover:underline">Logout</button>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">Ecommerce Plans</h1>
      <div class="flex gap-2">
        <a href="ec-user-plans.html" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-200 transition">User Plans</a>
        <button onclick="showPlanModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition">+ New Plan</button>
      </div>
    </div>
    <div id="alert"></div>
    <div id="loading" class="text-gray-500 mb-4">Loading plans...</div>
    <div id="plans-section" class="hidden overflow-x-auto bg-white rounded-xl shadow-sm border"></div>
  </div>

  <div class="modal-overlay" id="plan-modal" onclick="if(event.target===this)closePlanModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-bold text-lg" id="plan-modal-title">New Plan</h2>
        <button onclick="closePlanModal()" class="text-gray-500 hover:text-black text-xl">&times;</button>
      </div>
      <label>Plan Name</label>
      <input id="f-name" placeholder="e.g. Gold">
      <label>Description</label>
      <input id="f-description" placeholder="Brief description of the plan">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label>Max Products</label>
          <input id="f-max-products" type="number" value="10">
        </div>
        <div>
          <label>Max Categories</label>
          <input id="f-max-categories" type="number" value="5">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label>Commission Rate (%)</label>
          <input id="f-commission" type="number" step="0.1" value="5">
        </div>
        <div>
          <label>Price (paise, 0=free)</label>
          <input id="f-price" type="number" value="0">
        </div>
      </div>
      <label class="mt-3 block text-sm font-semibold text-gray-700">Features</label>
      <div class="checkbox-group grid grid-cols-2 gap-2 mt-1">
        <label><input type="checkbox" id="f-featured"> Featured Products</label>
        <label><input type="checkbox" id="f-support"> Priority Support</label>
        <label><input type="checkbox" id="f-domain"> Custom Domain</label>
        <label><input type="checkbox" id="f-bulk"> Bulk Import</label>
        <label><input type="checkbox" id="f-api"> API Access</label>
        <label><input type="checkbox" id="f-analytics"> Analytics</label>
      </div>
      <label class="mt-3"><input type="checkbox" id="f-active" checked> Active</label>
      <label>Sort Order</label>
      <input id="f-sort" type="number" value="0">
      <div class="flex justify-end gap-2 mt-6">
        <button onclick="closePlanModal()" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg text-sm hover:bg-gray-200">Cancel</button>
        <button onclick="savePlan()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700">Save</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/admin.js"></script>
  <script>
    let editId = null;

    document.addEventListener('DOMContentLoaded', async function() {
      const user = await requireAdmin();
      if (!user) return;
      document.getElementById('user-email').textContent = user.email;
      await loadPlans();
    });

    async function loadPlans() {
      const { data, error } = await _admin.from('ec_plans').select('*').order('sort_order');
      document.getElementById('loading').classList.add('hidden');
      if (error) {
        document.getElementById('plans-section').innerHTML = '<div class="p-4 text-red-500">Error: ' + error.message + '</div>';
        document.getElementById('plans-section').classList.remove('hidden');
        return;
      }
      const section = document.getElementById('plans-section');
      if (!data || !data.length) {
        section.innerHTML = '<div class="p-6 text-gray-500 text-center">No plans defined yet.</div>';
        section.classList.remove('hidden');
        return;
      }
      section.innerHTML = `<table class="w-full text-sm"><thead><tr class="bg-gray-50 text-left">
        <th class="p-3 font-semibold">ID</th>
        <th class="p-3 font-semibold">Name</th>
        <th class="p-3 font-semibold">Products</th>
        <th class="p-3 font-semibold">Categories</th>
        <th class="p-3 font-semibold">Commission</th>
        <th class="p-3 font-semibold">Features</th>
        <th class="p-3 font-semibold">Price</th>
        <th class="p-3 font-semibold">Status</th>
        <th class="p-3 font-semibold">Actions</th>
      </tr></thead><tbody>` +
        data.map(p => {
          const features = [];
          if (p.featured_products) features.push('Featured');
          if (p.priority_support) features.push('Priority');
          if (p.custom_domain) features.push('Domain');
          if (p.bulk_import) features.push('Bulk');
          if (p.api_access) features.push('API');
          if (p.analytics) features.push('Analytics');
          return '<tr class="border-t hover:bg-gray-50">' +
            '<td class="p-3">' + p.id + '</td>' +
            '<td class="p-3 font-medium">' + escapeHtml(p.name) + '</td>' +
            '<td class="p-3">' + (p.max_products >= 999999 ? '&#8734;' : p.max_products) + '</td>' +
            '<td class="p-3">' + (p.max_categories >= 999999 ? '&#8734;' : p.max_categories) + '</td>' +
            '<td class="p-3">' + p.commission_rate + '%</td>' +
            '<td class="p-3">' + (features.length ? features.map(f => '<span class="badge badge-success mr-1">' + f + '</span>').join('') : '<span class="text-gray-400 text-xs">None</span>') + '</td>' +
            '<td class="p-3">' + (p.price === 0 ? 'Free' : '&#8377;' + (p.price / 100).toFixed(2)) + '</td>' +
            '<td class="p-3">' + (p.active ? '<span class="badge badge-success">Active</span>' : '<span class="badge badge-error">Inactive</span>') + '</td>' +
            '<td class="p-3 whitespace-nowrap">' +
            '<button onclick="editPlan(' + p.id + ')" class="text-blue-600 hover:underline text-xs mr-2">Edit</button>' +
            '<button onclick="deletePlan(' + p.id + ')" class="text-red-500 hover:underline text-xs">Delete</button></td></tr>';
        }).join('') + '</tbody></table>';
      section.classList.remove('hidden');
    }

    function showPlanModal(plan) {
      editId = null;
      document.getElementById('plan-modal-title').textContent = 'New Plan';
      document.getElementById('f-name').value = '';
      document.getElementById('f-description').value = '';
      document.getElementById('f-max-products').value = '10';
      document.getElementById('f-max-categories').value = '5';
      document.getElementById('f-commission').value = '5';
      document.getElementById('f-price').value = '0';
      document.getElementById('f-featured').checked = false;
      document.getElementById('f-support').checked = false;
      document.getElementById('f-domain').checked = false;
      document.getElementById('f-bulk').checked = false;
      document.getElementById('f-api').checked = false;
      document.getElementById('f-analytics').checked = false;
      document.getElementById('f-active').checked = true;
      document.getElementById('f-sort').value = '0';
      document.getElementById('plan-modal').classList.add('open');
    }

    async function editPlan(id) {
      const { data, error } = await _admin.from('ec_plans').select('*').eq('id', id).single();
      if (error || !data) return showAlert('Error loading plan: ' + (error ? error.message : 'not found'), 'error');
      editId = id;
      document.getElementById('plan-modal-title').textContent = 'Edit Plan';
      document.getElementById('f-name').value = data.name;
      document.getElementById('f-description').value = data.description || '';
      document.getElementById('f-max-products').value = data.max_products;
      document.getElementById('f-max-categories').value = data.max_categories;
      document.getElementById('f-commission').value = data.commission_rate;
      document.getElementById('f-price').value = data.price;
      document.getElementById('f-featured').checked = data.featured_products;
      document.getElementById('f-support').checked = data.priority_support;
      document.getElementById('f-domain').checked = data.custom_domain;
      document.getElementById('f-bulk').checked = data.bulk_import;
      document.getElementById('f-api').checked = data.api_access;
      document.getElementById('f-analytics').checked = data.analytics;
      document.getElementById('f-active').checked = data.active;
      document.getElementById('f-sort').value = data.sort_order;
      document.getElementById('plan-modal').classList.add('open');
    }

    function closePlanModal() {
      document.getElementById('plan-modal').classList.remove('open');
    }

    async function savePlan() {
      const payload = {
        name: document.getElementById('f-name').value.trim(),
        description: document.getElementById('f-description').value.trim(),
        max_products: parseInt(document.getElementById('f-max-products').value) || 0,
        max_categories: parseInt(document.getElementById('f-max-categories').value) || 0,
        commission_rate: parseFloat(document.getElementById('f-commission').value) || 0,
        featured_products: document.getElementById('f-featured').checked,
        priority_support: document.getElementById('f-support').checked,
        custom_domain: document.getElementById('f-domain').checked,
        bulk_import: document.getElementById('f-bulk').checked,
        api_access: document.getElementById('f-api').checked,
        analytics: document.getElementById('f-analytics').checked,
        price: parseInt(document.getElementById('f-price').value) || 0,
        active: document.getElementById('f-active').checked,
        sort_order: parseInt(document.getElementById('f-sort').value) || 0
      };
      if (!payload.name) return showAlert('Plan name is required', 'error');
      const { error } = editId
        ? await _admin.from('ec_plans').update(payload).eq('id', editId)
        : await _admin.from('ec_plans').insert(payload);
      if (error) return showAlert(error.message, 'error');
      closePlanModal();
      showAlert('Plan ' + (editId ? 'updated' : 'created') + ' successfully', 'success');
      await loadPlans();
    }

    async function deletePlan(id) {
      if (!confirm('Delete this plan? Users assigned to it will lose access.')) return;
      const { error } = await _admin.from('ec_plans').delete().eq('id', id);
      if (error) return showAlert(error.message, 'error');
      showAlert('Plan deleted', 'success');
      await loadPlans();
    }
  </script>
<script src="../js/analytics-tracker.js" defer></script>
</body>
</html>
