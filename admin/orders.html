<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16.png">
<link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 9999px; font-size: .75rem; font-weight: 600; }
    .badge-success { background: #dcfce7; color: #166534; }
    .badge-pending { background: #fef9c3; color: #854d0e; }
    .badge-error { background: #fee2e2; color: #991b1b; }
  </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body>
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <a href="../" class="text-blue-600 font-bold text-lg"><img src="../images/logo.png" alt="Hetansh Technologie" style="height:100px;width:auto;vertical-align:middle;border-radius:10px;object-fit:contain;position:relative;top:20px;"></a>
      <span class="text-gray-400">|</span>
      <span class="font-semibold">Admin / Orders</span>
    </div>
    <div class="flex items-center gap-4">
      <a href="dashboard.html" class="text-sm text-blue-600 hover:underline">Dashboard</a>
      <button onclick="signOut()" class="text-sm text-red-500 hover:underline">Logout</button>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-6">Orders</h1>
    <div id="alert"></div>
    <div id="loading" class="text-gray-500">Loading orders...</div>
    <div id="orders-table" class="hidden overflow-x-auto bg-white rounded-xl shadow-sm border"></div>
  </div>

  <!-- Items Modal -->
  <div id="items-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" onclick="if(event.target===this)closeItems()">
    <div class="bg-white rounded-xl shadow-xl max-w-3xl w-full mx-4 max-h-screen overflow-y-auto" onclick="event.stopPropagation()">
      <div class="p-4 border-b flex justify-between items-center">
        <h2 class="font-bold text-lg">Order Items</h2>
        <button onclick="closeItems()" class="text-gray-500 hover:text-black text-xl">&times;</button>
      </div>
      <div id="items-content" class="p-4"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const user = await requireAdmin();
      if (!user) return;

      async function loadOrders() {
        try {
          const session = await _admin.auth.getSession();
          const token = session.data?.session?.access_token;
          const res = await fetch('https://vgipghqejzbcoighktij.supabase.co/functions/v1/admin-list-orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({})
          });
          if (!res.ok) { const e = await res.json(); throw new Error(e.error || 'Failed'); }
          const { orders } = await res.json();

          document.getElementById('loading').classList.add('hidden');
          const div = document.getElementById('orders-table');
          div.classList.remove('hidden');

          if (!orders.length) {
            div.innerHTML = '<div class="p-6 text-gray-500 text-center">No orders yet.</div>';
            return;
          }

          const statusBadge = s => {
            if (s === 'success' || s === 'confirmed') return '<span class="badge badge-success">' + s + '</span>';
            if (s === 'pending') return '<span class="badge badge-pending">' + s + '</span>';
            return '<span class="badge badge-error">' + s + '</span>';
          };

          div.innerHTML = `
            <table class="w-full text-sm">
              <thead><tr class="bg-gray-50 border-b text-left">
                <th class="p-3 font-semibold whitespace-nowrap">Order ID</th>
                <th class="p-3 font-semibold">Email</th>
                <th class="p-3 font-semibold">Amount</th>
                <th class="p-3 font-semibold">Method</th>
                <th class="p-3 font-semibold">Status</th>
                <th class="p-3 font-semibold">Razorpay Order ID</th>
                <th class="p-3 font-semibold">Transaction ID</th>
                <th class="p-3 font-semibold">Date</th>
                <th class="p-3 font-semibold">Items</th>
              </tr></thead>
              <tbody>${orders.map(o => `
                <tr class="border-b hover:bg-gray-50">
                  <td class="p-3 font-mono text-xs">#${o.id}</td>
                  <td class="p-3">${escapeHtml(o.email || '-')}</td>
                  <td class="p-3 font-medium">&#8377;${Number(o.total_amount).toFixed(2)}</td>
                  <td class="p-3">${escapeHtml(o.payment_method || '-')}</td>
                  <td class="p-3">${statusBadge(o.payment_status)}</td>
                  <td class="p-3 font-mono text-xs" title="${escapeHtml(o.razorpay_order_id || '')}">${(o.razorpay_order_id || '').substring(0, 20)}${(o.razorpay_order_id || '').length > 20 ? '...' : ''}</td>
                  <td class="p-3 font-mono text-xs" title="${escapeHtml(o.transaction_id || '')}">${(o.transaction_id || '').substring(0, 20)}${(o.transaction_id || '').length > 20 ? '...' : ''}</td>
                  <td class="p-3 text-gray-500 text-xs whitespace-nowrap">${new Date(o.created_at).toLocaleString()}</td>
                  <td class="p-3"><button class="text-blue-600 hover:underline text-xs view-items" data-order-id="${o.id}">View</button></td>
                </tr>
              `).join('')}</tbody>
            </table>
            <div class="p-3 text-xs text-gray-400 border-t">Total: ${orders.length} order${orders.length !== 1 ? 's' : ''}</div>
          `;

          document.querySelectorAll('.view-items').forEach(btn => {
            btn.addEventListener('click', async function() {
              const orderId = this.dataset.orderId;
              document.getElementById('items-content').innerHTML = '<div class="text-gray-500">Loading...</div>';
              document.getElementById('items-modal').classList.remove('hidden');
              try {
                const session = await _admin.auth.getSession();
                const token = session.data?.session?.access_token;
                const res = await fetch('https://vgipghqejzbcoighktij.supabase.co/functions/v1/admin-list-orders', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                  body: JSON.stringify({ order_id: parseInt(orderId) })
                });
                if (!res.ok) throw new Error('Failed');
                const { items } = await res.json();
                if (!items.length) {
                  document.getElementById('items-content').innerHTML = '<div class="text-gray-500">No items for this order.</div>';
                  return;
                }
                document.getElementById('items-content').innerHTML = `
                  <table class="w-full text-sm">
                    <thead><tr class="bg-gray-50 border-b text-left">
                      <th class="p-2 font-semibold">Item ID</th>
                      <th class="p-2 font-semibold">Title</th>
                      <th class="p-2 font-semibold">Price</th>
                      <th class="p-2 font-semibold">PDF</th>
                    </tr></thead>
                    <tbody>${items.map(i => `
                      <tr class="border-b hover:bg-gray-50">
                        <td class="p-2 text-xs font-mono">#${i.id}</td>
                        <td class="p-2">${escapeHtml(i.title)}</td>
                        <td class="p-2">&#8377;${Number(i.price).toFixed(2)}</td>
                        <td class="p-2">${i.pdf_url ? '<a href="' + i.pdf_url + '" target="_blank" class="text-blue-600 hover:underline text-xs">View</a>' : '-'}</td>
                      </tr>
                    `).join('')}</tbody>
                  </table>
                `;
              } catch (err) {
                document.getElementById('items-content').innerHTML = '<div class="text-red-500">' + err.message + '</div>';
              }
            });
          });
        } catch (err) {
          document.getElementById('loading').textContent = '';
          document.getElementById('alert').innerHTML = '<div class="bg-red-100 text-red-700 p-3 rounded text-sm">' + err.message + '</div>';
        }
      }

      window.closeItems = function() { document.getElementById('items-modal').classList.add('hidden'); };

      await loadOrders();
    });
  </script>
<script src="../js/analytics-tracker.js" defer></script>
</body>
</html>
