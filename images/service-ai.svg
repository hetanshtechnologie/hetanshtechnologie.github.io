<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#faf5ff"/>
  <!-- Brain/AI representation -->
  <g transform="translate(300, 180)">
    <!-- Brain circles -->
    <circle cx="-50" cy="-30" r="30" fill="#8b5cf6" opacity="0.6"/>
    <circle cx="50" cy="-30" r="30" fill="#8b5cf6" opacity="0.6"/>
    <circle cx="0" cy="20" r="35" fill="#8b5cf6" opacity="0.8"/>
    <!-- Neural connections -->
    <line x1="-50" y1="-30" x2="0" y2="20" stroke="#8b5cf6" stroke-width="3"/>
    <line x1="50" y1="-30" x2="0" y2="20" stroke="#8b5cf6" stroke-width="3"/>
    <line x1="-50" y1="-30" x2="50" y2="-30" stroke="#8b5cf6" stroke-width="3"/>
    <!-- Pulse effect -->
    <circle cx="0" cy="20" r="45" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.3">
      <animate attributeName="r" from="35" to="55" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.3" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- AI Tools -->
  <g transform="translate(120, 300)">
    <rect x="0" y="0" width="100" height="40" rx="8" fill="#10b981"/>
    <text x="50" y="27" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">LLM</text>
  </g>
  <g transform="translate(250, 300)">
    <rect x="0" y="0" width="100" height="40" rx="8" fill="#3b82f6"/>
    <text x="50" y="27" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">LangChain</text>
  </g>
  <g transform="translate(380, 300)">
    <rect x="0" y="0" width="120" height="40" rx="8" fill="#f59e0b"/>
    <text x="60" y="27" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Copilot SDK</text>
  </g>
  <!-- Lightbulb icon -->
  <g transform="translate(300, 80)">
    <circle cx="0" cy="0" r="25" fill="#fbbf24" opacity="0.3"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="28" fill="#f59e0b" text-anchor="middle">💡</text>
  </g>
</svg>
