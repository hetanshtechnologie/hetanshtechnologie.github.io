<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#f0fdf4"/>
  <!-- Cloud icons -->
  <g transform="translate(150, 150)">
    <ellipse cx="0" cy="0" rx="60" ry="40" fill="#3b82f6" opacity="0.3"/>
    <ellipse cx="-20" cy="-15" rx="35" ry="25" fill="#3b82f6" opacity="0.4"/>
    <ellipse cx="20" cy="-20" rx="30" ry="20" fill="#3b82f6" opacity="0.4"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Azure</text>
  </g>
  <g transform="translate(300, 150)">
    <ellipse cx="0" cy="0" rx="60" ry="40" fill="#f59e0b" opacity="0.3"/>
    <ellipse cx="-20" cy="-15" rx="35" ry="25" fill="#f59e0b" opacity="0.4"/>
    <ellipse cx="20" cy="-20" rx="30" ry="20" fill="#f59e0b" opacity="0.4"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">AWS</text>
  </g>
  <g transform="translate(450, 150)">
    <ellipse cx="0" cy="0" rx="60" ry="40" fill="#ef4444" opacity="0.3"/>
    <ellipse cx="-20" cy="-15" rx="35" ry="25" fill="#ef4444" opacity="0.4"/>
    <ellipse cx="20" cy="-20" rx="30" ry="20" fill="#ef4444" opacity="0.4"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">GCP</text>
  </g>
  <!-- Kubernetes symbol -->
  <g transform="translate(300, 300)">
    <circle cx="0" cy="0" r="40" fill="#326ce5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">K</text>
    <text x="0" y="55" font-family="Arial, sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">Kubernetes</text>
  </g>
  <!-- Connection lines -->
  <line x1="210" y1="150" x2="240" y2="150" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="360" y1="150" x2="390" y2="150" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5,5"/>
  <!-- Docker container -->
  <rect x="220" y="250" width="160" height="30" rx="5" fill="#2496ed" opacity="0.2"/>
  <text x="300" y="270" font-family="Arial, sans-serif" font-size="14" fill="#2496ed" text-anchor="middle">Docker Containers</text>
</svg>
