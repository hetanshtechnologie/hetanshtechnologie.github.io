<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="300" height="100" fill="white"/>
  <!-- Logo Icon - Stylized S -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="60" height="60" rx="12" fill="url(#blueGrad)"/>
    <text x="30" y="42" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">S</text>
  </g>
  <!-- Company Name -->
  <text x="95" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1f2937">HetanshTechnologie</text>
  <text x="95" y="75" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2563eb">IT Eng</text>
</svg>
