<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <!-- Decorative tech patterns -->
  <g opacity="0.1">
    <!-- Grid pattern -->
    <line x1="0" y1="200" x2="1920" y2="200" stroke="#2563eb" stroke-width="2"/>
    <line x1="0" y1="400" x2="1920" y2="400" stroke="#2563eb" stroke-width="2"/>
    <line x1="0" y1="600" x2="1920" y2="600" stroke="#2563eb" stroke-width="2"/>
    <line x1="0" y1="800" x2="1920" y2="800" stroke="#2563eb" stroke-width="2"/>
    <line x1="400" y1="0" x2="400" y2="1080" stroke="#2563eb" stroke-width="2"/>
    <line x1="800" y1="0" x2="800" y2="1080" stroke="#2563eb" stroke-width="2"/>
    <line x1="1200" y1="0" x2="1200" y2="1080" stroke="#2563eb" stroke-width="2"/>
    <line x1="1600" y1="0" x2="1600" y2="1080" stroke="#2563eb" stroke-width="2"/>
  </g>
  <!-- Large circle decoration -->
  <circle cx="1600" cy="300" r="300" fill="rgba(37, 99, 235, 0.05)"/>
  <circle cx="1600" cy="300" r="200" fill="rgba(37, 99, 235, 0.08)"/>
  <!-- Binary code decoration -->
  <g font-family="monospace" font-size="18" fill="rgba(37, 99, 235, 0.15)">
    <text x="100" y="150">10110101 01001010 11100010</text>
    <text x="100" y="350">01010101 10101010 01010101</text>
    <text x="100" y="550">11110000 10101010 11111111</text>
    <text x="100" y="750">00001111 01010101 10101010</text>
    <text x="100" y="950">11001100 10101010 01010101</text>
  </g>
</svg>
