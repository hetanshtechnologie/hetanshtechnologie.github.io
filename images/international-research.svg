<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <!-- Decorative atomic structure -->
  <g transform="translate(300, 200)">
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="15" fill="white"/>
    <circle cx="0" cy="0" r="8" fill="#60a5fa"/>
    <!-- Orbits -->
    <ellipse cx="0" cy="0" rx="80" ry="30" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="80" ry="30" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="80" ry="30" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" transform="rotate(120)"/>
    <!-- Electrons -->
    <circle cx="80" cy="0" r="5" fill="white"/>
    <circle cx="40" cy="26" r="5" fill="white"/>
    <circle cx="-40" cy="26" r="5" fill="white"/>
  </g>
  <!-- Text -->
  <text x="300" y="80" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">International Research</text>
  <text x="300" y="130" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.9)" text-anchor="middle">Multi-Nation Collaboration</text>
  <!-- International collaboration icons -->
  <g transform="translate(150, 320)">
    <circle cx="0" cy="0" r="20" fill="rgba(255,255,255,0.2)"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">FR</text>
  </g>
  <g transform="translate(220, 320)">
    <circle cx="0" cy="0" r="20" fill="rgba(255,255,255,0.2)"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">EU</text>
  </g>
  <g transform="translate(290, 320)">
    <circle cx="0" cy="0" r="20" fill="rgba(255,255,255,0.2)"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">US</text>
  </g>
  <g transform="translate(360, 320)">
    <circle cx="0" cy="0" r="20" fill="rgba(255,255,255,0.2)"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">IN</text>
  </g>
  <g transform="translate(430, 320)">
    <circle cx="0" cy="0" r="20" fill="rgba(255,255,255,0.2)"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">JP</text>
  </g>
</svg>
