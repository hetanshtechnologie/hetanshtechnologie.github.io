<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <!-- Diamond icon -->
  <g transform="translate(300, 170)">
    <polygon points="0,-50 35,-15 0,60 -35,-15" fill="rgba(255,255,255,0.95)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <polygon points="0,-50 35,-15 0,-15 -35,-15" fill="rgba(255,255,255,0.6)"/>
    <line x1="0" y1="-50" x2="0" y2="60" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <line x1="-35" y1="-15" x2="35" y2="-15" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  </g>
  <!-- Ring representation -->
  <g transform="translate(300, 240)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="6"/>
    <circle cx="0" cy="-25" r="8" fill="rgba(255,255,255,0.9)"/>
  </g>
  <!-- Sparkles -->
  <g opacity="0.6">
    <text x="230" y="150" font-family="Arial, sans-serif" font-size="20" fill="white">✦</text>
    <text x="360" y="140" font-family="Arial, sans-serif" font-size="16" fill="white">✦</text>
    <text x="200" y="220" font-family="Arial, sans-serif" font-size="14" fill="white">✦</text>
    <text x="390" y="210" font-family="Arial, sans-serif" font-size="18" fill="white">✦</text>
  </g>
  <!-- Text -->
  <text x="300" y="80" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="white" text-anchor="middle">Ornate Jewels</text>
  <text x="300" y="120" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.9)" text-anchor="middle">Premium Jewellery Store</text>
  <!-- Product categories -->
  <g transform="translate(130, 320)">
    <rect x="-40" y="-15" width="80" height="30" rx="15" fill="rgba(255,255,255,0.2)"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Gold</text>
  </g>
  <g transform="translate(230, 320)">
    <rect x="-40" y="-15" width="80" height="30" rx="15" fill="rgba(255,255,255,0.2)"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Diamond</text>
  </g>
  <g transform="translate(330, 320)">
    <rect x="-45" y="-15" width="90" height="30" rx="15" fill="rgba(255,255,255,0.2)"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Silver</text>
  </g>
  <g transform="translate(440, 320)">
    <rect x="-45" y="-15" width="90" height="30" rx="15" fill="rgba(255,255,255,0.2)"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Bridal</text>
  </g>
  <!-- Tech badges -->
  <rect x="180" y="360" width="80" height="25" rx="12" fill="rgba(255,255,255,0.2)"/>
  <text x="220" y="377" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">HTML/CSS</text>
  <rect x="270" y="360" width="80" height="25" rx="12" fill="rgba(255,255,255,0.2)"/>
  <text x="310" y="377" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">Bootstrap</text>
  <rect x="360" y="360" width="80" height="25" rx="12" fill="rgba(255,255,255,0.2)"/>
  <text x="400" y="377" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">JavaScript</text>
</svg>
