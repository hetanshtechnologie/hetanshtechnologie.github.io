<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <!-- Decorative circles -->
  <circle cx="1000" cy="100" r="150" fill="rgba(255,255,255,0.1)"/>
  <circle cx="200" cy="500" r="120" fill="rgba(255,255,255,0.08)"/>
  <circle cx="1100" cy="500" r="100" fill="rgba(255,255,255,0.05)"/>
  <!-- Logo -->
  <g transform="translate(500, 200)">
    <rect x="0" y="0" width="100" height="100" rx="20" fill="url(#blueGrad)"/>
    <text x="50" y="68" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="white" text-anchor="middle">S</text>
  </g>
  <!-- Company Name -->
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="white" text-anchor="middle">Hetansh Technologie</text>
  <!-- Tagline -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.9)" text-anchor="middle">Innovative IT Solutions & Software Engineering</text>
  <!-- Services -->
  <text x="600" y="490" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.8)" text-anchor="middle">Cloud Solutions • AI Integration • Enterprise Architecture</text>
  <!-- Website -->
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.7)" text-anchor="middle">hetanshtechnologie.github.io</text>
</svg>
