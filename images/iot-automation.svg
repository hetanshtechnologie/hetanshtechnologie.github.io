<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <!-- Road -->
  <line x1="50" y1="300" x2="550" y2="300" stroke="rgba(255,255,255,0.3)" stroke-width="8" stroke-linecap="round"/>
  <line x1="50" y1="300" x2="550" y2="300" stroke="rgba(255,255,255,0.5)" stroke-width="4" stroke-dasharray="20,10"/>
  <!-- Vehicle representation -->
  <g transform="translate(200, 250)">
    <rect x="0" y="0" width="100" height="40" rx="8" fill="white"/>
    <rect x="5" y="5" width="20" height="15" rx="3" fill="#7c3aed"/>
    <rect x="30" y="5" width="20" height="15" rx="3" fill="#7c3aed"/>
    <rect x="55" y="5" width="20" height="15" rx="3" fill="#7c3aed"/>
    <rect x="80" y="5" width="15" height="15" rx="3" fill="#7c3aed"/>
    <circle cx="20" cy="42" r="8" fill="#1f2937"/>
    <circle cx="20" cy="42" r="4" fill="#60a5fa"/>
    <circle cx="80" cy="42" r="8" fill="#1f2937"/>
    <circle cx="80" cy="42" r="4" fill="#60a5fa"/>
  </g>
  <!-- IoT Sensors -->
  <g>
    <circle cx="150" cy="280" r="10" fill="#fbbf24"/>
    <text x="150" y="285" font-family="Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">●</text>
  </g>
  <g>
    <circle cx="300" cy="280" r="10" fill="#fbbf24"/>
    <text x="300" y="285" font-family="Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">●</text>
  </g>
  <g>
    <circle cx="450" cy="280" r="10" fill="#fbbf24"/>
    <text x="450" y="285" font-family="Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">●</text>
  </g>
  <!-- Signal waves -->
  <g opacity="0.4">
    <path d="M 150 270 Q 150 250 170 250" fill="none" stroke="white" stroke-width="2"/>
    <path d="M 150 270 Q 150 240 190 240" fill="none" stroke="white" stroke-width="2"/>
    <path d="M 300 270 Q 300 250 320 250" fill="none" stroke="white" stroke-width="2"/>
    <path d="M 300 270 Q 300 240 340 240" fill="none" stroke="white" stroke-width="2"/>
  </g>
  <!-- Text -->
  <text x="300" y="80" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white" text-anchor="middle">IoT Automation</text>
  <text x="300" y="130" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.9)" text-anchor="middle">Smart Infrastructure Solutions</text>
  <!-- Dashboard indication -->
  <rect x="400" y="150" width="150" height="80" rx="10" fill="rgba(255,255,255,0.15)"/>
  <text x="475" y="175" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="middle">Real-time</text>
  <text x="475" y="195" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Monitoring</text>
  <text x="475" y="215" font-family="Arial, sans-serif" font-size="12" fill="#34d399" text-anchor="middle">● Active</text>
</svg>
