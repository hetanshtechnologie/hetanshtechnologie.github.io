<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <!-- Church icon -->
  <g transform="translate(300, 160)">
    <!-- Building -->
    <rect x="-60" y="0" width="120" height="80" fill="rgba(255,255,255,0.9)" rx="5"/>
    <!-- Cross -->
    <rect x="-5" y="-30" width="10" height="40" fill="#dc2626"/>
    <rect x="-20" y="-20" width="40" height="10" fill="#dc2626"/>
    <!-- Door -->
    <rect x="-15" y="40" width="30" height="40" fill="#dc2626" rx="3"/>
    <!-- Windows -->
    <rect x="-45" y="20" width="20" height="20" rx="3" fill="#60a5fa"/>
    <rect x="25" y="20" width="20" height="20" rx="3" fill="#60a5fa"/>
  </g>
  <!-- Management icons -->
  <g transform="translate(150, 300)">
    <circle cx="0" cy="0" r="20" fill="rgba(255,255,255,0.2)"/>
  <text x="0" y="5" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">👥</text>
  <text x="0" y="35" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="middle">Users</text>
  </g>
  <g transform="translate(300, 300)">
    <circle cx="0" cy="0" r="20" fill="rgba(255,255,255,0.2)"/>
  <text x="0" y="5" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">💰</text>
  <text x="0" y="35" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="middle">Payments</text>
  </g>
  <g transform="translate(450, 300)">
    <circle cx="0" cy="0" r="20" fill="rgba(255,255,255,0.2)"/>
  <text x="0" y="5" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">📅</text>
  <text x="0" y="35" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="middle">Scheduling</text>
  </g>
  <!-- Text -->
  <text x="300" y="80" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="white" text-anchor="middle">Church Management</text>
  <text x="300" y="130" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.9)" text-anchor="middle">SaaS Platform</text>
  <!-- Tech stack -->
  <rect x="200" y="350" width="70" height="25" rx="12" fill="rgba(255,255,255,0.2)"/>
  <text x="235" y="367" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">React</text>
  <rect x="280" y="350" width="70" height="25" rx="12" fill="rgba(255,255,255,0.2)"/>
  <text x="315" y="367" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">Node.js</text>
  <rect x="360" y="350" width="70" height="25" rx="12" fill="rgba(255,255,255,0.2)"/>
  <text x="395" y="367" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">MongoDB</text>
</svg>
