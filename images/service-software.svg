<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#f0f9ff"/>
  <!-- Code brackets -->
  <text x="100" y="200" font-family="monospace" font-size="120" fill="#3b82f6" opacity="0.3">&lt;/&gt;</text>
  <!-- Monitor -->
  <g transform="translate(300, 200)">
    <rect x="-120" y="-80" width="240" height="140" rx="10" fill="#1f2937"/>
    <rect x="-110" y="-70" width="220" height="100" rx="5" fill="#3b82f6"/>
    <!-- Code lines -->
    <rect x="-90" y="-50" width="80" height="8" rx="4" fill="white" opacity="0.8"/>
    <rect x="-90" y="-35" width="120" height="8" rx="4" fill="white" opacity="0.6"/>
    <rect x="-90" y="-20" width="60" height="8" rx="4" fill="white" opacity="0.8"/>
    <rect x="-90" y="-5" width="100" height="8" rx="4" fill="white" opacity="0.6"/>
    <rect x="-90" y="10" width="70" height="8" rx="4" fill="white" opacity="0.8"/>
    <rect x="-90" y="25" width="110" height="8" rx="4" fill="white" opacity="0.6"/>
    <!-- Stand -->
    <rect x="-30" y="60" width="60" height="20" fill="#1f2937"/>
    <rect x="-60" y="80" width="120" height="8" rx="4" fill="#1f2937"/>
  </g>
  <!-- Tech icons -->
  <circle cx="150" cy="320" r="25" fill="#3b82f6"/>
  <text x="150" y="328" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">.NET</text>
  <circle cx="250" cy="320" r="25" fill="#3b82f6"/>
  <text x="250" y="328" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Angular</text>
  <circle cx="350" cy="320" r="25" fill="#3b82f6"/>
  <text x="350" y="328" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">React</text>
  <circle cx="450" cy="320" r="25" fill="#3b82f6"/>
  <text x="450" y="328" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Node</text>
</svg>
