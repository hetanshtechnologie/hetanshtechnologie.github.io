<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <!-- Medical cross -->
  <g transform="translate(300, 180)">
    <rect x="-10" y="-40" width="20" height="80" rx="3" fill="white"/>
    <rect x="-40" y="-10" width="80" height="20" rx="3" fill="white"/>
  </g>
  <!-- Data flow representation -->
  <g opacity="0.6">
    <!-- Server/Database -->
    <rect x="80" y="280" width="60" height="80" rx="5" fill="rgba(255,255,255,0.3)"/>
    <line x1="110" y1="280" x2="110" y2="250" stroke="white" stroke-width="3"/>
    <!-- Flow lines -->
    <line x1="110" y1="250" x2="300" y2="200" stroke="white" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="110" y1="250" x2="500" y2="280" stroke="white" stroke-width="2" stroke-dasharray="5,5"/>
    <!-- Patient icon -->
    <circle cx="500" cy="320" r="25" fill="rgba(255,255,255,0.3)"/>
    <text x="500" y="327" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle">P</text>
  </g>
  <!-- Text -->
  <text x="300" y="80" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">Healthcare SaaS</text>
  <text x="300" y="130" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.9)" text-anchor="middle">HL7 • CCDA • EDI Integration</text>
  <!-- Tech badges -->
  <rect x="180" y="340" width="80" height="30" rx="15" fill="rgba(255,255,255,0.2)"/>
  <text x="220" y="360" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">.NET Core</text>
  <rect x="270" y="340" width="80" height="30" rx="15" fill="rgba(255,255,255,0.2)"/>
  <text x="310" y="360" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Angular</text>
  <rect x="360" y="340" width="80" height="30" rx="15" fill="rgba(255,255,255,0.2)"/>
  <text x="400" y="360" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">SQL</text>
</svg>
