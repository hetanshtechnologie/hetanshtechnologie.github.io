name: Save Contact Form to Supabase

on:
  workflow_dispatch:        # manual trigger
  repository_dispatch:      # trigger from your static site via GitHub API
    types: [contact_form]

jobs:
  save-contact:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase REST API
        run: |
          curl -X POST "https://vgipghqejzbcoighktij.supabase.co/rest/v1/contact" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"name":"${{ github.event.client_payload.name }}",
                 "email":"${{ github.event.client_payload.email }}",
                 "phone":"${{ github.event.client_payload.phone }}",
                 "service":"${{ github.event.client_payload.service }}",
                 "message":"${{ github.event.client_payload.message }}"}'
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
