name: Build Password Vault binaries

# PyInstaller cannot cross-compile, so each platform has to be built on a runner
# that matches the target OS. This workflow produces all three and attaches them
# to a draft release, which index.html links to.
on:
  workflow_dispatch:      # manual trigger - use this the first time
  push:
    paths:
      - "password-generator/desktop/**"
      - ".github/workflows/build-desktop.yml"
  schedule:
    # Rebuild monthly so dependency updates do not leave stale binaries, and so
    # the links keep working if the release is ever deleted.
    - cron: "0 4 1 * *"

permissions:
  contents: write          # needed to create the release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            asset: PasswordVault-windows-x64.exe
            artifact: windows
          - os: ubuntu-22.04
            name: linux-x64
            asset: PasswordVault-linux-x64
            artifact: linux
          - os: macos-13          # Intel; macos-14 is arm64
            name: macos-x64
            asset: PasswordVault-macos-x64
            artifact: macos

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller cryptography

      - name: Run logic tests
        shell: bash
        run: |
          cd password-generator/desktop
          python test_pwvault.py

      - name: Run GUI tests
        # Informational, not a gate. The headless suite above is the hard gate;
        # this one needs a real window, which is available on Linux via xvfb but
        # is unreliable on Windows and macOS runners. A runner without a display
        # must not be able to block a release.
        continue-on-error: true
        shell: bash
        run: |
          cd password-generator/desktop
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
            xvfb-run -a python test_pwvault_gui.py
          else
            echo "Skipped: GUI suite only runs on the Linux runner."
          fi

      - name: Build binary
        shell: bash
        run: |
          cd password-generator/desktop
          python -m PyInstaller --clean --noconfirm PasswordVault.spec

      - name: Collect artifact
        shell: bash
        run: |
          cd password-generator/desktop
          mkdir -p staged
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/PasswordVault.exe "staged/${{ matrix.asset }}"
          else
            chmod +x dist/PasswordVault
            cp dist/PasswordVault "staged/${{ matrix.asset }}"
          fi
          cp pwvault.py "staged/pwvault-source.py"
          ls -la staged

      - uses: actions/upload-artifact@v4
        with:
          name: pwvault-${{ matrix.artifact }}
          path: password-generator/desktop/staged/
          if-no-files-found: error

  release:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    # Manual runs and the monthly refresh create the release. Ordinary pushes
    # only build and upload artifacts, so a small edit does not spawn a release.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
      - name: Assemble release assets
        run: |
          mkdir -p release-assets
          cp all/pwvault-windows/* release-assets/ 2>/dev/null || true
          cp all/pwvault-linux/*   release-assets/ 2>/dev/null || true
          cp all/pwvault-macos/*   release-assets/ 2>/dev/null || true
          # One canonical source file, not three copies of the same thing.
          cp all/pwvault-linux/pwvault-source.py release-assets/pwvault.py || true
          ls -la release-assets
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vault-v1.0.0
          name: Password Vault 1.0.0
          draft: true
          body: |
            Cross-platform builds for the Hetansh Password Vault.

            - `PasswordVault-windows-x64.exe` - Windows 10/11
            - `PasswordVault-linux-x64` - Linux x86_64, needs `chmod +x`
            - `PasswordVault-macos-x64` - Intel macOS
            - `pwvault.py` - the open-source single-file source

            The binaries are not code-signed, so macOS Gatekeeper and Windows
            SmartScreen will warn on first run.

            Linux and macOS binaries are produced by
            `.github/workflows/build-desktop.yml` because PyInstaller cannot
            cross-compile.
          files: release-assets/*
