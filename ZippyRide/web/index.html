<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZippyRide — Admin Dashboard</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h2>ZippyRide</h2>
      <span class="badge">Admin</span>
    </div>
    <nav>
      <a class="nav-item" href="../../index.html">🏠 Home</a>
      <a class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">📊 Dashboard</a>
      <a class="nav-item" data-page="drivers" onclick="navigate('drivers')">🚗 Drivers</a>
      <a class="nav-item" data-page="riders" onclick="navigate('riders')">👤 Riders</a>
      <a class="nav-item" data-page="trips" onclick="navigate('trips')">📍 Trips</a>
      <a class="nav-item" data-page="payments" onclick="navigate('payments')">💰 Payments</a>
      <a class="nav-item" data-page="tickets" onclick="navigate('tickets')">🎫 Support</a>
      <a class="nav-item" data-page="settings" onclick="navigate('settings')">⚙️ Settings</a>
    </nav>
    <div class="sidebar-footer">
      <span id="admin-name">Admin</span>
      <button class="btn btn-sm btn-outline" onclick="logout()">Logout</button>
    </div>
  </aside>

  <!-- Main Content -->
  <main id="main">
    <header class="main-header">
      <button id="menu-toggle" class="btn btn-sm" onclick="toggleSidebar()">☰</button>
      <h1 id="page-title">Dashboard</h1>
      <div class="header-right">
        <span id="live-indicator" class="live-dot">● Live</span>
      </div>
    </header>

    <div id="page-content"></div>
  </main>
</div>

<!-- Login Overlay -->
<div id="login-overlay">
  <div id="login-box">
    <h2>ZippyRide Admin</h2>
    <p id="login-subtitle">Sign in to manage your fleet</p>
    <div id="login-error" class="error-text"></div>
    <input type="email" id="login-email" placeholder="admin@email.com" autocomplete="email">
    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
    <button class="btn btn-primary btn-block" id="login-btn" onclick="login()">Sign In</button>
    <p id="login-toggle" class="login-hint" style="cursor:pointer;color:#4fc3f7;margin-top:12px" onclick="toggleLoginMode()">First time? Create admin account</p>
  </div>
</div>

<script src="js/supabase.js"></script>
<script src="js/admin.js"></script>
<script src="js/charts.js"></script>
<script src="../../js/analytics-tracker.js" defer></script>
</body>
</html>
